<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/inward/inward_reports.xhtml">
            <ui:define name="subcontent">
                <h:form id="frm">

                    <style>
                        @media screen {
                            .printOnlyReport { display: none; }
                        }
                        @media print {
                            @page { size: A4 portrait; margin: 10mm 8mm 12mm 8mm; }
                            .printOnlyReport {
                                display: block;
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 9px;
                                color: #000;
                                -webkit-print-color-adjust: exact;
                                print-color-adjust: exact;
                            }
                            .printOnlyReport .printHead {
                                text-align: center;
                                border-bottom: 2px solid #000;
                                padding-bottom: 4px;
                                margin-bottom: 6px;
                            }
                            .printOnlyReport .printInstitution {
                                font-size: 15px;
                                font-weight: bold;
                                text-transform: uppercase;
                                letter-spacing: 0.5px;
                            }
                            .printOnlyReport .printDepartment { font-size: 10px; margin-top: 1px; }
                            .printOnlyReport .printTitle {
                                text-align: center;
                                font-size: 12px;
                                font-weight: bold;
                                text-transform: uppercase;
                                margin: 4px 0 6px 0;
                            }
                            .printOnlyReport .printFilters {
                                width: 100%;
                                border: 1px solid #999;
                                border-collapse: collapse;
                                margin-bottom: 8px;
                                font-size: 9px;
                            }
                            .printOnlyReport .printFilters td {
                                border: none;
                                padding: 2px 6px;
                                vertical-align: top;
                            }
                            .printOnlyReport .printFilters .lbl {
                                font-weight: bold;
                                white-space: nowrap;
                                width: 1%;
                            }
                            .printOnlyReport .printData {
                                width: 100%;
                                box-sizing: border-box;
                                border-collapse: collapse;
                                font-size: 9px;
                            }
                            .printOnlyReport .printData thead { display: table-header-group; }
                            .printOnlyReport .printData tfoot { display: table-row-group; }
                            .printOnlyReport .printData tr { page-break-inside: avoid; }
                            .printOnlyReport .printData th,
                            .printOnlyReport .printData td {
                                border: 1px solid #777;
                                padding: 3px 4px;
                                text-align: left;
                                vertical-align: top;
                                overflow-wrap: anywhere;
                            }
                            .printOnlyReport .printData th {
                                background-color: #d9d9d9;
                                font-weight: bold;
                                border-color: #000;
                                vertical-align: bottom;
                            }
                            .printOnlyReport .printData tbody tr:nth-child(even) td { background-color: #f3f3f3; }
                            .printOnlyReport .printData tfoot td {
                                font-weight: bold;
                                background-color: #e6e6e6;
                                border-top: 2px solid #000;
                                border-bottom: 3px double #000;
                            }
                            .printOnlyReport .num { text-align: right !important; white-space: nowrap; }
                            .printOnlyReport .nowrap { white-space: nowrap; }
                            .printOnlyReport .center { text-align: center !important; }
                            .printOnlyReport .printFooter {
                                display: flex;
                                justify-content: space-between;
                                margin-top: 6px;
                                padding-top: 3px;
                                border-top: 1px solid #999;
                                font-size: 8px;
                                color: #333;
                                page-break-inside: avoid;
                            }
                        }
                    </style>

                    <p:panel header="Inpatient Credit Company Commitment Report" class="m-1">

                        <h:panelGrid columns="8" styleClass="w-100 form-grid" columnClasses="label-icon-column, input-column">

                            <!-- Row 1: From | To | Credit Company -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa ml-5" />
                                <h:outputLabel value="From" for="fromDate" class="mx-3"/>
                            </h:panelGroup>
                            <p:calendar
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                id="fromDate"
                                value="#{inwardReportController1.fromDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa mr-2" />
                                <h:outputLabel value="To" for="toDate" class="mx-3"/>
                            </h:panelGroup>
                            <p:calendar
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                id="toDate"
                                value="#{inwardReportController1.toDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf19c;" styleClass="fa mr-2" />
                                <h:outputLabel value="Credit Company" for="cmbCc" class="mx-3"/>
                            </h:panelGroup>
                            <p:autoComplete
                                id="cmbCc"
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                value="#{inwardReportController1.institution}"
                                completeMethod="#{institutionController.completeCreditCompany}"
                                var="ccIns"
                                itemLabel="#{ccIns.name}"
                                itemValue="#{ccIns}"
                                forceSelection="true" />

                            <!-- Row 2: Date Basis -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf017;" styleClass="fa mr-2" />
                                <h:outputLabel value="Date Basis" for="dateBasisMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu id="dateBasisMenu" styleClass="w-100 form-control"
                                             value="#{inwardReportController1.dateBasis}">
                                <f:selectItem itemValue="createdAt"     itemLabel="Payment/Bill Date" />
                                <f:selectItem itemValue="dischargeDate" itemLabel="Discharge Date" />
                                <f:selectItem itemValue="admissionDate" itemLabel="Admission Date" />
                            </p:selectOneMenu>
                            <p:spacer width="50" />
                            <p:spacer width="50" />
                            <p:spacer width="50" />
                            <p:spacer width="50" />
                            <p:spacer width="50" />
                            <p:spacer width="50" />

                            <!-- Row 3: Institution | Site | Department -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf19c;" styleClass="fa mr-2" />
                                <h:outputLabel value="Institution" for="cmbIns" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="cmbIns"
                                styleClass="w-100 form-control"
                                value="#{inwardReportController1.admittingInstitution}"
                                filter="true">
                                <f:selectItem itemLabel="All Institutions" itemValue="#{null}" />
                                <f:selectItems value="#{institutionController.companies}" var="ins" itemLabel="#{ins.name}" itemValue="#{ins}" />
                                <p:ajax process="cmbIns" update="cmbDept" />
                            </p:selectOneMenu>

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf3c5;" styleClass="fa mr-2" />
                                <h:outputLabel value="Site" for="siteMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="siteMenu"
                                styleClass="w-100 form-control"
                                value="#{inwardReportController1.site}"
                                filter="true">
                                <f:selectItem itemLabel="All Sites" itemValue="#{null}" />
                                <f:selectItems value="#{institutionController.sites}" var="site" itemLabel="#{site.name}" itemValue="#{site}" />
                                <p:ajax process="siteMenu" update="cmbDept" />
                            </p:selectOneMenu>

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf0e8;" styleClass="fa mr-2" />
                                <h:outputLabel value="Department" for="cmbDept" class="mx-3"/>
                            </h:panelGroup>
                            <h:panelGroup id="cmbDept" layout="block">

                                <p:selectOneMenu
                                    rendered="#{inwardReportController1.admittingInstitution eq null and inwardReportController1.site eq null}"
                                    styleClass="w-100 form-control"
                                    value="#{inwardReportController1.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" itemValue="#{null}" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSite()}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                                <p:selectOneMenu
                                    rendered="#{inwardReportController1.admittingInstitution eq null and inwardReportController1.site ne null}"
                                    styleClass="w-100 form-control"
                                    value="#{inwardReportController1.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" itemValue="#{null}" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSite(inwardReportController1.site)}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                                <p:selectOneMenu
                                    rendered="#{inwardReportController1.admittingInstitution ne null and inwardReportController1.site eq null}"
                                    styleClass="w-100 form-control"
                                    value="#{inwardReportController1.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" itemValue="#{null}" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSiteForInstitution(inwardReportController1.admittingInstitution)}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                                <p:selectOneMenu
                                    rendered="#{inwardReportController1.admittingInstitution ne null and inwardReportController1.site ne null}"
                                    styleClass="w-100 form-control"
                                    value="#{inwardReportController1.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" itemValue="#{null}" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSite(inwardReportController1.admittingInstitution, inwardReportController1.site)}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                            </h:panelGroup>

                            <!-- Row 4: Admission Type | Payment Method -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf0f0;" styleClass="fa mr-2" />
                                <h:outputLabel value="Admission Type" for="admTypeMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="admTypeMenu"
                                styleClass="w-100 form-control"
                                value="#{inwardReportController1.admissionType}">
                                <f:selectItem itemLabel="All Admission Types" itemValue="#{null}" />
                                <f:selectItems
                                    value="#{admissionTypeController.items}"
                                    var="at"
                                    itemValue="#{at}"
                                    itemLabel="#{at.name}" />
                            </p:selectOneMenu>

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf09d;" styleClass="fa mr-2" />
                                <h:outputLabel value="Payment Method" for="pmMenuCommitment" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu id="pmMenuCommitment" styleClass="w-100 form-control"
                                             value="#{inwardReportController1.paymentMethod}">
                                <f:selectItem itemLabel="All Methods" itemValue="#{null}" />
                                <f:selectItems value="#{enumController.paymentMethodsWithoutCredit}" />
                            </p:selectOneMenu>

                        </h:panelGrid>

                        <p:commandButton
                            value="Process"
                            icon="fas fa-cogs"
                            action="#{inwardReportController1.inwardCreditCompanyCommitments()}"
                            ajax="false"
                            class="ui-button-warning m-1" />

                    </p:panel>

                    <p:panel id="pnlResults"
                             rendered="#{inwardReportController1.commitmentBills != null}">

                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center">
                                <h:outputText value="Inpatient Credit Company Commitments" />
                                <div>
                                    <p:commandButton value="Print"
                                                     icon="fas fa-print"
                                                     class="ui-button-info me-1"
                                                     ajax="false">
                                        <p:printer target="printReport" />
                                    </p:commandButton>
                                    <p:commandButton value="Excel"
                                                     icon="fas fa-file-excel"
                                                     class="ui-button-success"
                                                     action="#{inwardReportController1.downloadCreditCompanyCommitmentsExcel()}"
                                                     immediate="true"
                                                     ajax="false" />
                                    <p:commandButton value="PDF"
                                                     icon="fas fa-file-pdf"
                                                     class="ui-button-danger mx-1"
                                                     action="#{inwardReportController1.downloadCreditCompanyCommitmentsPdf()}"
                                                     immediate="true"
                                                     ajax="false" />
                                </div>
                            </div>
                        </f:facet>

                        <p:dataTable
                            id="tblReport"
                            value="#{inwardReportController1.commitmentBills}"
                            var="b"
                            rowIndexVar="i"
                            emptyMessage="No records found"
                            paginator="true"
                            rows="20"
                            paginatorAlwaysVisible="false"
                            paginatorPosition="bottom"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="10,20,50,{ShowAll|'All'}"
                            styleClass="w-100">

                            <f:facet name="header">
                                <h:outputText value="Inpatient Credit Company Commitment Report - " />
                                <h:outputText value="#{inwardReportController1.fromDate}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                </h:outputText>
                                <h:outputText value=" to " />
                                <h:outputText value="#{inwardReportController1.toDate}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                </h:outputText>
                            </f:facet>

                            <p:column headerText="No." style="width:4em; text-align:center;">
                                <h:outputText value="#{i + 1}" />
                            </p:column>

                            <p:column headerText="Final Bill No" style="white-space:nowrap;">
                                <h:outputText value="#{b.referenceBill.deptId}" rendered="#{b.referenceBill ne null}" />
                            </p:column>

                            <p:column headerText="BHT No" style="white-space:nowrap;">
                                <h:outputText value="#{b.patientEncounter.bhtNo}" />
                            </p:column>

                            <p:column headerText="Patient Name">
                                <h:outputText value="#{b.patient.person.name}" />
                            </p:column>

                            <p:column headerText="Date of Discharge" style="white-space:nowrap;">
                                <h:outputText value="#{b.patientEncounter.dateOfDischarge}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}" />
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Credit Company">
                                <h:outputText value="#{b.creditCompany.name}" />
                            </p:column>

                            <p:column headerText="Credit Company Commitment Value" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{b.netTotal}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{inwardReportController1.commitmentTotal}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Paid by Credit Company" style="text-align:right; white-space:nowrap;"
                                      rendered="#{configOptionApplicationController.getBooleanValueByKey('Credit Company Commitment Report - Show Paid and Remaining Columns', true)}">
                                <h:outputText value="#{inwardReportController1.getCommitmentPaid(b)}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{inwardReportController1.commitmentPaidTotal}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Remaining Commitment" style="text-align:right; white-space:nowrap;"
                                      rendered="#{configOptionApplicationController.getBooleanValueByKey('Credit Company Commitment Report - Show Paid and Remaining Columns', true)}">
                                <h:outputText value="#{inwardReportController1.getCommitmentBalance(b)}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{inwardReportController1.commitmentBalanceTotal}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                        </p:dataTable>

                        <!-- Print-only A4 view: all rows, no paginator -->
                        <ui:param name="showPaidCols" value="#{configOptionApplicationController.getBooleanValueByKey('Credit Company Commitment Report - Show Paid and Remaining Columns', true)}" />
                        <h:panelGroup layout="block" id="printReport" styleClass="printOnlyReport">
                            <div class="printHead">
                                <div class="printInstitution">
                                    <h:outputText value="#{sessionController.loggedUser.institution.name}" />
                                </div>
                            </div>
                            <div class="printTitle">Inpatient Credit Company Commitment Report</div>
                            <table class="printFilters">
                                <tr>
                                    <td class="lbl">Period</td>
                                    <td>
                                        <h:outputText value="#{inwardReportController1.fromDate}">
                                            <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                        </h:outputText>
                                        <h:outputText value=" &#8211; " />
                                        <h:outputText value="#{inwardReportController1.toDate}">
                                            <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                        </h:outputText>
                                    </td>
                                    <td class="lbl">Date Basis</td>
                                    <td>
                                        <h:outputText value="#{inwardReportController1.dateBasis eq 'dischargeDate' ? 'Discharge Date' : (inwardReportController1.dateBasis eq 'admissionDate' ? 'Admission Date' : 'Payment/Bill Date')}" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="lbl">Credit Company</td>
                                    <td><h:outputText value="#{inwardReportController1.institution ne null ? inwardReportController1.institution.name : 'All'}" /></td>
                                    <td class="lbl">Payment Method</td>
                                    <td><h:outputText value="#{inwardReportController1.paymentMethod ne null ? inwardReportController1.paymentMethod.label : 'All'}" /></td>
                                </tr>
                                <tr>
                                    <td class="lbl">Institution</td>
                                    <td><h:outputText value="#{inwardReportController1.admittingInstitution ne null ? inwardReportController1.admittingInstitution.name : 'All'}" /></td>
                                    <td class="lbl">Site</td>
                                    <td><h:outputText value="#{inwardReportController1.site ne null ? inwardReportController1.site.name : 'All'}" /></td>
                                </tr>
                                <tr>
                                    <td class="lbl">Department</td>
                                    <td><h:outputText value="#{inwardReportController1.department ne null ? inwardReportController1.department.name : 'All'}" /></td>
                                    <td class="lbl">Admission Type</td>
                                    <td><h:outputText value="#{inwardReportController1.admissionType ne null ? inwardReportController1.admissionType.name : 'All'}" /></td>
                                </tr>
                            </table>
                            <table class="printData">
                                <thead>
                                    <tr>
                                        <th class="center">No.</th>
                                        <th>Final Bill No</th>
                                        <th>BHT No</th>
                                        <th>Patient Name</th>
                                        <th>Discharged</th>
                                        <th>Credit Company</th>
                                        <th class="num">Commitment</th>
                                        <h:panelGroup rendered="#{showPaidCols}">
                                            <th class="num">Paid</th>
                                            <th class="num">Remaining</th>
                                        </h:panelGroup>
                                    </tr>
                                </thead>
                                <tbody>
                                    <ui:repeat value="#{inwardReportController1.commitmentBills}" var="pb" varStatus="st">
                                        <tr>
                                            <td class="center"><h:outputText value="#{st.index + 1}" /></td>
                                            <td class="nowrap"><h:outputText value="#{pb.referenceBill.deptId}" rendered="#{pb.referenceBill ne null}" /></td>
                                            <td class="nowrap"><h:outputText value="#{pb.patientEncounter.bhtNo}" /></td>
                                            <td><h:outputText value="#{pb.patient.person.name}" /></td>
                                            <td class="nowrap">
                                                <h:outputText value="#{pb.patientEncounter.dateOfDischarge}">
                                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}" />
                                                </h:outputText>
                                            </td>
                                            <td><h:outputText value="#{pb.creditCompany.name}" /></td>
                                            <td class="num">
                                                <h:outputText value="#{pb.netTotal}">
                                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                                </h:outputText>
                                            </td>
                                            <h:panelGroup rendered="#{showPaidCols}">
                                                <td class="num">
                                                    <h:outputText value="#{inwardReportController1.getCommitmentPaid(pb)}">
                                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                                    </h:outputText>
                                                </td>
                                                <td class="num">
                                                    <h:outputText value="#{inwardReportController1.getCommitmentBalance(pb)}">
                                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                                    </h:outputText>
                                                </td>
                                            </h:panelGroup>
                                        </tr>
                                    </ui:repeat>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="6" class="num">
                                            <h:outputText value="Total (#{inwardReportController1.commitmentBills.size()} records)" />
                                        </td>
                                        <td class="num">
                                            <h:outputText value="#{inwardReportController1.commitmentTotal}">
                                                <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                            </h:outputText>
                                        </td>
                                        <h:panelGroup rendered="#{showPaidCols}">
                                            <td class="num">
                                                <h:outputText value="#{inwardReportController1.commitmentPaidTotal}">
                                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                                </h:outputText>
                                            </td>
                                            <td class="num">
                                                <h:outputText value="#{inwardReportController1.commitmentBalanceTotal}">
                                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                                </h:outputText>
                                            </td>
                                        </h:panelGroup>
                                    </tr>
                                </tfoot>
                            </table>
                            <div class="printFooter">
                                <span>
                                    <h:outputText value="Printed by: #{sessionController.loggedUser.webUserPerson.name}" />
                                </span>
                                <span>
                                    <h:outputText value="Processed at: " />
                                    <h:outputText value="#{inwardReportController1.commitmentProcessedAt}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                    </h:outputText>
                                </span>
                            </div>
                        </h:panelGroup>

                    </p:panel>

                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
