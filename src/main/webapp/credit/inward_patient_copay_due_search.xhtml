<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/payments/credit_company_pay_index.xhtml">
            <ui:define name="admin">
                <h:form>
                    <p:panel>
                        <f:facet name="header">
                            <h:outputLabel value="INWARD PATIENT CO-PAYMENT DUE SEARCH"/>
                        </f:facet>
                    <h:panelGrid columns="8" styleClass="w-100" cellpadding="2">
                        <h:outputLabel value="From" for="fromDate"/>
                        <p:calendar id="fromDate" styleClass="w-100" inputStyleClass="w-100" value="#{creditCompanyDueController.fromDate}" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        <p:spacer width="20"/>
                        <h:outputLabel value="To" for="toDate"/>
                        <p:calendar id="toDate" styleClass="w-100" inputStyleClass="w-100" value="#{creditCompanyDueController.toDate}" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Date Basis" for="dateBasis"/>
                        <p:selectOneMenu id="dateBasis" styleClass="w-100" value="#{creditCompanyDueController.dateBasis}">
                            <f:selectItem itemValue="dischargeDate" itemLabel="Discharge Date"/>
                            <f:selectItem itemValue="admissionDate" itemLabel="Admission Date"/>
                        </p:selectOneMenu>
                        <h:outputLabel value="Admission Type" for="admType"/>
                        <p:selectOneMenu id="admType" styleClass="w-100" value="#{creditCompanyDueController.admissionType}">
                            <f:selectItem itemLabel="All Admission Types" itemValue="#{null}"/>
                            <f:selectItems value="#{admissionTypeController.items}" var="at" itemValue="#{at}" itemLabel="#{at.name}"/>
                        </p:selectOneMenu>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Site" for="cmbSite"/>
                        <p:selectOneMenu id="cmbSite" styleClass="w-100" value="#{creditCompanyDueController.site}" filter="true">
                            <f:selectItem itemLabel="All Sites" itemValue="#{null}"/>
                            <f:selectItems value="#{institutionController.sites}" var="dueSite" itemLabel="#{dueSite.name}" itemValue="#{dueSite}"/>
                        </p:selectOneMenu>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Department" for="cmbDept"/>
                        <p:selectOneMenu id="cmbDept" styleClass="w-100" value="#{creditCompanyDueController.department}" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="All Departments" itemValue="#{null}"/>
                            <f:selectItems value="#{departmentController.getDepartmentsOfInstitutionAndSite()}" var="d" itemLabel="#{d.name}" itemValue="#{d}"/>
                        </p:selectOneMenu>
                    </h:panelGrid>
                    <h:panelGroup layout="block" styleClass="my-2">
                        <p:commandButton id="btnProcess" value="Process" icon="fas fa-cogs" ajax="false" styleClass="ui-button-success m-1" action="#{creditCompanyDueController.createInwardPatientCopaymentDueSearch()}"/>
                        <p:commandButton value="Excel" icon="fas fa-file-excel" ajax="false" styleClass="ui-button-info m-1" title="Download as Excel"
                                         actionListener="#{creditCompanyDueController.createInwardPatientCopaymentDueSearch()}">
                            <p:dataExporter type="xlsx" target="lst" fileName="Inward_Patient_Copayment_Due"/>
                        </p:commandButton>
                        <p:commandButton value="Print" icon="fas fa-print" ajax="false" styleClass="ui-button-warning m-1" title="Print the table">
                            <p:printer target="lst"/>
                        </p:commandButton>
                        <p:commandButton value="PDF" icon="fas fa-file-pdf" ajax="false" styleClass="ui-button-danger m-1" title="Download as PDF"
                                         actionListener="#{creditCompanyDueController.createInwardPatientCopaymentDueSearch()}">
                            <p:dataExporter type="pdf" target="lst" fileName="Inward_Patient_Copayment_Due" options="#{creditCompanyDueController.pdfExportOptions}"/>
                        </p:commandButton>
                    </h:panelGroup>
                    <p:defaultCommand target="btnProcess"/>
                    <p:dataTable id="lst" widgetVar="lstWidget" value="#{creditCompanyDueController.patientEncounters}" var="pe" rowKey="#{pe.id}"
                                 styleClass="p-datatable-sm" paginator="true" rows="100" paginatorPosition="bottom"
                                 rowsPerPageTemplate="50,100,500" emptyMessage="No records found">
                        <f:facet name="header">
                            <h:outputText value="#{creditCompanyDueController.patientDueExportTitle}"/>
                        </f:facet>
                        <p:column headerText="BHT No" width="7em">
                            <h:outputText value="#{pe.bhtNo}"/>
                            <f:facet name="footer">
                                <h:outputText value="Grand Total"/>
                            </f:facet>
                        </p:column>
                        <p:column headerText="Patient Name" width="14em">
                            <h:outputText value="#{pe.patient.person.nameWithTitle}"/>
                        </p:column>
                        <p:column headerText="Admission Date" width="9em">
                            <h:outputText value="#{pe.dateOfAdmission}"><f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/></h:outputText>
                        </p:column>
                        <p:column headerText="Discharge Date" width="9em">
                            <h:outputText value="#{pe.dateOfDischarge}"><f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/></h:outputText>
                        </p:column>
                        <p:column headerText="CC Company" width="12em">
                            <h:outputText value="#{pe.creditCompany != null ? pe.creditCompany.name : 'Self-pay'}"/>
                        </p:column>
                        <p:column headerText="Final Bill Total" width="9em" styleClass="text-end">
                            <h:outputText value="#{pe.finalBill.netTotal}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <f:facet name="footer">
                                <h:outputText value="#{creditCompanyDueController.billed}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
                            </f:facet>
                        </p:column>
                        <p:column headerText="CC Committed" width="7em" styleClass="text-end">
                            <h:outputText value="#{creditCompanyDueController.getCcCommitted(pe)}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="CC Paid" width="7em" styleClass="text-end">
                            <h:outputText value="#{creditCompanyDueController.getCcPaid(pe)}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="CC Status" width="7em">
                            <h:outputText value="#{creditCompanyDueController.getPatientCcStatus(pe)}"/>
                        </p:column>
                        <p:column headerText="Patient Portion" width="7em" styleClass="text-end">
                            <h:outputText value="#{(pe.finalBill.netTotal - creditCompanyDueController.getCcCommitted(pe)) gt 0 ? pe.finalBill.netTotal - creditCompanyDueController.getCcCommitted(pe) : 0}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Patient Paid" width="7em" styleClass="text-end">
                            <h:outputText value="#{creditCompanyDueController.getPatientPaid(pe)}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <f:facet name="footer">
                                <h:outputText value="#{creditCompanyDueController.paidByPatient}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
                            </f:facet>
                        </p:column>
                        <p:column headerText="Patient Outstanding" width="9em" styleClass="text-end">
                            <h:outputText value="#{creditCompanyDueController.getPatientCopaymentDue(pe)}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <f:facet name="footer">
                                <h:outputText value="#{creditCompanyDueController.payableByPatient}"><f:convertNumber pattern="#,##0.00"/></h:outputText>
                            </f:facet>
                        </p:column>
                        <f:facet name="footer">
                            <h:outputText value="Printed By : #{sessionController.loggedUser.webUserPerson.name}"/>
                        </f:facet>
                    </p:dataTable>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
