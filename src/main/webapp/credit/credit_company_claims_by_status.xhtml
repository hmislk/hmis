<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/payments/credit_company_pay_index.xhtml">
            <ui:define name="admin">
                <h:form id="claimsByStatusForm">
                    <h:outputText value="You do not have privilege to view this report." rendered="#{not creditCompanyClaimReportController.reportsAllowed}"/>
                    <h:panelGroup rendered="#{creditCompanyClaimReportController.reportsAllowed}">
                        <p:panel header="Claims by Status">
                            <p:panelGrid columns="4" layout="tabular" styleClass="my-2 w-100">
                                <p:outputLabel for="fromDate" value="From Date (claim created)"/>
                                <p:calendar id="fromDate" styleClass="w-100" inputStyleClass="w-100"
                                            value="#{creditCompanyClaimReportController.fromDate}"
                                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                <p:outputLabel for="toDate" value="To Date (claim created)"/>
                                <p:calendar id="toDate" styleClass="w-100" inputStyleClass="w-100"
                                            value="#{creditCompanyClaimReportController.toDate}"
                                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                <p:outputLabel for="company" value="Credit Company"/>
                                <p:autoComplete id="company" styleClass="w-100" inputStyleClass="form-control"
                                                value="#{creditCompanyClaimReportController.filterCompany}"
                                                forceSelection="true"
                                                completeMethod="#{creditCompanyController.completeCredit}"
                                                var="ix" itemLabel="#{ix.name}" itemValue="#{ix}"
                                                placeholder="All companies"/>
                                <p:outputLabel for="status" value="Status"/>
                                <p:selectOneMenu id="status" styleClass="w-100"
                                                 value="#{creditCompanyClaimReportController.filterStatus}">
                                    <f:selectItem itemLabel="All statuses" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{creditCompanyClaimReportController.statuses}" var="s"
                                                   itemLabel="#{s.label}" itemValue="#{s}"/>
                                </p:selectOneMenu>
                            </p:panelGrid>
                            <h:panelGroup layout="block" styleClass="my-2">
                                <p:commandButton id="btnProcess" value="Process" icon="fas fa-cogs" styleClass="ui-button-warning m-1"
                                                 title="Run the report" ajax="false"
                                                 action="#{creditCompanyClaimReportController.searchClaimsByStatus}"/>
                                <p:commandButton value="Excel" icon="fas fa-file-excel" ajax="false" styleClass="ui-button-info m-1"
                                                 title="Download as Excel">
                                    <p:dataExporter type="xlsx" target="claimList" fileName="Claims_by_Status"/>
                                </p:commandButton>
                            </h:panelGroup>
                            <p:defaultCommand target="btnProcess"/>

                            <p:dataTable id="claimList" rowKey="#{r.id}" value="#{creditCompanyClaimReportController.statusRows}" var="r"
                                         styleClass="p-datatable-sm" emptyMessage="No claims found">
                                <p:column headerText="Claim No">
                                    <h:outputText value="#{r.claimNo}"/>
                                    <f:facet name="footer"><h:outputText value="Total (excluding cancelled claims)"/></f:facet>
                                </p:column>
                                <p:column headerText="Credit Company">
                                    <h:outputText value="#{r.companyName}"/>
                                </p:column>
                                <p:column headerText="Department">
                                    <h:outputText value="#{r.departmentName}"/>
                                </p:column>
                                <p:column headerText="Created">
                                    <h:outputText value="#{r.createdAt}">
                                        <f:convertDateTime pattern="yyyy MM dd"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Submitted">
                                    <h:outputText value="#{r.submittedAt}">
                                        <f:convertDateTime pattern="yyyy MM dd"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Status">
                                    <h:outputText value="#{r.status.label}"/>
                                </p:column>
                                <p:column headerText="Resubmits" styleClass="text-end">
                                    <h:outputText value="#{r.resubmitCount}"/>
                                </p:column>
                                <p:column headerText="Claimed" styleClass="text-end">
                                    <h:outputText value="#{r.claimedTotal}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputText>
                                    <f:facet name="footer">
                                        <h:outputText value="#{creditCompanyClaimReportController.totalClaimed}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Outstanding" styleClass="text-end">
                                    <h:outputText value="#{r.outstanding}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputText>
                                    <f:facet name="footer">
                                        <h:outputText value="#{creditCompanyClaimReportController.totalOutstanding}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Received / closed" styleClass="text-end">
                                    <h:outputText value="#{r.receivedOrClosed}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputText>
                                    <f:facet name="footer">
                                        <h:outputText value="#{creditCompanyClaimReportController.totalReceivedOrClosed}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </f:facet>
                                </p:column>
                            </p:dataTable>
                        </p:panel>
                    </h:panelGroup>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
