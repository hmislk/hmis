<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/payments/credit_company_pay_index.xhtml">
            <ui:define name="admin">
                <h:form>
                    <p:panel class="my-2">
                        <f:facet name="header">
                            <h:outputLabel value="INWARD PATIENT CO-PAYMENT DUE AGE"/>
                        </f:facet>
                    <h:panelGrid columns="8" styleClass="w-100" cellpadding="2">
                        <h:outputLabel value="From" for="fromDate"/>
                        <p:calendar id="fromDate" styleClass="w-100" inputStyleClass="w-100" value="#{creditCompanyDueController.fromDate}" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        <p:spacer width="20"/>
                        <h:outputLabel value="To" for="toDate"/>
                        <p:calendar id="toDate" styleClass="w-100" inputStyleClass="w-100" value="#{creditCompanyDueController.toDate}" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Date Basis" for="dateBasis"/>
                        <p:selectOneMenu id="dateBasis" styleClass="w-100" value="#{creditCompanyDueController.dateBasis}">
                            <f:selectItem itemValue="dischargeDate" itemLabel="Discharge Date"/>
                            <f:selectItem itemValue="admissionDate" itemLabel="Admission Date"/>
                        </p:selectOneMenu>
                        <h:outputLabel value="Admission Type" for="admType"/>
                        <p:selectOneMenu id="admType" styleClass="w-100" value="#{creditCompanyDueController.admissionType}">
                            <f:selectItem itemLabel="All Admission Types" itemValue="#{null}"/>
                            <f:selectItems value="#{admissionTypeController.items}" var="at" itemValue="#{at}" itemLabel="#{at.name}"/>
                        </p:selectOneMenu>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Site" for="cmbSite"/>
                        <p:selectOneMenu id="cmbSite" styleClass="w-100" value="#{creditCompanyDueController.site}" filter="true">
                            <f:selectItem itemLabel="All Sites" itemValue="#{null}"/>
                            <f:selectItems value="#{institutionController.sites}" var="dueSite" itemLabel="#{dueSite.name}" itemValue="#{dueSite}"/>
                        </p:selectOneMenu>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Department" for="cmbDept"/>
                        <p:selectOneMenu id="cmbDept" styleClass="w-100" value="#{creditCompanyDueController.department}" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="All Departments" itemValue="#{null}"/>
                            <f:selectItems value="#{departmentController.getDepartmentsOfInstitutionAndSite()}" var="d" itemLabel="#{d.name}" itemValue="#{d}"/>
                        </p:selectOneMenu>
                    </h:panelGrid>
                    <h:panelGroup layout="block" styleClass="my-2">
                        <p:commandButton id="btnProcess" value="Process Due Age" icon="fas fa-cogs" ajax="false" styleClass="ui-button-success m-1" action="#{creditCompanyDueController.createInwardPatientCopaymentDueAge()}"/>
                        <p:commandButton value="Excel" icon="fas fa-file-excel" ajax="false" styleClass="ui-button-info m-1" title="Download as Excel">
                            <p:dataExporter type="xlsx" target="lst" fileName="Inward_Patient_Copayment_Due_Age"/>
                        </p:commandButton>
                        <p:commandButton value="Print" icon="fas fa-print" ajax="false" styleClass="ui-button-warning m-1" title="Print the table">
                            <p:printer target="lst"/>
                        </p:commandButton>
                        <p:commandButton value="PDF" icon="fas fa-file-pdf" ajax="false" styleClass="ui-button-danger m-1" title="Download as PDF">
                            <p:dataExporter type="pdf" target="lst" fileName="Inward_Patient_Copayment_Due_Age"/>
                        </p:commandButton>
                    </h:panelGroup>
                    <p:defaultCommand target="btnProcess"/>
                    <p:remoteCommand name="refreshAgeTotals" process="@this" update="lst:ageTotal1 lst:ageTotal2 lst:ageTotal3 lst:ageTotal4"/>
                    <p:dataTable id="lst" widgetVar="lstWidget" value="#{creditCompanyDueController.creditCompanyAge}" var="row" rowKey="#{row.string}"
                                 filteredValue="#{creditCompanyDueController.filteredList}"
                                 styleClass="p-datatable-sm" paginator="true" rows="100" paginatorPosition="bottom"
                                 rowsPerPageTemplate="50,100,500" emptyMessage="No records found">
                        <p:ajax event="filter" process="@this" oncomplete="refreshAgeTotals()"/>
                        <f:facet name="header">
                            <h:outputText value="Inward Patient Co-payment Due Age (days since discharge)"/>
                        </f:facet>
                        <p:column headerText="BHT - Patient Name" width="30em" filterBy="#{row.string}" filterMatchMode="contains">
                            <h:outputText value="#{row.string}"/>
                            <f:facet name="footer"><h:outputText value="Total"/></f:facet>
                        </p:column>
                        <p:column headerText="0-30" width="7em" styleClass="text-end">
                            <h:outputText value="#{row.value1}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <f:facet name="footer">
                                <h:outputText id="ageTotal1" value="#{creditCompanyDueController.creditCompanyAgeTotal1}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                        </p:column>
                        <p:column headerText="31-60" width="7em" styleClass="text-end">
                            <h:outputText value="#{row.value2}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <f:facet name="footer">
                                <h:outputText id="ageTotal2" value="#{creditCompanyDueController.creditCompanyAgeTotal2}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                        </p:column>
                        <p:column headerText="61-90" width="7em" styleClass="text-end">
                            <h:outputText value="#{row.value3}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <f:facet name="footer">
                                <h:outputText id="ageTotal3" value="#{creditCompanyDueController.creditCompanyAgeTotal3}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                        </p:column>
                        <p:column headerText="91+" width="7em" styleClass="text-end">
                            <h:outputText value="#{row.value4}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <f:facet name="footer">
                                <h:outputText id="ageTotal4" value="#{creditCompanyDueController.creditCompanyAgeTotal4}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </f:facet>
                        </p:column>
                    </p:dataTable>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
