<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      >

    <h:body>
        <ui:composition template="/payments/credit_company_pay_index.xhtml">
            <ui:define name="admin">
                <h:form><p:panel>
                        <f:facet name="header">
                            <h:outputLabel value="INWARD CREDIT DUE"/>
                        </f:facet>
                    <h:panelGrid columns="8" styleClass="w-100" cellpadding="2">
                        <h:outputLabel value="From" for="fromDate"/>
                        <p:calendar id="fromDate" styleClass="w-100" inputStyleClass="w-100" value="#{creditCompanyDueController.fromDate}" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        <p:spacer width="20"/>
                        <h:outputLabel value="To" for="toDate"/>
                        <p:calendar id="toDate" styleClass="w-100" inputStyleClass="w-100" value="#{creditCompanyDueController.toDate}" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Date Basis" for="dateBasis"/>
                        <p:selectOneMenu id="dateBasis" styleClass="w-100" value="#{creditCompanyDueController.dateBasis}">
                            <f:selectItem itemValue="dischargeDate" itemLabel="Discharge Date"/>
                            <f:selectItem itemValue="admissionDate" itemLabel="Admission Date"/>
                        </p:selectOneMenu>
                        <h:outputLabel value="Institution" for="cmbIns"/>
                        <p:selectOneMenu id="cmbIns" styleClass="w-100" value="#{creditCompanyDueController.institution}" filter="true">
                            <f:selectItem itemLabel="All Institutions" itemValue="#{null}"/>
                            <f:selectItems value="#{institutionController.companies}" var="ins" itemLabel="#{ins.name}" itemValue="#{ins}"/>
                        </p:selectOneMenu>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Site" for="cmbSite"/>
                        <p:selectOneMenu id="cmbSite" styleClass="w-100" value="#{creditCompanyDueController.site}" filter="true">
                            <f:selectItem itemLabel="All Sites" itemValue="#{null}"/>
                            <f:selectItems value="#{institutionController.sites}" var="dueSite" itemLabel="#{dueSite.name}" itemValue="#{dueSite}"/>
                        </p:selectOneMenu>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Department" for="cmbDept"/>
                        <p:selectOneMenu id="cmbDept" styleClass="w-100" value="#{creditCompanyDueController.department}" filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="All Departments" itemValue="#{null}"/>
                            <f:selectItems value="#{departmentController.getDepartmentsOfInstitutionAndSite()}" var="d" itemLabel="#{d.name}" itemValue="#{d}"/>
                        </p:selectOneMenu>
                        <h:outputLabel value="Admission Type" for="admType"/>
                        <p:selectOneMenu id="admType" styleClass="w-100" value="#{creditCompanyDueController.admissionType}">
                            <f:selectItem itemLabel="All Admission Types" itemValue="#{null}"/>
                            <f:selectItems value="#{admissionTypeController.items}" var="at" itemValue="#{at}" itemLabel="#{at.name}"/>
                        </p:selectOneMenu>
                        <p:spacer width="20"/>
                        <h:outputLabel value="Payment Method" for="payMethod"/>
                        <p:selectOneMenu id="payMethod" styleClass="w-100" value="#{creditCompanyDueController.paymentMethod}">
                            <f:selectItem itemLabel="All Methods" itemValue="#{null}"/>
                            <f:selectItems value="#{enumController.paymentMethodsWithoutCredit}"/>
                        </p:selectOneMenu>
                        <p:spacer/>
                        <p:spacer/>
                        <p:spacer/>
                    </h:panelGrid>
                    <h:panelGroup layout="block" styleClass="my-2">
                        <p:commandButton id="btnProcess" value="Process" icon="fas fa-cogs" ajax="false" styleClass="ui-button-success m-1" action="#{creditCompanyDueController.createInwardCreditDue()}"/>
                        <p:commandButton value="Excel" icon="fas fa-file-excel" ajax="false" styleClass="ui-button-info m-1" title="Download as Excel"
                                         actionListener="#{creditCompanyDueController.createInwardCreditDue()}"
                                         action="#{creditCompanyDueController.downloadInwardCreditDueExcel()}"/>
                        <p:commandButton value="Print" icon="fas fa-print" ajax="false" styleClass="ui-button-warning m-1" title="Print the table">
                            <p:printer target="lst"/>
                        </p:commandButton>
                        <p:commandButton value="PDF" icon="fas fa-file-pdf" ajax="false" styleClass="ui-button-danger m-1" title="Download as PDF"
                                         actionListener="#{creditCompanyDueController.createInwardCreditDue()}"
                                         action="#{creditCompanyDueController.downloadInwardCreditDuePdf()}"/>
                    </h:panelGroup>
                    <p:defaultCommand target="btnProcess"/>
                        <p:dataTable id="lst" widgetVar="lstWidget" value="#{creditCompanyDueController.institutionEncounters}" var="i"
                                     styleClass="p-datatable-sm" emptyMessage="No records found">
                            <f:facet name="header">
                                <h:outputLabel value="Due Search(Credit Company)"/>
                                <br />
                                <h:outputLabel value=" From :&emsp;" style="white-space: pre-line"/>
                                <h:outputLabel value="#{creditCompanyDueController.fromDate}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                </h:outputLabel>
                                <h:outputLabel value="&emsp;&emsp;To :&emsp;"/>
                                <h:outputLabel value="#{creditCompanyDueController.toDate}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                </h:outputLabel>
                            </f:facet>
                            <p:columnGroup type="header">
                                <p:row>
                                    <p:column headerText="BHT No" width="7em"/>
                                    <p:column headerText="Date Of Admission" width="10em"/>
                                    <p:column headerText="Date Of Discharge" width="10em"/>
                                    <p:column headerText="Patient Name" width="15em"/>
                                    <p:column headerText="Credit Company" width="15em"/>
                                    <p:column headerText="Bill Amount" width="7em" styleClass="text-end"/>
                                    <p:column headerText="Paid" width="7em" styleClass="text-end"/>
                                    <p:column headerText="Outstanding" width="7em" styleClass="text-end"/>
                                </p:row>
                            </p:columnGroup>
                            <p:subTable value="#{i.bills}" var="bill">
                                <f:facet name="header">
                                    <h:outputLabel value="#{i.institution.name}"/>
                                </f:facet>
                                <p:column>
                                    <h:outputLabel value="#{bill.patientEncounter.bhtNo}"/>
                                </p:column>
                                <p:column>
                                    <h:outputLabel value="#{bill.patientEncounter.dateOfAdmission}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                    </h:outputLabel>
                                </p:column>
                                <p:column>
                                    <h:outputLabel value="#{bill.patientEncounter.dateOfDischarge}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                    </h:outputLabel>
                                </p:column>
                                <p:column>
                                    <h:outputLabel value="#{bill.patient.person.nameWithTitle}"/>
                                </p:column>
                                <p:column>
                                    <h:outputLabel value="#{bill.creditCompany.name}"/>
                                </p:column>
                                <p:column style="text-align: right;">
                                    <h:outputLabel value="#{bill.netTotal}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputLabel>
                                </p:column>
                                <p:column style="text-align: right;">
                                    <h:outputLabel value="#{bill.paidAmount}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputLabel>
                                </p:column>
                                <p:column style="text-align: right;">
                                    <h:outputLabel value="#{bill.netTotal - bill.paidAmount}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputLabel>
                                </p:column>
                                <p:columnGroup type="footer">
                                    <p:row>
                                        <p:column footerText="Sub Total" colspan="5"/>
                                        <p:column style="text-align: right;">
                                            <f:facet name="footer">
                                                <h:outputLabel value="#{i.total}">
                                                    <f:convertNumber pattern="#,##0.00"/>
                                                </h:outputLabel>
                                            </f:facet>
                                        </p:column>
                                        <p:column style="text-align: right;">
                                            <f:facet name="footer">
                                                <h:outputLabel value="#{i.paidTotal}">
                                                    <f:convertNumber pattern="#,##0.00"/>
                                                </h:outputLabel>
                                            </f:facet>
                                        </p:column>
                                        <p:column style="text-align: right;">
                                            <f:facet name="footer">
                                                <h:outputLabel value="#{i.total - i.paidTotal}">
                                                    <f:convertNumber pattern="#,##0.00"/>
                                                </h:outputLabel>
                                            </f:facet>
                                        </p:column>
                                    </p:row>
                                </p:columnGroup>
                            </p:subTable>
                            <p:columnGroup type="footer">
                                <p:row>
                                    <p:column footerText="Grand Total" colspan="5"/>
                                    <p:column style="text-align: right;">
                                        <f:facet name="footer">
                                            <h:outputLabel value="#{creditCompanyDueController.finalTotal}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputLabel>
                                        </f:facet>
                                    </p:column>
                                    <p:column style="text-align: right;">
                                        <f:facet name="footer">
                                            <h:outputLabel value="#{creditCompanyDueController.finalPaidTotal}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputLabel>
                                        </f:facet>
                                    </p:column>
                                    <p:column style="text-align: right;">
                                        <f:facet name="footer">
                                            <h:outputLabel value="#{creditCompanyDueController.finalTotal - creditCompanyDueController.finalPaidTotal}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputLabel>
                                        </f:facet>
                                    </p:column>
                                </p:row>
                            </p:columnGroup>
                            <f:facet name="footer">
                                <h:outputLabel class="my-2" value="Printed By : #{sessionController.loggedUser.webUserPerson.name}" style="float: right"/>
                            </f:facet>
                        </p:dataTable>
                    </p:panel>
                </h:form>
            </ui:define>


        </ui:composition>

    </h:body>
</html>
