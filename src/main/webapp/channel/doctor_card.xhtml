<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/resources/template/template.xhtml"
                >

    <ui:define name="content">
        <h:form>


            <h:panelGrid columns="1">
                <p:panel header="Channel Session Report (Doctor Card)" style="margin: 15px 100px; border-radius: 6px;">
                    <div class="container-fluid px-0">
                        <div class="row">
                            
                            <!-- From Date -->
                            <div class="col-12 col-xl-6 mb-3 pr-xl-4" >
                                <div class="row align-items-center">
                                    <div class="col-12 col-sm-3 font-weight-bold"
                                         style="white-space: nowrap;">
                                        <i class="fas fa-calendar-alt" style="margin-right: 8px;"></i>
                                        <p:outputLabel value="From Date" for="fromDate"/>
                                    </div>
                                    <div class="col-12 col-sm-9">
                                        <p:calendar id="fromDate"
                                                    value="#{channelReportController.fromDate}"
                                                    styleClass="d-block w-75"
                                                    inputStyleClass="form-control"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- To Date -->
                            <div class="col-12 col-xl-6 mb-3 pl-xl-4">
                                <div class="row align-items-center">

                                    <div class="col-12 col-sm-3 font-weight-bold"
                                         style="white-space: nowrap;">
                                        <i class="fas fa-calendar-alt" style="margin-right: 8px;"></i>
                                        <p:outputLabel value="To Date" for="toDate"/>
                                    </div>
                                    <div class="col-12 col-sm-9">
                                        <p:calendar id="toDate"
                                                    value="#{channelReportController.toDate}"
                                                    locale="de"
                                                    pattern="dd.MM.yyyy HH:mm"
                                                    styleClass="d-block w-75"
                                                    inputStyleClass="form-control"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Speciality -->
                            <div class="col-12 col-xl-6 mb-3 pr-xl-4">
                                <div class="row align-items-center">

                                    <div class="col-12 col-sm-3 font-weight-bold"
                                         style="white-space: nowrap;">
                                        <i class="fas fa-stethoscope" style="margin-right: 8px;"></i>
                            <h:outputLabel  value="Speciality" ></h:outputLabel>
                                    </div>

                                    <div class="col-12 col-sm-9">
                            <p:autoComplete 
                                onfocus="this.select()" 
                                styleClass="d-block w-75"
                                inputStyleClass="form-control" 
                                value="#{channelReportController.speciality}" 
                                id="acSpeciality" 
                                placeholder="Speciality"
                                completeMethod="#{channelScheduleController.completeDOctorSpeciality}"
                                var="speciality" 
                                itemLabel="#{speciality.name}" 
                                itemValue="#{speciality}"
                                >
                                <p:ajax event="blur" process="@this" update="scStaff" />
                                <p:ajax process="@this" update="scStaff" />
                            </p:autoComplete>
                                    </div>
                                </div>
                            </div>

                            <!-- Doctor -->
                            <div class="col-12 col-xl-6 mb-3 pl-xl-4">
                                <div class="row align-items-center">

                                    <div class="col-12 col-sm-3 font-weight-bold"
                                         style="white-space: nowrap;">
                                        <i class="fas fa-user-md" style="margin-right: 8px;"></i>
                            <h:outputLabel  value="Doctor" ></h:outputLabel>
                                    </div>

                                    <div class="col-12 col-sm-9">
                            <p:selectOneMenu 
                                filter="true"
                                filterMatchMode="contains"
                                style="width: 100%;"
                                styleClass="d-block w-75"  
                                value="#{channelReportController.staff}" 
                                id="scStaff" 
                                > 
                                <f:selectItem itemLabel="Please Select"/>
                                <f:selectItems 
                                    value="#{channelScheduleController.specialityStaff}" 
                                    var="mys" 
                                    itemLabel="#{mys.person.nameWithTitle}" 
                                    itemValue="#{mys}">
                                </f:selectItems>

                            </p:selectOneMenu>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <h:panelGrid columns="3" class="mt-1 mb-0">
                        <p:commandButton id="btnFill"
                            value="Fill"
                            icon="fas fa-sync-alt"
                            styleClass="ui-button-warning my-4 mx-2"
                            style="width:100px"
                            action="#{channelReportController.fillSessionsForChannelDoctorCard}"
                            process="@form"
                            ajax="false"/>
                        <p:commandButton id="btnPrint"
                            value="Print"
                            icon="fas fa-print"
                            styleClass="ui-button-info my-4 mx-2"
                            style="width:100px"
                            ajax="false"
                            type="button">

                            <p:printer target="reportPrint"/>
                        </p:commandButton>
                        <p:commandButton id="btnExcel"
                            value="Excel"
                            icon="fas fa-file-excel"
                            styleClass="ui-button-success my-4 mx-2"
                            style="width:100px"
                            ajax="false">

                            <p:dataExporter target="tbl"
                                            type="xlsx"
                                            fileName="DoctorCard"/>
                        </p:commandButton>

                    </h:panelGrid>
                    </p:panel>
                    <p:panel id="reportPrint" header="Channel Session Report (Doctor Card)" style="margin: 15px 100px; border-radius: 6px;">
                        <p:dataTable value="#{channelReportController.sessioninstances}" var="i" sortMode="single" id="tbl" styleClass="table table-sm">

                            <p:column style="padding: 6px">
                                <f:facet name="header" >
                                    <p:outputLabel value="Consultant" />
                                </f:facet>
                                <p:outputLabel value="#{i.originatingSession.staff.person.name}" />
                            </p:column>
                            <p:column style="padding: 6px">
                                <f:facet name="header" >
                                    <p:outputLabel value="Speciality" />
                                </f:facet>
                                <p:outputLabel value="#{i.originatingSession.staff.speciality.name}" />
                            </p:column>

                            <p:column headerText="Session Date" style="padding: 6px" >
                                <h:outputLabel value="#{i.sessionDate}" >
                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="dd MMM yy " ></f:convertDateTime>
                                </h:outputLabel>
                            </p:column>
                            <p:column style="padding: 6px">
                                <f:facet name="header" >
                                    <p:outputLabel value="Session Name" />
                                </f:facet>
                                <p:outputLabel value="#{i.originatingSession.name}" />
                            </p:column>
                            <p:column style="padding: 6px" sortBy="#{i.startingTime}" sortOrder="asc">
                                <f:facet name="header" >
                                    <p:outputLabel value="Starting Time" />
                                </f:facet>
                                <p:outputLabel value="#{i.startingTime}" >

                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="hh:mm a"  />

<!--                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortTimeFormat}"  />-->

                                </p:outputLabel>
                            </p:column>
                            <p:column style="padding: 6px">
                                <f:facet name="header" >
                                    <p:outputLabel value="Count" />
                                </f:facet>
                                <p:outputLabel value="#{i.bookedPatientCount}" >

                                </p:outputLabel>
                            </p:column>
                            <p:column style="padding: 6px">
                               <f:facet name="header" >
                                  <p:outputLabel value="Room No" />
                              </f:facet>
                              <p:outputLabel value="#{i.roomNo}" />
                           </p:column>
                        </p:dataTable>
                    </p:panel>

                



            </h:panelGrid>

        </h:form>
    </ui:define>


</ui:composition>
