<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/channel/management_index.xhtml">
        <ui:define name="subcontent">
            <h:form id="DoctorSpecialityListForm">
                <p:panel header="Managing Specialities">
                    <p:dataTable id="datalist" value="#{doctorSpecialityController.items}" var="item"
                                 selectionMode="single" selection="#{doctorSpecialityController.selected}"
                                 paginator="true"
                                 rowKey="#{item.id}"
                                 rows="10"
                                 rowsPerPageTemplate="10,20,30,40,50"
                                 emptyMessage="No Specialities"
                                 styleClass="p-datatable-sm"
                                 paginatorPosition="bottom">
                        <p:ajax event="rowSelect"   update="createButton viewButton editButton deleteButton"/>
                        <p:ajax event="rowUnselect" update="createButton viewButton editButton deleteButton"/>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Name"/>
                            </f:facet>
                            <h:outputText value="#{item.name}"/>
                        </p:column>

                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Code"/>
                            </f:facet>
                            <h:outputText value="#{item.code}"/>
                        </p:column>
                        <p:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </p:column>
                        <f:facet name="header">
                            <div class="d-flex flex-wrap gap-2">
                                <p:commandButton id="createButton" icon="fa fa-plus" value="Create" styleClass="ui-button-success" title="Create a new speciality" actionListener="#{doctorSpecialityController.prepareCreate}" update=":DoctorSpecialityCreateForm" oncomplete="PF('DoctorSpecialityCreateDialog').show()"/>
                                <p:commandButton id="viewButton" icon="fa fa-eye" value="View" styleClass="ui-button-info ui-button-outlined" title="View the selected speciality" update=":DoctorSpecialityViewForm" oncomplete="PF('DoctorSpecialityViewDialog').show()" disabled="#{empty doctorSpecialityController.selected}"/>
                                <p:commandButton id="editButton" icon="fa fa-pencil-alt" value="Edit" styleClass="ui-button-warning" title="Edit the selected speciality" update=":DoctorSpecialityEditForm" oncomplete="PF('DoctorSpecialityEditDialog').show()" disabled="#{empty doctorSpecialityController.selected}"/>
                                <p:commandButton id="deleteButton" icon="fa fa-trash" value="Delete" styleClass="ui-button-danger" title="Delete the selected speciality" actionListener="#{doctorSpecialityController.deleteSelected()}" update="datalist" disabled="#{empty doctorSpecialityController.selected}"/>
                            </div>
                        </f:facet>
                    </p:dataTable>
                </p:panel>
            </h:form>

            <ui:include src="Create.xhtml"/>
            <ui:include src="Edit.xhtml"/>
            <ui:include src="View.xhtml"/>
        </ui:define>
    </ui:composition>

</html>
