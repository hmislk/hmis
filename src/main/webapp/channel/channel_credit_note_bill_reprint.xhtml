<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"      
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill">
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <p:panel>
                        <p:panel>
                            <p:panelGrid columns="2" style="width: 100%;">
                                <p:panel header="Person Detail">
                                    <p:panelGrid columns="2">
                                        <h:outputLabel value="From Institution Name:" ></h:outputLabel>
                                        <h:outputLabel value="#{agentPaymentReceiveSearchController.bill.fromInstitution.name}" rendered="#{agentPaymentReceiveSearchController.bill.fromInstitution ne null}" ></h:outputLabel>                                        
                                    </p:panelGrid>
                                </p:panel>
                                <p:panel header="Bill Detail">
                                    <p:panelGrid columns="2">
                                        <h:outputLabel value="Bill No :" ></h:outputLabel>
                                        <h:outputLabel value="#{agentPaymentReceiveSearchController.bill.deptId}" ></h:outputLabel>
                                        <h:outputLabel value="Payment Type : " ></h:outputLabel>
                                        <h:outputLabel value="#{agentPaymentReceiveSearchController.bill.paymentMethod}" ></h:outputLabel>                                        
                                        <h:outputLabel value="Paid Total :" ></h:outputLabel>
                                        <h:outputLabel value="#{agentPaymentReceiveSearchController.bill.netTotal}" ></h:outputLabel>
                                    </p:panelGrid>
                                </p:panel>
                            </p:panelGrid>
                            
                        </p:panel>
                    </p:panel>

                   <div class="d-flex align-items-center gap-2 my-2 ms-3">
                        <p:commandButton value="Reprint"
                                         type="button"
                                         icon="pi pi-print">
                            <p:printer target="printCreditNote" />
                        </p:commandButton>

                        <p:commandButton value="Cancel"
                                         ajax="false"
                                         icon="pi pi-times"
                                         action="channel_credit_note_bill_cancel"
                                         disabled="#{agentPaymentReceiveSearchController.bill.cancelled}" />
                    </div>

                    <h:panelGroup id="printCreditNote" layout="block">
                        <bi:agent
                            billController="#{agentPaymentReceiveSearchController}"
                            bill="#{agentPaymentReceiveSearchController.bill}"
                            dup="true" />
                    </h:panelGroup>
                    
                </h:form>
            </ui:define>



        </ui:composition>

    </h:body>
</html>
