<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core">



    <ui:define name="content">
        <p:growl />

        <p:panelGrid columns="2" layout="tabular" >
            <f:facet name="header" >
                <div class="d-flex justify-content-between align-items-center w-100">
                    <div class="d-flex align-items-center gap-2">
                        <h:outputText styleClass="fa fa-key" />
                        <h:outputText value="Manage My API Keys" />
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <p:button value="API Key Guide" icon="fa fa-book"
                                  href="https://github.com/hmislk/hmis/wiki/Manage-My-API-Keys"
                                  target="_blank"
                                  title="API usage and curl examples"
                                  styleClass="ui-button-info ui-button-outlined" />
                        <p:button value="FHIR R5 Patient API" icon="fa fa-book"
                                  href="https://github.com/hmislk/hmis/wiki/FHIR-R5-Patient-API"
                                  target="_blank"
                                  title="FHIR R5 Patient API wiki page"
                                  styleClass="ui-button-info ui-button-outlined" />
                    </div>
                    <div></div>
                </div>
            </f:facet>

            <h:form >
                <p:panelGrid columns="2" style="width: 40em;" columnClasses="ui-md-3,ui-md-9" >
                    <f:facet name="header" >
                        <p:outputLabel value="Add New API Key" ></p:outputLabel>
                    </f:facet>
                    <p:outputLabel for="keyname" value="Key Name" ></p:outputLabel>
                    <p:selectOneMenu 
                        id="keyname" 
                        class="w-100"
                        value="#{apiKeyController.current.keyType}" 
                        required="true" requiredMessage="Please select key name" >
                        <f:selectItems value="#{apiKeyController.apiKeyTypes}" ></f:selectItems>
                    </p:selectOneMenu>
                    <p:outputLabel for="keyvalue" value="Key Value" ></p:outputLabel>
                    <p:outputLabel
                        id="keyvalue"
                        value="Generated by the system when the key is added" ></p:outputLabel>
                    <p:outputLabel for="doe" value="Date of Expiary" ></p:outputLabel>
                    <p:calendar 
                        id="doe"
                        inputStyleClass="w-100"
                        class="w-100"
                        pattern="#{sessionController.applicationPreference.longDateFormat}"
                        navigator="true"
                        value="#{apiKeyController.current.dateOfExpiary}" ></p:calendar>
                    <p:spacer ></p:spacer>
                    <p:commandButton
                        ajax="false" 
                        class="w-100 ui-button-success"
                        icon="fa fa-plus"
                        title="Add this API key"
                        value="Add Key"
                        action="#{apiKeyController.saveSelected()}" ></p:commandButton>
                </p:panelGrid>
            </h:form>

            <h:form >
                <p:dataTable id="tblMyApiKeys" widgetVar="tblMyApiKeys" value="#{apiKeyController.items}" var="i" rowKey="#{i.id}" styleClass="p-datatable-sm" >
                    <f:facet name="header" >
                        <p:outputLabel value="My Active API Keys" ></p:outputLabel>
                    </f:facet>
                    <p:column headerText="Key Name" >
                        <h:outputText value="#{i.keyType}" />
                    </p:column>
                    <p:column headerText="Key Value" >
                        <h:outputText value="#{i.keyValue}" />
                    </p:column>
                    <p:column headerText="Expiary (dd-MM-yyyy)" >
                        <h:outputText value="#{i.dateOfExpiary}" >
                            <f:convertDateTime pattern="dd-MM-yyyy" ></f:convertDateTime>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Actions" >
                        <p:commandButton ajax="false" value="Remove" icon="fa fa-trash" styleClass="ui-button-danger" title="Remove API key #{i.keyType}" action="#{apiKeyController.delete()}" >
                            <f:setPropertyActionListener value="#{i}" target="#{apiKeyController.removing}" ></f:setPropertyActionListener>
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
            </h:form>

        </p:panelGrid>




    </ui:define>


</ui:composition>
