<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:in="http://xmlns.jcp.org/jsf/composite/inward"
                xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill/Inward">

    <ui:define name="content">

        <h:panelGroup rendered="true" styleClass="opdPanel">
            <h:form id="form">

                <p:panel rendered="#{inwardProfessionalBillController.batchBill eq null and !inwardProfessionalBillController.settlePreview}">
                    <f:facet name="header">
                        <div class="d-flex justify-content-between align-items-center w-100">

                            <!-- LEFT: title -->
                            <div class="d-flex align-items-center gap-2">
                                <h:outputText styleClass="fa-solid fa-scissors fa-lg"/>
                                <p:outputLabel value="Surgery Professional Fees" class="m-2"/>
                            </div>

                            <!-- CENTER: entity-level navigation -->
                            <div class="d-flex gap-2">
                                <h:panelGroup rendered="#{webUserController.hasPrivilege('NursingWorkBench')}">
                                    <p:commandButton value="Surgery WorkBench" icon="fa fa-arrow-left"
                                                     ajax="false" immediate="true"
                                                     title="Return to surgery workbench"
                                                     action="#{surgeryBillController.navigateToAddSurgeriesFromMenu()}"
                                                     styleClass="ui-button-info ui-button-outlined"/>
                                </h:panelGroup>
                            </div>

                            <!-- RIGHT: actions (none in search mode) -->

                        </div>
                    </f:facet>

                    <h:outputLabel value="Type Surgery Name or BHT : "/>
                    <p:autoComplete
                        forceSelection="true"
                        value="#{inwardProfessionalBillController.batchBill}"
                        completeMethod="#{billController.completeSurgeryBills}"
                        var="apt2"
                        itemLabel="#{apt2.patientEncounter.bhtNo}"
                        itemValue="#{apt2}"
                        size="40"
                        class="m-2">
                        <p:column>
                            #{apt2.procedure.item.name}
                        </p:column>
                        <p:column>
                            #{apt2.patientEncounter.bhtNo}
                        </p:column>
                        <p:column>
                            #{apt2.patientEncounter.patient.person.name}
                        </p:column>
                    </p:autoComplete>

                    <p:commandButton
                        id="btnSelect"
                        value="Select"
                        ajax="false">
                    </p:commandButton>
                </p:panel>

                <p:panel style="min-height: 600px; position:relative;" rendered="#{inwardProfessionalBillController.batchBill ne null and !inwardProfessionalBillController.settlePreview}">
                    <f:facet name="header">
                        <div class="d-flex justify-content-between align-items-center w-100">

                            <!-- LEFT: title -->
                            <div class="d-flex align-items-center gap-2">
                                <h:outputText styleClass="fa-solid fa-scissors"/>
                                <p:outputLabel value="Surgery Professional Fees" class="mx-2"/>
                            </div>

                            <!-- CENTER: entity-level navigation -->
                            <div class="d-flex gap-2">
                                <p:commandButton value="Surgery WorkBench" icon="fa fa-arrow-left"
                                                 ajax="false" immediate="true"
                                                 title="Return to surgery workbench"
                                                 action="/theater/patient_surgery?faces-redirect=true"
                                                 styleClass="ui-button-info ui-button-outlined"/>
                                <p:commandButton value="Patient Lookup" icon="fa fa-search"
                                                 ajax="false" immediate="true"
                                                 title="Search for a patient"
                                                 action="#{patientController.navigateToSearchPatients()}"
                                                 styleClass="ui-button-info ui-button-outlined"/>
                                <p:commandButton value="Patient Profile" icon="fa fa-user"
                                                 ajax="false" immediate="true"
                                                 title="View patient profile"
                                                 action="#{patientController.navigateToOpdPatientProfile()}"
                                                 styleClass="ui-button-info ui-button-outlined"/>
                                <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardSearch')}">
                                    <p:commandButton value="Inpatient Dashboard" icon="fas fa-id-card"
                                                     ajax="false" immediate="true"
                                                     title="Go to inpatient dashboard"
                                                     action="#{admissionController.navigateToAdmissionProfilePage}"
                                                     styleClass="ui-button-info ui-button-outlined">
                                        <f:setPropertyActionListener
                                            value="#{inwardProfessionalBillController.batchBill.patientEncounter}"
                                            target="#{admissionController.current}"/>
                                    </p:commandButton>
                                </h:panelGroup>
                            </div>

                            <!-- RIGHT: actions, left=least important → right=primary -->
                            <div class="d-flex gap-2 align-items-center">
                                <p:commandButton id="btnClearForm" value="Clear Form" icon="fa fa-times"
                                                 ajax="false"
                                                 title="Discard unsaved fee rows"
                                                 action="#{inwardProfessionalBillController.clearProfessionalFeeForm()}"
                                                 onclick="return confirm('Discard unsaved fee rows?');"
                                                 styleClass="ui-button-warning"/>
                                <p:commandButton id="btnSettleBill" value="Settle Bill" icon="fa fa-check"
                                                 ajax="false"
                                                 title="Save and settle the professional fee bill"
                                                 action="#{inwardProfessionalBillController.saveProfessionalFeeBill()}"
                                                 disabled="#{inwardProfessionalBillController.batchBill.patientEncounter.paymentFinalized}"
                                                 style="min-width:120px"
                                                 styleClass="ui-button-success"/>
                            </div>

                        </div>
                    </f:facet>

                    <div class="row">
                        <div class="col-md-6">
                            <p:panel>
                                <f:facet name="header">
                                    <h:outputText styleClass="fas fa-user"/>
                                    <h:outputText value="Patient Details" class="mx-4"/>
                                </f:facet>
                                <in:bhtDetail admission="#{inwardProfessionalBillController.batchBill.patientEncounter}"/>
                                <in:surgeryDetail procedure="#{inwardProfessionalBillController.batchBill.procedure}"/>
                            </p:panel>
                        </div>

                        <div class="col-md-6">
                            <p:panel id="pIxAdd" style="min-height: 350px;">
                                <f:facet name="header">
                                    <h:outputText styleClass="fas fa-money-bill"/>
                                    <h:outputText value="Add Professional Fee" class="mx-4"/>
                                </f:facet>
                                <h:panelGrid columns="2" id="profPanel">
                                    <h:outputLabel value="Role"/>
                                    <p:selectOneMenu class="mx-4 my-1" style="width: 400px;"
                                                     value="#{inwardProfessionalBillController.proEncounterComponent.patientEncounterComponentType}">
                                        <f:selectItem itemLabel="Please select Role"/>
                                        <f:selectItems value="#{enumController.patientEncounterComponentTypes}"/>
                                    </p:selectOneMenu>

                                    <h:outputText value="Speciality"/>
                                    <p:autoComplete forceSelection="true" id="cmbSpe"
                                                    value="#{inwardProfessionalBillController.proEncounterComponent.billFee.speciality}"
                                                    completeMethod="#{specialityController.completeSpeciality}" var="sp"
                                                    itemLabel="#{sp.name}"
                                                    itemValue="#{sp}" size="70" style="width: 400px;" class="mx-4 my-1">
                                        <p:ajax event="itemSelect" execute="cmbSpe" render="cmbDoc"/>
                                    </p:autoComplete>

                                    <h:outputText value="Doctor/Staff"/>
                                    <p:autoComplete forceSelection="true" id="cmbDoc"
                                                    value="#{inwardProfessionalBillController.proEncounterComponent.billFee.staff}"
                                                    completeMethod="#{inwardProfessionalBillController.completeItems}" var="st"
                                                    itemLabel="#{st.person.nameWithTitle}" itemValue="#{st}" size="70"
                                                    style="width: 400px;" class="mx-4 my-1">
                                    </p:autoComplete>

                                    <h:outputLabel value="Description"/>
                                    <p:inputText class="mx-4 my-1" size="70" autocomplete="off" id="txtDes"
                                                 value="#{inwardProfessionalBillController.proEncounterComponent.description}"/>

                                    <h:outputLabel value="Fee"/>
                                    <p:inputText class="mx-4 my-1" size="70" autocomplete="off" id="prof"
                                                 value="#{inwardProfessionalBillController.proEncounterComponent.billFee.feeValue}"/>
                                </h:panelGrid>
                                <br/>
                                <p:commandButton ajax="false"
                                                 value="Add Professional Fee"
                                                 icon="fa-solid fa-check"
                                                 class="ui-button-success"
                                                 action="#{inwardProfessionalBillController.addProfessionalFee()}"
                                                 disabled="#{inwardProfessionalBillController.batchBill.patientEncounter.paymentFinalized}"/>
                            </p:panel>

                        </div>
                    </div>

                    <p:panel class="mt-3">
                        <f:facet name="header">
                            <h:outputText styleClass="fas fa-list-check"/>
                            <h:outputText value="Current Bill — Unsaved Fees" class="mx-2"/>
                            <h:outputText value=" (click 'Settle Bill' to save as a new bill)"
                                          style="font-style: italic; font-size: 0.9em; color: #888;"/>
                        </f:facet>

                    <h:panelGroup id="panelBillItems">
                        <p:dataTable value="#{inwardProfessionalBillController.proEncounterComponents}" var="c"
                                     emptyMessage="No fees added yet. Use the form above to add fees, then click 'Save Bill'.">
                            <p:column headerText="Role">
                                <h:outputLabel value="#{c.patientEncounterComponentType}"/>
                            </p:column>
                            <p:column headerText="Doctor/Staff">
                                <h:outputLabel value="#{c.billFee.staff.person.nameWithTitle}"/>
                            </p:column>
                            <p:column headerText="Fee">
                                <p:inputText autocomplete="off" style="width: 130px"
                                             value="#{c.billFee.feeValue}"/>
                            </p:column>
                            <p:column headerText="Remove">
                                <p:commandButton ajax="false" value="Remove"
                                                 icon="fa fa-times"
                                                 class="ui-button-danger"
                                                 action="#{inwardProfessionalBillController.removeProEncFromList(c)}"
                                                 disabled="#{inwardProfessionalBillController.batchBill.patientEncounter.paymentFinalized}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGroup>
                    </p:panel>

                    <!-- Saved professional fee bills for this surgery -->
                    <p:panel class="mt-3" rendered="#{not empty inwardProfessionalBillController.surgeryProfessionalFeeBills}">
                        <f:facet name="header">
                            <h:outputText styleClass="fas fa-receipt"/>
                            <h:outputText value="Saved Professional Fee Bills" class="mx-2"/>
                        </f:facet>
                        <p:dataTable value="#{inwardProfessionalBillController.surgeryProfessionalFeeBills}" var="sb"
                                     emptyMessage="No saved bills yet.">
                            <p:column headerText="Bill No">
                                <h:outputLabel value="#{sb.deptId}"/>
                            </p:column>
                            <p:column headerText="Date">
                                <h:outputLabel value="#{sb.createdAt}">
                                    <f:convertDateTime timeZone="Asia/Colombo"
                                                       pattern="#{sessionController.applicationPreference.shortDateFormat}"/>
                                </h:outputLabel>
                            </p:column>
                            <p:column headerText="Total" styleClass="text-end">
                                <h:outputLabel value="#{sb.total}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputLabel>
                            </p:column>
                            <p:column headerText="Status">
                                <h:panelGroup rendered="#{!sb.cancelled}">
                                    <h:outputLabel value="Active" style="color: green; font-weight: bold;"/>
                                </h:panelGroup>
                                <h:panelGroup rendered="#{sb.cancelled}">
                                    <h:outputLabel value="Cancelled" style="color: red; font-weight: bold;"/>
                                </h:panelGroup>
                            </p:column>
                        </p:dataTable>
                    </p:panel>

                </p:panel>

                <!-- Post-settle: print and navigation -->
                <p:panel rendered="#{inwardProfessionalBillController.settlePreview}">
                    <f:facet name="header">
                        <div class="d-flex justify-content-between align-items-center w-100">

                            <!-- LEFT: title -->
                            <div class="d-flex align-items-center gap-2">
                                <p:outputLabel value="Professional Fee Bill Settled"/>
                            </div>

                            <!-- CENTER: entity-level navigation -->
                            <div class="d-flex gap-2">
                                <p:commandButton value="Surgery Workbench" icon="fa fa-arrow-left"
                                                 ajax="false" immediate="true"
                                                 title="Return to surgery workbench"
                                                 action="/theater/patient_surgery?faces-redirect=true"
                                                 styleClass="ui-button-info ui-button-outlined"/>
                                <p:commandButton value="Prof. Fee List" icon="fa fa-list"
                                                 ajax="false" immediate="true"
                                                 title="View professional fee list"
                                                 action="#{inwardProfessionalBillController.navigateToSurgeryProfessionalFeesList(inwardProfessionalBillController.batchBill)}"
                                                 styleClass="ui-button-info ui-button-outlined"/>
                                <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardSearch')}">
                                    <p:commandButton value="Inpatient Dashboard" icon="fas fa-id-card"
                                                     ajax="false" immediate="true"
                                                     title="Go to inpatient dashboard"
                                                     action="#{admissionController.navigateToAdmissionProfilePage}"
                                                     styleClass="ui-button-info ui-button-outlined">
                                        <f:setPropertyActionListener
                                            value="#{inwardProfessionalBillController.batchBill.patientEncounter}"
                                            target="#{admissionController.current}"/>
                                    </p:commandButton>
                                </h:panelGroup>
                            </div>

                            <!-- RIGHT: actions, left=least important → right=primary -->
                            <div class="d-flex gap-2 align-items-center">
                                <p:commandButton id="btnSettings" value="Settings" icon="fa fa-cog"
                                                 type="button"
                                                 title="Print settings"
                                                 onclick="PF('profFeeSettleConfigDialog').show()"
                                                 styleClass="ui-button-secondary"/>
                                <p:commandButton id="btnRedraw" value="Redraw" icon="fa fa-sync-alt"
                                                 ajax="false"
                                                 title="Redraw the preview"
                                                 styleClass="ui-button-secondary"/>
                                <p:commandButton id="btnPrint" value="Print" icon="fa fa-print"
                                                 ajax="false"
                                                 title="Print the settled bill"
                                                 styleClass="ui-button-info">
                                    <p:printer target="gpSettleBillPreview"/>
                                </p:commandButton>
                                <p:commandButton id="btnAddMoreFees" value="Add More Fees" icon="fa fa-plus"
                                                 ajax="false"
                                                 title="Go back to add more professional fees"
                                                 action="#{inwardProfessionalBillController.clearProfessionalFeeForm()}"
                                                 style="min-width:130px"
                                                 styleClass="ui-button-success"/>
                            </div>

                        </div>
                    </f:facet>

                    <h:panelGroup id="gpSettleBillPreview">
                        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Surgery Professional Fee Bill is A4Paper', true)}">
                            <bi:surgery_professional_fee_a4
                                bill="#{inwardProfessionalBillController.lastSavedProfessionalFeeBill}"
                                encounterComponents="#{inwardProfessionalBillController.getEncounterComponentsForBill(inwardProfessionalBillController.lastSavedProfessionalFeeBill)}"
                                cancelled="false"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Surgery Professional Fee Bill is FiveFivePaper', false)}">
                            <bi:surgery_professional_fee_5x5
                                bill="#{inwardProfessionalBillController.lastSavedProfessionalFeeBill}"
                                encounterComponents="#{inwardProfessionalBillController.getEncounterComponentsForBill(inwardProfessionalBillController.lastSavedProfessionalFeeBill)}"
                                cancelled="false"/>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Surgery Professional Fee Bill is PosPaper', false)}">
                            <bi:surgery_professional_fee_pos
                                bill="#{inwardProfessionalBillController.lastSavedProfessionalFeeBill}"
                                encounterComponents="#{inwardProfessionalBillController.getEncounterComponentsForBill(inwardProfessionalBillController.lastSavedProfessionalFeeBill)}"
                                cancelled="false"/>
                        </h:panelGroup>
                    </h:panelGroup>

                </p:panel>

                <!-- Print config dialog for settle preview -->
                <p:dialog header="Print Settings" widgetVar="profFeeSettleConfigDialog" modal="true" responsive="true" style="width: 350px;">
                    <p:ajax event="open" listener="#{inwardProfessionalBillController.loadProfFeeConfig}" update="profFeeSettleConfigForm"/>
                    <h:panelGroup id="profFeeSettleConfigForm" layout="block">
                        <h:panelGrid columns="2" cellpadding="5">
                            <h:selectBooleanCheckbox id="chkA4Settle" value="#{inwardProfessionalBillController.profFeeA4}"/>
                            <h:outputLabel for="chkA4Settle" value="A4 Paper"/>
                            <h:selectBooleanCheckbox id="chk5x5Settle" value="#{inwardProfessionalBillController.profFee5x5}"/>
                            <h:outputLabel for="chk5x5Settle" value="5x5 Inch Paper"/>
                            <h:selectBooleanCheckbox id="chkPosSettle" value="#{inwardProfessionalBillController.profFeePos}"/>
                            <h:outputLabel for="chkPosSettle" value="POS Paper"/>
                        </h:panelGrid>
                        <p:commandButton
                            value="Save"
                            icon="fa fa-save"
                            class="ui-button-success mt-2"
                            ajax="false"
                            action="#{inwardProfessionalBillController.saveProfFeeConfig()}"
                            onclick="PF('profFeeSettleConfigDialog').hide()"/>
                    </h:panelGroup>
                </p:dialog>

            </h:form>
        </h:panelGroup>
    </ui:define>
</ui:composition>
