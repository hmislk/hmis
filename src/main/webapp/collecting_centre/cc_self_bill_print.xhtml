<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill/cc_bill">
    <h:head>
        <title>Collecting Centre Self Billing - Bill Printview</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template_without_menu.xhtml">
            <ui:define name="content">

                <h:outputStylesheet library="css" name="collecting_centre_self_billing_bill.css"/>
                <h:outputScript library="js" name="cc_self_billing_fit_screen.js" target="body"/>

                <div class="cc-bill-page">
                    <h:form id="form">
                        <ez:cc_self_billing_header
                            pageTitle="Bill Print View"
                            highlightCode="#{collectingCentreBillController.collectingCentre.code}"
                            highlightName="#{collectingCentreBillController.collectingCentre.name}"
                            pageIcon="fa-solid fa-print"
                            backAction="#{collectingCentreSelfCommonController.navigateToCollectingCentreSelfBillingHome}"
                            backLabel="Back to Dashboard">
                        </ez:cc_self_billing_header>

                        <div class="d-flex gap-2 justify-content-end mb-3 mx-2 cc-actions-wrap">
                            <p:commandButton
                                value="New Bill"
                                icon="fa fa-plus"
                                ajax="false"
                                immediate="true"
                                style="width: 200px;"
                                action="#{collectingCentreBillController.navigateToCollectingCentreSelfBillingKeepingCollectingCentre()}"
                                rendered="#{webUserController.hasPrivilege('CcSelfBilling')}"
                                class="ui-button-warning mx-1">
                            </p:commandButton>
                            <p:commandButton
                                value="To Sample Management"
                                icon="fas fa-flask"
                                ajax="false"
                                style="width: 200px;"
                                action="#{collectingCentreSelfCommonController.navigateToSelfSampleManagementFromBills(collectingCentreBillController.bills)}"
                                rendered="#{webUserController.hasPrivilege('CcSelfSampleManagement')}"
                                class="ui-button-info mx-1">
                            </p:commandButton>
                        </div>

                        <div class="row cc-stack-gap">
                            <div class="col-md-6">
                                <p:panel>
                                    <f:facet name="header">
                                        <p:outputLabel value="Bill for Collecting Center" class="mt-2"/>
                                        <p:commandButton
                                            value="Print"
                                            process="@this"
                                            update="@all"
                                            type="button"
                                            class="ui-button-info"
                                            icon="fa fa-print"
                                            style="float: right;"
                                            ajax="false">
                                            <p:printer target="centerBillPriview"></p:printer>
                                        </p:commandButton>
                                    </f:facet>

                                    <div class="cc-scroll-x cc-fit-screen">
                                        <div class="cc-fit-inner">
                                            <h:panelGroup id="centerBillPriview">

                                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('CC Self Billing - Bill For Center(CC) : Size is FiveFiveCustom1 paper',true)}">
                                                    <ui:repeat value="#{collectingCentreBillController.bills}" var="pp">
                                                        <bi:ccSelfBilling_fiveFiveCCBill_CC_Custom1 bill="#{pp}" duplicate="false"/>
                                                    </ui:repeat>
                                                </h:panelGroup>

                                            </h:panelGroup>
                                        </div>
                                    </div>
                                </p:panel>
                            </div>

                            <div class="col-md-6">
                                <p:panel>
                                    <f:facet name="header">
                                        <p:outputLabel value="Bill for Patient" class="mt-2"/>
                                        <p:commandButton
                                            value="Print Patient"
                                            class="ui-button-info"
                                            icon="fa fa-print"
                                            process="@this"
                                            update="@all"
                                            style="float: right;"
                                            type="button"
                                            ajax="false">
                                            <p:printer target="parinetBillPriview"></p:printer>
                                        </p:commandButton>
                                    </f:facet>

                                    <div class="cc-scroll-x cc-fit-screen">
                                        <div class="cc-fit-inner">
                                            <h:panelGroup id="parinetBillPriview">

                                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('CC Self Billing - Bill For Patient : Size is FiveFiveCustom1 paper',true)}">
                                                    <ui:repeat value="#{collectingCentreBillController.bills}" var="pp">
                                                        <bi:ccSelfBilling_fiveFiveCCBill_Patient_Custom1 bill="#{pp}" duplicate="false"/>
                                                    </ui:repeat>
                                                </h:panelGroup>

                                            </h:panelGroup>
                                        </div>
                                    </div>
                                </p:panel>
                            </div>
                        </div>

                    </h:form>
                </div>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
