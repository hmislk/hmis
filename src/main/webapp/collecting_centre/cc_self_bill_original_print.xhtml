<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill/cc_bill">
    <h:head>
        <title>Collecting Centre Self Billing - Original Bill Print</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template_without_menu.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{not collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_not_available.css"/>
                    <h:form id="ccNotAvailableForm">
                        <ez:cc_self_billing_not_available/>
                    </h:form>
                </h:panelGroup>

                <h:panelGroup rendered="#{collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_bill.css"/>
                    <div class="cc-bill-page">
                        <h:form id="form">
                            <ez:cc_self_billing_header
                                pageTitle="Original Bill Print"
                                highlight="#{collectingCentreSelfSearchController.viewingBill.deptId}"
                                pageIcon="fa-solid fa-print"
                                backAction="#{collectingCentreSelfSearchController.navigateBackToReprintBill}"
                                backLabel="Back to Bill"/>

                            <h:panelGroup layout="block" styleClass="alert alert-danger" rendered="#{not webUserController.hasPrivilege('CollectingCentreReprintOriginalBill')}">
                                <h:outputText value="You are not authorized to print the original bill."/>
                            </h:panelGroup>

                            <h:panelGroup layout="block" styleClass="alert alert-warning" rendered="#{collectingCentreSelfSearchController.viewingBill eq null and webUserController.hasPrivilege('CollectingCentreReprintOriginalBill')}">
                                <h:outputText value="No bill selected. Go back to Search Bills and pick a bill."/>
                            </h:panelGroup>

                            <h:panelGroup layout="block" styleClass="row" rendered="#{collectingCentreSelfSearchController.viewingBill ne null and webUserController.hasPrivilege('CollectingCentreReprintOriginalBill')}">
                                <div class="col-md-6">
                                    <p:panel>
                                        <f:facet name="header">
                                            <p:outputLabel value="Bill for Collecting Center" class="mt-2"/>
                                            <p:commandButton
                                                value="Print"
                                                type="button"
                                                class="ui-button-info"
                                                icon="fa fa-print"
                                                style="float: right;">
                                                <p:printer target="centerBillPreview"/>
                                            </p:commandButton>
                                        </f:facet>

                                        <h:panelGroup id="centerBillPreview">
                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('CC Self Billing - Bill For Center(CC) : Size is FiveFiveCustom1 paper',true)}">
                                                <bi:ccSelfBilling_fiveFiveCCBill_CC_Custom1 bill="#{collectingCentreSelfSearchController.viewingBill}" duplicate="false"/>
                                            </h:panelGroup>
                                        </h:panelGroup>
                                    </p:panel>
                                </div>

                                <div class="col-md-6">
                                    <p:panel>
                                        <f:facet name="header">
                                            <p:outputLabel value="Bill for Patient" class="mt-2"/>
                                            <p:commandButton
                                                value="Print Patient"
                                                type="button"
                                                class="ui-button-info"
                                                icon="fa fa-print"
                                                style="float: right;">
                                                <p:printer target="patientBillPreview"/>
                                            </p:commandButton>
                                        </f:facet>

                                        <h:panelGroup id="patientBillPreview">
                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('CC Self Billing - Bill For Patient : Size is FiveFiveCustom1 paper',true)}">
                                                <bi:ccSelfBilling_fiveFiveCCBill_Patient_Custom1 bill="#{collectingCentreSelfSearchController.viewingBill}" duplicate="false"/>
                                            </h:panelGroup>
                                        </h:panelGroup>
                                    </p:panel>
                                </div>
                            </h:panelGroup>
                        </h:form>
                    </div>
                </h:panelGroup>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
