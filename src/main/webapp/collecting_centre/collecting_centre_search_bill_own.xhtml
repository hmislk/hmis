<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <p:panel>
                        <f:facet name="header">
                            <h:outputText styleClass="fas fa-warehouse"/>
                            <h:outputText class="mx-4" value="Collecting Center Bill Search"/>
                        </f:facet>
                        <div class="row">
                            <div class="col-md-2">
                                <h:outputLabel value="From Date"/>
                                <p:calendar styleClass="dateTimePicker" id="fromDate" value="#{searchController.fromDate}" navigator="false" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" class="w-100" inputStyleClass="form-control" maxdate="#{commonFunctionsProxy.endOfDayOnCurrentDate}">
                                </p:calendar>
                                <h:outputLabel value="To Date"/>
                                <p:calendar id="toDate" value="#{searchController.toDate}" navigator="false" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" class="w-100" inputStyleClass="form-control" maxdate="#{commonFunctionsProxy.endOfDayOnCurrentDate}">
                                </p:calendar>

                                <p:commandButton
                                    id="btnSearch"
                                    class="ui-button-warning w-100 mt-2 mb-3"
                                    icon="fas fa-search"
                                    ajax="false"
                                    value="Search"
                                    action="#{searchController.collectingCentreBillSearch}">
                                </p:commandButton>

                                <h:outputLabel value="Collecting Center Name"/>
                                <p:autoComplete
                                    converter="deal"
                                    value="#{searchController.institution}"
                                    forceSelection="true"
                                    id="acColl"
                                    completeMethod="#{institutionController.completeCollectingCenter}"
                                    var="vt"
                                    itemLabel="#{vt.name}"
                                    itemValue="#{vt}"
                                    maxResults="20"
                                    class="w-100 mb-1"
                                    inputStyleClass="form-control">
                                    <p:column style="padding: 4px;">#{vt.institutionCode}</p:column>
                                    <p:column style="padding: 4px;">#{vt.name}</p:column>
                                </p:autoComplete>
                                <h:outputLabel value="Bill No"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.billNo}" class="w-100" />
                                <h:outputLabel value="Patient Name"/>
                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.patientName}" class="w-100"/>
                                <h:outputLabel value="Patient Phone"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.patientPhone}" class="w-100"/>
                                <h:outputLabel value="Total"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.total}" class="w-100"/>
                                <h:outputLabel value="Net Total"/>

                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.netTotal}" class="w-100"/>

                            </div>
                            <div class="col-md-10">
                                <p:dataTable
                                    rowIndexVar="i"
                                    id="tblBills"
                                    value="#{searchController.bills}"
                                    var="bill"
                                    style="min-width: 100%;"
                                    paginator="true"
                                    rows="15"
                                    paginatorPosition="bottom"
                                    paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                    rowsPerPageTemplate="15,25,50,100">
                                    
                                    <p:column headerText="No" styleClass="alignTop" style="width: 20px; padding: 8px;">
                                        <h:outputLabel value="#{i+1}"/>
                                    </p:column>
                                    
                                    <p:column headerText="Billed No" width="13em;" style="padding: 8px;">
                                        <p:commandLink 
                                            ajax="false"
                                            value="#{bill.deptId}"
                                            action="#{billSearch.navigateToViewBillByAtomicBillType()}">
                                            <f:setPropertyActionListener target="#{billSearch.bill}" value="#{bill}"/>
                                        </p:commandLink>
                                    </p:column>
                                    
                                    <p:column headerText="CC Code" width="6em;" style="padding: 8px;">
                                        <h:outputLabel value="#{bill.collectingCentre.code}" />
                                    </p:column>
                                    
                                    <p:column headerText="Collecting Centre"  style="padding: 8px;" >
                                        <h:outputLabel value="#{bill.collectingCentre.name}" />
                                    </p:column>
                                    
                                    <p:column headerText="Billed At" width="10em;" style="padding: 8px;" >
                                        <h:outputLabel value="#{bill.createdAt}" >
                                            <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                        </h:outputLabel>
                                    </p:column>
                                    
                                    <p:column headerText="Patient" style="padding: 8px;">
                                        <h:outputLabel value="#{bill.patient.person.nameWithTitle}" rendered="#{!webUserController.hasPrivilege('OpdBillSearchEdit')}"/>
                                        <h:commandLink value="#{bill.patient.person.nameWithTitle}" action="#{patientController.navigateToOpdPatientEdit()}" rendered="#{webUserController.hasPrivilege('OpdBillSearchEdit')}">
                                            <f:setPropertyActionListener value="#{bill.patient}" target="#{patientController.current}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Patient Phone No" width="10em;" style="padding: 8px;">
                                        <h:outputLabel value="#{bill.patient.person.phone}" />
                                    </p:column>

                                    <p:column headerText="Billed By" width="8em;" style="padding: 8px;">
                                        <h:outputLabel value="#{bill.creater.name}" />
                                    </p:column>
                                    
                                    <p:column headerText="Status" width="8em;" class="text-center" style="padding: 8px;">
                                        <p:badge rendered="#{bill.cancelled}" value="Cancelled" severity="danger" styleClass="mr-2"></p:badge>
                                        <p:badge rendered="#{bill.refunded}" value="Refunded" severity="warning" styleClass="mr-2"></p:badge>
                                        
                                        <h:panelGroup rendered="#{bill.currentRequest ne null}">
                                            <p:badge value="Request #{bill.currentRequest.status.label}" severity="warning" styleClass="mr-2"></p:badge>
                                        </h:panelGroup>
                                    </p:column>

                                    <p:column headerText="Gross Value" width="8em;" class="text-end" style="padding: 8px;">
                                        <h:outputLabel value="#{bill.total}" >
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputLabel>
                                    </p:column>
                                    
                                    <p:column headerText="Discount" width="8em;" class="text-end" style="padding: 8px;">
                                        <h:outputLabel value="#{bill.discount}" >
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputLabel>
                                    </p:column>
                                    
                                    <p:column headerText="Net Value" width="8em;" class="text-end" style="padding: 8px;">
                                        <h:outputLabel value="#{bill.netTotal}" >
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputLabel>
                                    </p:column>

                                </p:dataTable>

                            </div>
                        </div>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
