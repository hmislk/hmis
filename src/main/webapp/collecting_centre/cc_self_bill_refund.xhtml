<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill/cc_bill">
    <h:head>
        <title>Collecting Centre Self Billing - Bill Refund</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template_without_menu.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{not collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_not_available.css"/>
                    <h:form id="ccNotAvailableForm">
                        <ez:cc_self_billing_not_available/>
                    </h:form>
                </h:panelGroup>

                <h:panelGroup rendered="#{collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_bill.css"/>
                    <div class="cc-bill-page">
                        <h:form id="form">
                            <ez:cc_self_billing_header
                                pageTitle="Bill Refund"
                                highlight="#{billSearch.bill.deptId}"
                                pageIcon="fa-solid fa-money-bill-wave"
                                backAction="#{collectingCentreSelfSearchController.navigateBackToReprintBill}"
                                backLabel="Back to Bill"/>

                            <h:panelGroup layout="block" styleClass="alert alert-warning" rendered="#{billSearch.bill eq null}">
                                <h:outputText value="No bill selected. Go back to Search Bills and pick a bill."/>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{billSearch.bill ne null and not billSearch.printPreview}">
                                <!-- Bill summary -->
                                <div class="cc-balance-grid mx-1">
                                    <div class="cc-balance-stat cc-c-blue cc-balance-stat-highlight">
                                        <span class="cc-balance-stat-icon">
                                            <h:outputText styleClass="fas fa-receipt"/>
                                        </span>
                                        <span class="cc-balance-stat-body">
                                            <span class="cc-balance-stat-label">Bill No</span>
                                            <h:outputText styleClass="cc-balance-stat-value" value="#{billSearch.bill.deptId}"/>
                                        </span>
                                    </div>
                                    <div class="cc-balance-stat cc-c-purple">
                                        <span class="cc-balance-stat-icon">
                                            <h:outputText styleClass="fas fa-calendar-day"/>
                                        </span>
                                        <span class="cc-balance-stat-body">
                                            <span class="cc-balance-stat-label">Billed At</span>
                                            <h:outputText styleClass="cc-balance-stat-value" value="#{billSearch.bill.createdAt}">
                                                <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateTimeFormat}"/>
                                            </h:outputText>
                                        </span>
                                    </div>
                                    <div class="cc-balance-stat cc-c-green">
                                        <span class="cc-balance-stat-icon">
                                            <h:outputText styleClass="fas fa-building"/>
                                        </span>
                                        <span class="cc-balance-stat-body">
                                            <span class="cc-balance-stat-label">Collecting Centre</span>
                                            <h:outputText styleClass="cc-balance-stat-value" value="#{billSearch.bill.collectingCentre.code}"/>
                                        </span>
                                    </div>
                                    <div class="cc-balance-stat cc-c-red">
                                        <span class="cc-balance-stat-icon">
                                            <h:outputText styleClass="fas fa-coins"/>
                                        </span>
                                        <span class="cc-balance-stat-body">
                                            <span class="cc-balance-stat-label">Net Total</span>
                                            <h:outputText styleClass="cc-balance-stat-value" value="#{billSearch.bill.netTotal}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputText>
                                        </span>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-7">
                                        <p:panel styleClass="cc-bill-card cc-c-blue m-1">
                                            <f:facet name="header">
                                                <h:outputText styleClass="fas fa-list-check"/>
                                                <h:outputText value="Select Items to Refund" class="mx-2"/>
                                            </f:facet>
                                            <p:dataTable
                                                id="dtF"
                                                rowIndexVar="rowIndex"
                                                value="#{billSearch.billItems}"
                                                var="b"
                                                selectionMode="multiple"
                                                rowKey="#{b.id}"
                                                selection="#{billSearch.refundingItems}"
                                                selectionDisabled="#{b.transRefund or b.refunded}"
                                                rowStyleClass="#{(b.transRefund or b.refunded) ? 'text-muted' : ''}"
                                                emptyMessage="No items in this bill">
                                                <p:ajax event="rowSelectCheckbox" listener="#{billSearch.calculateRefundTotal()}"
                                                        update=":#{p:resolveFirstComponentWithId('txtTotal',view).clientId}" process="colSelect dtF"/>
                                                <p:ajax event="rowUnselectCheckbox" listener="#{billSearch.calculateRefundTotal()}"
                                                        update=":#{p:resolveFirstComponentWithId('txtTotal',view).clientId}" process="colSelect dtF"/>
                                                <p:ajax event="toggleSelect" listener="#{billSearch.calculateRefundTotal()}"
                                                        update=":#{p:resolveFirstComponentWithId('txtTotal',view).clientId}" process="colSelect dtF"/>

                                                <p:column selectionBox="true" id="colSelect" width="2.5em"/>
                                                <p:column headerText="No" width="3em">
                                                    <h:outputText value="#{rowIndex+1}"/>
                                                </p:column>
                                                <p:column headerText="Item">
                                                    <h:outputText value="#{b.item.name}"/>
                                                    <p:tag severity="warning" value="Refunded" styleClass="mx-2" rendered="#{b.transRefund or b.refunded}"/>
                                                </p:column>
                                                <p:column headerText="Fee" width="9em" styleClass="text-end">
                                                    <h:outputText value="#{b.netValue}">
                                                        <f:convertNumber pattern="#,##0.00"/>
                                                    </h:outputText>
                                                </p:column>
                                            </p:dataTable>
                                        </p:panel>
                                    </div>

                                    <div class="col-md-5">
                                        <p:panel styleClass="cc-bill-card cc-c-orange m-1">
                                            <f:facet name="header">
                                                <h:outputText styleClass="fa-solid fa-money-bill-wave"/>
                                                <h:outputText value="Refund Selected Items" class="mx-2"/>
                                                <p:commandButton
                                                    ajax="false"
                                                    style="float: right;"
                                                    value="Refund Bill"
                                                    icon="fa fa-money-bill-wave"
                                                    styleClass="ui-button-warning"
                                                    title="Refund the selected items"
                                                    action="#{collectingCentreSelfSearchController.refundBill()}">
                                                    <p:confirm header="Confirm Refund" message="Are you sure you want to refund the selected items? This cannot be undone." icon="pi pi-exclamation-triangle"/>
                                                </p:commandButton>
                                            </f:facet>
                                            <div class="d-flex flex-column gap-3">
                                                <p:outputLabel for="txtComment" value="Reason for Refund"/>
                                                <p:inputText
                                                    id="txtComment"
                                                    placeholder="Enter a reason to refund"
                                                    value="#{billSearch.comment}"
                                                    styleClass="w-100"/>

                                                <div class="cc-bill-total-bar">
                                                    <span class="cc-bill-total-label">Refund Amount</span>
                                                    <h:outputText id="txtTotal" styleClass="cc-bill-total-value" value="#{billSearch.refundAmount}">
                                                        <f:convertNumber pattern="#,##0.00"/>
                                                    </h:outputText>
                                                </div>
                                            </div>
                                        </p:panel>

                                        <p:panel styleClass="cc-bill-card cc-c-purple m-1">
                                            <f:facet name="header">
                                                <h:outputText styleClass="fas fa-id-card-alt"/>
                                                <h:outputText value="Patient Details" class="mx-2"/>
                                            </f:facet>
                                            <common:patient patient="#{billSearch.bill.patient}" class="w-100"/>
                                        </p:panel>
                                    </div>
                                </div>

                                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" styleClass="cc-confirm-dialog" closeOnEscape="true">
                                    <p:commandButton value="Yes, Refund" type="button" styleClass="ui-confirmdialog-yes ui-button-warning" icon="pi pi-check" onclick="PF('ccProcessingDlg').show();"/>
                                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
                                </p:confirmDialog>

                                <p:dialog widgetVar="ccProcessingDlg" modal="true" closable="false" resizable="false" draggable="false" showHeader="false" styleClass="cc-settling-dialog">
                                    <div class="cc-settling-body">
                                        <span class="cc-settling-spinner">
                                            <h:outputText styleClass="fa fa-spinner fa-spin"/>
                                        </span>
                                        <div class="cc-settling-text">
                                            <span class="cc-settling-title">Refunding Bill</span>
                                            <span class="cc-settling-subtitle">Please wait, this will only take a moment...</span>
                                        </div>
                                    </div>
                                </p:dialog>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{billSearch.bill ne null and billSearch.printPreview}">
                                <div class="d-flex justify-content-end mb-3 mx-2">
                                    <p:commandButton
                                        value="Back to Search"
                                        icon="fa-solid fa-magnifying-glass"
                                        ajax="false"
                                        styleClass="ui-button-info ui-button-outlined mx-1"
                                        action="#{collectingCentreSelfSearchController.navigateBackToSearchBills}"/>
                                </div>
                                <div class="row justify-content-center">
                                    <div class="col-md-6">
                                        <p:panel styleClass="cc-bill-card cc-c-orange">
                                            <f:facet name="header">
                                                <h:outputText styleClass="fa-solid fa-money-bill-wave"/>
                                                <h:outputText value="Refund Bill" class="mx-2"/>
                                                <p:commandButton
                                                    value="Print"
                                                    type="button"
                                                    styleClass="ui-button-info"
                                                    icon="fa fa-print"
                                                    style="float: right;">
                                                    <p:printer target="refundBillPreview"/>
                                                </p:commandButton>
                                            </f:facet>
                                            <h:panelGroup id="refundBillPreview">
                                                <bi:fiveFiveCCBill_CC_Refund_Custom1 bill="#{billSearch.bill}" duplicate="false"/>
                                            </h:panelGroup>
                                        </p:panel>
                                    </div>
                                </div>
                            </h:panelGroup>
                        </h:form>
                    </div>
                </h:panelGroup>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
