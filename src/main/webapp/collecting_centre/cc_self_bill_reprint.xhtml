<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill/cc_bill">
    <h:head>
        <title>Collecting Centre Self Billing - Bill Reprint</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template_without_menu.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{not collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_not_available.css"/>
                    <h:form id="ccNotAvailableForm">
                        <ez:cc_self_billing_not_available/>
                    </h:form>
                </h:panelGroup>

                <h:panelGroup rendered="#{collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_bill.css"/>
                    <div class="cc-bill-page">
                        <h:form id="form">
                            <ez:cc_self_billing_header
                                pageTitle="Bill Reprint"
                                highlight="#{collectingCentreSelfSearchController.viewingBill.deptId}"
                                pageIcon="fa-solid fa-print"
                                backAction="#{collectingCentreSelfSearchController.navigateBackToSearchBills}"
                                backLabel="Back to Search"/>

                            <h:panelGroup layout="block" styleClass="alert alert-warning" rendered="#{collectingCentreSelfSearchController.viewingBill eq null}">
                                <h:outputText value="No bill selected. Go back to Search Bills and pick a bill."/>
                            </h:panelGroup>

                            <h:panelGroup layout="block" styleClass="alert alert-warning text-center mx-2 mb-2" rendered="#{collectingCentreSelfSearchController.viewingBill ne null and not collectingCentreSelfSearchController.viewingSelfBill}">
                                <div>
                                    <div class="fw-bold fs-3 mb-1"><i class="fa-solid fa-triangle-exclamation me-2"></i>Hospital Billing</div>
                                    <div>This bill was created by the hospital. Cancel and refund must be done by the hospital.</div>
                                </div>
                            </h:panelGroup>

                            <h:panelGroup layout="block" styleClass="d-flex justify-content-end mb-3 mx-2" rendered="#{collectingCentreSelfSearchController.viewingBill ne null}">
                                <p:commandButton
                                    value="Print Original Bill"
                                    class="ui-button-info m-1"
                                    icon="fa fa-print"
                                    action="#{collectingCentreSelfSearchController.navigateToOriginalBillPrint()}"
                                    rendered="#{webUserController.hasPrivilege('CollectingCentreReprintOriginalBill')}"
                                    ajax="false"/>
                                <p:commandButton
                                    value="To Cancel"
                                    class="ui-button-danger m-1"
                                    icon="fa fa-times"
                                    action="#{collectingCentreSelfSearchController.navigateToCancelBill()}"
                                    disabled="#{collectingCentreSelfSearchController.viewingBill.cancelled or collectingCentreSelfSearchController.viewingBill.refunded}"
                                    rendered="#{collectingCentreSelfSearchController.viewingSelfBill}"
                                    ajax="false"/>
                                <p:commandButton
                                    value="To Refund"
                                    class="ui-button-warning m-1"
                                    icon="fa fa-money-bill-wave"
                                    action="#{collectingCentreSelfSearchController.navigateToRefundBill()}"
                                    disabled="#{collectingCentreSelfSearchController.viewingBill.cancelled or not billReturnController.checkCanReturnBill(collectingCentreSelfSearchController.viewingBill)}"
                                    rendered="#{collectingCentreSelfSearchController.viewingSelfBill}"
                                    ajax="false"/>
                                <p:commandButton
                                    value="To Sample Management"
                                    class="ui-button-info m-1"
                                    icon="fas fa-flask"
                                    action="#{collectingCentreSelfCommonController.navigateToSelfSampleManagementFromBill(collectingCentreSelfSearchController.viewingBill)}"
                                    ajax="false"/>
                            </h:panelGroup>

                            <h:panelGroup layout="block" styleClass="row" rendered="#{collectingCentreSelfSearchController.viewingBill ne null}">
                                <div class="col-md-6">
                                    <p:panel>
                                        <f:facet name="header">
                                            <p:outputLabel value="Bill for Collecting Center" class="mt-2"/>
                                            <p:commandButton
                                                value="Print"
                                                type="button"
                                                class="ui-button-info"
                                                icon="fa fa-print"
                                                style="float: right;">
                                                <p:printer target="centerBillPreview"/>
                                            </p:commandButton>
                                        </f:facet>

                                        <h:panelGroup id="centerBillPreview">
                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('CC Self Billing - Bill For Center(CC) : Size is FiveFiveCustom1 paper',true)}">
                                                <bi:ccSelfBilling_fiveFiveCCBill_CC_Custom1 bill="#{collectingCentreSelfSearchController.viewingBill}" duplicate="true"/>
                                            </h:panelGroup>
                                        </h:panelGroup>
                                    </p:panel>
                                </div>

                                <div class="col-md-6">
                                    <p:panel>
                                        <f:facet name="header">
                                            <p:outputLabel value="Bill for Patient" class="mt-2"/>
                                            <p:commandButton
                                                value="Print Patient"
                                                type="button"
                                                class="ui-button-info"
                                                icon="fa fa-print"
                                                style="float: right;">
                                                <p:printer target="patientBillPreview"/>
                                            </p:commandButton>
                                        </f:facet>

                                        <h:panelGroup id="patientBillPreview">
                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('CC Self Billing - Bill For Patient : Size is FiveFiveCustom1 paper',true)}">
                                                <bi:ccSelfBilling_fiveFiveCCBill_Patient_Custom1 bill="#{collectingCentreSelfSearchController.viewingBill}" duplicate="true"/>
                                            </h:panelGroup>
                                        </h:panelGroup>
                                    </p:panel>
                                </div>
                            </h:panelGroup>
                        </h:form>
                    </div>
                </h:panelGroup>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
