<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill/cc_bill">
    <h:head>
        <title>Collecting Centre Self Billing - Bill Cancellation</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template_without_menu.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{not collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_not_available.css"/>
                    <h:form id="ccNotAvailableForm">
                        <ez:cc_self_billing_not_available/>
                    </h:form>
                </h:panelGroup>

                <h:panelGroup rendered="#{collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_bill.css"/>
                    <div class="cc-bill-page">
                        <h:form id="form">
                            <ez:cc_self_billing_header
                                pageTitle="Bill Cancellation"
                                highlight="#{billSearch.bill.deptId}"
                                pageIcon="fa-solid fa-ban"
                                backAction="#{collectingCentreSelfSearchController.navigateBackToReprintBill}"
                                backLabel="Back to Bill"/>

                            <h:panelGroup layout="block" styleClass="alert alert-warning" rendered="#{billSearch.bill eq null}">
                                <h:outputText value="No bill selected. Go back to Search Bills and pick a bill."/>
                            </h:panelGroup>

                            <h:panelGroup rendered="#{billSearch.bill ne null and not billSearch.printPreview}">
                                <div class="d-flex justify-content-end gap-3 mb-3 mx-2">
                                    <p:selectOneMenu
                                        id="commentsMenu"
                                        value="#{billSearch.comment}"
                                        editable="true"
                                        disabled="#{billSearch.bill.currentRequest ne null}"
                                        filter="true"
                                        placeholder="Select or enter a comment"
                                        filterMatchMode="contains"
                                        style="width: 500px;">
                                        <f:selectItem itemLabel="Select or enter a comment" itemValue="" noSelectionOption="true"/>
                                        <f:selectItems
                                            value="#{configOptionApplicationController.getListOfCustomOptions('OPD Bill Cancellation Comments')}"
                                            var="option"
                                            itemLabel="#{option}"
                                            itemValue="#{option}"/>
                                    </p:selectOneMenu>

                                    <p:commandButton
                                        ajax="false"
                                        value="Cancel Bill"
                                        icon="fa-solid fa-ban"
                                        class="ui-button-danger"
                                        disabled="#{billSearch.bill.cancelled or billSearch.bill.refunded}"
                                        action="#{billSearch.cancelCollectingCentreBill()}"
                                        onclick="if (!confirm('Are you sure you want to Cancel This Bill ?'))
                                                    return false;">
                                    </p:commandButton>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <p:panel>
                                            <f:facet name="header">
                                                <h:outputText styleClass="fas fa-id-card-alt"/>
                                                <h:outputLabel value="Patient Details" class="mx-2"/>
                                            </f:facet>
                                            <common:patient patient="#{billSearch.bill.patient}" class="w-100"/>
                                        </p:panel>
                                    </div>
                                    <div class="col-md-6">
                                        <p:panel>
                                            <f:facet name="header">
                                                <h:outputText styleClass="fas fa-list-alt"/>
                                                <h:outputLabel value="Bill Detail" class="mx-2"/>
                                            </f:facet>
                                            <p:panelGrid columns="2">
                                                <h:outputLabel value="Collecting Centre Name:"/>
                                                <h:outputLabel value="#{billSearch.bill.collectingCentre.name}"/>
                                                <h:outputLabel value="Collecting Centre Code:"/>
                                                <h:outputLabel value="#{billSearch.bill.collectingCentre.code}"/>
                                                <h:outputLabel value="Route :"/>
                                                <h:outputLabel value="#{billSearch.bill.collectingCentre.route.name}"/>
                                                <h:outputLabel value="Bill No :"/>
                                                <h:outputLabel value="#{billSearch.bill.deptId}"/>
                                                <h:outputLabel value="Total :"/>
                                                <h:outputLabel value="#{billSearch.bill.total}">
                                                    <f:convertNumber pattern="#,##0.00"/>
                                                </h:outputLabel>
                                                <h:outputLabel value="Discount :"/>
                                                <h:outputLabel value="#{billSearch.bill.discount}">
                                                    <f:convertNumber pattern="#,##0.00"/>
                                                </h:outputLabel>
                                                <h:outputLabel value="Net Total :"/>
                                                <h:outputLabel value="#{billSearch.bill.netTotal}">
                                                    <f:convertNumber pattern="#,##0.00"/>
                                                </h:outputLabel>
                                            </p:panelGrid>
                                        </p:panel>
                                    </div>
                                </div>

                                <p:panel class="mt-3">
                                    <f:facet name="header">
                                        <h:outputText styleClass="fas fa-list-alt"/>
                                        <h:outputLabel value="Bill Item Detail" class="mx-2"/>
                                    </f:facet>
                                    <p:dataTable rowIndexVar="rowIndex" value="#{billBeanController.fetchBillItems(billSearch.bill)}" var="bip">
                                        <p:column headerText="No" width="3em">
                                            <h:outputLabel value="#{rowIndex+1}"/>
                                        </p:column>
                                        <p:column headerText="Item">
                                            <h:outputLabel value="#{bip.item.name}"/>
                                        </p:column>
                                        <p:column headerText="Fee" styleClass="text-end">
                                            <h:outputLabel value="#{bip.netValue}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputLabel>
                                        </p:column>
                                    </p:dataTable>
                                </p:panel>
                            </h:panelGroup>

                            <p:panel rendered="#{billSearch.bill ne null and billSearch.printPreview}">
                                <f:facet name="header">
                                    <p:outputLabel value="Cancellation Bill" class="mt-2"/>
                                    <p:commandButton
                                        value="Print"
                                        type="button"
                                        class="ui-button-info"
                                        icon="fa fa-print"
                                        style="float: right;">
                                        <p:printer target="cancelBillPreview"/>
                                    </p:commandButton>
                                </f:facet>
                                <h:panelGroup id="cancelBillPreview">
                                    <bi:fiveFiveCancelledCCBill_CC_Custom1 bill="#{billSearch.bill.cancelledBill}" duplicate="false"/>
                                </h:panelGroup>
                            </p:panel>
                        </h:form>
                    </div>
                </h:panelGroup>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
