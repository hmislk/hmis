<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:lab="http://xmlns.jcp.org/jsf/composite/ezcomp/lab">
    <h:head>
        <title>Collecting Centre Self Billing - Report View</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template_without_menu.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{not collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_not_available.css"/>
                    <h:form id="ccNotAvailableForm">
                        <ez:cc_self_billing_not_available/>
                    </h:form>
                </h:panelGroup>

                <h:panelGroup rendered="#{collectingCentreSelfCommonController.collectingCentreDepartment}">
                    <h:outputStylesheet library="css" name="collecting_centre_self_billing_bill.css"/>
                    <h:outputScript library="js" name="cc_self_billing_fit_screen.js" target="body"/>
                    <h:outputStylesheet library="css" name="lab.css"/>

                    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js" integrity="sha512-pdCVFUWsxl1A4g0uV6fyJ3nrnTGeWnZN2Tl/56j45UvZ1OMdm9CIbctuIHj+yBIRTUUyv6I9+OivXj4i0LPEYA==" crossorigin="anonymous"></script>

                    <div class="cc-bill-page">
                        <h:form id="form">
                            <ez:cc_self_billing_header
                                pageTitle="Report View"
                                highlightCode="#{sessionController.institution.code}"
                                highlightName="#{sessionController.institution.name}"
                                pageIcon="fa-solid fa-file-medical"
                                backAction="#{collectingCentreSelfCommonController.navigateBackToCollectingCentreSelfSampleManagement}"
                                backLabel="Back to Sample Management"/>

                            <p:growl id="msg"/>

                            <h:panelGroup rendered="#{not collectingCentreSelfCommonController.selfReportPrintAllowed}">
                                <div class="alert alert-warning">
                                    <h:outputText value="No approved report of your collecting centre is selected. Please go back to Sample Management and select a report to print."/>
                                </div>
                            </h:panelGroup>

                            <p:panel styleClass="cc-bill-card cc-c-red" rendered="#{collectingCentreSelfCommonController.selfReportPrintAllowed}">
                                <f:facet name="header">
                                    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center w-100">
                                        <div>
                                            <h:outputText styleClass="fa-solid fa-file-medical"/>
                                            <h:outputText value="Report View" class="mx-2"/>
                                            <h:outputText value="#{patientReportController.currentPatientReport.patientInvestigation.investigation.name}" class="text-muted"/>
                                        </div>
                                        <div class="d-flex flex-wrap gap-2">
                                            <p:remoteCommand
                                                name="recordExportHistory"
                                                actionListener="#{patientReportController.reportExport()}"
                                                async="true"/>

                                            <p:remoteCommand
                                                name="recordPrintHistory"
                                                actionListener="#{patientReportController.printPatientReport()}"
                                                async="true"/>

                                            <p:commandButton
                                                value="Export PDF"
                                                icon="fas fa-file-pdf"
                                                class="ui-button-channelling"
                                                disabled="#{!patientReportController.currentPatientReport.approved}"
                                                type="button"
                                                onclick="downloadPdf()"/>

                                            <p:commandButton
                                                value="Print"
                                                icon="fas fa-print"
                                                class="ui-button-info"
                                                ajax="false"
                                                onclick="recordPrintHistory();">
                                                <p:printer target="divPrint"/>
                                            </p:commandButton>
                                        </div>
                                    </div>
                                </f:facet>

                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Need to record the history of issuing lab reports.',true) and patientReportController.currentPatientReport.approved}">
                                    <div class="d-flex justify-content-end mb-3">
                                        <p:commandButton
                                            ajax="false"
                                            value="Handover to Patient"
                                            icon="fa-solid fa-people-carry-box"
                                            class="ui-button-stores"
                                            action="#{laboratoryManagementController.addIssueHistory()}"/>
                                    </div>
                                </h:panelGroup>

                                <div class="d-flex flex-wrap align-items-center justify-content-end">
                                    <h:outputLabel value="Show Background" for="btnBackground" class="mx-1 my-1" style="font-weight: bold; font-size: 20px;"/>
                                    <p:selectBooleanButton id="btnBackground" class="mt-1 mx-4 my-1" offLabel="No" onLabel="Yes" value="#{patientReportController.showBackground}">
                                        <p:ajax process="@this" update="divPrint" event="change"/>
                                    </p:selectBooleanButton>
                                </div>

                                <style>
                                    @media print {
                                        /* The report box is a full A4 page (297mm) with its own
                                           margins, so print it edge to edge on one sheet. Browser
                                           page margins and the template's body padding-bottom
                                           (copied into the print frame by p:printer) otherwise
                                           push it onto a second, blank page. */
                                        @page {
                                            size: A4;
                                            margin: 0;
                                        }
                                        html, body {
                                            margin: 0 !important;
                                            padding: 0 !important;
                                        }
                                        .labReport {
                                            position: static !important;
                                            height: 296mm !important;
                                            page-break-after: avoid;
                                            break-after: avoid;
                                        }
                                        #divReportM {
                                            position: static !important;
                                        }
                                    }
                                </style>

                                <h:outputScript library="js" name="lab-report-pdf.js" target="body"/>
                                <script>
                                    function downloadPdf() {
                                        recordExportHistory();
                                        if (window.ccFitScreen) {
                                            ccFitScreen.reset();
                                        }
                                        const element = document.getElementById('pdf');
                                        element.classList.remove('print-only');
                                        const opt = {
                                            margin: [0, 0, 0, 0],
                                            filename: '#{patientReportController.currentPatientReport.patientInvestigation.billItem.bill.patient.person.nameWithTitle} - #{patientReportController.currentPatientReport.patientInvestigation.investigation.name}.pdf',
                                            image: {type: 'jpeg', quality: 1.00},
                                            html2canvas: {scale: 2, useCORS: true, allowTaint: false},
                                            jsPDF: {unit: 'mm', format: [210, 297], orientation: 'portrait'}
                                        };
                                        html2pdf().from(element).set(opt).toPdf().get('pdf').then(function (pdf) {
                                            return labReportTrimPdf(pdf, element);
                                        }).save().then(() => {
                                            element.classList.add('print-only');
                                            if (window.ccFitScreen) {
                                                ccFitScreen.fit();
                                            }
                                        });
                                    }
                                </script>

                                <div class="d-flex justify-content-center cc-scroll-x cc-fit-screen">
                                    <div class="cc-fit-inner">
                                        <h:panelGroup id="divPrint">
                                            <div id="pdf">
                                                <!--HtmlTemplate-->
                                                <lab:html_patient_report/>

                                                <!--General-->
                                                <lab:general_patient_report/>

                                                <!--Microbiology-->
                                                <lab:microbiology_patient_report/>

                                                <!--PathologyOrHaematology-->
                                                <lab:pathology_patient_report/>
                                            </div>
                                        </h:panelGroup>
                                    </div>
                                </div>
                            </p:panel>
                        </h:form>
                    </div>
                </h:panelGroup>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
