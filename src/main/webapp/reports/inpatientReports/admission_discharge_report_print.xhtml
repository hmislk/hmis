<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">

                <h:form>

                    <p:panel styleClass="w-100">

                        <f:facet name="header">
                            <div class="d-flex justify-content-between">
                                <h:outputText value="Admission Discharge Report Print" class="mt-2"/>

                                <div class="d-flex gap-2">
                                    <p:commandButton
                                        type="button"
                                        icon="fa-solid fa-print"
                                        class="ui-button-info"
                                        style="width:150px"
                                        value="Print">
                                        <p:printer target="reportView"/>
                                    </p:commandButton>

                                    <p:commandButton
                                        ajax="false"
                                        value="Back to Report"
                                        icon="fa fa-arrow-left"
                                        class="ui-button-warning"
                                        action="admission_discharge_report?faces-redirect=true"/>
                                </div>
                            </div>
                        </f:facet>

                        <style>
                            .ad-print-table {
                                border-collapse: collapse;
                                width: 100%;
                                font-size: 8px;
                            }

                            .ad-print-table th,
                            .ad-print-table td {
                                border: 1px solid #000;
                                padding: 2px 3px;
                                vertical-align: top;
                                word-wrap: break-word;
                            }

                            .ad-print-table th {
                                background: #e9eef6;
                                font-weight: bold;
                                text-align: center;
                            }

                            .ad-print-table .num {
                                text-align: right;
                                white-space: nowrap;
                            }

                            .ad-print-criteria td {
                                padding: 1px 8px 1px 0;
                                font-size: 10px;
                            }

                            @media print {
                                @page {
                                    size: A3 landscape;
                                    margin: 8mm;
                                }

                                .ad-print-table {
                                    font-size: 6px;
                                }
                            }
                        </style>

                        <h:panelGroup id="reportView" layout="block" styleClass="paper">
                            <h3 class="text-center mb-2">Admission Discharge Report</h3>

                            <table class="ad-print-criteria mb-2">
                                <ui:repeat value="#{inwardReportController.admissionDischargeCriteria}" var="cr">
                                    <tr>
                                        <td><b><h:outputText value="#{cr[0]}"/></b></td>
                                        <td>: <h:outputText value="#{cr[1]}"/></td>
                                    </tr>
                                </ui:repeat>
                            </table>

                            <h:outputText value="No records for the selected criteria."
                                          rendered="#{empty inwardReportController.admissionDischargesList}"/>

                            <h:panelGroup rendered="#{not empty inwardReportController.admissionDischargesList}">
                                <table class="ad-print-table">
                                    <thead>
                                        <tr>
                                            <th>S.No</th>
                                            <ui:repeat value="#{inwardReportController.admissionDischargePrintColumns}" var="col">
                                                <th><h:outputText value="#{col.header}"/></th>
                                            </ui:repeat>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ui:repeat value="#{inwardReportController.admissionDischargesList}" var="row" varStatus="st">
                                            <tr>
                                                <td class="num"><h:outputText value="#{st.index + 1}"/></td>
                                                <ui:repeat value="#{inwardReportController.admissionDischargePrintColumns}" var="col">
                                                    <td class="#{col.numeric ? 'num' : ''}">
                                                        <h:outputText value="#{inwardReportController.formatAdmissionDischargeCell(row, col)}"/>
                                                    </td>
                                                </ui:repeat>
                                            </tr>
                                        </ui:repeat>
                                    </tbody>
                                </table>
                            </h:panelGroup>
                        </h:panelGroup>

                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
