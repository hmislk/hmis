<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">

                <!-- Shared print stylesheet: defines .paper, .table, th/td borders, .header -->
                <h:outputStylesheet library="css" name="printing/reportprint.css"/>

                <h:form>
                    <style>
                        @media screen, print {
                            /* Override paper width for landscape A3 wide table */
                            .paper {
                                width: 420mm !important;
                            }

                            /* Column width budget  (must sum to 100%) */
                            .col-sno          { width: 1.5%; }
                            .col-mrno         { width: 4%;   }
                            .col-patient-name { width: 6%;   }
                            .col-age          { width: 2%;   }
                            .col-gender       { width: 2%;   }
                            .col-visit        { width: 4%;   }
                            .col-adm-date     { width: 4%;   }
                            .col-adm-time     { width: 3%;   }
                            .col-req-no       { width: 4%;   }
                            .col-status       { width: 5%;   }
                            /* FROM group  (7 cols, ~31%) */
                            .col-f-hosp       { width: 5%;   }
                            .col-f-dept       { width: 5%;   }
                            .col-f-pcon       { width: 5%;   }
                            .col-f-con        { width: 3%;   }
                            .col-f-ward       { width: 5%;   }
                            .col-f-bed        { width: 4%;   }
                            .col-f-btype      { width: 4%;   }
                            /* TO group    (7 cols, ~31%) */
                            .col-t-hosp       { width: 5%;   }
                            .col-t-dept       { width: 5%;   }
                            .col-t-pcon       { width: 5%;   }
                            .col-t-con        { width: 3%;   }
                            .col-t-ward       { width: 5%;   }
                            .col-t-bed        { width: 4%;   }
                            .col-t-btype      { width: 4%;   }
                            /* Transfer tail */
                            .col-tf-date      { width: 3.5%; }
                            .col-tf-time      { width: 3%;   }
                            .col-tf-by        { width: 5%;   }
                            .col-tf-reason    { width: 5%;   }

                            /* Group header rows */
                            .grp-header th {
                                background-color: #d9e1f2 !important;
                                text-align: center !important;
                                font-size: 8pt !important;
                            }
                            .sub-header th {
                                background-color: #e9ecef !important;
                                text-align: center !important;
                                font-size: 7pt !important;
                            }
                            /* Override white-space for cells so long values wrap */
                            .table th, .table td {
                                white-space: normal !important;
                                overflow-wrap: break-word !important;
                                word-break: break-word !important;
                            }
                        }

                        @media print {
                            @page {
                                size: A3 landscape;
                                margin: 8mm;
                            }
                        }
                    </style>

                    <!-- Panel header with Print and Back buttons -->
                    <p:panel header="Room Change Print" styleClass="my-2">
                        <f:facet name="header">
                            <div class="d-flex justify-content-between">
                                <h:outputText value="Room Change Print" class="mt-2"/>
                                <div class="d-flex gap-2">
                                    <p:commandButton
                                        icon="fa-solid fa-print"
                                        class="ui-button-info"
                                        style="width:150px"
                                        ajax="false"
                                        value="Print">
                                        <p:printer target="report"/>
                                    </p:commandButton>
                                    <p:commandButton
                                        ajax="false"
                                        value="Back to Report"
                                        style="width:200px"
                                        icon="fa fa-arrow-left"
                                        class="ui-button-warning"
                                        action="room_change?faces-redirect=true"/>
                                </div>
                            </div>
                        </f:facet>
                    </p:panel>

                    <!-- Printable area -->
                    <h:panelGroup id="report" class="d-flex justify-content-center">
                        <div class="paper">

                            <!-- Report header -->
                            <div class="header">
                                <div class="d-flex justify-content-center" style="font-weight:700; font-size:18px;">
                                    <h:outputText value="#{sessionController.institution.name}"/>
                                </div>
                                <div class="d-flex justify-content-center" style="font-weight:700; font-size:15px;">
                                    <h:outputText value="Room Change Report"/>
                                </div>
                                <div class="d-flex justify-content-center m-2">
                                    <h:panelGrid columns="6" styleClass="report-header-table"
                                                 style="font-size:10px; width:90%;"
                                                 columnClasses="label,value,label,value,label,value">

                                        <h:outputText value="From Date:" styleClass="label"/>
                                        <h:outputText value="#{roomChangeReportController.fromDate}">
                                            <f:convertDateTime pattern="dd/MM/yyyy hh:mm a"/>
                                        </h:outputText>

                                        <h:outputText value="To Date:" styleClass="label"/>
                                        <h:outputText value="#{roomChangeReportController.toDate}">
                                            <f:convertDateTime pattern="dd/MM/yyyy hh:mm a"/>
                                        </h:outputText>

                                        <h:outputText value="From Ward:" styleClass="label"/>
                                        <h:outputText value="#{not empty roomChangeReportController.fromWard ? roomChangeReportController.fromWard.name : 'All'}"/>

                                        <h:outputText value="To Ward:" styleClass="label"/>
                                        <h:outputText value="#{not empty roomChangeReportController.toWard ? roomChangeReportController.toWard.name : 'All'}"/>

                                        <h:outputText value="Patient:" styleClass="label"/>
                                        <h:outputText value="#{not empty roomChangeReportController.selectedPatient ? roomChangeReportController.selectedPatient.patientName : 'All'}"/>

                                        <h:outputText value="Visit No:" styleClass="label"/>
                                        <h:outputText value="#{not empty roomChangeReportController.selectedBhtNo ? roomChangeReportController.selectedBhtNo.bhtNo : 'All'}"/>
                                    </h:panelGrid>
                                </div>
                            </div>

                            <!-- Native HTML table — never clipped by browser print dialog -->
                            <h:panelGroup rendered="#{not empty roomChangeReportController.roomChangeReportDtoList}">
                                <table class="table" style="table-layout:fixed; width:99.9%;">
                                    <colgroup>
                                        <col class="col-sno"/>
                                        <col class="col-mrno"/>
                                        <col class="col-patient-name"/>
                                        <col class="col-age"/>
                                        <col class="col-gender"/>
                                        <col class="col-visit"/>
                                        <col class="col-adm-date"/>
                                        <col class="col-adm-time"/>
                                        <col class="col-req-no"/>
                                        <col class="col-status"/>
                                        <!-- FROM -->
                                        <col class="col-f-hosp"/>
                                        <col class="col-f-dept"/>
                                        <col class="col-f-pcon"/>
                                        <col class="col-f-con"/>
                                        <col class="col-f-ward"/>
                                        <col class="col-f-bed"/>
                                        <col class="col-f-btype"/>
                                        <!-- TO -->
                                        <col class="col-t-hosp"/>
                                        <col class="col-t-dept"/>
                                        <col class="col-t-pcon"/>
                                        <col class="col-t-con"/>
                                        <col class="col-t-ward"/>
                                        <col class="col-t-bed"/>
                                        <col class="col-t-btype"/>
                                        <!-- Tail -->
                                        <col class="col-tf-date"/>
                                        <col class="col-tf-time"/>
                                        <col class="col-tf-by"/>
                                        <col class="col-tf-reason"/>
                                    </colgroup>
                                    <thead>
                                        <!-- ROW 1: top-level groups -->
                                        <tr class="grp-header">
                                            <th rowspan="2">S.No</th>
                                            <th rowspan="2">MRNO</th>
                                            <th rowspan="2">Patient Name</th>
                                            <th rowspan="2">Age</th>
                                            <th rowspan="2">Gender</th>
                                            <th rowspan="2">Visit</th>
                                            <th rowspan="2">Adm. Date</th>
                                            <th rowspan="2">Adm. Time</th>
                                            <th rowspan="2">Req. No.</th>
                                            <th rowspan="2">Status</th>
                                            <th colspan="7">FROM</th>
                                            <th colspan="7">TO</th>
                                            <th rowspan="2">Transfer Date</th>
                                            <th rowspan="2">Transfer Time</th>
                                            <th rowspan="2">Transfer By</th>
                                            <th rowspan="2">Reason</th>
                                        </tr>
                                        <!-- ROW 2: sub-column headers for FROM and TO groups -->
                                        <tr class="sub-header">
                                            <!-- FROM sub-headers -->
                                            <th>Hospital</th>
                                            <th>Department</th>
                                            <th>Primary Consultant</th>
                                            <th>Consultant</th>
                                            <th>Ward</th>
                                            <th>Bed No</th>
                                            <th>Bed Type</th>
                                            <!-- TO sub-headers -->
                                            <th>Hospital</th>
                                            <th>Department</th>
                                            <th>Primary Consultant</th>
                                            <th>Consultant</th>
                                            <th>Ward</th>
                                            <th>Bed No</th>
                                            <th>Bed Type</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ui:repeat value="#{roomChangeReportController.roomChangeReportDtoList}" var="detail" varStatus="loop">
                                            <tr>
                                                <td><h:outputText value="#{loop.index + 1}"/></td>
                                                <td><h:outputText value="#{detail.patientPhn}"/></td>
                                                <td><h:outputText value="#{detail.patientName}"/></td>
                                                <td><h:outputText value="#{detail.patientAge}"/></td>
                                                <td><h:outputText value="#{detail.patientSex}"/></td>
                                                <td><h:outputText value="#{detail.bhtNo}"/></td>
                                                <td>
                                                    <h:outputText value="#{detail.dateOfAdmission}">
                                                        <f:convertDateTime pattern="M/d/yyyy"/>
                                                    </h:outputText>
                                                </td>
                                                <td>
                                                    <h:outputText value="#{detail.dateOfAdmission}">
                                                        <f:convertDateTime pattern="HH:mm"/>
                                                    </h:outputText>
                                                </td>
                                                <td><h:outputText value="#{detail.transferRequestId}"/></td>
                                                <td><h:outputText value="#{detail.status}"/></td>
                                                <!-- FROM -->
                                                <td><h:outputText value="#{detail.fromHospital}"/></td>
                                                <td><h:outputText value="#{detail.fromDepartment}"/></td>
                                                <td><h:outputText value="#{detail.fromPrimaryConsultant}"/></td>
                                                <td></td><!-- from consultant: no source field yet -->
                                                <td><h:outputText value="#{detail.fromDepartment}"/></td>
                                                <td><h:outputText value="#{detail.fromWardRoomName}"/></td>
                                                <td><h:outputText value="#{detail.fromBedType}"/></td>
                                                <!-- TO -->
                                                <td><h:outputText value="#{detail.toHospital}"/></td>
                                                <td><h:outputText value="#{detail.toDepartment}"/></td>
                                                <td><h:outputText value="#{detail.toPrimaryConsultant}"/></td>
                                                <td></td><!-- to consultant: no source field yet -->
                                                <td><h:outputText value="#{detail.toDepartment}"/></td>
                                                <td><h:outputText value="#{detail.toWardRoomName}"/></td>
                                                <td><h:outputText value="#{detail.toBedType}"/></td>
                                                <!-- Transfer tail -->
                                                <td>
                                                    <h:outputText value="#{detail.acceptedAt}">
                                                        <f:convertDateTime pattern="M/d/yyyy"/>
                                                    </h:outputText>
                                                </td>
                                                <td>
                                                    <h:outputText value="#{detail.acceptedAt}">
                                                        <f:convertDateTime pattern="HH:mm"/>
                                                    </h:outputText>
                                                </td>
                                                <td><h:outputText value="#{detail.acceptedByName}"/></td>
                                                <td><h:outputText value="#{detail.notes}"/></td>
                                            </tr>
                                        </ui:repeat>
                                    </tbody>
                                </table>
                            </h:panelGroup>

                        </div>
                    </h:panelGroup>

                </h:form>

            </ui:define>
        </ui:composition>
    </h:body>
</html>
