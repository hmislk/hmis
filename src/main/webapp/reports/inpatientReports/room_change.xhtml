<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/reports/index.xhtml">
            <ui:define name="subcontent">
                <h:form>
                    <p:panel header="Room Change" class="w-100 my-2">

                        <h:panelGrid columns="6" class="w-100">



                            <!-- From Date -->
                            <h:panelGroup >
                                <h:outputText value="&#xf073;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="From Date"/>
                            </h:panelGroup>

                            <p:datePicker
                                id="fromdate"
                                value="#{roomChangeReportController.fromDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"
                                showTime="true"
                                timeInput="true"
                                yearNavigator="true"
                                monthNavigator="true"
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                />

                            <p:spacer width="20"/>

                            <!-- To Date -->
                            <h:panelGroup >
                                <h:outputText value="&#xf073;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="To Date"/>
                            </h:panelGroup>

                            <p:datePicker 
                                id ="toDate"
                                value="#{roomChangeReportController.toDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"
                                showTime="true"
                                timeInput="true"
                                yearNavigator="true"
                                monthNavigator="true"
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                />

                            <p:spacer width="20"/>
                            <!-- Patient Name -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText styleClass="fa fa-user mr-2"/>

                                <p:outputLabel value="Patient Name/MRN" for="acPatient" class="m-3"/>
                            </h:panelGroup>

                            <p:autoComplete id="acPatient"
                                            value="#{roomChangeReportController.selectedPatient}"
                                            converter="#{patientEncounterDtoConverter}"
                                            styleClass="w-100"
                                            inputStyleClass="w-100 form-control"
                                            placeholder="Patient Name/MRN"
                                            completeMethod="#{admissionController.completePatientPaymentFinalizedWithPhn}"
                                            forceSelection="true"
                                            maxResults="10"
                                            var="pe"
                                            itemLabel="#{pe.patientName}"
                                            itemValue="#{pe}">
                                <p:column headerText="Patient Name">
                                    <h:outputText value="#{pe.patientName}"/>
                                </p:column>
                                <p:column headerText="MRN">
                                    <h:outputText value="#{pe.phn}"/>
                                </p:column>
                            </p:autoComplete>

                            <p:spacer width="20"/>
                            <!-- Visit No -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText styleClass="fa fa-user mr-2"/>
                                <p:outputLabel value="Visit No" class="m-3"/>
                            </h:panelGroup>

                            <p:autoComplete id="acPatientMRN"
                                            value="#{roomChangeReportController.selectedBhtNo}"
                                            converter="#{patientEncounterDtoConverter}"
                                            styleClass="w-100"
                                            inputStyleClass="w-100 form-control"
                                            placeholder="Visit No"
                                            completeMethod="#{admissionController.completePatientPaymentFinalizedWithPhn}"
                                            forceSelection="true"
                                            maxResults="10"
                                            var="pe"
                                            itemLabel="#{pe.bhtNo}"
                                            itemValue="#{pe}">
                                <p:column headerText="MRN">
                                    <h:outputText value="#{pe.bhtNo}"/>
                                </p:column>
                                <p:column headerText="Patient Name">
                                    <h:outputText value="#{pe.patientName}"/>
                                </p:column>
                            </p:autoComplete>

                            <p:spacer width="20"/>
                            <!-- From Ward -->

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText styleClass="fa fa-map-marker-alt mr-2"/>
                                <p:outputLabel value="From Ward" class="m-3"/>
                            </h:panelGroup>

                             <p:autoComplete id="fwdbd"
                                            value="#{roomChangeReportController.fromWard}"
                                            styleClass="w-100"
                                            inputStyleClass="w-100 form-control"
                                            placeholder="From Ward"
                                            completeMethod="#{departmentController.completeInwardDepartments}"
                                            forceSelection="true"
                                            maxResults="10"
                                            var="dept"
                                            itemLabel="#{dept.name}"
                                            itemValue="#{dept}">
                                <p:column headerText="Ward Name">
                                    <h:outputText value="#{dept.name}"/>
                                </p:column>
                            </p:autoComplete>

                            <p:spacer width="20"/>
                            <!-- To ward -->
                            <h:panelGroup layout="block" styleClass="to-group">
                                <h:outputText styleClass="fa fa-map-marker-alt mr-2"/>
                                <p:outputLabel value="To Ward" class="m-3"/>
                            </h:panelGroup>

                            <p:autoComplete id="twdbdSelect"
                                            value="#{roomChangeReportController.toWard}"
                                            styleClass="w-100"
                                            inputStyleClass="w-100 form-control"
                                            placeholder="To Ward"
                                            completeMethod="#{departmentController.completeInwardDepartments}"
                                            forceSelection="true"
                                            maxResults="10"
                                            var="dept"
                                            itemLabel="#{dept.name}"
                                            itemValue="#{dept}">
                                <p:column headerText="Ward Name">
                                    <h:outputText value="#{dept.name}"/>
                                </p:column>
                            </p:autoComplete>

                        </h:panelGrid>


                        <div class="d-flex align-items-center my-3 mt-5 mb-5">

                            <p:commandButton
                                id="prcBtn"
                                class="ui-button-warning mx-1"
                                icon="fas fa-cogs"
                                ajax="false"
                                value="Process"
                                action="#{roomChangeReportController.createRoomChangeReport()}">
                            </p:commandButton>

                            <p:commandButton
                                id="toPnt"
                                class="mx-2 ui-button-info m-1"
                                icon="fa-solid fa-print"
                                ajax="false"
                                action="room_change_print?faces-redirect=true"
                                value="To Print"/>

                            <p:commandButton
                                id="exlBtn"
                                class="ui-button-success mx-1"
                                icon="fas fa-file-excel"
                                ajax="false"
                                value="Download"
                                action="#{roomChangeReportController.downloadRoomChangeReportExcel()}">
                            </p:commandButton>

                            <p:commandButton
                                id="pdfBtn"
                                class="ui-button-danger mx-1"
                                icon="fas fa-file-pdf"
                                ajax="false"
                                value="PDF"
                                action="#{roomChangeReportController.downloadRoomChangeReportPdf()}">
                            </p:commandButton>

                        </div>

                        <h:panelGroup id="printPanel">


                            <p:panel header="Detail Report" styleClass="m-3">
                                <div style="overflow-x:auto; width:100%;">
                                    <p:dataTable
                                        id="detailWise"
                                        value="#{roomChangeReportController.roomChangeReportDtoList}"
                                        var="detail"
                                        rowIndexVar="n"
                                        paginator="true"
                                        paginatorPosition="bottom"
                                        rows="10"
                                        rendered="true"
                                        paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                        currentPageReportTemplate="Showing {startRecord} to {endRecord} of {totalRecords}"
                                        rowsPerPageTemplate="5,10,15,25,50,100,500,1000"
                                        styleClass="table-sm table-bordered"
                                        class ="w-100"
                                        style="min-width:3500px;">

                                        <p:columnGroup type="header">
                                            <p:row>
                                                <p:column rowspan="2" headerText="S.No" styleClass="border"/>
                                                <p:column rowspan="2" headerText="MRNO" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Patient Name" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Age" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Gender" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Visit" styleClass="border" style="width:200px; min-width:200px;"/>
                                                <p:column rowspan="2" headerText="Admission Date" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Admission Time" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Transfer Request No." styleClass="border"/>
                                                <p:column rowspan="2" headerText="Transfer Request Status" styleClass="border"/>
                                                <p:column rowspan="2" headerText="From Hospital" styleClass="border"/>
                                                <p:column rowspan="2" headerText="From Department" styleClass="border"/>
                                                <p:column rowspan="2" headerText="From Primary Consultant" styleClass="border"/>
                                                <p:column rowspan="2" headerText="From Consultant" styleClass="border"/>
                                                <p:column rowspan="2" headerText="From Ward" styleClass="border"/>
                                                <p:column rowspan="2" headerText="From Bed No" styleClass="border"/>
                                                <p:column rowspan="2" headerText="From Bed Type" styleClass="border"/>
                                                <p:column rowspan="2" headerText="To Hospital" styleClass="border"/>
                                                <p:column rowspan="2" headerText="To Department" styleClass="border"/>
                                                <p:column rowspan="2" headerText="To Primary Consultant" styleClass="border"/>
                                                <p:column rowspan="2" headerText="To Consultant" styleClass="border"/>
                                                <p:column rowspan="2" headerText="To Ward" styleClass="border"/>
                                                <p:column rowspan="2" headerText="To Bed No" styleClass="border"/>
                                                <p:column rowspan="2" headerText="To Bed Type" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Transfer Date" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Transfer Time" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Transfer By" styleClass="border"/>
                                                <p:column rowspan="2" headerText="Reason" styleClass="border"/>
                                            </p:row>

                                        </p:columnGroup>

                                        <p:column><h:outputLabel value="#{n+1}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.patientPhn}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.patientName}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.patientAge}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.patientSex}" /></p:column>
                                        <p:column style="width:200px; min-width:200px; white-space:nowrap;">
                                            <h:outputLabel value="#{detail.bhtNo}" />
                                        </p:column>
                                        <p:column><h:outputLabel value="#{detail.dateOfAdmission}"><f:convertDateTime pattern="M/d/yyyy" /></h:outputLabel></p:column>
                                        <p:column><h:outputLabel value="#{detail.dateOfAdmission}"><f:convertDateTime pattern="HH:mm" /></h:outputLabel></p:column>
                                        <p:column><h:outputLabel value="#{detail.transferRequestId}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.status}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.fromHospital}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.fromDepartment}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.fromPrimaryConsultant}" /></p:column>
                                        <p:column><h:outputLabel value="" /></p:column> <!-- from consultant: no source field yet, see note below -->
                                        <p:column><h:outputLabel value="#{detail.fromDepartment}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.fromWardRoomName}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.fromBedType}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.toHospital}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.toDepartment}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.toPrimaryConsultant}" /></p:column>
                                        <p:column><h:outputLabel value="" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.toDepartment}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.toWardRoomName}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.toBedType}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.acceptedAt}"><f:convertDateTime pattern="M/d/yyyy" /></h:outputLabel></p:column>
                                        <p:column><h:outputLabel value="#{detail.acceptedAt}"><f:convertDateTime pattern="HH:mm" /></h:outputLabel></p:column>
                                        <p:column><h:outputLabel value="#{detail.acceptedByName}" /></p:column>
                                        <p:column><h:outputLabel value="#{detail.notes}" /></p:column>

                                    </p:dataTable>
                                </div>
                            </p:panel>

                        </h:panelGroup>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
