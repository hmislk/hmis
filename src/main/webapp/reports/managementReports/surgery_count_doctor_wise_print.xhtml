<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">

                <h:form>

                    <p:panel header="Surgery Count (Doctor Wise) - Print" styleClass="w-100">

                        <f:facet name="header">
                            <div class="d-flex justify-content-between">
                                <h:outputText value="Surgery Count (Doctor Wise)" class="mt-2"/>

                                <div class="d-flex gap-2">
                                    <button type="button"
                                            onclick="printReport(); return false;"
                                            class="ui-button ui-button-info"
                                            style="width:150px; cursor:pointer;">
                                        <i class="fa-solid fa-print"></i> Print
                                    </button>

                                    <p:commandButton
                                        ajax="false"
                                        value="Back to Report"
                                        icon="fa fa-arrow-left"
                                        class="ui-button-warning"
                                        action="surgery_count_doctor_wise?faces-redirect=true"/>
                                </div>
                            </div>
                        </f:facet>

                        <style>
                            @media screen {
                                .paper {
                                    width: 297mm !important;
                                    zoom: 1.4;
                                }
                                table {
                                    border-collapse: collapse;
                                    width: 100%;
                                    font-size: 11px !important;
                                }
                                th, td {
                                    border: 1px solid #000;
                                    padding: 4px !important;
                                }
                            }

                            @media print {
                                @page {
                                    size: A3 landscape;
                                    margin: 10mm;
                                }
                                .paper {
                                    width: 297mm !important;
                                }
                                table {
                                    border-collapse: collapse;
                                    width: 100%;
                                    font-size: 10px !important;
                                }
                                th, td {
                                    border: 1px solid #000;
                                    padding: 3px !important;
                                }
                            }
                        </style>
                        <script type="text/javascript">
//<![CDATA[
                            function printReport() {
                                var container = document.querySelector('.paper');
                                if (!container) {
                                    alert('Report container not found.');
                                    return;
                                }

                                var canvases = container.querySelectorAll('canvas');
                                if (canvases.length === 0) {
                                    window.print();
                                    return;
                                }

                                var replacements = [];

                                canvases.forEach(function (canvas) {
                                    try {
                                        var tempCanvas = document.createElement('canvas');
                                        tempCanvas.width = canvas.width;
                                        tempCanvas.height = canvas.height;
                                        var ctx = tempCanvas.getContext('2d');
                                        ctx.fillStyle = '#ffffff';
                                        ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                                        ctx.drawImage(canvas, 0, 0);

                                        var imgDataUrl = tempCanvas.toDataURL('image/png');
                                        var img = document.createElement('img');
                                        img.src = imgDataUrl;
                                        img.style.width = '100%';
                                        img.style.height = canvas.offsetHeight + 'px';
                                        img.style.display = 'block';
                                        canvas.parentNode.insertBefore(img, canvas);
                                        canvas.style.display = 'none';
                                        replacements.push({canvas: canvas, img: img});
                                    } catch (e) {
                                        console.warn('Canvas snapshot failed:', e);
                                    }
                                });

                                setTimeout(function () {
                                    window.print();
                                    setTimeout(function () {
                                        replacements.forEach(function (pair) {
                                            pair.canvas.style.display = '';
                                            if (pair.img && pair.img.parentNode) {
                                                pair.img.parentNode.removeChild(pair.img);
                                            }
                                        });
                                    }, 1500);
                                }, 400);
                            }
//]]>
                        </script>
                        <h:panelGroup id="reportView" class="d-flex justify-content-center">
                            <div class="paper">

                                <div class="text-center" style="font-weight:700; font-size:18px;">
                                    <h:outputText value="Surgery Count Report - Doctor Wise"/>
                                </div>

                                <div class="text-center" style="font-size:11px; margin-top:5px;">
                                    From Date :
                                    <h:outputText value="#{inwardReportController.fromYearStartDate}">
                                        <f:convertDateTime pattern="dd/MM/yyyy hh:mm a"/>
                                    </h:outputText>
                                    |
                                    To Date :
                                    <h:outputText value="#{inwardReportController.toYearEndDate}">
                                        <f:convertDateTime pattern="dd/MM/yyyy hh:mm a"/>
                                    </h:outputText>
                                    |
                                    Speciality :
                                    <h:outputText value="#{not empty inwardReportController.currentSpeciality ? inwardReportController.currentSpeciality.name : 'All'}"/>
                                </div>

                                <div class="text-center" style="font-size:11px; margin-top:5px;">
                                    Year :
                                    <h:outputText value="#{inwardReportController.selectedYear}"/>
                                </div>

                                <table style="margin-top:10px;">
                                    <thead>
                                        <tr>
                                            <th style="width:18%;">Doctor Name</th>
                                            <th style="width:12%;">Speciality</th>
                                            <th>Jan</th>
                                            <th>Feb</th>
                                            <th>Mar</th>
                                            <th>Apr</th>
                                            <th>May</th>
                                            <th>Jun</th>
                                            <th>Jul</th>
                                            <th>Aug</th>
                                            <th>Sep</th>
                                            <th>Oct</th>
                                            <th>Nov</th>
                                            <th>Dec</th>
                                            <th style="width:6%;">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <ui:repeat value="#{inwardReportController.billList}" var="item">
                                            <tr>
                                                <td>
                                                    <h:outputText value="#{item.doctorName}"/>
                                                </td>
                                                <td>
                                                    <h:outputText value="#{item.specialityName}" rendered="#{!item.subtotal and !item.grandTotal}"/>
                                                </td>
                                                <td><h:outputText value="#{item.january}" rendered="#{item.january > 0}"/></td>
                                                <td><h:outputText value="#{item.february}" rendered="#{item.february > 0}"/></td>
                                                <td><h:outputText value="#{item.march}" rendered="#{item.march > 0}"/></td>
                                                <td><h:outputText value="#{item.april}" rendered="#{item.april > 0}"/></td>
                                                <td><h:outputText value="#{item.may}" rendered="#{item.may > 0}"/></td>
                                                <td><h:outputText value="#{item.june}" rendered="#{item.june > 0}"/></td>
                                                <td><h:outputText value="#{item.july}" rendered="#{item.july > 0}"/></td>
                                                <td><h:outputText value="#{item.august}" rendered="#{item.august > 0}"/></td>
                                                <td><h:outputText value="#{item.september}" rendered="#{item.september > 0}"/></td>
                                                <td><h:outputText value="#{item.october}" rendered="#{item.october > 0}"/></td>
                                                <td><h:outputText value="#{item.november}" rendered="#{item.november > 0}"/></td>
                                                <td><h:outputText value="#{item.december}" rendered="#{item.december > 0}"/></td>
                                                <td><h:outputText value="#{item.totalSurgeries}"/></td>
                                            </tr>
                                        </ui:repeat>
                                    </tbody>
                                </table>

                                <p:panel header="Surgery Count Visual Reports" style="margin-top:15px;">
                                    <p:panel header="Specialty Wise Surgery Trend">
                                        <p:chart value="#{inwardReportController.specialtyLineChartModel}" style="width:100%; height:500px;" />
                                    </p:panel>
                                    <p:panel header="Specialty Wise Surgery Count">
                                        <p:chart value="#{inwardReportController.specialtyBarChartModel}" style="width:100%; height:500px;" />
                                    </p:panel>
                                    <p:panel header="Doctor Wise Surgery Trend">
                                        <p:chart value="#{inwardReportController.lineChartModel}" style="width:100%; height:500px;" />
                                    </p:panel>
                                    <p:panel header="Doctor Wise Surgery Count">
                                        <p:chart value="#{inwardReportController.barChartModel}" style="width:100%; height:500px;" />
                                    </p:panel>
                                </p:panel>

                            </div>
                        </h:panelGroup>

                    </p:panel>
                </h:form>

            </ui:define>
        </ui:composition>
    </h:body>
</html>
