<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/reports/index.xhtml">
            <ui:define name="subcontent">
                <h:form >
                    <p:panel header="Surgery Count(According to Surgery Type)" styleClass="my-2" >
                        <h:panelGrid columns="5" class="w-100">

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa mr-2"/>
                                <p:outputLabel value="From Date" for="fromDate" styleClass="m-3"/>
                            </h:panelGroup>

                            <p:calendar
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                id="fromDate"
                                value="#{inwardReportController.fromYearStartDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"
                                />

                            <p:spacer width="40"/>


                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa mr-2"/>
                                <p:outputLabel value="To Date" for="toDate" styleClass="m-3"/>
                            </h:panelGroup>

                            <p:calendar
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                id="toDate"
                                value="#{inwardReportController.toYearEndDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"
                                />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf080;" styleClass="fa mr-2"/> 
                                <p:outputLabel value="Chart Type" for="chartType" styleClass="m-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu id="chartType" value="#{inwardReportController.reportType}" styleClass="w-100">
                                <f:selectItem itemLabel="Select Chart Type" itemValue="" noSelectionOption="true"/>
                                <f:selectItem itemLabel="Bar Chart" itemValue="bar"/>
                                <f:selectItem itemLabel="Line Chart" itemValue="line"/>
                            </p:selectOneMenu>

                        </h:panelGrid>

                        <div class="d-flex align-items-center my-4">

                            <p:commandButton 
                                class="ui-button-warning mx-1"
                                icon="fas fa-cogs"
                                ajax="false"
                                action="#{inwardReportController.processSurgeryCountType()}"
                                value="Process" />

                            <p:commandButton 
                                class="ui-button-primary mx-1"
                                icon="fas fa-print"
                                ajax="false"
                                value="Print All" >
                                <p:printer target="tb" />
                            </p:commandButton>

                            <p:commandButton 
                                class="ui-button-success mx-1"
                                icon="fas fa-file-excel"
                                ajax="false"
                                value="Download">
                                <p:dataExporter type="xlsx" target="tb" fileName="Surgery_Count_Surgery_Type_Wise"/>
                            </p:commandButton>

                            <p:commandButton 
                                class="ui-button-danger mx-1"
                                icon="fas fa-file-pdf"
                                ajax="false"
                                value="PDF">
                                <p:dataExporter type="pdf" target="tb" fileName="Surgery_Count_Surgery_Type_Wise"/>
                            </p:commandButton>

                        </div>


                        <p:dataTable id="tb"
                                     value="#{inwardReportController.surgeryCountTypeList}"
                                     var="var"
                                     rowIndexVar="n"
                                     paginator="true"
                                     paginatorPosition="bottom"
                                     rows="12"
                                     rendered="true"
                                     paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     currentPageReportTemplate="Showing {startRecord} to {endRecord} of {totalRecords}"
                                     rowsPerPageTemplate="12,24,36"
                                     styleClass="table-sm">

                            <p:column headerText="Month">
                                <h:outputText value="#{var.monthString}" />
                                <f:facet name="footer">
                                    <h:outputText value="Total:" style="float: right;" />
                                </f:facet>
                            </p:column>

                            <p:columns value="#{inwardReportController.surgeryCategoryNames}" var="cat" headerText="#{cat}" style="text-align: right;">
                                <h:outputText value="#{var.getCount(cat)}" />
                                <f:facet name="footer">
                                    <h:outputText value="#{inwardReportController.totalCategoryCounts[cat]}" />
                                </f:facet>
                            </p:columns>

                            <p:column headerText="TOTAL" style="text-align: right; font-weight: bold;">
                                <h:outputText value="#{var.totalCount}" />
                                <f:facet name="footer">
                                    <h:outputText value="#{inwardReportController.totalAllSurgeryCount}" />
                                </f:facet>
                            </p:column>

                        </p:dataTable>
                        
                        <!-- Charts Section -->
                        <h:panelGroup id="chartPanel" layout="block">
                            <h:panelGroup layout="block" 
                                          rendered="#{not empty inwardReportController.surgeryCountTypeList 
                                                      and not empty inwardReportController.reportType}">

                                <!-- Bar Chart -->
                                <h:panelGroup layout="block" 
                                              rendered="#{inwardReportController.reportType eq 'bar' 
                                                          and inwardReportController.surgeryCountBarChartModel ne null}"
                                              styleClass="my-3">
                                    <p:panel header="Surgery Count - Bar Chart (#{inwardReportController.selectedYear})">
                                        <h:panelGroup layout="block" style="width:100%; height:500px;">
                                            <p:chart value="#{inwardReportController.surgeryCountBarChartModel}" 
                                                     widgetVar="surgeryCountBarWV"
                                                     style="width:100%; height:100%;" />
                                        </h:panelGroup>
                                    </p:panel>
                                </h:panelGroup>

                                <!-- Line Chart -->
                                <h:panelGroup layout="block" 
                                              rendered="#{inwardReportController.reportType eq 'line' 
                                                          and inwardReportController.surgeryCountLineChartModel ne null}"
                                              styleClass="my-3">
                                    <p:panel header="Surgery Count - Line Chart (#{inwardReportController.selectedYear})">
                                        <h:panelGroup layout="block" style="width:100%; height:500px;">
                                            <p:chart value="#{inwardReportController.surgeryCountLineChartModel}" 
                                                     widgetVar="surgeryCountLineWV"
                                                     style="width:100%; height:100%;" />
                                        </h:panelGroup>
                                    </p:panel>
                                </h:panelGroup>

                            </h:panelGroup>

                            <!-- Message when no chart type selected but data exists -->
                            <h:panelGroup layout="block" 
                                          rendered="#{not empty inwardReportController.surgeryCountTypeList 
                                                      and empty inwardReportController.reportType}"
                                          styleClass="my-3 text-center">
                                <h:outputText value="Please select a Chart Type above to view the chart." 
                                              styleClass="text-muted"/>
                            </h:panelGroup>
                        </h:panelGroup>

                    </p:panel>

                </h:form>

            </ui:define>
        </ui:composition>

    </h:body>
</html>
