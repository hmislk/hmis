<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/reports/index.xhtml">
            <ui:define name="subcontent">
                <h:form>
                    <p:panel header="Room Occupancy" class="w-100 my-2">

                        <h:panelGrid columns="6" class="w-100">

                            <!-- From Date -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa mr-2" />
                                <p:outputLabel value="Discharge from" for="fromDate" styleClass="m-3" />
                            </h:panelGroup>

                            <p:datePicker
                                id="fromDate"
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                value="#{roomOccupancyReportController.fromDate}"
                                pattern="#{sessionController.applicationPreference.longDateFormat}"   
                                showTime="true"                                                         
                                monthNavigator="true"           
                                yearNavigator="true"                              
                                timeInput="true"                
                                />

                            <p:spacer width="20"/>

                            <!-- To Date -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa mr-2"/> 
                                <p:outputLabel value="Discharge to" for="toDate" class="m-3"/>
                            </h:panelGroup>

                            <p:datePicker
                                id="toDate"
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                value="#{roomOccupancyReportController.toDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"   
                                showTime="true"                                                         
                                monthNavigator="true"           
                                yearNavigator="true"                              
                                timeInput="true"                
                                />

                            <p:spacer width="20"/>

                            <!-- Patient -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf007;" styleClass="fa mr-2" />
                                <p:outputLabel value="Patient MRN" for="acPatientMRN" class="m-3"/>
                            </h:panelGroup>
                            <p:autoComplete 
                                id="acPatientMRN"
                                value="#{roomOccupancyReportController.selectedPatient}"
                                converter="#{patientEncounterDtoConverter}"
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                placeholder="Patient Name/MRN"
                                completeMethod="#{admissionController.completePatientPaymentFinalizedWithPhn}"
                                forceSelection="true"
                                maxResults="10"
                                var="pe"
                                itemLabel="#{pe.bhtNo}"
                                itemValue="#{pe}">
                                <p:column headerText="MRN">
                                    <h:outputText value="#{pe.bhtNo}"/>
                                </p:column>
                                <p:column headerText="Patient Name">
                                    <h:outputText value="#{pe.patientName}"/>
                                </p:column>
                            </p:autoComplete>

                            <p:spacer width="20"/>

                            <!-- Ward -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf236;" styleClass="fa mr-2" />
                                <p:outputLabel value="Ward" for="wdbdSelect" class="m-3"/>
                            </h:panelGroup>
                            <p:autoComplete id="wdbdSelect"
                                            value="#{roomOccupancyReportController.ward}"
                                            styleClass="w-100"
                                            inputStyleClass="w-100 form-control"
                                            placeholder="Ward"
                                            completeMethod="#{departmentController.completeInwardDepartments}"
                                            forceSelection="true"
                                            maxResults="10"
                                            var="dept"
                                            itemLabel="#{dept.name}"
                                            itemValue="#{dept}">
                                <p:column headerText="Ward Name">
                                    <h:outputText value="#{dept.name}"/>
                                </p:column>
                            </p:autoComplete>

                            <p:spacer width="20"/>

                            <!-- Bed -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf236;" styleClass="fa mr-2" />
                                <p:outputLabel value="Bed" for="bedSelect" class="m-3"/>
                            </h:panelGroup>
                            <p:autoComplete id="bedSelect"
                                            value="#{roomOccupancyReportController.roomFacilityCharge}"
                                            styleClass="w-100"
                                            inputStyleClass="w-100 form-control"
                                            placeholder="Bed/Room"
                                            completeMethod="#{roomFacilityChargeController.completeRoom}"
                                            forceSelection="true"
                                            maxResults="10"
                                            var="rfc"
                                            itemLabel="#{rfc.name}"
                                            itemValue="#{rfc}">
                                <p:column headerText="Bed Name">
                                    <h:outputText value="#{rfc.name}"/>
                                </p:column>
                            </p:autoComplete>

                            <p:spacer width="20"/>

                            <!-- Room Category -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf1ad;" styleClass="fa mr-2"/>
                                <p:outputLabel value="Room Category" for="roomCategorySelect" class="m-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu id="roomCategorySelect" value="#{roomOccupancyReportController.roomCategory}" styleClass="w-100 form-control">
                                <f:selectItem itemLabel="All Room Categories" itemValue="#{null}"/>
                                <f:selectItems value="#{roomCategoryController.items}" var="rc" itemLabel="#{rc.name}" itemValue="#{rc}"/>
                            </p:selectOneMenu>

                            <p:spacer width="20"/>

                            <!-- Admission Type -->
                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf0f6;" styleClass="fa mr-2"/>
                                <p:outputLabel value="Admission Type" for="admissionTypeSelect" class="m-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu id="admissionTypeSelect" value="#{roomOccupancyReportController.admissionType}" styleClass="w-100 form-control">
                                <f:selectItem itemLabel="All Admission Types" itemValue="#{null}"/>
                                <f:selectItems value="#{admissionTypeController.items}" var="at" itemLabel="#{at.name}" itemValue="#{at}"/>
                            </p:selectOneMenu>

                            <p:spacer width="20"/>

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText styleClass="fa fa-university mr-2"/>
                                <p:outputLabel value="Institution" for="phmIns" class="m-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="phmIns"
                                class="w-100"
                                value="#{roomOccupancyReportController.institution}"
                                filter="true">
                                <f:selectItem itemLabel="All Institutions" itemValue="#{null}"/>
                                <f:selectItems value="#{institutionController.companies}" var="ins" itemLabel="#{ins.name}" itemValue="#{ins}"/>
                            </p:selectOneMenu>

                            <p:spacer width="20"/>

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText styleClass="fa fa-map-marker-alt mr-2"/>
                                <p:outputLabel value="Site" for="phmSite" class="m-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="phmSite"
                                class="w-100"
                                value="#{roomOccupancyReportController.site}"
                                filter="true">
                                <f:selectItem itemLabel="All Sites" itemValue="#{null}"/>
                                <f:selectItems value="#{institutionController.sites}" var="site" itemLabel="#{site.name}" itemValue="#{site}"/>
                            </p:selectOneMenu>

                            <p:spacer width="20"/>

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf46d;" styleClass="fa mr-2"/> 
                                <p:outputLabel value="Report Type" for="reportType" styleClass="m-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu id="reportType" value="#{roomOccupancyReportController.reportType}" styleClass="w-100">
                                <f:selectItem itemLabel="Detail" itemValue="Detail" />
                                <f:selectItem itemLabel="Summary By Room Category" itemValue="Summary By Room Category" />
                                <f:selectItem itemLabel="Summary By Admission Type" itemValue="Summary By Admission Type" />
                            </p:selectOneMenu>

                        </h:panelGrid>

                        <div class="d-flex align-items-center my-3">

                            <p:commandButton
                                id="processButton"
                                class="ui-button-warning mx-1"
                                icon="fas fa-cogs"
                                ajax="false"
                                value="Process"
                                action="#{roomOccupancyReportController.processReport()}">
                            </p:commandButton>

                            <p:commandButton
                                id="prtButton"
                                class="ui-button-primary mx-1"
                                icon="fas fa-print"
                                ajax="false"
                                value="Print All">
                                <p:printer target="printPanel" />
                            </p:commandButton>

                            <p:commandButton
                                id="detailExcelButton"
                                rendered="#{roomOccupancyReportController.reportType eq 'Detail'}"
                                class="ui-button-success mx-1" 
                                icon="fas fa-file-excel" 
                                ajax="false" 
                                value="Download">
                                <p:dataExporter type="xlsx" target="detailWise" fileName="Room_Occupancy_Detail"/>
                            </p:commandButton>

                            <p:commandButton
                                rendered="#{roomOccupancyReportController.reportType ne 'Detail'}"
                                class="ui-button-success mx-1" icon="fas fa-file-excel" ajax="false" value="Download">
                                <p:dataExporter type="xlsx" target="summaryWise" fileName="Room_Occupancy_Summary"/>
                            </p:commandButton>
                            <p:commandButton
                                rendered="#{roomOccupancyReportController.reportType eq 'Detail'}"
                                class="ui-button-danger mx-1" icon="fas fa-file-pdf" ajax="false" value="PDF">
                                <p:dataExporter type="pdf" target="detailWise" fileName="Room_Occupancy_Detail"
                                                preProcessor="#{roomOccupancyReportController.preProcessDetailPdf}"/>
                            </p:commandButton>

                            <p:commandButton
                                rendered="#{roomOccupancyReportController.reportType ne 'Detail'}"
                                class="ui-button-danger mx-1" icon="fas fa-file-pdf" ajax="false" value="PDF">
                                <p:dataExporter type="pdf" target="summaryWise" fileName="Room_Occupancy_Summary"
                                                preProcessor="#{roomOccupancyReportController.preProcessSummaryPdf}"/>
                            </p:commandButton>

                        </div>

                        <h:panelGroup id="printPanel">

                            <p:dataTable
                                id="detailWise"
                                value="#{roomOccupancyReportController.detailDtos}"
                                var="var"
                                rendered="#{roomOccupancyReportController.reportType eq 'Detail'}"
                                rowIndexVar="n"
                                paginator="true"
                                paginatorPosition="bottom"
                                rows="10"
                                paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                currentPageReportTemplate="Showing {startRecord} to {endRecord} of {totalRecords}"
                                rowsPerPageTemplate="5,10,15,25,50,100,500,1000"
                                styleClass="table-sm m-3">
                                <p:column width="4em" styleClass="text-center border">
                                    <f:facet name="header" >
                                        <h:outputText value="S.No" />
                                    </f:facet>
                                    <h:outputText value="#{n+1}"/>
                                </p:column>

                                <p:column width= "8em" styleClass="border" >
                                    <f:facet name="header" >
                                        <h:outputText value="MRN" />
                                    </f:facet>
                                    <h:outputText value="#{var.mrn}">
                                    </h:outputText>
                                </p:column>

                                <p:column width= "12em" styleClass="border">
                                    <f:facet name="header" >
                                        <h:outputText value="Patient Name" />
                                    </f:facet>
                                    <h:outputText value="#{var.patientName}">
                                    </h:outputText>
                                </p:column>

                                <p:column width="10em" styleClass="border">
                                    <f:facet name="header">
                                        <h:outputText value="Admission Date" />
                                    </f:facet>
                                    <h:outputText value="#{var.admissionDate}"> 
                                        <f:convertDateTime pattern="dd/MM/yyyy hh:mm a" />
                                    </h:outputText>
                                </p:column>

                                <p:column width="10em" styleClass="border">
                                    <f:facet name="header">
                                        <h:outputText value="Discharge Date" />
                                    </f:facet>
                                    <h:outputText value="#{var.dischargeDate}"> 
                                        <f:convertDateTime pattern="dd/MM/yyyy hh:mm a" />
                                    </h:outputText>
                                </p:column>

                                <p:column width="10em" styleClass="border">
                                    <f:facet name="header">
                                        <h:outputText value="Room Category" />
                                    </f:facet>
                                    <h:outputText value="#{var.roomCategory}"> 
                                    </h:outputText>
                                </p:column>

                                <p:column width="10em" styleClass="border">
                                    <f:facet name="header">
                                        <h:outputText value="Admission Type" />
                                    </f:facet>
                                    <h:outputText value="#{var.admissionType}"> 
                                    </h:outputText>
                                </p:column>

                                <p:column width="10em" styleClass="border">
                                    <f:facet name="header">
                                        <h:outputText value="Ward/Bed" />
                                    </f:facet>
                                    <h:outputText value="#{var.wardBed}"> 
                                    </h:outputText>
                                </p:column>

                                <p:column width="8em" styleClass="border" style="text-align: right;">
                                    <f:facet name="header">
                                        <h:outputText value="Occupancy Days" />
                                    </f:facet>
                                    <h:outputText value="#{var.occupancyDays}"> 
                                        <f:convertNumber pattern="##0.00" />
                                    </h:outputText>
                                </p:column>

                                <p:column width="10em" styleClass="border">
                                    <f:facet name="header">
                                        <h:outputText value="Room From Time" />
                                    </f:facet>
                                    <h:outputText value="#{var.roomFromTime}"> 
                                        <f:convertDateTime pattern="dd/MM/yyyy hh:mm a" />
                                    </h:outputText>
                                </p:column>

                                <p:column width="10em" styleClass="border">
                                    <f:facet name="header">
                                        <h:outputText value="Room To Time" />
                                    </f:facet>
                                    <h:outputText value="#{var.roomToTime}"> 
                                        <f:convertDateTime pattern="dd/MM/yyyy hh:mm a" />
                                    </h:outputText>
                                </p:column>

                                <p:column width="8em" styleClass="border" style="text-align: center;">
                                    <f:facet name="header">
                                        <h:outputText value="Duration Time(HH:MM:SS)" />
                                    </f:facet>
                                    <h:outputText value="#{var.durationTime}"> 
                                    </h:outputText>
                                </p:column>
                            </p:dataTable>

                            <p:dataTable
                                id="summaryWise"
                                value="#{roomOccupancyReportController.summaryDtos}"
                                var="svar"
                                rendered="#{roomOccupancyReportController.reportType ne 'Detail'}"
                                rowIndexVar="n"
                                paginator="true"
                                paginatorPosition="bottom"
                                rows="10"
                                paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                currentPageReportTemplate="Showing {startRecord} to {endRecord} of {totalRecords}"
                                rowsPerPageTemplate="5,10,15,25,50,100,500,1000"
                                styleClass="table-sm m-3">
                                <p:column width="4em" styleClass="text-center border">
                                    <f:facet name="header" >
                                        <h:outputText value="S.No" />
                                    </f:facet>
                                    <h:outputText value="#{n+1}"/>
                                </p:column>

                                <p:column width= "20em" styleClass="border" >
                                    <f:facet name="header" >
                                        <h:outputText value="Group Name" />
                                    </f:facet>
                                    <h:outputText value="#{svar.groupName}">
                                    </h:outputText>
                                </p:column>

                                <p:column width="15em" styleClass="border" style="text-align: right;">
                                    <f:facet name="header">
                                        <h:outputText value="Total Occupancy Days" />
                                    </f:facet>
                                    <h:outputText value="#{svar.totalOccupancyDays}"> 
                                        <f:convertNumber pattern="##0.00" />
                                    </h:outputText>
                                </p:column>
                            </p:dataTable>

                        </h:panelGroup>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
