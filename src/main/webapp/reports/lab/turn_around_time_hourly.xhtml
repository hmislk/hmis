<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/reports/index.xhtml">
            <ui:define name="subcontent">

                <h:form id="tatHourlyReportForm">

                    <style type="text/css">
                        @media print {

                            body * {
                                visibility: hidden !important;
                            }

                            .tat-hourly-print,
                            .tat-hourly-print * {
                                visibility: visible !important;
                            }

                            .tat-hourly-print {
                                position: absolute !important;
                                top: 0 !important;
                                left: 0 !important;
                                width: 100% !important;
                                margin: 0 !important;
                                padding: 0 !important;
                                border: none !important;
                            }

                            .tat-hourly-print .ui-paginator {
                                display: none !important;
                            }

                            .no-print {
                                display: none !important;
                            }

                            @page {
                                size: A4 landscape;
                                margin: 8mm;
                            }
                        }
                    </style>

                    <p:panel header="Turn Around Time (Hourly) Report">

                        <!-- Filter Fields -->
                        <div class="container-fluid px-0">

                            <div class="row align-items-center mb-3">
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-calendar-alt me-2" />
                                    <p:outputLabel value="From (Billed) Date" for="dpFrom"/>
                                </div>
                                <div class="col-md-4">
                                    <p:datePicker id="dpFrom"
                                                  value="#{tatHourlyReport.fromDate}"
                                                  styleClass="d-block w-100"
                                                  inputStyleClass="form-control"
                                                  showTime="true" 
                                                  monthNavigator="true"           
                                                  yearNavigator="true"                              
                                                  timeInput="true" 
                                                  title="Filter by from date"
                                                  hideOnDateTimeSelect="true"
                                                  pattern="#{sessionController.applicationPreference.longDateFormat}"/>
                                </div>
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-calendar-alt me-2"/>
                                    <p:outputLabel value="To (Billed) Date" for="dpTo"/>
                                </div>
                                <div class="col-md-4">
                                    <p:datePicker id="dpTo"
                                                  value="#{tatHourlyReport.toDate}"
                                                  styleClass="d-block w-100"
                                                  inputStyleClass="form-control"
                                                  showTime="true" 
                                                  monthNavigator="true"           
                                                  yearNavigator="true"                              
                                                  timeInput="true" 
                                                  title="Filter by to date"
                                                  hideOnDateTimeSelect="true"
                                                  pattern="#{sessionController.applicationPreference.longDateFormat}"/>
                                </div>
                            </div>

                            <div class="row align-items-center mb-3">
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fa fa-university me-2"/>
                                    <p:outputLabel value="Institution" for="cmdInstitution"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu id="cmdInstitution"
                                                     value="#{tatHourlyReport.institution}"
                                                     style="width:100%"
                                                     title="Filter by institution"
                                                     filter="true">
                                        filter="true">
                                        <f:selectItem itemLabel="Select Institution to filter"/>
                                        <f:selectItems 
                                            value="#{institutionController.companies}" 
                                            var="ins" 
                                            itemLabel="#{ins.name}"
                                            itemValue="#{ins}"/>

                                    </p:selectOneMenu>

                                </div>
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fa fa-map-marker-alt me-2"/>
                                    <p:outputLabel value="Site" for="cmdSite"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu
                                        id="cmdSite"
                                        value="#{tatHourlyReport.site}"
                                        style="width:100%"
                                        title="Filter by institution or branch"
                                        filter="true">
                                        <f:selectItem itemLabel="Select the Site"></f:selectItem>
                                        <f:selectItems value="#{institutionController.sites}" var="site" itemLabel="#{site.name}"
                                                       itemValue="#{site}"/>
                                        <p:ajax process="@this" update="cmdDepartment"></p:ajax>
                                    </p:selectOneMenu>
                                </div>
                            </div>

                            <div class="row align-items-center mb-3">
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-sitemap me-2"/>
                                    <p:outputLabel value="Department" for="cmdDepartment"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu
                                        id="cmdDepartment"
                                        value="#{tatHourlyReport.department}"
                                        style="width:100%"
                                        title="Filter by department"
                                        filter="true">
                                        <f:selectItem itemLabel="Select the Department"></f:selectItem>
                                        <f:selectItems
                                            value="#{departmentController.getDepartmentsOfInstitutionAndSite()}"
                                            var="d"
                                            itemLabel="#{d.name}"
                                            itemValue="#{d}"/>
                                    </p:selectOneMenu>
                                </div>
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-hospital me-2"/>
                                    <p:outputLabel value="CC Name" for="cmdCCName"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu id="cmdCCName"
                                                     value="#{tatHourlyReport.collectingCentre}"
                                                     filter="true"
                                                     style="width:100%"
                                                     title="Filter by CCName">
                                        <f:selectItem itemLabel="Select CC Name"/>
                                        <f:selectItems value="#{collectingCentreController.items}"
                                                       var="i"
                                                       itemLabel="#{i.name}"
                                                       itemValue="#{i}"/>
                                    </p:selectOneMenu>
                                </div>
                            </div>

                            <div class="row align-items-center mb-3">

                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-box-open me-2"/>
                                    <p:outputLabel value="CC Route" for="cmdCCRoute"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu id="cmdCCRoute"
                                                     value="#{tatHourlyReport.route}"
                                                     filter="true"
                                                     style="width:100%"
                                                     title="Filter by CC Route">
                                        <f:selectItem itemLabel="Select CC Route"/>
                                        <f:selectItems value="#{routeController.items}"
                                                       var="r"
                                                       itemLabel="#{r.name}"
                                                       itemValue="#{r}"
                                                       />
                                    </p:selectOneMenu>
                                </div>

                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-search me-2"/>
                                    <p:outputLabel value="Investigation" for="cmdInvestigation"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu id="cmdInvestigation"
                                                     value="#{tatHourlyReport.investigation}"
                                                     style="width:100%"
                                                     title="Filter by investigation"
                                                     filter="true">
                                        <f:selectItem itemLabel="Select Investigation"/>
                                        <f:selectItems value="#{investigationController.investigationItems}" itemLabel="#{i.sname}" var="i" itemValue="#{i}"/>
                                    </p:selectOneMenu>
                                </div>
                            </div>

                            <div class="row align-items-center mb-3">
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-microscope me-2"/>
                                    <p:outputLabel value="Lab Department" for="cmdLaboratoryDepartment"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu
                                        id="cmdLaboratoryDepartment"
                                        value="#{tatHourlyReport.laboratoryDepartment}"
                                        style="width:100%"
                                        title="Filter by Laboratory Department"
                                        filter="true">
                                        <f:selectItem itemLabel="Select Laboratory Department"/>
                                        <f:selectItems 
                                            value="#{departmentController.getDepartmentsOfInstitutionAndSite()}"
                                            var="d"
                                            itemLabel="#{d.name}"
                                            itemValue="#{d}" />
                                    </p:selectOneMenu>

                                </div>
                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-user-md me-2"/>
                                    <p:outputLabel value="Doctor Name" for="cmdReferingDoctor"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu id="cmdReferingDoctor"
                                                     value="#{tatHourlyReport.referingDoctor}"
                                                     style="width:100%"
                                                     title="Filter by referring doctor"
                                                     filter="true">
                                        <f:selectItem itemLabel="Select referring doctor"/>
                                        <f:selectItems value="#{doctorController.items}" itemLabel="#{d.name}" var="d" itemValue="#{d}"/>
                                    </p:selectOneMenu>
                                </div>
                            </div>

                            <div class="row align-items-center mb-3">

                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-file-medical-alt me-2"/>
                                    <p:outputLabel value="Result Status" for="cmdResultStatus"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu
                                        id="cmdResultStatus"
                                        value="#{tatHourlyReport.resultStatus}"
                                        style="width:100%"
                                        title="Filter by Result Status"
                                        filter="true">
                                        <f:selectItem itemLabel="Select Result Status"></f:selectItem>
                                        <f:selectItem itemValue="Results Pending" itemLabel="Results Pending"/>
                                        <f:selectItem itemValue="Result Certified" itemLabel="Results Certified"/>
                                    </p:selectOneMenu>
                                </div>

                                <div class="col-md-2 text-right font-weight-bold">
                                    <i class="fas fa-stethoscope me-2"/>
                                    <p:outputLabel value="Visiting Type" for="cmdVisitingType"/>
                                </div>
                                <div class="col-md-4">
                                    <p:selectOneMenu id="cmdVisitingType"
                                                     value="#{tatHourlyReport.visitType}"
                                                     style="width:100%"
                                                     title="Filter by visit type"
                                                     filter="true">
                                        <f:selectItem itemLabel="Select Visiting Type"/>
                                        <f:selectItem itemValue="All" itemLabel="All"/>
                                        <f:selectItem itemValue="OP" itemLabel="Out Patients (OP)"/>
                                        <f:selectItem itemValue="IP" itemLabel="In Patients (IP)"/>
                                        <f:selectItem itemValue="CC" itemLabel="Collecting Centre (CC)"/>

                                    </p:selectOneMenu>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-12 d-flex justify-content-start" style="gap:8px">

                                    <p:commandButton
                                        id="btnProcess"
                                        class="ui-button-warning my-4 mx-2"
                                        style="width: 100px"
                                        action="#{tatHourlyReport.process}"
                                        process="@form"
                                        update=":growl reportPanel"
                                        ajax="true"
                                        value="Process"
                                        icon="fas fa-cogs"/>

                                    <p:commandButton
                                        id="btnPrint"
                                        styleClass="ui-button-info my-4 mx-2"
                                        style="width: 100px"
                                        icon="fas fa-print"
                                        type="button"
                                        value="Print"
                                        onclick="printTatHourlyReport(); return false;"/>

                                    <p:commandButton
                                        id="btnExcel"
                                        styleClass="ui-button-success my-4 mx-2"
                                        style="width: 100px"
                                        icon="fas fa-file-excel"
                                        ajax="false"
                                        immediate="true"
                                        process="@this"
                                        action="#{tatHourlyReport.exportExcel}"
                                        value="Excel"/>

                                    <p:commandButton
                                        id="btnPdf"
                                        styleClass="ui-button-danger my-4 mx-2"
                                        style="width: 100px"
                                        icon="fas fa-file-pdf"
                                        ajax="false"
                                        immediate="true"
                                        process="@this"
                                        value="PDF"
                                        action="#{tatHourlyReport.exportPdf}"/>
                                </div>
                            </div>

                        </div>

                    </p:panel>

                    <p:panel id="reportPanel" header="Turn Around Time (Hourly) Report" styleClass="mt-3 tat-hourly-print">

                        <h:panelGrid columns="2"
                                     styleClass="table table-bordered table-sm table-striped w-50"
                                     columnClasses="font-weight-bold w-25,w-75">
                            <h:outputLabel value="Institution"/>
                            <h:outputLabel value="#{tatHourlyReport.institution.name}"/>

                            <h:outputLabel value="Site"/>
                            <h:outputLabel value="#{tatHourlyReport.site.name}"/>

                            <h:outputLabel value="Department"/>
                            <h:outputLabel value="#{tatHourlyReport.department.name}"/>

                            <h:outputLabel value="Investigation"/>
                            <h:outputLabel value="#{tatHourlyReport.investigation.name}"/>

                            <h:outputLabel value="Service Center"/>
                            <h:outputLabel value="#{tatHourlyReport.collectingCentre.name}"/>

                            <h:outputLabel value="From Date"/>
                            <h:outputLabel value="#{tatHourlyReport.fromDate}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" />
                            </h:outputLabel>

                            <h:outputLabel value="To Date"/>
                            <h:outputLabel value="#{tatHourlyReport.toDate}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" />
                            </h:outputLabel>

                        </h:panelGrid>


                        <p:dataTable
                            id="tblExport1"
                            scrollable="true"
                            scrollWidth="100%"
                            style="width:150%; table-layout:auto;"
                            value="#{tatHourlyReport.reportData}"
                            var="c"
                            rowIndexVar="n"
                            paginator="true"
                            paginatorPosition="bottom"
                            rows="10"
                            rendered="true"
                            rowsPerPageTemplate="5,10,15,25,50,100,500,1000"
                            styleClass="table table-sm">

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="Investigation"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.investigationName}" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="Department"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.departmentName}" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="0 - 1(hr)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket0_1}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="1 - 2(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket1_2}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="2 - 3(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket2_3}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="3 - 4(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket3_4}" style="text-align:right;" />
                            </p:column>


                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="4 - 5(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket4_5}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="5 - 6(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket5_6}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="6 - 7(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket6_7}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="7 - 8(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket7_8}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="8 - 9(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket8_9}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="9 - 10(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket9_10}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value=">=10(hrs)"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.bucket10Plus}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="Processed"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.processedCount}" style="text-align:right;" />
                            </p:column>

                            <p:column>
                                <f:facet name="header">
                                    <h:outputText value="Pending"
                                                  style="font-weight:bold;" />
                                </f:facet>

                                <h:outputText value="#{c.pendingCount}" style="text-align:right;" />
                            </p:column>

                            <f:facet name="footer">
                                <div class="d-flex justify-content-between align-items-center mt-1">
                                    <div>
                                        <span class="font-weight-bold mr-1">Generated By : </span>
                                        <h:outputText value="#{sessionController.loggedUser.name}" />
                                    </div>
                                    <div>
                                        <span class="font-weight-bold mr-1">Generated On : </span>
                                        <h:outputText value="#{tatHourlyReport.currentDate}">
                                            <f:convertDateTime
                                                pattern="#{sessionController.applicationPreference.longDateFormat}"/>
                                        </h:outputText>
                                    </div>
                                </div>
                            </f:facet>
                        </p:dataTable>

                    </p:panel>


                </h:form>

                <h:outputScript target="body">
                    function printTatHourlyReport() {
                    window.print();
                    return false;
                    }
                </h:outputScript> 

            </ui:define>
        </ui:composition>

    </h:body>
</html>
