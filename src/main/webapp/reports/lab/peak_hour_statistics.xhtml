<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/reports/index.xhtml">
            <ui:define name="subcontent">

                <!-- ============================================================ -->
                <!-- FILTER PANEL                                                  -->
                <!-- ============================================================ -->
                <p:panel header="Peak Hour Statistics">
                    <h:form>

                        <h:panelGrid columns="4" class="w-100">

                            <!-- Date Range -->
                            <h:panelGroup>
                                <h:outputText value="&#xf073;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="Date Range"/>
                            </h:panelGroup>
                            <h:panelGroup>
                                <p:calendar value="" placeholder="From Date" pattern="dd/MM/yyyy" class="mr-2" />
                                <h:outputText value=" to " />
                                <p:calendar value="" placeholder="To Date" pattern="dd/MM/yyyy" />
                            </h:panelGroup>

                            <!-- Institution -->
                            <h:panelGroup class="mx-2">
                                <h:outputText value="&#xf19c;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="Institution"/>
                            </h:panelGroup>
                            <p:selectOneMenu filter="true" filterMatchMode="contains" class="w-100">
                                <f:selectItem itemLabel="All Institutions" itemValue="" />
                                <f:selectItem itemLabel="Institution 1" itemValue="INS1"/>
                            </p:selectOneMenu>

                            <!-- Site -->
                            <h:panelGroup>
                                <h:outputText value="&#xf3c5;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="Site"/>
                            </h:panelGroup>
                            <p:selectOneMenu filter="true" filterMatchMode="contains" class="w-100">
                                <f:selectItem itemLabel="All Sites" itemValue="" />
                                <f:selectItem itemLabel="Site 1" itemValue="ST1"/>
                            </p:selectOneMenu>

                            <!-- Department -->
                            <h:panelGroup class="mx-2">
                                <h:outputText value="&#xf0f7;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="Department"/>
                            </h:panelGroup>
                            <p:selectOneMenu filter="true" filterMatchMode="contains" class="w-100">
                                <f:selectItem itemLabel="All Departments" itemValue="" />
                                <f:selectItem itemLabel="Biochemistry" itemValue="BIO"/>
                                <f:selectItem itemLabel="Pathology" itemValue="PATH"/>
                            </p:selectOneMenu>

                            <!-- Visit Type -->
                            <h:panelGroup>
                                <h:outputText value="&#xf007;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="Visit Type"/>
                            </h:panelGroup>
                            <p:selectOneMenu filter="true" filterMatchMode="contains" class="w-100">
                                <f:selectItem itemLabel="All" itemValue="" />
                                <f:selectItem itemLabel="OP" itemValue="OP"/>
                                <f:selectItem itemLabel="IP" itemValue="IP"/>
                                <f:selectItem itemLabel="CC" itemValue="CC"/>
                            </p:selectOneMenu>

                            <!-- Process By -->
                            <h:panelGroup class="mx-2">
                                <h:outputText value="&#xf013;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="Process By"/>
                            </h:panelGroup>
                            <p:selectOneMenu filter="true" filterMatchMode="contains" class="w-100">
                                <f:selectItem itemLabel="Invoice Time"            itemValue="INVOICE"/>
                                <f:selectItem itemLabel="Sample Generated Time"   itemValue="GEN"/>
                                <f:selectItem itemLabel="Sample Collected Time"   itemValue="COL"/>
                                <f:selectItem itemLabel="Sample Sent Time"        itemValue="SENT"/>
                                <f:selectItem itemLabel="Sample Accepted Time"    itemValue="ACC"/>
                                <f:selectItem itemLabel="Result Entered"          itemValue="ENTERED"/>
                                <f:selectItem itemLabel="Result Interfaced"       itemValue="INTERFACED"/>
                                <f:selectItem itemLabel="Result Certified"        itemValue="CERTIFIED"/>
                            </p:selectOneMenu>

                            <!-- CC Name -->
                            <h:panelGroup>
                                <h:outputText value="&#xf2bd;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="CC Name"/>
                            </h:panelGroup>
                            <p:inputText class="w-100" placeholder="Enter CC Name" />

                            <!-- CC Route -->
                            <h:panelGroup class="mx-2">
                                <h:outputText value="&#xf018;" styleClass="fa mr-2" />
                                <h:outputLabel class="mx-3" value="CC Route"/>
                            </h:panelGroup>
                            <p:inputText class="w-100" placeholder="Enter CC Route" />

                        </h:panelGrid>

                        <div class="my-3">
                            <p:commandButton
                                ajax="false"
                                action="null"
                                value="Process"
                                style="width: 150px"
                                icon="fas fa-cogs"
                                class="mx-2 ui-button-warning" />

                            <p:commandButton
                                icon="fa-solid fa-print"
                                class="mx-2 ui-button-info"
                                style="width: 150px"
                                ajax="false"
                                value="Print">
                                <p:printer target="tbl" />
                            </p:commandButton>

                            <p:commandButton
                                ajax="false"
                                value="Excel"
                                style="width: 150px"
                                icon="fas fa-file-excel"
                                class="ui-button-success mx-2">
                                <p:dataExporter fileName="peak_hour_statistics" target="tbl" type="xlsx" />
                            </p:commandButton>

                            <p:commandButton
                                class="mx-2 ui-button-danger"
                                style="width: 150px"
                                icon="fa-solid fa-file-pdf"
                                ajax="false"
                                value="PDF">
                                <p:dataExporter type="pdf" target="tbl" fileName="peak_hour_statistics" />
                            </p:commandButton>
                        </div>

                    </h:form>
                </p:panel>

                <!-- SPACING BETWEEN PANELS -->
                <div class="my-3"></div>
                <!-- ============================================================ -->
                <!-- FILTER RESULTS SUMMARY                                        -->
                <!-- ============================================================ -->
                <p:panel header="Report Results">
                    <h:panelGrid columns="4"
                                 styleClass="table table-bordered table-sm table-striped w-50"
                                 columnClasses="font-weight-bold w-15,w-15">

                        <h:outputText value="From Date" />
                        <h:outputText value="02/06/2026" />

                        <h:outputText value="To Date" />
                        <h:outputText value="25/06/2026" />

                        <h:outputText value="Institution" />
                        <h:outputText value="Institution 1" />

                        <h:outputText value="Site" />
                        <h:outputText value="Site 1" />

                        <h:outputText value="Department" />
                        <h:outputText value="Pathology" />

                        <h:outputText value="Visit Type" />
                        <h:outputText value="OP" />

                        <h:outputText value="Process By" />
                        <h:outputText value="Invoice Time" />

                        <h:outputText value="CC Name" />
                        <h:outputText value="" />

                        <h:outputText value="CC Route" />
                        <h:outputText value="" />

                    </h:panelGrid>
                </p:panel>

                <!-- ============================================================ -->
                <!-- RESULT TABLE                                                  -->
                <!-- ============================================================ -->
                <h:form prependId="false">
                    <p:dataTable
                        scrollWidth="100%"
                        style="width:200em;"
                        id="tbl"
                        scrollable="true"
                        paginator="false">

                        <p:column headerText="Date" frozen="true">
                            <h:outputText value="" />
                            <f:facet name="footer">
                                <p:outputLabel value="Grand Total" />
                            </f:facet>
                        </p:column>

                        <p:column headerText="0:00">
                            <h:outputText value="" />
                            <f:facet name="footer"><h:outputText value="" /></f:facet>
                        </p:column>
                        <p:column headerText="1:00">
                            <h:outputText value="" />

                        </p:column>

                        <!-- Total Stats Column -->
                        <p:column headerText="Total Stats">
                            <h:outputText value="" />
                            <f:facet name="footer"><h:outputText value="" /></f:facet>
                        </p:column>

                    </p:dataTable>

                </h:form>

            </ui:define>
        </ui:composition>
    </h:body>
</html>
