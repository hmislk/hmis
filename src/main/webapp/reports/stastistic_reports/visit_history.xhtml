<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/reports/index.xhtml">
            <ui:define name="subcontent">

                <h:form id="visitHistoryForm" rendered="#{webUserController.hasPrivilege('ReportsVisitHistory')}">
                    <p:growl id="visitHistoryGrowl" showDetail="false"/>

                    <p:panel>
                        <f:facet name="header">
                            <div class="d-flex align-items-center justify-content-between w-100">
                                <h:outputText value="Visit History" styleClass="fw-bold"/>
                                <h:outputText value="All bills and admissions of a patient, newest first. Cancellations and returns are separate rows."
                                              styleClass="text-muted small"/>
                            </div>
                        </f:facet>

                        <div class="row g-2 mb-2">
                            <div class="col-md-4">
                                <p:outputLabel for="acPatient" value="Patient (name / code / PHN / NIC / phone)" />
                                <p:autoComplete id="acPatient"
                                                class="w-100"
                                                inputStyleClass="form-control"
                                                value="#{visitHistoryController.patient}"
                                                completeMethod="#{visitHistoryController.completePatient}"
                                                var="apt"
                                                itemLabel="#{apt.person.nameWithTitle}"
                                                itemValue="#{apt}"
                                                forceSelection="true"
                                                minQueryLength="4"
                                                scrollHeight="400">
                                    <p:column headerText="Name">
                                        <h:outputText value="#{apt.person.nameWithTitle}" />
                                    </p:column>
                                    <p:column headerText="Age">
                                        <h:outputText value="#{apt.age}" />
                                    </p:column>
                                    <p:column headerText="Code">
                                        <h:outputText value="#{apt.code}" />
                                    </p:column>
                                    <p:column headerText="PHN">
                                        <h:outputText value="#{apt.phn}" />
                                    </p:column>
                                    <p:column headerText="NIC / Passport">
                                        <h:outputText value="#{apt.person.nic}" />
                                    </p:column>
                                </p:autoComplete>
                            </div>
                            <div class="col-md-2">
                                <p:outputLabel for="visitType" value="Visit Type" />
                                <p:selectOneMenu id="visitType" value="#{visitHistoryController.visitType}" styleClass="w-100">
                                    <f:selectItem itemLabel="All visit types" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{visitHistoryController.visitTypes}" var="vt"
                                                   itemLabel="#{vt.label}" itemValue="#{vt}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="col-md-3">
                                <p:outputLabel for="fromDate" value="From (optional)" />
                                <p:datePicker id="fromDate"
                                              value="#{visitHistoryController.fromDate}"
                                              styleClass="w-100"
                                              inputStyleClass="form-control"
                                              showTime="true" showButtonBar="true" timeInput="true"
                                              pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                            <div class="col-md-3">
                                <p:outputLabel for="toDate" value="To (optional)" />
                                <p:datePicker id="toDate"
                                              value="#{visitHistoryController.toDate}"
                                              styleClass="w-100"
                                              inputStyleClass="form-control"
                                              showTime="true" showButtonBar="true" timeInput="true"
                                              pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mb-2">
                            <p:commandButton id="btnProcess"
                                             value="Process"
                                             icon="fa fa-cogs"
                                             styleClass="ui-button-success"
                                             title="Show the visit history of the selected patient"
                                             action="#{visitHistoryController.process()}"
                                             process="@form"
                                             update="@form"/>
                            <p:commandButton id="btnClear"
                                             value="Clear"
                                             icon="fa fa-eraser"
                                             styleClass="ui-button-warning"
                                             title="Clear the patient and filters"
                                             action="#{visitHistoryController.clear()}"
                                             process="@this"
                                             update="@form">
                                <p:resetInput target="@form"/>
                            </p:commandButton>
                        </div>

                        <p:dataTable id="visitHistoryTable"
                                     value="#{visitHistoryController.rows}"
                                     var="row"
                                     rowKey="#{row.admission ? 'A' : 'B'}#{row.id}"
                                     styleClass="p-datatable-sm"
                                     rowStyleClass="#{row.cancellationOrRefund ? 'text-danger' : ''}"
                                     paginator="true" rows="50"
                                     paginatorPosition="bottom"
                                     rowsPerPageTemplate="25,50,100,200"
                                     stickyHeader="true"
                                     emptyMessage="No visits found for this patient.">
                            <f:facet name="header">
                                <h:outputText value="#{visitHistoryController.rows.size()} rows"/>
                            </f:facet>
                            <p:column headerText="Date" width="9rem">
                                <h:outputText value="#{row.eventDate}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Visit Type" width="8rem">
                                <h:outputText value="#{row.visitTypeLabel}" styleClass="fw-bold"/>
                            </p:column>
                            <p:column headerText="Reference No" width="10rem">
                                <h:outputText value="#{row.referenceNumber}"/>
                            </p:column>
                            <p:column headerText="Document">
                                <h:outputText value="#{row.documentType}"/>
                                <p:tag rendered="#{row.cancellationOrRefund}" value="#{row.kind}" severity="danger" styleClass="ms-2"/>
                            </p:column>
                            <p:column headerText="Department / Doctor">
                                <h:outputText value="#{row.departmentAndDoctor}"/>
                            </p:column>
                            <p:column headerText="Status" width="7rem">
                                <h:outputText value="#{row.status}"/>
                            </p:column>
                            <p:column headerText="Open" width="4rem" styleClass="text-center">
                                <p:commandButton rendered="#{row.admission}"
                                                 icon="fa fa-eye"
                                                 title="Open the inpatient dashboard of this admission"
                                                 styleClass="ui-button-info ui-button-outlined"
                                                 ajax="false"
                                                 action="#{admissionController.navigateToAdmissionProfileById(row.id)}"/>
                                <p:commandButton rendered="#{not row.admission}"
                                                 icon="fa fa-eye"
                                                 title="Open the bill preview"
                                                 styleClass="ui-button-info ui-button-outlined"
                                                 ajax="false"
                                                 action="#{billSearch.navigateToViewBillByAtomicBillTypeByBillId(row.id)}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                </h:form>

            </ui:define>
        </ui:composition>
    </h:body>
</html>
