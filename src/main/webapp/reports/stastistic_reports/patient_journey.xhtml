<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/reports/index.xhtml">
            <ui:define name="subcontent">

                <h:form >

                    <p:panel>
                        <f:facet name="header">
                            <h:outputLabel value="Patient Journey" />
                        </f:facet>

                        <p:panelGrid  columns="4" class=" mx-2">
                            <h:panelGroup>
                                <h:outputText value="&#xf073;" styleClass="fa ml-5" />
                                <p:outputLabel value="From Date" class="mx-3" />

                            </h:panelGroup>
                            <p:datePicker
                                value="#{reportController.fromDate}"
                                class="w-100"
                                showTime="true"
                                showButtonBar="true"
                                timeInput="true"
                                inputStyleClass="form-control"
                                maxdate="#{commonFunctionsProxy.endOfDay}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"          ></p:datePicker>

                            <h:panelGroup>
                                <h:outputText value="&#xf073;" styleClass="fa ml-5" />
                                <p:outputLabel value="To Date" class="mx-3" />
                            </h:panelGroup>

                            <p:datePicker
                                class="w-100"
                                showTime="true"
                                showButtonBar="true"
                                timeInput="true"
                                inputStyleClass="form-control"
                                maxdate="#{commonFunctionsProxy.endOfDay}"
                                value="#{reportController.toDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"          >
                            </p:datePicker>

                            <h:panelGroup>
                                <h:outputText value="&#xf406;" styleClass="fa mr-2" />
                                <p:outputLabel value="MRN / Patient Name" class="mx-3" />
                            </h:panelGroup>
                            <p:autoComplete
                                class="w-100"
                                inputStyleClass="form-control"
                                value="#{reportController.patient}"
                                completeMethod="#{patientController.completePatientByNameOrCode}"
                                var="apt"
                                itemLabel="#{apt.person.nameWithTitle}"
                                itemValue="#{apt}"
                                forceSelection="true"
                                minQueryLength="4"
                                scrollHeight="400">
                                <p:column headerText="Name">
                                    <h:outputLabel value="#{apt.person.nameWithTitle}" />
                                </p:column>
                                <p:column headerText="Age">
                                    <h:outputLabel value="#{apt.age}" />
                                </p:column>
                                <p:column headerText="NIC / Passport">
                                    <h:outputLabel value="#{apt.person.nic}"/>
                                </p:column>
                                <p:column headerText="Code">
                                    <h:outputLabel value="#{apt.code}" />
                                </p:column>
                                <p:column headerText="PHN">
                                    <h:outputLabel value="#{apt.phn}"/>
                                </p:column>
                                <p:column headerText="Sex">
                                    <h:outputLabel value="#{apt.person.sex}" />
                                </p:column>
                                <p:column headerText="Address">
                                    <h:outputLabel value="#{apt.person.address}" />
                                </p:column>
                                <p:column headerText="Date of Birth">
                                    <h:outputLabel value="#{apt.person.dob}" >
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}"/>
                                    </h:outputLabel>
                                </p:column>
                            </p:autoComplete>
                        </p:panelGrid>

                        <h:panelGrid columns="6" class="my-3">
                            <p:commandButton
                                ajax="false"
                                rendered="false"
                                action="#"
                                value="Process by Bill"
                                icon="fas fa-cogs" class="ui-button-warning mx-2" >
                            </p:commandButton>
                            <p:commandButton
                                ajax="false"
                                action="#{reportController.processPatientJourney}"
                                value="Process"
                                icon="fas fa-cogs" class="ui-button-warning mx-2" >
                            </p:commandButton>
                            <p:commandButton style="width: 150px" ajax="false" value="Print" icon="fas fa-print" class="ui-button-info mx-2"  >
                                <p:printer target="dtaPr"/>
                            </p:commandButton>
                            <p:commandButton style="width: 150px" ajax="false" value="Excel" icon="fas fa-file-excel" class="ui-button-success mx-2" >
                                <p:dataExporter fileName="Patient_Journey_Report" type="xlsx" target="dtaPr" />
                            </p:commandButton>
                            <p:commandButton style="width: 150px" ajax="false" value="PDF" icon="fas fa-file-pdf" class="ui-button-danger mx-1" >
                                <p:dataExporter fileName="Patient_Journey_Report" type="pdf" target="dtaPr" />
                            </p:commandButton>
                        </h:panelGrid>

                        <p:dataTable id="dtaPr"
                                     rowIndexVar="count"
                                     value="#{reportController.patientJourneyRows}"
                                     var="row" class="my-2">
                            <f:facet name="header">
                                <h:outputLabel value="Patient Journey Report" />
                            </f:facet>
                            <p:column
                                headerText="Transaction Date"
                                filterMatchMode="contains"
                                sortBy="#{row.transactionDate}"
                                filterBy="#{row.transactionDate}">
                                <h:outputText value="#{row.transactionDate}" >
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Visit No" filterMatchMode="contains" sortBy="#{row.visitNo}" filterBy="#{row.visitNo}">
                                <h:outputText value="#{row.visitNo}" ></h:outputText>
                            </p:column>
                            <p:column headerText="Transaction Name" filterMatchMode="contains" sortBy="#{row.transactionName}" filterBy="#{row.transactionName}">
                                <h:outputText value="#{row.transactionName}" ></h:outputText>
                            </p:column>
                            <p:column
                                headerText="Transaction Number"
                                filterMatchMode="contains"
                                sortBy="#{row.transactionNumber}"
                                filterBy="#{row.transactionNumber}">
                                <h:outputText value="#{row.transactionNumber}" ></h:outputText>
                            </p:column>
                            <p:column headerText="Description"  filterMatchMode="contains" sortBy="#{row.description}" filterBy="#{row.description}">
                                <h:outputText value="#{row.description}" ></h:outputText>
                            </p:column>
                            <p:column headerText="User" filterMatchMode="contains" sortBy="#{row.userName}" filterBy="#{row.userName}" >
                                <h:outputText value="#{row.userName}" ></h:outputText>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>

    </h:body>
</html>
