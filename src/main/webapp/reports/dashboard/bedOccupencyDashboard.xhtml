<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <body>
        <ui:composition template="./dashboard.xhtml">
            <ui:define name="subcontent">
                <h:form>
                    <h:panelGroup rendered="#{!webUserController.hasPrivilege('CourierCollectSamples')}" >
                        You are NOT Authorized to view Bed Occupancy Dashboard Page
                    </h:panelGroup>
                    <h:panelGroup rendered="#{webUserController.hasPrivilege('CourierCollectSamples')}" >
                        <div class="container ">
                            <h:panelGroup>
                                    <p:panel class="w-100">
                                    <f:facet name="header">
                                        <h:outputLabel value="Bed Occupency" styleClass="fa-bed"   class="mx-4 text-center fs-2 text-uppercase"/>
                                    </f:facet>
                                    <p:panelGrid columns="6">
                                    <h:panelGroup>
                                    <h:outputText value="&#xf073;" styleClass="fa ml-5"/>
                                    <h:outputLabel value="From Date" class="mx-3"/>
                                </h:panelGroup>
                                <p:datePicker
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                id="fromDate"
                                showTime="true"
                                yearNavigator="true"
                                monthNavigator="true"
                                timeInput="true"
                                value="#{inwardReportDashboardController.fromDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"
                                />
                                    <p:spacer width="40"/>
                                <h:panelGroup>
                                    <h:outputText value="&#xf073;" styleClass="fa ml-5"/>
                                    <h:outputLabel value="To Date" class="mx-3" />
                                </h:panelGroup>
                                <p:datePicker
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                showTime="true"
                                yearNavigator="true"
                                monthNavigator="true"
                                timeInput="true"
                                value="#{inwardReportDashboardController.toDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}"
                                />
                                    </p:panelGrid>
                                    <h:outputText value="Occupied Rooms and Marked for Discharge reflect this date range. Blocked and Unavailable Rooms always reflect current room status (no history is kept for those)." class="mx-3 text-muted"/>
                                    <p:spacer width="40"/>
                                                                 <!--Command Buttons-->
                                <div class="d-flex align-items-center my-4">

                                        <p:commandButton 
                                            class="ui-button-warning mx-1"
                                            icon="fas fa-cogs"
                                            ajax="false"
                                            action="#{inwardReportDashboardController.processBedOccupancy}"
                                            value="Process" />
                                </div>
                                </p:panel>
                                <p:spacer width="20"/>
                                <p:panel class="w-100">
                                     <f:facet name="header">
                                        <h:outputLabel value="Bed Occupency Analysis Chart" styleClass="fa-bed"   class="mx-4 text-center fs-2 text-uppercase"/>
                                    </f:facet>
                                     <p:panel rendered="#{inwardReportDashboardController.bedOccupancyChart ne null}">
                                        <div class="w-100 d-flex justify-content-center align-items-center">
                                           <div style="width: 90%; max-width: 600px; height: 90%; min-height: 400px;">
                                               <p:pieChart model="#{inwardReportDashboardController.bedOccupancyChart}"/>
                                           </div>
                                        </div>
                                        <p:spacer height="20" />
                                        <div class="d-flex justify-content-center">
                                            <div style="width: 90%; max-width: 600px;">
                                                <p:dataTable value="#{inwardReportDashboardController.bedOccupancySummary}" var="sum">
                                                    <p:column headerText="Status">
                                                        <h:outputText value="#{sum.status}" />
                                                    </p:column>
                                                    <p:column headerText="Count" style="text-align: right;">
                                                        <h:outputText value="#{sum.count}" />
                                                    </p:column>
                                                    <p:columnGroup type="footer">
                                                        <p:row>
                                                            <p:column footerText="Total Beds:" style="text-align:right" />
                                                            <p:column footerText="#{inwardReportDashboardController.totalRooms}" style="text-align:right" />
                                                        </p:row>
                                                    </p:columnGroup>
                                                </p:dataTable>
                                            </div>
                                        </div>
                                    </p:panel>
                                </p:panel>


                            </h:panelGroup>
                        </div>
                    </h:panelGroup>
                </h:form>
            </ui:define>
        </ui:composition>
    </body>
</html>
