<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/inward/bill"
      xmlns:bic="http://xmlns.jcp.org/jsf/composite/bill">

    <h:body>

        <ui:composition template="/payments/pay_index.xhtml">

            <ui:define name="admin">
                <h:form>
                    <p:panel header="Reprint" >
                        <f:facet name="header" >
                            <div class="d-flex align-items-center justify-content-between w-100">
                                <div class="d-flex align-items-center gap-2">
                                    <h:outputText styleClass="fas fa-file-invoice" />
                                    <h:outputLabel value="Reprint" ></h:outputLabel>
                                </div>
                                <div class="d-flex gap-2 align-items-center">
                                    <p:commandButton
                                        id="btnPaperSettings"
                                        value="Settings"
                                        icon="fas fa-cog"
                                        class="ui-button-secondary"
                                        title="Choose the paper type of the payment vouchers"
                                        rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false) and webUserController.hasPrivilege('ChangeReceiptPrintingPaperTypes')}"
                                        type="button"
                                        onclick="PF('inwardDoctorPaymentReprintConfigDialog').show();" />
                                    <p:commandButton
                                        ajax="false" 
                                        class="ui-button-danger" 
                                        icon="fas fa-ban" 
                                        value="To Cancel" 
                                        disabled="#{inwardSearch.bill.cancelled or inwardSearch.billACancellationBill}"
                                        action="inward_bill_staff_payment_cancel" >                           
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <div class="row">
                            <div class="col-md-6">
                                <p:panel header="Staff Detail">
                                    <f:facet name="header">
                                        <h:outputText styleClass="fa fa-user-circle"></h:outputText>
                                        <h:outputLabel value="Staff Details" class="mx-4"></h:outputLabel>
                                    </f:facet>
                                    <h:panelGrid columns="3" class="w-100" style="font-size: 12pt">
                                        <h:outputLabel value="Staff ​Name" ></h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.staff.person.nameWithTitle }" ></h:outputLabel>
                                        <h:outputLabel value="Speciality" ></h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.staff.speciality.name }" ></h:outputLabel>
                                        <h:outputLabel value="Department" ></h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.staff.department.name }" ></h:outputLabel>
                                        <h:outputLabel value="Address" >
                                        </h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.staff.person.address}" >
                                        </h:outputLabel>
                                        <h:outputLabel value="Age" />
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.staff.person.ageAsString}"  />
                                        <h:outputLabel value="Phone" >
                                        </h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.staff.person.phone}" >
                                        </h:outputLabel>
                                    </h:panelGrid>
                                </p:panel>
                            </div>
                            <div class="col-md-6">
                                <p:panel>
                                    <f:facet name="header">
                                        <h:outputText styleClass="fas fa-file-invoice"></h:outputText>
                                        <h:outputLabel value="Bill Details" class="mx-4"></h:outputLabel>
                                    </f:facet>
                                    <h:panelGrid columns="3" class="w-100">
                                        <h:outputLabel value="Bill No " ></h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.deptId}" ></h:outputLabel>
                                        <h:outputLabel value="Payment Type " ></h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{inwardSearch.bill.paymentMethod}" ></h:outputLabel>
                                        <h:outputLabel value="Paid Amount" ></h:outputLabel>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{-inwardSearch.bill.absoluteNetTotal}" ></h:outputLabel>
                                    </h:panelGrid>
                                </p:panel>
                            </div>
                        </div>
                        <p:panel header="Bill Fee Details" class="my-2">
                            <p:dataTable value="#{inwardSearch.billItems}" var="bip21" emptyMessage="No Items" styleClass="p-datatable-sm" >
                                <p:column headerText="Bill No">
                                    <h:outputLabel value="#{bip21.bill.deptId}" />
                                </p:column>
                                <p:column headerText="Date">
                                    <h:outputLabel value="#{bip21.bill.createdAt}" />
                                </p:column>
                                <p:column>
                                    <f:facet name="header" >
                                        <h:outputLabel value="BHT No" ></h:outputLabel>
                                    </f:facet>                          
                                    <h:outputLabel value="#{bip21.referanceBillItem.bill.patientEncounter.bhtNo}"/>                                                                                
                                </p:column>
                                <p:column>
                                    <f:facet name="header" >
                                        <h:outputLabel value="Patient Name" ></h:outputLabel>
                                    </f:facet>                                    
                                    <h:outputLabel value="#{bip21.referanceBillItem.bill.patientEncounter.patient.person.nameWithTitle}"/>                                                                                
                                </p:column>
                                <p:column headerText="Fee" styleClass="text-end" >
                                    <h:outputLabel value="#{bip21.netValue}" />
                                </p:column>
                            </p:dataTable>
                        </p:panel>
                    </p:panel>
                </h:form>

                <h:form rendered="#{!configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false)}">
                    <p:commandButton icon="fas fa-print"
                                     class="ui-button-info my-2"
                                     title="Print the payment voucher"
                                     value="Print">
                        <p:printer target="gpBillPreview" />
                    </p:commandButton>
                    
                    <h:panelGroup id="gpBillPreview">

                        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a A4 paper.', true)}">
                            <bi:staffBill bill="#{inwardSearch.bill}" dup="true"/>
                        </h:panelGroup>
                        
                        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a A4 Custom 1 paper.', false)}">
                            <bi:staffBillCustom1 bill="#{inwardSearch.bill}" dup="true"/>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a five five paper.', false)}">
                            <bi:staff_payment_five_five_paper_with_headings duplicate="true" controller="#{inwardSearch}" bill="#{inwardSearch.bill}" />
                        </h:panelGroup>

                    </h:panelGroup>
                    
                </h:form>

                <!-- Bill format tabs and paper settings, like OPD Professional Payment reprint (#25999) -->
                <h:form id="frmReprintFormats" rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false)}">
                    <p:tabView id="tvBillFormats" dynamic="false">

                        <p:tab title="Detailed">
                            <p:commandButton
                                id="btnPrintDetailed"
                                value="Print Detailed"
                                class="ui-button-info mb-3"
                                icon="fas fa-print"
                                ajax="false"
                                action="#" >
                                <p:printer target="gpDetailedPreview" />
                            </p:commandButton>

                            <h:panelGroup id="gpDetailedPreview" >
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                    <bi:staffBill bill="#{inwardSearch.bill}" dup="true" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                    <bi:staff_payment_five_five_paper_with_headings duplicate="true" controller="#{inwardSearch}" bill="#{inwardSearch.bill}" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                    <bic:staff_payment_pos_detailed controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:tab>

                        <p:tab title="Summarised">
                            <p:commandButton
                                id="btnPrintSummarised"
                                value="Print Summarised"
                                class="ui-button-warning mb-3"
                                icon="fas fa-print"
                                ajax="false"
                                action="#" >
                                <p:printer target="gpSummarisedPreview" />
                            </p:commandButton>

                            <h:panelGroup id="gpSummarisedPreview" >
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                    <bic:A4PaperPaymentOPDDoctorSummarised controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" patientFeesLabel="Inpatient Professional Fees" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                    <bic:staff_payment_five_five_summarised controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" patientFeesLabel="Inpatient Professional Fees" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                    <bic:staff_payment_pos_summarised controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" patientFeesLabel="Inpatient Professional Fees" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:tab>

                        <p:tab title="Summary">
                            <p:commandButton
                                id="btnPrintSummary"
                                value="Print Summary"
                                class="ui-button-help mb-3"
                                icon="fas fa-print"
                                ajax="false"
                                action="#" >
                                <p:printer target="gpSummaryPreview" />
                            </p:commandButton>

                            <h:panelGroup id="gpSummaryPreview" >
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                    <bic:A4PaperPaymentOPDDoctorSummary controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" patientFeesLabel="Inpatient Professional Fees" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                    <bic:staff_payment_five_five_summary controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" patientFeesLabel="Inpatient Professional Fees" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                    <bic:staff_payment_pos_summary controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" patientFeesLabel="Inpatient Professional Fees" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:tab>

                        <p:tab title="Individual">
                            <p:commandButton
                                id="btnPrintIndividual"
                                value="Print Individual"
                                class="ui-button-danger mb-3"
                                icon="fas fa-print"
                                ajax="false"
                                action="#" >
                                <p:printer target="gpIndividualPreview" />
                            </p:commandButton>

                            <h:panelGroup id="gpIndividualPreview" >
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                    <bic:staff_payment_individual_a4 controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                    <bic:staff_payment_individual_five_five controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                    <bic:staff_payment_individual_pos controller="#{inwardSearch}" bill="#{inwardSearch.bill}" dup="true" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:tab>

                    </p:tabView>
                </h:form>

                <!-- Inward Doctor Payment paper settings (#25999) -->
                <p:dialog id="inwardDoctorPaymentReprintConfigDialog"
                          header="Inward Doctor Payment Printer Configuration"
                          widgetVar="inwardDoctorPaymentReprintConfigDialog"
                          rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false) and webUserController.hasPrivilege('ChangeReceiptPrintingPaperTypes')}"
                          modal="true"
                          width="600"
                          resizable="true"
                          closeOnEscape="true">

                    <p:ajax event="open" listener="#{pharmacyConfigController.loadCurrentConfig}" update=":#{p:resolveFirstComponentWithId('inwardDoctorPaymentReprintCheckboxes',view).clientId}" process="@this" />

                    <h:form id="inwardDoctorPaymentReprintConfigForm">
                        <h:panelGroup id="inwardDoctorPaymentReprintCheckboxes" layout="block">
                            <div class="mb-3">
                                <p:selectBooleanCheckbox
                                    id="inwardDocPayA4"
                                    value="#{pharmacyConfigController.inwardDoctorPaymentTabsA4Paper}" />
                                <p:outputLabel for="inwardDocPayA4" value="A4 Paper Format" class="ms-2" />
                            </div>
                            <div class="mb-3">
                                <p:selectBooleanCheckbox
                                    id="inwardDocPayFiveFive"
                                    value="#{pharmacyConfigController.inwardDoctorPaymentTabsFiveFivePaper}" />
                                <p:outputLabel for="inwardDocPayFiveFive" value="5x5 Paper Format" class="ms-2" />
                            </div>
                            <div class="mb-3">
                                <p:selectBooleanCheckbox
                                    id="inwardDocPayPos"
                                    value="#{pharmacyConfigController.inwardDoctorPaymentTabsPosPaper}" />
                                <p:outputLabel for="inwardDocPayPos" value="POS Paper Format" class="ms-2" />
                            </div>
                        </h:panelGroup>
                        <p:messages id="inwardDoctorPaymentReprintConfigMessages" showDetail="true" closable="true" />
                        <div class="d-flex gap-2">
                            <p:commandButton
                                value="Apply &amp; Close"
                                icon="fas fa-save"
                                class="ui-button-success"
                                ajax="false"
                                action="#{pharmacyConfigController.saveInwardDoctorPaymentTabsConfig}" />
                            <p:commandButton
                                value="Cancel"
                                icon="fas fa-times"
                                class="ui-button-secondary"
                                type="button"
                                onclick="PF('inwardDoctorPaymentReprintConfigDialog').hide(); return false;" />
                        </div>
                    </h:form>
                </p:dialog>

            </ui:define>

        </ui:composition>

    </h:body>
</html>
