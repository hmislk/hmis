<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:print="http://xmlns.jcp.org/jsf/composite/ezcomp/prints"
      xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:panelGroup >

                    <h:form id="refundForm">
                        <h:panelGroup rendered="#{!inwardServiceRefundController.printPreview}" styleClass="alignTop" >
                            <p:panel  header="Refund">
                                <f:facet name="header">
                                    <h:outputText value="Refund"/>
                                    <h:panelGroup style="float: right">
                                        <p:commandButton
                                            id="btnBackToProfile"
                                            ajax="false"
                                            value="Inpatient Profile"
                                            icon="fa fa-arrow-circle-left"
                                            class="ui-button-secondary m-1"
                                            action="#{inwardServiceRefundController.navigateBackToInpatientProfile()}" />
                                        <p:commandButton
                                            id="btnBackToReprint"
                                            ajax="false"
                                            value="Bill"
                                            icon="fa fa-file-invoice"
                                            class="ui-button-secondary m-1"
                                            action="#{inwardServiceRefundController.navigateBackToReprint()}" />
                                        <p:commandButton
                                            id="btnToSearch"
                                            ajax="false"
                                            value="Search"
                                            icon="fa fa-search"
                                            class="ui-button-secondary m-1"
                                            action="#{inwardServiceRefundController.navigateToInwardServiceSearch()}" />
                                        <p:inputText placeholder="Enter Comments to Refund Bill" value="#{inwardServiceRefundController.comment}" class="p-2 m-1" style="width: 20em;"/>

                                        <p:commandButton
                                            id="btnRefundBill"
                                            ajax="false"
                                            value="Refund Bill"
                                            icon="fa fa-money-bill-wave"
                                            class="ui-button-warning m-1"
                                            action="#{inwardServiceRefundController.refundInwardServiceBill()}"
                                            onclick="if (!confirm('Are you sure you want to Refund This Bill ?'))
                                                        return false;" >
                                        </p:commandButton>
                                    </h:panelGroup>
                                </f:facet>
                            </p:panel>
                            <div class="row my-2">
                                <div class="col-6">
                                    <p:panel>
                                        <f:facet name="header">
                                            <h:outputText styleClass="fas fa-id-card-alt"></h:outputText>
                                            <h:outputLabel value="Patient Details" class="mx-2"></h:outputLabel>
                                        </f:facet>
                                        <common:patient patient="#{inwardServiceRefundController.bill.patient}" class="w-100"/>
                                    </p:panel>
                                </div>
                                <div class="col-6">
                                    <p:panel header="Bill Detail">
                                        <p:panelGrid columns="2">
                                            <h:outputLabel value="Bill No :" ></h:outputLabel>
                                            <h:outputLabel value="#{inwardServiceRefundController.bill.deptId}" ></h:outputLabel>
                                            <h:outputLabel value="Total :" ></h:outputLabel>
                                            <h:outputLabel value="#{inwardServiceRefundController.bill.total}" ></h:outputLabel>
                                            <h:outputLabel value="Discount :" ></h:outputLabel>
                                            <h:outputLabel value="#{inwardServiceRefundController.bill.discount}" ></h:outputLabel>
                                            <h:outputLabel value="Net Total :" ></h:outputLabel>
                                            <h:outputLabel value="#{inwardServiceRefundController.bill.netTotal}" ></h:outputLabel>
                                            <h:outputLabel style="font-weight: bold;" value="Total Refund" >
                                            </h:outputLabel>
                                            <h:outputLabel id="txtTotal" style="font-weight: bold;" value="#{inwardServiceRefundController.refundAmount}" >
                                            </h:outputLabel>
                                        </p:panelGrid>
                                    </p:panel>
                                </div>
                            </div>


                            <p:panel header="Bill Item Detail">
                                <p:dataTable id="dtF" rowIndexVar="rowIndex" value="#{inwardSearch.billItems}" var="b"
                                             rowKey="#{b.id}"
                                             selection="#{inwardServiceRefundController.refundingItems}" >

                                    <p:ajax event="rowSelectCheckbox" listener="#{inwardServiceRefundController.calculateRefundTotal()}"
                                            update=":refundForm:txtTotal" />
                                    <p:ajax event="rowUnselectCheckbox" listener="#{inwardServiceRefundController.calculateRefundTotal()}"
                                            update=":refundForm:txtTotal" />
                                    <p:ajax event="toggleSelect" listener="#{inwardServiceRefundController.calculateRefundTotal()}"
                                            update=":refundForm:txtTotal" />

                                    <p:column selectionMode="multiple" style="width: 3em; text-align: center;" disabledSelection="#{b.refunded}" />

                                    <p:column headerText="Item Name">
                                        <h:outputLabel value="#{b.item.name}"/>
                                    </p:column>
                                    <p:column headerText="Fee Value" style="text-align: right;">
                                        <h:outputLabel value="#{b.netValue}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </p:column>
                                    <p:column headerText="Returned">
                                        <h:outputLabel rendered="#{b.refunded}" value="Returned" style="color: red;" />
                                    </p:column>
                                </p:dataTable>
                            </p:panel>

                        </h:panelGroup>

                        <h:panelGroup rendered="#{inwardServiceRefundController.printPreview}" >
                            <div id="centrewrabillSearch.biller">
                                <div id="centrecell">
                                    <div class="centrecontent">
                                        <div class="d-flex m-2 my-2">
                                            <p:outputLabel value="Paper Type" class="m-2"></p:outputLabel>
                                            <p:selectOneMenu value="#{sessionController.departmentPreference.inwardServiceBillPaperType}" class="m-1" style="width: 13em;">
                                                <f:selectItem itemLabel="Please Select Paper Type" />
                                                <f:selectItems value="#{enumController.paperTypes}" />
                                            </p:selectOneMenu>
                                            <p:commandButton ajax="false" icon="fa fa-sync-alt" class="ui-button m-1" title="Redraw Bill"></p:commandButton>
                                            <p:commandButton value="Print" ajax="false" action="#" class="ui-button-info mx-2 m-1" icon="fas fa-print">
                                                <p:printer target="gpBillPreview" ></p:printer>
                                            </p:commandButton>
                                            <p:commandButton value="Inpatient Profile" ajax="false" action="#{inwardServiceRefundController.navigateBackToInpatientProfile()}" class="ui-button-secondary mx-1 m-1" icon="fa fa-arrow-circle-left">
                                            </p:commandButton>
                                            <p:commandButton value="Bill" ajax="false" action="#{inwardServiceRefundController.navigateBackToReprint()}" class="ui-button-secondary mx-1 m-1" icon="fa fa-file-invoice">
                                            </p:commandButton>
                                            <p:commandButton value="Search" ajax="false" action="#{inwardServiceRefundController.navigateToInwardServiceSearch()}" class="ui-button-secondary mx-1 m-1" icon="fas fa-search">
                                            </p:commandButton>
                                        </div>


                                        <h:panelGroup id="gpBillPreview" >

<!--                                        <ui:repeat value="#{billBhtController.bills}" var="b" >
                                            <bi:inwardBillPrintFiveFive bill="#{b}" dup="false"/>   
                                        </ui:repeat>-->

                                            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'FiveFivePaper'}" >

                                                <print:five_five_paper_with_headings_inward_service bill="#{inwardServiceRefundController.bill.refundedBill}"/>

                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'FiveFivePrintedPaper'}" >

                                                <print:five_five_paper_without_headings_inward_service bill="#{inwardServiceRefundController.bill.refundedBill}" dup="false"/>

                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'PosPaper'}" >

                                                <print:posOpdBill_inward_service bill="#{inwardServiceRefundController.bill.refundedBill}" duplicate="false"/>

                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'A4Paper'}" >

                                                <print:A4_paper_with_headings bill="#{inwardServiceRefundController.bill.refundedBill}" duplicate="false"/>

                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'A4PrintedPaper'}" >

                                                <print:A4_paper_without_headings bill="#{inwardServiceRefundController.bill.refundedBill}" duplicate="false"/>

                                            </h:panelGroup>

                                        </h:panelGroup>


                                        <!--                                        <h:outputStylesheet library="css" name="printing.css"></h:outputStylesheet>
                                        
                                                                                <div style="border: 1px solid;" >
                                                                                    <h:panelGroup id="gpBillPreview" >
                                        
                                                                                        <div  class="fiveinchbill">
                                        
                                        
                                                                                            <div  class="receiptnoPrinting">
                                        
                                                                                                <h:outputLabel value="#{billSearch.bill.refundedBill.deptId} **Refunded" /> 
                                        
                                                                                            </div>
                                        
                                                                                            <div  class="billdatePrinting">
                                        
                                                                                                <h:outputLabel value="#{billSearch.bill.refundedBill.billDate}">
                                                                                                    <f:convertDateTime pattern="#{sessionController.abillSearch.billlicationPreference.shortDateFormat}"/>
                                                                                                </h:outputLabel>
                                        
                                                                                            </div>
                                        
                                                                                            <div class="paymentPrinting">                                                     
                                                                                                <h:outputLabel value="#{billSearch.bill.refundedBill.paymentMethod}" />
                                        
                                                                                            </div>
                                        
                                                                                            <div class="billtimePrinting">                                                      
                                                                                                <h:outputLabel value="#{billSearch.bill.refundedBill.billTime}" >
                                                                                                    <f:convertDateTime pattern="#{sessionController.abillSearch.billlicationPreference.longTimeFormat}"/>
                                                                                                </h:outputLabel>
                                        
                                                                                            </div>
                                        
                                                                                            <h:outputLabel value="#{billSearch.bill.refundedBill.patient.person.nameWithTitle}" styleClass="ptnamePrinting" />
                                        
                                                                                            <h:outputLabel value="#{billSearch.bill.refundedBill.patient.person.phone}" styleClass="phonePrinting" />
                                        
                                        
                                        
                                                                                            <h:dataTable value="#{billSearch.refundingItems}" var="bip" styleClass="itemsPrinting">
                                                                                                <h:column >
                                                                                                    <h:outputLabel value="#{bip.item.printName}" style="margin: 4px; font-size: 11px;" />
                                                                                                </h:column>
                                                                                            </h:dataTable>
                                        
                                                                                            <div class="ratesPrinting" >
                                                                                                <h:dataTable value="#{billSearch.refundingItems}" var="bip1"  >
                                                                                                    <h:column>
                                                                                                        <h:outputLabel value="#{bip1.netValue}"  style="margin: 4px; font-size: 11px;" >
                                                                                                            <f:convertNumber pattern="#,##0.00" />
                                                                                                        </h:outputLabel>
                                                                                                    </h:column>
                                                                                                </h:dataTable>
                                                                                            </div>
                                        
                                                                                            <div class="totalsPrinting">
                                                                                                <table>
                                                                                                    <tr>
                                                                                                        <td>
                                                                                                            <br/>
                                                                                                            <br/>
                                                                                                        </td>
                                                                                                        <td>
                                                                                                            <br/>
                                                                                                            <br/>
                                                                                                        </td>
                                                                                                    </tr>
                                                                                                    <tr>
                                                                                                        <td style="text-align: left; min-width: 3cm;">
                                                                                                            <h:outputLabel value="TOTAL" style="  text-align: right!important;  font-size: 15px!important; font-weight: bold;   "/>
                                                                                                        </td>
                                                                                                        <td style="text-align: right!important; ">
                                                                                                            <h:outputLabel value="#{billSearch.bill.refundedBill.total}"  style=" font-weight: bold ; text-align: right!important; font-size: 15px!important;    ">
                                                                                                                <f:convertNumber pattern="#,##0.00" />
                                                                                                            </h:outputLabel>
                                                                                                        </td>
                                                                                                    </tr>
                                                                                                    <tr>
                                                                                                        <td style="text-align: left;">
                                                                                                            <h:outputLabel  style=" text-align: right!important;  font-size: 15px!important;   "  value="Discount"/>
                                                                                                        </td>
                                                                                                        <td style="text-align: right!important; ">
                                                                                                            <h:outputLabel value="#{billSearch.bill.refundedBill.discount}" 
                                                                                                                           style=" text-align: right!important;  font-size: 15px!important;   ">
                                                                                                                <f:convertNumber pattern="#,##0.00" />
                                                                                                            </h:outputLabel>
                                                                                                        </td>
                                                                                                    </tr>
                                                                                                    <tr>
                                                                                                        <td style="text-align: left;">
                                                                                                            <h:outputLabel  value="Net Total" style=" text-align: right!important;  font-size: 15px!important;   "/>
                                                                                                        </td>
                                                                                                        <td style="text-align: right!important; ">
                                                                                                            <h:outputLabel  value="#{billSearch.bill.refundedBill.netTotal}"  
                                                                                                                            style="font-weight: bold ; text-align: right!important; font-size: 15px!important;    ">
                                                                                                                <f:convertNumber pattern="#,##0.00" />
                                                                                                            </h:outputLabel>
                                                                                                        </td>
                                                                                                    </tr>
                                        
                                        
                                                                                                </table>
                                                                                            </div>
                                        
                                                                                            <div class="cashierPrinting" >                                                        
                                                                                                <h:outputLabel value="Cashier : #{billSearch.bill.refundedBill.creater.code}" />
                                        
                                        
                                        
                                                                                            </div>
                                        
                                        
                                        
                                                                                        </div>
                                        
                                        
                                        
                                                                                    </h:panelGroup>
                                                                                </div>-->
                                    </div>
                                </div>
                            </div>
                        </h:panelGroup>

                    </h:form>
                </h:panelGroup>   

            </ui:define>

        </ui:composition>

    </h:body>
</html>
