<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form id="formDischargeMedicines" onkeypress="if(event.keyCode == 13 &amp;&amp; event.target.type != 'textarea') { return false; }">
                    <p:growl id="growlDischargeMedicines" showDetail="true" life="4000" />
                    <div class="row">
                        <div class="col-12 px-4">
                            <p:commandButton
                                value="Back to Assessment"
                                ajax="false"
                                action="#{inpatientClinicalDataController.navigateToCurrentAssessment()}"
                                icon="fa fa-arrow-left"
                                class="p-0 m-1">
                            </p:commandButton>
                            <p:commandButton
                                value="Assessment List"
                                ajax="false"
                                action="#{inpatientClinicalDataController.navigateToAssessmentListFromCapturePage()}"
                                icon="fa fa-list"
                                class="p-0 m-1">
                            </p:commandButton>
                            <p:commandButton
                                value="Inpatient Dashboard"
                                ajax="false"
                                action="#{admissionController.navigateToAdmissionProfilePage}"
                                icon="fa fa-id-card"
                                class="p-0 m-1">
                                <f:setPropertyActionListener
                                    value="#{inpatientClinicalDataController.parentAdmission}"
                                    target="#{admissionController.current}" />
                            </p:commandButton>
                            <p:commandButton
                                value="Inward Medicines"
                                ajax="false"
                                action="#{inpatientClinicalDataController.navigateToAssessmentInwardMedicines()}"
                                icon="fa fa-pills"
                                class="p-0 m-1">
                            </p:commandButton>
                        </div>
                    </div>

                    <h:panelGroup layout="block" rendered="#{webUserController.hasPrivilege('InpatientClinicalAssessment')}">
                        <div class="row px-4 py-2">
                            <div class="col-12">
                                <p:panel id="panelDischargeMedicines" class="w-100 m-1 p-0">
                                    <f:facet name="header">
                                        <div class="d-flex align-items-center justify-content-between w-100 fw-bold"
                                             style="background-color:#0d6efd; color:#ffffff; margin:-0.75rem -1rem; padding:0.6rem 1rem; border-top-left-radius:0.25rem; border-top-right-radius:0.25rem;">
                                            <p:outputLabel value="Discharge Medications" />
                                            <p:commandButton id="btnCreateDischargeIssueBill"
                                                             value="Create Discharge Issue Bill"
                                                             icon="fa fa-prescription-bottle-alt"
                                                             ajax="false"
                                                             rendered="#{webUserController.hasPrivilege('PharmacyDischargeMedicineIssue')}"
                                                             title="Issue the ticked discharge medicines from your pharmacy (no service charge)"
                                                             styleClass="ui-button-warning ui-button-sm"
                                                             process="@form"
                                                             action="#{inpatientClinicalDataController.createDischargeIssueBillFromSelected()}" />
                                        </div>
                                    </f:facet>
                                    <div class="container-fluid m-0 p-2 w-100">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-12 col-lg-4 d-flex flex-column">
                                                <p:outputLabel for="acDischargeMedicine" styleClass="w-100 fw-semibold mb-1" value="Medicine:" />
                                                <p:autoComplete id="acDischargeMedicine"
                                                                completeMethod="#{pharmaceuticalItemController.completeItem}"
                                                                value="#{inpatientClinicalDataController.dischargeMedicine.prescription.item}"
                                                                var="item"
                                                                class="w-100"
                                                                inputStyleClass="w-100"
                                                                itemLabel="#{item}"
                                                                itemValue="#{item}"
                                                                minQueryLength="4"
                                                                maxResults="10"
                                                                placeholder="Select Medicine" />
                                            </div>
                                            <div class="col-12 col-sm-6 col-lg-2 d-flex flex-column">
                                                <p:outputLabel for="txtDischargeDose" styleClass="fw-semibold mb-1" value="Dose:" />
                                                <div class="d-flex">
                                                    <p:inputText styleClass="flex-grow-1" style="min-width:0;" id="txtDischargeDose"
                                                                 value="#{inpatientClinicalDataController.dischargeMedicine.prescription.dose}"
                                                                 placeholder="Dose"/>
                                                    <p:selectOneMenu id="cmbDischargeDose"
                                                                     value="#{inpatientClinicalDataController.dischargeMedicine.prescription.doseUnit}">
                                                        <f:selectItem itemLabel="Select" />
                                                        <f:selectItems value="#{measurementUnitController.getDoseUnitsForMedicine(inpatientClinicalDataController.dischargeMedicine.prescription.item)}"
                                                                       var="du" itemLabel="#{du.name}" itemValue="#{du}" />
                                                    </p:selectOneMenu>
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-6 col-lg-2 d-flex flex-column">
                                                <p:outputLabel for="cmbDischargeFrequency" styleClass="fw-semibold mb-1" value="Frequency:" />
                                                <p:selectOneMenu id="cmbDischargeFrequency"
                                                                 styleClass="w-100"
                                                                 value="#{inpatientClinicalDataController.dischargeMedicine.prescription.frequencyUnit}">
                                                    <f:selectItem itemLabel="Select" />
                                                    <f:selectItems value="#{measurementUnitController.frequencyUnits}"
                                                                   var="du" itemLabel="#{du.name}" itemValue="#{du}" />
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="col-12 col-sm-6 col-lg-2 d-flex flex-column">
                                                <p:outputLabel for="txtDischargeDuration" styleClass="fw-semibold mb-1" value="Duration:" />
                                                <div class="d-flex">
                                                    <p:inputText styleClass="flex-grow-1" style="min-width:0;" id="txtDischargeDuration"
                                                                 value="#{inpatientClinicalDataController.dischargeMedicine.prescription.duration}"
                                                                 placeholder="Duration"/>
                                                    <p:selectOneMenu id="cmbDischargeDuration"
                                                                     value="#{inpatientClinicalDataController.dischargeMedicine.prescription.durationUnit}">
                                                        <f:selectItem itemLabel="Select" />
                                                        <f:selectItems value="#{measurementUnitController.durationUnits}"
                                                                       var="du" itemLabel="#{du.name}" itemValue="#{du}" />
                                                    </p:selectOneMenu>
                                                </div>
                                            </div>
                                            <div class="col-12 col-sm-6 col-lg-2 d-flex flex-column">
                                                <p:commandButton value="Add"
                                                                 id="btnAddDischargeRx"
                                                                 icon="fa fa-plus"
                                                                 styleClass="ui-button-success w-100"
                                                                 disabled="#{inpatientClinicalDataController.current == null or inpatientClinicalDataController.current.id == null}"
                                                                 process="btnAddDischargeRx acDischargeMedicine txtDischargeDose cmbDischargeDose cmbDischargeFrequency txtDischargeDuration cmbDischargeDuration"
                                                                 update="growlDischargeMedicines panelDischargeMedicines"
                                                                 action="#{inpatientClinicalDataController.addDischargeMedicine}" />
                                            </div>
                                        </div>
                                    </div>
                                    <p:dataTable id="tblDischargeRxx"
                                                 value="#{inpatientClinicalDataController.dischargeMedicines}"
                                                 var="drx"
                                                 rowKey="#{drx.id}"
                                                 selection="#{inpatientClinicalDataController.selectedDischargeMedicinesToIssue}"
                                                 selectionMode="multiple"
                                                 selectionPageOnly="false"
                                                 styleClass="w-100"
                                                 stripedRows="true"
                                                 size="small"
                                                 emptyMessage="No discharge medicines prescribed">
                                        <p:column selectionBox="true" style="width:3rem; text-align:center;"
                                                  rendered="#{webUserController.hasPrivilege('PharmacyDischargeMedicineIssue')}" />
                                        <p:column headerText="Medications">
                                            <h:outputText value="#{drx.prescription.formattedPrescription}" />
                                        </p:column>
                                        <p:column headerText="Prescribed By" style="width: 160px;">
                                            <h:outputText value="#{drx.prescription.prescribedBy.name}" />
                                        </p:column>
                                        <p:column headerText="Prescribed At" style="width: 150px;">
                                            <h:outputText value="#{drx.prescription.prescribedAt}">
                                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm" timeZone="Asia/Colombo" />
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="Comment">
                                            <h:outputText value="#{drx.prescription.comment}" />
                                        </p:column>
                                        <p:column headerText="" style="width:4rem; text-align:center;">
                                            <p:commandButton icon="pi pi-times"
                                                             styleClass="ui-button-danger ui-button-sm"
                                                             title="Remove this discharge medicine"
                                                             process="@this"
                                                             update=":formDischargeMedicines:growlDischargeMedicines :formDischargeMedicines:panelDischargeMedicines"
                                                             onclick="if (!confirm('Are you sure you want to delete this prescription?')) return false;"
                                                             action="#{inpatientClinicalDataController.removeClinicalFindingValueForComposite(inpatientClinicalDataController.dischargeMedicines, drx)}" />
                                        </p:column>
                                    </p:dataTable>
                                </p:panel>
                            </div>
                        </div>
                    </h:panelGroup>

                    <h:panelGroup layout="block" rendered="#{not webUserController.hasPrivilege('InpatientClinicalAssessment')}">
                        <div class="row px-4">
                            <div class="col-12">
                                <p:panel class="m-1">
                                    <h:outputText value="You do not have permission to access Clinical Assessments." />
                                </p:panel>
                            </div>
                        </div>
                    </h:panelGroup>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
