<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui">


    <ui:define name="content">
        <h:form id="frmRoomOccupancy">
            <p:panel>
                <f:facet name="header">
                    <div class="d-flex justify-content-between align-items-center w-100">
                        <div class="d-flex align-items-center gap-2">
                            <h:outputText styleClass="fas fa-bed"/>
                            <h:outputText value="Room Occupancy Details"/>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <p:commandButton id="btnExcel"
                                             value="Excel"
                                             icon="fas fa-file-excel"
                                             ajax="false"
                                             styleClass="ui-button-secondary">
                                <p:dataExporter type="xlsx" target="tblRooms" fileName="Room_Occupancy"/>
                            </p:commandButton>
                            <p:commandButton id="btnFillCharge"
                                             value="Occupied (Room-Charge Types)"
                                             icon="fas fa-sync-alt"
                                             title="List patients in rooms, for admission types that charge room fees"
                                             action="#{roomOccupancyController.createPatientRoom}"
                                             update="pnlResults"
                                             styleClass="ui-button-warning"/>
                            <p:commandButton id="btnFillAll"
                                             value="Occupied (All)"
                                             icon="fas fa-sync-alt"
                                             style="min-width:120px"
                                             title="List every patient currently in a room"
                                             action="#{roomOccupancyController.createPatientRoomAll}"
                                             update="pnlResults"
                                             styleClass="ui-button-success"/>
                        </div>
                    </div>
                </f:facet>

                <div class="row">
                    <div class="col-md-2">
                        <h:panelGroup id="pnlFilters" layout="block">
                            <div class="mb-1">
                                <h:outputText styleClass="fa fa-university me-1"/>
                                <p:outputLabel value="Institution" for="acIns"/>
                            </div>
                            <p:autoComplete id="acIns"
                                            value="#{roomOccupancyController.institution}"
                                            completeMethod="#{institutionController.completeAdmissionInstitution}"
                                            var="ins"
                                            itemLabel="#{ins.name}"
                                            itemValue="#{ins}"
                                            forceSelection="true"
                                            maxResults="15"
                                            disabled="#{not roomOccupancyController.anyInstitutionAllowed}"
                                            inputStyleClass="w-100"
                                            styleClass="w-100"
                                            placeholder="All institutions">
                                <p:ajax event="itemSelect"
                                        listener="#{roomOccupancyController.refresh}"
                                        update="pnlResults"/>
                                <p:ajax event="clear"
                                        listener="#{roomOccupancyController.showAllInstitutions}"
                                        update="pnlResults"/>
                            </p:autoComplete>
                            <p:commandButton id="btnAllIns"
                                             value="All Institutions"
                                             icon="fas fa-globe"
                                             rendered="#{roomOccupancyController.anyInstitutionAllowed}"
                                             action="#{roomOccupancyController.showAllInstitutions}"
                                             update="pnlFilters pnlResults"
                                             styleClass="ui-button-secondary ui-button-outlined mt-2 w-100"/>
                        </h:panelGroup>
                    </div>

                    <div class="col-md-10">
                        <h:panelGroup id="pnlResults" layout="block">
                            <div class="mb-1">
                                <h:outputText value="Rows: #{roomOccupancyController.rowCount}" styleClass="fw-bold"/>
                            </div>
                            <p:dataTable id="tblRooms"
                                         widgetVar="wgtRooms"
                                         value="#{roomOccupancyController.patientRooms}"
                                         var="pr"
                                         rowKey="#{pr.id}"
                                         styleClass="p-datatable-sm"
                                         emptyMessage="No occupied rooms found"
                                         paginator="true"
                                         rows="20"
                                         paginatorPosition="bottom"
                                         paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         rowsPerPageTemplate="10,20,50">
                                <p:column headerText="Room No"
                                          sortBy="#{pr.roomFacilityCharge.room.name}"
                                          filterBy="#{pr.roomFacilityCharge.room.name}"
                                          filterMatchMode="contains"
                                          style="width:9rem"
                                          styleClass="text-center">
                                    <h:outputText value="#{pr.roomFacilityCharge.room.name}"
                                                  class="#{pr.patientEncounter.discharged ? 'discharged-color' : 'not-discharged-color'}"/>
                                    <h:outputText value=" ✓" escape="false"
                                                  rendered="#{pr.patientEncounter.discharged}"
                                                  title="Discharged" style="color: green;"/>
                                    <h:outputText value=" ✕" escape="false"
                                                  rendered="#{not pr.patientEncounter.discharged}"
                                                  title="Not Discharged" style="color: red;"/>
                                </p:column>

                                <p:column headerText="Institution"
                                          sortBy="#{pr.patientEncounter.institution.name}"
                                          filterBy="#{pr.patientEncounter.institution.name}"
                                          filterMatchMode="contains"
                                          style="width:12rem">
                                    <h:outputText value="#{pr.patientEncounter.institution eq null ? '-' : pr.patientEncounter.institution.name}"/>
                                </p:column>

                                <p:column headerText="BHT No"
                                          sortBy="#{pr.patientEncounter.bhtNo}"
                                          filterBy="#{pr.patientEncounter.bhtNo}"
                                          filterMatchMode="contains"
                                          style="width:10rem"
                                          styleClass="text-center">
                                    <p:commandLink value="#{pr.patientEncounter.bhtNo}"
                                                   ajax="false"
                                                   action="#{bhtSummeryController.navigateToInpatientProfile}">
                                        <f:setPropertyActionListener value="#{pr.patientEncounter}"
                                                                     target="#{admissionController.current}"/>
                                    </p:commandLink>
                                </p:column>

                                <p:column headerText="Patient"
                                          sortBy="#{pr.patientEncounter.patient.person.name}"
                                          filterBy="#{pr.patientEncounter.patient.person.name}"
                                          filterMatchMode="contains">
                                    <h:outputText value="#{pr.patientEncounter.patient.person.name}"/>
                                </p:column>

                                <p:column headerText="Guardian"
                                          rendered="#{roomOccupancyController.anyGuardian}"
                                          sortBy="#{pr.patientEncounter.guardian.name}"
                                          filterBy="#{pr.patientEncounter.guardian.name}"
                                          filterMatchMode="contains">
                                    <h:outputText value="#{pr.patientEncounter.guardian.name}"/>
                                </p:column>

                                <p:column headerText="Guardian Phone"
                                          rendered="#{roomOccupancyController.anyGuardian}"
                                          sortBy="#{pr.patientEncounter.guardian.phone}"
                                          filterBy="#{pr.patientEncounter.guardian.phone}"
                                          filterMatchMode="contains"
                                          style="width:9rem">
                                    <h:outputText value="#{pr.patientEncounter.guardian.phone}"/>
                                </p:column>

                                <p:column headerText="Credit Company"
                                          rendered="#{roomOccupancyController.anyCreditCompany}"
                                          sortBy="#{pr.patientEncounter.creditCompany.name}"
                                          filterBy="#{pr.patientEncounter.creditCompany.name}"
                                          filterMatchMode="contains">
                                    <h:outputText value="#{pr.patientEncounter.creditCompany.name}"/>
                                </p:column>

                                <p:column headerText="Payment Method"
                                          style="width:9rem"
                                          styleClass="text-center">
                                    <h:outputText value="#{pr.patientEncounter.paymentMethod}"/>
                                </p:column>

                                <p:column headerText="Action"
                                          exportable="false"
                                          rendered="#{webUserController.hasPrivilege('InwardRoomDischarge')}"
                                          style="width:12rem"
                                          styleClass="text-center">
                                    <p:commandButton ajax="false"
                                                     value="Discharge from Room"
                                                     rendered="#{not pr.discharged}"
                                                     action="#{roomOccupancyController.dischargeFromRoom(pr)}"/>
                                    <p:commandButton ajax="false"
                                                     value="Cancel Discharge from Room"
                                                     rendered="#{pr.discharged}"
                                                     action="#{roomOccupancyController.dischargeCancelFromRoom(pr)}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </div>
                </div>
            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
