<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common">

    <h:body>

        <ui:composition template="/resources/template/template.xhtml">

            <ui:define name="content">
                <h:form id="formFinalBillVersions">

                    <p:panel rendered="#{webUserController.hasPrivilege('InwardSettleFinalBill')}">

                        <f:facet name="header">
                            <div class="d-flex justify-content-between">
                                <div class="d-flex">
                                    <h:outputText styleClass="fas fa-file-invoice"></h:outputText>
                                    <h:outputLabel value="Final Bill Versions" class="mx-4"></h:outputLabel>
                                </div>
                                <div class="d-flex gap-2">
                                    <p:commandButton
                                        ajax="false"
                                        icon="fas fa-id-card"
                                        class="ui-button-secondary"
                                        value="Inpatient Dashboard"
                                        action="#{bhtSummeryController.navigateToInpatientProfile()}"
                                        title="Back to Inpatient Dashboard">
                                        <f:setPropertyActionListener
                                            value="#{inwardSearch.admission}"
                                            target="#{admissionController.current}">
                                        </f:setPropertyActionListener>
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <div class="row mt-3">
                            <div class="col-lg-6">
                                <common:patient_details_for_addmission editable="false" searchable="false" controller="#{admissionController}" class="w-100" />
                            </div>
                            <div class="col-lg-6">
                                <common:admission_details admission="#{admissionController.current}" class="w-100"/>
                            </div>
                        </div>

                        <p:panel class="mt-3">
                            <f:facet name="header">
                                <h:outputLabel value="All Final Bill Versions"></h:outputLabel>
                            </f:facet>

                            <p:dataTable
                                id="tblFinalBillVersions"
                                widgetVar="wTblFinalBillVersions"
                                rowKey="#{b.id}"
                                value="#{inwardSearch.finalBillVersions}"
                                var="b"
                                emptyMessage="No final bill versions found."
                                paginator="true"
                                rows="10"
                                paginatorAlwaysVisible="false"
                                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                                class="w-100">

                                <p:column headerText="Bill Number">
                                    <h:outputText value="#{b.deptId}" />
                                </p:column>

                                <p:column headerText="Created">
                                    <h:outputText value="#{b.createdAt}">
                                        <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                    </h:outputText>
                                    <br/>
                                    <h:outputText value="#{b.creater.webUserPerson.name}" styleClass="text-muted" />
                                </p:column>

                                <p:column headerText="Net Total" style="text-align: right;">
                                    <h:outputText value="#{b.netTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Claimable Total" style="text-align: right;">
                                    <h:outputText value="#{b.claimableTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Status">
                                    <p:tag value="Pending Approval" severity="warning" rendered="#{not b.approvedFinalBill}" />
                                    <p:tag value="Confirmed" severity="success" rendered="#{b.approvedFinalBill and b.confirmedFinalBill}" />
                                    <p:tag value="Cancelled" severity="danger" rendered="#{b.approvedFinalBill and not b.confirmedFinalBill and b.cancelled}" />
                                    <p:tag value="Available" severity="secondary" rendered="#{b.approvedFinalBill and not b.confirmedFinalBill and not b.cancelled}" />
                                </p:column>

                                <p:column headerText="Actions" width="420">

                                    <p:commandButton
                                        ajax="false"
                                        icon="fa fa-gavel"
                                        class="ui-button-primary me-1"
                                        value="Approve"
                                        title="Review and Approve #{b.deptId}"
                                        action="#{inwardSearch.navigateToApproveFinalBill(b)}"
                                        rendered="#{not b.approvedFinalBill and webUserController.hasPrivilege('InwardFinalBillApprove')}">
                                    </p:commandButton>

                                    <p:commandButton
                                        ajax="false"
                                        icon="fa fa-print"
                                        class="ui-button-info me-1"
                                        value="View / Print"
                                        title="View #{b.deptId}"
                                        action="/inward/inward_reprint_bill_final?faces-redirect=true"
                                        rendered="#{b.approvedFinalBill}">
                                        <f:setPropertyActionListener
                                            value="#{b}"
                                            target="#{inwardSearch.bill}">
                                        </f:setPropertyActionListener>
                                    </p:commandButton>

                                    <p:commandButton
                                        ajax="false"
                                        icon="fa fa-check-circle"
                                        class="ui-button-success me-1"
                                        value="Set as Confirmed"
                                        title="Set as Confirmed #{b.deptId}"
                                        actionListener="#{inwardSearch.setAsConfirmedFinalBill(b)}"
                                        rendered="#{b.approvedFinalBill and not b.cancelled and not b.confirmedFinalBill and webUserController.hasPrivilege('InwardFinalBillSetConfirmed')}">
                                        <p:confirm header="Confirm" message="Set bill #{b.deptId} as the Confirmed Final Bill?" icon="pi pi-exclamation-triangle" />
                                    </p:commandButton>

                                    <p:commandButton
                                        ajax="false"
                                        icon="fa fa-plus"
                                        class="ui-button-warning me-1"
                                        value="Create New Version"
                                        title="Create New Version from #{b.deptId}"
                                        action="#{bhtSummeryController.createNewVersionFromBill(b)}"
                                        rendered="#{not b.cancelled and webUserController.hasPrivilege('InwardFinalBillCreateVersion')}">
                                    </p:commandButton>

                                    <p:commandButton
                                        ajax="false"
                                        icon="fa fa-trash"
                                        class="ui-button-danger me-1"
                                        value="Retire"
                                        title="Retire #{b.deptId}"
                                        actionListener="#{inwardSearch.retireFinalBillVersion(b)}"
                                        rendered="#{not b.retired and not b.confirmedFinalBill and webUserController.hasPrivilege('InwardFinalBillRetire')}">
                                        <p:confirm header="Confirm" message="Retire bill #{b.deptId}? This cannot be undone." icon="pi pi-exclamation-triangle" />
                                    </p:commandButton>

                                    <p:commandButton
                                        ajax="false"
                                        icon="fa fa-envelope"
                                        class="ui-button-help"
                                        value="Email"
                                        title="Email #{b.deptId}"
                                        action="#{inwardSearch.prepareEmailFinalBillVersion(b)}"
                                        rendered="#{b.approvedFinalBill and webUserController.hasPrivilege('InwardFinalBillEmail')}">
                                    </p:commandButton>

                                </p:column>

                            </p:dataTable>

                        </p:panel>

                    </p:panel>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes ui-button-success" icon="pi pi-check" />
                        <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times" />
                    </p:confirmDialog>

                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
