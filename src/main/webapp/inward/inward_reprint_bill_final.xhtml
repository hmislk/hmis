    <h:body>

        <ui:composition template="/resources/template/template.xhtml">

            <ui:define name="content">
                <h:form>
                    <p:panel rendered="#{inwardSearch.patient.person ne null}">
                        <p:panel styleClass="alignTop" rendered="#{inwardSearch.patient.person ne null}" class="">
                            <f:facet name="header">
                                <div class="d-flex justify-content-between">
                                    <div class="d-flex">
                                        <h:outputText styleClass="fas fa-print"></h:outputText>
                                        <h:outputLabel value="Final Bill" class="mx-4"></h:outputLabel>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <p:selectBooleanCheckbox value="#{inwardSearch.showOrginalBill}"
                                                                 label="Show Original Bill" itemLabel="Show Original Bill"
                                                                 class="mx-2">
                                            <p:ajax process="@this" update="@all"/>
                                        </p:selectBooleanCheckbox>
                                        <p:commandButton
                                            icon=" fa fa-refresh"
                                            value="Process Bill"
                                            action="#"
                                            ajax="false" />
                                        <p:commandButton
                                            ajax="false"
                                            icon="fa fa-cancel"
                                            class="ui-button-danger"
                                            value="To Cancel Bill"
                                            action="inward_cancel_bill_final?faces-redirect=true"
                                            disabled="#{inwardSearch.bill.cancelled}"  />
                                        <p:commandButton
                                            ajax="false"
                                            icon="fa fa-plus"
                                            class="ui-button-warning"
                                            value="Create New Version"
                                            title="Create New Version from #{inwardSearch.bill.deptId}"
                                            action="#{bhtSummeryController.createNewVersionFromBill(inwardSearch.bill)}"
                                            rendered="#{not inwardSearch.bill.cancelled and webUserController.hasPrivilege('InwardFinalBillCreateVersion')}" />
                                        <p:commandButton
                                            ajax="false"
                                            icon="fas fa-id-card"
                                            class="ui-button-secondary "
                                            value="Inpatient Dashboard"
                                            action="#{bhtSummeryController.navigateToInpatientProfile()}"
                                            >
                                            <f:setPropertyActionListener
                                                value="#{bhtSummeryController.patientEncounter}"
                                                target="#{admissionController.current}" >
                                            </f:setPropertyActionListener>
                                        </p:commandButton>
                                    </div>
                                </div>

                                <h:panelGroup rendered="false">
                                    <div class="d-flex justify-content-between mb-2" style="display: ">
                                        <div></div>
                                        <div class="d-flex gap-2">
                                            <p:commandButton value="Final Bill &amp; Profesional Bill - Single page" ajax="false">
                                                <p:printer  ></p:printer>
                                            </p:commandButton>
                                            <p:commandButton value="Final Bill &amp; Profesional Bill - 3 pages" ajax="false">
                                                <p:printer  ></p:printer>
                                            </p:commandButton>
                                            <p:commandButton value="Final Bill &amp; Profesional Bill (Duplicate)" ajax="false">
                                                <p:printer  ></p:printer>
                                            </p:commandButton>
                                            <p:commandButton value="Print Credit Company Letter" ajax="false">
                                                <p:printer  ></p:printer>
                                            </p:commandButton>
                                        </div>
                                    </div>
                                </h:panelGroup>

                            </f:facet>

                            <div class="row mt-3">
                                <div class="col-lg-4">
                                    <common:patient_details_for_addmission editable="true" searchable="false" controller="#{admissionController}" class="w-100" />
                                </div>
                                <div class="col-lg-4">
                                    <common:admission_details admission="#{admissionController.current}" class="w-100"/>
                                </div>
                                <div class="col-lg-4">
                                    <p:panel>
                                        <f:facet name="header">
                                            <div class="d-flex justify-content-between">
                                                <div class="d-flex gap-2 mt-2">
                                                    <i Class="fa fa-file-invoice mt-1"></i>
                                                    <h:outputLabel value="Bill Details" ></h:outputLabel>
                                                </div>
                                                <div>
                                                    <p:commandButton 
                                                        value="View Charges" 
                                                        icon="fa fa-line-chart"
                                                        type="button" 
                                                        onclick="PF('chargesList').show();" >
                                                    </p:commandButton>

                                                    <p:dialog header="Inward Charges List" widgetVar="chargesList" modal="true" height="60vh" width="75vw">
                                                        <in:finalTable bill="#{inwardSearch.bill}"/>
                                                    </p:dialog>
                                                </div>
                                            </div>

                                        </f:facet>

                                        <div  style="font-size: 20px; font-weight: 700;">
                                            <div class="row">
                                                <div class="col-md-5">
                                                    <h:outputLabel value="Bill No" ></h:outputLabel>
                                                </div>
                                                <div class="col-md-1 justify-content-end d-flex">
                                                    <p:outputLabel value=":" class="mx-2"/>
                                                </div>
                                                <div class="col-md-6">
                                                    <h:outputLabel value="#{inwardSearch.bill.deptId}" style="float: right;"></h:outputLabel>
                                                </div>
                                            </div>

                                            <div class="row mt-3">
                                                <div class="col-md-5">
                                                    <h:outputLabel value="Total" ></h:outputLabel>
                                                </div>
                                                <div class="col-md-1 justify-content-end d-flex">
                                                    <p:outputLabel value=":" class="mx-2"/>
                                                </div>
                                                <div class="col-md-6">
                                                    <h:outputLabel value="#{inwardSearch.bill.grantTotal}" style="float: right;" >
                                                        <f:convertNumber pattern="#,##0.00" />
                                                    </h:outputLabel>
                                                </div>
                                            </div>

                                            <div class="row mt-3">
                                                <div class="col-md-5">
                                                    <h:outputLabel value="Discount" ></h:outputLabel>
                                                </div>
                                                <div class="col-md-1 justify-content-end d-flex">
                                                    <p:outputLabel value=":" class="mx-2"/>
                                                </div>
                                                <div class="col-md-6">
                                                    <h:outputLabel value="#{inwardSearch.bill.discount}" style="float: right;" >
                                                        <f:convertNumber pattern="#,##0.00" />
                                                    </h:outputLabel>
                                                </div>
                                            </div>

                                            <div class="row mt-3">
                                                <div class="col-md-5">
                                                    <h:outputLabel value="Net Total" ></h:outputLabel>
                                                </div>
                                                <div class="col-md-1 justify-content-end d-flex">
                                                    <p:outputLabel value=":" class="mx-2"/>
                                                </div>
                                                <div class="col-md-6">
                                                    <h:outputLabel value="#{inwardSearch.bill.netTotal}" style="float: right;" >
                                                        <f:convertNumber pattern="#,##0.00" />
                                                    </h:outputLabel>
                                                </div>
                                            </div>

                                            <div class="row mt-3">
                                                <div class="col-md-5">
                                                    <h:outputLabel value="Paid Amount" ></h:outputLabel>
                                                </div>
                                                <div class="col-md-1 justify-content-end d-flex">
                                                    <p:outputLabel value=":" class="mx-2"/>
                                                </div>
                                                <div class="col-md-6">
                                                    <h:outputLabel value="#{inwardSearch.bill.paidAmount+inwardSearch.bill.patientEncounter.paidByCreditCompany}" style="float: right;" >
                                                        <f:convertNumber pattern="#,##0.00" />
                                                    </h:outputLabel>
                                                </div>
                                            </div>

                                            <div class="row mt-3">
                                                <div class="col-md-5">
                                                    <h:outputLabel value="Due " ></h:outputLabel>
                                                </div>
                                                <div class="col-md-1 justify-content-end d-flex">
                                                    <p:outputLabel value=":" class="mx-2"/>
                                                </div>
                                                <div class="col-md-6">
                                                    <h:outputLabel value="#{inwardSearch.bill.netTotal-(inwardSearch.bill.paidAmount+inwardSearch.bill.patientEncounter.paidByCreditCompany)}" style="float: right;" >
                                                        <f:convertNumber pattern="#,##0.00" />
                                                    </h:outputLabel>
                                                </div>
                                            </div>

                                            <h:panelGroup rendered="#{inwardSearch.bill.patientEncounter.paymentMethod eq 'Credit'}">
                                                <div class="row mt-3">
                                                    <div class="col-md-5 mt-2 d-flex gap-2">
                                                        <h:outputLabel value="Credit Limit" class="mt-2"/>
                                                        <p:commandButton
                                                            ajax="false"
                                                            icon="fa fa-pencil"
                                                            id="edit_credit_limit"
                                                            class="ui-button-warning"
                                                            action="#{inwardSearch.edit()}">
                                                        </p:commandButton>
                                                    </div>
                                                    <div class="col-md-1 justify-content-end d-flex mt-2">
                                                        <p:outputLabel value=":" class="mx-2 mt-2" />
                                                    </div>
                                                    <div class="col-md-6">
                                                        <p:inputText value="#{inwardSearch.bill.patientEncounter.creditLimit}" style="float: right;"  class="mt-2">
                                                            <f:convertNumber pattern="#,##0.00" />
                                                        </p:inputText>
                                                    </div>
                                                </div>

                                                <p:tooltip for="edit_credit_limit" value="Edit Credit Limit"  showDelay="0" hideDelay="0"></p:tooltip>

                                            </h:panelGroup>

                                        </div>

                                    </p:panel>
                                </div>
                            </div>

                            <div class="row mt-3">
                                <div class="col-lg-12">
                                    <p:panel header="Sent Emails">
                                        <p:dataTable
                                            value="#{inwardSearch.sentEmailsForBill}"
                                            var="e"
                                            emptyMessage="No emails sent for this bill.">
                                            <p:column headerText="Recipient">
                                                <h:outputText value="#{e.receipientEmail}" />
                                            </p:column>
                                            <p:column headerText="Subject">
                                                <h:outputText value="#{e.messageSubject}" />
                                            </p:column>
                                            <p:column headerText="Sent At">
                                                <h:outputText value="#{e.sentAt}">
                                                    <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                                </h:outputText>
                                            </p:column>
                                            <p:column headerText="Status">
                                                <p:tag value="Sent" severity="success" rendered="#{e.sentSuccessfully}" />
                                                <p:tag value="Pending" severity="warning" rendered="#{e.pending and not e.sentSuccessfully}" />
                                                <p:tag value="Failed" severity="danger" rendered="#{not e.pending and not e.sentSuccessfully}" />
                                            </p:column>
                                        </p:dataTable>
                                    </p:panel>
                                </div>
                            </div>

                            <p:tabView rendered="true">
                                <p:tab title="Final Bill"  >

                                    <div class="row">
                                        <div class="col-lg-6">
                                            <p:panel>
                                                <f:facet name="header">
                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Original" class="mt-2"/></div>
                                                        <div class="d-flex gap-2">
                                                            <p:selectBooleanCheckbox
                                                                id="box"
                                                                rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Final Bill - Disable With Professional Fee in Final Bill',true)}"
                                                                value="#{inwardSearch.withProfessionalFee}"
                                                                itemLabel="With Professional Fee">
                                                                <p:ajax process="@this" update="finalOriginalBillPriview"/>
                                                            </p:selectBooleanCheckbox>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Hospital Bill"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="finalOriginalBillPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>

                                                    </div>
                                                </f:facet>

                                                <h:panelGroup id="finalOriginalBillPriview">
                                                    <bi:finalBill bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" showProfessional="#{inwardSearch.withProfessionalFee}" /> **Hospital Bill**Original Bill**
                                                </h:panelGroup>

                                            </p:panel>
                                        </div>
                                        <div class="col-lg-6">
                                            <p:panel>
                                                <f:facet name="header">
                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Duplicate" class="mt-2"/></div>
                                                        <div class="d-flex gap-2">
                                                            <p:selectBooleanCheckbox
                                                                value="#{inwardSearch.withProfessionalFee}"
                                                                itemLabel="With Professional Fee"
                                                                rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Final Bill - Disable With Professional Fee in Final Bill',true)}">
                                                                <p:ajax process="@this" update="finalDuplicateBillPriview"/>
                                                            </p:selectBooleanCheckbox>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Hospital Bill"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="finalDuplicateBillPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>
                                                    </div>
                                                </f:facet>

                                                <h:panelGroup id="finalDuplicateBillPriview">
                                                    <bi:finalBill bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" duplicate="true" showProfessional="#{inwardSearch.withProfessionalFee}"/>
                                                </h:panelGroup>

                                            </p:panel>
                                        </div>
                                    </div>

                                </p:tab>

                                <p:tab title="Hospital Bill" >
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <p:panel>
                                                <f:facet name="header">
                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Original" class="mt-2"/></div>
                                                        <div class="d-flex gap-2">
                                                            <p:selectBooleanCheckbox
                                                                value="#{inwardSearch.withProfessionalFee}"
                                                                itemLabel="With Professional Fee"
                                                                rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Final Bill - Disable With Professional Fee in Final Bill',true)}">
                                                                <p:ajax process="@this" update="originalHospitalBillPriview"/>
                                                            </p:selectBooleanCheckbox>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Hospital Bill"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="originalHospitalBillPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>
                                                    </div>
                                                </f:facet>

                                                <h:panelGroup id="originalHospitalBillPriview">
                                                    <bi:finalBill bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" hosCopy="true" showProfessional="#{inwardSearch.withProfessionalFee}" /><!-- **Hospital Bill**Original Bill**-->
                                                </h:panelGroup>

                                            </p:panel>
                                        </div>
                                        <div class="col-lg-6">
                                            <p:panel>
                                                <f:facet name="header">
                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Duplicate" class="mt-2"/></div>
                                                        <div class="d-flex gap-2">
                                                            <p:selectBooleanCheckbox
                                                                value="#{inwardSearch.withProfessionalFee}"
                                                                rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Final Bill - Disable With Professional Fee in Final Bill',true)}"
                                                                itemLabel="With Professional Fee">
                                                                <p:ajax process="@this" update="duplicateHospitalBillPriview"/>
                                                            </p:selectBooleanCheckbox>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Hospital Bill"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="duplicateHospitalBillPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>
                                                    </div>
                                                </f:facet>

                                                <h:panelGroup id="duplicateHospitalBillPriview">
                                                    <bi:finalBill bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" duplicate="true" hosCopy="true" showProfessional="#{inwardSearch.withProfessionalFee}" /><!-- **Hospital Bill**Original Bill**-->
                                                </h:panelGroup>

                                            </p:panel>
                                        </div>
                                    </div>
                                </p:tab>

                                <p:tab title="Professional Bill" >
                                    <div class="row">
                                        <div class="col-lg-6">
                                            <p:panel>
                                                <f:facet name="header">
                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Original" class="mt-2"/></div>
                                                        <div>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Professional Bill"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="originalProfessionalBillBillPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>
                                                    </div>
                                                </f:facet>

                                                <h:panelGroup id="originalProfessionalBillBillPriview">
                                                    <bi:finalProfessionalBill bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" /><!-- **Professional Bill**Original Bill**-->
                                                </h:panelGroup>

                                            </p:panel>
                                        </div>
                                        <div class="col-lg-6">
                                            <p:panel>
                                                <f:facet name="header">
                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Duplicate" class="mt-2"/></div>
                                                        <div>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Professional Bill"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="duplicateProfessionalBillBillPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>
                                                    </div>
                                                </f:facet>
                                                <h:panelGroup id="duplicateProfessionalBillBillPriview">
                                                    <bi:finalProfessionalBill bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" duplicate="true" /><!-- Final Bill - **Professional Bill**Duplicate Bill**-->
                                                </h:panelGroup>
                                            </p:panel>
                                        </div>
                                    </div>
                                </p:tab>

                                <p:tab title="Final Bill Summary" >
                                    <div class="row">
                                        <div class="col-lg-6">

                                            <p:panel>
                                                <f:facet name="header">

                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Original" class="mt-2"/></div>
                                                        <div class="d-flex gap-2">
                                                            <p:selectBooleanCheckbox
                                                                value="#{inwardSearch.withProfessionalFee}"
                                                                itemLabel="With Professional Fee"
                                                                rendered="#{!configOptionApplicationController.getBooleanValueByKey('Inward Final Bill - Disable With Professional Fee in Final Bill',false)}">
                                                                <p:ajax process="@this" update="OriginalFinalBillSummaryPriview"/>
                                                            </p:selectBooleanCheckbox>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Final Bill Summary"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="OriginalFinalBillSummaryPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>
                                                    </div>
                                                </f:facet>
                                                <h:panelGroup id="OriginalFinalBillSummaryPriview">
                                                    <h:panelGroup id="OriginalFinalBillSummarywithoutProfessionalFeePriview" rendered="#{inwardSearch.withProfessionalFee eq false}">
                                                        <bi:finalBillGreenSheet  bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" />
                                                    </h:panelGroup>
                                                    <h:panelGroup id="originalFinalBillSummarywithProfessionalFeePriview" rendered="#{inwardSearch.withProfessionalFee eq true}">
                                                        <bi:finalBillGreenSheet  bill="#{inwardSearch.showOrginalBill ? inwardSearch.bill.referenceBill : inwardSearch.bill}" showProfessional="true"/>
                                                    </h:panelGroup>
                                                </h:panelGroup>
                                            </p:panel>
                                        </div>
                                        <div class="col-lg-6">


                                            <p:panel>
                                                <f:facet name="header">
                                                    <div class="d-flex justify-content-between">
                                                        <div><h:outputLabel value="Duplicate" class="mt-2"/></div>
                                                        <div class="d-flex gap-2">
                                                            <p:selectBooleanCheckbox
                                                                value="#{inwardSearch.withProfessionalFee}"
                                                                itemLabel="With Professional Fee"
                                                                rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Final Bill - Disable With Professional Fee in Final Bill',true)}">
                                                                <p:ajax process="@this" update="duplicateFinalBillSummaryPriview"/>
                                                            </p:selectBooleanCheckbox>
                                                            <p:commandButton
                                                                icon="fa fa-print"
                                                                value="Final Bill Summary"
                                                                class="ui-button-info"
                                                                ajax="false">
                                                                <p:printer target="duplicateFinalBillSummaryPriview" ></p:printer>
                                                            </p:commandButton>
                                                        </div>
                                                    </div>
                                                </f:facet>

                                                <h:panelGroup id="duplicateFinalBillSummaryPriview">
                                                    <h:panelGroup id="duplicateFinalBillSummarywithoutProfessionalFeePriview" rendered="#{inwardSearch.withProfessionalFee eq false}">

                                                <h:outputLabel style="color: #008000;"

                                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                                </h:outputLabel>
                                            </h:panelGroup>

                                            <f:facet name="header">
                                                <h:outputLabel value="Checked"/>

                                            <h:panelGroup  rendered="#{iss.bill.checkeAt ne null}" >

                                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                                </h:outputLabel>
