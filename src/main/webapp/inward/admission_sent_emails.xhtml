<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui"
                >

    <ui:define name="content">
        <h:form>
            <p:panel styleClass="shadow-sm">
                <f:facet name="header">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h:outputText styleClass="fa-solid fa-envelope-open-text"></h:outputText>
                            <h:outputText value="Sent Emails - #{emailController.patientEncounter.patient.person.nameWithTitle} (BHT: #{emailController.patientEncounter.bhtNo})" class="mx-4"></h:outputText>
                        </div>
                        <div class="d-flex gap-2">
                            <p:commandButton
                                ajax="false"
                                icon="fa fa-id-card"
                                value="Inpatient Dashboard"
                                class="ui-button-secondary"
                                action="#{admissionController.navigateToAdmissionProfilePage}">
                                <f:setPropertyActionListener value="#{emailController.patientEncounter}" target="#{admissionController.current}"></f:setPropertyActionListener>
                            </p:commandButton>
                        </div>
                    </div>
                </f:facet>

                <p:dataTable
                    id="tblAdmissionEmails"
                    widgetVar="wvAdmissionEmails"
                    rowKey="#{e.id}"
                    value="#{emailController.admissionEmails}"
                    var="e"
                    paginator="true"
                    rowsPerPageTemplate="20,50,100"
                    paginatorPosition="bottom"
                    rows="20"
                    styleClass="w-100"
                    emptyMessage="No emails have been sent for this admission.">

                    <p:column headerText="Date" sortBy="#{e.createdAt}" width="12em;">
                        <h:outputText value="#{e.createdAt}">
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Subject">
                        <h:outputText value="#{e.messageSubject}" />
                    </p:column>

                    <p:column headerText="To">
                        <h:outputText value="#{e.receipientEmail}" />
                    </p:column>

                    <p:column headerText="CC">
                        <h:outputText value="#{e.ccEmails}" />
                    </p:column>

                    <p:column headerText="Created By" width="15em;">
                        <h:outputText value="#{e.creater.webUserPerson.name}" />
                    </p:column>

                    <p:column headerText="Success" width="6em;">
                        <h:outputText value="#{e.sentSuccessfully ? 'Yes' : 'No'}" />
                    </p:column>

                    <p:column headerText="Action" width="6em;">
                        <p:commandButton
                            value="View"
                            icon="pi pi-eye"
                            styleClass="ui-button-secondary"
                            action="#{emailController.navigateToEmailDetail()}"
                            ajax="false"
                            title="View this email #{e.id}">
                            <f:setPropertyActionListener value="#{e}" target="#{emailController.selectedEmail}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
