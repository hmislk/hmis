<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common">

    <ui:define name="content">
        <h:form id="form">
            <p:growl id="inpatientPharmacyDirectIssuesGrowl"></p:growl>
            <p:panel>
                <f:facet name="header">
                    <div class="d-flex justify-content-between align-items-center w-100">
                        <div class="d-flex align-items-center gap-2">
                            <h:outputText styleClass="fa fa-file-invoice"></h:outputText>
                            <p:outputLabel value="Direct Issues"></p:outputLabel>
                        </div>
                        <div class="d-flex gap-2">
                            <p:commandButton
                                id="btnBackToProfile"
                                value="Inpatient Dashboard"
                                action="#{inwardPharmacyEncounterReportController.navigateToAdmissionProfile()}"
                                ajax="false"
                                icon="fa fa-arrow-circle-left"
                                styleClass="ui-button-info ui-button-outlined">
                            </p:commandButton>
                        </div>
                        <!-- Empty right zone: keeps the center nav button visually centered via justify-content-between -->
                        <div></div>
                    </div>
                </f:facet>

                <style>
                    @media print {
                        body {
                            margin: 0px 5px;
                        }
                    }
                </style>

                <div class="row">
                    <div class="col-3">
                        <div class="m-1">
                            <p:panel class="w-100 m-1">
                                <f:facet name="header">
                                    <h:outputText styleClass="fas fa-user"></h:outputText>
                                    <h:outputLabel value="Patient Details" class="mx-4"></h:outputLabel>
                                </f:facet>
                                <div class="row">
                                    <div class="col-md-5"><p:outputLabel value="Name" /></div>
                                    <div class="col-md-1 justify-content-end d-flex"><p:outputLabel value=":" class="mx-2"/></div>
                                    <div class="col-md-6"><h:outputText value="#{admissionController.current.patient.person.nameWithTitle}" /></div>

                                    <div class="col-md-5"><p:outputLabel value="Gender" /></div>
                                    <div class="col-md-1 justify-content-end d-flex"><p:outputLabel value=":" class="mx-2"/></div>
                                    <div class="col-md-6"><h:outputText value="#{admissionController.current.patient.person.sex}" /></div>

                                    <div class="col-md-5"><p:outputLabel value="Age" /></div>
                                    <div class="col-md-1 justify-content-end d-flex"><p:outputLabel value=":" class="mx-2"/></div>
                                    <div class="col-md-6"><h:outputText value="#{admissionController.current.patient.person.ageAsString}" /></div>

                                    <div class="col-md-5"><p:outputLabel value="Mobile No." /></div>
                                    <div class="col-md-1 justify-content-end d-flex"><p:outputLabel value=":" class="mx-2"/></div>
                                    <div class="col-md-6"><h:outputText value="#{admissionController.current.patient.person.mobile}" /></div>

                                    <div class="col-md-5"><p:outputLabel value="Phone No." /></div>
                                    <div class="col-md-1 justify-content-end d-flex"><p:outputLabel value=":" class="mx-2"/></div>
                                    <div class="col-md-6"><h:outputText value="#{admissionController.current.patient.person.phone}" /></div>

                                    <div class="col-md-5"><p:outputLabel value="NIC" /></div>
                                    <div class="col-md-1 justify-content-end d-flex"><p:outputLabel value=":" class="mx-2"/></div>
                                    <div class="col-md-6"><h:outputText value="#{empty admissionController.current.patient.person.nic ? 'N/A' : admissionController.current.patient.person.nic}" /></div>
                                </div>
                            </p:panel>
                        </div>
                        <div class="m-1">
                            <common:admission_details admission="#{admissionController.current}" class="w-100 m-1"></common:admission_details>
                        </div>
                    </div>
                    <div class="col-9">
                        <p:tabView>
                        <p:tab title="Direct Issues">
                            <div class="d-flex justify-content-end gap-2 mb-2">
                                <p:commandButton
                                    id="btnDirectIssuesDownload"
                                    value="Download"
                                    ajax="false"
                                    icon="fa fa-download"
                                    styleClass="ui-button-secondary">
                                    <p:dataExporter fileName="Inpatient Pharmacy Direct Issues" target="tbl1" type="xlsx"></p:dataExporter>
                                </p:commandButton>
                                <p:commandButton
                                    id="btnDirectIssuesPrint"
                                    value="Print"
                                    ajax="false"
                                    icon="fa fa-print"
                                    styleClass="ui-button-secondary">
                                    <p:printer target="tbl1"></p:printer>
                                </p:commandButton>
                            </div>
                            <p:dataTable
                                id="tbl1"
                                rowIndexVar="rowIndex"
                                rowKey="#{dto.billId}"
                                value="#{inwardPharmacyEncounterReportController.directIssueBillsToPatientEncounter}"
                                var="dto">

                                <p:column width="2em" style="padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="No" />
                                    </f:facet>
                                    <h:outputLabel value="#{rowIndex+1}" />
                                </p:column>

                                <p:column width="8em" style="padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Bill No" />
                                    </f:facet>
                                    <h:outputLabel value="#{dto.billNumber}" />
                                </p:column>

                                <p:column width="7em" style="padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : (dto.billTypeAtomic.contains('RETURN') ? 'ui-messages-warn' : '')}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Type" />
                                    </f:facet>
                                    <h:outputLabel value="Return" style="color: #b45f06; font-weight: bold;" rendered="#{dto.billTypeAtomic.contains('RETURN')}" />
                                    <h:outputLabel value="Issue" rendered="#{!dto.billTypeAtomic.contains('RETURN')}" />
                                </p:column>

                                <p:column width="12em" style="padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Billed At" />
                                    </f:facet>
                                    <h:outputLabel value="#{dto.createdAt}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" timeZone="Asia/Colombo" />
                                    </h:outputLabel>
                                </p:column>

                                <p:column width="10em" style="padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Billed By" />
                                    </f:facet>
                                    <h:outputLabel value="#{dto.createdUserName}" />
                                </p:column>

                                <p:column width="8em" style="text-align: right; padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Total" />
                                    </f:facet>
                                    <h:outputLabel value="#{dto.total}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueBillsToPatientEncounterTotal}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>

                                <p:column width="8em" style="text-align: right; padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Margin" />
                                    </f:facet>
                                    <h:outputLabel value="#{dto.serviceCharge}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueBillsToPatientEncounterMargin}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>

                                <p:column width="8em" style="text-align: right; padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Discount" />
                                    </f:facet>
                                    <h:outputLabel value="#{dto.discount}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueBillsToPatientEncounterDiscount}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>

                                <p:column width="8em" style="text-align: right; padding: 2px" styleClass="#{dto.cancelled ? 'ui-messages-fatal' : ''}">
                                    <f:facet name="header">
                                        <h:outputLabel value="Net Value" />
                                    </f:facet>
                                    <h:outputLabel value="#{dto.netTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueBillsToPatientEncounterNetTotal}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>

                                <p:column width="8em" style="padding: 2px">
                                    <f:facet name="header">
                                        <h:outputLabel value="Status" />
                                    </f:facet>
                                    <h:outputLabel value="Cancelled" style="color: red;" rendered="#{dto.cancelled}" />
                                    <h:outputLabel value="Refunded" style="color: red;" rendered="#{dto.refunded and not dto.cancelled}" />
                                </p:column>

                                <p:column width="8em" style="padding: 2px" exportable="false">
                                    <f:facet name="header">
                                        <h:outputLabel value="Action" />
                                    </f:facet>
                                    <p:commandButton
                                        id="btnViewBill"
                                        value="View Bill"
                                        icon="fa fa-eye"
                                        ajax="false"
                                        class="ui-button-info"
                                        action="#{pharmacyBillSearch.navigateToViewPharmacyDirectIssueForInpatientBill()}">
                                        <f:setPropertyActionListener value="#{dto.billId}" target="#{pharmacyBillSearch.billId}"/>
                                    </p:commandButton>
                                </p:column>

                                <p:column style="width: 3em" exportable="false">
                                    <p:rowToggler />
                                </p:column>

                                <p:rowExpansion>
                                    <p:dataTable var="item" value="#{inwardPharmacyEncounterReportController.getItemsForDirectIssueBill(dto.billId)}">
                                        <p:column headerText="Item Name" width="30%">
                                            <h:outputLabel value="#{item.itemName}"/>
                                        </p:column>
                                        <p:column headerText="Code" width="14%">
                                            <h:outputLabel value="#{item.itemCode}"/>
                                        </p:column>
                                        <p:column headerText="Qty" width="10%" style="text-align: right;">
                                            <h:outputLabel value="#{item.qty}">
                                                <f:convertNumber pattern="#0.##" />
                                            </h:outputLabel>
                                        </p:column>
                                        <p:column headerText="Total" width="12%" style="text-align: right;">
                                            <h:outputLabel value="#{item.total}">
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                        </p:column>
                                        <p:column headerText="Margin" width="12%" style="text-align: right;">
                                            <h:outputLabel value="#{item.margin}">
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                        </p:column>
                                        <p:column headerText="Discount" width="10%" style="text-align: right;">
                                            <h:outputLabel value="#{item.discount}">
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                        </p:column>
                                        <p:column headerText="Net Total" width="12%" style="text-align: right;">
                                            <h:outputLabel value="#{item.netValue}">
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                        </p:column>
                                    </p:dataTable>
                                </p:rowExpansion>

                            </p:dataTable>
                        </p:tab>

                        <p:tab title="Items Summary">
                            <p:dataTable
                                id="tblItemSummary"
                                value="#{inwardPharmacyEncounterReportController.directIssueItemSummary}"
                                var="s">
                                <p:column headerText="Item Name" width="30%">
                                    <h:outputLabel value="#{s.itemName}"/>
                                    <f:facet name="footer">
                                        <h:outputLabel value="Total" style="font-weight: bold" />
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Code" width="14%">
                                    <h:outputLabel value="#{s.itemCode}"/>
                                </p:column>
                                <p:column headerText="Qty" width="10%" style="text-align: right;">
                                    <h:outputLabel value="#{s.qty}">
                                        <f:convertNumber pattern="#0.##" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueItemSummaryQtyTotal}" style="font-weight: bold">
                                            <f:convertNumber pattern="#0.##" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Total" width="12%" style="text-align: right;">
                                    <h:outputLabel value="#{s.total}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueItemSummaryTotal}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Margin" width="12%" style="text-align: right;">
                                    <h:outputLabel value="#{s.margin}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueItemSummaryMargin}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Discount" width="10%" style="text-align: right;">
                                    <h:outputLabel value="#{s.discount}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueItemSummaryDiscount}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Net Total" width="12%" style="text-align: right;">
                                    <h:outputLabel value="#{s.netTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueItemSummaryNetTotal}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                            </p:dataTable>
                        </p:tab>

                        <p:tab title="Issuing Department Summary">
                            <p:dataTable
                                id="tblDeptSummary"
                                value="#{inwardPharmacyEncounterReportController.directIssueDepartmentSummary}"
                                var="s">
                                <p:column headerText="Department" width="30%">
                                    <h:outputLabel value="#{s.departmentName}"/>
                                    <f:facet name="footer">
                                        <h:outputLabel value="Total" style="font-weight: bold" />
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Qty" width="14%" style="text-align: right;">
                                    <h:outputLabel value="#{s.qty}">
                                        <f:convertNumber pattern="#0.##" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueDepartmentSummaryQtyTotal}" style="font-weight: bold">
                                            <f:convertNumber pattern="#0.##" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Total" width="14%" style="text-align: right;">
                                    <h:outputLabel value="#{s.total}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueDepartmentSummaryTotal}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Margin" width="14%" style="text-align: right;">
                                    <h:outputLabel value="#{s.margin}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueDepartmentSummaryMargin}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Discount" width="14%" style="text-align: right;">
                                    <h:outputLabel value="#{s.discount}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueDepartmentSummaryDiscount}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column headerText="Net Total" width="14%" style="text-align: right;">
                                    <h:outputLabel value="#{s.netTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{inwardPharmacyEncounterReportController.directIssueDepartmentSummaryNetTotal}" style="font-weight: bold">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                            </p:dataTable>
                        </p:tab>
                        </p:tabView>
                    </div>
                </div>
            </p:panel>

        </h:form>
    </ui:define>
</ui:composition>
