<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/inward/inward_administration.xhtml">
            <ui:define name="subcontent">
                <style>
                    /* Keep the multi-category label on one line; with many categories selected it would otherwise push the form down. */
                    .single-line-label .ui-selectcheckboxmenu-label {
                        white-space: nowrap;
                        overflow: hidden;
                        text-overflow: ellipsis;
                    }
                </style>
                <h:form>
                    <p:panel header="Inward Discount Matrix - Services and Investigations" id="reportPrint" class="row w-100">

                        <!-- Add new entry -->
                        <p:panel>
                            <f:facet name="header">
                                <h:outputLabel value="Add New Discount Entry" class="mt-2"/>
                                <p:commandButton
                                    id="btnAdd"
                                    value="Add"
                                    class="ui-button-success"
                                    icon="fa fa-plus"
                                    style="float: right;"
                                    ajax="false"
                                    action="#{inwardDiscountMatrixController.saveForServiceInvestigation}">
                                </p:commandButton>
                            </f:facet>

                            <div class="row w-100 d-flex ml-2">

                                <div class="row mt-1">
                                    <div class="col-2">
                                        <h:outputLabel value="Discount Scheme" class="mt-2"/>
                                    </div>
                                    <div class="col-10">
                                        <p:autoComplete
                                            value="#{inwardDiscountMatrixController.paymentScheme}"
                                            forceSelection="true"
                                            completeMethod="#{paymentSchemeController.completePaymentScheme}"
                                            var="ps"
                                            inputStyleClass="form-control"
                                            class="w-100"
                                            itemLabel="#{ps.name}"
                                            itemValue="#{ps}">
                                        </p:autoComplete>
                                    </div>
                                </div>

                                <div class="row mt-1">
                                    <div class="col-2">
                                        <h:outputLabel value="Department" class="mt-2"/>
                                    </div>
                                    <div class="col-10">
                                        <p:autoComplete
                                            value="#{inwardDiscountMatrixController.department}"
                                            forceSelection="true"
                                            completeMethod="#{departmentController.completeDept}"
                                            var="dep"
                                            inputStyleClass="form-control"
                                            class="w-100"
                                            itemLabel="#{dep.name}"
                                            itemValue="#{dep}">
                                            <p:column>
                                                <h:outputLabel value="#{dep.name}"/>
                                            </p:column>
                                            <p:column>
                                                <h:outputLabel value="#{dep.institution.name}"/>
                                            </p:column>
                                        </p:autoComplete>
                                    </div>
                                </div>

                                <div class="row mt-1">
                                    <div class="col-2">
                                        <h:outputLabel value="Category" class="mt-2"/>
                                    </div>
                                    <div class="col-10">
                                        <p:selectCheckboxMenu
                                            id="categories"
                                            styleClass="w-100 single-line-label"
                                            value="#{inwardDiscountMatrixController.categories}"
                                            converter="#{inwardDiscountMatrixController.categoryConverter}"
                                            filter="true"
                                            filterMatchMode="contains"
                                            showHeader="true"
                                            emptyLabel="Select Categories"
                                            updateLabel="true"
                                            scrollHeight="300">
                                            <f:selectItems
                                                value="#{inwardDiscountMatrixController.serviceInvestigationCategories}"
                                                var="c"
                                                itemLabel="#{c.name} (#{inwardDiscountMatrixController.categoryTypeLabel(c)})"
                                                itemValue="#{c}"/>
                                        </p:selectCheckboxMenu>
                                    </div>
                                </div>

                                <div class="row mt-1">
                                    <div class="col-2">
                                        <h:outputLabel value="Admission Type" class="mt-2"/>
                                    </div>
                                    <div class="col-4">
                                        <p:selectOneMenu
                                            class="w-100"
                                            value="#{inwardDiscountMatrixController.admissionType}">
                                            <f:selectItem itemLabel="All Admission Types" itemValue="#{null}"/>
                                            <f:selectItems value="#{admissionTypeController.items}"
                                                           var="at"
                                                           itemValue="#{at}"
                                                           itemLabel="#{at.name}"/>
                                        </p:selectOneMenu>
                                    </div>
                                </div>

                                <div class="row mt-1">
                                    <div class="col-2">
                                        <h:outputLabel value="BHT Type" class="mt-2"/>
                                    </div>
                                    <div class="col-4">
                                        <p:selectOneMenu
                                            class="w-100"
                                            value="#{inwardDiscountMatrixController.paymentMethod}">
                                            <f:selectItem itemLabel="All BHT Types"/>
                                            <f:selectItems value="#{enumController.paymentMethodForAdmission}"/>
                                        </p:selectOneMenu>
                                    </div>
                                </div>

                                <div class="row mt-1">
                                    <div class="col-2">
                                        <h:outputLabel value="Credit Company" class="mt-2"/>
                                    </div>
                                    <div class="col-10">
                                        <p:autoComplete
                                            value="#{inwardDiscountMatrixController.creditCompany}"
                                            forceSelection="true"
                                            completeMethod="#{institutionController.completeCreditCompany}"
                                            var="ins"
                                            inputStyleClass="form-control"
                                            class="w-100"
                                            itemLabel="#{ins.name}"
                                            itemValue="#{ins}"
                                            placeholder="Leave blank to apply to all companies"
                                            maxResults="20"
                                            onkeydown="if (event.key === 'Enter') { event.preventDefault(); return false; }">
                                            <p:column headerText="Name">#{ins.name}</p:column>
                                        </p:autoComplete>
                                    </div>
                                </div>

                                <div class="row mt-1">
                                    <div class="col-2">
                                        <h:outputLabel value="Discount %" class="mt-2"/>
                                    </div>
                                    <div class="col-4">
                                        <p:inputText
                                            class="w-100"
                                            autocomplete="off"
                                            value="#{inwardDiscountMatrixController.discountPercent}"/>
                                    </div>
                                </div>

                            </div>
                        </p:panel>

                        <!-- Data table -->
                        <p:panel class="mt-2" id="discountMatrixPreview">
                            <f:facet name="header">
                                <h:outputLabel value="Discount Matrix" class="mt-2"/>
                                <div class="d-flex" style="float: right">
                                    <p:commandButton
                                        id="btnFill"
                                        ajax="false"
                                        icon="fa fa-fill"
                                        class="ui-button-warning"
                                        value="Fill"
                                        action="#{inwardDiscountMatrixController.loadServiceInvestigation}">
                                    </p:commandButton>
                                    <p:commandButton
                                        id="btnExcel"
                                        class="ui-button-success mx-2"
                                        actionListener="#{inwardDiscountMatrixController.loadServiceInvestigation}"
                                        ajax="false"
                                        value="Excel"
                                        icon="fa-solid fa-file-excel">
                                        <p:dataExporter
                                            type="xlsx"
                                            target="discountTbl"
                                            fileName="inward_discount_matrix_service_investigation"/>
                                    </p:commandButton>
                                    <p:commandButton
                                        id="btnPrint"
                                        class="ui-button-info"
                                        ajax="false"
                                        icon="fa fa-print"
                                        value="Print">
                                        <p:printer target="discountMatrixPreview"/>
                                    </p:commandButton>
                                </div>
                            </f:facet>

                            <p:dataTable
                                id="discountTbl"
                                value="#{inwardDiscountMatrixController.items}"
                                filteredValue="#{inwardDiscountMatrixController.filterItems}"
                                var="a"
                                rowKey="#{a.id}"
                                paginator="true"
                                rows="25"
                                rowsPerPageTemplate="25,50,100,200"
                                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                currentPageReportTemplate="{totalRecords} rows"
                                scrollable="true">

                                <p:column
                                    headerText="Discount Scheme"
                                    filterBy="#{a.paymentScheme.name}"
                                    filterMatchMode="contains">
                                    <h:outputText value="#{a.paymentScheme.name}"/>
                                </p:column>

                                <p:column
                                    headerText="Department"
                                    filterBy="#{a.department.name}"
                                    filterMatchMode="contains">
                                    <h:outputText value="#{empty a.department ? 'All Departments' : a.department.name}"/>
                                </p:column>

                                <p:column
                                    headerText="Category"
                                    filterBy="#{a.category.name}"
                                    filterMatchMode="contains">
                                    <h:outputText value="#{empty a.category ? 'All (no category)' : a.category.name}"/>
                                </p:column>

                                <p:column headerText="Category Type">
                                    <h:outputText value="#{inwardDiscountMatrixController.categoryTypeLabel(a.category)}"/>
                                </p:column>

                                <p:column headerText="Admission Type">
                                    <h:outputText value="#{empty a.admissionType ? 'All Admission Types' : a.admissionType.name}"/>
                                </p:column>

                                <p:column headerText="BHT Type">
                                    <h:outputText value="#{empty a.paymentMethod ? 'All BHT Types' : a.paymentMethod}"/>
                                </p:column>

                                <p:column
                                    headerText="Credit Company"
                                    filterBy="#{empty a.creditCompany ? '' : a.creditCompany.name}"
                                    filterMatchMode="contains">
                                    <h:outputText value="#{empty a.creditCompany ? 'All Companies' : a.creditCompany.name}"/>
                                </p:column>

                                <p:column headerText="Discount %" style="width: 8em;">
                                    <h:inputText
                                        autocomplete="off"
                                        value="#{a.discountPercent}"
                                        style="width: 5em;">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:inputText>
                                </p:column>

                                <p:column headerText="Action" style="width: 10em;">
                                    <div class="d-flex">
                                        <p:commandButton
                                            id="btnEdit"
                                            ajax="false"
                                            icon="fa fa-pencil"
                                            class="ui-button-success mx-1"
                                            action="#{inwardDiscountMatrixController.onEdit(a)}">
                                        </p:commandButton>
                                        <p:commandButton
                                            id="btnDelete"
                                            class="ui-button-danger"
                                            icon="fa-solid fa-trash"
                                            action="#{inwardDiscountMatrixController.delete}">
                                            <f:setPropertyActionListener value="#{a}" target="#{inwardDiscountMatrixController.current}"/>
                                        </p:commandButton>
                                    </div>
                                    <p:tooltip for="btnEdit" value="Update" showDelay="0" hideDelay="0"/>
                                    <p:tooltip for="btnDelete" value="Delete" showDelay="0" hideDelay="0"/>
                                </p:column>

                            </p:dataTable>
                        </p:panel>

                        <!-- Things that stop category discounts from applying (issue #24038) -->
                        <p:panel id="setupChecks" header="Discount setup checks" toggleable="true" collapsed="#{inwardDiscountMatrixController.legacyCategoryCount eq null}" class="mt-2">
                            <p class="text-muted small mb-2">
                                A category discount reaches a service or investigation only if the item has a Category
                                and both the item and its fee allow discounts. Check first; nothing changes until you apply.
                            </p>
                            <div class="row mb-2">
                                <div class="col-3"><h:outputLabel value="Item types" class="mt-1"/></div>
                                <div class="col-9">
                                    <p:selectManyCheckbox value="#{inwardDiscountMatrixController.setupScopeNames}" layout="lineDirection">
                                        <f:selectItems value="#{inwardDiscountMatrixController.allSetupScopes}" var="sc"
                                                       itemValue="#{sc.name()}" itemLabel="#{sc.name().replace('_', ' ')}"/>
                                    </p:selectManyCheckbox>
                                </div>
                            </div>
                            <p:commandButton id="btnCheckSetup" value="Check" icon="fa fa-search" class="ui-button-info"
                                             ajax="false" action="#{inwardDiscountMatrixController.checkDiscountSetup}"/>

                            <h:panelGroup layout="block" styleClass="mt-3"
                                          rendered="#{inwardDiscountMatrixController.legacyCategoryCount ne null}">
                                <div class="row mb-2">
                                    <div class="col-8">
                                        <h:outputText value="Investigations with only a legacy Investigation Category (Category blank): "/>
                                        <strong><h:outputText value="#{inwardDiscountMatrixController.legacyCategoryCount}"/></strong>
                                    </div>
                                    <div class="col-4">
                                        <p:commandButton id="btnCopyLegacy" value="Store as Category" icon="fa fa-copy" class="ui-button-warning w-100"
                                                         ajax="false" disabled="#{inwardDiscountMatrixController.legacyCategoryCount eq 0}"
                                                         onclick="return confirm('Copy the legacy Investigation Category into Category for these investigations?');"
                                                         action="#{inwardDiscountMatrixController.copyLegacyInvestigationCategories}"/>
                                    </div>
                                </div>
                                <h:panelGroup layout="block" styleClass="row"
                                              rendered="#{inwardDiscountMatrixController.discountNotAllowedCounts ne null}">
                                    <div class="col-8">
                                        <h:outputText value="Items not allowing discounts: "/>
                                        <strong><h:outputText value="#{inwardDiscountMatrixController.discountNotAllowedCounts['itemsNotAllowed']}"/></strong>
                                        <h:outputText value=" · Fees not allowing discounts: "/>
                                        <strong><h:outputText value="#{inwardDiscountMatrixController.discountNotAllowedCounts['feesNotAllowed']}"/></strong>
                                    </div>
                                    <div class="col-4">
                                        <p:commandButton id="btnAllowDiscounts" value="Allow Discounts" icon="fa fa-check" class="ui-button-warning w-100"
                                                         ajax="false"
                                                         onclick="return confirm('Turn on Discount Allowed for these items and all their fees?');"
                                                         action="#{inwardDiscountMatrixController.allowDiscountsForSetupScopes}"/>
                                    </div>
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:panel>

                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
