<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">

                <h:form id="formNursingDischarge"
                        onkeydown="if(event.key==='Enter'&amp;&amp;event.target.tagName!=='TEXTAREA'){event.preventDefault();return false;}">

                    <p:growl id="growl" life="4000"/>

                    <!-- Navigation bar -->
                    <div class="row">
                        <div class="col-12 px-4">
                            <p:commandButton
                                id="btnDashboard"
                                value="Inpatient Dashboard"
                                ajax="false"
                                action="#{admissionController.navigateToAdmissionProfilePage}"
                                icon="fa fa-id-card"
                                class="p-0 m-1">
                                <f:setPropertyActionListener
                                    value="#{nursingDischargeController.currentEncounter}"
                                    target="#{admissionController.current}" />
                            </p:commandButton>
                        </div>
                    </div>

                    <!-- Access denied panel -->
                    <h:panelGroup layout="block" rendered="#{not webUserController.hasPrivilege('InwardNursingDischarge')}">
                        <div class="row px-4">
                            <div class="col-12">
                                <p:panel class="m-1">
                                    <h:outputText value="You do not have permission to access Nursing Discharge." />
                                </p:panel>
                            </div>
                        </div>
                    </h:panelGroup>

                    <!-- Main content -->
                    <h:panelGroup layout="block" rendered="#{webUserController.hasPrivilege('InwardNursingDischarge')}">

                        <!-- Confirmation status banner -->
                        <h:panelGroup layout="block"
                                      rendered="#{nursingDischargeController.currentEncounter.nursingDischarged}">
                            <div class="row px-4 pt-2">
                                <div class="col-12">
                                    <div class="alert alert-success" role="alert">
                                        <i class="fa fa-check-circle mr-2"/>
                                        Nursing discharge confirmed by
                                        <strong>#{nursingDischargeController.currentEncounter.nursingDischargedBy.name}</strong>
                                        on
                                        <h:outputText value="#{nursingDischargeController.currentEncounter.nursingDischargeDateTime}">
                                            <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                        </h:outputText>
                                    </div>
                                </div>
                            </div>
                        </h:panelGroup>

                        <!-- Pending pharmacy items panel -->
                        <h:panelGroup id="pnlPendingPharmacy" layout="block">

                            <h:panelGroup layout="block"
                                          rendered="#{not empty nursingDischargeController.pendingPharmacyItems}">
                                <div class="row px-4 pt-2">
                                    <div class="col-12">
                                        <div class="alert alert-warning" role="alert">
                                            <strong><i class="fa fa-exclamation-triangle mr-2"/>Pending Pharmacy Items</strong>
                                            <p class="mb-2">Nursing discharge is blocked until all items below are resolved (issued, accepted, cancelled, or force-completed).</p>
                                            <p:dataTable id="tblPendingPharmacy"
                                                         value="#{nursingDischargeController.pendingPharmacyItems}"
                                                         var="item"
                                                         styleClass="w-100">
                                                <p:column headerText="Bill No" style="width:15%">
                                                    <h:outputText value="#{item.billNumber}" />
                                                </p:column>
                                                <p:column headerText="Requested At" style="width:15%">
                                                    <h:outputText value="#{item.billDate}">
                                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}" />
                                                    </h:outputText>
                                                </p:column>
                                                <p:column headerText="Requested By" style="width:15%">
                                                    <h:outputText value="#{item.requestedBy}" />
                                                </p:column>
                                                <p:column headerText="Requested To" style="width:15%">
                                                    <h:outputText value="#{item.requestedTo}" />
                                                </p:column>
                                                <p:column headerText="Pending Item">
                                                    <h:outputText value="#{item.pendingTypeLabel}" />
                                                </p:column>
                                            </p:dataTable>
                                        </div>
                                    </div>
                                </div>
                            </h:panelGroup>

                            <div class="row px-4">
                                <div class="col-12 d-flex justify-content-end">
                                    <p:commandButton
                                        id="btnRefreshPendingPharmacy"
                                        value="Refresh Pending Items"
                                        action="#{nursingDischargeController.loadPendingPharmacyItems()}"
                                        update="pnlPendingPharmacy pnlActionButtons"
                                        icon="fa fa-sync"
                                        class="ui-button-secondary mx-1 mb-2" />
                                </div>
                            </div>

                        </h:panelGroup>

                        <div class="row px-4 py-2">
                            <div class="col-12">

                                <!-- Nursing Discharge Checklist panel -->
                                <p:panel class="w-100 m-1 p-0 mb-2">
                                    <f:facet name="header">
                                        <i class="fa fa-clipboard-check mr-2"/>
                                        <h:outputText value="Nursing Discharge Checklist" />
                                    </f:facet>
                                    <div class="container-fluid">
                                        <div class="row my-2">
                                            <div class="col-12">
                                                <p:outputLabel for="txtNursingNotes" value="Nursing Discharge Notes:" styleClass="font-weight-bold" />
                                                <p:inputTextarea
                                                    id="txtNursingNotes"
                                                    value="#{nursingDischargeController.currentEncounter.nursingDischargeNotes}"
                                                    class="w-100"
                                                    autoResize="true"
                                                    rows="6"
                                                    placeholder="Patient education completed, medications explained, follow-up arranged, belongings collected, transport confirmed, etc."
                                                    disabled="#{nursingDischargeController.currentEncounter.nursingDischarged}" />
                                            </div>
                                        </div>
                                    </div>
                                </p:panel>

                                <!-- Action buttons -->
                                <h:panelGroup id="pnlActionButtons" layout="block"
                                              styleClass="d-flex justify-content-end my-2 mb-4">
                                    <h:panelGroup rendered="#{not nursingDischargeController.currentEncounter.nursingDischarged}">
                                        <p:commandButton
                                            id="btnConfirmNursingDischarge"
                                            value="Confirm Nursing Discharge"
                                            ajax="false"
                                            action="#{nursingDischargeController.confirmNursingDischarge()}"
                                            icon="fa fa-check"
                                            class="ui-button-success mx-1"
                                            disabled="#{nursingDischargeController.hasPendingPharmacyItems()}"
                                            onclick="return confirm('Are you sure you want to confirm nursing discharge? This will lock the record.')" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{nursingDischargeController.currentEncounter.nursingDischarged}">
                                        <p:commandButton
                                            id="btnCancelNursingDischarge"
                                            value="Cancel Nursing Discharge"
                                            ajax="false"
                                            action="#{nursingDischargeController.cancelNursingDischarge()}"
                                            icon="fa fa-times"
                                            class="ui-button-warning mx-1"
                                            onclick="return confirm('Are you sure you want to cancel the nursing discharge confirmation?')" />
                                    </h:panelGroup>
                                </h:panelGroup>

                            </div>
                        </div>
                    </h:panelGroup>

                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
