<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:bill="http://xmlns.jcp.org/jsf/composite/inward"
xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common">

    <ui:define name="content">
        <h:form>
            <h:panelGroup rendered="#{!admissionController.printPreview}" >
                <p:panel>
                    <f:facet name="header">
                        <!--
                            Three-zone panel header layout (see UI guidelines § Panel Header Three-Zone Layout):
                            LEFT  : panel title
                            CENTER: entity-level navigation buttons (Inpatient Dashboard, Patient Lookup, Patient Profile)
                            RIGHT : page actions ordered left→right by ascending importance; primary action rightmost
                        -->
                        <div class="d-flex justify-content-between align-items-center w-100">

                            <!-- LEFT: title -->
                            <div class="d-flex align-items-center gap-2">
                                <h:outputText styleClass="fa fa-hospital" />
                                <h:outputText value="Admit a Baby"/>
                            </div>

                            <!-- CENTER: navigation (page-to-page, entity-related) -->
                            <div class="d-flex gap-2">
                                <p:commandButton
                                    ajax="false"
                                    immediate="true"
                                    value="Inpatient Dashboard"
                                    icon="fa fa-id-card"
                                    styleClass="ui-button-info ui-button-outlined"
                                    title="Cancel this baby admission draft and return to the mother's Inpatient Dashboard"
                                    rendered="#{admissionController.parentAdmission ne null and admissionController.parentAdmission.id ne null}"
                                    action="#{admissionController.navigateCancelBabyAdmission()}">
                                </p:commandButton>
                                <p:commandButton
                                    ajax="false"
                                    immediate="true"
                                    value="Patient Lookup"
                                    styleClass="ui-button-info ui-button-outlined"
                                    title="Search for an existing patient"
                                    action="#{patientController.navigateToSearchPatients()}"
                                    icon="fa fa-search" />
                                <p:commandButton
                                    ajax="false"
                                    immediate="true"
                                    styleClass="ui-button-info ui-button-outlined"
                                    value="Patient Profile"
                                    title="View this patient's profile"
                                    action="#{patientController.navigateToOpdPatientProfile()}"
                                    icon="fa fa-user">
                                    <f:setPropertyActionListener value="#{admissionController.current.patient}" target="#{patientController.current}" ></f:setPropertyActionListener>
                                </p:commandButton>
                            </div>

                            <!-- RIGHT: actions — left=least important, right=primary -->
                            <div class="d-flex gap-2 align-items-center">
                                <p:commandButton
                                    ajax="false"
                                    value="Clear"
                                    icon="fas fa-eraser"
                                    title="Clear the form and start over"
                                    styleClass="ui-button-secondary"
                                    actionListener="#{admissionController.makeNull}" />
                                <p:commandButton
                                    id="admt"
                                    action="#{admissionController.saveSelected}"
                                    ajax="false"
                                    icon="pi pi-check-circle"
                                    style="min-width:120px"
                                    styleClass="ui-button-success"
                                    value="Admit"  />
                            </div>

                        </div>
                    </f:facet>
                    
                    <div class="row">
                        <p:messages id="messages" showDetail="true" closable="true">
                            <p:autoUpdate/>
                        </p:messages>
                        <div class="col-md-3 p-2">
                            <p:outputLabel 
                                class="m-1 form-label"
                                value="Admission Type* :" />
                            <p:selectOneMenu
                                id="lstSelect"  
                                value="#{admissionController.current.admissionType}"
                                class="m-1 w-100 form-control">
                                <f:selectItem itemLabel="Select Admission Type" />
                                <f:selectItems value="#{admissionTypeController.items}" var="myItem" itemValue="#{myItem}" itemLabel="#{myItem.name}" />
                                <p:ajax event="change" process="@this" update="bh cmbDoc" listener="#{admissionController.bhtNumberCalculation()}" />
                            </p:selectOneMenu>
                        </div>
                        <div class="col-md-3 p-2">
                            <p:outputLabel 
                                class="m-1 form-label"
                                value="BHT :" />
                            <p:inputText
                                id="bh"
                                readonly="#{not configOptionApplicationController.getBooleanValueByKey('BHT Number can be edited at the time of admission',true)}"
                                value="#{admissionController.bhtText}"
                                class="m-1 w-100 form-control" />
                        </div>
                        <div class="col-md-3 p-2">
                            <h:outputText
                                class="m-1 form-label"
                                value="Room No (optional) :"
                                title="Leave blank if the baby will stay in the mother's room — assigning a separate room here would charge the room fee twice" />
                            <p:autoComplete
                                forceSelection="true"
                                id="cmbDoc"
                                inputStyleClass="w-100"
                                class="m-1 w-100"
                                placeholder="Leave blank to stay in mother's room"
                                disabled="#{admissionController.current.admissionType eq null or admissionController.current.admissionType.roomFacilityCharge ne null}"
                                value="#{admissionController.patientRoom.roomFacilityCharge}"
                                completeMethod="#{roomFacilityChargeController.completeRoom}"
                                var="rf"
                                itemLabel="#{rf.name}"
                                itemValue="#{rf}"
                                size="30" >
                            </p:autoComplete>
                        </div>
                        <div class="col-md-3 p-2">
                            <p:outputLabel 
                                class="m-1 form-label"
                                value="Comments :" />
                            <p:inputText 
                                id="comment"
                                value="#{admissionController.current.comments}"
                                placeholder="Comment/Reference No"
                                class="m-1 w-100 form-control" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-4">
                            <div class="row my-2">
                                <p:panel>
                                    <f:facet name="header">
                                        <div class="d-flex justify-content-between align-items-center w-100">
                                            <h:outputLabel value="Parent Details" />
                                            <p:commandButton
                                                value="Copy Address &amp; Phone to Baby"
                                                icon="fa fa-copy"
                                                styleClass="ui-button-info ui-button-outlined"
                                                title="Copy the mother's address and phone/mobile numbers onto the baby's own patient details"
                                                process="@this"
                                                update="@form"
                                                action="#{admissionController.copyPatientDetailsFromParent()}" />
                                        </div>
                                    </f:facet>
                                    <common:patient patient="#{admissionController.parentAdmission.patient}" class="w-100"/>
                                </p:panel>
                            </div>
                            <div class="row my-2">
                                <common:parent_admission_details admission="#{admissionController.parentAdmission}" class="w-100 m-1"></common:parent_admission_details>
                            </div>
                        </div>
                        <div class="col-4 my-2">
                            <common:patient_details_for_addmission editable="true" controller="#{admissionController}" />
                        </div>
                        <div class="col-4">
                            <div class="row my-2">
                                <p:panel header="Hospital Use">
                                    <h:panelGrid columns="2">

                                        <p:selectBooleanCheckbox value="#{admissionController.current.foriegner}"
                                                                 itemLabel="Mark as Foreigner"/>

                                        <p:selectBooleanCheckbox value="#{admissionController.current.claimable}" 
                                                                 itemLabel="Claimable"/>

                                        <p:outputLabel value="Admitted Time"/>
                                        <p:calendar value="#{admissionController.current.dateOfAdmission}" 
                                                    id="admissionTimeStamp"
                                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}"  >                               
                                        </p:calendar>     




                                        <h:outputLabel value="Referring Doctor"/>
                                        <p:autoComplete forceSelection="true" 
                                                        value="#{admissionController.current.referringConsultant}" 
                                                        id="refCon"
                                                        required="true" requiredMessage="Please select referring consultant"
                                                        completeMethod="#{consultantController.completeConsultant}" 
                                                        var="mysp" itemLabel="#{mysp.person.name}" itemValue="#{mysp}"
                                                        styleClass="form-control w-100"
                                                        class="w-100" placeholder="Referring Consultant"
                                                        inputStyleClass="w-100" />




                                        <h:outputLabel  value="OPD Doctor" ></h:outputLabel>
                                         <p:autoComplete required="true" 
                                                        requiredMessage="Please select referring doctor"
                                                        forceSelection="true" id="scStaff" placeholder="OPD Doctor"
                                                        value="#{admissionController.current.opdDoctor}" 
                                                        completeMethod="#{doctorController.completeDoctor}"
                                                        var="mys" 
                                                        itemLabel="#{mys.person.name}" 
                                                        itemValue="#{mys}"
                                                        styleClass="form-control w-100"
                                                        class="w-100" 
                                                        inputStyleClass="w-100"
                                                        >
                                        </p:autoComplete>

                                    </h:panelGrid>
                                </p:panel>
                            </div>
                        </div>
                    </div>

                </p:panel>
                <h:panelGrid columns="1" id="gpDetail">
                    <h:panelGrid columns="2" style="min-width: 100%;"  styleClass="alignTop">






                        <!--                        <p:panel header="Other" style="min-width: 100%;">                           
                                                    <p:tabView>
                                                        <p:tab title="Guardian Detail">

                                                                <p:inputText autocomplete="off" value="#{admissionController.current.guardian.name}"/>
                                                                <p:outputLabel value="NIC / Passport"/>
                                                                <p:inputText autocomplete="off" value="#{admissionController.current.guardian.nic}"/>
                                                                <p:outputLabel value="Address" />
                                                                <p:inputText autocomplete="off"  value="#{admissionController.current.guardian.address}"  />

                                                                <p:inputText    value="#{admissionController.current.guardian.mobile}"  />
                                                                <p:outputLabel value="Home Phone No" />

                                                        </p:tab>

                    </h:outputLabel>

                    <h:outputLabel  rendered="#{admissionController.appointmentBill!=null}" value="Adress" />

                </h:panelGrid>
            </p:tab>
        </p:tabView>


    </p:panel>-->





                    </h:panelGrid>
                </h:panelGrid>
            </h:panelGroup>
            <p:panel rendered="#{admissionController.printPreview}">
                <p:commandButton ajax="false" value="New Admission" actionListener="#{admissionController.makeNull}" class="mx-1" />
                <p:commandButton
                    ajax="false"
                    immediate="true"
                    value="Baby Inpatient Profile"
                    icon="fa fa-child"
                    class="ui-button-info mx-1"
                    action="#{admissionController.navigateToAdmissionProfilePage()}" />
                <p:commandButton
                    ajax="false"
                    immediate="true"
                    value="Mother's Inpatient Profile"
                    icon="fa fa-female"
                    class="ui-button-secondary mx-1"
                    rendered="#{admissionController.current.parentEncounter != null}"
                    action="#{admissionController.navigateToAdmissionProfileById(admissionController.current.parentEncounter.id)}" />
                <bill:bht admission="#{admissionController.current}"/>
            </p:panel>

        </h:form>


    </ui:define>

</ui:composition>
