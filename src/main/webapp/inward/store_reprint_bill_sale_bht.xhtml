<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:st="http://xmlns.jcp.org/jsf/composite/store/inward"
      >

    <h:body>

        <ui:composition template="/resources/template/template.xhtml">

            <ui:define name="content">
                <h:form>
                    <p:panel>
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center w-100">
                                <div class="d-flex align-items-center gap-2">
                                    <h:outputText styleClass="fa fa-print" />
                                    <h:outputText value="Reprint" />
                                </div>
                                <div class="d-flex gap-2">
                                    <p:commandButton ajax="false" value="Back To Interim"
                                                     icon="fa fa-backward"
                                                     styleClass="ui-button-info ui-button-outlined"
                                                     action="/inward/inward_bill_intrim"  />
                                    <p:commandButton ajax="false" value="Back to Surgery Summary"
                                                     action="#{surgeryBillController.navigateToSurgeryBillSummary(storeBillSearch.bill.forwardReferenceBill)}"
                                                     rendered="#{storeBillSearch.bill.forwardReferenceBill ne null and storeBillSearch.bill.forwardReferenceBill.billType eq 'SurgeryBill'}"
                                                     icon="fa fa-backward"
                                                     styleClass="ui-button-info ui-button-outlined"/>
                                </div>
                                <div class="d-flex gap-2 align-items-center">
                                    <p:commandButton ajax="false" value="Mark As Un Check"
                                                     icon="fa fa-square"
                                                     styleClass="ui-button-warning"
                                                     action="#{storeBillSearch.markAsUnChecked()}"
                                                     rendered="#{webUserController.hasPrivilege('InwardUnCheck')}"  />
                                    <p:commandButton ajax="false" value="Mark As Checked"
                                                     icon="fa fa-check-square"
                                                     styleClass="ui-button-success"
                                                     action="#{storeBillSearch.markAsChecked()}"
                                                     rendered="#{webUserController.hasPrivilege('InwardCheck')}"  />
                                    <p:commandButton ajax="false" value="Excel" styleClass="noPrintButton ui-button-secondary" icon="fa-solid fa-file-excel">
                                        <p:dataExporter type="xlsx" target="tbl" fileName="Inward_Payment_Bill"  />
                                    </p:commandButton>
                                    <p:commandButton ajax="false" value="Return Item" icon="fa fa-undo"
                                                     styleClass="ui-button-secondary"
                                                     action="/store/store_bill_return_bht_issue"
                                                     disabled="#{storeBillSearch.bill.cancelled eq true}"  >
                                        <f:setPropertyActionListener value="#{storeBillSearch.bill}"
                                                                     target="#{storeBhtIssueReturnController.bill}"  />
                                    </p:commandButton>
                                    <p:commandButton ajax="false" value="Cancel"
                                                     icon="fa fa-ban"
                                                     styleClass="ui-button-danger"
                                                     action="#{storeBillSearch.navigateToCancelStoreDirectIssueToInpatients()}"
                                                     disabled="#{storeBillSearch.bill.cancelled}"  />
                                    <p:commandButton value="Reprint" icon="fa-solid fa-print" styleClass="ui-button-info" style="min-width:120px" ajax="false">
                                        <p:printer target="gpBillPreview" ></p:printer>
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>
                    </p:panel>

                    <h:panelGrid columns="2">
                        <h:outputLabel value="Matrix Department"/>
                        <h:outputLabel value="#{storeBillSearch.bill.fromDepartment.name}"/>
                    </h:panelGrid>

                    <p:dataTable id="tbl" styleClass="p-datatable-sm" rowIndexVar="rowIndex" value="#{storeBillSearch.bill.billItems}"  var="bip" rendered="#{(webUserController.hasPrivilege('ShowInwardFee'))}">

                        <p:column>
                            <f:facet name="header">
                                <h:outputLabel value="No"/>
                            </f:facet>
                            <h:outputLabel value="#{rowIndex+1}"/>
                        </p:column>

                        <p:column>
                            <f:facet name="header">
                                <h:outputLabel value="Item Name"/>
                            </f:facet>
                            <h:outputLabel value="#{bip.item.name}"/>
                        </p:column>


                        <p:column>
                            <f:facet name="header">
                                <h:outputLabel value="QTY"/>
                            </f:facet>
                            <p:outputLabel value="#{bip.qty}"/>
                        </p:column>

                        <p:column style="text-align: right;">
                            <f:facet name="header">
                                <h:outputLabel value="Gross Value"/>
                            </f:facet>
                            <h:outputLabel value="#{bip.grossValue}">
                                <f:convertNumber pattern="#0.00" />
                            </h:outputLabel>
                        </p:column>

                        <p:column style="text-align: right;">
                            <f:facet name="header">
                                <h:outputLabel value="Matrix Value"/>
                            </f:facet>
                            <h:outputLabel value="#{bip.marginValue}">
                                <f:convertNumber pattern="#0.00" />
                            </h:outputLabel>
                        </p:column>

                        <p:column style="text-align: right;" rendered="#{webUserController.hasPrivilege('IPBillingViewDiscount')}">
                            <f:facet name="header">
                                <h:outputLabel value="Discount"/>
                            </f:facet>
                            <h:outputLabel value="#{bip.discount}">
                                <f:convertNumber pattern="#0.00" />
                            </h:outputLabel>
                        </p:column>

                        <p:column style="text-align: right;">
                            <f:facet name="header">
                                <h:outputLabel value="Net Value"/>
                            </f:facet>
                            <h:outputLabel value="#{bip.netValue}">
                                <f:convertNumber pattern="#0.00" />
                            </h:outputLabel>
                        </p:column>


                        <p:columnGroup type="footer">
                            <p:row>
                                <p:column  style="text-align: right;" colspan="4">
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{storeBillSearch.bill.total}">
                                            <f:convertNumber pattern="#0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column  style="text-align: right;" colspan="2" rendered="#{webUserController.hasPrivilege('IPBillingViewDiscount')}">
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{storeBillSearch.bill.discount}">
                                            <f:convertNumber pattern="#0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                                <p:column  style="text-align: right;" colspan="#{webUserController.hasPrivilege('IPBillingViewDiscount') ? 1 : 2}">
                                    <f:facet name="footer">
                                        <h:outputLabel value="#{storeBillSearch.bill.netTotal}">
                                            <f:convertNumber pattern="#0.00" />
                                        </h:outputLabel>
                                    </f:facet>
                                </p:column>
                            </p:row>
                        </p:columnGroup>
                    </p:dataTable>


                    <h:panelGroup id="gpBillPreview" >
                        <st:issueBill bill="#{storeBillSearch.bill}" duplicate="true" />
                    </h:panelGroup>


                </h:form>
            </ui:define>



        </ui:composition>

    </h:body>
</html>
