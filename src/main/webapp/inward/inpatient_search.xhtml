<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head >
    </h:head>
    <h:body>

        <ui:composition template="/resources/template/template.xhtml">

            <ui:define name="content">
                <h:form id="form">
                    <p:panel>
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fa fa-search"/>
                                    <h:outputLabel value="Admissions" class="mx-2"/>
                                </div>
                                <div>
                                    <h:panelGroup rendered="#{webUserController.hasPrivilege('NursingWorkBench')}">
                                        <p:commandButton
                                            ajax="false"
                                            value="Nursing WorkBench"
                                            icon="fa fa-stethoscope"
                                            title="Nursing WorkBench"
                                            class="ui-button-operating-theatre me-2"
                                            action="#{nursingWorkBenchController.navigateToBackNursingWorkBench()}"/>
                                    </h:panelGroup>
                                </div>
                            </div>
                        </f:facet>
                        <div class="row">
                            <div class="col-2">
                                <p:outputLabel value="From Date"></p:outputLabel>
                                <p:datePicker
                                    value="#{admissionController.fromDate}"
                                    class="w-100"
                                    showTime="true"
                                    showButtonBar="true"
                                    timeInput="true"
                                    inputStyleClass="form-control"
                                    maxdate="#{commonFunctionsProxy.endOfDay}"
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}"          >
                                </p:datePicker>
                                <p:outputLabel value="To Date"></p:outputLabel>
                                <p:datePicker
                                    class="w-100"
                                    showTime="true"
                                    showButtonBar="true"
                                    timeInput="true"
                                    inputStyleClass="form-control"
                                    value="#{admissionController.toDate}"
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}">
                                </p:datePicker>

                                <p:commandButton
                                    ajax="false"
                                    value="Search"
                                    icon="fas fa-search"
                                    rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsGeneralSearch')}"
                                    action="#{admissionController.searchAdmissions}"
                                    class="mt-2 w-100 mb-3 ui-button-warning">
                                </p:commandButton>

                                <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByAdmittedDepartmentAnyInstitute') or webUserController.hasPrivilege('InwardSearchAdmissionsByAdmittedDepartmentLoggedInstitute') or webUserController.hasPrivilege('InwardSearchAdmissionsByAdmittedDepartmentLoggedDepartment')}">
                                    <h:outputText value="Search By Admitted Department" style="font-weight:bold" />
                                    <p:commandButton
                                        ajax="false"
                                        value="Any Institute"
                                        icon="fas fa-search"
                                        rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByAdmittedDepartmentAnyInstitute')}"
                                        action="#{admissionController.searchAdmissionsByAdmittedDepartmentAnyInstitute}"
                                        class="mt-1 w-100 ui-button-secondary">
                                    </p:commandButton>
                                    <p:commandButton
                                        ajax="false"
                                        value="Logged Institute"
                                        icon="fas fa-search"
                                        rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByAdmittedDepartmentLoggedInstitute')}"
                                        action="#{admissionController.searchAdmissionsByAdmittedDepartmentLoggedInstitute}"
                                        class="mt-1 w-100 ui-button-secondary">
                                    </p:commandButton>
                                    <p:commandButton
                                        ajax="false"
                                        value="Logged Department"
                                        icon="fas fa-search"
                                        rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByAdmittedDepartmentLoggedDepartment')}"
                                        action="#{admissionController.searchAdmissionsByAdmittedDepartmentLoggedDepartment}"
                                        class="mt-1 mb-3 w-100 ui-button-secondary">
                                    </p:commandButton>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByCurrentDepartmentAnyInstitute') or webUserController.hasPrivilege('InwardSearchAdmissionsByCurrentDepartmentLoggedInstitute') or webUserController.hasPrivilege('InwardSearchAdmissionsByCurrentDepartmentLoggedDepartment')}">
                                    <h:outputText value="Search By Current Department" style="font-weight:bold" />
                                    <p:commandButton
                                        ajax="false"
                                        value="Any Institute"
                                        icon="fas fa-search"
                                        rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByCurrentDepartmentAnyInstitute')}"
                                        action="#{admissionController.searchAdmissionsByCurrentDepartmentAnyInstitute}"
                                        class="mt-1 w-100 ui-button-secondary">
                                    </p:commandButton>
                                    <p:commandButton
                                        ajax="false"
                                        value="Logged Institute"
                                        icon="fas fa-search"
                                        rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByCurrentDepartmentLoggedInstitute')}"
                                        action="#{admissionController.searchAdmissionsByCurrentDepartmentLoggedInstitute}"
                                        class="mt-1 w-100 ui-button-secondary">
                                    </p:commandButton>
                                    <p:commandButton
                                        ajax="false"
                                        value="Logged Department"
                                        icon="fas fa-search"
                                        rendered="#{webUserController.hasPrivilege('InwardSearchAdmissionsByCurrentDepartmentLoggedDepartment')}"
                                        action="#{admissionController.searchAdmissionsByCurrentDepartmentLoggedDepartment}"
                                        class="mt-1 mb-3 w-100 ui-button-secondary">
                                    </p:commandButton>
                                </h:panelGroup>

                                <p:outputLabel value="BHT No" ></p:outputLabel>
                                <p:inputText
                                    class="w-100"
                                    value="#{admissionController.bhtNumberForSearch}" >
                                </p:inputText>

                                <p:outputLabel value="Patient Name" ></p:outputLabel>
                                <p:inputText
                                    class="w-100"
                                    value="#{admissionController.patientNameForSearch}" >
                                </p:inputText>

                                <p:outputLabel value="MRN / PHN No" ></p:outputLabel>
                                <p:inputText
                                    class="w-100"
                                    value="#{admissionController.patientNumberForSearch}" >
                                </p:inputText>

                                <p:outputLabel value="Patient Phone" ></p:outputLabel>
                                <p:inputText
                                    class="w-100"
                                    value="#{admissionController.patientPhoneNumberForSearch}" >
                                </p:inputText>

                                <p:outputLabel value="Patient NIC / Passport" ></p:outputLabel>
                                <p:inputText
                                    class="w-100"
                                    value="#{admissionController.patientIdentityNumberForSearch}" >
                                </p:inputText>

                                <h:outputText value="Patient Area" />
                                <p:autoComplete 
                                    id="area" 
                                    class="w-100 -mx-2"
                                    inputStyleClass="form-control"
                                    forceSelection="true"
                                    value="#{admissionController.patientArea}"  
                                    completeMethod="#{areaController.completeArea}" 
                                    var="pa"
                                    placeholder="Patient Area"
                                    itemLabel="#{pa.name}" 
                                    itemValue="#{pa}" 
                                    maxResults="15"
                                    size="10">
                                </p:autoComplete> 

                                <p:outputLabel value="Referring Doctor" ></p:outputLabel>
                                <p:autoComplete
                                    forceSelection="true"
                                    id="cmbDoc"
                                    value="#{admissionController.referringDoctorForSearch}"
                                    completeMethod="#{doctorController.completeDoctor}"
                                    var="ix"
                                    class="w-100"
                                    inputStyleClass="form-control">
                                    <p:column headerText="Name">
                                        <h:outputLabel value="#{ix.person.nameWithTitle}"></h:outputLabel>
                                    </p:column>
                                    <p:column headerText="Speciality">
                                        <h:outputLabel value="#{ix.speciality.name}"></h:outputLabel>
                                    </p:column>
                                </p:autoComplete>



                                <p:outputLabel value="Occupation" ></p:outputLabel>
                                <p:autoComplete
                                    id="occupation"
                                    class="w-100"
                                    inputStyleClass="form-control"
                                    forceSelection="true"
                                    value="#{admissionController.occupationForSearch}"
                                    completeMethod="#{clinicalEntityController.completeOccupation}"
                                    var="occ"
                                    itemLabel="#{occ.name}"
                                    itemValue="#{occ.name}"
                                    placeholder="Occupation"
                                    maxResults="15"
                                    size="10">
                                </p:autoComplete>

                                <p:outputLabel value="Insurance Company" ></p:outputLabel>
                                <p:selectOneMenu
                                    class="w-100"
                                    value="#{admissionController.creditCompanyForSearch}"
                                    filter="true"
                                    autoWidth="false"
                                    >
                                    <f:selectItem itemLabel="All"></f:selectItem>
                                    <f:selectItems value="#{institutionController.creditCompanies}" var="cc" itemLabel="#{cc.name}" itemValue="#{cc}" />
                                </p:selectOneMenu>

                                <p:outputLabel value="Status" ></p:outputLabel>
                                <p:selectOneMenu
                                    class="w-100"
                                    value="#{admissionController.admissionStatusForSearch}" >
                                    <f:selectItem itemLabel="Any Status"></f:selectItem>
                                    <f:selectItems value="#{enumController.admissionStatuses}"
                                                   var="status"
                                                   itemValue="#{status}" itemLabel="#{status.label}" />
                                </p:selectOneMenu>

                                <p:outputLabel value="Admission Type" ></p:outputLabel>
                                <p:selectOneMenu
                                    class="w-100"
                                    value="#{admissionController.admissionTypeForSearch}" >
                                    <f:selectItem itemLabel="All"></f:selectItem>
                                    <f:selectItems value="#{admissionTypeController.items}" var="myItem" itemValue="#{myItem}" itemLabel="#{myItem.name}" />
                                </p:selectOneMenu>

                                <p:outputLabel value="Institution"></p:outputLabel>
                                <p:selectOneMenu
                                    class="w-100"
                                    id="cmbFromInstitution"
                                    value="#{admissionController.institutionForSearch}"
                                    filter="true"
                                    autoWidth="false"
                                    >
                                    <f:selectItem itemLabel="All"></f:selectItem>
                                    <f:selectItems value="#{institutionController.companies}" var="ins" itemLabel="#{ins.name}" itemValue="#{ins}" />
                                    <p:ajax process="@this"
                                            listener="#{admissionController.onInstitutionForSearchChange}"
                                            update=":#{p:resolveFirstComponentWithId('cmbSite',view).clientId} :#{p:resolveFirstComponentWithId('cmbFromLoggedDepartment',view).clientId}" />
                                </p:selectOneMenu>

                                <h:panelGroup  rendered="#{webUserController.hasPrivilege('InwardSearchServiceBillUnrestrictedAccess') or !configOptionApplicationController.getBooleanValueByKey('Restirct Inward Admission Search to Logged Department of the User')}" >
                                    <p:outputLabel value="Site"></p:outputLabel>
                                    <p:selectOneMenu
                                        class="w-100"
                                        id="cmbSite"
                                        value="#{admissionController.site}"
                                        filter="true"
                                        autoWidth="false"
                                        >
                                        <f:selectItem itemLabel="All"></f:selectItem>
                                        <f:selectItems value="#{institutionController.sites}" var="site" itemLabel="#{site.name}" itemValue="#{site}" />
                                        <p:ajax process="@this"
                                                listener="#{admissionController.onSiteForSearchChange}"
                                                update=":#{p:resolveFirstComponentWithId('cmbFromLoggedDepartment',view).clientId}" />
                                    </p:selectOneMenu>

                                    <p:outputLabel value="Department"></p:outputLabel>
                                    <p:selectOneMenu
                                        class="w-100"
                                        id="cmbFromLoggedDepartment"
                                        value="#{admissionController.loggedDepartment}"
                                        filter="true"
                                        autoWidth="false"
                                        >
                                        <f:selectItem itemLabel="All"></f:selectItem>
                                        <f:selectItems
                                            value="#{departmentController.getDepartmentsOfInstitutionAndSite(admissionController.institutionForSearch,admissionController.site)}"
                                            var="d"
                                            itemLabel="#{d.name}"
                                            itemValue="#{d}" />
                                    </p:selectOneMenu>
                                </h:panelGroup>


                            </div>
                            <div class="col-10">
                                <div class="p-1" >
                                    <p:dataTable 
                                        id="tblBills"
                                        value="#{admissionController.items}"
                                        var="a"
                                        emptyMessage="No records found"
                                        rowKey="#{a.id}"
                                        paginator="true"
                                        rows="10"
                                        paginatorAlwaysVisible="false"
                                        paginatorPosition="bottom"
                                        paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                        currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                        rowsPerPageTemplate="5,10,{ShowAll|'All'}"
                                        >
                                        
                                        <p:column headerText="BHT No" >
                                            <h:outputText value="#{a.bhtNo}"></h:outputText>
                                        </p:column>
                                        <p:column headerText="Patient Name"  >
                                            <h:outputText value="#{a.patient.person.nameWithTitle}" ></h:outputText>
                                            <!-- Encounter flag badge — hidden for the STANDARD default. (Issue #21182) -->
                                            <ui:fragment rendered="#{a.encounterRegistrationFlag eq 'ON_ADMISSION_DEATH'}">
                                                <br/>
                                                <p:tag value="#{a.encounterRegistrationFlag.label}"
                                                       icon="fas fa-cross"
                                                       style="background-color:#455a64; color:#ffffff;"/>
                                            </ui:fragment>
                                            <ui:fragment rendered="#{a.encounterRegistrationFlag eq 'RAPID_TEMP_AE'}">
                                                <br/>
                                                <p:tag value="#{a.encounterRegistrationFlag.label}"
                                                       icon="fas fa-truck-medical"
                                                       style="background-color:#f0ad4e; color:#212529;"/>
                                            </ui:fragment>
                                        </p:column>
                                        <p:column headerText="Phone/Mobile" >
                                            <h:outputText value="#{a.patient.person.phone}" ></h:outputText>
                                            <h:outputText value="&nbsp;&nbsp;" ></h:outputText>
                                            <h:outputText value=", #{a.patient.person.mobile}" ></h:outputText>
                                        </p:column>
                                        <p:column headerText="Address" rendered="#{configOptionApplicationController.getBooleanValueByKey('Show Address in Admission Search',true)}" >
                                            <h:outputText value="#{a.patient.person.address}" ></h:outputText>
                                        </p:column>
                                        <p:column headerText="Area" rendered="#{configOptionApplicationController.getBooleanValueByKey('Show Patient Area in Admission Search',true)}">
                                            <h:outputText value="#{a.patient.person.area.name}" ></h:outputText>
                                        </p:column>
                                        <p:column headerText="Dr. Name" rendered="#{configOptionApplicationController.getBooleanValueByKey('Show Doctor Name in Admission Search',false)}" >
                                            <h:outputText value="#{a.referringConsultant.person.nameWithTitle}" ></h:outputText>
                                        </p:column>
                                        <p:column headerText="Status" >
                                            <h:panelGroup class="my-1">
                                                <!-- Discharge Status -->
                                                <h:panelGroup rendered="#{a.discharged}" >
                                                    <p:tag severity="success" style="font-size: 15px" class="my-1 w-75" >
                                                        <i class="fa fa-fw fa-bed" title="Discharged"></i>
                                                        &nbsp;<i class="fa fa-check" title="Discharged"></i></p:tag>
                                                </h:panelGroup>
                                                <h:panelGroup rendered="#{not a.discharged}">
                                                    <p:tag severity="danger" style="font-size: 15px"  class="my-1 w-75" >
                                                        <i class="fa fa-fw fa-bed" title="Not Discharged"></i>
                                                        &nbsp;<i class="fa fa-times" title="Not Discharged"></i></p:tag>
                                                </h:panelGroup>
                                            </h:panelGroup>
                                            <p:spacer width="20" ></p:spacer>
                                            <h:panelGroup>
                                                <!-- Bill Status -->
                                                <h:panelGroup rendered="#{a.paymentFinalized}">
                                                    <p:tag severity="success" style="font-size: 15px"  class="my-1 w-75">
                                                        <i class="fa fa-fw fa-money-bill-alt" title="Payment Finalized"></i>
                                                        &nbsp;<i class="fa fa-check" title="Payment Finalized"></i></p:tag>
                                                </h:panelGroup>
                                                <h:panelGroup rendered="#{not a.paymentFinalized}">
                                                    <p:tag severity="danger" style="font-size: 15px"  class="my-1 w-75">
                                                        <i class="fa fa-fw fa-money-bill-alt" title="Payment Pending"></i>
                                                        &nbsp;<i class="fa fa-times" title="Payment Pending"></i></p:tag>
                                                </h:panelGroup>
                                            </h:panelGroup>
                                        </p:column>

                                        <p:column headerText="Current Room" >
                                            <h:outputText value="#{a.currentPatientRoom.roomFacilityCharge.name}" ></h:outputText>
                                        </p:column>
                                        <p:column headerText="Admission Date" >
                                            <h:outputLabel value="#{a.dateOfAdmission}" >
                                                <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateFormat}" />
                                            </h:outputLabel>
                                        </p:column>
                                        <p:column headerText="Discharge Date" >
                                            <h:outputText value="#{a.dateOfDischarge}" >
                                                <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateFormat}" />
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="Actions" >
                                            <h:outputText value="#{a.currentPatientRoom.name}" ></h:outputText>
                                            <p:commandButton
                                                ajax="false"
                                                class="m-1"
                                                icon="fa fa-fw fa-bed"
                                                title="Inpatient Dashboard"
                                                action="#{admissionController.navigateToAdmissionProfilePage}">
                                                <f:setPropertyActionListener value="#{a}" target="#{admissionController.current}" />
                                            </p:commandButton>
                                            <p:commandButton
                                                ajax="false"
                                                class="m-1 ui-button-operating-theatre"
                                                icon="fa fa-stethoscope"
                                                title="Nursing WorkBench"
                                                rendered="#{webUserController.hasPrivilege('NursingWorkBench')}"
                                                action="#{nursingWorkBenchController.navigateToNursingWorkBenchWithAdmission(a.id)}">
                                            </p:commandButton>

                                            <p:commandButton 
                                                ajax="false"
                                                class="m-1"
                                                icon="fa fa-user-md"
                                                action="#{patientController.navigateToOpdPatientProfile()}">
                                                <f:setPropertyActionListener value="#{a.patient}" target="#{patientController.current}" />
                                            </p:commandButton>

                                            <p:commandButton 
                                                ajax="false"
                                                class="m-1"
                                                icon="fa fa-repeat"
                                                title="Convert"
                                                action="#{patientController.navigateToConvertNonBhtToBht(a)}"
                                                rendered="#{a.currentPatientRoom eq null and configOptionApplicationController.getBooleanValueByKey('Enable Button to Convert Admissions to new Admission',false)}"
                                                disabled="#{a.convertedToAnotherEncounter}">
                                                <f:setPropertyActionListener value="#{a}" target="#{admissionController.current}" />
                                            </p:commandButton>

                                        </p:column>

                                    </p:dataTable>

                                </div>
                            </div>
                        </div>

                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
