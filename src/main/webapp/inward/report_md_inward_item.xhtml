<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/inward/inward_reports.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                >

    <ui:define name="subcontent">
        <h:form>

            <p:panel header="Inpatient Service Summary">


                <p:panelGrid columns="4" class="w-100 my-2" >

                    <h:outputLabel for="dateFilterType" value="Date Type"/>
                    <p:selectOneMenu class="w-100" id="dateFilterType"
                                     value="#{mdInwardReportController.dateFilterType}">
                        <f:selectItem itemLabel="Service Added Date" itemValue="SERVICE_ADDED"/>
                        <f:selectItem itemLabel="Admitted Date" itemValue="ADMITTED"/>
                        <f:selectItem itemLabel="Discharged Date" itemValue="DISCHARGED"/>
                        <f:ajax event="change" listener="#{mdInwardReportController.makeBillNull}"/>
                    </p:selectOneMenu>

                    <h:outputLabel for="fromDate" value="From"/>
                    <p:calendar class="w-100"
                                inputStyleClass="w-100" id="fromDate" value="#{mdInwardReportController.fromDate}" navigator="false" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                        <f:ajax event="dateSelect" render="tbl" execute="@this toDate" listener="#{mdInwardReportController.makeBillNull}"/>
                    </p:calendar>

                    <h:outputLabel for="toDate" value="To"/>
                    <p:calendar class="w-100"
                                inputStyleClass="w-100" id="toDate" value="#{mdInwardReportController.toDate}" navigator="false" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                        <f:ajax event="dateSelect" render="tbl" execute="@this fromDate" listener="#{mdInwardReportController.makeBillNull}"/>
                    </p:calendar>

                    <h:outputLabel for="admType" value="Admission Type"/>
                    <p:selectOneMenu class="w-100" id="admType"
                                     value="#{mdInwardReportController.admissionType}">
                        <f:selectItem itemLabel="All Admission Types" itemValue="#{null}" />
                        <f:selectItems value="#{admissionTypeController.items}"
                                       var="at" itemValue="#{at}" itemLabel="#{at.name}" />
                        <f:ajax event="change" listener="#{mdInwardReportController.makeBillNull}"/>
                    </p:selectOneMenu>

                    <h:outputLabel for="pm" value="Payment Method"/>
                    <p:selectOneMenu class="w-100" id="pm"
                                     value="#{mdInwardReportController.paymentMethod}">
                        <f:selectItem itemLabel="All Payment Methods"/>
                        <f:selectItems value="#{mdInwardReportController.paymentMethods}"/>
                        <f:ajax event="change" listener="#{mdInwardReportController.makeBillNull}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="ins" value="Institution" />
                    <p:selectOneMenu class="w-100" id="ins"
                                     value="#{mdInwardReportController.institution}"
                                     filter="true"
                                     filterMatchMode="contains"
                                     autoWidth="false">
                        <f:selectItem itemLabel="All Institutions" itemValue="#{null}" />
                        <f:selectItems value="#{institutionController.items}"
                                       var="ix" itemLabel="#{ix.name}" itemValue="#{ix}" />
                        <f:ajax event="change" listener="#{mdInwardReportController.makeBillNull}" />
                    </p:selectOneMenu>

                    <h:outputLabel for="siteMenu" value="Site"/>
                    <p:selectOneMenu class="w-100" id="siteMenu"
                                     value="#{mdInwardReportController.site}"
                                     filter="true">
                        <f:selectItem itemLabel="All Sites" />
                        <f:selectItems value="#{institutionController.sites}" var="site" itemLabel="#{site.name}" itemValue="#{site}" />
                        <f:ajax event="change" listener="#{mdInwardReportController.makeBillNull}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="dept" value="Department" />
                    <p:selectOneMenu class="w-100" id="dept"
                                     value="#{mdInwardReportController.dept}"
                                     filter="true"
                                     filterMatchMode="contains"
                                     autoWidth="false">
                        <f:selectItem itemLabel="All Departments" itemValue="#{null}" />
                        <f:selectItems value="#{departmentController.items}"
                                       var="dept" itemLabel="#{dept.name}" itemValue="#{dept}" />
                        <f:ajax event="change" listener="#{mdInwardReportController.makeBillNull}" />
                    </p:selectOneMenu>
                    <p:outputLabel for="ct" value="Category" />
                    <p:autoComplete value="#{mdInwardReportController.category}" id="ct"
                                    forceSelection="true"
                                    completeMethod="#{categoryController.completeCategoryService}"
                                    var="cat" itemLabel="#{cat.name}"
                                    itemValue="#{cat}"
                                    class="w-100"
                                    inputStyleClass="w-100">
                        <p:column headerText="Category">
                            <h:outputLabel value="#{cat.name}"/>
                        </p:column>
                        <p:column headerText="Parent Category" class="mx-2">
                            <h:outputLabel value="#{cat.parentCategory.name}"/>
                        </p:column>
                        <p:column headerText="TYPE">
                            <h:outputLabel value="Parent Category"
                                           rendered="#{cat.categoryClass eq 'class com.divudi.core.entity.ServiceCategory'}"/>
                            <h:outputLabel value="Child Category"
                                           rendered="#{cat.categoryClass eq 'class com.divudi.core.entity.ServiceSubCategory'}"/>

                        </p:column>

                    </p:autoComplete>



                    <p:outputLabel for="acIx" value="Item" />
                    <p:autoComplete  widgetVar="aIx" id="acIx" forceSelection="true"
                                     value="#{mdInwardReportController.item}"
                                     completeMethod="#{itemController.completeAllServicesAndInvestigationsCategory}"
                                     var="ix" itemLabel="#{ix.name}" itemValue="#{ix}"
                                     class="w-100"
                                     inputStyleClass="w-100">
                        <p:column>
                            <h:outputLabel value="#{ix.name}"/>
                        </p:column>
                        <p:column>
                            <h:outputLabel value="#{ix.department.name}"/>
                        </p:column>
                        <p:column>
                            <h:outputLabel value="#{ix.total}"
                                           rendered="#{ix.chargesVisibleForInward or (webUserController.hasPrivilege('ShowInwardFee'))}">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputLabel>
                        </p:column>
                        <p:ajax event="itemSelect" process="acIx ct" update="@all" />
                        <p:ajax event="focus" process="ct"/>
                    </p:autoComplete>

                </p:panelGrid>

                <div class="d-flex align-items-center my-3">
                    <p:commandButton
                        ajax="false"
                        value="Process"
                        icon="fas fa-cogs"
                        class="ui-button-warning mx-2"
                        action="#{mdInwardReportController.processInpatientServiceSummary}" />
                    <p:commandButton
                        ajax="false"
                        icon="fas fa-file-excel"
                        value="Download Excel"
                        actionListener="#{mdInwardReportController.processInpatientServiceSummary}"
                        class="ui-button-success mx-2">
                        <p:dataExporter type="xlsx" target="tbl" fileName="service_summary_report" />
                    </p:commandButton>
                    <p:commandButton
                        icon="fas fa-print"
                        ajax="false"
                        value="Print"
                        class="mx-2 ui-button-info" >
                        <p:printer target="reportPrint"/>
                    </p:commandButton>
                </div>
            </p:panel>

            <p:panel id="reportPrint">
                <style>
                    @media screen {
                        .printOnlyReport { display: none; }
                    }
                    @media print {
                        @page { size: A4 landscape; }
                        .noPrintButton { display: none !important; }
                        .printOnlyReport { display: block; }
                        .printOnlyReport table {
                            width: 100%;
                            border-collapse: collapse;
                            font-size: 9pt;
                        }
                        .printOnlyReport th, .printOnlyReport td {
                            border: 1px solid #000;
                            padding: 2px 4px;
                            text-align: left;
                            overflow-wrap: anywhere;
                        }
                    }
                </style>

                <p:dataTable id="tbl" styleClass="noPrintButton" value="#{mdInwardReportController.itemWithFees}" rowIndexVar="i" var="iwf" >
                    <p:column headerText="No">
                        <h:outputLabel value="#{i+1}"/>
                    </p:column>
                    <p:column headerText="Institution" >
                        <h:outputLabel value="#{iwf.item.institution.name}"/>
                    </p:column>
                    <p:column headerText="Department" >
                        <h:outputLabel value="#{iwf.item.department.name}"/>
                    </p:column>
                    <p:column headerText="Parent Categoy" >
                        <h:outputLabel value="#{iwf.item.category.parentCategory.name}"/>
                    </p:column>
                    <p:column headerText="Categoy" >
                        <h:outputLabel value="#{iwf.item.category.name}"/>
                    </p:column>
                    <p:column headerText="Name" >
                        <h:outputLabel value="#{iwf.item.name}"/>
                    </p:column>
                    <p:column headerText="Count">
                        <h:outputLabel value="#{iwf.count}"/>
                    </p:column>
                    <p:column styleClass="averageNumericColumn" headerText="Hospital Fee">
                        <h:outputLabel value="#{iwf.hospitalFee}">
                            <f:convertNumber pattern="#,##0.00" />
                        </h:outputLabel>
                        <f:facet name="footer">
                            <h:outputLabel value="#{mdInwardReportController.itemHospitalTotal}">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputLabel>
                        </f:facet>
                    </p:column>
                    <p:column styleClass="averageNumericColumn" headerText="Professional Fee">
                        <h:outputLabel value="#{iwf.proFee}">
                            <f:convertNumber pattern="#,##0.00" />
                        </h:outputLabel>
                        <f:facet name="footer">
                            <h:outputLabel value="#{mdInwardReportController.itemProfessionalTotal}">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputLabel>
                        </f:facet>
                    </p:column>
                    <p:column styleClass="averageNumericColumn" headerText="Total">
                        <h:outputLabel value="#{iwf.hospitalFee+iwf.proFee}">
                            <f:convertNumber pattern="#,##0.00" />
                        </h:outputLabel>
                        <f:facet name="footer">
                            <h:outputLabel value="#{mdInwardReportController.itemHospitalTotal+mdInwardReportController.itemProfessionalTotal}">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputLabel>
                        </f:facet>
                    </p:column>
                </p:dataTable>

                <h:panelGroup layout="block" id="printReport" styleClass="printOnlyReport">
                    <table>
                        <thead>
                            <tr>
                                <th><h:outputText value="No"/></th>
                                <th><h:outputText value="Institution"/></th>
                                <th><h:outputText value="Department"/></th>
                                <th><h:outputText value="Parent Categoy"/></th>
                                <th><h:outputText value="Categoy"/></th>
                                <th><h:outputText value="Name"/></th>
                                <th><h:outputText value="Count"/></th>
                                <th><h:outputText value="Hospital Fee"/></th>
                                <th><h:outputText value="Professional Fee"/></th>
                                <th><h:outputText value="Total"/></th>
                            </tr>
                        </thead>
                        <tbody>
                            <ui:repeat value="#{mdInwardReportController.itemWithFees}" var="iwf" varStatus="i">
                                <tr>
                                    <td><h:outputText value="#{i.index+1}"/></td>
                                    <td><h:outputText value="#{iwf.item.institution.name}"/></td>
                                    <td><h:outputText value="#{iwf.item.department.name}"/></td>
                                    <td><h:outputText value="#{iwf.item.category.parentCategory.name}"/></td>
                                    <td><h:outputText value="#{iwf.item.category.name}"/></td>
                                    <td><h:outputText value="#{iwf.item.name}"/></td>
                                    <td><h:outputText value="#{iwf.count}"/></td>
                                    <td style="text-align: right;"><h:outputText value="#{iwf.hospitalFee}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputText></td>
                                    <td style="text-align: right;"><h:outputText value="#{iwf.proFee}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputText></td>
                                    <td style="text-align: right;"><h:outputText value="#{iwf.hospitalFee+iwf.proFee}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputText></td>
                                </tr>
                            </ui:repeat>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="7" style="text-align: right; font-weight: bold;"><h:outputText value="Total"/></td>
                                <td style="text-align: right; font-weight: bold;">
                                    <h:outputText value="#{mdInwardReportController.itemHospitalTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </td>
                                <td style="text-align: right; font-weight: bold;">
                                    <h:outputText value="#{mdInwardReportController.itemProfessionalTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </td>
                                <td style="text-align: right; font-weight: bold;">
                                    <h:outputText value="#{mdInwardReportController.itemHospitalTotal+mdInwardReportController.itemProfessionalTotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </h:panelGroup>
            </p:panel>

        </h:form>
    </ui:define>



</ui:composition>
