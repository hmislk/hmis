<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pa="http://xmlns.jcp.org/jsf/composite/paymentMethod">

    <!-- Issue #23571: Appointment Deposit refund-to-patient workflow.
         Simpler sibling of inward_bill_refund.xhtml - no BHT search, no
         bill-picker table, since appointmentRefundController.originalBillToRefund
         is already set by navigateToRefundFromAppointmentBill() before the
         redirect into this page. -->

    <ui:define name="content">

        <h:panelGroup>
            <h:form id="frmAppointmentRefund">

                <h:panelGroup layout="block" rendered="#{appointmentRefundController.originalBillToRefund eq null}">
                    <p:panel>
                        <f:facet name="header">
                            <h:outputText styleClass="fa-solid fa-address-card fa-lg" style="margin-left: 8px;"/>
                            <p:outputLabel value="Appointment Deposit Refund" class="m-2"/>
                        </f:facet>
                        <div class="text-center py-5">
                            <i class="fa-solid fa-triangle-exclamation fa-2x text-warning mb-3"></i>
                            <p class="text-muted">No bill selected for refund.</p>
                            <p:commandButton
                                id="btnBackToSearchPaymentEmpty"
                                value="Back to Bill List"
                                action="/inward/inward_search_payment?faces-redirect=true"
                                ajax="false"
                                styleClass="ui-button-warning"
                                icon="fa fa-arrow-left"
                                title="Return to the payment bill list"/>
                        </div>
                    </p:panel>
                </h:panelGroup>

                <h:panelGroup layout="block" rendered="#{appointmentRefundController.originalBillToRefund ne null}">
                    <p:panel rendered="#{!appointmentRefundController.printPreview}">
                        <f:facet name="header">
                            <h:outputText styleClass="fa-solid fa-address-card fa-lg" style="margin-left: 8px;"/>
                            <p:outputLabel value="Appointment Deposit Refund" class="m-2"/>
                            <h:panelGroup style="float: right; padding-right: 10px;">
                                <p:commandButton class="ui-button-warning" icon="fas fa-arrow-rotate-left" id="btnRefund"
                                                 ajax="false" value="Refund" onclick="if (!confirm('Process this refund?')) return false;" action="#{appointmentRefundController.pay}" />
                                <p:commandButton class="ui-button-danger mx-2" icon="fas fa-ban" ajax="false"
                                                 value="Clear" action="#{appointmentRefundController.makeNull}" />
                            </h:panelGroup>
                        </f:facet>

                        <div class="row">
                            <div class="col-md-6">
                                <p:panel id="paid">
                                    <f:facet name="header">
                                        <h:outputText styleClass="fas fa-file-invoice"></h:outputText>
                                        <h:outputLabel value="Bill Details" class="mx-4"></h:outputLabel>
                                    </f:facet>
                                    <h:panelGrid columns="3" class="w-100">
                                        <h:outputLabel value="Bill No"/>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{appointmentRefundController.originalBillToRefund.deptId}"/>

                                        <h:outputLabel value="Bill Net Total"/>
                                        <h:outputLabel value=":" ></h:outputLabel>
                                        <h:outputLabel value="#{appointmentRefundController.originalBillToRefund.netTotal}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </h:panelGrid>
                                </p:panel>
                            </div>
                            <div class="col-md-6">
                                <p:panel id="amount">
                                    <f:facet name="header" >
                                        <h:outputText styleClass="fas fa-money-bill-wave"></h:outputText>
                                        <h:outputLabel value="Payment Details" class="mx-4"></h:outputLabel>
                                    </f:facet>

                                    <h:panelGrid columns="3" class="w-100" columnClasses="col-label,col-colon,col-value" >
                                        <p:outputLabel value="Payment Method"/>
                                        <h:outputText value=":"/>
                                        <p:selectOneMenu class="w-100" autoWidth="false" id="cmbPs" value="#{appointmentRefundController.current.paymentMethod}">
                                            <f:selectItem itemLabel="Select Payment Method"/>
                                            <f:selectItems value="#{appointmentRefundController.paymentMethods}"/>
                                            <p:ajax process="cmbPs" update="pnlPaymentMethodDetails" event="change"/>
                                        </p:selectOneMenu>

                                        <p:outputLabel value="Amount"/>
                                        <h:outputText value=":"/>
                                        <p:inputText
                                            class="w-100"
                                            autocomplete="off"
                                            onfocus="this.select()"
                                            value="#{appointmentRefundController.current.total}"/>
                                    </h:panelGrid>

                                    <h:panelGroup id="pnlPaymentMethodDetails" layout="block" class="mt-2">
                                        <h:panelGroup rendered="#{appointmentRefundController.current.paymentMethod eq 'Card'}" layout="block">
                                            <pa:creditCard paymentMethodData="#{appointmentRefundController.paymentMethodData}"/>
                                        </h:panelGroup>

                                        <h:panelGroup rendered="#{appointmentRefundController.current.paymentMethod eq 'Cheque'}" layout="block">
                                            <pa:cheque paymentMethodData="#{appointmentRefundController.paymentMethodData}"/>
                                        </h:panelGroup>

                                        <h:panelGroup rendered="#{appointmentRefundController.current.paymentMethod eq 'Slip'}" layout="block">
                                            <pa:slip paymentMethodData="#{appointmentRefundController.paymentMethodData}"/>
                                        </h:panelGroup>
                                    </h:panelGroup>

                                    <h:panelGrid columns="1" class="w-100 mt-2">
                                        <p:outputLabel value="Comments"/>
                                        <p:inputTextarea class="w-100" rows="2" value="#{appointmentRefundController.current.comments}"/>
                                    </h:panelGrid>
                                </p:panel>
                            </div>
                        </div>
                    </p:panel>

                    <p:panel rendered="#{appointmentRefundController.printPreview}" id="pnlPrintPreview">
                        <f:facet name="header">
                            <h:outputText styleClass="fas fa-check-circle fa-lg" style="margin-left: 8px;"/>
                            <p:outputLabel value="Refund Completed" class="m-2"/>
                        </f:facet>

                        <div class="d-flex gap-2 mb-3">
                            <p:commandButton
                                id="btnPrintRefund"
                                value="Print"
                                icon="fas fa-print"
                                class="ui-button-info"
                                type="button">
                                <p:printer target="pnlRefundSummary"/>
                            </p:commandButton>
                            <p:commandButton
                                id="btnToReceipt"
                                value="View Bill Receipt"
                                icon="fas fa-file-invoice"
                                class="ui-button-secondary"
                                ajax="false"
                                action="#{billSearch.navigateToViewBillByAtomicBillTypeByBillId(appointmentRefundController.current.id)}"/>
                            <p:commandButton
                                id="btnBackToSearchPaymentDone"
                                value="Back to Bill List"
                                icon="fa fa-arrow-left"
                                class="ui-button-warning"
                                ajax="false"
                                action="/inward/inward_search_payment?faces-redirect=true"/>
                        </div>

                        <h:panelGroup id="pnlRefundSummary" layout="block" style="max-width: 480px;">
                            <p:panel>
                                <h:panelGrid columns="3" class="w-100">
                                    <h:outputLabel value="Refund Bill No"/>
                                    <h:outputLabel value=":" ></h:outputLabel>
                                    <h:outputLabel value="#{appointmentRefundController.current.deptId}"/>

                                    <h:outputLabel value="Date"/>
                                    <h:outputLabel value=":" ></h:outputLabel>
                                    <h:outputLabel value="#{appointmentRefundController.current.billDate}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                    </h:outputLabel>

                                    <h:outputLabel value="Patient"/>
                                    <h:outputLabel value=":" ></h:outputLabel>
                                    <h:outputLabel value="#{appointmentRefundController.current.patient.person.name}"/>

                                    <h:outputLabel value="Amount Refunded"/>
                                    <h:outputLabel value=":" ></h:outputLabel>
                                    <h:outputLabel value="#{appointmentRefundController.current.total * -1}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>

                                    <h:outputLabel value="Payment Method"/>
                                    <h:outputLabel value=":" ></h:outputLabel>
                                    <h:outputLabel value="#{appointmentRefundController.current.paymentMethod}"/>

                                    <h:outputLabel value="Comments"/>
                                    <h:outputLabel value=":" ></h:outputLabel>
                                    <h:outputLabel value="#{appointmentRefundController.current.comments}"/>
                                </h:panelGrid>
                            </p:panel>
                        </h:panelGroup>
                    </p:panel>
                </h:panelGroup>

            </h:form>
        </h:panelGroup>

    </ui:define>

</ui:composition>
