<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!--
        Issue #23258: this page's title/URL/menu entry is "...Detail", but its
        results table is intentionally bound to bhtPaymentSummaryReportController
        (one row per PatientEncounter/BHT, with the full deposit / payment /
        post-payment / credit-settlement / final-bill breakdown) - not a typo.
        Related issues #23260/#23262/#23263 (filed against "the Detail report")
        describe exactly this controller's column set (Deposit / Payment / Post
        Payment column groups, Total Balance, post-payment-only patients),
        confirming the reporter's mental model: "Detail" = the full per-BHT
        financial breakdown, "Summary" = the plain payment log now shown on
        inward_report_bht_payment_summary.xhtml. Issue #23262 further split the
        one-time "Payments" bucket into three: "Make a Deposit" (INWARD_DEPOSIT),
        "Make a Payment" (INWARD_PAYMENT) and "Post Final Payment"
        (BillType.PostFinalBillInwardPayment). See BhtPaymentSummaryReportController's
        javadoc for the underlying data.
    -->
    <h:body>
        <ui:composition template="/inward/inward_reports.xhtml">
            <ui:define name="subcontent">
                <h:form id="frm">

                    <p:panel header="BHT Deposit and Credit Settlement Detail" class="m-1">

                        <h:panelGrid columns="8" styleClass="w-100 form-grid" columnClasses="label-icon-column, input-column">

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa ml-5" />
                                <h:outputLabel value="From" for="fromDate" class="mx-3"/>
                            </h:panelGroup>
                            <p:calendar
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                id="fromDate"
                                value="#{bhtPaymentSummaryReportController.fromDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf073;" styleClass="fa mr-2" />
                                <h:outputLabel value="To" for="toDate" class="mx-3"/>
                            </h:panelGroup>
                            <p:calendar
                                styleClass="w-100"
                                inputStyleClass="w-100 form-control"
                                id="toDate"
                                value="#{bhtPaymentSummaryReportController.toDate}"
                                pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf017;" styleClass="fa mr-2" />
                                <h:outputLabel value="Date Basis" for="dateBasisMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="dateBasisMenu"
                                styleClass="w-100 form-control"
                                value="#{bhtPaymentSummaryReportController.dateBasis}">
                                <f:selectItem itemValue="dischargeDate" itemLabel="Discharge Date" />
                                <f:selectItem itemValue="admissionDate" itemLabel="Admission Date" />
                            </p:selectOneMenu>

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf05a;" styleClass="fa mr-2" />
                                <h:outputLabel value="Admission Status" for="admStatusMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="admStatusMenu"
                                styleClass="w-100 form-control"
                                value="#{bhtPaymentSummaryReportController.admissionStatus}">
                                <f:selectItems
                                    value="#{enumController.admissionStatuses}"
                                    var="s"
                                    itemValue="#{s}"
                                    itemLabel="#{s.label}" />
                            </p:selectOneMenu>

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf0f0;" styleClass="fa mr-2" />
                                <h:outputLabel value="Admission Type" for="admTypeMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="admTypeMenu"
                                styleClass="w-100 form-control"
                                value="#{bhtPaymentSummaryReportController.admissionType}">
                                <f:selectItem itemLabel="All" itemValue="#{null}" />
                                <f:selectItems
                                    value="#{admissionTypeController.items}"
                                    var="at"
                                    itemValue="#{at}"
                                    itemLabel="#{at.name}" />
                            </p:selectOneMenu>

                            <p:spacer width="50" />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf09d;" styleClass="fa mr-2" />
                                <h:outputLabel value="Payment Method" for="pmMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu id="pmMenu" styleClass="w-100 form-control"
                                             value="#{bhtPaymentSummaryReportController.paymentMethod}">
                                <f:selectItem itemLabel="All Methods" itemValue="#{null}" />
                                <f:selectItems value="#{enumController.paymentMethodsWithoutCredit}" />
                            </p:selectOneMenu>

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf19c;" styleClass="fa mr-2" />
                                <h:outputLabel value="Institution" for="cmbIns" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="cmbIns"
                                styleClass="w-100 form-control"
                                value="#{bhtPaymentSummaryReportController.institution}"
                                filter="true">
                                <f:selectItem itemLabel="All Institutions" />
                                <f:selectItems value="#{institutionController.companies}" var="ins" itemLabel="#{ins.name}" itemValue="#{ins}" />
                                <p:ajax process="cmbIns" update="cmbDept" />
                            </p:selectOneMenu>

                            <p:spacer />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf3c5;" styleClass="fa mr-2" />
                                <h:outputLabel value="Site" for="siteMenu" class="mx-3"/>
                            </h:panelGroup>
                            <p:selectOneMenu
                                id="siteMenu"
                                styleClass="w-100 form-control"
                                value="#{bhtPaymentSummaryReportController.site}"
                                filter="true">
                                <f:selectItem itemLabel="All Sites" />
                                <f:selectItems value="#{institutionController.sites}" var="site" itemLabel="#{site.name}" itemValue="#{site}" />
                                <p:ajax process="siteMenu" update="cmbDept" />
                            </p:selectOneMenu>

                            <p:spacer />

                            <h:panelGroup layout="block" styleClass="form-group">
                                <h:outputText value="&#xf0e8;" styleClass="fa mr-2" />
                                <h:outputLabel value="Department" for="cmbDept" class="mx-3"/>
                            </h:panelGroup>
                            <h:panelGroup id="cmbDept">

                                <p:selectOneMenu
                                    rendered="#{bhtPaymentSummaryReportController.institution eq null and bhtPaymentSummaryReportController.site eq null}"
                                    styleClass="w-100 form-control"
                                    value="#{bhtPaymentSummaryReportController.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSite()}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                                <p:selectOneMenu
                                    rendered="#{bhtPaymentSummaryReportController.institution eq null and bhtPaymentSummaryReportController.site ne null}"
                                    styleClass="w-100 form-control"
                                    value="#{bhtPaymentSummaryReportController.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSite(bhtPaymentSummaryReportController.site)}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                                <p:selectOneMenu
                                    rendered="#{bhtPaymentSummaryReportController.institution ne null and bhtPaymentSummaryReportController.site eq null}"
                                    styleClass="w-100 form-control"
                                    value="#{bhtPaymentSummaryReportController.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSiteForInstitution(bhtPaymentSummaryReportController.institution)}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                                <p:selectOneMenu
                                    rendered="#{bhtPaymentSummaryReportController.institution ne null and bhtPaymentSummaryReportController.site ne null}"
                                    styleClass="w-100 form-control"
                                    value="#{bhtPaymentSummaryReportController.department}"
                                    filterMatchMode="contains"
                                    filter="true">
                                    <f:selectItem itemLabel="All Departments" />
                                    <f:selectItems
                                        value="#{departmentController.getDepartmentsOfInstitutionAndSite(bhtPaymentSummaryReportController.institution, bhtPaymentSummaryReportController.site)}"
                                        var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                </p:selectOneMenu>

                            </h:panelGroup>

                        </h:panelGrid>

                        <p:commandButton
                            value="Generate"
                            icon="fas fa-cogs"
                            action="#{bhtPaymentSummaryReportController.generateReport()}"
                            ajax="false"
                            class="ui-button-success m-1" />

                    </p:panel>

                    <p:panel id="pnlResults"
                             rendered="#{bhtPaymentSummaryReportController.reportRows != null}">

                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center">
                                <h:outputText value="Results" />
                                <div>
                                    <p:commandButton value="Print"
                                                     icon="fas fa-print"
                                                     class="ui-button-info me-1"
                                                     ajax="false">
                                        <p:printer target="tblReport" />
                                    </p:commandButton>
                                    <p:commandButton value="Excel"
                                                     icon="fas fa-file-excel"
                                                     class="ui-button-success"
                                                     ajax="false">
                                        <p:dataExporter type="xlsx"
                                                        target="tblReport"
                                                        fileName="BHT_Payment_Detail" />
                                    </p:commandButton>
                                    <p:commandButton value="PDF"
                                                     icon="fas fa-file-pdf"
                                                     class="ui-button-danger mx-1"
                                                     ajax="false">
                                        <p:dataExporter type="pdf"
                                                        target="tblReport"
                                                        fileName="BHT_Payment_Detail" />
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <p:dataTable
                            id="tblReport"
                            value="#{bhtPaymentSummaryReportController.reportRows}"
                            var="row"
                            emptyMessage="No records found"
                            paginator="true"
                            rows="20"
                            paginatorAlwaysVisible="false"
                            paginatorPosition="bottom"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="10,20,50,{ShowAll|'All'}"
                            styleClass="w-100">

                            <p:column headerText="BHT No" style="white-space:nowrap;">
                                <h:outputText value="#{row.bhtNo}" />
                            </p:column>

                            <p:column headerText="Patient Name">
                                <h:outputText value="#{row.patientName}" />
                            </p:column>

                            <p:column headerText="Admission Type" style="white-space:nowrap;">
                                <h:outputText value="#{row.admissionType != null ? row.admissionType.name : ''}" />
                            </p:column>

                            <p:column headerText="Admitted" style="white-space:nowrap;">
                                <h:outputText value="#{row.dateOfAdmission}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}" />
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Discharged" style="white-space:nowrap;">
                                <h:outputText value="#{row.dateOfDischarge}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}" />
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Deposit Cash" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.depositCash}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalDepositCash}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Deposit Card" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.depositCard}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalDepositCard}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Deposit Other" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.depositOther}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalDepositOther}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Total Deposits" style="text-align:right; white-space:nowrap; font-weight:bold;">
                                <h:outputText value="#{row.totalDeposits}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalDeposits}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Payment Cash" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.paymentCash}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPaymentCash}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Payment Card" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.paymentCard}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPaymentCard}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Payment Credit" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.paymentCredit}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPaymentCredit}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Payment Other" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.paymentOther}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPaymentOther}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Total Payments" style="text-align:right; white-space:nowrap; font-weight:bold;">
                                <h:outputText value="#{row.totalPayments}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPayments}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Post Payment Cash" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.postFinalCash}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPostFinalCash}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Post Payment Card" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.postFinalCard}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPostFinalCard}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Post Payment Credit" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.postFinalCredit}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPostFinalCredit}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Post Payment Other" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.postFinalOther}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPostFinalOther}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Total Post Payments" style="text-align:right; white-space:nowrap; font-weight:bold;">
                                <h:outputText value="#{row.totalPostFinalPayments}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalPostFinalPayments}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Grand Total" style="text-align:right; white-space:nowrap; font-weight:bold;">
                                <h:outputText value="#{row.totalAllMoneyIn}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalAllMoneyIn}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Total Credit Billed" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.creditBilledTotal}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalCreditBilled}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Credit Settled" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.creditSettlementTotal}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalCreditSettlement}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Credit Balance" style="text-align:right; white-space:nowrap; font-weight:bold;">
                                <h:outputText value="#{row.creditBalance}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalCreditBalance}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Credit Company">
                                <h:outputText value="#{row.creditCompanyNames}" />
                            </p:column>

                            <p:column headerText="Final Bill No" style="white-space:nowrap;">
                                <h:outputText value="#{row.finalBillNumber}" />
                            </p:column>

                            <p:column headerText="Total Bill Value" style="text-align:right; white-space:nowrap;">
                                <h:outputText value="#{row.finalBillTotal}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalFinalBills}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                            <p:column headerText="Total Balance" style="text-align:right; white-space:nowrap; font-weight:bold;">
                                <h:outputText value="#{row.totalBalance}">
                                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                </h:outputText>
                                <f:facet name="footer">
                                    <h:outputText value="#{bhtPaymentSummaryReportController.grandTotalBalance}">
                                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                                    </h:outputText>
                                </f:facet>
                            </p:column>

                        </p:dataTable>

                    </p:panel>

                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
