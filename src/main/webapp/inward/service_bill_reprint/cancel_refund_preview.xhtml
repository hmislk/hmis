<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:bill="http://xmlns.jcp.org/jsf/composite/bill"
                xmlns:print="http://xmlns.jcp.org/jsf/composite/ezcomp/prints">

    <!-- Reprint of the refund bills or the cancellation bill of the service bill in inwardSearch.bill.
         Params: duplicate (boolean).
         Refunds follow the routing of inward_bill_service_refund.xhtml, cancellations follow
         inward_cancel_bill_service.xhtml, so each reprint comes out like the slip printed at the time. -->

    <h:panelGroup rendered="#{!inwardSearch.bill.cancelled}">
        <ui:repeat value="#{inwardSearch.bill.refundBills}" var="rb">

            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'FiveFivePaper'
                                      or configOptionController.getBooleanValueByKeyReadOnly('Inward Service Bill Refund - Show 5x5 Format', false)}">
                <print:five_five_paper_with_headings_inward_service bill="#{rb}" duplicate="#{duplicate}"/>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'FiveFivePrintedPaper'
                                      or configOptionController.getBooleanValueByKeyReadOnly('Inward Service Bill Refund - Show 5x5 Pre-printed Format', false)}">
                <print:five_five_paper_without_headings_inward_service bill="#{rb}" dup="#{duplicate}"/>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'PosPaper'
                                      or configOptionController.getBooleanValueByKeyReadOnly('Inward Service Bill Refund - Show POS Format', false)}">
                <print:posOpdBill_inward_service bill="#{rb}" duplicate="#{duplicate}"/>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'A4Paper'
                                      or configOptionController.getBooleanValueByKeyReadOnly('Inward Service Bill Refund - Show A4 Format', false)}">
                <print:A4_paper_with_headings bill="#{rb}" duplicate="#{duplicate}"/>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'A4PrintedPaper'
                                      or configOptionController.getBooleanValueByKeyReadOnly('Inward Service Bill Refund - Show A4 Pre-printed Format', false)}">
                <print:A4_paper_without_headings bill="#{rb}" duplicate="#{duplicate}"/>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'FiveFivePaperCoustom1'
                                      or configOptionController.getBooleanValueByKeyReadOnly('Inward Service Bill Refund - Show Custom 1 Format', false)}">
                <print:five_five_paper_coustom_1_inward_service_refund bill="#{rb}" duplicate="#{duplicate}"/>
            </h:panelGroup>

            <!-- The refund page has no Custom 3 or 5x8 format; these keep the reprint those departments already had -->
            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'FiveFiveCustom3'}">
                <print:five_five_custom_3_inward bill="#{rb}" duplicate="#{duplicate}" payments="1"/>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionController.departmentPreference.inwardServiceBillPaperType eq 'FiveEightInchPaper'}">
                <print:five_eight_opd_bill_inward bill="#{rb}" duplicate="#{duplicate}" payments="1"/>
            </h:panelGroup>

            <br/>
        </ui:repeat>
    </h:panelGroup>

    <h:panelGroup rendered="#{inwardSearch.bill.cancelled}">

        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Servise Bill size is POS Paper')}">
            <bill:inwardBillPrintPos bill="#{inwardSearch.bill.cancelledBill}" duplicate="#{duplicate}" cancelled="true"/>
            <br/>
        </h:panelGroup>

        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Servise Bill size is FiveFive paper', true)}">
            <div style="page-break-after: always;">
                <print:five_five_paper_with_headings_inward_service bill="#{inwardSearch.bill.cancelledBill}" duplicate="#{duplicate}" cancelled="true"/>
            </div>
            <br/>
        </h:panelGroup>

        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Servise Bill size is FiveFiveCustom3 Paper')}">
            <print:five_five_custom_3_inward bill="#{inwardSearch.bill.cancelledBill}" duplicate="#{duplicate}" payments="1" cancelled="true"/>
            <br/>
        </h:panelGroup>

        <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Servise Bill size is 5x8 inch Paper')}">
            <print:five_eight_opd_bill_inward bill="#{inwardSearch.bill.cancelledBill}" duplicate="#{duplicate}" payments="1"/>
            <br/>
        </h:panelGroup>

    </h:panelGroup>

</ui:composition>
