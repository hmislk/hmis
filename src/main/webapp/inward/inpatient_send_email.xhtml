<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui"
                >

    <ui:define name="content">
        <h:form>
            <p:panel styleClass="shadow-sm">
                <f:facet name="header">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h:outputText styleClass="fa-solid fa-envelope"></h:outputText>
                            <h:outputLabel value="Send Email" class="mx-4"></h:outputLabel>
                        </div>
                        <div class="d-flex gap-2">
                            <p:commandButton
                                ajax="false"
                                icon="fa fa-envelope-open-text"
                                value="Sent Emails"
                                class="ui-button-secondary"
                                action="#{emailController.navigateToAdmissionSentEmails(inpatientEmailComposeController.patientEncounter)}">
                            </p:commandButton>
                            <p:commandButton
                                ajax="false"
                                icon="fa fa-id-card"
                                value="Inpatient Dashboard"
                                class="ui-button-secondary"
                                action="#{admissionController.navigateToAdmissionProfilePage}">
                                <f:setPropertyActionListener value="#{inpatientEmailComposeController.patientEncounter}" target="#{admissionController.current}"></f:setPropertyActionListener>
                            </p:commandButton>
                            <h:panelGroup rendered="#{webUserController.hasPrivilege('NursingWorkBench')}">
                                <p:commandButton
                                    value="Nursing WorkBench"
                                    ajax="false"
                                    action="#{nursingWorkBenchController.navigateToBackNursingWorkBench()}"
                                    class="ui-button-operating-theatre"
                                    icon="fa fa-arrow-left">
                                </p:commandButton>
                            </h:panelGroup>
                        </div>
                    </div>
                </f:facet>

                <div class="row">
                    <div class="col-md-8">

                        <p:panel header="Recipients" styleClass="mb-3">
                            <div class="mb-3">
                                <p:outputLabel value="To" styleClass="fw-bold d-block" />
                                <p:autoComplete
                                    value="#{inpatientEmailComposeController.toRecipients}"
                                    completeMethod="#{inpatientEmailComposeController.completeRecipientCandidates}"
                                    var="rc"
                                    itemLabel="#{rc.label} (#{rc.email})"
                                    itemValue="#{rc}"
                                    converter="emailRecipientCandidateConverter"
                                    multiple="true"
                                    forceSelection="true"
                                    placeholder="Search any institution or person"
                                    class="w-100"
                                    title="Add any institution or person as a To recipient">
                                </p:autoComplete>
                            </div>
                            <div class="mb-3">
                                <p:outputLabel value="CC" styleClass="fw-bold d-block" />
                                <p:autoComplete
                                    value="#{inpatientEmailComposeController.ccRecipients}"
                                    completeMethod="#{inpatientEmailComposeController.completeRecipientCandidates}"
                                    var="rcc"
                                    itemLabel="#{rcc.label} (#{rcc.email})"
                                    itemValue="#{rcc}"
                                    converter="emailRecipientCandidateConverter"
                                    multiple="true"
                                    forceSelection="true"
                                    placeholder="Search any institution or person"
                                    class="w-100"
                                    title="Add any institution or person as a CC recipient">
                                </p:autoComplete>
                            </div>
                            <div>
                                <p:outputLabel value="BCC" styleClass="fw-bold d-block" />
                                <p:autoComplete
                                    value="#{inpatientEmailComposeController.bccRecipients}"
                                    completeMethod="#{inpatientEmailComposeController.completeRecipientCandidates}"
                                    var="rbcc"
                                    itemLabel="#{rbcc.label} (#{rbcc.email})"
                                    itemValue="#{rbcc}"
                                    converter="emailRecipientCandidateConverter"
                                    multiple="true"
                                    forceSelection="true"
                                    placeholder="Search any institution or person"
                                    class="w-100"
                                    title="Add any institution or person as a BCC recipient">
                                </p:autoComplete>
                            </div>
                        </p:panel>

                        <p:panel header="Message" styleClass="mb-3">
                            <div class="d-flex gap-2 align-items-end mb-3">
                                <div>
                                    <p:outputLabel value="Template" styleClass="d-block" />
                                    <p:selectOneMenu id="emailTemplate" value="#{inpatientEmailComposeController.selectedTemplate}"
                                                     filter="true" filterMatchMode="contains" style="min-width:18rem">
                                        <f:selectItem itemLabel="-- Select Template --" itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{inpatientEmailComposeController.emailTemplates}"
                                                       var="tpl" itemLabel="#{tpl.name}" itemValue="#{tpl}" />
                                    </p:selectOneMenu>
                                </div>
                                <p:commandButton value="Generate" icon="fa fa-wand-magic-sparkles"
                                                 process="@this emailTemplate" update="@form"
                                                 action="#{inpatientEmailComposeController.generateFromTemplate()}" />
                            </div>

                            <div class="mb-3">
                                <p:outputLabel value="Email Subject*" styleClass="d-block" />
                                <p:inputText
                                    id="emailSubject"
                                    required="true"
                                    class="w-100"
                                    value="#{inpatientEmailComposeController.subject}"
                                    placeholder="Email Subject">
                                </p:inputText>
                            </div>

                            <p:textEditor
                                value="#{inpatientEmailComposeController.emailBody}"
                                secure="false"
                                height="400">
                            </p:textEditor>
                        </p:panel>

                        <p:panel header="Attachments" styleClass="mb-3">
                            <h:panelGroup layout="block" styleClass="mb-3" rendered="#{not empty inpatientEmailComposeController.encounterUploads}">
                                <p:outputLabel value="Saved Uploads" styleClass="fw-bold d-block" />
                                <p:selectManyCheckbox value="#{inpatientEmailComposeController.selectedUploads}" layout="pageDirection">
                                    <f:selectItems value="#{inpatientEmailComposeController.encounterUploads}"
                                                   var="u" itemLabel="#{u.fileName}" itemValue="#{u}" />
                                </p:selectManyCheckbox>
                            </h:panelGroup>

                            <h:panelGroup layout="block" styleClass="mb-3" rendered="#{not empty inpatientEmailComposeController.encounterLetters}">
                                <p:outputLabel value="Saved Letters / Diagnosis Cards" styleClass="fw-bold d-block" />
                                <p:selectManyCheckbox value="#{inpatientEmailComposeController.selectedLetters}" layout="pageDirection">
                                    <f:selectItems value="#{inpatientEmailComposeController.encounterLetters}"
                                                   var="l" itemLabel="#{l.stringValue}" itemValue="#{l}" />
                                </p:selectManyCheckbox>
                            </h:panelGroup>

                            <h:panelGroup layout="block" styleClass="mb-3" rendered="#{not empty inpatientEmailComposeController.encounterForms}">
                                <p:outputLabel value="Filled Forms" styleClass="fw-bold d-block" />
                                <p:selectManyCheckbox value="#{inpatientEmailComposeController.selectedForms}" layout="pageDirection">
                                    <f:selectItems value="#{inpatientEmailComposeController.encounterForms}"
                                                   var="f" itemLabel="#{f.designComponent.name}" itemValue="#{f}" />
                                </p:selectManyCheckbox>
                            </h:panelGroup>

                            <h:panelGroup layout="block">
                                <p:outputLabel value="Attach a File" styleClass="fw-bold d-block" />
                                <p:fileUpload id="fuManualAttachment"
                                             value="#{inpatientEmailComposeController.manualAttachment}"
                                             mode="simple"
                                             skinSimple="true"
                                             sizeLimit="10240000"
                                             label="Choose File"
                                             class="w-100" />
                            </h:panelGroup>
                        </p:panel>

                        <div class="d-flex justify-content-end">
                            <p:commandButton
                                value="Send Mail"
                                icon="fa fa-paper-plane"
                                ajax="false"
                                class="ui-button-success"
                                action="#{inpatientEmailComposeController.sendEmail()}">
                            </p:commandButton>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <p:panel header="Admission">
                            <table style="border: none; border-collapse: collapse; width:100%;">
                                <tr>
                                    <td style="padding: 4px 12px 4px 0; white-space: nowrap; font-weight: 600;">Patient</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{inpatientEmailComposeController.patientEncounter.patient.person.nameWithTitle}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 12px 4px 0; white-space: nowrap; font-weight: 600;">BHT No</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{inpatientEmailComposeController.patientEncounter.bhtNo}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 12px 4px 0; white-space: nowrap; font-weight: 600;">Date of Admission</td>
                                    <td style="padding: 4px 0;">
                                        <h:outputText value="#{inpatientEmailComposeController.patientEncounter.dateOfAdmission}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm" />
                                        </h:outputText>
                                    </td>
                                </tr>
                                <tr rendered="#{inpatientEmailComposeController.currentEncounterCreditCompany ne null}">
                                    <td style="padding: 4px 12px 4px 0; white-space: nowrap; font-weight: 600;">Credit Company</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{inpatientEmailComposeController.currentEncounterCreditCompany.institution.name}" /></td>
                                </tr>
                            </table>
                        </p:panel>
                    </div>
                </div>
            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
