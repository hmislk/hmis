<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/inward/bill"
      xmlns:bic="http://xmlns.jcp.org/jsf/composite/bill"
      >

    <h:body>

        <ui:composition template="/payments/pay_index.xhtml">

            <ui:define name="admin">

                <h:panelGroup rendered="#{!inwardStaffPaymentBillController.printPreview}" styleClass="alignTop" >

                    <p:panel header="Inward Professional Payment" >
                        <h:form>
                            <h:panelGrid columns="5" class="w-100">
                                <p:outputLabel 
                                    value="From" />
                                <p:calendar 
                                    value="#{inwardStaffPaymentBillController.fromDate}" 
                                    id="fDate" 
                                    class="w-100 m-1" 
                                    inputStyleClass="w-100"                                                  
                                    navigator="true" 
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}"  />
                                <p:spacer 
                                    width="50" >
                                </p:spacer>
                                <p:outputLabel 
                                    value="To" />
                                <p:calendar 
                                    value="#{inwardStaffPaymentBillController.toDate}" 
                                    id="tDate" 
                                    class="w-100 m-1" 
                                    inputStyleClass="w-100" 
                                    navigator="true" 
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}"  />


                                <h:outputLabel 
                                    value="Speciality" ></h:outputLabel>
                                <p:autoComplete 
                                    forceSelection="true" 
                                    onfocus="this.select()"
                                    value="#{inwardStaffPaymentBillController.speciality}"
                                    inputStyleClass="w-100" 
                                    class="m-1 w-100"
                                    id="acSpeciality"
                                    completeMethod="#{specialityController.completeSpeciality}" 
                                    var="mysp" itemLabel="#{mysp.name}" itemValue="#{mysp}"
                                    >
                                    <f:ajax 
                                        event="itemSelect" 
                                        execute="acSpeciality" 
                                        render="scStaff"  />
                                </p:autoComplete>
                                <p:spacer 
                                    width="50" ></p:spacer>
                                <h:outputLabel 
                                    value="Professional" ></h:outputLabel>
                                <p:autoComplete 
                                    forceSelection="true" 
                                    onfocus="this.select()"
                                    value="#{inwardStaffPaymentBillController.currentStaff}"
                                    inputStyleClass="w-100" class="m-1 w-100"
                                    id="scStaff"
                                    completeMethod="#{inwardStaffPaymentBillController.completeStaff}"
                                    var="mys" 
                                    itemLabel="#{mys.person.nameWithTitle}" 
                                    itemValue="#{mys}"
                                    >
                                </p:autoComplete>
                            </h:panelGrid>


                            <p:commandButton 
                                value="Find Due Payments" 
                                action="#{inwardStaffPaymentBillController.calculateDueFeesForInwardForSelectedPeriod()}" 
                                ajax="false" 
                                icon="fa-solid fa-arrows-rotate"
                                class="ui-button-warning" />

                            <p:commandButton
                                ajax="false"
                                value="Download as Excel"
                                icon="fa-solid fa-file-excel"
                                title="Download the due payments as an Excel file"
                                styleClass="noPrintButton ui-button-success mx-2 my-2" >
                                <p:dataExporter type="xlsx" target=":#{p:resolveFirstComponentWithId('tblFee',view).clientId}" fileName="Staff_Payment_Due_Inward"  />
                            </p:commandButton>



                            <p:dataTable
                                id="tblFee"
                                value="#{inwardStaffPaymentBillController.dueBillFees}"
                                selection="#{inwardStaffPaymentBillController.payingBillFees}"
                                styleClass="p-datatable-sm"
                                class="w-100 m-1"
                                rows="10"
                                paginator="true"
                                paginatorPosition="bottom"
                                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                rowsPerPageTemplate="10,20,50,{ShowAll|'All'}"
                                var="bf" 
                                rowKey="#{bf.id}" >

                                <p:ajax  event="rowSelectCheckbox" process="tblFee" listener="#{inwardStaffPaymentBillController.onSelectionChanged()}"
                                         update=":#{p:resolveFirstComponentWithId('pTotals',view).clientId} :#{p:resolveFirstComponentWithId('pnlHoldOverride',view).clientId}"  />

                                <p:ajax  event="rowUnselectCheckbox" process="tblFee" listener="#{inwardStaffPaymentBillController.onSelectionChanged()}"
                                         update=":#{p:resolveFirstComponentWithId('pTotals',view).clientId} :#{p:resolveFirstComponentWithId('pnlHoldOverride',view).clientId}"  />

                                <p:ajax  event="toggleSelect" process="tblFee" listener="#{inwardStaffPaymentBillController.onSelectionChanged()}"
                                         update=":#{p:resolveFirstComponentWithId('pTotals',view).clientId} :#{p:resolveFirstComponentWithId('pnlHoldOverride',view).clientId}"  />

                                <p:column selectionBox="true" width="20"></p:column>

                                <p:column headerText="Bill Date">
                                    <f:facet name="header">
                                        <h:outputLabel value="Bill Date"/>
                                    </f:facet>    
                                    <h:outputLabel value="#{bf.bill.createdAt}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateTimeFormat}" />
                                    </h:outputLabel>
                                </p:column>

                                <p:column headerText="Patient">
                                    <f:facet name="header">
                                        <h:outputLabel value="Patient"/>
                                    </f:facet>    
                                    <h:outputLabel value="#{bf.bill.patient.person.nameWithTitle}" rendered="#{bf.bill.patientEncounter eq null}"/>                                    
                                    <h:outputLabel value="#{bf.bill.patientEncounter.patient.person.nameWithTitle}"/>                                    
                                </p:column>

                                <p:column headerText="BHT No" filterBy="#{bf.bill.patientEncounter.bhtNo}" filterMatchMode="contains">
                                    <f:facet name="header">
                                        <h:outputLabel value="BHT No"/>
                                    </f:facet>
                                    <h:outputLabel value="#{bf.bill.patientEncounter.bhtNo}">
                                    </h:outputLabel>
                                </p:column>

                                <p:column headerText="Charge" width="7em;" class="text-end">
                                    <f:facet name="header">
                                        <h:outputLabel value="Charge"/>
                                    </f:facet>
                                    <h:outputLabel value="#{bf.feeValue}" >
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                </p:column>

                                <p:column headerText="Amount to Pay" width="9em;" class="text-end">
                                    <f:facet name="header">
                                        <h:outputLabel value="Amount to Pay"/>
                                    </f:facet>
                                    <p:inputNumber value="#{bf.payingAmount}" decimalPlaces="2" class="w-100">
                                        <p:ajax event="blur" process="@this"
                                                listener="#{inwardStaffPaymentBillController.onSelectionChanged()}"
                                                update=":#{p:resolveFirstComponentWithId('pTotals',view).clientId} :#{p:resolveFirstComponentWithId('pnlHoldOverride',view).clientId}" />
                                    </p:inputNumber>
                                </p:column>

                                <p:column headerText="Hold Status" width="14em;">
                                    <f:facet name="header">
                                        <h:outputLabel value="Hold Status"/>
                                    </f:facet>
                                    <h:panelGroup layout="block" rendered="#{bf.professionalPaymentHeld}">
                                        <span class="ui-tag ui-tag-danger"
                                              title="#{bf.professionalPaymentHoldDetails}">#{bf.professionalPaymentHoldStatus}</span>
                                    </h:panelGroup>
                                    <h:panelGroup layout="block" rendered="#{not bf.professionalPaymentHeld}">
                                        <span class="ui-tag ui-tag-success">Payable</span>
                                    </h:panelGroup>
                                </p:column>

                            </p:dataTable>

                            <!-- Professional payment hold: block, or require an explicit override (#22483) -->
                            <h:panelGroup id="pnlHoldOverride" layout="block">
                                <h:panelGroup layout="block" rendered="#{inwardStaffPaymentBillController.selectionContainsHeldFees}">
                                    <p:panel styleClass="w-100 m-1 ui-state-error">
                                        <f:facet name="header">
                                            <h:outputLabel value="Professional Payments On Hold Selected" />
                                        </f:facet>

                                        <h:outputText
                                            value="#{inwardStaffPaymentBillController.heldFeesSelected.size()} of the selected professional payment(s) are on hold (#{inwardStaffPaymentBillController.heldFeesSelectedBhtNumbers})."
                                            styleClass="fw-bold" />

                                        <h:panelGroup layout="block" styleClass="mt-2"
                                                      rendered="#{not inwardStaffPaymentBillController.canOverrideHold}">
                                            <h:outputText value="These payments cannot be settled. Release the hold first, or ask a user with the 'Pay Professional Fees While On Hold' privilege." />
                                        </h:panelGroup>

                                        <h:panelGroup layout="block" styleClass="mt-2"
                                                      rendered="#{inwardStaffPaymentBillController.canOverrideHold}">
                                            <p:selectBooleanCheckbox
                                                id="chkHoldOverride"
                                                widgetVar="chkHoldOverride"
                                                value="#{inwardStaffPaymentBillController.holdOverrideAcknowledged}"
                                                itemLabel="I am authorised to pay these professional payments while they are on hold" />
                                            <p:outputLabel for="txtHoldOverrideReason" value="Reason for the override" styleClass="d-block mt-2 fw-bold" />
                                            <p:inputTextarea
                                                id="txtHoldOverrideReason"
                                                widgetVar="txtHoldOverrideReason"
                                                value="#{inwardStaffPaymentBillController.holdOverrideReason}"
                                                class="w-100"
                                                autoResize="true"
                                                rows="2"
                                                placeholder="Why is this held payment being paid now? Recorded on the payment bill and in the admission's audit trail." />
                                        </h:panelGroup>
                                    </p:panel>
                                </h:panelGroup>
                            </h:panelGroup>

                            <p:panel   >
                                <f:facet name="header">
                                    <div class="d-flex justify-content-between align-items-center w-100">
                                        <h:outputLabel value="Payment Details" />
                                        <p:commandButton
                                            id="btnPay"
                                            ajax="false"
                                            value="Settle Professional Payment"
                                            icon="fas fa-check-circle"
                                            style="min-width:120px"
                                            class="ui-button-success"
                                            action="#{inwardStaffPaymentBillController.settle()}"
                                            actionListener="#{inwardStaffPaymentBillController.performCalculations()}">
                                        </p:commandButton>
                                    </div>
                                    <p:defaultCommand target="btnPay"/>
                                </f:facet>


                                <div class="row" >
                                    <div class="col " >
                                        <p:panelGrid columns="2" layout="tabular" class="w-100" columnClasses="text-left, text-end">
                                            <h:outputLabel value="WHT Calculation" ></h:outputLabel>

                                            <h:panelGroup >
                                                <p:selectOneMenu 
                                                    id="mnuWht"
                                                    required="true"
                                                    class="w-100"
                                                    rendered="#{inwardStaffPaymentBillController.allowUserToSelectPayWithholdingTaxDuringProfessionalPayments}"
                                                    value="#{inwardStaffPaymentBillController.withholdingTaxCalculationStatus}">
                                                    <f:selectItem itemLabel="Select" ></f:selectItem>
                                                    <f:selectItems value="#{inwardStaffPaymentBillController.withholdingTaxCalculationStatuses}" />
                                                    <p:ajax 
                                                        process="mnuWht" 
                                                        listener="#{inwardStaffPaymentBillController.performCalculations()}"   
                                                        update=":#{p:resolveFirstComponentWithId('pTotals',view).clientId}"  />
                                                </p:selectOneMenu>
                                                <p:badge 
                                                    rendered="#{!inwardStaffPaymentBillController.allowUserToSelectPayWithholdingTaxDuringProfessionalPayments}" 
                                                    value="#{inwardStaffPaymentBillController.withholdingTaxCalculationStatus}" 
                                                    styleClass="ui-widget ui-corner-all ui-state-highlight p-badge" />
                                            </h:panelGroup>

                                            <h:outputLabel value="Payment Method" ></h:outputLabel>
                                            <p:selectOneMenu  id="cmbPay" value="#{inwardStaffPaymentBillController.paymentMethod}" class="mx-2 w-100">                                      
                                                <f:selectItems value="#{enumController.paymentMethodsWithoutCredit}"  />
                                            </p:selectOneMenu>

                                            <h:outputLabel value="Total Payment Completed for this month" ></h:outputLabel>
                                            <h:outputLabel id="lblPayDoneForThisMonth"  value="#{inwardStaffPaymentBillController.totalPaidForCurrentProfessionalForCurrentMonthForCurrentInstitute}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                            <h:outputLabel value="Withholding Cutoff" ></h:outputLabel>
                                            <h:outputLabel id="lblWhtCuroff"  value="#{inwardStaffPaymentBillController.withholdingTaxLimit}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                            <h:outputLabel value="Withholding Percentage" ></h:outputLabel>
                                            <h:outputLabel id="lblWhtPercentage"  value="#{inwardStaffPaymentBillController.withholdingTaxPercentage}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                        </p:panelGrid>
                                    </div>
                                    <div class="col" >
                                        <p:panelGrid 
                                            id="pTotals"
                                            columns="2" layout="tabular" class="w-100" columnClasses="text-left, text-end">
                                            <h:outputLabel value="Total Due (Payable)" ></h:outputLabel>
                                            <h:outputLabel id="lblDue" value="#{inwardStaffPaymentBillController.totalDue}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                            <h:outputLabel value="Total On Hold" styleClass="text-danger" ></h:outputLabel>
                                            <h:outputLabel id="lblOnHold" value="#{inwardStaffPaymentBillController.totalOnHold}" styleClass="text-danger" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                            <h:outputLabel value="Paying This time" ></h:outputLabel>
                                            <h:outputLabel id="lblPay"  value="#{inwardStaffPaymentBillController.totalPaying}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel> 
                                            <h:outputLabel value="Withholding Tax" ></h:outputLabel>
                                            <h:outputLabel id="lblTax" value="#{inwardStaffPaymentBillController.withholdingTax}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                            <h:outputLabel value="Paying This time withot WHT" ></h:outputLabel>
                                            <h:outputLabel id="lblPayWithTax"  value="#{inwardStaffPaymentBillController.totalPayingWithoutWht}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel> 

                                        </p:panelGrid>
                                    </div>
                                </div>
                            </p:panel>

                        </h:form>

                    </p:panel>

                </h:panelGroup>

                <h:form id="frmPaymentPreview">

                    <p:panel rendered="#{inwardStaffPaymentBillController.printPreview}">
                        <f:facet name="header" >
                            <div class="d-flex justify-content-between align-items-center w-100">
                                <h:outputLabel value="Payment Bill View" />
                                <div class="d-flex gap-2 align-items-center">
                                    <p:commandButton
                                        id="btnPaperSettings"
                                        value="Settings"
                                        icon="fas fa-cog"
                                        class="ui-button-secondary"
                                        title="Choose the paper type of the payment vouchers"
                                        rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false) and webUserController.hasPrivilege('ChangeReceiptPrintingPaperTypes')}"
                                        type="button"
                                        onclick="PF('inwardDoctorPaymentConfigDialog').show();" />
                                    <p:commandButton
                                        id="btnPrint"
                                        value="Print"
                                        icon="fa fa-print"
                                        class="ui-button-info"
                                        rendered="#{!configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false)}"
                                        ajax="false" action="#" >
                                        <p:printer target="gpBillPreview" ></p:printer>
                                    </p:commandButton>
                                    <p:commandButton
                                        id="btnPrintIndividual"
                                        value="Print Individual"
                                        icon="fa fa-print"
                                        class="ui-button-danger"
                                        rendered="#{!configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false)}"
                                        ajax="false" action="#"
                                        onclick="var done = false; var reset = function () { if (done) { return; } done = true; document.getElementById('frmPaymentPreview:btnClearAfterIndividualPrint').click(); }; window.addEventListener('afterprint', function () { setTimeout(reset, 300); }, {once: true}); setTimeout(reset, 2500);" >
                                        <p:printer target="gpIndividualPreview" ></p:printer>
                                    </p:commandButton>
                                    <p:commandButton
                                        ajax="false"
                                        value="New Bill"
                                        icon="fa fa-plus"
                                        style="min-width:120px"
                                        class="ui-button-success"
                                        action="#{inwardStaffPaymentBillController.navigateToInwardPayStaff()}"  >
                                    </p:commandButton>
                                    <!-- Clicked by Print Individual once the print dialog closes: clears the page for the next payment (#25695). -->
                                    <p:commandButton
                                        id="btnClearAfterIndividualPrint"
                                        style="display:none"
                                        ajax="false"
                                        action="#{inwardStaffPaymentBillController.navigateToViewInwardPayProfessionalPayments()}" />
                                </div>
                            </div>

                        </f:facet>

                        <!-- Bill format tabs and paper settings, like OPD Professional Payment (#25999) -->
                        <p:tabView id="tvBillFormats" dynamic="false"
                                   rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false)}">

                            <p:tab title="Detailed">
                                <p:commandButton
                                    id="btnPrintDetailed"
                                    value="Print Detailed"
                                    class="ui-button-info mb-3"
                                    icon="fas fa-print"
                                    ajax="false"
                                    action="#" >
                                    <p:printer target="gpDetailedPreview" />
                                </p:commandButton>

                                <h:panelGroup id="gpDetailedPreview" >
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                        <bi:staffBill bill="#{inwardStaffPaymentBillController.current}" dup="false" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                        <bi:staff_payment_five_five_paper_with_headings controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                        <bic:staff_payment_pos_detailed controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" dup="false" />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </p:tab>

                            <p:tab title="Summarised">
                                <p:commandButton
                                    id="btnPrintSummarised"
                                    value="Print Summarised"
                                    class="ui-button-warning mb-3"
                                    icon="fas fa-print"
                                    ajax="false"
                                    action="#" >
                                    <p:printer target="gpSummarisedPreview" />
                                </p:commandButton>

                                <h:panelGroup id="gpSummarisedPreview" >
                                    <h:panelGroup class="d-flex justify-content-center" rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                        <bic:A4PaperPaymentOPDDoctorSummarised controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" dup="false" patientFeesLabel="Inpatient Professional Fees" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                        <bic:staff_payment_five_five_summarised controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" dup="false" patientFeesLabel="Inpatient Professional Fees" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                        <bic:staff_payment_pos_summarised controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" dup="false" patientFeesLabel="Inpatient Professional Fees" />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </p:tab>

                            <p:tab title="Summary">
                                <p:commandButton
                                    id="btnPrintSummary"
                                    value="Print Summary"
                                    class="ui-button-help mb-3"
                                    icon="fas fa-print"
                                    ajax="false"
                                    action="#" >
                                    <p:printer target="gpSummaryPreview" />
                                </p:commandButton>

                                <h:panelGroup id="gpSummaryPreview" >
                                    <h:panelGroup class="d-flex justify-content-center" rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                        <bic:A4PaperPaymentOPDDoctorSummary controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" dup="false" patientFeesLabel="Inpatient Professional Fees" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                        <bic:staff_payment_five_five_summary controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" dup="false" patientFeesLabel="Inpatient Professional Fees" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                        <bic:staff_payment_pos_summary controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" dup="false" patientFeesLabel="Inpatient Professional Fees" />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </p:tab>

                            <p:tab title="Individual">
                                <!-- Clears the page after the print dialog closes, as Print Individual does without tabs (#25695). -->
                                <p:commandButton
                                    id="btnPrintIndividualTab"
                                    value="Print Individual"
                                    class="ui-button-danger mb-3"
                                    icon="fas fa-print"
                                    ajax="false"
                                    action="#"
                                    onclick="var done = false; var reset = function () { if (done) { return; } done = true; document.getElementById('frmPaymentPreview:btnClearAfterIndividualPrint').click(); }; window.addEventListener('afterprint', function () { setTimeout(reset, 300); }, {once: true}); setTimeout(reset, 2500);" >
                                    <p:printer target="gpIndividualTabPreview" />
                                </p:commandButton>

                                <h:panelGroup id="gpIndividualTabPreview" >
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is A4', true)}">
                                        <bic:staff_payment_individual_a4 controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is Five Five', false)}">
                                        <bic:staff_payment_individual_five_five controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment Tabs - Paper is POS', false)}">
                                        <bic:staff_payment_individual_pos controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" />
                                    </h:panelGroup>
                                </h:panelGroup>
                            </p:tab>

                        </p:tabView>

                        <h:panelGroup rendered="#{!configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false)}">
                            <h:panelGroup id="gpBillPreview">
                                <h:panelGroup  rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a A4 paper.', true)}">
                                    <bi:staffBill bill="#{inwardStaffPaymentBillController.current}" dup="false" />
                                </h:panelGroup>
                                
                                <h:panelGroup  rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a A4 Custom 1 paper.', false)}">
                                    <bi:staffBillCustom1 bill="#{inwardStaffPaymentBillController.current}" dup="false" />
                                </h:panelGroup>

                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a five five paper.',false)}">
                                    <bi:staff_payment_five_five_paper_with_headings controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" />
                                </h:panelGroup>
                            </h:panelGroup>

                            <!-- Individual per-BHT vouchers -->
                            <h:panelGroup id="gpIndividualPreview">
                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a A4 paper.', true)}">
                                    <bic:staff_payment_individual_a4 controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" />
                                </h:panelGroup>

                                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor payment bill is a five five paper.',false)}">
                                    <bic:staff_payment_individual_five_five controller="#{inwardStaffPaymentBillController}" bill="#{inwardStaffPaymentBillController.current}" />
                                </h:panelGroup>
                            </h:panelGroup>
                        </h:panelGroup>

                    </p:panel>
                </h:form>

                <!-- Inward Doctor Payment paper settings (#25999) -->
                <p:dialog id="inwardDoctorPaymentConfigDialog"
                          header="Inward Doctor Payment Printer Configuration"
                          widgetVar="inwardDoctorPaymentConfigDialog"
                          rendered="#{configOptionApplicationController.getBooleanValueByKey('Inward Doctor Payment - Show Bill Format Tabs and Paper Settings', false) and webUserController.hasPrivilege('ChangeReceiptPrintingPaperTypes')}"
                          modal="true"
                          width="600"
                          resizable="true"
                          closeOnEscape="true">

                    <p:ajax event="open" listener="#{pharmacyConfigController.loadCurrentConfig}" update=":#{p:resolveFirstComponentWithId('inwardDoctorPaymentCheckboxes',view).clientId}" process="@this" />

                    <h:form id="inwardDoctorPaymentConfigForm">
                        <h:panelGroup id="inwardDoctorPaymentCheckboxes" layout="block">
                            <div class="mb-3">
                                <p:selectBooleanCheckbox
                                    id="inwardDocPayA4"
                                    value="#{pharmacyConfigController.inwardDoctorPaymentTabsA4Paper}" />
                                <p:outputLabel for="inwardDocPayA4" value="A4 Paper Format" class="ms-2" />
                            </div>
                            <div class="mb-3">
                                <p:selectBooleanCheckbox
                                    id="inwardDocPayFiveFive"
                                    value="#{pharmacyConfigController.inwardDoctorPaymentTabsFiveFivePaper}" />
                                <p:outputLabel for="inwardDocPayFiveFive" value="5x5 Paper Format" class="ms-2" />
                            </div>
                            <div class="mb-3">
                                <p:selectBooleanCheckbox
                                    id="inwardDocPayPos"
                                    value="#{pharmacyConfigController.inwardDoctorPaymentTabsPosPaper}" />
                                <p:outputLabel for="inwardDocPayPos" value="POS Paper Format" class="ms-2" />
                            </div>
                        </h:panelGroup>
                        <p:messages id="inwardDoctorPaymentConfigMessages" showDetail="true" closable="true" />
                        <div class="d-flex gap-2">
                            <p:commandButton
                                value="Apply &amp; Close"
                                icon="fas fa-save"
                                class="ui-button-success"
                                ajax="false"
                                action="#{pharmacyConfigController.saveInwardDoctorPaymentTabsConfig}" />
                            <p:commandButton
                                value="Cancel"
                                icon="fas fa-times"
                                class="ui-button-secondary"
                                type="button"
                                onclick="PF('inwardDoctorPaymentConfigDialog').hide(); return false;" />
                        </div>
                    </h:form>
                </p:dialog>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
