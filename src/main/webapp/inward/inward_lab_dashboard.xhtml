<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:na="http://xmlns.jcp.org/jsf/composite/template"
      xmlns:s="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:sm="http://xmlns.jcp.org/jsf/composite/ezcomp/sample_management">
    <ui:composition template="/resources/template/template.xhtml">
        <ui:define name="content">
            <h:head>
                <style>
                    #{configOptionApplicationController.getLongTextValueByKey('CSS for Sample Container Sticker')}
                </style>
            </h:head>

            <h:panelGroup rendered="#{!webUserController.hasPrivilege('InwardLaboratory')}" >
                <na:not_authorize />
            </h:panelGroup>

            <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardLaboratory')}" >
                <div class="container-fluid" >

                    <p:panel styleClass="m-1 mb-2">
                        <f:facet name="header">
                            <div class="d-flex align-items-center w-100 flex-wrap gap-2">
                                <span><i class="fa fa-vials me-2" />Inpatient Laboratory Dashboard</span>
                                <h:form styleClass="ms-auto" rendered="#{webUserController.hasPrivilege('InwardLaboratorySampleManagement')}">
                                    <span class="d-flex align-items-center gap-2">
                                        <h:outputLabel for="ddSampleSource" value="Sample Source" />
                                        <p:selectOneMenu id="ddSampleSource" style="min-width: 220px;" value="#{patientInvestigationController.sampleSearchStrategy}">
                                            <f:selectItem itemLabel="All Samples"/>
                                            <f:selectItem itemValue="INTERNAL_ONLY" itemLabel="Internal Samples Only"/>
                                            <f:selectItem itemValue="EXTERNAL_ONLY" itemLabel="Outsource Samples Only"/>
                                            <p:ajax process="@this" />
                                        </p:selectOneMenu>
                                    </span>
                                </h:form>
                            </div>
                        </f:facet>

                        <h:form >
                            <div class="row my-2" >
                                <div class="col-10" >
                                    <h:panelGrid columns="6" class="w-100" style="font-weight: bolder">
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="From Date"/>
                                            <p:datePicker inputStyleClass="w-100" id="fromDate" showTime="true" value="#{patientInvestigationController.fromDate}" class="w-100" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="To Date"/>
                                            <p:datePicker id="toDate" inputStyleClass="w-100" showTime="true" value="#{patientInvestigationController.toDate}" class="w-100" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="BHT Number"/>
                                            <p:inputText class="w-100" value="#{inwardLaboratoryController.bhtNumber}"/>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Bill Number"/>
                                            <p:inputText class="w-100" value="#{inwardLaboratoryController.billNumber}"/>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Status"/>
                                            <p:selectOneMenu filter="true" filterMatchMode="contains" class="w-100" style="max-width:100%;" value="#{patientInvestigationController.patientInvestigationStatus}">
                                                <f:selectItem itemLabel="Any" />
                                                <f:selectItems value="#{enumController.patientInvestigationStatuses}" var="pis" itemValue="#{pis}" itemLabel="#{pis.label}"/>
                                            </p:selectOneMenu>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Investigation"/>
                                            <p:inputText class="w-100" value="#{patientInvestigationController.investigationName}"/>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Sample Id"/>
                                            <p:inputText class="w-100" value="#{patientInvestigationController.sampleId}"/>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Patient Name"/>
                                            <p:inputText class="w-100" value="#{patientInvestigationController.patientName}"/>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Specimen"/>
                                            <p:selectOneMenu
                                                class="w-100"
                                                value="#{patientInvestigationController.specimen}"
                                                filter="true"
                                                filterMatchMode="contains">
                                                <f:selectItem itemLabel="Any" />
                                                <f:selectItems value="#{sampleController.items}" var="s" itemLabel="#{s.name}" itemValue="#{s}"/>
                                            </p:selectOneMenu>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Priority"/>
                                            <p:selectOneMenu
                                                class="w-100"
                                                filter="true"
                                                filterMatchMode="contains"
                                                value="#{patientInvestigationController.priority}">
                                                <f:selectItem itemLabel="Any" />
                                                <f:selectItems value="#{enumController.priorities}" var="p" itemLabel="#{p.displayName}" itemValue="#{p}"/>
                                            </p:selectOneMenu>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Ordered Institution"/>
                                            <p:autoComplete
                                                class="w-100"
                                                id="acOins"
                                                value="#{patientInvestigationController.orderedInstitution}"
                                                inputStyleClass="w-100"
                                                maxResults="15"
                                                completeMethod="#{institutionController.completeIns}"
                                                var="oi"
                                                itemLabel="#{oi.name}"
                                                itemValue="#{oi}">
                                                <p:ajax process="acOins" update="gpOdept" ></p:ajax>
                                            </p:autoComplete>
                                        </h:panelGrid>
                                        <h:panelGrid columns="1" class="w-100">
                                            <h:outputLabel class="w-100" value="Ordered Department"/>
                                            <h:panelGroup id="gpOdept">
                                                <p:selectOneMenu
                                                    value="#{patientInvestigationController.orderedDepartment}"
                                                    filter="true"
                                                    filterMatchMode="contains"
                                                    class="w-100"
                                                    style="max-width: 100%">
                                                    <f:selectItem itemLabel="Any"></f:selectItem>
                                                    <f:selectItems value="#{inwardLaboratoryController.inwardTypeDepartments}" var="odpt" itemLabel="#{odpt.name}" itemValue="#{odpt}"></f:selectItems>
                                                </p:selectOneMenu>
                                            </h:panelGroup>
                                        </h:panelGrid>

                                    </h:panelGrid>
                                </div>
                                <div class="col-2">
                                    <h:panelGrid columns="1" class="w-100">

                                        <p:commandButton
                                            ajax="false"
                                            rendered="#{webUserController.hasPrivilege('InwardLaboratoryBarcodeGeneration')}"
                                            action="#{inwardLaboratoryController.searchInwardLabBills}"
                                            value="Bills"
                                            icon="fas fa-file-invoice-dollar"
                                            styleClass="m-1 ui-button-success w-100">
                                        </p:commandButton>

                                        <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardLaboratorySampleManagement')}">
                                            <hr/>

                                            <p:commandButton
                                                ajax="false"
                                                action="#{inwardLaboratoryController.searchPatientSamples}"
                                                value="Samples"
                                                icon="fas fa-vial"
                                                styleClass="m-1 ui-button-warning w-100">
                                            </p:commandButton>
                                        </h:panelGroup>

                                        <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardLaboratoryReportSearch')}">
                                            <hr/>

                                            <p:commandButton
                                                ajax="false"
                                                action="#{inwardLaboratoryController.searchPatientReports}"
                                                value="Reports"
                                                icon="fas fa-file-medical"
                                                styleClass="m-1 ui-button-danger w-100">
                                            </p:commandButton>
                                        </h:panelGroup>

                                        <hr/>

                                        <p:commandButton
                                            ajax="false"
                                            action="#{patientInvestigationController.clearFilters}"
                                            value="Clear"
                                            icon="fas fa-eraser"
                                            styleClass="m-1 ui-button-secondary w-100">
                                        </p:commandButton>

                                    </h:panelGrid>
                                </div>
                            </div>

                        </h:form>

                        <h:form >
                            <div class="row" >
                                <div class="col-10 w-80" >

                                    <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardLaboratoryBarcodeGeneration')}">
                                        <!--BILLS-->
                                        <sm:sm_bills/>

                                        <!--BILL_BARCODES-->
                                        <sm:sm_barCodes/>

                                        <!--INDIVIDUAL_BARCODES-->
                                        <sm:sm_individual_barcode/>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardLaboratorySampleManagement')}">
                                        <!--PATIENT_SAMPLES-->
                                        <sm:sm_samples/>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardLaboratoryReportSearch')}">
                                        <!--PATIENT_REPORTS-->
                                        <sm:sm_reports/>
                                    </h:panelGroup>

                                </div>

                                <div class="col-2" >
                                    <h:panelGrid columns="1" class="w-100" rendered="#{webUserController.hasPrivilege('InwardLaboratorySampleManagement')}">

                                        <hr/>

                                        <p:commandButton
                                            disabled="#{patientInvestigationController.listingEntity ne 'PATIENT_SAMPLES'}"
                                            id="btnCreateSamples"
                                            value="Re-Generate Samples"
                                            ajax="false"
                                            action="#{inwardLaboratoryController.reGenerateSampleForRejectSamples()}"
                                            title="Re-Generate Samples"
                                            icon="pi pi-plus-circle"
                                            styleClass="w-100 ui-button-success" >
                                        </p:commandButton>

                                        <hr/>

                                        <p:commandButton
                                            disabled="#{patientInvestigationController.listingEntity ne 'PATIENT_SAMPLES'}"
                                            id="btnCollectSamples"
                                            value="Collect Samples"
                                            ajax="false"
                                            action="#{inwardLaboratoryController.collectSamples()}"
                                            title="Collect Samples"
                                            icon="pi pi-plus-circle"
                                            styleClass="w-100 ui-button-primary" >
                                        </p:commandButton>

                                        <hr/>

                                        <p:autoComplete
                                            completeMethod="#{staffController.completeStaff}"
                                            value="#{patientInvestigationController.sampleTransportedToLabByStaff}"
                                            disabled="#{patientInvestigationController.listingEntity ne 'PATIENT_SAMPLES'}"
                                            var="mys"
                                            class="w-100"
                                            maxResults="25"
                                            placeholder="Sample Transporter"
                                            inputStyleClass="form-control"
                                            itemLabel="#{mys.person.nameWithTitle}"
                                            itemValue="#{mys}">
                                            <p:column headerText="Code" style="padding: 6px; width: 20px;">#{mys.code}</p:column>
                                            <p:column headerText="Name" style="padding: 6px; width: 250px;">#{mys.person.nameWithTitle}</p:column>
                                        </p:autoComplete>

                                        <p:commandButton
                                            disabled="#{patientInvestigationController.listingEntity ne 'PATIENT_SAMPLES'}"
                                            id="btnSendToLab"
                                            value="Send to Lab"
                                            ajax="false"
                                            action="#{inwardLaboratoryController.sendSamplesToLab()}"
                                            title="Send to Lab"
                                            icon="pi pi-external-link"
                                            styleClass="w-100 ui-button-warning" >
                                        </p:commandButton>

                                        <hr/>

                                        <p:inputText
                                            class="w-100"
                                            disabled="#{patientInvestigationController.listingEntity ne 'PATIENT_SAMPLES'}"
                                            placeholder="Sample Reject Reason"
                                            value="#{patientInvestigationController.sampleRejectionComment}" >
                                        </p:inputText>

                                        <h:panelGrid columns="3" class="my-2">
                                            <p:toggleSwitch
                                                value="#{patientInvestigationController.requestReCollected}"
                                                onIcon="pi pi-check"
                                                offIcon="pi pi-times"
                                                disabled="#{patientInvestigationController.listingEntity ne 'PATIENT_SAMPLES'}">
                                            </p:toggleSwitch>
                                            <p:spacer width="20"/>
                                            <h:outputLabel value="Request Re-Collect Sample"/>
                                        </h:panelGrid>

                                        <p:commandButton
                                            disabled="#{patientInvestigationController.listingEntity ne 'PATIENT_SAMPLES'}"
                                            id="btnRejectSamples"
                                            value="Reject Samples"
                                            ajax="false"
                                            action="#{inwardLaboratoryController.rejectSamples()}"
                                            title="Reject Samples"
                                            icon="pi pi-times-circle"
                                            styleClass="w-100 ui-button-danger" >
                                        </p:commandButton>

                                        <hr/>

                                    </h:panelGrid>
                                </div>

                            </div>
                        </h:form>
                    </p:panel>

                </div>
            </h:panelGroup>
        </ui:define>
    </ui:composition>
</html>
