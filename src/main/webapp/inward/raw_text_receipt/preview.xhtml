<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html">

    <!-- Approximate preview of the Raw Text (.prn) receipt: the same text without printer codes.
         Params: bill, headingType (BillTypeAtomic name), duplicate (boolean), layoutDept (Department). -->
    <div class="text-center text-muted" style="font-size: 0.8em;">Approximate preview of the dot-matrix print</div>
    <div class="d-flex justify-content-center my-2">
        <pre style="font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.25;
                    background: #fff; color: #000; border: 1px dashed #999; padding: 8px 12px; margin: 0;
                    width: max-content; max-width: 100%; overflow-x: auto; white-space: pre;"
             title="Approximate preview - the printer's own font and line spacing decide the final look"><h:outputText
                value="#{inwardRawTextReceiptController.previewText(bill, headingType, duplicate, layoutDept)}"/></pre>
    </div>
</ui:composition>
