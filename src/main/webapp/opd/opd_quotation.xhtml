<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form id="quotationForm">
                    <h:outputText value="You do not have privilege to create quotations." rendered="#{not opdQuotationController.allowed}"/>
                    <p:panel id="pnlQuotation" rendered="#{opdQuotationController.allowed and opdQuotationController.draft ne null}">
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center w-100">
                                <!-- LEFT: title -->
                                <div class="d-flex align-items-center gap-2">
                                    <h:outputText styleClass="fa fa-file-invoice"/>
                                    <h:outputText value="New OPD Quotation"/>
                                </div>
                                <!-- CENTER: navigation -->
                                <div class="d-flex gap-2">
                                    <p:commandButton value="Search Quotations" icon="fa fa-search" ajax="false" immediate="true"
                                                     title="Find and reprint saved quotations"
                                                     action="#{opdQuotationController.navigateToSearchQuotations()}"
                                                     styleClass="ui-button-info ui-button-outlined"/>
                                </div>
                                <!-- RIGHT: actions, least to most important -->
                                <div class="d-flex gap-2 align-items-center">
                                    <p:commandButton value="Clear" icon="fa fa-eraser" ajax="false" immediate="true"
                                                     title="Start again with an empty quotation"
                                                     action="#{opdQuotationController.navigateToNewQuotation()}"
                                                     styleClass="ui-button-secondary"/>
                                    <p:commandButton id="btnSave" value="Save Quotation" icon="fa fa-save" ajax="false"
                                                     title="Save the quotation and open it for printing"
                                                     action="#{opdQuotationController.save()}"
                                                     style="min-width:120px"
                                                     styleClass="ui-button-success"/>
                                </div>
                            </div>
                        </f:facet>

                        <p:messages id="msgs" showDetail="false" closable="true"/>

                        <p:panelGrid columns="4" layout="tabular" styleClass="w-100 my-2">
                            <p:outputLabel for="acPatient" value="Patient (optional)"/>
                            <p:autoComplete id="acPatient" styleClass="w-100" inputStyleClass="form-control"
                                            value="#{opdQuotationController.draft.patient}"
                                            completeMethod="#{patientController.completePatientByNameOrCode}"
                                            var="apt" itemLabel="#{apt.person.nameWithTitle}" itemValue="#{apt}"
                                            minQueryLength="3" forceSelection="true" scrollHeight="300"
                                            placeholder="Search a registered patient, or type the name below">
                                <p:ajax event="itemSelect" process="@this" listener="#{opdQuotationController.patientSelected}"
                                        update="customerName customerPhone foreigner lines totals"/>
                                <p:column headerText="Name">
                                    <h:outputText value="#{apt.person.nameWithTitle}"/>
                                </p:column>
                                <p:column headerText="Phone">
                                    <h:outputText value="#{apt.person.mobile}"/>
                                </p:column>
                                <p:column headerText="Code">
                                    <h:outputText value="#{apt.code}"/>
                                </p:column>
                            </p:autoComplete>
                            <p:outputLabel for="validUntil" value="Valid Until"/>
                            <p:calendar id="validUntil" styleClass="w-100" inputStyleClass="w-100" pattern="dd MMM yyyy"
                                        value="#{opdQuotationController.draft.validUntil}"/>

                            <p:outputLabel for="customerName" value="Name"/>
                            <p:inputText id="customerName" styleClass="w-100" maxlength="200"
                                         value="#{opdQuotationController.draft.customerName}"/>
                            <p:outputLabel for="customerPhone" value="Phone"/>
                            <p:inputText id="customerPhone" styleClass="w-100" maxlength="50"
                                         value="#{opdQuotationController.draft.customerPhone}"/>

                            <p:outputLabel for="payMethod" value="Payment Method"/>
                            <p:selectOneMenu id="payMethod" styleClass="w-100"
                                             value="#{opdQuotationController.draft.paymentMethod}">
                                <f:selectItems value="#{configOptionController.paymentMethodsForOpdBilling}" var="pm"
                                               itemLabel="#{pm.label}" itemValue="#{pm}"/>
                                <p:ajax event="change" process="@this" listener="#{opdQuotationController.paymentMethodChanged}"
                                        update="creditCompany lines totals"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="scheme" value="Discount Scheme"/>
                            <p:selectOneMenu id="scheme" styleClass="w-100"
                                             value="#{opdQuotationController.draft.paymentScheme}">
                                <f:selectItem itemLabel="Select Discount Scheme" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{paymentSchemeController.paymentSchemesForOPD}" var="ps"
                                               itemLabel="#{ps.name}" itemValue="#{ps}"/>
                                <p:ajax event="change" process="@this" listener="#{opdQuotationController.reprice}"
                                        update="lines totals"/>
                            </p:selectOneMenu>

                            <p:outputLabel for="creditCompany" value="Credit Company"/>
                            <p:autoComplete id="creditCompany" styleClass="w-100" inputStyleClass="form-control"
                                            value="#{opdQuotationController.draft.creditCompany}"
                                            disabled="#{opdQuotationController.draft.paymentMethod ne 'Credit'}"
                                            completeMethod="#{creditCompanyController.completeCredit}"
                                            var="cc" itemLabel="#{cc.name}" itemValue="#{cc}" forceSelection="true"
                                            placeholder="Only for credit">
                                <p:ajax event="itemSelect" process="@this" listener="#{opdQuotationController.reprice}"
                                        update="lines totals"/>
                            </p:autoComplete>
                            <p:outputLabel for="foreigner" value="Foreigner"/>
                            <p:selectBooleanCheckbox id="foreigner" value="#{opdQuotationController.draft.foreigner}">
                                <p:ajax process="@this" listener="#{opdQuotationController.reprice}" update="lines totals"/>
                            </p:selectBooleanCheckbox>

                            <p:outputLabel for="comments" value="Notes"/>
                            <p:inputText id="comments" styleClass="w-100" maxlength="250"
                                         value="#{opdQuotationController.draft.comments}"/>
                            <h:outputText/>
                            <h:outputText/>
                        </p:panelGrid>

                        <p:panelGrid columns="4" layout="tabular" styleClass="w-100 my-2">
                            <p:outputLabel for="acItem" value="Service"/>
                            <p:autoComplete id="acItem" styleClass="w-100" inputStyleClass="w-100"
                                            value="#{opdQuotationController.itemLight}"
                                            completeMethod="#{opdBillController.completeOpdItemsByWord}"
                                            var="ix" itemLabel="#{ix.name}" itemValue="#{ix}"
                                            converter="itemLightConverter" forceSelection="true" scrollHeight="250"
                                            placeholder="Type to search services">
                                <p:column headerText="Name">
                                    <h:outputText value="#{ix.name}"/>
                                </p:column>
                                <p:column headerText="Dept">
                                    <h:outputText value="#{ix.departmentName}"/>
                                </p:column>
                                <p:column headerText="Code">
                                    <h:outputText value="#{ix.code}"/>
                                </p:column>
                            </p:autoComplete>
                            <p:outputLabel for="qty" value="Quantity (only for services priced by quantity)"/>
                            <h:panelGroup styleClass="d-flex gap-2">
                                <p:inputNumber id="qty" decimalPlaces="0" minValue="1" inputStyleClass="w-100"
                                               value="#{opdQuotationController.quantity}"/>
                                <p:commandButton id="btnAdd" value="Add" icon="fa fa-plus" title="Add the service to the quotation"
                                                 process="@form" update="lines totals acItem qty msgs"
                                                 action="#{opdQuotationController.addItem()}"
                                                 styleClass="ui-button-warning"/>
                            </h:panelGroup>
                        </p:panelGrid>

                        <p:dataTable id="lines" value="#{opdQuotationController.lines}" var="l" rowIndexVar="n"
                                     styleClass="p-datatable-sm" emptyMessage="No services added">
                            <p:column headerText="#" style="width:2.5rem">
                                <h:outputText value="#{n + 1}"/>
                            </p:column>
                            <p:column headerText="Service">
                                <h:outputText value="#{l.itemName}"/>
                            </p:column>
                            <p:column headerText="Qty" styleClass="text-end" style="width:5rem">
                                <h:outputText value="#{l.quantity}">
                                    <f:convertNumber pattern="#,##0"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Gross" styleClass="text-end" style="width:8rem">
                                <h:outputText value="#{l.grossValue}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Discount" styleClass="text-end" style="width:8rem">
                                <h:outputText value="#{l.discount}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Amount" styleClass="text-end" style="width:8rem">
                                <h:outputText value="#{l.netValue}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </p:column>
                            <p:column style="width:3rem">
                                <p:commandButton icon="fa fa-trash" title="Remove this service" process="@this"
                                                 update="lines totals"
                                                 action="#{opdQuotationController.removeLine(l)}"
                                                 styleClass="ui-button-danger ui-button-outlined ui-button-sm"/>
                            </p:column>
                        </p:dataTable>

                        <h:panelGroup id="totals" layout="block" styleClass="d-flex justify-content-end gap-4 my-2">
                            <h:outputText value="Gross: "/>
                            <h:outputText value="#{opdQuotationController.draft.grossTotal}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <h:outputText value="Discount: "/>
                            <h:outputText value="#{opdQuotationController.draft.discount}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            <h:outputText value="Total: " styleClass="fw-bold"/>
                            <h:outputText value="#{opdQuotationController.draft.netTotal}" styleClass="fw-bold">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </h:panelGroup>
                        <h:outputText value="Prices are not locked. The bill uses the tariff at the time of billing."/>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
