<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Patient Complaints</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{not patientComplaintController.canHandle}">
                    You are NOT authorized
                </h:panelGroup>
                <h:form id="registerForm" rendered="#{patientComplaintController.canHandle}">
                    <p:growl id="msg" showDetail="true"/>
                    <p:panel>
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center w-100">
                                <div class="d-flex align-items-center gap-2">
                                    <h:outputText styleClass="fa fa-comment-dots"/>
                                    <h:outputText value="Patient Complaints"/>
                                    <p:commandButton value="Categories" icon="fa fa-cog" ajax="false" immediate="true"
                                                     title="Manage complaint categories"
                                                     action="#{patientComplaintCategoryController.navigateToCategories}"
                                                     rendered="#{patientComplaintCategoryController.canManage}"
                                                     styleClass="ui-button-secondary ui-button-outlined"/>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <p:commandButton value="Record Complaint" icon="fa fa-plus" ajax="false" immediate="true"
                                                     title="Record an on-site complaint"
                                                     action="#{patientComplaintController.navigateToEntry}"
                                                     rendered="#{patientComplaintController.canCreate}"
                                                     styleClass="ui-button-info ui-button-outlined"/>
                                    <p:commandButton id="btnProcess" value="Process" icon="fa fa-search" ajax="false"
                                                     title="Search complaints"
                                                     action="#{patientComplaintController.searchComplaints}"
                                                     styleClass="ui-button-success" style="min-width:120px"/>
                                </div>
                            </div>
                        </f:facet>

                        <div class="row g-2 mb-2">
                            <div class="col-md-3">
                                <p:outputLabel for="fromDate" value="From"/>
                                <p:calendar id="fromDate" styleClass="w-100" inputStyleClass="w-100"
                                            value="#{patientComplaintController.fromDate}"
                                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                            <div class="col-md-3">
                                <p:outputLabel for="toDate" value="To"/>
                                <p:calendar id="toDate" styleClass="w-100" inputStyleClass="w-100"
                                            value="#{patientComplaintController.toDate}"
                                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                            <div class="col-md-2">
                                <p:outputLabel for="status" value="Status"/>
                                <p:selectOneMenu id="status" styleClass="w-100" value="#{patientComplaintController.filterStatus}">
                                    <f:selectItem itemLabel="All" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{patientComplaintController.statuses}" var="s"
                                                   itemLabel="#{s.label}" itemValue="#{s}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="col-md-2">
                                <p:outputLabel for="category" value="Category"/>
                                <p:selectOneMenu id="category" styleClass="w-100" value="#{patientComplaintController.filterCategory}">
                                    <f:selectItem itemLabel="All" itemValue="#{null}" noSelectionOption="true"/>
                                    <f:selectItems value="#{patientComplaintController.categories}" var="c"
                                                   itemLabel="#{c.name}" itemValue="#{c}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="col-md-2">
                                <p:outputLabel for="assignee" value="Assigned to"/>
                                <p:autoComplete id="assignee" styleClass="w-100" inputStyleClass="form-control"
                                                value="#{patientComplaintController.filterAssignee}"
                                                forceSelection="true"
                                                completeMethod="#{patientComplaintController.completeHandlers}"
                                                var="u" itemLabel="#{u.webUserPerson.name}" itemValue="#{u}"
                                                placeholder="Anyone"/>
                            </div>
                        </div>

                        <p:dataTable id="complaintList" value="#{patientComplaintController.rows}" var="r"
                                     styleClass="p-datatable-sm" rowKey="#{r.id}"
                                     emptyMessage="No complaints found">
                            <p:column headerText="No" style="width:4rem">
                                <h:outputText value="#{r.id}"/>
                            </p:column>
                            <p:column headerText="Received">
                                <h:outputText value="#{r.createdAt}">
                                    <f:convertDateTime pattern="yyyy MM dd HH:mm"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Source">
                                <h:outputText value="#{r.source.label}"/>
                            </p:column>
                            <p:column headerText="Complainant">
                                <h:outputText value="#{r.complainantName}"/>
                            </p:column>
                            <p:column headerText="Category">
                                <h:outputText value="#{r.categoryName}"/>
                            </p:column>
                            <p:column headerText="Status">
                                <h:outputText value="#{r.status.label}"/>
                            </p:column>
                            <p:column headerText="Assigned to">
                                <h:outputText value="#{r.assigneeName}"/>
                            </p:column>
                            <p:column headerText="Closed">
                                <h:outputText value="#{r.closedAt}">
                                    <f:convertDateTime pattern="yyyy MM dd HH:mm"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Open" style="width:4rem">
                                <p:commandButton icon="fas fa-eye" ajax="false"
                                                 styleClass="ui-button-info ui-button-outlined ui-button-sm"
                                                 title="Open complaint #{r.id}"
                                                 action="#{patientComplaintController.viewComplaint(r.id)}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
