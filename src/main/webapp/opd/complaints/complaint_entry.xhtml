<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Record Patient Complaint</title>
    </h:head>
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{not patientComplaintController.canCreate}">
                    You are NOT authorized
                </h:panelGroup>
                <h:form id="entryForm" rendered="#{patientComplaintController.canCreate}">
                    <p:growl id="msg" showDetail="true"/>
                    <p:panel>
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center w-100">
                                <div class="d-flex align-items-center gap-2">
                                    <h:outputText styleClass="fa fa-comment-dots"/>
                                    <h:outputText value="Record Patient Complaint (On Site)"/>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <p:commandButton value="Register" icon="fa fa-list" ajax="false" immediate="true"
                                                     title="Open the complaints register"
                                                     action="#{patientComplaintController.navigateToRegister}"
                                                     rendered="#{patientComplaintController.canHandle}"
                                                     styleClass="ui-button-info ui-button-outlined"/>
                                    <p:commandButton id="btnSave" value="Save" icon="fa fa-save"
                                                     title="Save the complaint"
                                                     action="#{patientComplaintController.saveEntry}"
                                                     process="@form" update="@form"
                                                     styleClass="ui-button-success" style="min-width:120px"/>
                                </div>
                            </div>
                        </f:facet>
                        <p:panelGrid columns="2" layout="tabular" styleClass="w-100">
                            <p:outputLabel for="patient" value="Patient (if registered)"/>
                            <p:autoComplete id="patient" styleClass="w-100" inputStyleClass="form-control"
                                            value="#{patientComplaintController.entryPatient}"
                                            forceSelection="true"
                                            completeMethod="#{patientController.completePatient}"
                                            var="pt" itemLabel="#{pt.person.nameWithTitle}" itemValue="#{pt}"
                                            placeholder="Search by name, code, NIC or mobile"/>
                            <p:outputLabel for="name" value="Name (if not registered)"/>
                            <p:inputText id="name" styleClass="w-100" maxlength="255" autocomplete="off"
                                         value="#{patientComplaintController.entryName}"/>
                            <p:outputLabel for="phone" value="Phone (if not registered)"/>
                            <p:inputText id="phone" styleClass="w-100" maxlength="255" autocomplete="off"
                                         value="#{patientComplaintController.entryPhone}"/>
                            <p:outputLabel for="category" value="Category"/>
                            <p:selectOneMenu id="category" styleClass="w-100" value="#{patientComplaintController.entryCategory}">
                                <f:selectItem itemLabel="Select" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{patientComplaintController.categories}" var="c"
                                               itemLabel="#{c.name}" itemValue="#{c}"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="description" value="Complaint"/>
                            <p:inputTextarea id="description" rows="6" styleClass="w-100" maxlength="4000"
                                             value="#{patientComplaintController.entryDescription}"/>
                        </p:panelGrid>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
