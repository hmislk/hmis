<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form id="searchForm">
                    <h:outputText value="You do not have privilege to search quotations." rendered="#{not opdQuotationController.allowed}"/>
                    <p:panel rendered="#{opdQuotationController.allowed}">
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center w-100">
                                <!-- LEFT: title -->
                                <div class="d-flex align-items-center gap-2">
                                    <h:outputText styleClass="fa fa-search"/>
                                    <h:outputText value="Search OPD Quotations"/>
                                </div>
                                <!-- CENTER: navigation -->
                                <div class="d-flex gap-2">
                                    <p:commandButton value="New Quotation" icon="fa fa-plus" ajax="false" immediate="true"
                                                     title="Start a new quotation"
                                                     action="#{opdQuotationController.navigateToNewQuotation()}"
                                                     styleClass="ui-button-info ui-button-outlined"/>
                                </div>
                                <!-- RIGHT: actions -->
                                <div class="d-flex gap-2 align-items-center">
                                    <p:commandButton id="btnSearch" value="Search" icon="fa fa-search" ajax="false"
                                                     title="Find quotations"
                                                     action="#{opdQuotationController.searchQuotations()}"
                                                     style="min-width:120px"
                                                     styleClass="ui-button-success"/>
                                </div>
                            </div>
                        </f:facet>

                        <p:panelGrid columns="4" layout="tabular" styleClass="w-100 my-2">
                            <p:outputLabel for="fromDate" value="From Date"/>
                            <p:calendar id="fromDate" styleClass="w-100" inputStyleClass="w-100"
                                        value="#{opdQuotationController.fromDate}"
                                        pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            <p:outputLabel for="toDate" value="To Date"/>
                            <p:calendar id="toDate" styleClass="w-100" inputStyleClass="w-100"
                                        value="#{opdQuotationController.toDate}"
                                        pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            <p:outputLabel for="quotationNo" value="Quotation No"/>
                            <p:inputText id="quotationNo" styleClass="w-100" value="#{opdQuotationController.quotationNoFilter}"/>
                            <p:outputLabel for="keyword" value="Name or Phone"/>
                            <p:inputText id="keyword" styleClass="w-100" value="#{opdQuotationController.keywordFilter}"/>
                        </p:panelGrid>

                        <p:dataTable id="quotationList" value="#{opdQuotationController.rows}" var="r" rowKey="#{r.id}"
                                     styleClass="p-datatable-sm" emptyMessage="No quotations found"
                                     paginator="true" rows="25" paginatorPosition="bottom">
                            <p:column headerText="Quotation No">
                                <h:outputText value="#{r.quotationNo}" style="user-select:all;"/>
                            </p:column>
                            <p:column headerText="Date">
                                <h:outputText value="#{r.createdAt}">
                                    <f:convertDateTime pattern="yyyy MM dd HH:mm"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Name">
                                <h:outputText value="#{r.customerName}"/>
                            </p:column>
                            <p:column headerText="Phone">
                                <h:outputText value="#{r.customerPhone}"/>
                            </p:column>
                            <p:column headerText="Valid Until">
                                <h:outputText value="#{r.validUntil}">
                                    <f:convertDateTime pattern="yyyy MM dd"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Total" styleClass="text-end">
                                <h:outputText value="#{r.netTotal}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Prepared By">
                                <h:outputText value="#{r.createdBy}"/>
                            </p:column>
                            <p:column headerText="Open" style="width:4rem">
                                <p:commandButton icon="fa fa-eye" ajax="false"
                                                 title="Open quotation #{r.quotationNo} to print or make a bill"
                                                 action="#{opdQuotationController.viewQuotation(r.id)}"
                                                 styleClass="ui-button-info ui-button-outlined ui-button-sm"/>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
