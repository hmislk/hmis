<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>

        <ui:composition template="/cashier/index.xhtml">

            <ui:define name="subcontent">


                <h:form>
                    <p:panel  class="m-1 p-1 container-flex">
                        <f:facet name="header">
                            <p:outputLabel value="Accept Handovers" />
                        </f:facet>

                        <h:panelGroup id="gpPrint" >
                            <div class="row mx-2" >
                                <div class="col-7">
                                    <p:panelGrid layout="tabular" columns="2" class="w-100" >
                                        <f:facet name="header" >
                                            <p:outputLabel value="Shift" class="font-weight-bold" ></p:outputLabel>
                                        </f:facet>
                                        <!-- User with Icon -->
                                        <h:panelGroup>
                                            <i class="pi pi-user" style="margin-right:5px; color: #007bff;"></i>
                                            <p:outputLabel value="User" />
                                        </h:panelGroup>
                                        <p:badge value="#{financialTransactionController.bundle.user.webUserPerson.nameWithTitle}" styleClass="ui-badge-primary"></p:badge>

                                        <!-- Shift Start with Icon -->
                                        <h:panelGroup>
                                            <i class="pi pi-clock" style="margin-right:5px; color: #28a745;"></i>
                                            <p:outputLabel value="Shift Start" />
                                        </h:panelGroup>
                                        <h:panelGroup>
                                            <p:panelGrid columns="2">
                                                <h:panelGroup>
                                                    <i class="pi pi-list" style="margin-right:5px; color: #17a2b8;"></i>
                                                    <p:outputLabel value="Shift Start Bill ID" />
                                                </h:panelGroup>
                                                <h:panelGroup >
                                                    <p:outputLabel value="#{financialTransactionController.bundle.startBill.deptId}" rendered="#{financialTransactionController.bundle.startBill ne null}" />
                                                    <p:outputLabel value="#{financialTransactionController.bundle.startBill.id}" rendered="#{financialTransactionController.bundle.startBill.deptId eq null}" />
                                                </h:panelGroup>

                                                <h:panelGroup>
                                                    <i class="pi pi-calendar-plus" style="margin-right:5px; color: #ffc107;"></i>
                                                    <p:outputLabel value="Shift Started At" />
                                                </h:panelGroup>
                                                <p:outputLabel value="#{financialTransactionController.bundle.startBill.createdAt}">
                                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                                </p:outputLabel>
                                            </p:panelGrid>
                                        </h:panelGroup>

                                        <!-- Shift End with Icon -->
                                        <h:panelGroup rendered="#{financialTransactionController.bundle.endBill ne null}" >
                                            <i class="pi pi-clock" style="margin-right:5px; color: #dc3545;"></i>
                                            <p:outputLabel value="Shift End" />
                                        </h:panelGroup>
                                        <p:panelGrid columns="2" rendered="#{financialTransactionController.bundle.endBill ne null}">
                                            <h:panelGroup>
                                                <i class="pi pi-list" style="margin-right:5px; color: #17a2b8;"></i>
                                                <p:outputLabel value="Shift End Bill ID" />
                                            </h:panelGroup>
                                            <p:outputLabel value="#{financialTransactionController.bundle.endBill.deptId}" />
                                            <h:panelGroup>
                                                <i class="pi pi-calendar-minus" style="margin-right:5px; color: #ffc107;"></i>
                                                <p:outputLabel value="Shift Ended At" />
                                            </h:panelGroup>
                                            <p:outputLabel value="#{financialTransactionController.bundle.endBill.createdAt}">
                                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                            </p:outputLabel>
                                        </p:panelGrid>

                                        <!-- Total Handover Value with Icon -->
                                        <h:panelGroup>
                                            <i class="pi pi-dollar" style="margin-right:5px; color: #17a2b8;"></i>
                                            <p:outputLabel value="Total Handover Value" />
                                        </h:panelGroup>
                                        <p:outputLabel value="#{financialTransactionController.bundle.total + financialTransactionController.bundle.cashFloatNetTotal}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </p:outputLabel>

                                        <h:panelGroup rendered="#{financialTransactionController.bundle.cashFloatOutTotal gt 0}">
                                            <i class="pi pi-arrow-up" style="margin-right:5px; color: #dc3545;"></i>
                                            <p:outputLabel value="Float Sent (Cash)" />
                                        </h:panelGroup>
                                        <p:outputLabel rendered="#{financialTransactionController.bundle.cashFloatOutTotal gt 0}" value="#{financialTransactionController.bundle.cashFloatOutTotal}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </p:outputLabel>
                                    </p:panelGrid>
                                    <p:panel class="w-100 m-1" >
                                        <f:facet name="header" >
                                            <div class="row align-items-center my-2">
                                                <!-- Header Label -->
                                                <div class="col-md-4">
                                                    <span class="font-weight-bold">Accept</span>
                                                </div>
                                                <div class="col-md-8 text-right">
                                                    <p:commandButton 
                                                        rendered="#{webUserController.hasPrivilege('ShiftHandoverAcceptAsMainCashier')}" 
                                                        value="Accept Handover &amp; Write to Cashbook" 
                                                        styleClass="ui-button-success mx-1" 
                                                        icon="pi pi-check-circle" 
                                                        ajax="false" 
                                                        onclick="return confirm('Are you sure you want to proceed with the handover?');" 
                                                        action="#{financialTransactionController.acceptHandoverBillAndWriteToCashbook()}">
                                                    </p:commandButton>
                                                    <p:commandButton 
                                                        value="Reject"
                                                        action="#{financialTransactionController.rejectToReceiveHandoverBill()}"
                                                        ajax="false"
                                                        onclick="if (!confirm('Are you sure you want to Reject this record?'))
                                                                    return false;" 
                                                        class="m-1 ui-button-danger"
                                                        icon="pi pi-times-circle">
                                                    </p:commandButton>
                                                </div>
                                            </div>
                                        </f:facet>

                                        <table class="table table-bordered table-hover w-100">
                                            <!-- Table Header -->
                                            <thead class="thead-dark">
                                                <tr>
                                                    <th class="text-center">Payment Method</th>
                                                    <th class="text-center">Collected</th>
                                                </tr>
                                            </thead>
                                            <!-- Table Body -->
                                            <tbody>
                                                <!-- Cash Row (merged with Net Float when float is present) -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasCashTransaction or financialTransactionController.bundle.cashFloatNetTotal != 0}">
                                                    <tr>
                                                        <td>
                                                            <h:outputText value="Cash including Float" rendered="#{financialTransactionController.bundle.cashFloatNetTotal != 0}" />
                                                            <h:outputText value="Cash" rendered="#{financialTransactionController.bundle.cashFloatNetTotal == 0}" />
                                                        </td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.cashValue + financialTransactionController.bundle.cashFloatNetTotal}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Card Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasCardTransaction}">
                                                    <tr>
                                                        <td>Card</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.cardValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>
                                                <!-- Cheque Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasChequeTransaction}">
                                                    <tr>
                                                        <td>Cheque</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.chequeValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Slip Payment Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasSlipTransaction}">
                                                    <tr>
                                                        <td>Slip Payment</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.slipValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- e-Wallet Payment Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasEWalletTransaction}">
                                                    <tr>
                                                        <td>e-Wallet Payment</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.ewalletValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Patient Deposit Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasPatientDepositTransaction}">
                                                    <tr>
                                                        <td>Patient Deposit</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.patientDepositValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- On Call Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasOnCallTransaction}">
                                                    <tr>
                                                        <td>On Call</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.onCallValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Multiple Payment Methods Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasMultiplePaymentMethodsTransaction}">
                                                    <tr>
                                                        <td>Multiple Payment Methods</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.multiplePaymentMethodsValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Staff Credit Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasStaffTransaction}">
                                                    <tr>
                                                        <td>Staff Credit</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.staffValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Credit Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasCreditTransaction}">
                                                    <tr>
                                                        <td>Credit</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.creditValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Staff Welfare Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasStaffWelfareTransaction}">
                                                    <tr>
                                                        <td>Staff Welfare</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.staffWelfareValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Voucher Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasVoucherTransaction}">
                                                    <tr>
                                                        <td>Voucher</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.voucherValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- IOU Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasIouTransaction}">
                                                    <tr>
                                                        <td>IOU</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.iouValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Agent Payment Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasAgentTransaction}">
                                                    <tr>
                                                        <td>Agent Payment</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.agentValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Patient Points Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasPatientPointsTransaction}">
                                                    <tr>
                                                        <td>Patient Points</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.patientPointsValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                                <!-- Online Settlement Row -->
                                                <ui:fragment rendered="#{financialTransactionController.bundle.hasOnlineSettlementTransaction}">
                                                    <tr>
                                                        <td>Online Settlement</td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{financialTransactionController.bundle.onlineSettlementValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:fragment>

                                            </tbody>
                                            <tfoot>
                                                <tr class="fw-bold">
                                                    <td>Total</td>
                                                    <td class="text-end">
                                                        <h:outputText value="#{financialTransactionController.bundle.total + financialTransactionController.bundle.cashFloatNetTotal}">
                                                            <f:convertNumber pattern="#,##0.00" />
                                                        </h:outputText>
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>

                                    </p:panel>
                                </div>
                                <div class="col-5" >
                                    <h:panelGroup id="gpDenominations">
                                        <table class="table table-bordered table-sm w-100">
                                            <thead class="thead-dark">
                                                <tr>
                                                    <th>Denomination</th>
                                                    <th class="text-end">Qty</th>
                                                    <th class="text-end">Value</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <ui:repeat value="#{financialTransactionController.bundle.denominationTransactions}" var="deno">
                                                    <tr>
                                                        <td><h:outputText value="#{deno.denomination.displayName}" /></td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{deno.denominationQty}">
                                                                <f:convertNumber integerOnly="true" />
                                                            </h:outputText>
                                                        </td>
                                                        <td class="text-end">
                                                            <h:outputText value="#{deno.denominationValue}">
                                                                <f:convertNumber pattern="#,##0.00" />
                                                            </h:outputText>
                                                        </td>
                                                    </tr>
                                                </ui:repeat>
                                            </tbody>
                                            <tfoot>
                                                <tr class="fw-bold">
                                                    <td colspan="2">Total</td>
                                                    <td class="text-end">
                                                        <h:outputText value="#{financialTransactionController.bundle.denominatorValue}">
                                                            <f:convertNumber pattern="#,##0.00" />
                                                        </h:outputText>
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </h:panelGroup>
                                </div>
                            </div>
                            <div class="row mx-2" >
                                <div class="col-12" >



                                    <p:commandButton 
                                        value="Download" 
                                        class="m-1 ui-button-success" 
                                        icon="pi pi-download" 
                                        ajax="false">
                                        <p:dataExporter target="tblCashier" type="xlsx" fileName="all_handover_values"></p:dataExporter>
                                    </p:commandButton>

                                    <p:dataTable 
                                        emptyMessage="No Financial Transactions to Handover"
                                        paginatorAlwaysVisible="false"
                                        value="#{financialTransactionController.bundle.bundles}" 
                                        var="summary"
                                        paginator="true" 
                                        id="tblCashier"
                                        paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                                        currentPageReportTemplate="(Page {currentPage} of {totalPages})"
                                        paginatorPosition="top"
                                        rowsPerPageTemplate="10,20,50,100,{ShowAll|'All'}"
                                        rows="100000"
                                        >

                                        <p:column headerText="Institution / Type" >
                                            <h:outputText value="#{summary.department.institution.name}" rendered="#{!summary.floatRow and (summary.paymentHandover == null or summary.paymentHandover.name() != 'FLOATS')}" />
                                            <h:outputText value="Shift Shortage"    rendered="#{summary.paymentHandover ne null and summary.paymentHandover.name() eq 'FLOATS'}" style="color:#dc3545; font-style:italic;" />
                                            <h:outputText value="Float Sent (Cash)" rendered="#{summary.floatRow and summary.paymentHandover ne null and summary.paymentHandover.name() eq 'FLOAT_OUT'}" style="color:#dc3545; font-style:italic;" />
                                            <h:outputText value="Net Float (Cash)"  rendered="#{summary.floatRow and summary.paymentHandover ne null and summary.paymentHandover.name() eq 'FLOAT_IN'}"  style="color:#198754; font-style:italic;" />
                                        </p:column>

                                        <p:column headerText="Site"  rendered="#{configOptionApplicationController.getBooleanValueByKey('Sites are Managed',true)}" >
                                            <h:outputText value="#{summary.department.site.name}" rendered="#{!summary.floatRow}" />
                                        </p:column>

                                        <p:column headerText="Department" >
                                            <h:outputText value="#{summary.department.name}" rendered="#{!summary.floatRow}" />
                                        </p:column>

                                        <p:column headerText="Date" >
                                            <h:outputText value="#{summary.date}" rendered="#{!summary.floatRow}">
                                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" />
                                            </h:outputText>
                                        </p:column>

                                        <p:column headerText="Cash"
                                                  class="text-end"
                                                  rendered="#{financialTransactionController.bundle.hasCashTransaction}" >
                                            <h:outputText value="#{summary.cashValue}"  style="text-align: right;">
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <f:facet name="footer" >
                                                <p:outputLabel value="#{financialTransactionController.bundle.cashValue + financialTransactionController.bundle.cashFloatNetTotal}" >
                                                    <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                                </p:outputLabel>
                                            </f:facet>

                                        </p:column>

                                        <p:column 
                                            class="text-end"
                                            headerText="Card" 
                                            rendered="#{financialTransactionController.bundle.hasCardTransaction}" >
                                            <h:outputText value="#{summary.cardValue}" >
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <p:commandButton
                                                icon="pi pi-list"
                                                title="View Payments"
                                                ajax="false"
                                                styleClass="ui-button-info m-1 mx-2"
                                                action="#{financialTransactionController.navigateToSelectPaymentsForHandoverAccept(summary, 'Card')}" >
                                            </p:commandButton>
                                            <f:facet name="footer">
                                                <h:outputText value="#{financialTransactionController.bundle.cardValue}">
                                                    <f:convertNumber pattern="#,##0.00" />
                                                </h:outputText>
                                            </f:facet>
                                        </p:column>

                                        <p:column headerText="Multiple Payment Methods" 
                                                  rendered="#{financialTransactionController.bundle.hasMultiplePaymentMethodsTransaction}" >
                                            <h:outputText value="#{summary.multiplePaymentMethodsValue}" >
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <f:facet name="footer">
                                                <h:outputText value="#{financialTransactionController.bundle.multiplePaymentMethodsValue}">
                                                    <f:convertNumber pattern="#,##0.00" />
                                                </h:outputText>
                                            </f:facet>
                                        </p:column>

                                        <p:column headerText="Credit"
                                                  class="text-end"
                                                  rendered="#{financialTransactionController.bundle.hasCreditTransaction}" >
                                            <h:outputText value="#{summary.creditValue}" >
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <p:commandButton
                                                icon="pi pi-list"
                                                title="View Payments"
                                                ajax="false"
                                                styleClass="ui-button-info m-1 mx-2"
                                                action="#{financialTransactionController.navigateToSelectPaymentsForHandoverAccept(summary, 'Credit')}" >
                                            </p:commandButton>
                                            <f:facet name="footer">
                                                <h:outputText value="#{financialTransactionController.bundle.creditValue}">
                                                    <f:convertNumber pattern="#,##0.00" />
                                                </h:outputText>
                                            </f:facet>
                                        </p:column>

                                        <!-- Continuing from Credit -->
                                        <p:column
                                            headerText="Staff Welfare"
                                            class="text-end"
                                            rendered="#{financialTransactionController.bundle.hasStaffWelfareTransaction}" >
                                            <h:outputText value="#{summary.staffWelfareValue}" >
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <p:commandButton
                                                icon="pi pi-list"
                                                title="View Payments"
                                                ajax="false"
                                                styleClass="ui-button-info m-1 mx-2"
                                                action="#{financialTransactionController.navigateToSelectPaymentsForHandoverAccept(summary, 'StaffWelfare')}" >
                                            </p:commandButton>
                                            <f:facet name="footer">
                                                <h:outputText value="#{financialTransactionController.bundle.staffWelfareValue}">
                                                    <f:convertNumber pattern="#,##0.00" />
                                                </h:outputText>
                                            </f:facet>
                                        </p:column>

                                        <p:column
                                            headerText="Staff"
                                            class="text-end"
                                            rendered="#{financialTransactionController.bundle.hasStaffTransaction}" >
                                            <h:outputText value="#{summary.staffValue}" >
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <p:commandButton
                                                icon="pi pi-list"
                                                title="View Payments"
                                                ajax="false"
                                                styleClass="ui-button-info m-1 mx-2"
                                                action="#{financialTransactionController.navigateToSelectPaymentsForHandoverAccept(summary, 'Staff')}" >
                                            </p:commandButton>
                                            <f:facet name="footer">
                                                <h:outputText value="#{financialTransactionController.bundle.staffValue}">
                                                    <f:convertNumber pattern="#,##0.00" />
                                                </h:outputText>
                                            </f:facet>
                                        </p:column>

                                        <p:column
                                            headerText="Voucher"
                                            class="text-end"
                                            rendered="#{financialTransactionController.bundle.hasVoucherTransaction}" >
                                            <h:outputText value="#{summary.voucherValue}" >
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <p:commandButton
                                                icon="pi pi-list"
                                                title="View Payments"
                                                ajax="false"
                                                styleClass="ui-button-info m-1 mx-2"
                                                action="#{financialTransactionController.navigateToSelectPaymentsForHandoverAccept(summary, 'Voucher')}" >
                                            </p:commandButton>
                                            <f:facet name="footer">
                                                <h:outputText value="#{financialTransactionController.bundle.voucherValue}">
                                                    <f:convertNumber pattern="#,##0.00" />
                                                </h:outputText>
                                            </f:facet>
                                        </p:column>

                                        <p:column
                                            headerText="IOU"
                                            class="text-end"
                                            rendered="#{financialTransactionController.bundle.hasIouTransaction}" >
                                            <h:outputText value="#{summary.iouValue}" >
                                                <f:convertNumber pattern="#,##0.00" ></f:convertNumber>
                                            </h:outputText>
                                            <p:commandButton
                                                icon="pi pi-list"
                                                title="View Payments"
                                                ajax="false"
                                                styleClass="ui-button-info m-1 mx-2"
                                                action="#{financialTransactionController.navigateToSelectPaymentsForHandoverAccept(summary, 'IOU')}" >
                                            </p:commandButton>
                                            <f:facet name="footer">
                                                <h:outputText value="#{financialTransactionController.bundle.iouValue}">
                                                    <f:convertNumber pattern="#,##0.00" />
                                                </h:outputText>
