<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>

        <ui:composition template="./index.xhtml">
            <ui:define name="subcontent">

                <h:form >
                    <p:panel class="w-100 m-1">
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fa fa-inbox me-2"/>
                                    <h:outputText value="Receive Float Transfer"/>
                                </div>
                                <div>
                                    <p:commandButton
                                        value="Back"
                                        icon="fa fa-arrow-left"
                                        class="ui-button-secondary"
                                        ajax="false"
                                        action="#{financialTransactionController.navigateToReceiveFundTransferBillsForMe()}" >
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>
                        <div class="row">
                            <div class="col-6" >

                                <p:panelGrid
                                    class="w-100 m-1"
                                    layout="tabular"
                                    columns="2"
                                    columnClasses="text-start, text-end">
                                    <h:outputText value="Transfer From" >
                                    </h:outputText>
                                    <h:outputText value="#{financialTransactionController.currentBill.referenceBill.fromWebUser.webUserPerson.nameWithTitle}" >
                                    </h:outputText>

                                    <h:outputText value="Transferred At" >
                                    </h:outputText>
                                    <h:outputText value="#{financialTransactionController.currentBill.referenceBill.createdAt}" >
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" ></f:convertDateTime>
                                    </h:outputText>

                                    <h:outputText value="Transfer Total" >
                                    </h:outputText>
                                    <h:outputText style="font-weight: bold" value="#{financialTransactionController.currentBill.referenceBill.absoluteNetTotalTransient}" >
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </p:panelGrid>
                            </div>
                            <div class="col-6" >
                                <p:dataTable class="m-1" id="tblPayments" value="#{financialTransactionController.currentBillPayments}" var="bp"
                                             emptyMessage="No payments found.">
                                    <p:column headerText="Amount" styleClass="text-end">
                                        <h:outputText value="#{bp.absolutePaidValueTransient}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </p:column>
                                </p:dataTable>
                            </div>
                        </div>

                        <!-- Denomination Entry Section -->
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <p:panel header="Count Received Denominations" class="m-1">
                                    <p:dataTable
                                        id="tblDenoReceive"
                                        value="#{financialTransactionController.fundTransferDenominationTransactions}"
                                        var="deno"
                                        emptyMessage="No denominations configured"
                                        styleClass="mb-2">
                                        <p:column headerText="Denomination">
                                            <p:outputLabel value="#{deno.denomination.displayName}"/>
                                        </p:column>
                                        <p:column headerText="Quantity">
                                            <p:inputText
                                                class="text-end w-100"
                                                id="txtDenoQtyReceive"
                                                value="#{deno.denominationQty}"
                                                onfocus="this.select()"
                                                oninput="this.value=this.value.replace(/[^0-9]/g,'');">
                                                <f:convertNumber integerOnly="true"/>
                                                <f:validateLongRange minimum="0" />
                                                <p:ajax
                                                    event="blur"
                                                    process="txtDenoQtyReceive"
                                                    listener="#{financialTransactionController.calculateFundTransferDenominationTotal()}"
                                                    update="txtDenoValReceive txtDenoTotalReceive"/>
                                            </p:inputText>
                                        </p:column>
                                        <p:column headerText="Value" styleClass="text-end">
                                            <p:outputLabel
                                                id="txtDenoValReceive"
                                                class="w-100 text-end"
                                                value="#{deno.denominationValue eq null ? 0.00 : deno.denominationValue}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </p:outputLabel>
                                        </p:column>
                                    </p:dataTable>

                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h:outputText value="Denomination Total: "/>
                                        <h:outputText
                                            id="txtDenoTotalReceive"
                                            styleClass="fw-bold"
                                            value="#{financialTransactionController.fundTransferDenominationTotal}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </div>
                                </p:panel>
                            </div>
                        </div>
                        <!-- Comment Section -->
                        <div class="row mt-3">
                            <div class="col-12">
                                <p:panel header="Receive Comments" class="m-1">
                                    <div class="row">
                                        <div class="col-3">
                                            <p:outputLabel value="Comments *" for="txtReceiveComments"/>
                                        </div>
                                        <div class="col-9">
                                            <p:inputTextarea
                                                id="txtReceiveComments"
                                                value="#{financialTransactionController.currentBill.comments}"
                                                class="w-100"
                                                rows="3"
                                                placeholder="Please provide comments for receiving this float transfer..."
                                                required="false"/>
                                            <p:message for="txtReceiveComments"/>
                                        </div>
                                    </div>
                                </p:panel>
                            </div>
                        </div>

                        <!-- Action Button Section -->
                        <div class="row mt-2">
                            <div class="col-12 text-end">
                                <p:commandButton
                                    id="btnReceiveFloat"
                                    value="Receive Float"
                                    ajax="false"
                                    icon="fas fa-check"
                                    class="ui-button-success"
                                    onclick="if (!confirm('Are you sure you want to receive float?'))
                                                         return false;"
                                    action="#{financialTransactionController.settleFundTransferReceiveBill()}">
                                </p:commandButton>
                            </div>
                        </div>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>

    </h:body>
</html>
