<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:na="http://xmlns.jcp.org/jsf/composite/template">

    <h:head>
        <title>Patient Relationship Types</title>
    </h:head>

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">

                <h:panelGroup rendered="#{!webUserController.hasPrivilege('AdminPatientRelationships')}">
                    <na:not_authorize />
                </h:panelGroup>

                <h:panelGroup rendered="#{webUserController.hasPrivilege('AdminPatientRelationships')}">
                    <h:form>
                        <p:growl />
                        <p:panel>
                            <f:facet name="header">
                                <i class="pi pi-users mr-2"/>
                                <span class="fw-bold">Patient Relationship Types</span>
                            </f:facet>

                            <div class="alert alert-info mb-3">
                                These relationship types are system-defined and cover clinical and administrative
                                use cases. They are recorded on each patient's profile to document next-of-kin,
                                guardians, dependents, and emergency contacts.
                            </div>

                            <p:dataTable
                                value="#{personRelationshipController.allRelationshipTypes}"
                                var="rt"
                                rowIndexVar="rowIdx"
                                styleClass="w-100"
                                style="table-layout:auto;">
                                <p:column headerText="#" style="width:60px">
                                    <h:outputText value="#{rowIdx + 1}"/>
                                </p:column>
                                <p:column headerText="Relationship Type">
                                    <p:badge value="#{rt.label}" severity="info"/>
                                </p:column>
                                <p:column headerText="System Name">
                                    <h:outputText value="#{rt.name()}" styleClass="text-muted" style="font-family:monospace;font-size:0.9em;"/>
                                </p:column>
                            </p:dataTable>

                        </p:panel>
                    </h:form>
                </h:panelGroup>

            </ui:define>
        </ui:composition>
    </h:body>
</html>
