<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/admin/institutions/admin_institutions_index.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="admin">

        <h:panelGroup>
            <h:form>
                <p:growl id="msg" showDetail="true"/>

                <p:panel header="Manage Banking Branch">
                    <div class="row">
                        <div class="col-md-5">
                            <div class="mb-2">
                                <p:commandButton id="btnAdd" value="Add New"
                                                 icon="fas fa-plus"
                                                 action="#{institutionBranchController.prepareAdd()}"
                                                 styleClass="ui-button-success"
                                                 process="btnAdd"
                                                 update="lstSelect gpDetail"/>
                                <p:commandButton id="btnDelete"
                                                 value="Delete"
                                                 icon="fas fa-trash"
                                                 styleClass="ui-button-danger ml-1"
                                                 onclick="if (!confirm('Are you sure you want to delete this record?')) return false;"
                                                 action="#{institutionBranchController.delete()}"
                                                 process="btnDelete"
                                                 update="lstSelect gpDetail msg"/>
                            </div>
                            <p:selectOneListbox id="lstSelect"
                                                value="#{institutionBranchController.selectedBranchId}"
                                                styleClass="w-100"
                                                filter="true"
                                                filterMatchMode="contains">
                                <f:selectItem itemLabel="-- Select a Branch --" itemValue="#{null}" noSelectionOption="true"/>
                                <f:selectItems value="#{institutionBranchController.branchDtos}"
                                               var="dto"
                                               itemValue="#{dto.id}"
                                               itemLabel="#{dto.displayLabel}"/>
                                <p:ajax event="change"
                                        update="gpDetail"
                                        process="lstSelect"
                                        listener="#{institutionBranchController.onBranchSelect()}"/>
                            </p:selectOneListbox>
                        </div>
                        <div class="col-md-7">
                            <p:panel id="gpDetail" styleClass="w-100" header="Branch Details">
                                <div class="mb-3">
                                    <p:outputLabel for="txtName" value="Branch Name" styleClass="d-block font-weight-bold mb-1"/>
                                    <p:inputText id="txtName"
                                                 autocomplete="off"
                                                 value="#{institutionBranchController.current.name}"
                                                 styleClass="w-100"/>
                                </div>
                                <div class="mb-3">
                                    <p:outputLabel for="txtCode" value="Branch Code" styleClass="d-block font-weight-bold mb-1"/>
                                    <p:inputText id="txtCode"
                                                 autocomplete="off"
                                                 value="#{institutionBranchController.current.institutionCode}"
                                                 styleClass="w-100"/>
                                </div>
                                <div class="mb-3">
                                    <p:outputLabel for="cmbBank" value="Bank" styleClass="d-block font-weight-bold mb-1"/>
                                    <p:selectOneMenu id="cmbBank"
                                                     value="#{institutionBranchController.current.institution}"
                                                     styleClass="w-100">
                                        <f:selectItem itemLabel="-- Select Bank --" itemValue="#{null}" noSelectionOption="true"/>
                                        <f:selectItems value="#{institutionController.banks}"
                                                       var="bank"
                                                       itemLabel="#{bank.name}"
                                                       itemValue="#{bank}"/>
                                        <f:converter converterId="institutionConverter"/>
                                    </p:selectOneMenu>
                                </div>
                                <div class="mt-3">
                                    <p:commandButton id="btnSave"
                                                     value="Save"
                                                     icon="fas fa-save"
                                                     styleClass="ui-button-warning"
                                                     action="#{institutionBranchController.saveSelected()}"
                                                     process="btnSave gpDetail"
                                                     update="lstSelect gpDetail msg"/>
                                </div>
                                <p:defaultCommand target="btnSave"/>
                            </p:panel>
                        </div>
                    </div>
                </p:panel>
            </h:form>
        </h:panelGroup>

    </ui:define>

</ui:composition>
