<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/admin/institutions/admin_institutions_index.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="admin">

        <h:panelGroup>
            <h:form>
                <p:growl id="msg"/>

                <p:panel header="List of Bank Accounts">
                    <p:dataTable id="tblBankAccounts"
                                 value="#{bankAccountController.items}"
                                 var="item"
                                 paginator="true"
                                 rows="20"
                                 rowsPerPageTemplate="10,20,50"
                                 styleClass="w-100"
                                 emptyMessage="No bank accounts found.">
                        <p:column headerText="Account Name" sortBy="#{item.accountName}" filterBy="#{item.accountName}">
                            <h:outputText value="#{item.accountName}"/>
                        </p:column>
                        <p:column headerText="Account Number" sortBy="#{item.accountNo}" filterBy="#{item.accountNo}">
                            <h:outputText value="#{item.accountNo}"/>
                        </p:column>
                        <p:column headerText="Type" sortBy="#{item.bankAccountType}">
                            <h:outputText value="#{item.bankAccountType}"/>
                        </p:column>
                    </p:dataTable>
                </p:panel>
            </h:form>
        </h:panelGroup>

    </ui:define>

</ui:composition>
