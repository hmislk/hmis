<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/admin/staff/admin_manage_staff_index.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="subcontent">
        <h:form id="frmMappings">
            <p:growl id="msg" />
            <p:panel header="Staff Mappings">
                <h:panelGroup layout="block" style="margin-bottom: 1em;">
                    <p:outputLabel styleClass="text-muted"
                                   value="Choose a mapping type, pick the staff member, then pick a Route (for a collecting centre) or an Institution (for any other institution) and click Add. For Sample Transporter, a logged-in collecting centre is offered the staff mapped to its route, and any other institution is offered the staff mapped to it. The lists only use these mappings when the application option 'Sample Transporter List Is Limited To Staff Mapped As Sample Transporters' is on." />
                </h:panelGroup>

                <div class="row mb-2">
                    <div class="col-md-4">
                        <p:outputLabel value="Mapping Type" for="selType" />
                        <p:selectOneMenu id="selType" value="#{staffMappingController.mappingType}" styleClass="w-100">
                            <f:selectItems value="#{staffMappingController.mappingTypes}" var="mt" itemLabel="#{mt.label}" itemValue="#{mt}" />
                            <p:ajax event="change" listener="#{staffMappingController.fillMappings}" update="tblMappings" />
                        </p:selectOneMenu>
                    </div>
                    <div class="col-md-5">
                        <p:outputLabel value="Staff" for="acStaff" />
                        <p:autoComplete id="acStaff"
                                        value="#{staffMappingController.staff}"
                                        completeMethod="#{staffController.completeStaff}"
                                        var="s"
                                        itemLabel="#{s.person.nameWithTitle}"
                                        itemValue="#{s}"
                                        maxResults="20"
                                        styleClass="w-100"
                                        inputStyleClass="form-control"
                                        placeholder="Search staff by name or code">
                            <p:column headerText="Code" style="padding: 6px;">#{s.code}</p:column>
                            <p:column headerText="Name" style="padding: 6px;">#{s.person.nameWithTitle}</p:column>
                        </p:autoComplete>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-4">
                        <p:outputLabel value="Route (when mapping for a collecting centre)" for="acRoute" />
                        <p:autoComplete id="acRoute"
                                        value="#{staffMappingController.route}"
                                        completeMethod="#{routeController.completeRoute}"
                                        var="rt" itemLabel="#{rt.name}" itemValue="#{rt}"
                                        forceSelection="true" maxResults="20"
                                        styleClass="w-100" inputStyleClass="form-control" />
                    </div>
                    <div class="col-md-5">
                        <p:outputLabel value="Institution (when mapping for any other institution)" for="acInstitution" />
                        <p:autoComplete id="acInstitution"
                                        value="#{staffMappingController.institution}"
                                        completeMethod="#{institutionController.completeIns}"
                                        var="ins" itemLabel="#{ins.name}" itemValue="#{ins}"
                                        forceSelection="true" maxResults="20"
                                        styleClass="w-100" inputStyleClass="form-control" />
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <p:commandButton value="Add" icon="fa-solid fa-plus" class="ui-button-success w-100"
                                         action="#{staffMappingController.addMapping}"
                                         process="@form" update="@form" />
                    </div>
                </div>

                <p:dataTable id="tblMappings" value="#{staffMappingController.mappings}" var="m"
                             rowKey="#{m.id}" emptyMessage="No staff mapped for this type" rows="15" paginator="true" paginatorPosition="bottom">
                    <p:column headerText="Code" width="120">
                        <h:outputText value="#{m.staff.code}" />
                    </p:column>
                    <p:column headerText="Staff">
                        <h:outputText value="#{m.staff.person.nameWithTitle}" />
                    </p:column>
                    <p:column headerText="Route">
                        <h:outputText value="#{m.route.name}" />
                    </p:column>
                    <p:column headerText="Institution">
                        <h:outputText value="#{m.institution.name}" />
                    </p:column>
                    <p:column headerText="Type">
                        <h:outputText value="#{m.mappingType.label}" />
                    </p:column>
                    <p:column headerText="Remove" width="100">
                        <p:commandButton icon="fa-solid fa-trash" class="ui-button-danger"
                                         action="#{staffMappingController.removeMapping(m)}"
                                         process="@this" update="@form" />
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
