<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:autocomplete="http://xmlns.jcp.org/jsf/composite/autocomplete"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/admin/users/index.xhtml">
            <ui:define name="subcontent">
                <h:panelGroup rendered="#{not webUserController.hasPrivilege('AdminManagingUsers') and not  sessionController.firstLogin }" >
                    You are NOT authorized
                </h:panelGroup>

                <h:panelGroup rendered="#{webUserController.hasPrivilege('AdminManagingUsers') or sessionController.firstLogin }" >
                    <style>
                        .user-form-row {
                            display: flex;
                            align-items: center;
                            margin-bottom: 0.6rem;
                        }
                        .user-form-row > .user-form-label {
                            flex: 0 0 11rem;
                            font-weight: 600;
                        }
                        .user-form-row > .user-form-field {
                            flex: 1 1 auto;
                            min-width: 0;
                        }
                        .user-form-field .ui-selectonemenu,
                        .user-form-field .ui-autocomplete,
                        .user-form-field .ui-inputfield,
                        .user-form-field .ui-password {
                            width: 100%;
                        }
                    </style>

                    <h:form>
                        <p:panel>
                            <f:facet name="header">
                                <div class="d-flex align-items-center justify-content-between w-100">
                                    <div class="d-flex align-items-center">
                                        <i class="fa fa-user-plus mx-2" aria-hidden="true"></i>
                                        <h:outputText value="Add New User" />
                                    </div>
                                    <p:commandButton
                                        id="btnCreateUser"
                                        icon="fas fa-save"
                                        value="Save User"
                                        class="ui-button-success"
                                        title="Create the user"
                                        action="#{webUserController.saveNewUser()}" ajax="false" />
                                </div>
                            </f:facet>

                            <!-- Mode first: these options change which fields below apply -->
                            <p:fieldset legend="User Type" class="mb-3">
                                <div class="d-flex flex-wrap gap-4">
                                    <div class="d-flex align-items-center gap-2">
                                        <p:selectBooleanCheckbox id="chkOnlyUser" value="#{webUserController.createOnlyUser}">
                                            <p:ajax process="@this" update="userFormBody" listener="#{webUserController.onlyAddStaffListner()}" />
                                        </p:selectBooleanCheckbox>
                                        <p:outputLabel for="chkOnlyUser" value="Add Only User" />
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <p:selectBooleanCheckbox id="chkExistingStaff" value="#{webUserController.createOnlyUserForExsistingUser}">
                                            <p:ajax process="@this" update="userFormBody" listener="#{webUserController.onlyAddStaffForExsistingUserListner()}" />
                                        </p:selectBooleanCheckbox>
                                        <p:outputLabel for="chkExistingStaff" value="Add User To Exsisting Staff" />
                                    </div>
                                </div>
                            </p:fieldset>

                            <h:panelGroup id="userFormBody" layout="block">
                                <div class="row">
                                    <!-- Left column: person / staff and organisation -->
                                    <div class="col-lg-6">

                                        <p:fieldset legend="Existing Staff" class="mb-3" rendered="#{webUserController.createOnlyUserForExsistingUser}">
                                            <div class="user-form-row">
                                                <p:outputLabel value="Staff" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <autocomplete:completeStaff value="#{webUserController.staff}" />
                                                </div>
                                            </div>
                                        </p:fieldset>

                                        <p:fieldset legend="Personal Details" class="mb-3" rendered="#{!webUserController.createOnlyUserForExsistingUser}">
                                            <div class="user-form-row">
                                                <p:outputLabel for="txtName" value="Name" class="user-form-label" />
                                                <div class="user-form-field d-flex gap-2">
                                                    <p:selectOneMenu
                                                        id="acTitle"
                                                        filter="true"
                                                        filterMatchMode="contains"
                                                        style="flex: 0 0 9rem; width: 9rem;"
                                                        required="false"
                                                        value="#{webUserController.current.webUserPerson.title}"
                                                        requiredMessage="Please enter a Title">
                                                        <f:selectItem itemLabel="Title" />
                                                        <f:selectItems 
                                                            value="#{enumController.titleDoctor}" 
                                                            var="title" 
                                                            itemLabel="#{title.label}" 
                                                            itemValue="#{title}"/>
                                                    </p:selectOneMenu>
                                                    <p:inputText
                                                        id="txtName"
                                                        class="flex-grow-1"
                                                        autocomplete="off"
                                                        required="true"
                                                        placeholder="Full name"
                                                        value="#{webUserController.current.webUserPerson.name}"
                                                        requiredMessage="Please enter a Name" />
                                                </div>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="txtAddress" value="Address" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:inputText
                                                        id="txtAddress"
                                                        autocomplete="off"
                                                        required="true"
                                                        value="#{webUserController.current.webUserPerson.address}"
                                                        requiredMessage="Please enter an address." />
                                                </div>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="txtPhone" value="Mobile" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:inputText
                                                        id="txtPhone"
                                                        required="true"
                                                        value="#{webUserController.current.webUserPerson.mobile}"
                                                        requiredMessage="Plase enter a phone number" />
                                                </div>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="speciality" value="Speciality" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:autoComplete
                                                        forceSelection="true" id="speciality"
                                                        value="#{webUserController.speciality}"
                                                        completeMethod="#{specialityController.completeSpeciality}"
                                                        var="mys"
                                                        class="w-100"
                                                        inputStyleClass="w-100"
                                                        placeholder="#{webUserController.createOnlyUser ? 'Not needed for Add Only User' : 'Search speciality'}"
                                                        itemLabel="#{mys.name}"
                                                        itemValue="#{mys}"
                                                        disabled="#{webUserController.createOnlyUser}" />
                                                </div>
                                            </div>
                                        </p:fieldset>

                                        <p:fieldset legend="Organisation" class="mb-3" rendered="#{!webUserController.createOnlyUserForExsistingUser}">
                                            <div class="user-form-row">
                                                <p:outputLabel for="userIns" value="Institution" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:selectOneMenu
                                                        id="userIns"
                                                        value="#{webUserController.institution}"
                                                        filter="true"
                                                        filterMatchMode="contains">
                                                        <f:selectItem itemLabel="Select Institution" />
                                                        <f:selectItems value="#{institutionController.companies}" var="ins" itemLabel="#{ins.name}" itemValue="#{ins}" />
                                                        <p:ajax process="@this" update="userSite userDept" />
                                                    </p:selectOneMenu>
                                                </div>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="userSite" value="Site" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:selectOneMenu
                                                        id="userSite"
                                                        value="#{webUserController.site}"
                                                        filter="true"
                                                        filterMatchMode="contains">
                                                        <f:selectItem itemLabel="Select Site" />
                                                        <f:selectItems value="#{institutionController.sites}" var="site" itemLabel="#{site.name}" itemValue="#{site}" />
                                                        <p:ajax process="@this" update="userDept" />
                                                    </p:selectOneMenu>
                                                </div>
                                            </div>

                                            <!-- Department list depends on the selected Institution and Site -->
                                            <div class="user-form-row">
                                                <p:outputLabel value="Department" class="user-form-label" />
                                                <h:panelGroup id="userDept" layout="block" class="user-form-field">
                                                    <p:selectOneMenu
                                                        rendered="#{webUserController.institution eq null and webUserController.site eq null}"
                                                        value="#{webUserController.department}"
                                                        filter="true" filterMatchMode="contains">
                                                        <f:selectItem itemLabel="Select Department" />
                                                        <f:selectItems value="#{departmentController.getDepartmentsOfInstitutionAndSite()}" var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                                    </p:selectOneMenu>

                                                    <p:selectOneMenu
                                                        rendered="#{webUserController.institution eq null and webUserController.site ne null}"
                                                        value="#{webUserController.department}"
                                                        filter="true" filterMatchMode="contains">
                                                        <f:selectItem itemLabel="Select Department" />
                                                        <f:selectItems value="#{departmentController.getDepartmentsOfInstitutionAndSite(webUserController.site)}" var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                                    </p:selectOneMenu>

                                                    <p:selectOneMenu
                                                        rendered="#{webUserController.institution ne null and webUserController.site eq null}"
                                                        value="#{webUserController.department}"
                                                        filter="true" filterMatchMode="contains">
                                                        <f:selectItem itemLabel="Select Department" />
                                                        <f:selectItems value="#{departmentController.getDepartmentsOfInstitutionAndSiteForInstitution(webUserController.institution)}" var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                                    </p:selectOneMenu>

                                                    <p:selectOneMenu
                                                        rendered="#{webUserController.institution ne null and webUserController.site ne null}"
                                                        value="#{webUserController.department}"
                                                        filter="true" filterMatchMode="contains">
                                                        <f:selectItem itemLabel="Select Department" />
                                                        <f:selectItems value="#{departmentController.getDepartmentsOfInstitutionAndSite(webUserController.institution, webUserController.site)}" var="d" itemLabel="#{d.name}" itemValue="#{d}" />
                                                    </p:selectOneMenu>
                                                </h:panelGroup>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="loginPage" value="Login Page" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:selectOneMenu
                                                        id="loginPage"
                                                        filterMatchMode="contains"
                                                        value="#{webUserController.loginPage}">
                                                        <f:selectItem itemLabel="-- Select Login Page --" itemValue="" />
                                                        <f:selectItems value="#{enumController.loginPages}"
                                                                       var="lp"
                                                                       itemLabel="#{lp.label}"
                                                                       itemValue="#{lp}" />
                                                    </p:selectOneMenu>
                                                </div>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="role" value="User Role" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:selectOneMenu
                                                        id="role"
                                                        value="#{webUserController.webUserRole}">
                                                        <f:selectItem itemLabel="-- Select Role --" itemValue="" />
                                                        <f:selectItems value="#{webUserRoleController.activatediItems}"
                                                                       var="role"
                                                                       itemLabel="#{role.name}"
                                                                       itemValue="#{role}" />
                                                        <f:attribute name="selectedInstitution" value="#{webUserController.institution}" />
                                                    </p:selectOneMenu>
                                                </div>
                                            </div>
                                        </p:fieldset>
                                    </div>

                                    <!-- Right column: login credentials -->
                                    <div class="col-lg-6">
                                        <p:fieldset legend="Login Credentials" class="mb-3">
                                            <div class="user-form-row">
                                                <p:outputLabel for="txtUsername" value="User Name" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:inputText id="txtUsername"
                                                                 autocomplete="off" required="true" maxlength="50"
                                                                 value="#{webUserController.current.name}" />
                                                </div>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="pw1" value="Password" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:password
                                                        toggleMask="true"
                                                        id="pw1"
                                                        validatorMessage="Passwords are NOT matching."
                                                        match="pw2"
                                                        feedback="true"
                                                        required="true"
                                                        maxlength="15"
                                                        value="#{webUserController.current.webUserPassword}"
                                                        class="w-100"
                                                        inputStyleClass="w-100" />
                                                </div>
                                            </div>

                                            <div class="user-form-row">
                                                <p:outputLabel for="pw2" value="Re-enter Password" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:password
                                                        toggleMask="true"
                                                        id="pw2"
                                                        required="true"
                                                        maxlength="15"
                                                        value="#{webUserController.current.webUserPassword}"
                                                        class="w-100"
                                                        inputStyleClass="w-100" />
                                                </div>
                                            </div>

                                            <h:panelGroup layout="block" class="user-form-row" rendered="#{!webUserController.createOnlyUserForExsistingUser}">
                                                <p:outputLabel for="txtCode" value="Code" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:inputText id="txtCode" autocomplete="off" value="#{webUserController.current.code}" maxlength="10" />
                                                </div>
                                            </h:panelGroup>

                                            <div class="user-form-row">
                                                <p:outputLabel for="chkActive" value="User is Active" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:selectBooleanCheckbox id="chkActive" value="#{webUserController.current.activated}" />
                                                </div>
                                            </div>
                                        </p:fieldset>

                                        <p:fieldset legend="Login Security" class="mb-3">
                                            <div class="user-form-row">
                                                <p:outputLabel for="restrictLoginByIp" value="Restrict Login By IP" class="user-form-label" />
                                                <div class="user-form-field">
                                                    <p:selectBooleanCheckbox id="restrictLoginByIp" value="#{webUserController.current.restrictLoginByIp}">
                                                        <p:ajax update="allowedIpAddressesBlock" process="@this" />
                                                    </p:selectBooleanCheckbox>
                                                </div>
                                            </div>

                                            <!-- Wrapper is always rendered so the ajax update can show/hide the label and input together -->
                                            <h:panelGroup id="allowedIpAddressesBlock" layout="block">
                                                <h:panelGroup layout="block" class="user-form-row" rendered="#{webUserController.current.restrictLoginByIp}">
                                                    <p:outputLabel for="allowedIpAddresses" value="Allowed IP Addresses" class="user-form-label" />
                                                    <div class="user-form-field">
                                                        <p:inputText
                                                            id="allowedIpAddresses"
                                                            value="#{webUserController.current.allowedIpAddresses}"
                                                            placeholder="e.g. 192.168.1.10, 192.168.1.11"
                                                            title="Comma-separated IP addresses" />
                                                    </div>
                                                </h:panelGroup>
                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{twoFactorAuthController.twoFactorEnabled}">
                                                <hr class="my-2" />
                                                <div class="user-form-row">
                                                    <p:outputLabel for="twoFactorRequired" value="Require Authenticator App (2FA)" class="user-form-label" />
                                                    <div class="user-form-field">
                                                        <p:selectBooleanCheckbox id="twoFactorRequired"
                                                                                 value="#{webUserController.current.twoFactorRequired}"
                                                                                 disabled="#{configOptionApplicationController.authenticatorAppTwoFactorLoginRequiredForAllUsers}" />
                                                        <h:outputText class="small text-muted mx-2"
                                                                      rendered="#{configOptionApplicationController.authenticatorAppTwoFactorLoginRequiredForAllUsers}"
                                                                      value="Required for all users by configuration" />
                                                    </div>
                                                </div>
                                                <p class="small text-muted mb-0">
                                                    The user links their authenticator app at their first login.
                                                </p>
                                            </h:panelGroup>
                                        </p:fieldset>
                                    </div>
                                </div>
                            </h:panelGroup>
                        </p:panel>
                    </h:form>
                </h:panelGroup>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
