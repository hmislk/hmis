<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:body>

        <ui:composition template="/admin/users/user_list.xhtml">

            <ui:define name="users">
                <f:view>
                    <style>
                        .user-form-row {
                            display: flex;
                            align-items: center;
                            margin-bottom: 0.6rem;
                        }
                        .user-form-row > .user-form-label {
                            flex: 0 0 11rem;
                            font-weight: 600;
                        }
                        .user-form-row > .user-form-field {
                            flex: 1 1 auto;
                            min-width: 0;
                        }
                        .user-form-field .ui-selectonemenu,
                        .user-form-field .ui-autocomplete,
                        .user-form-field .ui-inputfield {
                            width: 100%;
                        }
                    </style>

                    <p:panel>
                        <f:facet name="header">
                            <div class="d-flex align-items-center justify-content-between w-100">
                                <div class="d-flex align-items-center">
                                    <i class="fa fa-user-cog"></i>
                                    <h:outputText class="mx-2" value="Manage User" />
                                    <h:outputText class="mx-1 text-muted" style="font-weight: normal;"
                                                  value="(#{webUserController.current.name})"
                                                  rendered="#{not empty webUserController.current.name}" />
                                </div>
                                <p:commandButton
                                    ajax="false"
                                    value="Save"
                                    action="#{webUserController.saveUser()}"
                                    icon="fa fa-save"
                                    class="ui-button-success"
                                    title="Save user details" />
                            </div>
                        </f:facet>

                        <div class="row">
                            <!-- Left column: account and organisation -->
                            <div class="col-lg-6">
                                <p:fieldset legend="Account" class="mb-3">
                                    <div class="user-form-row">
                                        <p:outputLabel value="User Name" for="name" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:outputLabel id="name" value="#{webUserController.current.name}" class="form-control bg-light" />
                                        </div>
                                    </div>

                                    <div class="user-form-row">
                                        <p:outputLabel value="Staff" for="staff" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:autoComplete
                                                forceSelection="true" id="staff"
                                                value="#{webUserController.current.staff}"
                                                completeMethod="#{staffController.completeStaff}"
                                                var="mys"
                                                class="w-100"
                                                inputStyleClass="w-100"
                                                placeholder="Search staff"
                                                itemLabel="#{mys.person.nameWithTitle}"
                                                itemValue="#{mys}" />
                                        </div>
                                    </div>

                                    <div class="user-form-row">
                                        <p:outputLabel value="Code" for="code" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:inputText id="code" value="#{webUserController.current.code}" title="Code" />
                                        </div>
                                    </div>

                                    <div class="user-form-row">
                                        <p:outputLabel value="User is Active" for="activated" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:selectBooleanCheckbox id="activated" value="#{webUserController.current.activated}" />
                                        </div>
                                    </div>
                                </p:fieldset>

                                <p:fieldset legend="Organisation" class="mb-3">
                                    <div class="user-form-row">
                                        <p:outputLabel value="Institution" for="institution" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:selectOneMenu
                                                id="institution"
                                                value="#{webUserController.current.institution}"
                                                filter="true"
                                                filterMatchMode="contains">
                                                <f:selectItem itemLabel="Select Institution" />
                                                <f:selectItems
                                                    value="#{institutionController.companies}"
                                                    var="ins"
                                                    itemLabel="#{ins.name}"
                                                    itemValue="#{ins}" />
                                                <p:ajax update="site departmentBlock" process="@this" />
                                            </p:selectOneMenu>
                                        </div>
                                    </div>

                                    <div class="user-form-row">
                                        <p:outputLabel value="Site" for="site" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:selectOneMenu
                                                id="site"
                                                value="#{webUserController.current.site}"
                                                filter="true"
                                                filterMatchMode="contains">
                                                <f:selectItem itemLabel="Select Site" />
                                                <f:selectItems
                                                    value="#{institutionController.sites}" var="s"
                                                    itemLabel="#{s.name}" itemValue="#{s}" />
                                                <p:ajax update="departmentBlock" process="@this" />
                                            </p:selectOneMenu>
                                        </div>
                                    </div>

                                    <!-- Department list depends on the selected Institution and Site -->
                                    <div class="user-form-row">
                                        <p:outputLabel value="Department" class="user-form-label" />
                                        <h:panelGroup id="departmentBlock" layout="block" class="user-form-field">

                                            <p:selectOneMenu
                                                rendered="#{webUserController.current.institution eq null and webUserController.current.site eq null}"
                                                value="#{webUserController.current.department}"
                                                filter="true"
                                                filterMatchMode="contains">
                                                <f:selectItem itemLabel="Select Department" />
                                                <f:selectItems
                                                    value="#{departmentController.getDepartmentsOfInstitutionAndSite()}" var="d"
                                                    itemLabel="#{d.name}"
                                                    itemValue="#{d}" />
                                            </p:selectOneMenu>

                                            <p:selectOneMenu
                                                rendered="#{webUserController.current.institution eq null and webUserController.current.site ne null}"
                                                value="#{webUserController.current.department}"
                                                filter="true"
                                                filterMatchMode="contains">
                                                <f:selectItem itemLabel="Select Department" />
                                                <f:selectItems
                                                    value="#{departmentController.getDepartmentsOfInstitutionAndSite(webUserController.current.site)}" var="d"
                                                    itemLabel="#{d.name}"
                                                    itemValue="#{d}" />
                                            </p:selectOneMenu>

                                            <p:selectOneMenu
                                                rendered="#{webUserController.current.institution ne null and webUserController.current.site eq null}"
                                                value="#{webUserController.current.department}"
                                                filter="true"
                                                filterMatchMode="contains">
                                                <f:selectItem itemLabel="Select Department" />
                                                <f:selectItems
                                                    value="#{departmentController.getDepartmentsOfInstitutionAndSiteForInstitution(webUserController.current.institution)}" var="d"
                                                    itemLabel="#{d.name}"
                                                    itemValue="#{d}" />
                                            </p:selectOneMenu>

                                            <p:selectOneMenu
                                                rendered="#{webUserController.current.institution ne null and webUserController.current.site ne null}"
                                                value="#{webUserController.current.department}"
                                                filter="true"
                                                filterMatchMode="contains">
                                                <f:selectItem itemLabel="Select Department" />
                                                <f:selectItems
                                                    value="#{departmentController.getDepartmentsOfInstitutionAndSite(webUserController.current.institution, webUserController.current.site)}" var="d"
                                                    itemLabel="#{d.name}"
                                                    itemValue="#{d}" />
                                            </p:selectOneMenu>

                                        </h:panelGroup>
                                    </div>

                                    <h:panelGroup layout="block" class="user-form-row" rendered="#{!webUserController.createOnlyUserForExsistingUser}">
                                        <p:outputLabel value="Login Page" for="loginPage" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:selectOneMenu
                                                id="loginPage"
                                                filterMatchMode="contains"
                                                value="#{webUserController.current.loginPage}">
                                                <f:selectItem itemLabel="-- Select Login Page --" itemValue="" />
                                                <f:selectItems
                                                    value="#{enumController.loginPages}"
                                                    var="lp"
                                                    itemLabel="#{lp.label}"
                                                    itemValue="#{lp}" />
                                            </p:selectOneMenu>
                                        </div>
                                    </h:panelGroup>
                                </p:fieldset>
                            </div>

                            <!-- Right column: contact and security -->
                            <div class="col-lg-6">
                                <p:fieldset legend="Contact" class="mb-3">
                                    <div class="user-form-row">
                                        <p:outputLabel value="Email" for="email" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:inputText id="email" value="#{webUserController.current.email}" title="Email" />
                                        </div>
                                    </div>

                                    <div class="user-form-row">
                                        <p:outputLabel value="Mobile" for="telNo" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:inputText id="telNo" value="#{webUserController.current.telNo}" title="Mobile number" />
                                        </div>
                                    </div>
                                </p:fieldset>

                                <p:fieldset legend="Login Security" class="mb-3">
                                    <div class="user-form-row">
                                        <p:outputLabel value="Restrict Login By IP" for="restrictLoginByIp" class="user-form-label" />
                                        <div class="user-form-field">
                                            <p:selectBooleanCheckbox id="restrictLoginByIp" value="#{webUserController.current.restrictLoginByIp}">
                                                <p:ajax update="allowedIpAddressesBlock" process="@this" />
                                            </p:selectBooleanCheckbox>
                                        </div>
                                    </div>

                                    <!-- Wrapper is always rendered so the ajax update can show/hide the label and input together -->
                                    <h:panelGroup id="allowedIpAddressesBlock" layout="block">
                                        <h:panelGroup layout="block" class="user-form-row" rendered="#{webUserController.current.restrictLoginByIp}">
                                            <p:outputLabel value="Allowed IP Addresses" for="allowedIpAddresses" class="user-form-label" />
                                            <div class="user-form-field">
                                                <p:inputText
                                                    id="allowedIpAddresses"
                                                    value="#{webUserController.current.allowedIpAddresses}"
                                                    placeholder="e.g. 192.168.1.10, 192.168.1.11"
                                                    title="Comma-separated IP addresses" />
                                            </div>
                                        </h:panelGroup>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{twoFactorAuthController.twoFactorEnabled}">
                                        <hr class="my-2" />
                                        <div class="user-form-row">
                                            <p:outputLabel value="Require Authenticator App (2FA)" for="twoFactorRequired" class="user-form-label" />
                                            <div class="user-form-field">
                                                <p:selectBooleanCheckbox id="twoFactorRequired"
                                                                         value="#{webUserController.current.twoFactorRequired}"
                                                                         disabled="#{configOptionApplicationController.authenticatorAppTwoFactorLoginRequiredForAllUsers}" />
                                                <h:outputText class="small text-muted mx-2"
                                                              rendered="#{configOptionApplicationController.authenticatorAppTwoFactorLoginRequiredForAllUsers}"
                                                              value="Required for all users by configuration" />
                                            </div>
                                        </div>

                                        <div class="user-form-row">
                                            <p:outputLabel value="Authenticator Status" class="user-form-label" />
                                            <h:panelGroup id="twoFactorStatusBlock" layout="block" class="user-form-field d-flex align-items-center flex-wrap gap-2">
                                                <h:panelGroup rendered="#{webUserController.current.twoFactorEnrolled}">
                                                    <i class="fa fa-check-circle text-success"></i>
                                                    <h:outputText value=" Linked" class="text-success fw-bold" />
                                                    <h:outputText value=" since " rendered="#{webUserController.current.twoFactorEnrolledAt ne null}" />
                                                    <h:outputText value="#{webUserController.current.twoFactorEnrolledAt}" rendered="#{webUserController.current.twoFactorEnrolledAt ne null}">
                                                        <f:convertDateTime pattern="dd-MM-yyyy HH:mm" />
                                                    </h:outputText>
                                                </h:panelGroup>
                                                <h:panelGroup rendered="#{not webUserController.current.twoFactorEnrolled}">
                                                    <i class="fa fa-circle text-muted"></i>
                                                    <h:outputText value=" Not set up (user will be asked at next login)" class="text-muted" />
                                                </h:panelGroup>
                                                <p:commandButton value="Reset Authenticator"
                                                                 class="ui-button-danger"
                                                                 icon="fa fa-sync"
                                                                 process="@this"
                                                                 update="twoFactorStatusBlock"
                                                                 title="Unlink the user's authenticator app (e.g. lost phone)"
                                                                 rendered="#{webUserController.current.twoFactorEnrolled}"
                                                                 action="#{twoFactorAuthController.resetAuthenticator(webUserController.current)}">
                                                    <p:confirm header="Reset Authenticator"
                                                               message="The user's linked authenticator app will stop working and they must set it up again at next login. Continue?"
                                                               icon="pi pi-exclamation-triangle" />
                                                </p:commandButton>
                                            </h:panelGroup>
                                        </div>
                                    </h:panelGroup>
                                </p:fieldset>
                            </div>
                        </div>

                        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" rendered="#{twoFactorAuthController.twoFactorEnabled}">
                            <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" icon="fa fa-check" />
                            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="fa fa-times" />
                        </p:confirmDialog>
                    </p:panel>
                </f:view>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
