<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

    <h:body>
        <ui:composition template="/admin/users/index.xhtml">
            <ui:define name="subcontent">
                <style>
                    .prr-card {
                        display: block;
                        border: 1px solid #dee2e6;
                        border-left-width: 5px;
                        border-radius: 6px;
                        padding: 10px 14px;
                        background: #fff;
                        color: inherit;
                        text-decoration: none;
                    }
                    .prr-card:hover {
                        background: #f8f9fa;
                        color: inherit;
                    }
                    .prr-card.active {
                        box-shadow: 0 0 0 2px #0d6efd33;
                        background: #f1f6ff;
                    }
                    .prr-card .prr-count {
                        font-size: 1.6rem;
                        font-weight: 600;
                        line-height: 1.2;
                    }
                    .prr-card .prr-label {
                        font-size: 0.85rem;
                        color: #6c757d;
                    }
                    .prr-total {
                        border-left-color: #6c757d;
                    }
                    .prr-self {
                        border-left-color: #198754;
                    }
                    .prr-admin {
                        border-left-color: #0dcaf0;
                    }
                    .prr-unknown {
                        border-left-color: #ffc107;
                    }
                    .prr-never {
                        border-left-color: #dc3545;
                    }
                    .prr-table.ui-datatable thead th,
                    .prr-table.ui-datatable tbody td {
                        padding: 5px 8px !important;
                    }
                    .prr-table .ui-tag {
                        padding: 0 6px;
                        font-size: 0.75rem;
                    }

                    @media screen {
                        .printOnlyReport { display: none; }
                    }
                    @media print {
                        @page {
                            size: A4 portrait;
                            margin: 10mm 8mm 12mm 8mm;
                            @bottom-right {
                                content: "Page " counter(page) " of " counter(pages);
                                font-family: Arial, sans-serif;
                                font-size: 8pt;
                            }
                        }
                        .printOnlyReport {
                            display: block;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 9px;
                            color: #000;
                            -webkit-print-color-adjust: exact;
                            print-color-adjust: exact;
                        }
                        .printOnlyReport .printHead {
                            text-align: center;
                            border-bottom: 2px solid #000;
                            padding-bottom: 4px;
                            margin-bottom: 6px;
                        }
                        .printOnlyReport .printInstitution {
                            font-size: 15px;
                            font-weight: bold;
                            text-transform: uppercase;
                            letter-spacing: 0.5px;
                        }
                        .printOnlyReport .printTitle {
                            text-align: center;
                            font-size: 12px;
                            font-weight: bold;
                            text-transform: uppercase;
                            margin: 4px 0 6px 0;
                        }
                        .printOnlyReport .printFilters {
                            width: 100%;
                            border: 1px solid #999;
                            border-collapse: collapse;
                            margin-bottom: 8px;
                            font-size: 9px;
                        }
                        .printOnlyReport .printFilters td {
                            border: none;
                            padding: 2px 6px;
                            vertical-align: top;
                        }
                        .printOnlyReport .printFilters .lbl {
                            font-weight: bold;
                            white-space: nowrap;
                            width: 1%;
                        }
                        .printOnlyReport .printData {
                            width: 100%;
                            box-sizing: border-box;
                            border-collapse: collapse;
                            font-size: 9px;
                        }
                        .printOnlyReport .printData thead { display: table-header-group; }
                        .printOnlyReport .printData tfoot { display: table-row-group; }
                        .printOnlyReport .printData tr { page-break-inside: avoid; }
                        .printOnlyReport .printData th,
                        .printOnlyReport .printData td {
                            border: 1px solid #777;
                            padding: 3px 4px;
                            text-align: left;
                            vertical-align: top;
                            overflow-wrap: anywhere;
                        }
                        .printOnlyReport .printData th {
                            background-color: #d9d9d9;
                            font-weight: bold;
                            border-color: #000;
                            vertical-align: bottom;
                        }
                        .printOnlyReport .printData tbody tr:nth-child(even) td { background-color: #f3f3f3; }
                        .printOnlyReport .printData tfoot td {
                            font-weight: bold;
                            text-align: right;
                            background-color: #e6e6e6;
                            border-top: 2px solid #000;
                            border-bottom: 3px double #000;
                        }
                        .printOnlyReport .nowrap { white-space: nowrap; }
                        .printOnlyReport .center { text-align: center !important; }
                        .printOnlyReport .printFooter {
                            display: flex;
                            justify-content: space-between;
                            margin-top: 6px;
                            padding-top: 3px;
                            border-top: 1px solid #999;
                            font-size: 8px;
                            color: #333;
                            page-break-inside: avoid;
                        }
                    }
                </style>

                <h:form id="frmPrr">
                    <p:panel id="panelReport">

                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fa fa-key me-2" aria-hidden="true"/>
                                    <h:outputText value="Password Reset Report"/>
                                </div>
                                <div class="d-flex gap-2">
                                    <p:commandButton
                                        value="Excel"
                                        ajax="false"
                                        icon="fa fa-file-excel"
                                        class="ui-button-success"
                                        title="Download the table as an Excel file">
                                        <p:dataExporter target="tbl" type="xlsx" fileName="Password_Reset_Report"/>
                                    </p:commandButton>
                                    <p:commandButton
                                        value="Print"
                                        ajax="false"
                                        icon="fa fa-print"
                                        class="ui-button-info"
                                        title="Print the report">
                                        <p:printer target="printReport"/>
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <!-- Filters -->
                        <div class="row g-2 align-items-end mb-3">
                            <div class="col-md-3">
                                <p:outputLabel value="Name / Username" for="txtName" class="d-block mb-1"/>
                                <p:inputText id="txtName"
                                             value="#{passwordResetReportController.nameFilter}"
                                             placeholder="Search by name or username"
                                             class="w-100"/>
                            </div>
                            <div class="col-md-3">
                                <p:outputLabel value="Updated By" for="cmbUpdatedBy" class="d-block mb-1"/>
                                <p:selectOneMenu 
                                    id="cmbUpdatedBy"
                                    value="#{passwordResetReportController.updatedByFilter}"
                                    class="w-100">
                                    <f:selectItem itemLabel="All" itemValue=""/>
                                    <f:selectItem itemLabel="Self" itemValue="Self"/>
                                    <f:selectItem itemLabel="Admin" itemValue="Admin"/>
                                    <f:selectItem itemLabel="Unknown" itemValue="Unknown"/>
                                    <f:selectItem itemLabel="Never updated" itemValue="Never updated"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="col-md-2 pb-1 mx-3 mb-2">
                                <p:selectBooleanCheckbox 
                                    id="chkRetired"
                                    value="#{passwordResetReportController.includeRetired}"
                                    itemLabel="Include Retired">
                                </p:selectBooleanCheckbox>
                            </div>
                            <div class="col d-flex gap-2 justify-content-end">
                                <div class="w-100 d-flex justify-content-end gap-2">
                                    <p:commandButton
                                        id="btnProcess"
                                        value="Process"
                                        action="#{passwordResetReportController.fillReport()}"
                                        icon="fa fa-cogs"
                                        class="ui-button-warning"
                                        ajax="false"
                                        title="Run the report with these filters">
                                    </p:commandButton>

                                    <p:defaultCommand target="btnProcess"/>

                                    <p:commandButton
                                        value="Reset"
                                        action="#{passwordResetReportController.resetFilters()}"
                                        icon="fa fa-undo"
                                        class="ui-button-secondary"
                                        ajax="false"
                                        title="Clear all filters">
                                    </p:commandButton>
                                </div>
                            </div>
                        </div>

                        <div class="text-end text-muted small mb-1">
                            <i class="fa fa-clock me-1" aria-hidden="true"/>
                            <h:outputText value="Last processed at: "/>
                            <h:outputText value="#{passwordResetReportController.processedAt}" rendered="#{passwordResetReportController.processedAt ne null}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </h:outputText>
                            <h:outputText value="Not processed yet" rendered="#{passwordResetReportController.processedAt eq null}"/>
                            <h:outputText value=" by #{passwordResetReportController.processedBy}" rendered="#{not empty passwordResetReportController.processedBy}"/>
                        </div>

                        <!-- Summary cards: click one to show only that group -->
                        <div class="row g-2 mb-3">
                            <div class="col">
                                <h:commandLink 
                                    action="#{passwordResetReportController.fillReport()}"
                                    styleClass="prr-card prr-total #{empty passwordResetReportController.updatedByFilter ? 'active' : ''}"
                                    title="Show all users">
                                    <f:setPropertyActionListener target="#{passwordResetReportController.updatedByFilter}" value=""/>
                                    <div class="prr-count"><h:outputText value="#{passwordResetReportController.totalCount}"/></div>
                                    <div class="prr-label"><i class="fa fa-users me-1"/>Total Users</div>
                                </h:commandLink>
                            </div>
                            <div class="col">
                                <h:commandLink 
                                    action="#{passwordResetReportController.fillReport()}"
                                    styleClass="prr-card prr-self #{passwordResetReportController.updatedByFilter eq 'Self' ? 'active' : ''}"
                                    title="Users who changed their own password">
                                    <f:setPropertyActionListener target="#{passwordResetReportController.updatedByFilter}" value="Self"/>
                                    <div class="prr-count"><h:outputText value="#{passwordResetReportController.selfCount}"/></div>
                                    <div class="prr-label"><i class="fa fa-user-check me-1"/>Self Reset</div>
                                </h:commandLink>
                            </div>
                            <div class="col">
                                <h:commandLink 
                                    action="#{passwordResetReportController.fillReport()}"
                                    styleClass="prr-card prr-admin #{passwordResetReportController.updatedByFilter eq 'Admin' ? 'active' : ''}"
                                    title="Users whose password was reset by someone else">
                                    <f:setPropertyActionListener target="#{passwordResetReportController.updatedByFilter}" value="Admin"/>
                                    <div class="prr-count"><h:outputText value="#{passwordResetReportController.adminCount}"/></div>
                                    <div class="prr-label"><i class="fa fa-user-shield me-1"/>Admin Reset</div>
                                </h:commandLink>
                            </div>
                            <div class="col">
                                <h:commandLink 
                                    action="#{passwordResetReportController.fillReport()}"
                                    styleClass="prr-card prr-unknown #{passwordResetReportController.updatedByFilter eq 'Unknown' ? 'active' : ''}"
                                    title="Password updated, but who did it is not recorded">
                                    <f:setPropertyActionListener target="#{passwordResetReportController.updatedByFilter}" value="Unknown"/>
                                    <div class="prr-count"><h:outputText value="#{passwordResetReportController.unknownCount}"/></div>
                                    <div class="prr-label"><i class="fa fa-question-circle me-1"/>Unknown</div>
                                </h:commandLink>
                            </div>
                            <div class="col">
                                <h:commandLink 
                                    action="#{passwordResetReportController.fillReport()}"
                                    styleClass="prr-card prr-never #{passwordResetReportController.updatedByFilter eq 'Never updated' ? 'active' : ''}"
                                    title="Password never changed since the account was created">
                                    <f:setPropertyActionListener target="#{passwordResetReportController.updatedByFilter}" value="Never updated"/>
                                    <div class="prr-count"><h:outputText value="#{passwordResetReportController.neverCount}"/></div>
                                    <div class="prr-label"><i class="fa fa-exclamation-triangle me-1"/>Never Updated</div>
                                </h:commandLink>
                            </div>
                        </div>

                            <p:dataTable
                                id="tbl"
                                value="#{passwordResetReportController.rows}"
                                var="r"
                                rowIndexVar="index"
                                sortMode="multiple"
                                styleClass="prr-table"
                                stripedRows="true"
                                size="small"
                                paginator="true"
                                rows="25"
                                paginatorPosition="bottom"
                                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} users"
                                rowsPerPageTemplate="25,50,100,500"
                                emptyMessage="No users found. Change the filters and click Process.">

                                <p:column headerText="No" width="50">
                                    <h:outputText value="#{index + 1}"/>
                                </p:column>

                                <p:column 
                                    headerText="Staff Name"
                                    sortBy="#{r.staffName}"
                                    filterBy="#{r.staffName}"
                                    filterMatchMode="contains">
                                    <h:outputText value="#{r.staffName}"/>
                                </p:column>

                                <p:column 
                                    headerText="Username"
                                    sortBy="#{r.username}"
                                    filterBy="#{r.username}"
                                    filterMatchMode="contains"
                                    width="300"
                                    exportValue="#{r.username}#{r.retired ? ' (Retired)' : ''}">
                                    <h:outputText value="#{r.username}"/>
                                    <p:tag value="Retired" severity="danger" rendered="#{r.retired}" class="ms-2"/>
                                </p:column>

                                <p:column 
                                    headerText="Last Password Updated"
                                    sortBy="#{r.lastPasswordResetAt}"
                                    width="200">
                                    <h:outputText value="#{r.lastPasswordResetAt}" rendered="#{r.lastPasswordResetAt ne null}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                    </h:outputText>
                                    <h:outputText value="-" rendered="#{r.lastPasswordResetAt eq null}" class="text-muted"/>
                                </p:column>

                                <p:column 
                                    headerText="Updated By"
                                    sortBy="#{r.updatedBy}"
                                    exportValue="#{r.updatedBy}"
                                    width="130"
                                    style="text-align: center;">
                                    <p:tag value="#{r.updatedBy}" severity="#{r.updatedBySeverity}"/>
                                </p:column>

                                <p:column headerText="Last Login"
                                          sortBy="#{r.lastLoginAt}"
                                          width="200">
                                    <h:outputText value="#{r.lastLoginAt}" rendered="#{r.lastLoginAt ne null}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                    </h:outputText>
                                    <h:outputText value="Never logged in" rendered="#{r.lastLoginAt eq null}" class="text-muted"/>
                                </p:column>
                            </p:dataTable>

                        <!-- Print-only A4 view: all rows, no paginator -->
                        <h:panelGroup layout="block" id="printReport" styleClass="printOnlyReport">
                            <div class="printHead">
                                <div class="printInstitution">
                                    <h:outputText value="#{sessionController.loggedUser.institution.name}"/>
                                </div>
                            </div>
                            <div class="printTitle">Password Reset Report</div>
                            <table class="printFilters">
                                <tr>
                                    <td class="lbl">Name / Username</td>
                                    <td><h:outputText value="#{empty passwordResetReportController.nameFilter ? 'All' : passwordResetReportController.nameFilter}"/></td>
                                    <td class="lbl">Updated By</td>
                                    <td><h:outputText value="#{empty passwordResetReportController.updatedByFilter ? 'All' : passwordResetReportController.updatedByFilter}"/></td>
                                    <td class="lbl">Retired Users</td>
                                    <td><h:outputText value="#{passwordResetReportController.includeRetired ? 'Included' : 'Excluded'}"/></td>
                                </tr>
                                <tr>
                                    <td class="lbl">Summary</td>
                                    <td colspan="5">
                                        <h:outputText value="Total #{passwordResetReportController.totalCount} | Self #{passwordResetReportController.selfCount} | Admin #{passwordResetReportController.adminCount} | Unknown #{passwordResetReportController.unknownCount} | Never Updated #{passwordResetReportController.neverCount}"/>
                                    </td>
                                </tr>
                            </table>
                            <table class="printData">
                                <thead>
                                    <tr>
                                        <th class="center">No.</th>
                                        <th>Staff Name</th>
                                        <th>Username</th>
                                        <th>Last Password Updated</th>
                                        <th class="center">Updated By</th>
                                        <th>Last Login</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <ui:repeat value="#{passwordResetReportController.rows}" var="pr" varStatus="st">
                                        <tr>
                                            <td class="center"><h:outputText value="#{st.index + 1}"/></td>
                                            <td><h:outputText value="#{pr.staffName}"/></td>
                                            <td class="nowrap">
                                                <h:outputText value="#{pr.username}"/>
                                                <h:outputText value=" (Retired)" rendered="#{pr.retired}"/>
                                            </td>
                                            <td class="nowrap">
                                                <h:outputText value="#{pr.lastPasswordResetAt}" rendered="#{pr.lastPasswordResetAt ne null}">
                                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                                </h:outputText>
                                                <h:outputText value="-" rendered="#{pr.lastPasswordResetAt eq null}"/>
                                            </td>
                                            <td class="center nowrap"><h:outputText value="#{pr.updatedBy}"/></td>
                                            <td class="nowrap">
                                                <h:outputText value="#{pr.lastLoginAt}" rendered="#{pr.lastLoginAt ne null}">
                                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                                </h:outputText>
                                                <h:outputText value="Never logged in" rendered="#{pr.lastLoginAt eq null}"/>
                                            </td>
                                        </tr>
                                    </ui:repeat>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="6">
                                            <h:outputText value="Total (#{empty passwordResetReportController.rows ? 0 : passwordResetReportController.rows.size()} users)"/>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                            <div class="printFooter">
                                <span>
                                    <h:outputText value="Processed by: #{passwordResetReportController.processedBy}"/>
                                </span>
                                <span>
                                    <h:outputText value="Processed at: "/>
                                    <h:outputText value="#{passwordResetReportController.processedAt}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                    </h:outputText>
                                </span>
                            </div>
                        </h:panelGroup>

                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
