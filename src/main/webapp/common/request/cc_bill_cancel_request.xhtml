<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill/cc_bill"
      xmlns:request="http://xmlns.jcp.org/jsf/composite/ezcomp/prints/request"
      xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <h:panelGroup rendered="#{!requestController.printPreview}" styleClass="alignTop">
                        <p:panel>
                            <f:facet name="header">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="d-flex align-items-center gap-2">
                                        <h:outputText styleClass="fas fa-ban text-danger"></h:outputText>
                                        <p:outputLabel value="Collecting Centre Bill Cancellation Request" class=" fw-bold"></p:outputLabel>
                                    </div>
                                    <p:commandButton
                                        ajax="false"
                                        value="Back to List"
                                        icon="fa fa-long-arrow-left"
                                        action="/collecting_centre/collecting_centre_search_bill_own.xhtml?faces-redirect=true"
                                        class="ui-button-warning" >
                                    </p:commandButton>
                                </div>
                            </f:facet>

                            <div class="row justify-content-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <h:outputLabel for="commentsMenu" value="Reason for Cancellation" styleClass="fw-semibold mt-2 d-block"/>
                                    <p:inputText
                                        id="commentsMenu"
                                        style="width: 500px;"
                                        value="#{requestController.comment}"
                                        placeholder="Enter the reason for cancelling this bill...">
                                    </p:inputText>
                                    <p:commandButton
                                        ajax="false"
                                        value="Request Cancel Bill"
                                        icon="fa fa-ban"
                                        class="ui-button-danger"
                                        action="#{requestController.createRequestforOPDBatchBill()}">
                                    </p:commandButton>
                                </div>
                            </div>

                            <!-- Patient Details and Bill Details Panels -->
                            <div class="row mt-3 g-3">
                                <div class="col-lg-3 col-md-6">
                                    <p:panel styleClass="h-100">
                                        <f:facet name="header">
                                            <h:outputText styleClass="fas fa-id-card-alt"></h:outputText>
                                            <h:outputLabel value="Patient Details" class="mx-2"></h:outputLabel>
                                        </f:facet>
                                        <common:patient patient="#{requestController.patient}" class="w-100"/>
                                    </p:panel>

                                </div>
                                <div class="col-lg-4 col-md-6">
                                    <p:panel styleClass="h-100">
                                        <f:facet name="header">
                                            <h:outputText styleClass="fas fa-list-alt"></h:outputText>
                                            <h:outputLabel value="Batch Bill Detail" class="mx-2"></h:outputLabel>
                                        </f:facet>
                                        <p:panelGrid columns="2" styleClass="w-100" columnClasses="fw-semibold,text-end">
                                            <h:outputLabel value="Bill No :" ></h:outputLabel>
                                            <h:outputLabel value="#{requestController.batchBill.deptId}" ></h:outputLabel>
                                            <h:outputLabel value="Bill Type Atomic :" ></h:outputLabel>
                                            <h:outputLabel value="#{requestController.batchBill.billTypeAtomic}" ></h:outputLabel>
                                            <h:outputLabel value="Total :" ></h:outputLabel>
                                            <h:outputLabel value="#{requestController.batchBill.total}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                            <h:outputLabel value="Discount :" ></h:outputLabel>
                                            <h:outputLabel value="#{requestController.batchBill.discount}" >
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                            <h:outputLabel value="Net Total :" styleClass="fw-bold"></h:outputLabel>
                                            <h:outputLabel value="#{requestController.batchBill.netTotal}" styleClass="fw-bold text-primary">
                                                <f:convertNumber pattern="#,##0.00" />
                                            </h:outputLabel>
                                        </p:panelGrid>
                                    </p:panel>
                                </div>
                                <div class="col-lg-5 col-md-12">
                                    <p:panel styleClass="h-100">
                                        <f:facet name="header">
                                            <h:outputText styleClass="fas fa-receipt"></h:outputText>
                                            <h:outputLabel value="CC Bill Preview" class="mx-2"></h:outputLabel>
                                        </f:facet>
                                        <div class="d-flex justify-content-center">
                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Bill for Collecting Center(CC) size is POS paper')}" >
                                                <bi:posCCBill_CC bill="#{requestController.batchBill}" duplicate="true"/>
                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Bill For Collecting Center(CC) size is FiveFive paper')}" >
                                                <bi:fiveFiveCCBill_CC bill="#{requestController.batchBill}" duplicate="true"/>
                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Bill For Collecting Center(CC) size is FiveFiveCustom1 paper')}" >
                                                <bi:fiveFiveCCBill_CC_Custom1 bill="#{requestController.batchBill}" duplicate="true"/>
                                            </h:panelGroup>

                                            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Bill For Collecting Center(CC) size is FiveFiveCustom3 paper')}" >
                                                <bi:cc_five_five_custom_3 bill="#{requestController.batchBill}" duplicate="true"/>
                                            </h:panelGroup>
                                        </div>
                                    </p:panel>

                                </div>
                            </div>

                        </p:panel>
                    </h:panelGroup>

                    <!-- Print Preview Panel -->
                    <h:panelGroup rendered="#{requestController.printPreview}" >
                        <p:panel>
                            <f:facet name="header">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="d-flex align-items-center gap-2">
                                        <h:outputText styleClass="fas fa-file-invoice"></h:outputText>
                                        <p:outputLabel value="Bill Cancellation Request Note" class="mt-2 fw-bold"></p:outputLabel>
                                    </div>
                                    <div class=" d-flex gap-2">
                                        <p:commandButton
                                            ajax="false"
                                            value="Print"
                                            icon="fa fa-print"
                                            class="ui-button-info" >
                                            <p:printer target="printingView" />
                                        </p:commandButton>

                                        <p:commandButton
                                            ajax="false"
                                            value="Back to List"
                                            icon="fa fa-long-arrow-left"
                                            action="#{opdBillController.navigateToSearchOpdBills()}"
                                            class="ui-button-warning" >
                                        </p:commandButton>
                                    </div>

                                </div>
                            </f:facet>

                            <div class="d-flex justify-content-center">
                                <h:panelGroup id="printingView">

                                    <h:panelGroup rendered="#{sessionController.departmentPreference.opdBillPaperType eq 'FiveEightInchPaper'}" >
                                        <request:five_eight_bill_cancel_request request="#{requestController.currentRequest}" />
                                    </h:panelGroup>

                                </h:panelGroup>

                            </div>
                        </p:panel>

                    </h:panelGroup>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
