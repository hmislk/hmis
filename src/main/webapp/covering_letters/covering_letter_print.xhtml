<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:panelGroup layout="block" rendered="#{webUserController.hasPrivilege('CoveringLetters')}">
                    <h:form id="frmClPrint">
                        <!-- Non-printing toolbar -->
                        <p:panel styleClass="mb-2">
                            <div class="d-flex flex-wrap align-items-center gap-2">
                                <h:outputText value="Reference No: " styleClass="fw-bold"/>
                                <h:outputText value="#{coveringLetterController.current.referenceNo}"/>
                                <p:commandButton value="Print" icon="fa fa-print" ajax="false"
                                                 styleClass="ui-button-info"
                                                 title="Print the covering letter">
                                    <p:printer target="pnlLetterPrint"/>
                                </p:commandButton>
                                <p:commandButton value="Back to Batch" icon="fa fa-arrow-left" ajax="false"
                                                 immediate="true"
                                                 styleClass="ui-button-warning"
                                                 action="#{coveringLetterController.navigateBackFromPrint()}"/>
                                <p:commandButton value="Saved Letters" icon="fa fa-list" ajax="false"
                                                 immediate="true"
                                                 styleClass="ui-button-info ui-button-outlined"
                                                 action="#{coveringLetterController.navigateToCoveringLetterList()}"/>
                            </div>
                        </p:panel>

                        <h:panelGroup id="pnlLetterPrint" layout="block"
                                      style="width: 100%; min-height: 500px; padding: 15px; background: #fff;">
                            <h:outputText value="#{coveringLetterController.current.generatedHtml}" escape="false"/>
                        </h:panelGroup>
                    </h:form>
                </h:panelGroup>
                <h:outputText value="You do not have the privilege to use Covering Letters."
                              rendered="#{not webUserController.hasPrivilege('CoveringLetters')}"/>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
