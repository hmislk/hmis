<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <div class="cc-dash">

            <div class="cc-hero">
                <div class="cc-hero-left">
                    <h:outputText styleClass="cc-hero-title" value="Collecting Centre Self Billing"/>
                    <h:outputText 
                        styleClass="cc-hero-subtitle"
                        value="#{sessionController.institution.name}"
                        rendered="#{sessionController.institution != null}"/>
                </div>
                <div class="cc-hero-right" rendered="#{sessionController.loggedUser != null}">
                    <div class="cc-hero-chip">
                        <div class="cc-avatar">
                            <h:outputText styleClass="fas fa-user"/>
                        </div>
                        <div class="cc-hero-chip-text">
                            <h:outputText 
                                styleClass="cc-user-name"
                                value="#{sessionController.loggedUser.webUserPerson.name}"
                                rendered="#{sessionController.loggedUser.webUserPerson != null}"/>
                            <h:outputText styleClass="cc-user-role" value="#{sessionController.loggedUser.name}"/>
                        </div>
                    </div>
                    <h:panelGroup id="ccHeroActions" layout="block" styleClass="cc-hero-actions">
                        <!-- Notifications open in a popup; the full notifications page uses the
                             menu template, which collecting centre self-billing users don't get. -->
                        <p:badge value="#{userNotificationController.unseenCount}" severity="danger" rendered="#{userNotificationController.unseenCount > 0}">
                            <p:commandButton id="btnCcNotifications"
                                             icon="pi pi-bell"
                                             styleClass="cc-hero-icon-btn"
                                             title="Notifications"
                                             process="@this"
                                             update="ccNotificationList"
                                             actionListener="#{userNotificationController.resetFilters()}"
                                             action="#{userNotificationController.filterNotificationsByCriteria()}"
                                             oncomplete="PF('dlgCcNotifications').show();"/>
                        </p:badge>
                        <p:commandButton id="btnCcNotificationsNoBadge"
                                         icon="pi pi-bell"
                                         styleClass="cc-hero-icon-btn"
                                         title="Notifications"
                                         rendered="#{userNotificationController.unseenCount le 0}"
                                         process="@this"
                                         update="ccNotificationList"
                                         actionListener="#{userNotificationController.resetFilters()}"
                                         action="#{userNotificationController.filterNotificationsByCriteria()}"
                                         oncomplete="PF('dlgCcNotifications').show();"/>
                        <p:commandButton id="btnCcLogout"
                                         ajax="false"
                                         icon="pi pi-sign-out"
                                         styleClass="cc-hero-icon-btn"
                                         title="Logout"
                                         action="#{sessionController.logout}"/>
                    </h:panelGroup>
                </div>
            </div>

            <div class="cc-body-grid" style="margin-top: 60px;">
                <div>
                    
                    <div class="cc-card">
                        <h:panelGroup layout="block" styleClass="cc-section-title">
                            <h:outputText styleClass="fas fa-bolt"/>
                            <h:outputText value=" Quick Actions"/>
                        </h:panelGroup>
                        <div class="cc-action-grid">
                            <h:commandLink 
                                styleClass="cc-action-card cc-c-blue" 
                                ajax="false"
                                action="#{collectingCentreBillController.navigateToCollectingCentreSelfBilling()}">
                                <div class="cc-action-icon">
                                    <h:outputText styleClass="fas fa-file-invoice-dollar"/>
                                </div>
                                <h:outputText styleClass="cc-action-label" value="Create Bill"/>
                            </h:commandLink>
                            <h:commandLink
                                styleClass="cc-action-card cc-c-green"
                                action="#{collectingCentreSelfSearchController.navigateToSearchBills()}">
                                <div class="cc-action-icon">
                                    <h:outputText styleClass="fas fa-search"/>
                                </div>
                                <h:outputText styleClass="cc-action-label" value="Search Bills"/>
                            </h:commandLink>
                            <div class="cc-action-card cc-c-orange">
                                <span class="cc-action-badge">Soon</span>
                                <div class="cc-action-icon">
                                    <h:outputText styleClass="fas fa-chart-bar"/>
                                </div>
                                <h:outputText styleClass="cc-action-label" value="Reports"/>
                            </div>
                            <div class="cc-action-card cc-c-purple">
                                <span class="cc-action-badge">Soon</span>
                                <div class="cc-action-icon">
                                    <h:outputText styleClass="fas fa-money-check-alt"/>
                                </div>
                                <h:outputText styleClass="cc-action-label" value="Payments"/>
                            </div>
                            <h:commandLink
                                styleClass="cc-action-card cc-c-teal"
                                action="#{collectingCentreSelfCommonController.navigateToCollectingCentreSelfStatement()}">
                                <div class="cc-action-icon">
                                    <h:outputText styleClass="fas fa-file-alt"/>
                                </div>
                                <h:outputText styleClass="cc-action-label" value="Statements"/>
                            </h:commandLink>
                            <h:commandLink
                                styleClass="cc-action-card cc-c-red"
                                action="#{collectingCentreSelfCommonController.navigateToCollectingCentreSelfSampleManagement()}">
                                <div class="cc-action-icon">
                                    <h:outputText styleClass="fas fa-vials"/>
                                </div>
                                <h:outputText styleClass="cc-action-label" value="Sample Management"/>
                            </h:commandLink>
                        </div>
                    </div>

                </div>

                <div>
                    <div class="cc-card cc-side-card">
                        <h:panelGroup layout="block" styleClass="cc-section-title">
                            <h:outputText styleClass="fas fa-address-card"/>
                            <h:outputText value=" Account Details"/>
                        </h:panelGroup>
                        <h:panelGroup layout="block" rendered="#{sessionController.loggedUser != null}">
                            <div class="cc-detail-row">
                                <span class="cc-detail-label">
                                    <span class="cc-detail-icon cc-c-blue">
                                        <h:outputText styleClass="fas fa-user"/>
                                    </span>
                                    <h:outputText value=" Logged User"/>
                                </span>
                                <h:outputText styleClass="cc-detail-value"
                                              value="#{sessionController.loggedUser.webUserPerson.nameWithTitle}"
                                              rendered="#{sessionController.loggedUser.webUserPerson != null}"/>
                            </div>
                            <div class="cc-detail-row">
                                <span class="cc-detail-label">
                                    <span class="cc-detail-icon cc-c-purple">
                                        <h:outputText styleClass="fas fa-id-badge"/>
                                    </span>
                                    <h:outputText value=" Username"/>
                                </span>
                                <h:outputText styleClass="cc-detail-value" value="#{sessionController.loggedUser.name}"/>
                            </div>
                            <div class="cc-detail-row cc-detail-row-stacked">
                                <span class="cc-detail-label">
                                    <span class="cc-detail-icon cc-c-orange">
                                        <h:outputText styleClass="fas fa-city"/>
                                    </span>
                                    <h:outputText value=" Collecting Centre"/>
                                </span>
                                <h:outputText styleClass="cc-detail-value" value="#{sessionController.institution.name}"/>
                            </div>
                        </h:panelGroup>
                    </div>

                    <div class="cc-card cc-side-card">
                        <h:panelGroup layout="block" styleClass="cc-section-title">
                            <h:outputText styleClass="fas fa-road"/>
                            <h:outputText value=" What's Coming"/>
                        </h:panelGroup>
                        <ul class="cc-timeline">
                            <li class="done">
                                <h:outputText styleClass="cc-timeline-title" value="Self-billing home page"/>
                                <h:outputText styleClass="cc-timeline-desc" value="You are here"/>
                            </li>
                            <li class="done">
                                <h:outputText styleClass="cc-timeline-title" value="Create &amp; search own bills"/>
                                <h:outputText styleClass="cc-timeline-desc" value="Raise and look up your centre's bills"/>
                            </li>
                            <li class="done">
                                <h:outputText styleClass="cc-timeline-title" value="Bill cancellation &amp; refunds"/>
                                <h:outputText styleClass="cc-timeline-desc" value="Cancel whole bills or refund selected items"/>
                            </li>
                            <li class="done">
                                <h:outputText styleClass="cc-timeline-title" value="Account statements"/>
                                <h:outputText styleClass="cc-timeline-desc" value="View your centre's statement and export to Excel or PDF"/>
                            </li>
                            <li class="done">
                                <h:outputText styleClass="cc-timeline-title" value="Sample management"/>
                                <h:outputText styleClass="cc-timeline-desc" value="Print barcodes, collect, send and reject samples"/>
                            </li>
                            <li class="done">
                                <h:outputText styleClass="cc-timeline-title" value="Lab reports"/>
                                <h:outputText styleClass="cc-timeline-desc" value="View, print and download approved reports"/>
                            </li>
                            <li class="done">
                                <h:outputText styleClass="cc-timeline-title" value="Mobile friendly"/>
                                <h:outputText styleClass="cc-timeline-desc" value="Use every page on a phone or tablet"/>
                            </li>
                            <li class="cc-c-purple">
                                <h:outputText styleClass="cc-timeline-title" value="Payments"/>
                                <h:outputText styleClass="cc-timeline-desc" value="Track deposits and payments to the hospital"/>
                            </li>
                            <li class="cc-c-orange">
                                <h:outputText styleClass="cc-timeline-title" value="Reports"/>
                                <h:outputText styleClass="cc-timeline-desc" value="Summaries for your collecting centre"/>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <p:dialog id="dlgCcNotifications"
                      widgetVar="dlgCcNotifications"
                      styleClass="cc-notif-dialog"
                      modal="true"
                      responsive="true"
                      fitViewport="true"
                      width="1200"
                      style="max-width: 95vw;"
                      closeOnEscape="true">
                <f:facet name="header">
                    <span class="cc-notif-title">
                        <span class="cc-notif-title-icon">
                            <h:outputText styleClass="pi pi-bell"/>
                        </span>
                        <h:outputText value="Notifications"/>
                    </span>
                </f:facet>
                <h:panelGroup id="ccNotificationList" layout="block" styleClass="cc-notif-body">
                    <p:messages id="ccNotificationMessages" closable="true"/>

                    <h:panelGroup layout="block" styleClass="cc-notif-summary"
                                  rendered="#{not empty userNotificationController.items}">
                        <h:outputText value="Showing #{userNotificationController.items.size()} notification(s)"/>
                        <h:outputText styleClass="cc-notif-chip cc-notif-chip-new"
                                      value="#{userNotificationController.unseenCount} unread"
                                      rendered="#{userNotificationController.unseenCount > 0}"/>
                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="cc-notif-empty"
                                  rendered="#{empty userNotificationController.items}">
                        <span class="cc-notif-empty-icon">
                            <h:outputText styleClass="pi pi-bell-slash"/>
                        </span>
                        <h:outputText styleClass="cc-notif-empty-title" value="You're all caught up"/>
                        <h:outputText styleClass="cc-notif-empty-desc" value="There are no notifications for you right now."/>
                    </h:panelGroup>

                    <!-- p:dataTable (not ui:repeat) so each row's Remove button gets its own id (see #21538). -->
                    <p:dataTable id="tblCcNotifications"
                                 value="#{userNotificationController.items}"
                                 var="un"
                                 rowKey="#{un.id}"
                                 styleClass="cc-notif-list"
                                 rendered="#{not empty userNotificationController.items}">
                        <p:column>
                            <!-- Clicking anywhere on the card (except its buttons) opens the view popup. -->
                            <div class="cc-notif-item #{un.seen ? 'cc-notif-seen' : 'cc-notif-unseen'}"
                                 title="Click to view"
                                 tabindex="0"
                                 role="button"
                                 onkeydown="if ((event.key === 'Enter' || event.key === ' ') &amp;&amp; event.target === this) { event.preventDefault(); this.querySelector('.cc-notif-view').click(); }"
                                 onclick="if (!event.target.closest('.ui-button')) { this.querySelector('.cc-notif-view').click(); }">
                                <span class="cc-notif-icon">
                                    <h:outputText styleClass="#{un.notification.completed ? 'pi pi-check-circle' : 'pi pi-bell'}"/>
                                </span>
                                <div class="cc-notif-content">
                                    <h:outputText styleClass="cc-notif-message" value="#{un.notification.message}" title="#{un.notification.message}"/>
                                    <div class="cc-notif-meta">
                                        <span class="cc-notif-date">
                                            <h:outputText styleClass="pi pi-clock"/>
                                            <h:outputText value="#{un.notification.createdAt}">
                                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat} hh:mm a" timeZone="Asia/Colombo"/>
                                            </h:outputText>
                                        </span>
                                        <h:outputText styleClass="cc-notif-chip cc-notif-chip-new" value="New" rendered="#{not un.seen}"/>
                                        <h:outputText styleClass="cc-notif-chip cc-notif-chip-seen" value="Seen" rendered="#{un.seen}"/>
                                        <h:outputText styleClass="cc-notif-chip cc-notif-chip-done" value="Completed" rendered="#{un.notification.completed}"/>
                                    </div>
                                </div>
                                <div class="cc-notif-actions">
                                    <!-- Hidden: the card's onclick triggers it, so the whole card opens the view popup. -->
                                    <p:commandButton id="btnCcViewNotification"
                                                     icon="pi pi-eye"
                                                     styleClass="cc-notif-view ui-button-flat ui-button-rounded"
                                                     title="View"
                                                     process="@this"
                                                     update=":#{cc.clientId}:ccNotificationList :#{cc.clientId}:ccHeroActions :#{cc.clientId}:ccNotificationView"
                                                     action="#{collectingCentreSelfCommonController.viewSelfNotification(un)}"
                                                     oncomplete="PF('dlgCcNotificationView').show();"/>
                                    <!-- Enabled only once the notification has been viewed (seen). -->
                                    <p:commandButton id="btnCcRemoveNotification"
                                                     icon="pi pi-trash"
                                                     styleClass="cc-notif-remove ui-button-danger ui-button-flat ui-button-rounded"
                                                     title="#{un.seen ? 'Remove' : 'View the notification to enable Remove'}"
                                                     disabled="#{not un.seen}"
                                                     process="@this"
                                                     update=":#{cc.clientId}:ccNotificationList :#{cc.clientId}:ccHeroActions"
                                                     action="#{collectingCentreSelfCommonController.removeSelfNotification(un)}"/>
                                </div>
                            </div>
                        </p:column>
                    </p:dataTable>
                </h:panelGroup>
            </p:dialog>

            <!-- Single notification view. Opening it marks the notification seen. -->
            <p:dialog id="dlgCcNotificationView"
                      widgetVar="dlgCcNotificationView"
                      styleClass="cc-notif-dialog cc-notif-view-dialog"
                      modal="true"
                      responsive="true"
                      fitViewport="true"
                      width="640"
                      style="max-width: 95vw;"
                      closeOnEscape="true">
                <f:facet name="header">
                    <span class="cc-notif-title">
                        <span class="cc-notif-title-icon">
                            <h:outputText styleClass="pi pi-envelope"/>
                        </span>
                        <h:outputText value="Notification"/>
                    </span>
                </f:facet>
                <h:panelGroup id="ccNotificationView" layout="block" styleClass="cc-notif-view-body">
                    <h:panelGroup layout="block" rendered="#{collectingCentreSelfCommonController.viewingNotification != null}">

                        <div class="cc-notif-view-hero #{collectingCentreSelfCommonController.viewingNotification.notification.completed ? 'cc-notif-view-done' : ''}">
                            <span class="cc-notif-view-icon">
                                <h:outputText styleClass="#{collectingCentreSelfCommonController.viewingNotification.notification.completed ? 'pi pi-check-circle' : 'pi pi-bell'}"/>
                            </span>
                            <div class="cc-notif-view-heading">
                                <h:outputText styleClass="cc-notif-view-label" value="Notification details"/>
                                <div class="cc-notif-view-chips">
                                    <h:outputText styleClass="cc-notif-chip cc-notif-chip-seen" value="Seen"/>
                                    <h:outputText styleClass="cc-notif-chip cc-notif-chip-done" value="Completed"
                                                  rendered="#{collectingCentreSelfCommonController.viewingNotification.notification.completed}"/>
                                    <h:outputText styleClass="cc-notif-chip cc-notif-chip-new" value="Pending"
                                                  rendered="#{not collectingCentreSelfCommonController.viewingNotification.notification.completed}"/>
                                </div>
                            </div>
                        </div>

                        <div class="cc-notif-view-message-card">
                            <h:outputText styleClass="pi pi-comment cc-notif-view-quote"/>
                            <h:outputText styleClass="cc-notif-view-message"
                                          value="#{collectingCentreSelfCommonController.viewingNotification.notification.message}"/>
                        </div>

                        <div class="cc-notif-view-info">
                            <div class="cc-notif-view-info-item">
                                <span class="cc-detail-icon cc-c-blue">
                                    <h:outputText styleClass="pi pi-calendar"/>
                                </span>
                                <div>
                                    <h:outputText styleClass="cc-notif-view-info-label" value="Received"/>
                                    <h:outputText styleClass="cc-notif-view-info-value" value="#{collectingCentreSelfCommonController.viewingNotification.notification.createdAt}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat} hh:mm a" timeZone="Asia/Colombo"/>
                                    </h:outputText>
                                </div>
                            </div>
                            <div class="cc-notif-view-info-item">
                                <span class="cc-detail-icon #{collectingCentreSelfCommonController.viewingNotification.notification.completed ? 'cc-c-green' : 'cc-c-orange'}">
                                    <h:outputText styleClass="#{collectingCentreSelfCommonController.viewingNotification.notification.completed ? 'pi pi-check' : 'pi pi-hourglass'}"/>
                                </span>
                                <div>
                                    <h:outputText styleClass="cc-notif-view-info-label" value="Status"/>
                                    <h:outputText styleClass="cc-notif-view-info-value"
                                                  value="#{collectingCentreSelfCommonController.viewingNotification.notification.completed ? 'Completed' : 'Pending'}"/>
                                </div>
                            </div>
                        </div>

                        <div class="cc-notif-view-footer">
                            <p:commandButton id="btnCcViewRemoveNotification"
                                             value="Remove"
                                             icon="pi pi-trash"
                                             styleClass="ui-button-danger ui-button-outlined"
                                             process="@this"
                                             update=":#{cc.clientId}:ccNotificationList :#{cc.clientId}:ccHeroActions :#{cc.clientId}:ccNotificationView"
                                             action="#{collectingCentreSelfCommonController.removeSelfNotification(collectingCentreSelfCommonController.viewingNotification)}"
                                             oncomplete="PF('dlgCcNotificationView').hide();"/>
                            <p:commandButton value="Close"
                                             icon="pi pi-times"
                                             type="button"
                                             styleClass="cc-notif-view-close"
                                             onclick="PF('dlgCcNotificationView').hide();"/>
                        </div>
                    </h:panelGroup>
                </h:panelGroup>
            </p:dialog>
        </div>

    </cc:implementation>
</html>
