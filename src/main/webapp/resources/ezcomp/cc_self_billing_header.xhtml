<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <!--
        Shared top header for Collecting Centre self-service pages. Shows the
        page title/icon, institution/department context and the logged-in
        user's chip, plus an optional "back" button. Meant to be dropped at
        the top of every self-service page (inside its h:form) so the
        section always looks and behaves the same way.
    -->

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="pageTitle" type="java.lang.String" required="true"/>
        <cc:attribute name="pageIcon" type="java.lang.String" default="fa-solid fa-hospital"/>
        <cc:attribute name="backAction" method-signature="java.lang.String action()" required="false"/>
        <cc:attribute name="backLabel" type="java.lang.String" default="Back"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet library="css" name="collecting_centre_self_billing_header.css"/>

        <div class="cc-header-bar">
            <div class="cc-header-left">
                <span class="cc-header-icon">
                    <h:outputText styleClass="#{cc.attrs.pageIcon}"/>
                </span>
                <div>
                    <h:outputText styleClass="cc-header-title" value="#{cc.attrs.pageTitle}"/>
                    <h:outputText
                        styleClass="cc-header-subtitle"
                        value="#{sessionController.institution.name} &#8250; #{sessionController.department.name}"
                        rendered="#{sessionController.department != null}"/>
                </div>
            </div>
            <div class="cc-header-right" rendered="#{sessionController.loggedUser != null}">
                <div class="cc-header-chip">
                    <div class="cc-header-avatar">
                        <h:outputText styleClass="fas fa-user"/>
                    </div>
                    <div class="cc-header-chip-text">
                        <h:outputText
                            styleClass="cc-header-user-name"
                            value="#{sessionController.loggedUser.webUserPerson.name}"
                            rendered="#{sessionController.loggedUser.webUserPerson != null}"/>
                        <h:outputText styleClass="cc-header-user-role" value="#{sessionController.loggedUser.name}"/>
                    </div>
                </div>
                <div class="cc-header-actions">
                    <p:commandButton
                        rendered="#{cc.attrs.backAction != null}"
                        styleClass="cc-header-back-btn"
                        value="#{cc.attrs.backLabel}"
                        icon="fa fa-arrow-left"
                        immediate="true"
                        ajax="false"
                        action="#{cc.attrs.backAction}"/>
                </div>
            </div>
        </div>
    </cc:implementation>
</html>
