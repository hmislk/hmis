<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp">

    <!-- Authenticator app code screen shown after the password is accepted (see TwoFactorAuthController) -->
    <cc:interface>
    </cc:interface>

    <cc:implementation>
        <style>
            .tfa {
                text-align: center;
                max-width: 26rem;
                margin: 0 auto;
            }
            .tfa-icon {
                width: 3.6rem;
                height: 3.6rem;
                margin: 0.5rem auto 0.9rem auto;
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.6rem;
                color: #fff;
                background: linear-gradient(135deg, var(--primary-color, #3b82f6) 0%, #6366f1 100%);
                box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            }
            .tfa-title {
                display: block;
                font-size: 1.3rem;
                font-weight: 700;
                margin-bottom: 0.3rem;
            }
            .tfa-sub {
                display: block;
                font-size: 0.9rem;
                color: var(--text-color-secondary, #6c757d);
                margin-bottom: 1.2rem;
            }
            .tfa-user {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                padding: 0.25rem 0.75rem;
                margin-bottom: 1.2rem;
                border-radius: 999px;
                font-size: 0.85rem;
                font-weight: 600;
                background: var(--surface-ground, #f1f5f9);
            }
            .tfa-steps {
                display: flex;
                justify-content: center;
                gap: 0.4rem;
                flex-wrap: wrap;
                margin-bottom: 1rem;
            }
            .tfa-step {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.25rem 0.65rem;
                border-radius: 999px;
                font-size: 0.78rem;
                border: 1px solid var(--surface-border, #e5e7eb);
            }
            .tfa-step b {
                width: 1.2rem;
                height: 1.2rem;
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 0.7rem;
                color: #fff;
                background: var(--primary-color, #3b82f6);
            }
            .tfa-qr {
                display: inline-block;
                padding: 0.75rem;
                border-radius: 16px;
                background: #fff;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            }
            .tfa-secret-box {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                margin: 0.75rem 0 1.25rem 0;
                padding: 0.4rem 0.4rem 0.4rem 0.75rem;
                border-radius: 10px;
                background: var(--surface-ground, #f1f5f9);
            }
            .tfa-secret {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.85rem;
                letter-spacing: 0.05em;
                word-break: break-all;
            }
            .tfa-hint {
                display: block;
                font-size: 0.8rem;
                color: var(--text-color-secondary, #6c757d);
                margin-top: 0.75rem;
            }
            .tfa-verify.ui-button {
                width: 100%;
                margin-top: 1.25rem;
                padding: 0.4rem 0;
                border-radius: 12px;
                font-weight: 600;
            }
            .tfa-back.ui-button {
                margin-top: 0.5rem;
            }
            .tfa-alt {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
                margin-top: 1.25rem;
                padding-top: 1rem;
                border-top: 1px solid var(--surface-border, #e5e7eb);
            }
            .tfa-alt-text {
                font-size: 0.85rem;
                color: var(--text-color-secondary, #6c757d);
            }
            .tfa-wait {
                display: block;
                width: 100%;
            }
            /* "Code sent" banner on the SMS screen */
            .tfa-sent {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin: 0.25rem 0 1.1rem 0;
                padding: 0.7rem 0.9rem;
                text-align: left;
                border-radius: 12px;
                border: 1px solid #bbf7d0;
                border-left: 4px solid #16a34a;
                background: #f0fdf4;
                animation: tfa-sent-in 0.35s ease-out;
            }
            .tfa-sent-icon {
                flex: 0 0 auto;
                width: 2.1rem;
                height: 2.1rem;
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 0.9rem;
                color: #fff;
                background: #16a34a;
            }
            .tfa-sent-text {
                display: flex;
                flex-direction: column;
                line-height: 1.3;
            }
            .tfa-sent-title {
                font-size: 0.92rem;
                color: #14532d;
            }
            .tfa-sent-title b {
                letter-spacing: 0.04em;
            }
            .tfa-sent-sub {
                font-size: 0.78rem;
                color: #4b5563;
            }
            /* "Code expired" banner: same shape, amber */
            .tfa-sent.tfa-expired {
                border-color: #fde68a;
                border-left-color: #d97706;
                background: #fffbeb;
            }
            .tfa-expired .tfa-sent-icon {
                background: #d97706;
            }
            .tfa-expired .tfa-sent-title {
                color: #78350f;
            }
            .tfa-hidden {
                display: none !important;
            }
            @keyframes tfa-sent-in {
                from { opacity: 0; transform: translateY(-6px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>

        <h:form id="frmTwoFactor">
            <div class="tfa">

                <!-- Authenticator app mode -->
                <h:panelGroup rendered="#{not twoFactorSmsController.smsMode}" layout="block">
                <div class="tfa-icon">
                    <i class="fa #{twoFactorAuthController.enrollmentNeeded ? 'fa-qrcode' : 'fa-shield-alt'}"></i>
                </div>

                <!-- First login with 2FA: link the authenticator app -->
                <h:panelGroup rendered="#{twoFactorAuthController.enrollmentNeeded}" layout="block">
                    <h:outputText value="Set up your authenticator app" class="tfa-title" />
                    <h:outputText value="Your account needs two-step verification. Link an authenticator app to continue." class="tfa-sub" />

                    <div class="tfa-steps">
                        <span class="tfa-step"><b>1</b>Install an app</span>
                        <span class="tfa-step"><b>2</b>Scan the QR code</span>
                        <span class="tfa-step"><b>3</b>Enter the code</span>
                    </div>

                    <div class="tfa-qr">
                        <h:outputText value="#{twoFactorAuthController.setupQrSvg}" escape="false" />
                    </div>
                    <div>
                        <span class="tfa-secret-box">
                            <span id="tfaSecretText" class="tfa-secret">
                                <h:outputText value="#{twoFactorAuthController.setupSecretForDisplay}" />
                            </span>
                            <p:commandButton type="button"
                                             icon="fa fa-copy"
                                             class="ui-button-secondary ui-button-flat rounded-button"
                                             title="Copy key (for manual entry)"
                                             onclick="navigator.clipboard &amp;&amp; navigator.clipboard.writeText(document.getElementById('tfaSecretText').innerText.replace(/\s/g, ''));" />
                        </span>
                    </div>
                </h:panelGroup>

                <!-- Already linked: just ask for the code -->
                <h:panelGroup rendered="#{not twoFactorAuthController.enrollmentNeeded}" layout="block">
                    <h:outputText value="Two-step verification" class="tfa-title" />
                    <h:outputText value="Open your authenticator app and enter the 6-digit code." class="tfa-sub" />
                    <span class="tfa-user">
                        <i class="fa fa-user-circle"></i>
                        <h:outputText value="#{twoFactorAuthController.pendingUserName}" />
                    </span>
                </h:panelGroup>

                <div class="d-flex justify-content-center">
                    <ez:otp_input id="txtTwoFactorCode"
                                  value="#{twoFactorAuthController.code}"
                                  required="true"
                                  requiredMessage="Enter the 6-digit code" />
                </div>
                <span class="tfa-hint">
                    <i class="fa fa-clock me-1"></i>
                    <h:outputText value="Codes refresh every 30 seconds." />
                </span>

                <p:commandButton
                    id="btnVerifyTwoFactor"
                    class="tfa-verify"
                    value="Verify"
                    icon="fa fa-check"
                    ajax="false"
                    title="Verify the code and log in"
                    action="#{twoFactorAuthController.verifyLoginCode()}" />

                <!-- Other option: code by SMS (verified mobile, or first SMS login that sets the mobile up) -->
                <h:panelGroup rendered="#{twoFactorSmsController.smsOptionAvailable}" layout="block" class="tfa-alt">
                    <h:outputText value="#{twoFactorAuthController.enrollmentNeeded ? 'No authenticator app?' : 'Cannot use your authenticator app?'}" class="tfa-alt-text" />
                    <p:commandButton
                        id="btnUseSms"
                        class="ui-button-secondary ui-button-outlined tfa-alt-btn"
                        value="#{twoFactorSmsController.mobileEntryShown or empty twoFactorSmsController.maskedMobile ? 'Log in with SMS code' : 'Send code by SMS to '.concat(twoFactorSmsController.maskedMobile)}"
                        icon="fa fa-sms"
                        ajax="false"
                        immediate="true"
                        title="Get a 6-digit login code by SMS"
                        action="#{twoFactorSmsController.chooseSms()}" />
                </h:panelGroup>
                <p:defaultCommand target="btnVerifyTwoFactor" />
                </h:panelGroup>

                <!-- SMS code mode -->
                <h:panelGroup rendered="#{twoFactorSmsController.smsMode}" layout="block">
                    <div class="tfa-icon">
                        <i class="fa fa-sms"></i>
                    </div>
                    <h:outputText value="#{twoFactorSmsController.mobileEntryShown ? 'Log in with SMS code' : 'Verify with SMS code'}" class="tfa-title" />
                    <h:panelGroup rendered="#{twoFactorSmsController.loginCodeSent}" layout="block" class="tfa-sent tfa-sent-live d-flex justify-content-center" role="status">
                        <span class="tfa-sent-icon"><i class="fa fa-paper-plane"></i></span>
                        <span class="tfa-sent-text">
                            <span class="tfa-sent-title">Code sent to <b><h:outputText value="#{twoFactorSmsController.maskedMobile}" /></b></span>
                        </span>
                    </h:panelGroup>
                    <!-- Code expired: shown by the server after an expired code is entered, or by the countdown below when it reaches zero -->
                    <h:panelGroup rendered="#{twoFactorSmsController.loginCodeSent or twoFactorSmsController.loginCodeExpired}" layout="block"
                                  class="tfa-sent tfa-expired d-flex justify-content-center #{twoFactorSmsController.loginCodeExpired ? '' : 'tfa-hidden'}" role="alert">
                        <span class="tfa-sent-icon"><i class="fa fa-hourglass-end"></i></span>
                        <span class="tfa-sent-text">
                            <span class="tfa-sent-title"><b>Code expired</b></span>
                            <span class="tfa-sent-sub">Send a new code to <h:outputText value="#{twoFactorSmsController.maskedMobile}" />.</span>
                        </span>
                    </h:panelGroup>
                    <h:outputText rendered="#{not twoFactorSmsController.loginCodeSent and not twoFactorSmsController.loginCodeExpired and not twoFactorSmsController.mobileEntryShown}"
                                  value="We will send a 6-digit code to #{twoFactorSmsController.maskedMobile}." class="tfa-sub" />
                    <h:outputText rendered="#{twoFactorSmsController.mobileEntryShown}"
                                  value="First time: enter the mobile number saved in the system for your account. If it matches, we will send a 6-digit code to it." class="tfa-sub" />
                    <span class="tfa-user">
                        <i class="fa fa-user-circle"></i>
                        <h:outputText value="#{twoFactorAuthController.pendingUserName}" />
                    </span>

                    <!-- First SMS login: mobile number -->
                    <h:panelGroup rendered="#{twoFactorSmsController.mobileEntryShown}" layout="block">
                        <p:inputText id="txtLoginMobile"
                                     value="#{twoFactorSmsController.loginMobileInput}"
                                     placeholder="Enter your mobile number"
                                     maxlength="20"
                                     autocomplete="tel"
                                     style="width: 100%; text-align: center; font-size: 1.1rem;" />
                        <span class="tfa-wait" data-wait="#{twoFactorSmsController.resendSecondsLeft}">
                            <p:commandButton
                                id="btnSendFirstSms"
                                class="tfa-verify"
                                value="Send code"
                                icon="fa fa-paper-plane"
                                ajax="false"
                                title="Send a 6-digit code to this mobile number"
                                action="#{twoFactorSmsController.sendLoginCode()}" />
                        </span>
                        <p:defaultCommand target="btnSendFirstSms" />
                    </h:panelGroup>

                    <h:panelGroup rendered="#{twoFactorSmsController.loginCodeSent}" layout="block" class="tfa-code-area">
                        <div class="d-flex justify-content-center">
                            <ez:otp_input id="txtSmsCode"
                                          value="#{twoFactorSmsController.code}"
                                          required="true"
                                          requiredMessage="Enter the 6-digit code from the SMS" />
                        </div>
                        <span class="tfa-hint">
                            <i class="fa fa-clock me-1"></i>
                            <!-- At zero the script swaps in the "Code expired" banner (no separate expired text here) -->
                            <span class="tfa-countdown" data-seconds="#{twoFactorSmsController.codeSecondsLeft}"
                                  data-prefix="Code expires in "></span>
                        </span>

                        <p:commandButton
                            id="btnVerifySms"
                            class="tfa-verify"
                            value="Verify"
                            icon="fa fa-check"
                            ajax="false"
                            title="Verify the SMS code and log in"
                            action="#{twoFactorSmsController.verifyLoginCode()}" />
                        <p:defaultCommand target="btnVerifySms" />
                    </h:panelGroup>

                    <div class="tfa-alt">
                        <h:panelGroup rendered="#{not twoFactorSmsController.mobileEntryShown}">
                            <span class="tfa-wait" data-wait="#{twoFactorSmsController.resendSecondsLeft}">
                                <p:commandButton
                                    id="btnSendSms"
                                    class="tfa-resend #{twoFactorSmsController.loginCodeSent ? 'ui-button-secondary ui-button-flat' : 'tfa-verify'}"
                                    value="#{twoFactorSmsController.loginCodeSent ? 'Resend code' : 'Send code'}"
                                    icon="fa fa-redo"
                                    ajax="false"
                                    immediate="true"
                                    title="Send a new code (the earlier code stops working)"
                                    action="#{twoFactorSmsController.sendLoginCode()}" />
                            </span>
                        </h:panelGroup>
                        <p:commandButton
                            rendered="#{twoFactorSmsController.authenticatorOptionAvailable}"
                            class="ui-button-secondary ui-button-flat"
                            value="Use authenticator app instead"
                            icon="fa fa-shield-alt"
                            ajax="false"
                            immediate="true"
                            title="Use an authenticator app code instead"
                            action="#{twoFactorSmsController.useAuthenticator()}" />
                    </div>
                    <span class="tfa-hint">
                        <i class="fa fa-exclamation-triangle me-1"></i>
                        <h:outputText value="#{twoFactorSmsController.mobileEntryShown ? 'A wrong mobile number counts toward the account lock' : 'Wrong codes count toward the account lock'} (#{twoFactorAuthController.maxFailedAttempts} wrong attempts lock the account)." />
                    </span>
                </h:panelGroup>

                <p:commandButton
                    class="tfa-back ui-button-secondary ui-button-flat"
                    value="Back to Login"
                    icon="fa fa-arrow-left"
                    ajax="false"
                    immediate="true"
                    title="Use a different account"
                    action="#{twoFactorAuthController.cancelLogin()}" >
                </p:commandButton>
            </div>
            <script>
                //<![CDATA[
                (function () {
                    function fmt(s) {
                        var m = Math.floor(s / 60), r = s % 60;
                        return m + ':' + (r < 10 ? '0' : '') + r;
                    }
                    // At expiry: swap the "Code sent" banner for "Code expired", hide the code boxes
                    // and make Resend the main button (one message only, no pop-up)
                    function showExpired(el) {
                        var root = el.closest('.tfa') || document;
                        Array.prototype.forEach.call(root.querySelectorAll('.tfa-sent-live, .tfa-code-area'), function (n) {
                            n.classList.add('tfa-hidden');
                        });
                        Array.prototype.forEach.call(root.querySelectorAll('.tfa-expired'), function (n) {
                            n.classList.remove('tfa-hidden');
                        });
                        Array.prototype.forEach.call(root.querySelectorAll('.tfa-resend'), function (b) {
                            b.classList.remove('ui-button-secondary', 'ui-button-flat');
                            b.classList.add('tfa-verify');
                        });
                    }
                    // Code expiry countdown
                    Array.prototype.forEach.call(document.querySelectorAll('.tfa-countdown'), function (el) {
                        var s = parseInt(el.getAttribute('data-seconds'), 10) || 0;
                        var tick = function () {
                            if (s <= 0) {
                                clearInterval(t);
                                showExpired(el);
                                return;
                            }
                            el.textContent = el.getAttribute('data-prefix') + fmt(s);
                            s--;
                        };
                        var t = setInterval(tick, 1000);
                        tick();
                    });
                    // Resend button stays disabled until the cooldown is over
                    Array.prototype.forEach.call(document.querySelectorAll('.tfa-wait'), function (wrap) {
                        var s = parseInt(wrap.getAttribute('data-wait'), 10) || 0;
                        var btn = wrap.querySelector('button');
                        if (s <= 0 || !btn) {
                            return;
                        }
                        var label = btn.querySelector('.ui-button-text');
                        var text = label ? label.textContent : '';
                        btn.disabled = true;
                        btn.classList.add('ui-state-disabled');
                        var tick = function () {
                            if (s <= 0) {
                                clearInterval(t);
                                btn.disabled = false;
                                btn.classList.remove('ui-state-disabled');
                                if (label) {
                                    label.textContent = text;
                                }
                                return;
                            }
                            if (label) {
                                label.textContent = text + ' (' + s + 's)';
                            }
                            s--;
                        };
                        var t = setInterval(tick, 1000);
                        tick();
                    });
                })();
                //]]>
            </script>
        </h:form>
    </cc:implementation>
</html>
