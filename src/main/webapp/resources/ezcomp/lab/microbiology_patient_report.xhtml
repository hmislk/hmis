<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:fn="http://java.sun.com/jsp/jstl/functions"

      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="showBackground" type="java.lang.Boolean" default="false"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <style>
            /* Collapse the default paragraph/list margins that the rich-text
               (Quill) editor adds, so multi-line memo results are not spaced out. */
            .micMemoValue p,
            .micMemoValue ol,
            .micMemoValue ul {
                margin: 0;
                padding: 0;
            }
            .micMemoValue {
                line-height: 1.45;
                /* Preserve consecutive spaces typed in the result while still
                   wrapping long lines, so extra in-line spacing is not collapsed. */
                white-space: pre-wrap;
            }
            /* Reproduce the Quill editor's indentation in the printed/preview
               report. The editor applies these ql-indent-* classes on the block
               when the indent toolbar buttons are used, but Quill's own CSS that
               gives them padding is scoped to .ql-editor and is not present here,
               so the indent is lost. The longhand padding-left overrides the
               padding:0 reset above (higher specificity). Values match Quill's
               default of 3em per indent level. */
            /* Auto-aligned label:value grid for memo lines split by
               PatientReportItemValue#getLobValueLinesAligned(). Grid's first
               two columns size themselves to the widest label/colon
               actually present in this memo block, so every line's colon
               lines up without a hardcoded width - the alignment holds
               however long the longest label turns out to be. Lines with no
               ":" (.micLineFull) just span the full row untouched. */
            .micMemoValue .micLineGrid {
                display: grid;
                grid-template-columns: minmax(0, max-content) max-content 1fr;
                column-gap: 0;
            }
            .micMemoValue .micLineLabel {
                grid-column: 1;
                overflow-wrap: break-word;
            }
            .micMemoValue .micLineSep { grid-column: 2; padding: 0 16px; }
            .micMemoValue .micLineValue { grid-column: 3; }
            .micMemoValue .micLineFull { grid-column: 1 / -1; }
            .micMemoValue .ql-indent-1 { padding-left: 3em; }
            .micMemoValue .ql-indent-2 { padding-left: 6em; }
            .micMemoValue .ql-indent-3 { padding-left: 9em; }
            .micMemoValue .ql-indent-4 { padding-left: 12em; }
            .micMemoValue .ql-indent-5 { padding-left: 15em; }
            .micMemoValue .ql-indent-6 { padding-left: 18em; }
            .micMemoValue .ql-indent-7 { padding-left: 21em; }
            .micMemoValue .ql-indent-8 { padding-left: 24em; }
        </style>

                <!-- Page number ("Page 1 of 2"), shown just below the data-area bottom
                     limit line (75% by default). Text and top position are set by
                     micPaginateReport(); format and font/side come from config. -->
                <div class="micPageNo"
                     data-format="#{configOptionApplicationController.getShortTextValueByKey('Microbiology Lab Report Page Number Format', 'Page {page} of {total}')}"
                     style="position: absolute; top: 75.5%; z-index: 950; font-family: Cambria, Georgia, serif; #{configOptionApplicationController.getShortTextValueByKey('Microbiology Lab Report Page Number Text Style', 'right: 4%; font-size: 12px;')}"></div>
            </div>
            <script>
                /*
                 * Splits the microbiology report over several A4 pages.
                 * Page 1 holds report rows (.micBlock) down to the data-area
                 * bottom limit (data-bottom-limit, % of the page height, default
                 * 75). The first row that ends below it, and every row after it,
                 * move to a new page: a copy of page 1 (letterhead, header,
                 * watermark) with an empty data area. Repeats for page 3 and on.
                 * Extra pages get .labReportNext, so Print page-breaks them and
                 * Export PDF (labReportTrimPdf) makes one PDF page per box.
                 * Positions are compared as fractions of the page height, so a
                 * scaled (mobile) preview measures the same.
                 */
                (function () {
                    if (window.micPaginateReport) {
                        return;
                    }
                    var moved = [];

                    function restore() {
                        moved.forEach(function (m) {
                            if (m.placeholder.isConnected) {
                                m.placeholder.parentNode.replaceChild(m.block, m.placeholder);
                            }
                        });
                        moved = [];
                        document.querySelectorAll('.micPageCont').forEach(function (p) {
                            p.parentNode.removeChild(p);
                        });
                    }

                    // A new page is a full copy of page 1 (letterhead, header, title,
                    // external images, watermark, page number ...) with only the
                    // result rows (.micBlock) taken out; the moved rows go into
                    // .micPageBody at the top of the results area.
                    function makePage(page1, pageNo) {
                        var page = page1.cloneNode(true);
                        page.querySelectorAll('[id]').forEach(function (e) {
                            e.removeAttribute('id');
                        });
                        page.id = 'divReportM_p' + pageNo;
                        page.classList.add('labReportNext', 'micPageCont');
                        page.querySelectorAll('.micBlock').forEach(function (b) {
                            b.parentNode.removeChild(b);
                        });
                        var holder = page.querySelector('.micDataShell') || page.querySelector('.micDataArea');
                        var body = document.createElement('div');
                        body.className = 'micPageBody';
                        body.style.width = '100%';
                        body.style.display = 'flow-root';
                        holder.insertBefore(body, holder.firstChild);
                        return page;
                    }

                    function bottomLimitPercent(page) {
                        var limit = parseFloat(page.getAttribute('data-bottom-limit'));
                        return (limit > 0 &amp;&amp; limit !== Infinity &amp;&amp; !(limit > 100)) ? limit : 75;
                    }

                    function setPageNumbers() {
                        var pages = Array.prototype.slice.call(document.querySelectorAll('#divReportM, .micPageCont'));
                        pages.forEach(function (pg, i) {
                            var el = pg.querySelector('.micPageNo');
                            if (!el) {
                                return;
                            }
                            // just below the data-area bottom limit line
                            el.style.top = (bottomLimitPercent(pg) + 0.5) + '%';
                            el.style.bottom = 'auto';
                            var fmt = el.getAttribute('data-format') || 'Page {page} of {total}';
                            el.textContent = fmt.replace('{page}', String(i + 1)).replace('{total}', String(pages.length));
                        });
                    }

                    window.micPaginateReport = function () {
                        restore();
                        setPageNumbers();
                        var page1 = document.getElementById('divReportM');
                        if (!page1) {
                            return;
                        }
                        var data = page1.querySelector('.micDataArea');
                        if (!data || page1.getBoundingClientRect().height === 0) {
                            return;
                        }
                        var limit = bottomLimitPercent(page1) / 100;

                        var blocks = Array.prototype.slice.call(data.querySelectorAll('.micBlock'));
                        var current = page1;
                        var start = 0;
                        var pageNo = 1;
                        while (start !== blocks.length) {
                            var r = current.getBoundingClientRect();
                            var cut = -1;
                            for (var i = start; i !== blocks.length; i++) {
                                var b = blocks[i].getBoundingClientRect();
                                if (b.height === 0) {
                                    continue;
                                }
                                if ((b.bottom - r.top) / r.height > limit + 0.0001) {
                                    cut = i;
                                    break;
                                }
                            }
                            if (cut === -1) {
                                break;
                            }
                            // A row taller than a whole page stays alone on its page.
                            if (cut === start &amp;&amp; current !== page1) {
                                cut = start + 1;
                                if (cut === blocks.length) {
                                    break;
                                }
                            }
                            pageNo++;
                            var page = makePage(page1, pageNo);
                            current.parentNode.insertBefore(page, current.nextSibling);
                            var body = page.querySelector('.micPageBody');
                            for (var j = cut; j !== blocks.length; j++) {
                                var blk = blocks[j];
                                if (!blk.micPlaceholder || !blk.micPlaceholder.isConnected) {
                                    var ph = document.createComment('micBlock');
                                    blk.parentNode.insertBefore(ph, blk);
                                    blk.micPlaceholder = ph;
                                    moved.push({placeholder: ph, block: blk});
                                }
                                body.appendChild(blk);
                            }
                            current = page;
                            start = cut;
                            if (pageNo > 20) {
                                break;
                            }
                        }
                        setPageNumbers();
                        if (typeof window.micFitPreview === 'function') {
                            window.micFitPreview();
                        }
                    };

                    function run() {
                        window.micPaginateReport();
                    }
                    window.addEventListener('load', run);
                    if (document.fonts &amp;&amp; document.fonts.ready) {
                        document.fonts.ready.then(run);
                    }
                    if (window.jQuery) {
                        jQuery(document).on('pfAjaxComplete', run);
                    }
                })();
                if (document.readyState === 'complete') {
                    window.micPaginateReport();
                }
            </script>
        </h:panelGroup>
    </cc:implementation>
</html>
