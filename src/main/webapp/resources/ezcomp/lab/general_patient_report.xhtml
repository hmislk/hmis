<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ez="http://xmlns.jcp.org/jsf/composite/ezcomp"
      xmlns:lab="http://xmlns.jcp.org/jsf/composite/ezcomp/lab"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="showBackground" type="java.lang.Boolean" default="false"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:panelGroup rendered="#{patientReportController.currentPatientReport.item.reportType eq 'General'}"  >
            <div id="divReport"  class="labReport" style="height: 297mm;" >
                <ez:common_report 
                    showBackground="#{(patientReportController.showBackground or cc.attrs.showBackground) and not (patientReportController.currentReportMultiPage and patientReportController.getPageSettings(1).background eq 'none')}"
                    commonReportFormat="#{patientReportController.currentPatientReport.reportFormat}"
                    patientReport="#{patientReportController.currentPatientReport}"
                    pageNo="#{patientReportController.currentReportMultiPage ? 1 : null}"
                    backgroundOnly="#{patientReportController.currentReportMultiPage and not patientReportController.getPageSettings(1).commonReport}"/>

                <lab:report_items_of_page page="1"/>

                <h:outputText
                    rendered="#{not empty patientReportController.getPageNumberText(1)}"
                    value="#{patientReportController.getPageNumberText(1)}"
                    style="#{patientReportController.getPageNumberStyle(1)}"
                    escape="false"/>
            </div>

            <!-- Pages 2..N of a multi-page report; nothing is drawn for a single-page report. -->
            <ui:repeat value="#{patientReportController.extraPageNumbers}" var="pg">
                <div id="divReport_p#{pg}" class="labReport labReportNext" style="height: 297mm;" >
                    <ez:common_report
                        showBackground="#{(patientReportController.showBackground or cc.attrs.showBackground) and patientReportController.getPageSettings(pg).background ne 'none'}"
                        commonReportFormat="#{patientReportController.currentPatientReport.reportFormat}"
                        patientReport="#{patientReportController.currentPatientReport}"
                        pageNo="#{pg}"
                        backgroundPage="#{patientReportController.getPageSettings(pg).background eq 'page1' ? 1 : pg}"
                        backgroundOnly="#{not patientReportController.getPageSettings(pg).commonReport}"/>

                    <lab:report_items_of_page page="#{pg}"/>

                    <h:outputText
                        rendered="#{not empty patientReportController.getPageNumberText(pg)}"
                        value="#{patientReportController.getPageNumberText(pg)}"
                        style="#{patientReportController.getPageNumberStyle(pg)}"
                        escape="false"/>
                </div>
            </ui:repeat>
            
        </h:panelGroup>
    </cc:implementation>
</html>
