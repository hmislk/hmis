<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <cc:interface>
        <cc:attribute name="layout" type="com.divudi.core.data.PvcCardLayout" required="true"/>
        <cc:attribute name="backgroundExternalUrl" type="java.lang.String"/>
        <cc:attribute name="side" type="java.lang.String" required="true"/>
        <cc:attribute name="patient" type="com.divudi.core.entity.Patient" required="true"/>
    </cc:interface>

    <cc:implementation>
        <!-- Page box. Without a page (pageWidthMm/pageHeightMm = 0) the page is the card: it is
             card-sized and the printer leaves marginMm on every side, so this box is the card
             minus the margins and anything under the margin is clipped.
             With a page (e.g. A4 for a disc/ID card tray) it is the whole page, and the card is
             placed on it by cardLeftMm/cardTopMm and rotationDeg. -->
        <h:panelGroup layout="block"
                      style="position:relative; overflow:hidden; width:#{cc.attrs.layout.placedOnPage ? cc.attrs.layout.pageWidthMm : cc.attrs.layout.widthMm - 2 * cc.attrs.layout.marginMm}mm; height:#{cc.attrs.layout.placedOnPage ? cc.attrs.layout.pageHeightMm : cc.attrs.layout.heightMm - 2 * cc.attrs.layout.marginMm}mm; page:#{cc.attrs.side};">

            <!-- body margin/padding would push the card past the page and spill onto a second, default-size page -->
            <h:outputText escape="false" value="&lt;style&gt;@page #{cc.attrs.side} { size: #{cc.attrs.layout.placedOnPage ? cc.attrs.layout.pageWidthMm : cc.attrs.layout.widthMm}mm #{cc.attrs.layout.placedOnPage ? cc.attrs.layout.pageHeightMm : cc.attrs.layout.heightMm}mm; margin: #{cc.attrs.layout.placedOnPage ? 0 : cc.attrs.layout.marginMm}mm; } @media print { html, body { margin: 0 !important; padding: 0 !important; min-height: 0 !important; height: auto !important; } .pvc-card-outline { outline: none !important; } }&lt;/style&gt;"/>

            <!-- holder: the rotated card's bounding box (the printable area when there is no page) -->
            <h:panelGroup layout="block"
                          style="position:absolute; left:#{cc.attrs.layout.placedOnPage ? cc.attrs.layout.cardLeftMm : 0}mm; top:#{cc.attrs.layout.placedOnPage ? cc.attrs.layout.cardTopMm : 0}mm; width:#{cc.attrs.layout.placedOnPage ? cc.attrs.layout.placedWidthMm : cc.attrs.layout.widthMm - 2 * cc.attrs.layout.marginMm}mm; height:#{cc.attrs.layout.placedOnPage ? cc.attrs.layout.placedHeightMm : cc.attrs.layout.heightMm - 2 * cc.attrs.layout.marginMm}mm;">

            <!-- the full card, centred in the holder and rotated about its centre -->
            <h:panelGroup layout="block" styleClass="pvc-card-outline"
                          style="position:absolute; left:50%; top:50%; width:#{cc.attrs.layout.widthMm}mm; height:#{cc.attrs.layout.heightMm}mm; transform:translate(-50%, -50%) rotate(#{cc.attrs.layout.placedOnPage ? cc.attrs.layout.rotationDeg : 0}deg); outline:1px dashed #9e9e9e;">

            <!-- printable area: the card minus the margins the printer leaves blank -->
            <h:panelGroup layout="block"
                          style="position:absolute; left:#{cc.attrs.layout.marginMm}mm; top:#{cc.attrs.layout.marginMm}mm; width:#{cc.attrs.layout.widthMm - 2 * cc.attrs.layout.marginMm}mm; height:#{cc.attrs.layout.heightMm - 2 * cc.attrs.layout.marginMm}mm; overflow:hidden;">

            <!-- full card, shifted back by the margin so slot positions and the background stay
                 measured from the physical card edge -->
            <h:panelGroup layout="block"
                          style="position:absolute; left:-#{cc.attrs.layout.marginMm}mm; top:-#{cc.attrs.layout.marginMm}mm; width:#{cc.attrs.layout.widthMm}mm; height:#{cc.attrs.layout.heightMm}mm;">

            <h:panelGroup layout="block" rendered="#{not empty cc.attrs.backgroundExternalUrl}"
                          style="position:absolute; top:0; left:0; width:100%; height:100%;">
                <p:graphicImage value="#{cc.attrs.backgroundExternalUrl}" cache="false"
                                 style="width:100%; height:100%; object-fit:cover;"/>
            </h:panelGroup>
            <h:panelGroup layout="block" rendered="#{empty cc.attrs.backgroundExternalUrl and pvcCardBackgroundViewController.hasStream(cc.attrs.side)}"
                          style="position:absolute; top:0; left:0; width:100%; height:100%;">
                <p:graphicImage value="#{pvcCardBackgroundViewController.stream}" cache="false"
                                 style="width:100%; height:100%; object-fit:cover;">
                    <f:param name="side" value="#{cc.attrs.side}"/>
                </p:graphicImage>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['institutionName'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['institutionName'].leftMm}mm; top:#{cc.attrs.layout.slots['institutionName'].topMm}mm; font-size:#{cc.attrs.layout.slots['institutionName'].fontSizePt}pt; color:#{cc.attrs.layout.slots['institutionName'].fontColor};">
                <h:outputText value="#{sessionController.institution.name}"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['departmentName'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['departmentName'].leftMm}mm; top:#{cc.attrs.layout.slots['departmentName'].topMm}mm; font-size:#{cc.attrs.layout.slots['departmentName'].fontSizePt}pt; color:#{cc.attrs.layout.slots['departmentName'].fontColor};">
                <h:outputText value="#{sessionController.department.name}"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['name'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['name'].leftMm}mm; top:#{cc.attrs.layout.slots['name'].topMm}mm; font-size:#{cc.attrs.layout.slots['name'].fontSizePt}pt; color:#{cc.attrs.layout.slots['name'].fontColor};">
                <h:outputText value="#{cc.attrs.patient.person.nameWithTitle}"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['dob'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['dob'].leftMm}mm; top:#{cc.attrs.layout.slots['dob'].topMm}mm; font-size:#{cc.attrs.layout.slots['dob'].fontSizePt}pt; color:#{cc.attrs.layout.slots['dob'].fontColor};">
                <h:outputText value="#{cc.attrs.patient.person.dob}">
                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                </h:outputText>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['phone'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['phone'].leftMm}mm; top:#{cc.attrs.layout.slots['phone'].topMm}mm; font-size:#{cc.attrs.layout.slots['phone'].fontSizePt}pt; color:#{cc.attrs.layout.slots['phone'].fontColor};">
                <h:outputText value="#{cc.attrs.patient.person.phone}"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['gender'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['gender'].leftMm}mm; top:#{cc.attrs.layout.slots['gender'].topMm}mm; font-size:#{cc.attrs.layout.slots['gender'].fontSizePt}pt; color:#{cc.attrs.layout.slots['gender'].fontColor};">
                <h:outputText value="#{cc.attrs.patient.person.sex}"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['address'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['address'].leftMm}mm; top:#{cc.attrs.layout.slots['address'].topMm}mm; font-size:#{cc.attrs.layout.slots['address'].fontSizePt}pt; color:#{cc.attrs.layout.slots['address'].fontColor};">
                <h:outputText value="#{cc.attrs.patient.person.address}"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['barcode'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['barcode'].leftMm}mm; top:#{cc.attrs.layout.slots['barcode'].topMm}mm;">
                <!-- inline SVG stretched to the configured width x height; p:barcode only for types it can't draw (e.g. qr) -->
                <h:outputText escape="false"
                              value="#{pvcCardLayoutController.barcodeSvg(cc.attrs.layout.slots['barcode'], cc.attrs.patient.phn)}"
                              rendered="#{pvcCardLayoutController.barcodeSvg(cc.attrs.layout.slots['barcode'], cc.attrs.patient.phn) ne null}"/>
                <p:barcode rendered="#{pvcCardLayoutController.barcodeSvg(cc.attrs.layout.slots['barcode'], cc.attrs.patient.phn) eq null}"
                           value="#{cc.attrs.patient.phn}"
                           type="#{cc.attrs.layout.slots['barcode'].type}"
                           format="svg" hrp="none" cache="false"
                           width="#{cc.attrs.layout.slots['barcode'].widthMm * 3.78}"
                           height="#{cc.attrs.layout.slots['barcode'].heightMm * 3.78}"/>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.layout.slots['phn'].visible}"
                          style="position:absolute; left:#{cc.attrs.layout.slots['phn'].leftMm}mm; top:#{cc.attrs.layout.slots['phn'].topMm}mm; font-size:#{cc.attrs.layout.slots['phn'].fontSizePt}pt; color:#{cc.attrs.layout.slots['phn'].fontColor};">
                <h:outputText value="#{cc.attrs.patient.phn}"/>
            </h:panelGroup>

            </h:panelGroup>
            </h:panelGroup>
            </h:panelGroup>
            </h:panelGroup>
        </h:panelGroup>
    </cc:implementation>
</html>
