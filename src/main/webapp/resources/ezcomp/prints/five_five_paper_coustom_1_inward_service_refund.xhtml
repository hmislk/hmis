<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <cc:interface>
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" />
        <cc:attribute name="duplicate" type="java.lang.Boolean" default="false" />
        <cc:attribute name="cancelled" type="java.lang.Boolean" default="false" />
    </cc:interface>

    <cc:implementation>

        <h:outputStylesheet library="css" name="inward_five_five.css" />

        <div class="fiveinchbill">

            <div class="institutionName">
                <h:outputLabel style="font-size: 14pt"
                               value="#{cc.attrs.bill.department.printingName}" />
            </div>

            <div class="institutionContact">
                <div>
                    <h:outputLabel value="#{cc.attrs.bill.department.address}" />
                </div>
                <div>
                    <h:outputLabel style="font-size: 9pt"
                                   value="Tel : #{cc.attrs.bill.department.telephone1}" />
                </div>
                <div>
                    <h:outputLabel style="font-size: 9pt"
                                   value="Email : #{cc.attrs.bill.department.email}" />
                </div>
                <div>
                    <h:outputLabel style="font-size: 9pt"
                                   value="Web : #{cc.attrs.bill.institution.web}" />
                </div>
            </div>

            <div class="headingBillFiveFive">
                <h:outputLabel value="INWARD RECEIPT" />

                <h:panelGroup rendered="#{cc.attrs.duplicate eq true}">
                    <br />
                    <h:outputLabel value="**Duplicate**" />
                </h:panelGroup>

                <h:panelGroup rendered="#{cc.attrs.cancelled eq true}">
                    <br />
                    <h:outputLabel value="**Cancelled**" />
                </h:panelGroup>
            </div>

            <hr />

            <div class="billDetailsFiveFive">
                <table>
                    <tr>
                        <td class="bill-label">Name</td>
                        <td class="bill-colon">:</td>

                        <td colspan="4" class="bill-value">
                            <h:outputLabel value="#{cc.attrs.bill.patient.person.nameWithTitle}" />
                        </td>
                    </tr>
                    
                    <tr>
                        <td class="bill-label-right">
                            <h:outputLabel value="Bill No" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value">
                            <h:outputLabel value="#{cc.attrs.bill.deptId}" />
                        </td>
                    </tr>
                    <tr>
                        <td class="bill-label">
                            <h:outputLabel value="Age" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value">
                            <h:outputLabel value="#{cc.attrs.bill.patient.age}" />
                        </td>
                    </tr>
                    <tr>
                        <td class="bill-label-right">
                            <h:outputLabel value="Bill Date" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value-right">
                            <h:outputLabel value="#{cc.attrs.bill.createdAt}">
                                <f:convertDateTime pattern="dd/MMM/yyyy" />
                            </h:outputLabel>
                        </td>
                        <td class="bill-label-right">
                            <h:outputLabel value="Bill Time" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value-right">
                            <h:outputLabel value="#{cc.attrs.bill.createdAt}">
                                <f:convertDateTime timeZone="Asia/Colombo" pattern="hh:mm a" />
                            </h:outputLabel>
                        </td>
                    </tr>

                    <tr>
                        <td class="bill-label">
                            <h:outputLabel value="PHN" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value">
                            <h:outputLabel value="#{cc.attrs.bill.patient.phn}" />
                        </td>
                        <td class="bill-label">
                            <h:outputLabel value="Gender" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value">
                            <h:outputLabel value="#{cc.attrs.bill.patient.person.sex}" />
                        </td>
                    </tr>

                    <tr>

                        <td class="bill-label">
                            <h:outputLabel value="BHT No" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value">
                            <h:outputLabel value="#{cc.attrs.bill.patientEncounter.bhtNo}" />
                        </td>
                        <td class="bill-label-right">
                            <h:outputLabel value="Room No" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value-right">
                            <h:outputLabel value="#{cc.attrs.bill.patientEncounter.currentPatientRoom.roomFacilityCharge.room.name}" />
                        </td>
                    </tr>

                    <tr>



                        <td class="bill-label">
                            <h:outputLabel value="Phone" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value">
                            <h:outputLabel value="#{cc.attrs.bill.patient.person.phone}" />
                        </td>
                        <td class="bill-label-right">
                            <h:outputLabel value="Batch Bill" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value-right">
                            <h:outputLabel value="#{cc.attrs.bill.backwardReferenceBill.deptId}" />
                        </td>
                    </tr>

                    <tr>
                        <td class="bill-label-right">
                            <h:outputLabel value="Referred By" />
                        </td>
                        <td class="bill-colon">:</td>
                        <td class="bill-value-right">
                            <h:outputLabel value="#{cc.attrs.bill.referredBy.person.nameWithTitle}" />
                        </td>
                    </tr>

                </table>
            </div>

            <h:panelGroup rendered="#{sessionController.loggedPreference.printBarcodeInOpdBill or true}">
                <div class="billline">
                    <div style="width: 100%; text-align: center; font-size: 10px;">
                        <p:barcode value="#{cc.attrs.bill.idStr}" type="code39" cache="false" />
                    </div>
                </div>
            </h:panelGroup>

            <hr />

            <div class="itemHeadingsFiveFive">
                <table width="100%" style="width: 100%;">
                    <tr>
                        <td style="width: 65%; text-align: left;">
                            <h:outputLabel value="ITEM" styleClass="itemHeadingsFiveFive" />
                        </td>
                        <td style="width: 35%; text-align: right;">
                            <h:outputLabel value="VALUE" styleClass="itemHeadingsFiveFive" />
                        </td>
                    </tr>

                    <ui:repeat value="#{billBeanController.fetchBillItems(cc.attrs.bill)}" var="bip">
                        <tr>
                            <td style="text-align: left;">
                                <h:outputLabel class="itemsBlockRightFiveFive"
                                               value="#{bip.item.printName}"
                                               style="text-transform: capitalize !important;" />
                            </td>

                            <h:panelGroup rendered="#{webUserController.hasPrivilege('ShowServiceCharges')}">
                                <td style="text-align: right;">
                                    <h:outputLabel class="itemsBlockRightFiveFive"
                                                   value="#{bip.grossValue}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                </td>
                            </h:panelGroup>
                        </tr>
                    </ui:repeat>
                </table>
            </div>

            <hr />

            <h:panelGroup rendered="#{webUserController.hasPrivilege('ShowServiceCharges')}">
                <div class="d-flex justify-content-center">
                    <table width="90%" style="width: 90%;">

                        <tr class="totalsBlock" style="font-weight: 600;">
                            <td style="width: 80%; text-align: left;">
                                <h:outputLabel value="Total" />
                            </td>
                            <td style="width: 20%; text-align: right;">
                                <h:outputLabel value="#{cc.attrs.bill.total}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>

                        <tr class="totalsBlock" style="font-weight: 600;">
                            <td style="text-align: left;">
                                <h:outputLabel value="Discount" />
                            </td>
                            <td style="text-align: right;">
                                <h:outputLabel value="#{cc.attrs.bill.discount}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>

                        <tr class="totalsBlock" style="font-weight: 600;">
                            <td style="text-align: left;">
                                <h:outputLabel value="Net Total" />
                            </td>
                            <td style="text-align: right;">
                                <h:outputLabel value="#{cc.attrs.bill.netTotal}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>

                        <tr class="totalsBlock" style="font-weight: 600;">
                            <td style="text-align: left;">
                                <h:outputLabel value="VAT" />
                            </td>
                            <td style="text-align: right;">
                                <h:outputLabel value="#{cc.attrs.bill.vat}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>

                    </table>
                </div>
            </h:panelGroup>

            <div style="width: 90%; margin-top: 10px; margin-left: 5%; font-size: 9pt;">
                <div class="d-flex justify-content-between w-100">
                    <h:outputLabel value="Generated By : #{sessionController.loggedUser.name}" />
                    <h:outputLabel value="Cashier : #{cc.attrs.bill.creater.name}" />
                </div>
            </div>

            <h:panelGroup rendered="#{cc.attrs.bill.paymentMethod eq 'Card'}">
                <div style="margin-top: 4px; font-size: 8pt; margin-left: 5%;">
                    <h:outputLabel value="Payments : #{cc.attrs.bill.paymentMethod.label}" />

                    <ui:repeat value="#{billSearch.fetchBillPayments(cc.attrs.bill)}" var="p">
                        <div class="d-flex gap-3">
                            <div>
                                <h:outputLabel value="#{p.paymentMethod}" />
                            </div>
                            <div>
                                <h:outputLabel value="( #{p.creditCardRefNo} )" />
                            </div>
                            <div>
                                <h:outputLabel value="#{p.paidValue}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </div>
                        </div>
                    </ui:repeat>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{cc.attrs.bill.paymentMethod eq 'MultiplePaymentMethods'}">
                <div style="margin-top: 4px; font-size: 8pt; margin-left: 5%;">
                    <h:outputLabel value="Payment : #{cc.attrs.bill.paymentMethod.label}" />

                    <ui:repeat value="#{billSearch.fetchBillPayments(cc.attrs.bill)}" var="p">
                        <div class="d-flex align-items-center">
                            <div>
                                <h:outputLabel value="#{p.paymentMethod}" />
                            </div>
                            <div class="mx-2">
                                <h:outputLabel value="#{p.paidValue}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </div>
                        </div>
                    </ui:repeat>
                </div>
            </h:panelGroup>

            <div class="footer">
                <br />
                <h:outputLabel value="#{sessionController.userPreference.pharmacyBillFooter}" />
                <br />
            </div>

        </div>

    </cc:implementation>
</html>
