<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!--
        Shared "Generated by/on" + "Approved by/on" signature-style footer
        stamp for Inward Final Bill print templates. Included INSIDE each
        finalBillXxx.xhtml composite (near its own "Prepared by" line) -
        this is bill-body content, not a page banner.

        "Generated by/on" = who is printing THIS copy, right now (always
        shown). Distinct from "Prepared by" (bill.creater = who created the
        bill record).

        "Approved by/on" = Bill.approveUser/approveAt, set by
        InwardSearch.approveFinalBillVersion(). Shown only once approved.
    -->
    <cc:interface>
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" required="true"/>
    </cc:interface>

    <cc:implementation>
        <div style="font-size: 11px; white-space: nowrap;">
            <h:outputLabel value="Generated by : " style="font-weight: 500;"/>
            <h:outputLabel value="#{sessionController.loggedUser.name}"/>
        </div>
        <div style="font-size: 11px; white-space: nowrap;">
            <h:outputLabel value="Generated on : " style="font-weight: 500;"/>
            <h:outputLabel value="#{sessionController.currentDate}">
                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
            </h:outputLabel>
        </div>
        <h:panelGroup layout="block" rendered="#{cc.attrs.bill ne null and cc.attrs.bill.approveAt ne null}">
            <div style="font-size: 11px; white-space: nowrap;">
                <h:outputLabel value="Approved by : " style="font-weight: 500;"/>
                <h:outputLabel value="#{cc.attrs.bill.approveUser.name}"/>
            </div>
            <div style="font-size: 11px; white-space: nowrap;">
                <h:outputLabel value="Approved on : " style="font-weight: 500;"/>
                <h:outputLabel value="#{cc.attrs.bill.approveAt}">
                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                </h:outputLabel>
            </div>
        </h:panelGroup>
    </cc:implementation>
</html>
