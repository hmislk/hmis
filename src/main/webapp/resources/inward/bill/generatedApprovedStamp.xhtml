<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!--
        Shared "Generated by/on" + "Approved by/on" signature-style footer
        stamp for Inward Final Bill print templates. Included INSIDE each
        finalBillXxx.xhtml composite (near its own "Prepared by" line) -
        this is bill-body content, not a page banner.

        LAYOUT: two independent, left-aligned segments printed side by side -
        Generated first, Approved immediately after it - two lines each.
        Host templates give it a full-width, left-aligned row of its own; it
        must not be dropped into a centred/signature column.

        "Generated by/on" = who is printing THIS copy, right now. Distinct
        from "Prepared by" (bill.creater = who created the bill record).

        "Approved by/on" = Bill.approveUser/approveAt, set by
        InwardSearch.approveFinalBillVersion(). Shown only once approved.

        Each segment prints by default and is suppressed independently by its
        own ConfigOption, so a hospital can drop one or both without a code
        change (see PRINT_GENERATED_BY / PRINT_APPROVED_BY below).
    -->
    <cc:interface>
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" required="true"/>
    </cc:interface>

    <cc:implementation>
        <div style="display: flex; flex-wrap: wrap; column-gap: 32px; row-gap: 4px; justify-content: flex-start; text-align: left; font-size: 11px;">

            <h:panelGroup layout="block"
                          rendered="#{configOptionApplicationController.getBooleanValueByKey('Print Generated By Details on Inward Final Bill', true)}">
                <div style="white-space: nowrap;">
                    <h:outputLabel value="Generated by : " style="font-weight: 500;"/>
                    <h:outputLabel value="#{sessionController.loggedUser.name}"/>
                </div>
                <div style="white-space: nowrap;">
                    <h:outputLabel value="Generated on : " style="font-weight: 500;"/>
                    <h:outputLabel value="#{sessionController.currentDate}">
                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                    </h:outputLabel>
                </div>
            </h:panelGroup>

            <h:panelGroup layout="block"
                          rendered="#{configOptionApplicationController.getBooleanValueByKey('Print Approved By Details on Inward Final Bill', true)
                                      and cc.attrs.bill ne null and cc.attrs.bill.approveAt ne null}">
                <div style="white-space: nowrap;">
                    <h:outputLabel value="Approved by : " style="font-weight: 500;"/>
                    <h:outputLabel value="#{cc.attrs.bill.approveUser.name}"/>
                </div>
                <div style="white-space: nowrap;">
                    <h:outputLabel value="Approved on : " style="font-weight: 500;"/>
                    <h:outputLabel value="#{cc.attrs.bill.approveAt}">
                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                    </h:outputLabel>
                </div>
            </h:panelGroup>

        </div>
    </cc:implementation>
</html>
