<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">


    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="controller" />
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" />
        <cc:attribute name="dup" />
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet library="css" name="inwardpayments.css" ></h:outputStylesheet>
        <!--<div class="a4bill" style="align-items: center; margin: 0; padding: 0; max-width: 210mm" >-->
        <h:panelGroup id="gpBillPreview" >
            <div class="a4bill1" style="align-items: center; margin: 0; padding: 0; max-width: 210mm" >

                <div class="institutionName">
                    <h:outputLabel value="#{cc.attrs.bill.institution.name}" />
                </div>
                <div class="institutionName">
                    <h:outputLabel value="#{cc.attrs.bill.department.printingName}" />
                </div>
                <div class="institutionContact" >
                    <div>
                        <h:outputLabel value="#{cc.attrs.bill.department.address}"/>
                    </div>
                    <div >
                        <h:outputLabel value="Phone :  #{cc.attrs.bill.department.telephone1} "/>
                        <h:outputLabel value=" /" style="width: 20px; text-align: center;" rendered="#{!empty cc.attrs.bill.department.telephone2}"/>
                        <h:outputLabel value="#{cc.attrs.bill.department.telephone2}" rendered="#{!empty cc.attrs.bill.department.telephone2}"/>
                    </div>
                    <div >
                        <h:outputLabel value="Fax : #{cc.attrs.bill.department.fax}" rendered="#{!empty cc.attrs.bill.department.fax}"/>
                    </div>
                    <div >
                        <h:outputLabel value="Email : #{cc.attrs.bill.department.email}" rendered="#{!empty cc.attrs.bill.department.email}"/>
                    </div>
                </div>

                <div class="" style=" text-align: center;font-weight: bold;font-size: 13pt">
                    <h:outputLabel value="CASH PAYMENT VOUCHER" />
                    <div class="mb-3">
                        <h:outputLabel value="**Duplicate**"  rendered="#{cc.attrs.dup eq true}" />
                        <h:outputLabel value="**Cancelled**"  rendered="#{cc.attrs.bill.cancelled eq true}" />
                    </div>
                </div>

                <div class="billDetailsFiveFive" >
                    <table style="width: 95%!important;" align="center" >

                        <tr>
                            <td><h:outputLabel value="Bill ID" class="billDetailsFiveFive" ></h:outputLabel></td>
                            <td style="text-align: center;" >:</td>
                            <td>
                                <h:outputLabel value="#{cc.attrs.bill.deptId}" class="billDetailsFiveFive" ></h:outputLabel>
                            </td>
                            <td width="2%" />
                            <td width="" ><h:outputLabel value="Voucher No" class="billDetailsFiveFive" ></h:outputLabel></td>
                            <td style="text-align: center;" >:</td>
                            <td>

                            </td>
                        </tr>

                        <tr>
                            <td><h:outputLabel value="Date" class="billDetailsFiveFive" ></h:outputLabel></td>
                            <td  style="text-align: center;" >:</td>
                            <td>
                                <h:outputLabel value="#{cc.attrs.bill.cancelledBill.billDate}"
                                               rendered="#{cc.attrs.bill.cancelledBill.deptId ne null}" class="billDetailsFiveFive" >
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}"/>
                                </h:outputLabel>
                                <h:outputLabel value="#{cc.attrs.bill.billDate}"
                                               rendered="#{cc.attrs.bill.cancelledBill.deptId eq null }" class="billDetailsFiveFive" >
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}"/>
                                </h:outputLabel>
                            </td>
                            <td width="2%" />
                            <td width="" ><h:outputLabel value="Time" class="billDetailsFiveFive" ></h:outputLabel></td>
                            <td style="text-align: center;" >:</td>
                            <td width="">
                                <h:outputLabel value="#{cc.attrs.bill.cancelledBill.billTime}"
                                               rendered="#{cc.attrs.bill.cancelledBill.deptId ne null}" class="billDetailsFiveFive">
                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longTimeFormat}" />
                                </h:outputLabel>
                                <h:outputLabel value="#{cc.attrs.bill.billTime}"
                                               rendered="#{cc.attrs.bill.cancelledBill.deptId eq null }" class="billDetailsFiveFive">
                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longTimeFormat}" />
                                </h:outputLabel>
                            </td>
                        </tr>

                        <tr>
                            <td><h:outputLabel value="Payee" class="billDetailsFiveFive" ></h:outputLabel></td>
                            <td style="text-align: center;" >:</td>
                            <td>
                                <h:outputLabel value="#{cc.attrs.bill.staff.person.nameWithTitle}" style="text-transform: capitalize; " class="billDetailsFiveFive"  />
                            </td>
                            <td width="2%" />
                            <td width="" ><h:outputLabel value="Speciality" class="billDetailsFiveFive" ></h:outputLabel></td>
                            <td style="text-align: center;" >:</td>
                            <td width="">
                                <h:outputLabel value="#{cc.attrs.bill.staff.speciality.name}" class="billDetailsFiveFive" ></h:outputLabel>
                            </td>
                        </tr>
                    </table>
                </div>

                <div style="width:100%;">

                    <h:dataTable value="#{billBeanController.fetchBillItems(cc.attrs.bill)}"
                                 var="bip"
                                 style="border-top:1px solid #999; margin-top:10px;"
                                 styleClass="billTable">

                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Description"/>
                            </f:facet>

                            <h:outputText
                                value="#{bip.referanceBillItem.bill.patientEncounter.bhtNo}" />
                        </h:column>

                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="Amount (Rs)"/>
                            </f:facet>

                            <h:outputText value="#{bip.netValue}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </h:column>

                    </h:dataTable>

                </div>

                <table style="width:100%; border-top:1px solid #999; margin-top:10px;">
                    <tr>
                        <td style="width:75%; font-size:17px; font-weight:bold;">
                            Net Total
                        </td>

                        <td style="width:25%; text-align:right; font-size:17px; font-weight:bold;">
                            <h:outputText value="#{-cc.attrs.bill.netTotal}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </td>
                    </tr>
                </table>
                
                <div class="d-grid justify-content-start">
                    <h:outputLabel value="Amount in words : " style="font-weight: 500; font-size: 15px"/>
                    <h:outputLabel value="***#{inwardStaffPaymentBillController.convertToWord(cc.attrs.bill.netTotal)} only.***" style="font-weight: 500; font-size: 15px" class="w-100"/>
                </div>

                <div class="mt-3" >
                    <div class="d-flex justify-content-between ">
                        <div class="d-flex gap-2">
                            <h:outputLabel value="Paid by : " style="font-weight: 500; font-size: 15px"/>
                            <h:outputLabel value="#{cc.attrs.bill.creater.name}" style="font-size: 15px"/>
                        </div>
                        <div class="d-flex gap-2">
                            <h:outputLabel value="Paid Date : "  style="font-weight: 500; font-size: 15px"/>
                            <h:outputLabel value="#{cc.attrs.bill.createdAt}" style="font-size: 15px">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </h:outputLabel>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between ">
                        <div class="d-flex gap-2">
                            <h:outputLabel value="Printed by : " style="font-weight: 500; font-size: 15px"/>
                            <h:outputLabel value="#{sessionController.loggedUser.name}" style="font-size: 15px"/>
                        </div>
                        <div class="d-flex gap-2">
                            <h:outputLabel value="Printed Date : " style="font-weight: 500; font-size: 15px"/>
                            <h:outputLabel value="#{sessionController.currentDate}" style="font-size: 15px">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </h:outputLabel>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <div class="d-grid text-center">
                        <h:outputLabel value="---------------------------------------" style="font-weight: 600"/>
                        <h:outputLabel value="Signature (Paid by)" style="font-weight: 600; font-size: 13px"/>
                    </div>
                    <div class="d-grid text-center">
                        <h:outputLabel value="---------------------------------------------" style="font-weight: 600"/>
                        <h:outputLabel value="#{cc.attrs.bill.toStaff.person.nameWithTitle}" style="font-weight: 600; font-size: 13px"/>
                    </div>
                </div>


            </div>
        </h:panelGroup>
    </cc:implementation>
</html>
