<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <!--
        NOTE: Unlike A4PaperPaymentBill.xhtml (the pre-final deposit composite,
        which delegates to InwardPaymentController.fillDataForInpatientsDepositBill(...)
        - a department-configurable {token} template), this composite is a
        static layout. That template-fill method is deposit-specific (its
        {fian_bill_number} token, "Show Comment on Inward Deposit Bill" config
        key, etc. assume the pre-final flow) and adding an equivalent
        templated method/tokens for the post-final balance breakdown fields
        would require a Java change, which is out of scope for this UI-only
        page set. See the design doc / implementation brief for details.
    -->

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" />
        <cc:attribute name="duplicate" type="java.lang.Boolean"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet library="css" name="inwardpayments.css" ></h:outputStylesheet>
        <div class="a4bill1" style="margin: 0; padding: 0; max-width: 210mm">

            <div class="institutionName">
                <h:outputLabel value="#{cc.attrs.bill.department.printingName}" />
            </div>
            <div class="institutionContact" >
                <div>
                    <h:outputLabel value="#{cc.attrs.bill.department.address}"/>
                </div>
                <div >
                    <h:outputLabel value="Phone : #{cc.attrs.bill.department.telephone1} "/>
                    <h:outputLabel value=" /" style="width: 20px; text-align: center;"/>
                    <h:outputLabel value="#{cc.attrs.bill.department.telephone2}"/>
                </div>
                <div >
                    <h:outputLabel value="Fax : #{cc.attrs.bill.department.fax}"/>
                </div>
                <div >
                    <h:outputLabel value=" Email : #{cc.attrs.bill.department.email}"/>
                </div>
            </div>

            <div>
                <hr style="border: 1px solid black; margin-left: 5%; margin-right: 5%;" />
            </div>

            <div class="headingBill">
                <h:outputLabel value="Post Final Bill Payment Receipt" style="font-size: 20px;" /><br/>
                <h:outputLabel value="**Duplicate**"  rendered="#{cc.attrs.duplicate eq true}" />
                <h:outputLabel value="**Cancelled**"  rendered="#{cc.attrs.bill.cancelled eq true}" />
            </div>

            <div>
                <hr style="border: 1px solid black; margin-left: 5%; margin-right: 5%;" />
            </div>

            <div class="billDetails">
                <table style="width: 100%; margin-left:0.5cm;" >
                    <tr>
                        <td style="width: 20%; text-align: left;"><h:outputLabel value="Name" class="billDetails"/></td>
                        <td style="width: 2%;">:</td>
                        <td style="width: 40%; text-align: left;"><h:outputLabel value="#{cc.attrs.bill.patientEncounter.patient.person.nameWithTitle}" class="billDetails"/></td>
                        <td style="width: 16%; text-align: left;"><h:outputLabel value="Age / Sex" class="billDetails"/></td>
                        <td style="width: 2%;">:</td>
                        <td style="width: 20%; text-align: left;">
                            <h:outputLabel value="#{cc.attrs.bill.patientEncounter.patient.age}" class="billDetails"/>
                            <h:outputLabel value=" / " class="billDetails"/>
                            <h:outputLabel value="#{cc.attrs.bill.patientEncounter.patient.person.sex}" class="billDetails"/>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><h:outputLabel value="Admission Type" class="billDetails"/></td>
                        <td>:</td>
                        <td style="text-align: left;"><h:outputLabel value="#{cc.attrs.bill.patientEncounter.admissionType.name}" class="billDetails"/></td>
                        <td style="text-align: left;"><h:outputLabel value="BHT No" class="billDetails"/></td>
                        <td>:</td>
                        <td style="text-align: left;"><h:outputLabel value="#{cc.attrs.bill.patientEncounter.bhtNo}" class="billDetails"/></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><h:outputLabel value="Date of Admission" class="billDetails"/></td>
                        <td>:</td>
                        <td style="text-align: left;">
                            <h:outputLabel value="#{cc.attrs.bill.patientEncounter.dateOfAdmission}" class="billDetails">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" ></f:convertDateTime>
                            </h:outputLabel>
                        </td>
                        <td style="text-align: left;"><h:outputLabel value="Bill No" class="billDetails"/></td>
                        <td>:</td>
                        <td style="text-align: left;"><h:outputLabel value="#{cc.attrs.bill.deptId}" class="billDetails"/></td>
                    </tr>
                    <h:panelGroup rendered="#{cc.attrs.bill.patientEncounter.dateOfDischarge ne null}">
                        <tr>
                            <td style="text-align: left;"><h:outputLabel value="Date of Discharge" class="billDetails"/></td>
                            <td>:</td>
                            <td style="text-align: left;">
                                <h:outputLabel value="#{cc.attrs.bill.patientEncounter.dateOfDischarge}" class="billDetails">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" ></f:convertDateTime>
                                </h:outputLabel>
                            </td>
                            <td style="text-align: left;"><h:outputLabel value="Date At" class="billDetails"/></td>
                            <td>:</td>
                            <td style="text-align: left;">
                                <h:outputLabel value="#{cc.attrs.bill.billDate}" class="billDetails">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" ></f:convertDateTime>
                                </h:outputLabel>
                            </td>
                        </tr>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{cc.attrs.bill.patientEncounter.dateOfDischarge eq null}">
                        <tr>
                            <td style="text-align: left;"><h:outputLabel value="Date At" class="billDetails"/></td>
                            <td>:</td>
                            <td style="text-align: left;">
                                <h:outputLabel value="#{cc.attrs.bill.billDate}" class="billDetails">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" ></f:convertDateTime>
                                </h:outputLabel>
                            </td>
                            <td/><td/><td/>
                        </tr>
                    </h:panelGroup>
                    <tr>
                        <td style="text-align: left;"><h:outputLabel value="Payment Method" class="billDetails"/></td>
                        <td>:</td>
                        <td style="text-align: left;" colspan="4"><h:outputLabel value="#{cc.attrs.bill.paymentMethod.label}" class="billDetails"/></td>
                    </tr>
                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Show Comment on Inward Deposit Bill',false) and cc.attrs.bill.comments ne null and cc.attrs.bill.comments ne ''}">
                        <tr>
                            <td style="text-align: left;"><h:outputLabel value="Comment" class="billDetails"/></td>
                            <td>:</td>
                            <td style="text-align: left;" colspan="4"><h:outputLabel value="#{cc.attrs.bill.comments}" class="billDetails"/></td>
                        </tr>
                    </h:panelGroup>
                </table>
            </div>

            <div class="billline">
                <hr style="border: 1px solid black; margin-left: 5%; margin-right: 5%;" />
            </div>

            <h:panelGroup rendered="#{cc.attrs.bill.paymentMethod eq 'MultiplePaymentMethods'}">
                <table class="billTable" style="width: 90%; margin: 0 auto;">
                    <thead>
                        <tr>
                            <th>Pay Type</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat value="#{billSearch.fetchBillPayments(cc.attrs.bill)}" var="ps" >
                            <tr>
                                <td>
                                    <h:outputText value="#{ps.paymentMethod}"/>
                                    <h:outputText value=" (#{ps.creditCardRefNo})" rendered="#{ps.paymentMethod eq 'Card'}"/>
                                </td>
                                <td>
                                    <h:outputText value="#{ps.paidValue}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </td>
                            </tr>
                        </ui:repeat>
                    </tbody>
                </table>
                <hr style="border: 1px solid black; margin-left: 5%; margin-right: 5%;" />
            </h:panelGroup>

            <div>
                <table class="billTable" style="width: 90%; margin: 10px auto 0;">
                    <tbody>
                        <tr>
                            <td>Final Bill Net Total</td>
                            <td>
                                <h:outputLabel value="#{postFinalBillInwardPaymentController.getFinalBillNetTotalForBill(cc.attrs.bill)}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td>Paid Previously</td>
                            <td>
                                <h:outputLabel value="#{postFinalBillInwardPaymentController.getPaidPreviouslyForBill(cc.attrs.bill)}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td>Due Previously</td>
                            <td>
                                <h:outputLabel value="#{postFinalBillInwardPaymentController.getDuePreviouslyForBill(cc.attrs.bill)}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold;">Amount Paid This Time</td>
                            <td style="font-weight: bold;">
                                <h:outputLabel value="#{cc.attrs.bill.netTotal}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; font-size: 17px; border-top: 1px solid black;">Balance</td>
                            <td style="font-weight: bold; font-size: 17px; border-top: 1px solid black;">
                                <h:outputLabel value="#{postFinalBillInwardPaymentController.getBalanceForBill(cc.attrs.bill)}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <br/>

            <div class="footer" style="text-align: center;">
                <h:outputLabel value="Cashier : #{cc.attrs.bill.creater.webUserPerson.nameWithTitle}"/>
                <br/><br/>
                The Greatest Wealth is Health!
                <h:panelGroup  rendered="#{sessionController.loggedPreference.pharmacyBillFooter ne null}">
                    <br/>
                </h:panelGroup>
                <h:outputLabel value="#{sessionController.loggedPreference.pharmacyBillFooter}" ></h:outputLabel>
            </div>

        </div>
    </cc:implementation>
</html>
