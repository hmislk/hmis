<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- INTERFACE -->
    <cc:interface >

    </cc:interface>

    <!-- IMPLEMENTATION -->

    <cc:implementation>
        <p:dataTable id="chargeTypeTotalsTable" value="#{bhtSummeryFinalizedController.chargeTypeTotals}" var="ct"
                     rowKey="#{ct.heading}" emptyMessage="No charges">
            <f:facet name="header">
                <h:outputLabel value="Charge Type Totals (as on the final bill)"/>
            </f:facet>
            <p:column headerText="Charge Type">
                <h:outputLabel value="#{ct.heading}"/>
            </p:column>
            <p:column style="text-align: right;" headerText="Total">
                <h:outputLabel value="#{ct.total}">
                    <f:convertNumber pattern="#,##0.00" />
                </h:outputLabel>
                <f:facet name="footer">
                    <h:outputLabel value="Discount: "/>
                    <h:outputLabel value="#{bhtSummeryFinalizedController.finalBillDiscount}">
                        <f:convertNumber pattern="#,##0.00" />
                    </h:outputLabel>
                    <h:outputLabel value="  Net: "/>
                    <h:outputLabel value="#{bhtSummeryFinalizedController.finalBillNetTotal}">
                        <f:convertNumber pattern="#,##0.00" />
                    </h:outputLabel>
                </f:facet>
            </p:column>
        </p:dataTable>
    </cc:implementation>
</html>
