<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <cc:interface>
        <cc:attribute name="bill"      required="true"  type="com.divudi.core.entity.Bill" />
        <cc:attribute name="duplicate" required="false" />
    </cc:interface>

    <cc:implementation>
        <h:outputStylesheet library="css" name="sale_bill_five_five_custom_3.css" />

        <div class="receipt-container">
            <div class="hospital-name">
                <h:outputLabel value="#{cc.attrs.bill.department.name}"/>
                <h:outputLabel value="**Duplicate**" rendered="#{cc.attrs.duplicate eq true}" />
                <h:outputLabel value=" **Cancelled**" rendered="#{cc.attrs.bill.cancelled eq true}" />
            </div>
            <div class="separator"></div>

            <table class="info-table">
                <h:panelGroup rendered="#{cc.attrs.bill.patient.person.nameWithTitle ne null}">
                    <tr><td style="padding: 2px;">Name</td><td style="padding: 2px;" colspan="5"><h:outputLabel value="#{cc.attrs.bill.patient.person.nameWithTitle}"/></td></tr>
                </h:panelGroup>
                <h:panelGroup rendered="#{cc.attrs.bill.patientEncounter.bhtNo ne null}">
                    <tr>
                        <td style="padding: 2px;">BHT</td><td style="padding: 2px;">#{cc.attrs.bill.patientEncounter.bhtNo}</td>
                        <td style="padding: 2px;" class="spacer"></td>
                        <td style="padding: 2px;">Room</td><td style="padding: 2px;">#{cc.attrs.bill.patientEncounter.currentPatientRoom.roomFacilityCharge.name}</td>
                    </tr>
                </h:panelGroup>
                <tr>
                    <td style="padding: 2px;">Bill No</td><td style="padding: 2px;">#{cc.attrs.bill.deptId}</td>
                    <td style="padding: 2px;" class="spacer"></td>
                    <td style="padding: 2px;">Date</td>
                    <td style="padding: 2px;"><h:outputLabel value="#{cc.attrs.bill.createdAt}"><f:convertDateTime pattern="yyyy-MM-dd HH:mm"/></h:outputLabel></td>
                </tr>
            </table>
            <div class="separator"></div>

            <table class="receipt-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Item</th>
                        <th style="text-align: right">Qty</th>
                        <th style="text-align: right">Gross</th>
                        <th style="text-align: right">Serv.Chg</th>
                        <th style="text-align: right">Disc</th>
                        <th style="text-align: right">Net</th>
                    </tr>
                </thead>
                <tbody>
                    <ui:repeat value="#{cc.attrs.bill.billItems}" var="item" varStatus="s">
                        <tr>
                            <td>#{s.index + 1}</td>
                            <td>#{item.item.name}</td>
                            <td style="text-align: right"><h:outputLabel value="#{item.qty}"><f:convertNumber integerOnly="true"/></h:outputLabel></td>
                            <td style="text-align: right"><h:outputLabel rendered="#{configOptionApplicationController.getBooleanValueByKey('Nursing IP Billing - Show Rate and Value', false) and webUserController.hasPrivilege('NursingIPBillingViewRates')}" value="#{item.grossValue lt 0 ? -item.grossValue : item.grossValue}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td>
                            <td style="text-align: right"><h:outputLabel rendered="#{configOptionApplicationController.getBooleanValueByKey('Nursing IP Billing - Show Rate and Value', false) and webUserController.hasPrivilege('NursingIPBillingViewRates')}" value="#{item.marginValue lt 0 ? -item.marginValue : item.marginValue}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td>
                            <td style="text-align: right"><h:outputLabel rendered="#{configOptionApplicationController.getBooleanValueByKey('Nursing IP Billing - Show Rate and Value', false) and webUserController.hasPrivilege('NursingIPBillingViewRates')}" value="#{item.discount lt 0 ? -item.discount : item.discount}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td>
                            <td style="text-align: right"><h:outputLabel rendered="#{configOptionApplicationController.getBooleanValueByKey('Nursing IP Billing - Show Rate and Value', false) and webUserController.hasPrivilege('NursingIPBillingViewRates')}" value="#{item.netValue lt 0 ? -item.netValue : item.netValue}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td>
                        </tr>
                    </ui:repeat>
                </tbody>
            </table>
            <div class="separator"></div>

            <table class="total-table">
                <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Nursing IP Billing - Show Rate and Value', false) and webUserController.hasPrivilege('NursingIPBillingViewRates')}">
                    <tr><td>Gross:</td><td style="text-align: right;"><h:outputLabel value="#{cc.attrs.bill.total lt 0 ? -cc.attrs.bill.total : cc.attrs.bill.total}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td></tr>
                    <tr><td>Service Charge:</td><td style="text-align: right;"><h:outputLabel value="#{cc.attrs.bill.margin lt 0 ? -cc.attrs.bill.margin : cc.attrs.bill.margin}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td></tr>
                    <tr><td>Discount:</td><td style="text-align: right;"><h:outputLabel value="#{cc.attrs.bill.discount lt 0 ? -cc.attrs.bill.discount : cc.attrs.bill.discount}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td></tr>
                    <tr><td>Net Total:</td><td style="text-align: right;"><h:outputLabel value="#{cc.attrs.bill.netTotal lt 0 ? -cc.attrs.bill.netTotal : cc.attrs.bill.netTotal}"><f:convertNumber pattern="#,##0.00"/></h:outputLabel></td></tr>
                </h:panelGroup>
                <tr><td>No of Items:</td><td><h:outputLabel value="#{cc.attrs.bill.billItems.size()}"><f:convertNumber integerOnly="true"/></h:outputLabel></td></tr>
            </table>

            <table>
                <tr><td>
                    <h:outputLabel value="Printed By :"/>
                    <h:outputLabel value="#{sessionController.loggedUser.name}"/>
                    <h:outputLabel value="&nbsp;&nbsp;"/>
                    <h:outputLabel value="#{sessionController.currentDate}"><f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/></h:outputLabel>
                </td></tr>
            </table>
        </div>
    </cc:implementation>
</html>
