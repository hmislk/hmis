<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <p:panel>
            <f:facet name="header">
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <span>Pharmacy Transfer Receive</span>
                    <p:commandButton ajax="false" value="Download" icon="fa fa-download"
                                     styleClass="ui-button-success ui-button-sm">
                        <p:dataExporter target="tblBills" type="xlsx" fileName="pharmacy_transfer_receive"/>
                    </p:commandButton>
                </div>
            </f:facet>

            <h:panelGrid columns="4" styleClass="mb-2">
                <h:outputLabel value="Bill No"/>
                <h:outputLabel value="Net Total"/>
                <h:outputLabel value="Item Name"/>
                <h:outputLabel value="Item Code"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.billNo}" />
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.netTotal}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.itemName}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.code}"/>
            </h:panelGrid>

            <div class="pharma-search-wrapper">
                <p:dataTable rowIndexVar="i" id="tblBills" value="#{pharmacyBillSearch.transferReceiveSearchDtos}" var="dto"
                             paginator="true" rows="10"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="10,20,50,100">

                    <p:column headerText="Receive No">
                        <h:outputLabel value="#{dto.insId}"/>
                    </p:column>

                    <p:column headerText="Received By">
                        <h:outputLabel value="#{dto.createrName}"/>
                        <h:panelGroup rendered="#{dto.cancelled}">
                            <h:outputLabel style="color:red;" value="Cancelled By "/>
                            <h:outputLabel style="color:red;" rendered="#{dto.cancelled}" value="#{dto.cancelledByName}"/>
                        </h:panelGroup>
                    </p:column>

                    <p:column headerText="Received At">
                        <h:outputLabel value="#{dto.createdAt}"/>
                        <h:panelGroup rendered="#{dto.cancelled}">
                            <h:outputLabel style="color:red;" value="Cancelled at "/>
                            <h:outputLabel style="color:red;" rendered="#{dto.cancelled}"
                                           value="#{dto.cancelledAt}">
                                <f:convertDateTime pattern="dd MMM yyyy hh mm a"/>
                            </h:outputLabel>
                        </h:panelGroup>
                    </p:column>

                    <p:column headerText="Net Value" style="text-align:right;">
                        <h:outputLabel value="#{dto.netTotal}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputLabel>
                    </p:column>

                    <p:column headerText="Comments">
                        <h:outputLabel value="#{dto.comments}"/>
                    </p:column>

                    <!-- Actions (last column, not exported) -->
                    <p:column headerText="Actions" exportable="false" style="white-space:nowrap;">
                        <p:commandButton ajax="false" value="View Bill" styleClass="ui-button-info ui-button-sm"
                                         action="#{pharmacyBillSearch.navigateToTransferReceiveReprintById(dto.billId)}"/>
                    </p:column>

                </p:dataTable>
            </div>
        </p:panel>
    </cc:implementation>
</html>
