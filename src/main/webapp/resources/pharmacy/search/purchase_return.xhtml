<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      >

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <p:panel>
            <f:facet name="header">
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <span>PURCHASE RETURN NOTE</span>
                    <p:commandButton ajax="false" value="Download" icon="fa fa-download"
                                     styleClass="ui-button-success ui-button-sm">
                        <p:dataExporter target="tblBills" type="xlsx" fileName="pharmacy_purchase_return_detail"/>
                    </p:commandButton>
                </div>
            </f:facet>

            <h:panelGrid columns="6" styleClass="mb-2">
                <h:outputLabel value="Return Note No"/>
                <h:outputLabel value="Purchase No"/>
                <h:outputLabel value="Supplier Name"/>
                <h:outputLabel value="Net Total"/>
                <h:outputLabel value="Item Name"/>
                <h:outputLabel value="Item Code"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.billNo}" />
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.refBillNo}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.toInstitution}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.netTotal}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.itemName}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.code}"/>
            </h:panelGrid>

            <h:panelGroup id="gpBill">
                <div class="pharma-search-wrapper">
                    <p:dataTable rowIndexVar="i" id="tblBills" value="#{pharmacyBillSearch.purchaseReturnSearchDtos}" var="dto"
                                 paginator="true" rows="10"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rowsPerPageTemplate="10,20,50,100">

                        <p:column headerText="Return Note No">
                            <h:commandLink action="#{pharmacyBillSearch.navigateToDirectPurchaseReturnById(dto.id)}" value="#{dto.deptId}"/>
                        </p:column>

                        <p:column headerText="Purchase No">
                            <h:commandLink action="#{pharmacyBillSearch.navigateToPurchaseById(dto.referenceBillId)}" value="#{dto.referenceBillDeptId}"/>
                        </p:column>

                        <p:column headerText="Supplier Name">
                            <h:outputLabel value="#{dto.toInstitutionName}"/>
                        </p:column>

                        <p:column headerText="Billed At">
                            <h:outputLabel value="#{dto.createdAt}">
                                <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </h:outputLabel>
                            <h:panelGroup rendered="#{dto.cancelled}">
                                <h:outputLabel style="color:red;" value="Cancelled at "/>
                                <h:outputLabel style="color:red;" rendered="#{dto.cancelled}" value="#{dto.cancelledAt}">
                                    <f:convertDateTime timeZone="Asia/Colombo" pattern="dd MMM yyyy hh:mm a"/>
                                </h:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{dto.refunded}">
                                <h:outputLabel style="color:red;" value="Refunded at "/>
                                <h:outputLabel style="color:red;" rendered="#{dto.refunded}" value="#{dto.refundedAt}">
                                    <f:convertDateTime timeZone="Asia/Colombo" pattern="dd MMM yyyy hh:mm a"/>
                                </h:outputLabel>
                            </h:panelGroup>
                        </p:column>

                        <p:column headerText="Billed By">
                            <h:outputLabel value="#{dto.creatorName}"/>
                            <h:panelGroup rendered="#{dto.cancelled}">
                                <h:outputLabel style="color:red;" value="Cancelled By "/>
                                <h:outputLabel style="color:red;" rendered="#{dto.cancelled}" value="#{dto.cancelledBy}"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{dto.refunded}">
                                <h:outputLabel style="color:red;" value="Refunded By "/>
                                <h:outputLabel style="color:red;" rendered="#{dto.refunded}" value="#{dto.refundedBy}"/>
                            </h:panelGroup>
                        </p:column>

                        <p:column headerText="Payment Method">
                            <h:outputLabel value="#{dto.paymentMethod}"/>
                        </p:column>

                        <p:column headerText="Net Value" style="text-align:right;">
                            <h:outputLabel value="#{dto.netTotal}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputLabel>
                        </p:column>

                        <p:column headerText="Sale Value" style="text-align:right;">
                            <h:outputLabel value="#{dto.saleValue}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputLabel>
                        </p:column>

                        <p:column headerText="Comments">
                            <h:outputLabel value="#{dto.cancelRefundComments}"/>
                        </p:column>

                    </p:dataTable>
                </div>
            </h:panelGroup>
        </p:panel>
    </cc:implementation>
</html>
