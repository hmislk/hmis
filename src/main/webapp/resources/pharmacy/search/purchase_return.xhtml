<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      >

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <p:panel>
            <f:facet name="header">
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <span>PURCHASE RETURN NOTE</span>
                    <p:commandButton ajax="false" value="Download" icon="fa fa-download"
                                     styleClass="ui-button-success ui-button-sm">
                        <p:dataExporter target="tblBills" type="xlsx" fileName="pharmacy_purchase_return_detail"/>
                    </p:commandButton>
                </div>
            </f:facet>

            <h:panelGrid columns="6" styleClass="mb-2">
                <h:outputLabel value="Return Note No"/>
                <h:outputLabel value="Purchase No"/>
                <h:outputLabel value="Supplier Name"/>
                <h:outputLabel value="Net Total"/>
                <h:outputLabel value="Item Name"/>
                <h:outputLabel value="Item Code"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.billNo}" />
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.refBillNo}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.toInstitution}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.netTotal}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.itemName}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.code}"/>
            </h:panelGrid>

            <h:panelGroup id="gpBill">
                <div class="pharma-search-wrapper">
                    <p:dataTable rowIndexVar="i" id="tblBills" value="#{searchController.bills}" var="bill">

                        <p:column headerText="Return Note No">
                            <h:commandLink action="pharmacy_reprint_direct_purchase_return?faces-redirect=true" value="#{bill.deptId}">
                                <h:outputLabel/>
                                <f:setPropertyActionListener value="#{bill}" target="#{pharmacyBillSearch.bill}"/>
                            </h:commandLink>
                        </p:column>

                        <p:column headerText="Purchase No">
                            <h:commandLink action="pharmacy_reprint_purchase?faces-redirect=true" value="#{bill.referenceBill.deptId}">
                                <h:outputLabel/>
                                <f:setPropertyActionListener value="#{bill.referenceBill}" target="#{pharmacyBillSearch.bill}"/>
                            </h:commandLink>
                        </p:column>

                        <p:column headerText="Supplier Name">
                            <h:outputLabel value="#{bill.toInstitution.name}"/>
                        </p:column>

                        <p:column headerText="Billed At">
                            <h:outputLabel value="#{bill.createdAt}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </h:outputLabel>
                            <h:panelGroup rendered="#{bill.cancelled}">
                                <h:outputLabel style="color:red;" value="Cancelled at "/>
                                <h:outputLabel style="color:red;" rendered="#{bill.cancelled}" value="#{bill.cancelledBill.createdAt}">
                                    <f:convertDateTime pattern="dd MMM yyyy hh mm a"/>
                                </h:outputLabel>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{bill.refunded}">
                                <h:outputLabel style="color:red;" value="Refunded at "/>
                                <h:outputLabel style="color:red;" rendered="#{bill.refunded}" value="#{bill.refundedBill.createdAt}">
                                    <f:convertDateTime pattern="dd MMM yyyy hh mm a"/>
                                </h:outputLabel>
                            </h:panelGroup>
                        </p:column>

                        <p:column headerText="Billed By">
                            <h:outputLabel value="#{bill.creater.webUserPerson.name}"/>
                            <h:panelGroup rendered="#{bill.cancelled}">
                                <h:outputLabel style="color:red;" value="Cancelled By "/>
                                <h:outputLabel style="color:red;" rendered="#{bill.cancelled}" value="#{bill.cancelledBill.creater.webUserPerson.name}"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{bill.refunded}">
                                <h:outputLabel style="color:red;" value="Refunded By "/>
                                <h:outputLabel style="color:red;" rendered="#{bill.refunded}" value="#{bill.refundedBill.creater.webUserPerson.name}"/>
                            </h:panelGroup>
                        </p:column>

                        <p:column headerText="Payment Method">
                            <h:outputLabel value="#{bill.paymentMethod}"/>
                        </p:column>

                        <p:column headerText="Net Value" style="text-align:right;">
                            <h:outputLabel value="#{bill.netTotal}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputLabel>
                        </p:column>

                        <p:column headerText="Sale Value" style="text-align:right;">
                            <h:outputLabel value="#{bill.saleValue}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputLabel>
                        </p:column>

                        <p:column headerText="Comments">
                            <h:outputLabel rendered="#{bill.refundedBill ne null}" value="#{bill.refundedBill.comments}"/>
                            <h:outputLabel rendered="#{bill.cancelledBill ne null}" value="#{bill.cancelledBill.comments}"/>
                        </p:column>

                    </p:dataTable>
                </div>
            </h:panelGroup>
        </p:panel>
    </cc:implementation>
</html>
