<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <!--
        Result table for every pharmacy bill type / atomic that has no dedicated
        table (issue #24250): adjustment sub-types, disposal issues, inpatient
        medicine issues, donations, physical count, snapshot, etc.
        Binds to pharmacyBillSearch.genericSearchDtos, filled by
        PharmacyBillSearch.searchPharmacyBills().
    -->
    <cc:implementation>
        <p:panel styleClass="pharma-search-results">
            <f:facet name="header">
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <span>BILLS</span>
                    <p:commandButton ajax="false" value="Download" icon="fa fa-download"
                                     styleClass="ui-button-success ui-button-sm">
                        <p:dataExporter target="tblGenericBills" type="xlsx" fileName="pharmacy_bills"/>
                    </p:commandButton>
                </div>
            </f:facet>

            <div class="pharma-search-wrapper">
                <p:dataTable rowIndexVar="i"
                             id="tblGenericBills"
                             widgetVar="tblGenericBills"
                             value="#{pharmacyBillSearch.genericSearchDtos}"
                             var="dto"
                             paginator="true"
                             rows="25"
                             stickyHeader="true"
                             styleClass="p-datatable-sm"
                             paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="25,50,100,200"
                             emptyMessage="No Bills Found">

                    <p:column headerText="Bill No"
                              sortBy="#{dto.deptId}"
                              filterBy="#{dto.deptId}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.deptId}"/>
                    </p:column>

                    <p:column headerText="Type"
                              sortBy="#{dto.typeLabel}"
                              filterBy="#{dto.typeLabel}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.typeLabel}"/>
                    </p:column>

                    <p:column headerText="Billed At" sortBy="#{dto.createdAt}">
                        <h:outputText value="#{dto.createdAt}">
                            <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="From"
                              sortBy="#{dto.fromName}"
                              filterBy="#{dto.fromName}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.fromName}"/>
                    </p:column>

                    <p:column headerText="To"
                              sortBy="#{dto.toName}"
                              filterBy="#{dto.toName}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.toName}"/>
                    </p:column>

                    <p:column headerText="Patient"
                              sortBy="#{dto.patientName}"
                              filterBy="#{dto.patientName}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.patientName}"/>
                    </p:column>

                    <p:column headerText="BHT"
                              sortBy="#{dto.bhtNo}"
                              filterBy="#{dto.bhtNo}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.bhtNo}"/>
                    </p:column>

                    <p:column headerText="Billed By"
                              sortBy="#{dto.creatorName}"
                              filterBy="#{dto.creatorName}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.creatorName}"/>
                    </p:column>

                    <p:column headerText="Net Value" sortBy="#{dto.netTotal}" style="text-align:right;">
                        <h:outputText value="#{dto.netTotal}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <h:outputText value="Cancelled" rendered="#{dto.cancelled}" style="display:none;"/>
                        <p:badge value="Cancelled" severity="danger" rendered="#{dto.cancelled}"/>
                        <h:outputText value="Refunded" rendered="#{dto.refunded}" style="display:none;"/>
                        <p:badge value="Refunded" severity="warning" rendered="#{dto.refunded}"/>
                    </p:column>

                    <p:column headerText="Comments"
                              filterBy="#{dto.comments}"
                              filterMatchMode="contains">
                        <h:outputText value="#{dto.comments}"/>
                    </p:column>

                    <!-- Actions (last column, not exported) -->
                    <p:column headerText="Actions" exportable="false" style="width:6em;white-space:nowrap;">
                        <p:commandButton
                            ajax="false"
                            icon="fa fa-eye"
                            styleClass="ui-button-info ui-button-sm"
                            title="View Bill"
                            action="#{billSearch.navigateToViewBillByAtomicBillTypeByBillId(dto.id)}"/>
                    </p:column>

                </p:dataTable>
            </div>
        </p:panel>
    </cc:implementation>
</html>
