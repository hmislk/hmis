<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <p:panel>
            <f:facet name="header">
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <span>GOOD RECEIVE NOTE — PAYMENT</span>
                    <p:commandButton ajax="false" value="Download" icon="fa fa-download"
                                     styleClass="ui-button-success ui-button-sm">
                        <p:dataExporter target="tblBills" type="xlsx" fileName="bill_list"/>
                    </p:commandButton>
                </div>
            </f:facet>

            <h:panelGrid columns="7" styleClass="mb-2">
                <h:outputLabel value="GRN No"/>
                <h:outputLabel value="PO No"/>
                <h:outputLabel value="Invoice No"/>
                <h:outputLabel value="Supplier Name"/>
                <h:outputLabel value="Net Total"/>
                <h:outputLabel value="Item Name"/>
                <h:outputLabel value="Item Code"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.billNo}" />
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.refBillNo}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.number}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.fromInstitution}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.netTotal}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.itemName}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.code}"/>
            </h:panelGrid>

            <div class="pharma-search-wrapper">
                <p:dataTable rowIndexVar="i" id="tblBills" value="#{pharmacyBillSearch.grnPaymentSearchDtos}" var="dto"
                             paginator="true" rows="10"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="10,20,50,100">

                    <p:column headerText="GRN No">
                        <h:outputLabel value="#{dto.referenceBillDeptId}"/>
                    </p:column>

                    <p:column headerText="GRN Date">
                        <h:outputLabel value="#{dto.referenceBillCreatedAt}">
                            <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateFormat}"/>
                        </h:outputLabel>
                    </p:column>

                    <p:column headerText="Invoice No">
                        <h:outputLabel value="#{dto.deptId}"/>
                    </p:column>

                    <p:column headerText="Invoice Date">
                        <h:outputLabel value="#{dto.billTime}">
                            <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateFormat}"/>
                        </h:outputLabel>
                    </p:column>

                    <p:column headerText="Dealer Name">
                        <h:outputLabel value="#{dto.toInstitutionName}"/>
                    </p:column>

                    <p:column headerText="Billed At">
                        <h:outputLabel value="#{dto.createdAt}">
                            <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        </h:outputLabel>
                        <h:panelGroup rendered="#{dto.cancelled}">
                            <h:outputLabel style="color:red;" value="Cancelled at "/>
                            <h:outputLabel style="color:red;" rendered="#{dto.cancelled}" value="#{dto.cancelledAt}">
                                <f:convertDateTime timeZone="Asia/Colombo" pattern="dd MMM yyyy hh:mm a"/>
                            </h:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{dto.refunded}">
                            <h:outputLabel style="color:red;" value="Refunded at "/>
                            <h:outputLabel style="color:red;" rendered="#{dto.refunded}" value="#{dto.refundedAt}">
                                <f:convertDateTime timeZone="Asia/Colombo" pattern="dd MMM yyyy hh:mm a"/>
                            </h:outputLabel>
                        </h:panelGroup>
                    </p:column>

                    <p:column headerText="Billed By">
                        <h:outputLabel value="#{dto.creatorName}"/>
                    </p:column>

                    <p:column headerText="Payment Method">
                        <h:outputLabel value="#{dto.paymentMethod}"/>
                    </p:column>

                    <p:column headerText="Net Value" style="text-align:right;">
                        <h:outputLabel value="#{dto.netTotal}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputLabel>
                    </p:column>

                    <p:column headerText="Sale Value" style="text-align:right;">
                        <h:outputLabel value="#{dto.saleValue}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputLabel>
                    </p:column>

                    <p:column headerText="Comments">
                        <h:outputLabel value="#{dto.cancelRefundComments}"/>
                    </p:column>

                    <!-- Actions (last column, not exported) -->
                    <p:column headerText="Actions" exportable="false" style="width:6em;white-space:nowrap;">
                        <p:commandButton
                            ajax="false"
                            icon="fa fa-eye"
                            styleClass="ui-button-info ui-button-sm"
                            title="View"
                            action="#{supplierPaymentController.navigateToDealerPaymentBillById(dto.id)}"/>
                    </p:column>

                </p:dataTable>
            </div>
        </p:panel>
    </cc:implementation>
</html>
