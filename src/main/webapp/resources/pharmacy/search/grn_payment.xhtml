<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <p:panel>
            <f:facet name="header">
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                    <span>GOOD RECEIVE NOTE — PAYMENT</span>
                    <p:commandButton ajax="false" value="Download" icon="fa fa-download"
                                     styleClass="ui-button-success ui-button-sm">
                        <p:dataExporter target="tblBills" type="xlsx" fileName="bill_list"/>
                    </p:commandButton>
                </div>
            </f:facet>

            <h:panelGrid columns="7" styleClass="mb-2">
                <h:outputLabel value="GRN No"/>
                <h:outputLabel value="PO No"/>
                <h:outputLabel value="Invoice No"/>
                <h:outputLabel value="Supplier Name"/>
                <h:outputLabel value="Net Total"/>
                <h:outputLabel value="Item Name"/>
                <h:outputLabel value="Item Code"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.billNo}" />
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.refBillNo}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.number}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.fromInstitution}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.netTotal}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.itemName}"/>
                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.code}"/>
            </h:panelGrid>

            <div class="pharma-search-wrapper">
                <p:dataTable rowIndexVar="i" id="tblBills" value="#{searchController.bills}" var="bill">

                    <p:column headerText="GRN No">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.referenceBill.deptId}">
                            <h:outputLabel/>
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                    </p:column>

                    <p:column headerText="GRN Date">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.referenceBill.createdAt}">
                            <h:outputLabel/>
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                    </p:column>

                    <p:column headerText="Invoice No">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.deptId}">
                            <h:outputLabel/>
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                    </p:column>

                    <p:column headerText="Invoice Date">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.billTime}">
                            <h:outputLabel value="#{bill.billTime}">
                                <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateFormat}"/>
                            </h:outputLabel>
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                    </p:column>

                    <p:column headerText="Dealer Name">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.toInstitution.name}">
                            <h:outputLabel/>
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                    </p:column>

                    <p:column headerText="Billed At">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.createdAt}">
                            <h:outputLabel value="#{bill.createdAt}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </h:outputLabel>
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                        <h:panelGroup rendered="#{bill.cancelled}">
                            <h:outputLabel style="color:red;" value="Cancelled at "/>
                            <h:outputLabel style="color:red;" rendered="#{bill.cancelled}" value="#{bill.cancelledBill.createdAt}">
                                <f:convertDateTime pattern="dd MMM yyyy hh mm a"/>
                            </h:outputLabel>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{bill.refunded}">
                            <h:outputLabel style="color:red;" value="Refunded at "/>
                            <h:outputLabel style="color:red;" rendered="#{bill.refunded}" value="#{bill.refundedBill.createdAt}">
                                <f:convertDateTime pattern="dd MMM yyyy hh mm a"/>
                            </h:outputLabel>
                        </h:panelGroup>
                    </p:column>

                    <p:column headerText="Billed By">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.creater}">
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                    </p:column>

                    <p:column headerText="Payment Method">
                        <h:commandLink action="/dealerPayment/bill_dealor_all?faces-redirect=true" value="#{bill.paymentMethod}">
                            <f:setPropertyActionListener value="#{bill}" target="#{supplierPaymentController.current}"/>
                            <f:setPropertyActionListener value="#{bill.billItems}" target="#{supplierPaymentController.billItems}"/>
                            <f:setPropertyActionListener value="true" target="#{supplierPaymentController.printPreview}"/>
                        </h:commandLink>
                    </p:column>

                    <p:column headerText="Net Value" style="text-align:right;">
                        <h:outputLabel value="#{bill.netTotal}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputLabel>
                    </p:column>

                    <p:column headerText="Sale Value" style="text-align:right;">
                        <h:outputLabel value="#{bill.saleValue}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputLabel>
                    </p:column>

                    <p:column headerText="Comments">
                        <h:outputLabel rendered="#{bill.refundedBill ne null}" value="#{bill.refundedBill.comments}"/>
                        <h:outputLabel rendered="#{bill.cancelledBill ne null}" value="#{bill.cancelledBill.comments}"/>
                    </p:column>

                </p:dataTable>
            </div>
        </p:panel>
    </cc:implementation>
</html>
