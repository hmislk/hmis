<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <p:commandButton
            id="btnBhtIssueRequestPrintConfig"
            rendered="#{webUserController.hasPrivilege('ChangeReceiptPrintingPaperTypes')}"
            icon="fas fa-cog"
            styleClass="ui-button-secondary ui-button-outlined"
            type="button"
            title="Print Format Settings"
            onclick="PF('bhtIssueRequestPrintConfigDialog').show();"/>

        <!--
            NOTE: deliberately no nested <h:form> here. Every current call site
            embeds this composite inside a page-level <h:form>, and HTML forbids
            nested <form> elements - browsers silently drop the inner <form> tag
            during parsing, which left the checkboxes formless: PrimeFaces' ajax
            "open" update kept re-rendering them correctly server-side, but the
            client never re-attached the "checked" state (confirmed via direct
            DOM inspection - the parsed tree had no ancestor <form> at all for
            these inputs). Relying on the caller's own enclosing form (as the
            pre-existing "Confirmation" cancel dialog on the reprint page also
            does) avoids the nested-form parse issue entirely.
        -->
        <p:dialog id="bhtIssueRequestPrintConfigDialog"
                  header="BHT Issue Request - Print Format Settings"
                  widgetVar="bhtIssueRequestPrintConfigDialog"
                  modal="true" width="500" resizable="false" closeOnEscape="true">
            <p:ajax event="open" listener="#{pharmacyConfigController.loadCurrentConfig}" update="bhtIssueRequestPrintConfigPanel"/>
            <h:panelGroup id="bhtIssueRequestPrintConfigPanel" layout="block">
                <div class="mb-3">
                    <h:selectBooleanCheckbox id="cbBiqA4" value="#{pharmacyConfigController.bhtIssueRequestReceiptA4}"/>
                    <h:outputLabel for="cbBiqA4" value="A4 Paper" class="ms-2"/>
                </div>
                <div class="mb-3">
                    <h:selectBooleanCheckbox id="cbBiqFiveFive" value="#{pharmacyConfigController.bhtIssueRequestReceiptFiveFive}"/>
                    <h:outputLabel for="cbBiqFiveFive" value="5 x 5 Paper" class="ms-2"/>
                </div>
                <div class="mb-3">
                    <h:selectBooleanCheckbox id="cbBiqPos" value="#{pharmacyConfigController.bhtIssueRequestReceiptPos}"/>
                    <h:outputLabel for="cbBiqPos" value="POS Paper" class="ms-2"/>
                </div>
                <p:messages showDetail="true" closable="true"/>
                <div class="d-flex gap-2">
                    <p:commandButton id="btnApplyBiqConfig" value="Apply &amp; Close" icon="fas fa-save"
                                     styleClass="ui-button-success" ajax="false"
                                     action="#{pharmacyConfigController.saveBhtIssueRequestReceiptConfig}"/>
                    <p:commandButton id="btnCancelBiqConfig" value="Cancel" icon="fas fa-times" styleClass="ui-button-secondary"
                                     onclick="PF('bhtIssueRequestPrintConfigDialog').hide(); return false;" type="button"/>
                </div>
            </h:panelGroup>
        </p:dialog>

    </cc:implementation>
</html>
