<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="dto"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <style>
            <h:outputText escape="false"
                value="#{configOptionApplicationController.getLongTextValueByKey('Pharmacy Transfer Receive Receipt CSS')}"/>
        </style>

        <h:outputText escape="false"
                      value="#{configOptionApplicationController.getLongTextValueByKey('Pharmacy Transfer Receive Receipt Header')}"/>

        <div class="receipt-container">
            <div class="receipt-header">
                <div class="receipt-institution-name">
                    <h:outputLabel value="#{cc.attrs.dto.departmentPrintingName}" />
                </div>
                <div class="receipt-institution-contact">
                    <h:outputLabel value="#{cc.attrs.dto.departmentAddress}" /><br/>
                    <h:outputLabel value="#{cc.attrs.dto.departmentPhone1}" /><br/>
                    <h:outputLabel value=" #{cc.attrs.dto.departmentPhone2}" /><br/>
                    <h:outputLabel value="#{cc.attrs.dto.departmentFax}" />
                </div>
            </div>

            <div class="receipt-title">
                <h:outputLabel value="Pharmacy Transfer Receive Receipt" />
                <h:outputLabel value="**Cancelled**" rendered="#{cc.attrs.dto.cancelled}"/>
            </div>

            <div class="receipt-separator"><hr /></div>

            <div class="receipt-bill-details">
                <table class="receipt-details-table">
                    <tr>
                        <td><h:outputLabel value="Date" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4">
                            <h:outputLabel value="#{cc.attrs.dto.receivedAt}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" />
                            </h:outputLabel>
                            <h:outputLabel value="#{cc.attrs.dto.receivedAt}">
                                <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortTimeFormat}" />
                            </h:outputLabel>
                        </td>
                    </tr>
                    <tr>
                        <td><h:outputLabel value="Transferred From" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4"><h:outputLabel value="#{cc.attrs.dto.fromDepartmentName}" /></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel value="Transferred To" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4"><h:outputLabel value="#{cc.attrs.dto.toDepartmentName}" /></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel value="Transporter" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4"><h:outputLabel value="#{cc.attrs.dto.transporterName}" /></td>
                    </tr>
                    <tr>
                        <td colspan="3"><hr/></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel value="Issued Person" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4"><h:outputLabel value="#{cc.attrs.dto.issuedByName} - #{cc.attrs.dto.issuedByStaffCode}" /></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel value="Issued Number" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4"><h:outputLabel value="#{cc.attrs.dto.issueNo}" /></td>
                    </tr>
                    <tr>
                        <td colspan="3"><hr/></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel value="Received Person" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4"><h:outputLabel value="#{cc.attrs.dto.receivedByName}" /></td>
                    </tr>
                    <tr>
                        <td><h:outputLabel value="Receive No" styleClass="label" /></td>
                        <td><h:outputLabel value=":" /></td>
                        <td colspan="4"><h:outputLabel value="#{cc.attrs.dto.receiveNo}" /></td>
                    </tr>
                </table>
            </div>

            <div class="receipt-separator"><hr /></div>

            <div class="receipt-items-section">
                <table class="receipt-items-table">
                    <thead>
                        <tr>
                            <th class="item-name">Item</th>
                            <th class="item-name">Batch</th>
                            <th class="item-qty">DOE</th>
                            <ui:fragment rendered="#{configOptionApplicationController.getBooleanValueByKey('Pharmacy Transfer Receive - Show Rate and Value', false) and webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                <th class="item-rate">PR</th>
                                <th class="item-rate">RR</th>
                                <th class="item-rate">CR</th>
                            </ui:fragment>
                            <th class="item-qty">Qty</th>
                            <ui:fragment rendered="#{configOptionApplicationController.getBooleanValueByKey('Pharmacy Transfer Receive - Show Rate and Value', false) and webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                <th class="item-rate">Rate</th>
                                <th class="item-value">Value</th>
                            </ui:fragment>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat value="#{cc.attrs.dto.items}" var="bip">
                            <tr>
                                <td class="item-name">
                                    <h:outputLabel value="#{bip.itemName}" />
                                </td>
                                <td class="item-name">
                                    <h:outputLabel value="#{bip.batchNo}" />
                                </td>
                                <td class="item-qty">
                                    <h:outputLabel value="#{bip.dateOfExpire}">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}" />
                                    </h:outputLabel>
                                </td>
                                <ui:fragment rendered="#{configOptionApplicationController.getBooleanValueByKey('Pharmacy Transfer Receive - Show Rate and Value', false) and webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                    <td class="item-rate">
                                        <h:outputLabel value="#{bip.purchaseRate}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </td>
                                    <td class="item-rate">
                                        <h:outputLabel value="#{bip.retailRate}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </td>
                                    <td class="item-rate">
                                        <h:outputLabel value="#{bip.costRate}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </td>
                                </ui:fragment>
                                <td class="item-qty">
                                    <h:outputLabel value="#{bip.qty}">
                                        <f:convertNumber pattern="#,##0.##" />
                                    </h:outputLabel>
                                </td>
                                <ui:fragment rendered="#{configOptionApplicationController.getBooleanValueByKey('Pharmacy Transfer Receive - Show Rate and Value', false) and webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                    <td class="item-rate">
                                        <h:outputLabel value="#{bip.rate}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </td>
                                    <td class="item-value">
                                        <h:outputLabel value="#{bip.netValue}">
                                            <f:convertNumber pattern="#,##0.00" />
                                        </h:outputLabel>
                                    </td>
                                </ui:fragment>
                            </tr>
                        </ui:repeat>
                    </tbody>
                </table>
            </div>

            <div class="receipt-separator"><hr /></div>

            <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Pharmacy Transfer Receive - Show Rate and Value', false) and webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                <div class="receipt-summary">
                    <table class="receipt-summary-table">
                        <tr>
                            <td class="summary-label">Total</td>
                            <td class="summary-value">
                                <h:outputLabel value="#{cc.attrs.dto.netTotal}" styleClass="total-amount">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td class="summary-label">Number of Items</td>
                            <td class="summary-value">
                                <h:outputLabel value="#{cc.attrs.dto.items.size()}">
                                    <f:convertNumber pattern="#,##0" />
                                </h:outputLabel>
                            </td>
                        </tr>
                    </table>
                </div>
            </h:panelGroup>

            <div class="receipt-cashier">
                <h:outputLabel value="Received By : #{cc.attrs.dto.receivedByName}" />
            </div>
        </div>

        <h:outputText escape="false"
                      value="#{configOptionApplicationController.getLongTextValueByKey('Pharmacy Transfer Receive Receipt Footer')}"/>

    </cc:implementation>
</html>
