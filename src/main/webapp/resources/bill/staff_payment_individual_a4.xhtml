<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="controller" required="true" />
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" required="true" />
        <cc:attribute name="dup" type="java.lang.Boolean" />
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet library="css" name="inwardpayments.css" />
        <h:panelGroup id="gpIndividualVouchersA4" layout="block">

            <!-- One mini-voucher per patient / BHT -->
            <ui:repeat value="#{cc.attrs.controller.individualVoucherGroups}" var="vg">
                <div class="a4bill1" style="page-break-after: always; margin: 0 auto; padding: 0; max-width: 210mm">

                    <div class="institutionName">
                        <h:outputText value="#{cc.attrs.bill.department.printingName}" />
                    </div>
                    <div class="institutionContact">
                        <div><h:outputText value="#{cc.attrs.bill.department.address}" /></div>
                        <div>
                            <h:outputText value="Phone : #{cc.attrs.bill.department.telephone1}" />
                        </div>
                    </div>

                    <div class="billline"><hr/></div>

                    <div style="text-align: center; font-weight: bold; font-size: 13pt">
                        <h:outputText value="PAYMENT VOUCHER" />
                        <h:outputText value="**Duplicate**" rendered="#{cc.attrs.dup eq true}" />
                    </div>

                    <div class="billline"><hr/></div>

                    <div class="billDetailsFiveFive">
                        <table style="width: 95%!important;" align="center">
                            <tr>
                                <td><h:outputText value="Bill ID" class="billDetailsFiveFive" /></td>
                                <td style="text-align: center;">:</td>
                                <td><h:outputText value="#{cc.attrs.bill.deptId}" class="billDetailsFiveFive" /></td>
                                <td width="2%" />
                                <td><h:outputText value="Payment Type" class="billDetailsFiveFive" /></td>
                                <td style="text-align: center;">:</td>
                                <td><h:outputText value="#{cc.attrs.bill.paymentMethod}" class="billDetailsFiveFive" /></td>
                            </tr>
                            <tr>
                                <td><h:outputText value="Date" class="billDetailsFiveFive" /></td>
                                <td style="text-align: center;">:</td>
                                <td>
                                    <h:outputText value="#{cc.attrs.bill.billDate}" class="billDetailsFiveFive">
                                        <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" />
                                    </h:outputText>
                                </td>
                                <td width="2%" />
                                <td><h:outputText value="Time" class="billDetailsFiveFive" /></td>
                                <td style="text-align: center;">:</td>
                                <td>
                                    <h:outputText value="#{cc.attrs.bill.billTime}" class="billDetailsFiveFive">
                                        <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longTimeFormat}" />
                                    </h:outputText>
                                </td>
                            </tr>
                            <tr>
                                <td><h:outputText value="Doctor Name" class="billDetailsFiveFive" /></td>
                                <td style="text-align: center;">:</td>
                                <td>
                                    <h:outputText value="#{cc.attrs.bill.staff.person.nameWithTitle}" style="text-transform: capitalize;" class="billDetailsFiveFive" />
                                </td>
                                <td width="2%" />
                                <td><h:outputText value="Speciality" class="billDetailsFiveFive" /></td>
                                <td style="text-align: center;">:</td>
                                <td><h:outputText value="#{cc.attrs.bill.staff.speciality.name}" class="billDetailsFiveFive" /></td>
                            </tr>
                        </table>
                    </div>

                    <div class="billline"><hr/></div>

                    <!-- Patient / BHT identity -->
                    <div style="text-align: center; font-weight: bold; font-size: 12pt; margin: 6px 0;">
                        <h:outputText value="#{vg.displayName}" />
                        <h:outputText value=" — #{vg.displayIdentifier}" rendered="#{not empty vg.displayIdentifier}" />
                    </div>

                    <div class="billline"><hr/></div>

                    <!-- Fee lines of this patient / BHT -->
                    <div class="billDetailsFiveFive">
                        <h:dataTable value="#{vg.billItems}" var="bip"
                                     style="margin: auto; padding: 1%; width: 95%;">
                            <h:column>
                                <f:facet name="header"><h:outputText value="Bill No" /></f:facet>
                                <h:outputText value="#{bip.paidForBillFee.bill.deptId}" style="font-size: 10pt!important;" />
                            </h:column>
                            <h:column>
                                <f:facet name="header"><h:outputText value="Investigation/Service" /></f:facet>
                                <h:outputText value="#{bip.referanceBillItem.item.name}" style="font-size: 10pt!important;" />
                            </h:column>
                            <h:column>
                                <f:facet name="header"><h:outputText value="Fee Type" /></f:facet>
                                <h:outputText value="#{bip.paidForBillFee.fee.feeType}" style="font-size: 10pt!important;" />
                            </h:column>
                            <h:column>
                                <f:facet name="header"><h:outputText value="Value" /></f:facet>
                                <h:outputText value="#{bip.netValue}" style="font-size: 10pt!important; text-align: right!important;">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputText>
                            </h:column>
                        </h:dataTable>
                    </div>

                    <div class="billline"><hr/></div>

                    <!-- Patient subtotal (item values are stored positive) -->
                    <div>
                        <table style="width: 100%;">
                            <tr>
                                <td style="text-align: left; width: 60%; font-size: 16px!important; font-weight: bold;">
                                    &nbsp;&nbsp;<h:outputText value="Total for #{vg.displayName}" />
                                </td>
                                <td style="text-align: right!important; width: 40%; padding-right: 32px; font-size: 16px!important; font-weight: bold;">
                                    <h:outputText value="#{vg.subtotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </td>
                            </tr>
                        </table>
                    </div>

                    <div class="billline"><hr/></div>

                    <!-- Signature footer on every page -->
                    <div class="footer">
                        <div class="row">
                            <div class="col-4">
                                <h:outputText value="--------------------------" /><br/>
                                <h:outputText value="Cashier : #{cc.attrs.bill.creater.webUserPerson.name}" />
                            </div>
                            <div class="col-4">
                                <br/>
                                <h:outputText value="Payment Received" />
                            </div>
                            <div class="col-4">
                                <h:outputText value="--------------------------" /><br/>
                                <h:outputText value="Professional : #{cc.attrs.bill.toStaff.person.nameWithTitle}" />
                            </div>
                        </div>
                    </div>
                </div>
            </ui:repeat>

            <!-- Final summary page (grand totals; bill totals are stored negative) -->
            <div class="a4bill1" style="margin: 0 auto; padding: 0; max-width: 210mm">
                <div class="institutionName">
                    <h:outputText value="#{cc.attrs.bill.department.printingName}" />
                </div>
                <div class="billline"><hr/></div>
                <div style="text-align: center; font-weight: bold; font-size: 13pt">
                    <h:outputText value="PAYMENT VOUCHER — SUMMARY" />
                    <h:outputText value="**Duplicate**" rendered="#{cc.attrs.dup eq true}" />
                </div>
                <div class="billline"><hr/></div>
                <div class="billDetailsFiveFive">
                    <table style="width: 95%!important;" align="center">
                        <tr>
                            <td><h:outputText value="Bill ID" class="billDetailsFiveFive" /></td>
                            <td style="text-align: center;">:</td>
                            <td><h:outputText value="#{cc.attrs.bill.deptId}" class="billDetailsFiveFive" /></td>
                            <td width="2%" />
                            <td><h:outputText value="Doctor" class="billDetailsFiveFive" /></td>
                            <td style="text-align: center;">:</td>
                            <td><h:outputText value="#{cc.attrs.bill.staff.person.nameWithTitle}" class="billDetailsFiveFive" /></td>
                        </tr>
                    </table>
                </div>
                <div class="billline"><hr/></div>
                <div>
                    <table style="width: 100%;">
                        <tr>
                            <td style="text-align: left; width: 60%; font-size: 20px!important; font-weight: bold;">
                                &nbsp;&nbsp;<h:outputText value="Gross Total" />
                            </td>
                            <td style="text-align: right!important; width: 40%; padding-right: 32px; font-size: 20px!important; font-weight: bold;">
                                <h:outputText value="#{-cc.attrs.bill.total}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputText>
                            </td>
                        </tr>
                        <tr>
                            <td style="text-align: left; width: 60%; font-size: 20px!important; font-weight: bold;">
                                &nbsp;&nbsp;<h:outputText value="Withholding Tax" />
                            </td>
                            <td style="text-align: right!important; width: 40%; padding-right: 32px; font-size: 20px!important; font-weight: bold;">
                                <h:outputText value="#{-cc.attrs.bill.tax}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputText>
                            </td>
                        </tr>
                        <tr>
                            <td style="text-align: left; width: 60%; font-size: 20px!important; font-weight: bold;">
                                &nbsp;&nbsp;<h:outputText value="Net Total" />
                            </td>
                            <td style="text-align: right!important; width: 40%; padding-right: 32px; font-size: 20px!important; font-weight: bold;">
                                <h:outputText value="#{-cc.attrs.bill.netTotal}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputText>
                            </td>
                        </tr>
                    </table>
                </div>
                <div class="billline"><hr/></div>
                <div class="footer">
                    <div class="row">
                        <div class="col-4">
                            <h:outputText value="--------------------------" /><br/>
                            <h:outputText value="Cashier : #{cc.attrs.bill.creater.webUserPerson.name}" />
                        </div>
                        <div class="col-4">
                            <br/>
                            <h:outputText value="Payment Received" />
                        </div>
                        <div class="col-4">
                            <h:outputText value="--------------------------" /><br/>
                            <h:outputText value="Professional : #{cc.attrs.bill.toStaff.person.nameWithTitle}" />
                        </div>
                    </div>
                </div>
            </div>

        </h:panelGroup>
    </cc:implementation>
</html>
