<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="controller" required="true" />
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" required="true" />
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet library="css" name="opd_five_five.css" />
        <h:panelGroup id="gpIndividualVouchersFiveFive" layout="block">

            <!-- One mini-voucher per patient / BHT -->
            <ui:repeat value="#{cc.attrs.controller.individualVoucherGroups}" var="vg">
                <div class="fiveinchbill" style="page-break-after: always;">
                    <div style="margin-left: 5%; margin-right: 5%">

                        <div class="institutionName">
                            <h:outputLabel value="#{cc.attrs.bill.department.printingName}" />
                        </div>

                        <div class="h6 my-2" style="text-align: center; font-weight: bold;">
                            <h:outputLabel value="PAYMENT VOUCHER" />
                            <h:outputLabel value="(#{cc.attrs.bill.deptId})" class="mx-2" />
                        </div>

                        <div class="billline"><hr/></div>

                        <div class="billDetailsFiveFive">
                            <div class="d-flex gap-2">
                                <h:outputLabel value="Date : " />
                                <h:outputLabel value="#{cc.attrs.bill.billDate}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" />
                                </h:outputLabel>
                                <h:outputLabel value="Payment : #{cc.attrs.bill.paymentMethod}" class="ms-3" />
                            </div>
                            <div class="d-flex gap-2">
                                <h:outputLabel value="Doctor : " />
                                <h:outputLabel value="#{cc.attrs.bill.staff.person.nameWithTitle}" style="text-transform: capitalize;" />
                            </div>
                        </div>

                        <div class="billline"><hr/></div>

                        <!-- Patient / BHT identity -->
                        <div style="text-align: center; font-weight: bold; margin: 4px 0;">
                            <h:outputLabel value="#{vg.displayName}" />
                            <h:outputLabel value=" — #{vg.displayIdentifier}" rendered="#{not empty vg.displayIdentifier}" />
                        </div>

                        <div class="billline"><hr/></div>

                        <!-- Fee lines of this patient / BHT -->
                        <div class="billDetailsFiveFive">
                            <h:dataTable value="#{vg.billItems}" var="bip" style="width: 100%;">
                                <h:column>
                                    <f:facet name="header"><h:outputLabel value="Bill No" /></f:facet>
                                    <h:outputLabel value="#{bip.paidForBillFee.bill.deptId}" />
                                </h:column>
                                <h:column>
                                    <f:facet name="header"><h:outputLabel value="Service" /></f:facet>
                                    <h:outputLabel value="#{bip.referanceBillItem.item.name}" />
                                </h:column>
                                <h:column>
                                    <f:facet name="header"><h:outputLabel value="Fee Type" /></f:facet>
                                    <h:outputLabel value="#{bip.paidForBillFee.fee.feeType}" />
                                </h:column>
                                <h:column>
                                    <f:facet name="header"><h:outputLabel value="Value" /></f:facet>
                                    <h:outputLabel value="#{bip.netValue}" style="text-align: right!important;">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                </h:column>
                            </h:dataTable>
                        </div>

                        <div class="billline"><hr/></div>

                        <!-- Patient subtotal (item values are stored positive) -->
                        <table style="width: 100%;">
                            <tr>
                                <td class="totalsBlock" style="text-align: left; width: 60%; font-weight: bold;">
                                    <h:outputLabel value="Total for #{vg.displayName}" />
                                </td>
                                <td class="totalsBlock" style="text-align: right!important; width: 40%; font-weight: bold;">
                                    <h:outputLabel value="#{vg.subtotal}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputLabel>
                                </td>
                            </tr>
                        </table>

                        <div class="billline"><hr/></div>

                        <!-- Signature footer on every page -->
                        <div class="footer">
                            <div class="row">
                                <div class="col-4">
                                    <h:outputLabel value="--------------------------" /><br/>
                                    <h:outputLabel value="Cashier : #{cc.attrs.bill.creater.webUserPerson.name}" />
                                </div>
                                <div class="col-4">
                                    <br/>
                                    <h:outputLabel value="Payment Received" />
                                </div>
                                <div class="col-4">
                                    <h:outputLabel value="--------------------------" /><br/>
                                    <h:outputLabel value="Professional : #{cc.attrs.bill.toStaff.person.nameWithTitle}" />
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </ui:repeat>

            <!-- Final summary page (grand totals; bill totals are stored negative) -->
            <div class="fiveinchbill">
                <div style="margin-left: 5%; margin-right: 5%">

                    <div class="institutionName">
                        <h:outputLabel value="#{cc.attrs.bill.department.printingName}" />
                    </div>

                    <div class="h6 my-2" style="text-align: center; font-weight: bold;">
                        <h:outputLabel value="PAYMENT VOUCHER — SUMMARY" />
                        <h:outputLabel value="(#{cc.attrs.bill.deptId})" class="mx-2" />
                    </div>

                    <div class="billline"><hr/></div>

                    <div class="billDetailsFiveFive">
                        <div class="d-flex gap-2">
                            <h:outputLabel value="Doctor : " />
                            <h:outputLabel value="#{cc.attrs.bill.staff.person.nameWithTitle}" style="text-transform: capitalize;" />
                        </div>
                    </div>

                    <div class="billline"><hr/></div>

                    <table style="width: 100%;">
                        <tr>
                            <td class="totalsBlock" style="text-align: left; width: 60%; font-weight: bold;">
                                <h:outputLabel value="Gross Total" />
                            </td>
                            <td class="totalsBlock" style="text-align: right!important; width: 40%; font-weight: bold;">
                                <h:outputLabel value="#{-cc.attrs.bill.total}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td class="totalsBlock" style="text-align: left; width: 60%; font-weight: bold;">
                                <h:outputLabel value="Withholding Tax" />
                            </td>
                            <td class="totalsBlock" style="text-align: right!important; width: 40%; font-weight: bold;">
                                <h:outputLabel value="#{-cc.attrs.bill.tax}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td class="totalsBlock" style="text-align: left; width: 60%; font-weight: bold;">
                                <h:outputLabel value="Net Total" />
                            </td>
                            <td class="totalsBlock" style="text-align: right!important; width: 40%; font-weight: bold;">
                                <h:outputLabel value="#{-cc.attrs.bill.netTotal}">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputLabel>
                            </td>
                        </tr>
                    </table>

                    <div class="billline"><hr/></div>

                    <div class="footer">
                        <div class="row">
                            <div class="col-4">
                                <h:outputLabel value="--------------------------" /><br/>
                                <h:outputLabel value="Cashier : #{cc.attrs.bill.creater.webUserPerson.name}" />
                            </div>
                            <div class="col-4">
                                <br/>
                                <h:outputLabel value="Payment Received" />
                            </div>
                            <div class="col-4">
                                <h:outputLabel value="--------------------------" /><br/>
                                <h:outputLabel value="Professional : #{cc.attrs.bill.toStaff.person.nameWithTitle}" />
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </h:panelGroup>
    </cc:implementation>
</html>
