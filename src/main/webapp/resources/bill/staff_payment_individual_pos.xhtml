<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="controller" required="true" />
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill" required="true" />
        <cc:attribute name="dup" type="java.lang.Boolean" />
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:outputStylesheet library="css" name="pharmacypos.css" />
        <h:panelGroup id="gpIndividualVouchersPos" layout="block">

            <!-- One mini-voucher per patient / BHT -->
            <ui:repeat value="#{cc.attrs.controller.individualVoucherGroups}" var="vg">
                <div class="posbillBreak" style="page-break-after: always!important;">

                    <div class="institutionName" style="text-align: center!important;">
                        <h:outputText value="#{cc.attrs.bill.department.printingName}" />
                    </div>

                    <div class="headingBill" style="text-align: center; font-weight: bold;">
                        <h:outputText value="PAYMENT VOUCHER" />
                        <br/>
                        <h:outputText value="**Duplicate**" rendered="#{cc.attrs.dup eq true}" />
                    </div>

                    <div class="billline"><hr/></div>

                    <div class="billDetails">
                        <div>
                            <h:outputText value="Bill ID : #{cc.attrs.bill.deptId}" />
                        </div>
                        <div>
                            <h:outputText value="Date : " />
                            <h:outputText value="#{cc.attrs.bill.billDate}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateFormat}" />
                            </h:outputText>
                        </div>
                        <div>
                            <h:outputText value="Payment : #{cc.attrs.bill.paymentMethod}" />
                        </div>
                        <div>
                            <h:outputText value="Doctor : #{cc.attrs.bill.staff.person.nameWithTitle}" style="text-transform: capitalize;" />
                        </div>
                    </div>

                    <div class="billline"><hr/></div>

                    <!-- Patient / BHT identity -->
                    <div style="text-align: center; font-weight: bold;">
                        <h:outputText value="#{vg.displayName}" />
                        <br/>
                        <h:outputText value="#{vg.displayIdentifier}" rendered="#{not empty vg.displayIdentifier}" />
                    </div>

                    <div class="billline"><hr/></div>

                    <!-- Fee lines of this patient / BHT (narrow POS layout) -->
                    <table style="width: 100%;">
                        <tr>
                            <td style="text-align: left; font-weight: bold;">Bill No</td>
                            <td style="text-align: left; font-weight: bold;">Service</td>
                            <td style="text-align: right; font-weight: bold;">Value</td>
                        </tr>
                        <ui:repeat value="#{vg.billItems}" var="bip">
                            <tr>
                                <td style="text-align: left;">
                                    <h:outputText value="#{bip.paidForBillFee.bill.deptId}" />
                                </td>
                                <td style="text-align: left;">
                                    <h:outputText value="#{bip.referanceBillItem.item.name}" />
                                </td>
                                <td style="text-align: right;">
                                    <h:outputText value="#{bip.netValue}">
                                        <f:convertNumber pattern="#,##0.00" />
                                    </h:outputText>
                                </td>
                            </tr>
                        </ui:repeat>
                    </table>

                    <div class="billline"><hr/></div>

                    <!-- Patient subtotal (item values are stored positive) -->
                    <table style="width: 100%;">
                        <tr>
                            <td class="totalsBlock" style="text-align: left; width: 60%;">
                                <h:outputText value="Total" style="font-weight: bold;" />
                            </td>
                            <td class="totalsBlock" style="text-align: right!important; width: 40%;">
                                <h:outputText value="#{vg.subtotal}" style="font-weight: bold;">
                                    <f:convertNumber pattern="#,##0.00" />
                                </h:outputText>
                            </td>
                        </tr>
                    </table>

                    <div class="billline"><hr/></div>

                    <!-- Signature footer on every page (stacked for POS width) -->
                    <div>
                        <br/>
                        <h:outputText value="--------------------------" /><br/>
                        <h:outputText value="Cashier : #{cc.attrs.bill.creater.webUserPerson.name}" /><br/>
                        <br/>
                        <h:outputText value="--------------------------" /><br/>
                        <h:outputText value="Professional : #{cc.attrs.bill.toStaff.person.nameWithTitle}" />
                    </div>
                </div>
            </ui:repeat>

            <!-- Final summary page (grand totals; bill totals are stored negative) -->
            <div class="posbillBreak" style="page-break-after: auto!important;">

                <div class="institutionName" style="text-align: center!important;">
                    <h:outputText value="#{cc.attrs.bill.department.printingName}" />
                </div>

                <div class="headingBill" style="text-align: center; font-weight: bold;">
                    <h:outputText value="PAYMENT VOUCHER — SUMMARY" />
                    <br/>
                    <h:outputText value="**Duplicate**" rendered="#{cc.attrs.dup eq true}" />
                </div>

                <div class="billline"><hr/></div>

                <div class="billDetails">
                    <div>
                        <h:outputText value="Bill ID : #{cc.attrs.bill.deptId}" />
                    </div>
                    <div>
                        <h:outputText value="Doctor : #{cc.attrs.bill.staff.person.nameWithTitle}" style="text-transform: capitalize;" />
                    </div>
                </div>

                <div class="billline"><hr/></div>

                <table style="width: 100%;">
                    <tr>
                        <td class="totalsBlock" style="text-align: left; width: 60%;">
                            <h:outputText value="Gross Total" style="font-weight: bold;" />
                        </td>
                        <td class="totalsBlock" style="text-align: right!important; width: 40%;">
                            <h:outputText value="#{-cc.attrs.bill.total}" style="font-weight: bold;">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputText>
                        </td>
                    </tr>
                    <tr>
                        <td class="totalsBlock" style="text-align: left; width: 60%;">
                            <h:outputText value="Withholding Tax" style="font-weight: bold;" />
                        </td>
                        <td class="totalsBlock" style="text-align: right!important; width: 40%;">
                            <h:outputText value="#{-cc.attrs.bill.tax}" style="font-weight: bold;">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputText>
                        </td>
                    </tr>
                    <tr>
                        <td class="totalsBlock" style="text-align: left; width: 60%;">
                            <h:outputText value="Net Total" style="font-weight: bold;" />
                        </td>
                        <td class="totalsBlock" style="text-align: right!important; width: 40%;">
                            <h:outputText value="#{-cc.attrs.bill.netTotal}" style="font-weight: bold;">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputText>
                        </td>
                    </tr>
                </table>

                <div class="billline"><hr/></div>

                <div>
                    <br/>
                    <h:outputText value="--------------------------" /><br/>
                    <h:outputText value="Cashier : #{cc.attrs.bill.creater.webUserPerson.name}" /><br/>
                    <br/>
                    <h:outputText value="--------------------------" /><br/>
                    <h:outputText value="Professional : #{cc.attrs.bill.toStaff.person.nameWithTitle}" />
                </div>
            </div>

        </h:panelGroup>
    </cc:implementation>
</html>
