<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE ui:composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
    <!-- Maintenance banner (#25838). Reads an application-scoped cache, so no query per page. -->
    <ui:repeat value="#{maintenanceBannerCache.visibleFor(sessionController.institution, sessionController.department)}" var="mw">
        <div class="alert alert-warning py-1 px-3 m-0 text-center" role="alert" style="border-radius: 0; font-size: 0.9em;">
            <i class="fa fa-screwdriver-wrench mx-1"></i>
            <strong><h:outputText value="#{mw.title}" rendered="#{not empty mw.title}" /></strong>
            <h:outputText value=" - " rendered="#{not empty mw.title}" />
            <h:outputText value="#{mw.message}" />
            <h:outputText value=" (" />
            <h:outputText value="#{mw.startAt}">
                <f:convertDateTime pattern="dd MMM yyyy HH:mm" />
            </h:outputText>
            <h:outputText value=" to " />
            <h:outputText value="#{mw.endAt}">
                <f:convertDateTime pattern="dd MMM yyyy HH:mm" />
            </h:outputText>
            <h:outputText value=")" />
        </div>
    </ui:repeat>
</ui:composition>
