    <rect x="62" y="98" width="76" height="10" fill="#0891B2"/>
    <rect x="68" y="147" width="64" height="28" rx="4" fill="white"/>
    <rect x="76" y="156" width="48" height="5" rx="2" fill="#0891B2" opacity="0.4"/>
