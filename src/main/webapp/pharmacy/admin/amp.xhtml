<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/pharmacy/admin/index.xhtml">
            <ui:define name="subcontent">
                <h:form id="form">
                    <p:growl id="msg" life="3000"/>



                    <p:panel styleClass="mb-3">
                    <f:facet name="header">
                        <div class="d-flex justify-content-between align-items-center w-100">
                            <div class="d-flex align-items-center gap-2">
                                <h:outputText styleClass="fa fa-pills"/>
                                <h:outputText value="AMP Management"/>
                            </div>
                            <h:panelGroup id="actionButtons" layout="block" styleClass="d-flex align-items-center gap-2">
                                <p:commandButton
                                    id="btnViewList"
                                    value="All AMPs List"
                                    action="#{ampController.navigateToAmpList()}"
                                    ajax="false"
                                    styleClass="ui-button-info ui-button-outlined"
                                    icon="fas fa-list"
                                    title="View and download the full list of AMPs"/>
                                <p:commandButton
                                    id="btnAuditEvents"
                                    value="Audit History"
                                    action="#{ampController.navigateToAmpAuditEvents()}"
                                    icon="fas fa-history"
                                    ajax="false"
                                    styleClass="ui-button-info ui-button-outlined"
                                    disabled="#{ampController.current.id eq null}"
                                    title="View audit history for this AMP record"/>
                                <p:commandButton
                                    id="btnDelete"
                                    value="Retire Selected"
                                    action="#{ampController.prepareRetire()}"
                                    icon="fas fa-trash"
                                    update="form:msg retireDlg"
                                    process="@this"
                                    oncomplete="if (args &amp;&amp; args.canRetire) PF('retireDlgWidget').show();"
                                    styleClass="ui-button-danger"
                                    rendered="#{not ampController.current.retired}"
                                    disabled="#{ampController.editable or ampController.current.id eq null}"
                                    title="Retire selected AMP record (a reason is required)"/>
                                <p:commandButton
                                    id="btnUnretire"
                                    value="Un-retire Selected"
                                    action="#{ampController.prepareUnretire()}"
                                    icon="fas fa-undo"
                                    update="form:msg unretireDlg"
                                    process="@this"
                                    oncomplete="if (args &amp;&amp; args.canUnretire) PF('unretireDlgWidget').show();"
                                    styleClass="ui-button-success"
                                    rendered="#{ampController.current.retired and ampController.unretireAllowed}"
                                    title="Reverse the retirement of this AMP (a reason is required)"/>
                                <p:commandButton
                                    id="btnToggleStatus"
                                    value="#{ampController.toggleStatusButtonText}"
                                    action="#{ampController.toggleAmpStatus()}"
                                    icon="#{ampController.toggleStatusButtonIcon}"
                                    update="form:msg acAmp detailPanel actionButtons statusFilterPanel filterStatusLabel"
                                    process="@this"
                                    styleClass="#{ampController.toggleStatusButtonClass} amp-toggle-status"
                                    disabled="#{ampController.editable or ampController.current.id eq null or ampController.current.retired}"
                                    title="Toggle AMP active/inactive status">
                                    <p:confirm
                                        header="Confirm Status Change"
                                        message="Are you sure you want to #{ampController.current.inactive ? 'ACTIVATE' : 'DEACTIVATE'} this AMP: #{ampController.current.name}?"
                                        icon="fas fa-question-circle" />
                        </p:commandButton>
                                <p:commandButton
                                    id="btnEdit"
                                    value="Edit Selected"
                                    action="#{ampController.edit()}"
                                    icon="fas fa-edit"
                                    update="detailPanel acAmp actionButtons statusFilterPanel"
                                    process="@this"
                                    styleClass="ui-button-warning"
                                    disabled="#{ampController.editable or ampController.current.id eq null or ampController.current.retired}"
                                    title="Edit selected AMP record"/>
                                <p:commandButton
                                    id="btnAdd"
                                    value="Add New"
                                    action="#{ampController.prepareAdd()}"
                                    styleClass="ui-button-success" style="min-width:120px"
                                    update="acAmp detailPanel actionButtons statusFilterPanel"
                                    icon="fas fa-plus"
                                    process="@this"
                                    disabled="#{ampController.editable}"
                                    title="Add a new AMP record"/>
                            </h:panelGroup>
                        </div>
                    </f:facet>

                        <div class="row" >
                            <div class="col-6" >
                                <!-- Status Filter Section -->
                                <h:panelGroup id="statusFilterPanel" layout="block" styleClass="status-filter-section mb-3">
                                    <div class="d-flex gap-2 align-items-center">
                                        <label class="form-label mb-0">Filter:</label>
                                        <p:commandButton
                                            id="btnFilterActive"
                                            value="Active"
                                            action="#{ampController.setFilterToActive()}"
                                            update="acAmp detailPanel statusFilterPanel actionButtons"
                                            process="@this"
                                            styleClass="m-1 #{ampController.showingActive ? 'ui-button-success' : 'ui-button-outlined ui-button-success'}"
                                            icon="fas fa-check-circle"
                                            disabled="#{ampController.editable}"
                                            title="Show only active AMPs"/>

                                        <p:commandButton
                                            id="btnFilterInactive"
                                            value="Inactive"
                                            action="#{ampController.setFilterToInactive()}"
                                            update="acAmp detailPanel statusFilterPanel actionButtons"
                                            process="@this"
                                            styleClass="m-1 #{ampController.showingInactive ? 'ui-button-danger' : 'ui-button-outlined ui-button-danger'}"
                                            icon="fas fa-times-circle"
                                            disabled="#{ampController.editable}"
                                            title="Show only inactive AMPs"/>

                                        <p:commandButton
                                            id="btnFilterRetired"
                                            value="Retired"
                                            action="#{ampController.setFilterToRetired()}"
                                            update="acAmp detailPanel statusFilterPanel actionButtons"
                                            process="@this"
                                            styleClass="m-1 #{ampController.showingRetired ? 'ui-button-secondary' : 'ui-button-outlined ui-button-secondary'}"
                                            icon="fas fa-archive"
                                            disabled="#{ampController.editable}"
                                            title="Show only retired AMPs"/>

                                        <p:commandButton
                                            id="btnFilterAll"
                                            value="All"
                                            action="#{ampController.setFilterToAll()}"
                                            update="acAmp detailPanel statusFilterPanel actionButtons"
                                            process="@this"
                                            styleClass="m-1 #{ampController.showingAll ? 'ui-button-info' : 'ui-button-outlined ui-button-info'}"
                                            icon="fas fa-list"
                                            disabled="#{ampController.editable}"
                                            title="Show all AMPs"/>
                                    </div>

                                    <p:outputLabel id="filterStatusLabel"
                                                   value="Currently showing: #{ampController.filterStatusDisplay}"
                                                   styleClass="text-muted small mt-1"/>



                                </h:panelGroup>
                                <!-- Modern Search Section -->
                                <div class="search-section mb-3">
                                    <h:outputText value="Search &amp; Select AMP" styleClass="mb-2 d-block"/>
                                    <p:autoComplete
                                        id="acAmp"
                                        class="w-100"
                                        inputStyleClass="w-100"
                                        value="#{ampController.selectedAmpDto}"
                                        queryDelay="300" completeMethod="#{ampController.completeAmpDto}"
                                        var="dto"
                                        itemLabel="#{dto.name}"
                                        itemValue="#{dto}"
                                        converter="ampDtoConverter"
                                        maxResults="20"
                                        minQueryLength="2"
                                        forceSelection="true"
                                        disabled="#{ampController.editable}"
                                        placeholder="Search by name, code, or barcode (minimum 2 characters)...">
                                        <p:ajax event="itemSelect"
                                                process="@this"
                                                update="detailPanel actionButtons" />
                                        <p:column headerText="Name" style="padding: 3px;">
                                            <div class="d-flex justify-content-between align-items-center">
                                                <h:outputText value="#{dto.name}"/>
                                                <p:badge value="#{dto.inactive ? 'INACTIVE' : 'ACTIVE'}"
                                                         severity="#{dto.inactive ? 'danger' : 'success'}"
                                                         style="font-size: 0.65em; margin-left: 8px;"/>
                                            </div>
                                        </p:column>
                                    </p:autoComplete>
                                </div>




                            </div>
                            <div class="col-6" >

                                <p:panel id="detailPanel" styleClass="h-100">
                                    <f:facet name="header">
                                        <div class="d-flex justify-content-between align-items-center w-100">
                                            <!-- Labels - Left -->
                                            <div class="d-flex align-items-center">
                                                <h:outputLabel value="AMP Details"
                                                               rendered="#{empty ampController.current}"
                                                               styleClass="fw-bold mb-0"/>
                                                <h:outputLabel value="Add New AMP"
                                                               rendered="#{not empty ampController.current and empty ampController.current.id}"
                                                               styleClass="fw-bold mb-0"/>
                                                <h:outputLabel value="Edit AMP Details"
                                                               rendered="#{not empty ampController.current and not empty ampController.current.id}"
                                                               styleClass="fw-bold mb-0"/>
                                            </div>
                                            <!-- Status - Centre -->
                                            <div class="d-flex align-items-center gap-2">
                                                <h:panelGroup rendered="#{ampController.current ne null and ampController.current.id ne null}"
                                                              styleClass="badge #{ampController.current.inactive ? 'badge-danger' : 'badge-success'}">
                                                    <h:outputLabel value="#{ampController.current.inactive ? 'Inactive' : 'Active'}"
                                                                   styleClass="mb-0"/>
                                                </h:panelGroup>
                                                <h:panelGroup rendered="#{ampController.editable}"
                                                              styleClass="badge badge-warning">
                                                    <h:outputLabel value="#{ampController.current.id ne null ? 'Editing' : 'Adding New'}"
                                                                   styleClass="mb-0"/>
                                                </h:panelGroup>
                                            </div>
                                            <!-- Buttons - Right -->
                                            <div class="d-flex align-items-center gap-1">
                                                <p:commandButton
                                                    id="btnCancel"
                                                    value="Cancel"
                                                    action="#{ampController.cancel()}"
                                                    update="acAmp detailPanel actionButtons statusFilterPanel"
                                                    process="@this"
                                                    styleClass="ui-button-secondary"
                                                    icon="fas fa-times"
                                                    disabled="#{!ampController.editable}"
                                                    title="Cancel changes and clear form"/>
                                                <p:commandButton
                                                    id="btnSave"
                                                    value="Save"
                                                    action="#{ampController.save}"
                                                    update="form:msg acAmp detailPanel actionButtons statusFilterPanel"
                                                    process="@form"
                                                    styleClass="ui-button-success" style="min-width:120px"
                                                    icon="fas fa-save"
                                                    disabled="#{!ampController.editable}"
                                                    title="Save AMP record"/>
                                            </div>
                                        </div>
                                    </f:facet>

                                    <!-- Clean, simplified form fields -->
                                    <h:panelGroup layout="block" styleClass="form-section" rendered="#{ampController.current ne null}">

                                        <!-- Essential Information Section -->
                                        <h:outputText value="Essential Information" styleClass="section-header d-block"/>
                                        <div class="row g-3 mb-3">
                                            <div class="col-md-6">
                                                <p:outputLabel for="ampName" value="AMP Name"/>
                                                <p:inputText id="ampName"
                                                             value="#{ampController.current.name}"
                                                             class="form-control"
                                                             disabled="#{not ampController.editable}"
                                                             required="true"
                                                             requiredMessage="AMP name is required"/>
                                            </div>
                                            <div class="col-md-3">
                                                <p:outputLabel for="ampCode" value="Code *">
                                                    <i class="fas fa-info-circle ms-1 text-muted"
                                                       title="Auto-generated if blank"></i>
                                                </p:outputLabel>
                                                <div class="input-group">
                                                    <p:inputText id="ampCode"
                                                                 value="#{ampController.current.code}"
                                                                 class="form-control"
                                                                 disabled="#{not ampController.editable}"/>
                                                    <p:commandButton icon="fas fa-magic"
                                                                     title="Generate Code"
                                                                     action="#{ampController.generateCode()}"
                                                                     update="ampCode"
                                                                     rendered="#{ampController.editable}"
                                                                     styleClass="ui-button-secondary ui-button-outlined"
                                                                     process="@this"/>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <p:outputLabel for="ampBarcode" value="Barcode"/>
                                                <p:inputText id="ampBarcode"
                                                             value="#{ampController.current.barcode}"
                                                             class="form-control"
                                                             disabled="#{not ampController.editable}"/>
                                            </div>
                                        </div>

                                        <!-- VMP Relationship Section -->
                                        <h:outputText value="Product Information" styleClass="section-header d-block"/>
                                        <div class="row g-3 mb-3">
                                            <div class="col-md-6">
                                                <p:outputLabel for="vmpSelect" value="VMP"/>
                                                <p:autoComplete id="vmpSelect"
                                                                value="#{ampController.current.vmp}"
                                                                completeMethod="#{ampController.completeVmpByName}"
                                                                var="vmp"
                                                                inputStyleClass="w-100"
                                                                itemLabel="#{vmp.name}"
                                                                itemValue="#{vmp}"
                                                                converter="vmp"
                                                                disabled="#{not ampController.editable}"
                                                                class="w-100"
                                                                required="true"
                                                                requiredMessage="VMP selection is required">
                                                    <p:ajax event="itemSelect" update="dosageInfo txtShortExpiary"/>
                                                </p:autoComplete>
                                            </div>
                                            <div class="col-md-6">
                                                <h:panelGroup id="dosageInfo">
                                                    <p:outputLabel value="Dosage Form"/>
                                                    <p:selectOneMenu 
                                                        id="selDosageForm"
                                                        value="#{ampController.current.dosageForm}"
                                                        styleClass="form-control-plaintext"
                                                        filter="true"
                                                        required="true"
                                                        requiredMessage="Dosage Form is required"
                                                        disabled="#{!ampController.editable}">
                                                        <f:selectItem itemLabel="-- Select Dosage Form --" itemValue="#{null}"/>
                                                        <f:selectItems 
                                                            value="#{dosageFormController.items}"
                                                            var="df" 
                                                            itemValue="#{df}" 
                                                            itemLabel="#{df.name}"/>
                                                    </p:selectOneMenu>

                                                </h:panelGroup>
                                            </div>
                                        </div>

                                        <div class="row g-3 mb-3">
                                            <div class="col-md-6">
                                                <p:outputLabel for="ampCat" value="Category"/>
                                                <p:autoComplete 
                                                    id="ampCat"
                                                    value="#{ampController.current.category}"
                                                    completeMethod="#{pharmaceuticalItemCategoryController.completeCategory}" 
                                                    var="vt"
                                                    inputStyleClass="w-100"
                                                    itemLabel="#{vt.name}"
                                                    forceSelection="true"
                                                    itemValue="#{vt}"
                                                    disabled="#{not ampController.editable}"
                                                    class="w-100"
                                                    required="true"
                                                    requiredMessage="Category is required">                                                    
                                                </p:autoComplete>
                                            </div>
                                            <div class="col-md-6">
                                                <h:panelGroup id="txtShortExpiary">
                                                    <p:outputLabel value="Days of Short Expiry">
                                                        <i class="fas fa-info-circle ms-1 text-muted" 
                                                           title="Default expiry : 30 days."
                                                           data-bs-toggle="tooltip">
                                                        </i>
                                                    </p:outputLabel>
                                                    <p:inputText
                                                        value="#{ampController.current.numberOfDaysToMarkAsShortExpiary}"
                                                        class="form-control"
                                                        disabled="#{not ampController.editable}"/>
                                                </h:panelGroup>
                                            </div>
                                        </div>

                                        <!-- Strength & Dispensing Section -->
                                        <h:outputText value="Strength &amp; Dispensing" styleClass="section-header d-block"/>
                                        <div class="row g-3 mb-3">
                                            <div class="col-md-4">
                                                <p:outputLabel for="txtStrength" value="Strength"/>
                                                <p:inputText id="txtStrength"
                                                             value="#{ampController.current.strengthOfAnIssueUnit}"
                                                             class="form-control"
                                                             disabled="#{not ampController.editable}"
                                                             placeholder="Enter strength value"/>
                                            </div>
                                            <div class="col-md-4">
                                                <p:outputLabel for="selStrengthUnit" value="Strength Unit"/>
                                                <p:selectOneMenu
                                                    id="selStrengthUnit"
                                                    value="#{ampController.current.strengthUnit}"
                                                    styleClass="form-control"
                                                    filter="true"
                                                    disabled="#{not ampController.editable}">
                                                    <f:selectItem itemLabel="-- Select Strength Unit --" itemValue="#{null}"/>
                                                    <f:selectItems
                                                        value="#{measurementUnitController.items}"
                                                        var="m"
                                                        itemValue="#{m}"
                                                        itemLabel="#{m.name}"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="col-md-4">
                                                <p:outputLabel for="selIssueUnit" value="Issue Unit"/>
                                                <p:selectOneMenu
                                                    id="selIssueUnit"
                                                    value="#{ampController.current.issueUnit}"
                                                    styleClass="form-control"
                                                    filter="true"
                                                    disabled="#{not ampController.editable}">
                                                    <f:selectItem itemLabel="-- Select Issue Unit --" itemValue="#{null}"/>
                                                    <f:selectItems
                                                        value="#{measurementUnitController.issueUnits}"
                                                        var="m"
                                                        itemValue="#{m}"
                                                        itemLabel="#{m.name}"/>
                                                </p:selectOneMenu>
                                            </div>
                                        </div>

                                        <!-- Business Rules Section -->
                                        <h:outputText value="Business Rules" styleClass="section-header d-block"/>
                                        <div class="row g-3 mb-3">
                                            <div class="col-md-3">
                                                <div class="form-check">
                                                    <p:selectBooleanCheckbox id="discountAllowed"
                                                                             value="#{ampController.current.discountAllowed}"
                                                                             disabled="#{not ampController.editable}"
                                                                             styleClass="form-check-input"/>
                                                    <p:outputLabel for="discountAllowed" value="Allow Discounts" styleClass="form-check-label"/>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-check">
                                                    <p:selectBooleanCheckbox id="refundsAllowed"
                                                                             value="#{ampController.current.refundsAllowed}"
                                                                             disabled="#{not ampController.editable}"
                                                                             styleClass="form-check-input"/>
                                                    <p:outputLabel for="refundsAllowed" value="Allow Refunds" styleClass="form-check-label"/>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-check">
                                                    <p:selectBooleanCheckbox id="consumptionAllowed"
                                                                             value="#{ampController.current.consumptionAllowed}"
                                                                             disabled="#{not ampController.editable}"
                                                                             styleClass="form-check-input"/>
                                                    <p:outputLabel for="consumptionAllowed" value="Consumable" styleClass="form-check-label"/>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-check">
                                                    <p:selectBooleanCheckbox id="allowFractions"
                                                                             value="#{ampController.current.allowFractions}"
                                                                             disabled="#{not ampController.editable}"
                                                                             styleClass="form-check-input"/>
                                                    <p:outputLabel for="allowFractions" value="Allow Fractions" styleClass="form-check-label"/>
                                                </div>
                                            </div>
                                        </div>
                                    </h:panelGroup>
                                </p:panel>

                            </div>
                        </div>






                    </p:panel>



                    <!-- Retire dialog: reason is mandatory; shows stock and history first -->
                    <p:dialog id="retireDlg" widgetVar="retireDlgWidget" header="Retire AMP" modal="true" width="520" resizable="false" showEffect="fade">
                        <h:panelGroup layout="block" styleClass="mb-2">
                            <h:outputText value="Item: #{ampController.current.name}" styleClass="fw-bold"/>
                        </h:panelGroup>
                        <h:panelGroup layout="block" styleClass="alert alert-warning p-2 mb-2" rendered="#{ampController.retireWarningNeeded}">
                            <h:outputText value="Warning: this item has current stock of #{ampController.retireStockQty} and appears in #{ampController.retireBillItemCount} transaction line(s). A retired item disappears from item searches, so its stock and history will look missing. You can still continue."/>
                        </h:panelGroup>
                        <h:panelGroup layout="block" styleClass="mb-2" rendered="#{not ampController.retireWarningNeeded}">
                            <h:outputText value="This item has no stock and no transactions."/>
                        </h:panelGroup>
                        <p:outputLabel for="retireReasonText" value="Reason for retiring (required)"/>
                        <p:inputTextarea id="retireReasonText" value="#{ampController.retireReason}" rows="3" styleClass="w-100" maxlength="500"/>
                        <f:facet name="footer">
                            <p:commandButton id="btnRetireConfirm" value="Retire" icon="fas fa-check"
                                             action="#{ampController.delete()}"
                                             process="@this retireReasonText"
                                             update="form:msg acAmp detailPanel actionButtons statusFilterPanel retireDlg"
                                             oncomplete="if (args &amp;&amp; args.done) PF('retireDlgWidget').hide();"
                                             styleClass="ui-button-danger m-1"/>
                            <p:commandButton id="btnRetireCancel" value="Cancel" icon="fas fa-times" type="button"
                                             onclick="PF('retireDlgWidget').hide();"
                                             styleClass="ui-button-secondary m-1"/>
                        </f:facet>
                    </p:dialog>

                    <!-- Un-retire dialog: privileged, reason is mandatory -->
                    <p:dialog id="unretireDlg" widgetVar="unretireDlgWidget" header="Un-retire AMP" modal="true" width="480" resizable="false" showEffect="fade">
                        <h:panelGroup layout="block" styleClass="mb-2">
                            <h:outputText value="Item: #{ampController.current.name}" styleClass="fw-bold"/>
                        </h:panelGroup>
                        <p:outputLabel for="unretireReasonText" value="Reason for un-retiring (required)"/>
                        <p:inputTextarea id="unretireReasonText" value="#{ampController.retireReason}" rows="3" styleClass="w-100" maxlength="500"/>
                        <f:facet name="footer">
                            <p:commandButton id="btnUnretireConfirm" value="Un-retire" icon="fas fa-check"
                                             action="#{ampController.unretire()}"
                                             process="@this unretireReasonText"
                                             update="form:msg acAmp detailPanel actionButtons statusFilterPanel unretireDlg"
                                             oncomplete="if (args &amp;&amp; args.done) PF('unretireDlgWidget').hide();"
                                             styleClass="ui-button-success m-1"/>
                            <p:commandButton id="btnUnretireCancel" value="Cancel" icon="fas fa-times" type="button"
                                             onclick="PF('unretireDlgWidget').hide();"
                                             styleClass="ui-button-secondary m-1"/>
                        </f:facet>
                    </p:dialog>

                    <!-- Confirmation Dialog -->
                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                        <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" icon="fas fa-check" />
                        <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="fas fa-times" />
                    </p:confirmDialog>
                </h:form>


            </ui:define>
        </ui:composition>
    </h:body>
</html>
