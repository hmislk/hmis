<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:fav="http://xmlns.jcp.org/jsf/composite/ezcomp/reports">
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:panelGroup rendered="#{!webUserController.hasPrivilege('PharmacyAdjustmentMenue')}">
                    <h1>Not Authorized</h1>
                </h:panelGroup>
                <h:panelGroup rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentMenue')}">
                    <div class="row" >
                        <div class="col-2" >
                            <h:form>

                                <p:accordionPanel id="pharmacyAdjustmentAccordion" activeIndex="#{pharmacyAdjustmentController.tabIndex}">
                                    <p:ajax process="@this" ></p:ajax>

                                    <!--
                                        Each button below is intentionally duplicated from its home tab
                                        further down this file (same reportKey, label, action), gated on
                                        isFavorite() instead of always rendering. See
                                        developer_docs/feature/report-favorites.md. If you add or rename a
                                        button below, update BOTH copies - the reportKey ties them together.
                                    -->
                                    <p:tab title="⭐ Favorites">
                                        <h:panelGroup layout="block" styleClass="text-muted p-2" rendered="#{not userFavoriteReportController.hasAnyFavoriteWithKeyPrefix('pharmacyAdjustment_')}">
                                            <h:outputText value="No favorite adjustments yet — click the star next to any button to add it here." />
                                        </h:panelGroup>
                                        <div class="d-grid gap-2">
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentDepartmentStockQTY') and userFavoriteReportController.isFavorite('pharmacyAdjustment_quantityAdjustment')}">
                                                <p:commandButton value="Quantity Adjustment" icon="fas fa-boxes" action="/pharmacy/adjustments/pharmacy_adjustment_department?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_quantityAdjustment" label="Quantity Adjustment" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentStaffStockAdjustment') and userFavoriteReportController.isFavorite('pharmacyAdjustment_staffStockAdjustment')}">
                                                <p:commandButton value="Staff Stock Adjustment" icon="fas fa-user-check" action="/pharmacy/adjustments/pharmacy_adjustment_staff?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_staffStockAdjustment" label="Staff Stock Adjustment" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentPurchaseRate') and userFavoriteReportController.isFavorite('pharmacyAdjustment_purchaseRateAdjustment')}">
                                                <p:commandButton value="Purchase Rate Adjustment" icon="fas fa-dollar-sign" action="/pharmacy/adjustments/pharmacy_adjustment_purchase_rate?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_purchaseRateAdjustment" label="Purchase Rate Adjustment" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentCostRate') and userFavoriteReportController.isFavorite('pharmacyAdjustment_costRateAdjustment')}">
                                                <p:commandButton value="Cost Rate Adjustment" icon="fas fa-calculator" action="/pharmacy/adjustments/pharmacy_adjustment_cost_rate?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_costRateAdjustment" label="Cost Rate Adjustment" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentSaleRate') and userFavoriteReportController.isFavorite('pharmacyAdjustment_saleRateAdjustment')}">
                                                <p:commandButton value="Sale Rate Adjustment" icon="fas fa-tags" action="/pharmacy/adjustments/pharmacy_adjustment_retail_sale_rate?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_saleRateAdjustment" label="Sale Rate Adjustment" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentWholeSaleRate') and userFavoriteReportController.isFavorite('pharmacyAdjustment_wholesaleRateAdjustment')}">
                                                <p:commandButton value="Wholesale Rate Adjustment" icon="fas fa-money-bill-wave" action="/pharmacy/adjustments/pharmacy_adjustment_whole_sale_rate?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_wholesaleRateAdjustment" label="Wholesale Rate Adjustment" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentExpiryDate') and userFavoriteReportController.isFavorite('pharmacyAdjustment_expiryDateAdjustment')}">
                                                <p:commandButton value="Expiry Date Adjustment" icon="fas fa-calendar-times" action="/pharmacy/adjustments/pharmacy_adjustment_expiry_date?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_expiryDateAdjustment" label="Expiry Date Adjustment" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentCreateBatch') and userFavoriteReportController.isFavorite('pharmacyAdjustment_createNewBatch')}">
                                                <p:commandButton value="Create New Batch" icon="fas fa-plus-circle" action="/pharmacy/adjustments/pharmacy_adjustment_batch_create?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.prepareForNewBatchCreation()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_createNewBatch" label="Create New Batch" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentMenue') and pharmacyAdjustmentController.requiresApproval and userFavoriteReportController.isFavorite('pharmacyAdjustment_approvedRequests')}">
                                                <p:commandButton value="Approved Requests" icon="fas fa-clipboard-check" action="/pharmacy/adjustments/pharmacy_adjustment_approved_requests?faces-redirect=true" ajax="false" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_approvedRequests" label="Approved Requests" category="Adjustments" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{userFavoriteReportController.isFavorite('pharmacyAdjustment_startNewStockTaking')}">
                                                <p:commandButton value="Start New Stock Taking" icon="fa fa-clipboard-list" action="#{pharmacyStockTakeController.navigateToStartNewStockTaking()}" ajax="false" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_startNewStockTaking" label="Start New Stock Taking" category="Stock Take" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{userFavoriteReportController.isFavorite('pharmacyAdjustment_manageStockTakings')}">
                                                <p:commandButton value="Manage Stock Takings" icon="fa fa-list" action="#{pharmacyStockTakeController.navigateToManageStockTakings()}" ajax="false" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_manageStockTakings" label="Manage Stock Takings" category="Stock Take" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentSearchAdjustmentBills') and userFavoriteReportController.isFavorite('pharmacyAdjustment_searchAdjustmentBills')}">
                                                <p:commandButton value="Search Adjustment Bills" icon="fas fa-search" action="#{searchController.navigateToPharmacyAdjustmentBillItemSearch()}" ajax="false" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_searchAdjustmentBills" label="Search Adjustment Bills" category="Reports" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                            <h:panelGroup layout="block" styleClass="d-flex align-items-center gap-1 w-100"
                                                          rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentTransferAllStock') and userFavoriteReportController.isFavorite('pharmacyAdjustment_transferAllStock')}">
                                                <p:commandButton value="Transfer All Stock" icon="fas fa-exchange-alt" action="/pharmacy/adjustments/pharmacy_adjustment_department_all?faces-redirect=true" ajax="false" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_transferAllStock" label="Transfer All Stock" category="Reports" accordionId="pharmacyAdjustmentAccordion" />
                                            </h:panelGroup>
                                        </div>
                                    </p:tab>

                                    <p:tab title="Adjustments">
                                        <div class="d-grid gap-2">
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToStockAdjustment"
                                                    value="Quantity Adjustment"
                                                    icon="fas fa-boxes"
                                                    action="/pharmacy/adjustments/pharmacy_adjustment_department?faces-redirect=true"
                                                    ajax="false"
                                                    rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentDepartmentStockQTY')}"
                                                    actionListener="#{pharmacyAdjustmentController.makeNull()}"
                                                    styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_quantityAdjustment" label="Quantity Adjustment" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentDepartmentStockQTY')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <!--<p:commandButton value="Single Item Quantity Adjustment" icon="fas fa-box" action="/pharmacy/adjustments/pharmacy_adjustment_department_by_item?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentDepartmentStockBySingleItemQTY') and webUserController.hasPrivilege('PharmacyStockAdjustmentSingleItem')}" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>-->
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToStaffStockAdjustment"
                                                    value="Staff Stock Adjustment" icon="fas fa-user-check" action="/pharmacy/adjustments/pharmacy_adjustment_staff?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentStaffStockAdjustment')}" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_staffStockAdjustment" label="Staff Stock Adjustment" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentStaffStockAdjustment')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToPurchaseRateAdjustment"
                                                    value="Purchase Rate Adjustment" icon="fas fa-dollar-sign" action="/pharmacy/adjustments/pharmacy_adjustment_purchase_rate?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentPurchaseRate')}" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_purchaseRateAdjustment" label="Purchase Rate Adjustment" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentPurchaseRate')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToCostRateAdjustment"
                                                    value="Cost Rate Adjustment" icon="fas fa-calculator" action="/pharmacy/adjustments/pharmacy_adjustment_cost_rate?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentCostRate')}" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_costRateAdjustment" label="Cost Rate Adjustment" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentCostRate')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToRetailRateAdjustment"
                                                    value="Sale Rate Adjustment" icon="fas fa-tags" action="/pharmacy/adjustments/pharmacy_adjustment_retail_sale_rate?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentSaleRate')}" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_saleRateAdjustment" label="Sale Rate Adjustment" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentSaleRate')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToWholesaleAdjustment"
                                                    value="Wholesale Rate Adjustment" icon="fas fa-money-bill-wave" action="/pharmacy/adjustments/pharmacy_adjustment_whole_sale_rate?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentWholeSaleRate')}" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_wholesaleRateAdjustment" label="Wholesale Rate Adjustment" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentWholeSaleRate')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToExpiaryAdjustment"
                                                    value="Expiry Date Adjustment" icon="fas fa-calendar-times" action="/pharmacy/adjustments/pharmacy_adjustment_expiry_date?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentExpiryDate')}" actionListener="#{pharmacyAdjustmentController.makeNull()}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_expiryDateAdjustment" label="Expiry Date Adjustment" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentExpiryDate')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnCreateNewBatch"
                                                    value="Create New Batch"
                                                    icon="fas fa-plus-circle"
                                                    action="/pharmacy/adjustments/pharmacy_adjustment_batch_create?faces-redirect=true"
                                                    ajax="false"
                                                    rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentCreateBatch')}"
                                                    actionListener="#{pharmacyAdjustmentController.prepareForNewBatchCreation()}"
                                                    styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_createNewBatch" label="Create New Batch" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentCreateBatch')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    id="btnNavigateToApprovedAdjustmentRequests"
                                                    value="Approved Requests"
                                                    icon="fas fa-clipboard-check"
                                                    action="/pharmacy/adjustments/pharmacy_adjustment_approved_requests?faces-redirect=true"
                                                    ajax="false"
                                                    rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentMenue') and pharmacyAdjustmentController.requiresApproval}"
                                                    actionListener="#{pharmacyAdjustmentController.makeNull()}"
                                                    styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_approvedRequests" label="Approved Requests" category="Adjustments"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentMenue') and pharmacyAdjustmentController.requiresApproval}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                        </div>
                                    </p:tab>
                                    <p:tab id="tabStockTaking" title="Stock Take">
                                        <div class="d-grid gap-2">
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    value="Start New Stock Taking"
                                                    icon="fa fa-clipboard-list"
                                                    action="#{pharmacyStockTakeController.navigateToStartNewStockTaking()}"
                                                    ajax="false"
                                                    styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_startNewStockTaking" label="Start New Stock Taking" category="Stock Take" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton
                                                    value="Manage Stock Takings"
                                                    icon="fa fa-list"
                                                    action="#{pharmacyStockTakeController.navigateToManageStockTakings()}"
                                                    ajax="false"
                                                    styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_manageStockTakings" label="Manage Stock Takings" category="Stock Take" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <!-- This will be removed in the next iteration-->
                                            <p:commandButton
                                                rendered="false"
                                                value="Pending Physical Count Approvals"
                                                icon="fa fa-clock"
                                                action="#{pharmacyStockTakeController.navigateToPendingPhysicalCountApprovals()}"
                                                ajax="false"
                                                styleClass="w-100"/>

                                        </div>
                                    </p:tab>
                                    <p:tab title="Reports">
                                        <div class="d-grid gap-2">
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton value="Search Adjustment Bills" icon="fas fa-search" action="#{searchController.navigateToPharmacyAdjustmentBillItemSearch()}" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentSearchAdjustmentBills')}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_searchAdjustmentBills" label="Search Adjustment Bills" category="Reports"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentSearchAdjustmentBills')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                            <div class="d-flex align-items-center gap-1 w-100" >
                                                <p:commandButton value="Transfer All Stock" icon="fas fa-exchange-alt" action="/pharmacy/adjustments/pharmacy_adjustment_department_all?faces-redirect=true" ajax="false" rendered="#{webUserController.hasPrivilege('PharmacyAdjustmentTransferAllStock')}" styleClass="w-100"/>
                                                <fav:favoriteStar reportKey="pharmacyAdjustment_transferAllStock" label="Transfer All Stock" category="Reports"
                                                                   visible="#{webUserController.hasPrivilege('PharmacyAdjustmentTransferAllStock')}" accordionId="pharmacyAdjustmentAccordion" />
                                            </div>
                                        </div>
                                    </p:tab>
                                </p:accordionPanel>



                            </h:form>
                        </div>
                        <div class="col-10" >
                            <ui:insert name="subcontent" >

                            </ui:insert>
                        </div>
                    </div>

                </h:panelGroup>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
