<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:in="http://xmlns.jcp.org/jsf/composite/inward"
                xmlns:bi="http://xmlns.jcp.org/jsf/composite/bill"
                xmlns:common="http://xmlns.jcp.org/jsf/composite/ezcomp/common">

    <ui:define name="content">
        <h:form id="form">
            <p:growl id="inpatientDashboardGrowl" ></p:growl>

            <h:panelGroup class="row" rendered="#{inwardReportControllerBht.patientEncounter eq null}"> 
                <div class="col-12">
                    <h:panelGroup>
                        <p:panel >
                            <f:facet name="header">
                                <h:outputText styleClass="fa-solid fa-address-card fa-lg" /> 
                                <p:outputLabel value="Patient Details" class="m-2"/>
                            </f:facet>
                            <div>
                                <h:outputLabel value="Type Patient Name or BHT : " class="mt-2"/>

                                <p:autoComplete 
                                    widgetVar="aPt2"  
                                    id="acPt2" 
                                    forceSelection="true" 
                                    value="#{inwardReportControllerBht.patientEncounter}" 
                                    completeMethod="#{admissionController.completePatient}"
                                    var="apt2"
                                    itemLabel="#{apt2.bhtNo}"
                                    itemValue="#{apt2}" 
                                    size="30"  
                                    inputStyleClass="form-control"
                                    class="mx-2 w-50"
                                    >
                                    <!--<p:ajax event="itemSelect" process="@this" update="@all"/>-->
                                    <p:column headerText="BHT No" style="padding: 6px; width: 150px;">
                                        <h:outputLabel value="#{apt2.bhtNo}"/> 
                                    </p:column>
                                    <p:column headerText="Patient Name" style="padding: 6px;">
                                        <h:outputLabel value="#{apt2.patient.person.name}"/> 
                                    </p:column>
                                    <p:column headerText="Room No" style="padding: 6px; width: 200px;">
                                        <h:outputLabel value="#{apt2.currentPatientRoom.roomFacilityCharge.name}"/>
                                    </p:column>
                                </p:autoComplete> 

                                <p:commandButton 
                                    value="Select" 
                                    ajax="false" action="#{inwardReportControllerBht.fetchIssueBill}" >
                                </p:commandButton>

                            </div>

                        </p:panel>
                    </h:panelGroup>
                </div>
                <br/><br/>
            </h:panelGroup>

            <h:panelGroup rendered="#{inwardReportControllerBht.patientEncounter ne null}">
                <p:panel >
                    <f:facet name="header" >
                        <h:outputText styleClass="fa fa-id-card"></h:outputText>
                        <p:outputLabel value="&nbsp;&nbsp;&nbsp;Inpatient Dashboard" class="m-2" ></p:outputLabel>

                        <!--                                                <p:commandButton 
                                                                            value="Download" 
                                                                            ajax="false"
                                                                            class="ui-button-primary m-1"
                                                                            icon="fa fa-download">
                                                                            <p:dataExporter fileName="Inpatient Medicine Issue" target="tbl1" type="xlsx"></p:dataExporter>
                                                                        </p:commandButton>
                        
                                                                        <p:commandButton 
                                                                            value="Print" 
                                                                            ajax="false"
                                                                            class="ui-button-primary m-1"
                                                                            icon="fa fa-print">
                                                                            <p:printer target="tbl1"></p:printer>
                                                                        </p:commandButton>-->

                        <p:commandButton 
                            value="Inpatient Dashboard"
                            action="#{admissionController.navigateToSearchAdmissions()}" 
                            style="float: right;"
                            class="ui-button-secondary m-1"
                            rendered="false"
                            icon="fa fa-arrow-circle-left">
                        </p:commandButton>

                        <p:commandButton 
                            value="New Search" 
                            action="#{inwardReportControllerBht.madeNullIssue()}" 
                            style="float: right;"
                            class="ui-button-warning m-1"
                            icon="fa fa-arrow-circle-left">
                        </p:commandButton>


                    </f:facet>

                    <style>
                        @media print{

                            body {
                                margin :0px 5px;
                            }
                        }
                    </style>

                    <div class="row my-2">
                        <div class="col-3">
                            <common:patient_details_view patient="#{inwardReportControllerBht.patientEncounter.patient}" class="w-100"/>
                        </div>
                        <div class="col-6">
                            <p:panel>
                                <f:facet name="header">
                                    <h:outputLabel value="Search Requested Bill" />
                                </f:facet>
                                <h:panelGrid columns="1" class="w-100">
                                    <h:outputLabel value="Requested Bill" />
                                    <p:selectOneMenu   
                                        id="pay"
                                        value="#{inwardReportControllerBht.bill}"
                                        class="w-100"
                                        >     
                                        <f:selectItem itemLabel="Select" ></f:selectItem>
                                        <f:selectItems 
                                            value="#{inwardReportControllerBht.issueBills}"  
                                            var="b"
                                            itemLabel="#{b.deptId}"
                                            itemValue="#{b}"/>
                                        <p:ajax process="@this" listener="#{inwardReportControllerBht.processRequestIssueRows()}" update="billSummary tblReqIssue" event="change"/>
                                    </p:selectOneMenu>
                                </h:panelGrid>
                            </p:panel>
                        </div>
                        <div class="col-3">
                            <common:admission_details admission="#{inwardReportControllerBht.patientEncounter}" class="w-100 m-1"></common:admission_details>
                        </div>
                    </div>
                    <h:panelGroup id="billSummary" layout="block" class="row my-2">
                        <h:panelGroup layout="block" class="col-12" rendered="#{inwardReportControllerBht.bill ne null}">
                            <div class="row">
                                <div class="col-6">
                                    <h:outputLabel value="Requested From :&#160;" class="fw-bold" />
                                    <h:outputText value="#{inwardReportControllerBht.bill.department.name}" /><br/>
                                    <h:outputLabel value="Requested User :&#160;" class="fw-bold" />
                                    <h:outputText value="#{inwardReportControllerBht.bill.creater.webUserPerson.nameWithTitle}" />
                                </div>
                                <div class="col-6">
                                    <ui:repeat value="#{inwardReportControllerBht.requestIssueSummaryBills}" var="sb">
                                        <h:outputLabel value="#{sb.billTypeAtomic eq 'ISSUE_MEDICINE_ON_REQUEST_INWARD_RETURN' ? 'Returned' : sb.billTypeAtomic eq 'ISSUE_MEDICINE_ON_REQUEST_INWARD_CANCELLATION' ? 'Cancelled' : 'Issued'} :&#160;" class="fw-bold" />
                                        <h:outputText value="#{sb.deptId} from #{sb.department.name} by #{sb.creater.webUserPerson.nameWithTitle}" /><br/>
                                    </ui:repeat>
                                </div>
                            </div>
                        </h:panelGroup>
                    </h:panelGroup>
                    <div class="row my-2">
                        <div class="col-12">
                            <p:dataTable
                                id="tblReqIssue"
                                value="#{inwardReportControllerBht.requestIssueRows}"
                                var="r"
                                rowIndexVar="ri"
                                emptyMessage="Select a requested bill to compare requested and issued items.">
                                <p:columnGroup type="header">
                                    <p:row>
                                        <p:column rowspan="2" headerText="No" style="width: 4em;" />
                                        <p:column colspan="2" headerText="Requested" />
                                        <p:column colspan="5" headerText="Issued" />
                                    </p:row>
                                    <p:row>
                                        <p:column headerText="Item" />
                                        <p:column headerText="Qty" style="width: 6em;" />
                                        <p:column headerText="Item" />
                                        <p:column headerText="Qty" style="width: 6em;" />
                                        <p:column headerText="Issue Bill No" />
                                        <p:column headerText="Returned / Cancelled" style="width: 10em;" />
                                        <p:column headerText="Net Issued" style="width: 7em;" />
                                    </p:row>
                                </p:columnGroup>

                                <p:column>
                                    <h:outputText value="#{r.serialNo}" rendered="#{r.firstRowOfRequestedItem}" />
                                </p:column>
                                <p:column>
                                    <h:outputText value="#{r.requestedBillItem.item.name}" rendered="#{r.firstRowOfRequestedItem}" />
                                    <h:outputText value="Not linked to a request line" class="text-muted fst-italic" rendered="#{r.notInRequest}" />
                                </p:column>
                                <p:column>
                                    <h:outputText value="#{r.requestedQty}" rendered="#{r.firstRowOfRequestedItem}">
                                        <f:convertNumber pattern="#,##0.##" />
                                    </h:outputText>
                                </p:column>
                                <p:column>
                                    <h:outputText value="#{r.issuedBillItem.item.name}" rendered="#{not r.notIssued}" />
                                    <h:outputText value=" (Substitute)" class="text-primary" rendered="#{r.substituted}" />
                                    <h:outputText value="Not issued" class="text-danger fst-italic" rendered="#{r.notIssued}" />
                                </p:column>
                                <p:column>
                                    <h:outputText value="#{r.issuedQty}" rendered="#{not r.notIssued}">
                                        <f:convertNumber pattern="#,##0.##" />
                                    </h:outputText>
                                </p:column>
                                <p:column>
                                    <h:outputText value="#{r.issuedBillItem.bill.deptId}" rendered="#{not r.notIssued}" />
                                </p:column>
                                <p:column>
                                    <h:outputText value="#{-r.returnedQty}" class="text-warning" rendered="#{r.returnedQty ne 0}">
                                        <f:convertNumber pattern="#,##0.##" />
                                    </h:outputText>
                                    <h:outputText value=" returned" class="text-warning" rendered="#{r.returnedQty ne 0}" />
                                    <h:outputText value="#{-r.cancelledQty}" class="text-danger" rendered="#{r.cancelledQty ne 0}">
                                        <f:convertNumber pattern="#,##0.##" />
                                    </h:outputText>
                                    <h:outputText value=" cancelled" class="text-danger" rendered="#{r.cancelledQty ne 0}" />
                                </p:column>
                                <p:column>
                                    <h:outputText value="#{r.netIssuedQty}" rendered="#{not r.notIssued}">
                                        <f:convertNumber pattern="#,##0.##" />
                                    </h:outputText>
                                </p:column>
                            </p:dataTable>
                        </div>
                    </div>
                </p:panel>
            </h:panelGroup>

        </h:form>
    </ui:define>
</ui:composition>
