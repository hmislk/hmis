<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <p:panel header="Search Sale Bill Items">
                        <div class="row">
                            <div class="col-md-2">

                                <h:outputLabel value="From Date"/>
                                <p:datePicker 
                                    styleClass="dateTimePicker" 
                                    id="fromDate" 
                                    class="w-100"
                                    inputStyleClass="form-control"
                                    value="#{searchController.fromDate}" 
                                    showTime="true"                                            
                                    showButtonBar="true"                                            
                                    timeInput="true" 
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >      
                                </p:datePicker>
                                <h:outputLabel value="To Date"/>
                                <p:datePicker 
                                    id="toDate"
                                    class="w-100"
                                    inputStyleClass="form-control"
                                    value="#{searchController.toDate}" 
                                    showTime="true"                                            
                                    showButtonBar="true"                                            
                                    timeInput="true" 
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >                                                                              
                                </p:datePicker>
                                <p:commandButton 
                                    id="btnSearch" 
                                    ajax="false" 
                                    icon="fa fa-search"
                                    class="w-100 ui-button-warning mt-2 mb-3"
                                    value="Search" 
                                    action="#{searchController.createPharmacySaleBillItems()}"/>


                                <h:outputLabel value="Bill No"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.billNo}" class="w-100"/>
                                <h:outputLabel value="Item Name"/>    
                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.itemName}" class="w-100"/>
                                <h:outputLabel value="Item Value"/>   
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.total}" class="w-100"/>
                                <h:outputLabel value="Patient"/>  
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.patientName}" class="w-100"/>
                                <h:outputLabel  value="Item Code"/>
                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.code}" class="w-100"/>

                            </div>
                            <div class="col-md-10">

                                <p:dataTable 
                                    rowIndexVar="i" 
                                    id="tblBills" 
                                    paginatorPosition="bottom"
                                    rows="10"
                                    value="#{pharmacyBillSearch.saleBillItemDtos}"
                                    var="pi" 
                                    paginator="true"
                                    paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                    rowsPerPageTemplate="5,10,15,50,100"
                                    >
                                    <p:column headerText="No" styleClass="alignTop" width="20px">
                                        <h:outputLabel value="#{i+1}"/>
                                    </p:column>
                                    
                                    <p:column headerText="Bill No" styleClass="alignTop"  >
                                        <h:outputLabel value="#{pi.deptId}"/>
                                    </p:column>

                                    <p:column headerText="Item Name"  styleClass="alignTop" >
                                        <h:outputLabel value="#{pi.itemName}" />
                                    </p:column>

                                    <p:column headerText="Item Code">
                                        <f:facet name="header">
                                            <h:outputLabel value="Code"/>
                                        </f:facet>
                                        <h:outputLabel value="#{pi.itemCode}" style="width: 100px!important;" ></h:outputLabel>
                                    </p:column>

                                    <p:column headerText="Billed At"  >
                                        <h:outputLabel value="#{pi.billDate}" >
                                            <f:convertDateTime pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                        </h:outputLabel>
                                        <br/>
                                        <p:badge value="Cancelled" severity="danger" rendered="#{pi.cancelled}"/>
                                        <p:badge value="Refunded" severity="warning" rendered="#{pi.refunded}"/>
                                    </p:column>
                                    <p:column headerText="Qty" >
                                        <h:outputLabel value="#{pi.qty}" >
                                            <f:convertNumber pattern="#0.00"/>
                                        </h:outputLabel>
                                    </p:column>   

                                    <p:column headerText="Bill item Value">
                                        <h:outputLabel value="#{pi.netValue}" >
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputLabel>
                                    </p:column>

                                    <p:column headerText="Patient"  styleClass="alignTop" >
                                        <h:outputLabel value="#{pi.patientName}" >
                                        </h:outputLabel>
                                    </p:column>

                                    <p:column headerText="Action" width="50px">
                                        <p:commandButton
                                            id="btnViewBill"
                                            ajax="false"
                                            icon="fas fa-file-invoice"
                                            action="#{pharmacyBillSearch.navigatePharmacyReprintRetailBill()}">
                                            <f:setPropertyActionListener value="#{pi.billId}" target="#{pharmacyBillSearch.billId}"/>
                                        </p:commandButton>
                                        
                                        <p:tooltip for="btnViewBill" value="View Bill"  showDelay="0" hideDelay="0"></p:tooltip>
                                        
                                    </p:column>
                                    
                                </p:dataTable>
                            </div>
                        </div>
                    </p:panel>            
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
