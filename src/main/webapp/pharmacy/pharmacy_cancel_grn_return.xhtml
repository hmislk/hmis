<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:pharmacy="http://xmlns.jcp.org/jsf/composite/pharmacy">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">

                <h:panelGroup rendered="#{!webUserController.hasPrivilege('PharmacyGrnReturnCancel')}" >
                    You are NOT authorized
                </h:panelGroup>

                <h:panelGroup rendered="#{webUserController.hasPrivilege('PharmacyGrnReturnCancel')}" >

                <h:form>
                    <h:panelGroup rendered="#{!pharmacyBillSearch.printPreview}" styleClass="alignTop" >
                        <p:panel>
                            <f:facet name="header">
                                <div class="d-flex justify-content-between align-items-center w-100">
                                    <h:outputText value="Cancellation"/>
                                    <div class="d-flex gap-2 align-items-center">
                                        <p:commandButton value="Cancel" ajax="false" icon="fa fa-ban" styleClass="ui-button-danger"
                                                         action="#{pharmacyBillSearch.pharmacyGrnReturnCancel()}"
                                                         disabled="#{not webUserController.hasPrivilege('PharmacyGrnReturnCancel') or pharmacyBillSearch.billACancellationBill}"/>
                                    </div>
                                </div>
                            </f:facet>
                            <p:selectOneMenu   id="cmbPs" value="#{pharmacyBillSearch.bill.paymentMethod}" required="true"  >
                                <f:selectItems value="#{enumController.paymentMethods}"/>
                            </p:selectOneMenu>
                        </p:panel>
                        <p:panelGrid columns="2" style="width: 100%;">
                            <p:panel header="Supplier Detail">
                                <p:panelGrid columns="2">
                                    <h:outputLabel value="Supplier ​Name:" ></h:outputLabel>
                                    <h:outputLabel value="#{pharmacyBillSearcphBillll.toInstitution.name }" ></h:outputLabel>                                        
                                </p:panelGrid>
                            </p:panel>
                            <p:panel header="Bill Detail">
                                <p:panelGrid columns="2">
                                    <h:outputLabel value="Bill No :" ></h:outputLabel>
                                    <h:outputLabel value="#{pharmacyBillSearch.bill.deptId}" ></h:outputLabel>
                                    <h:outputLabel value="Total :" ></h:outputLabel>
                                    <h:outputLabel value="#{pharmacyBillSearcphBillll.total}" ></h:outputLabel>
                                    <h:outputLabel value="Discount :" ></h:outputLabel>
                                    <h:outputLabel value="#{pharmacyBillSeaphBillbill.discount}" ></h:outputLabel>
                                    <h:outputLabel value="Net Total :" ></h:outputLabel>
                                    <h:outputLabel value="#{pharmacyBilphBillrch.bill.netTotal}" ></h:outputLabel>
                                </p:panelGrid>
                            </p:panel>
                        </p:panelGrid>
                        <p:panel header="Bill Item Detail">
                            <p:dataTable styleClass="p-datatable-sm" rowIndexVar="rowIndex" value="#{pharmacyBillSearch.billItems}" var="bip" >
                                <p:column>
                                    <f:facet name="header">No</f:facet>
                                    <h:outputLabel value="#{rowIndex+1}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">Item</f:facet>
                                    <h:outputLabel value="#{bip.item.name}"/>
                                </p:column>
                                <p:column>
                                    <f:facet name="header">Value</f:facet>
                                    <h:outputLabel value="#{bip.netValue}"/>
                                </p:column>
                            </p:dataTable>
                        </p:panel>
                        <p:panel header="Comments">
                            <h:inputTextarea value="#{pharmacyBillSearch.bill.comments}"/>                            
                        </p:panel>
                    </h:panelGroup>


                    <h:panelGroup rendered="#{pharmacyBillSearch.printPreview}" id="panelPrint" styleClass="noBorder summeryBorder" >
                        <p:commandButton ajax="false" value="Print" icon="fas fa-print"
                                         styleClass="noPrintButton ui-button-info" >
                            <p:printer target="panelPrint" />
                        </p:commandButton>
<!--                        <pharmacy:grnReturn bill="#{pharmacyBillSearch.bill.cancelledBill}"/>-->

                        <h:panelGroup rendered="#{sessionController.loggedPreference.grnBillDetailed eq false}" >
                            <pharmacy:grnReturnCancel bill="#{pharmacyBillSearch.bill.cancelledBill}"/>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{sessionController.loggedPreference.grnBillDetailed eq true}" >
                            <pharmacy:grn_detail bill="#{pharmacyBillSearch.bill.cancelledBill}"/>
                        </h:panelGroup>
                    </h:panelGroup>


                </h:form>

                </h:panelGroup>

            </ui:define>
        </ui:composition>
    </h:body>
</html>
