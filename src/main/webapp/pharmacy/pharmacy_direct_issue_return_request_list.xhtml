<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="content">
        <h:form id="formDirectIssueReturnRequests">

            <p:messages id="msgDirectIssueReturnRequests" showDetail="true" autoUpdate="true"/>

            <p:panel>
                <f:facet name="header">
                    <h:outputText styleClass="fa-solid fa-rotate-left"/>
                    <p:outputLabel value="Inpatient Direct Issue Return Requests" class="mx-4"/>
                </f:facet>

                <p:outputLabel styleClass="d-block mb-2"
                               value="Return requests raised by wards for medicines this department issued directly to inpatients. Approving opens the normal return with the requested quantities filled in; nothing changes until you settle it."/>

                <p:dataTable
                    id="tblPendingRequests"
                    rowKey="#{r.id}"
                    value="#{directIssueReturnRequestController.pendingRequests}"
                    var="r"
                    class="w-100"
                    emptyMessage="No pending return requests.">

                    <p:column headerText="Request No">
                        <h:outputText value="#{r.deptId}"/>
                    </p:column>

                    <p:column headerText="Ward">
                        <h:outputText value="#{r.fromDepartment.name}"/>
                    </p:column>

                    <p:column headerText="BHT">
                        <h:outputText value="#{r.patientEncounter.bhtNo}"/>
                    </p:column>

                    <p:column headerText="Patient">
                        <h:outputText value="#{r.patientEncounter.patient.person.nameWithTitle}"/>
                    </p:column>

                    <p:column headerText="Issue Bill">
                        <h:outputText value="#{r.referenceBill.deptId}"/>
                    </p:column>

                    <p:column headerText="Requested At">
                        <h:outputText value="#{r.createdAt}">
                            <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Requested By">
                        <h:outputText value="#{r.creater.webUserPerson.name}"/>
                    </p:column>

                    <p:column headerText="Reason">
                        <h:outputText value="#{r.comments}"/>
                    </p:column>

                    <p:column headerText="Actions" style="width: 18rem;">
                        <p:commandButton
                            value="View / Reject"
                            icon="fa fa-eye"
                            class="ui-button-secondary m-1"
                            process="@this"
                            actionListener="#{directIssueReturnRequestController.viewRequest(r)}"
                            update=":formDirectIssueReturnRequests:dlgRequestItems"
                            oncomplete="PF('dlgRequestItems').show();"/>
                        <p:commandButton
                            value="Approve"
                            icon="fa fa-check"
                            class="ui-button-success m-1"
                            ajax="false"
                            disabled="#{not webUserController.hasPrivilege('PharmacyBHTIssueAccept')}"
                            action="#{directIssueReturnRequestController.approve(r)}"/>
                    </p:column>
                </p:dataTable>

                <p:dialog id="dlgRequestItems" widgetVar="dlgRequestItems"
                          header="Return Request #{directIssueReturnRequestController.selectedRequest.deptId}"
                          modal="true" width="800" resizable="false">
                    <p:dataTable
                        value="#{directIssueReturnRequestController.selectedRequestItems}"
                        var="i"
                        class="w-100"
                        emptyMessage="No items.">
                        <p:column headerText="Item">
                            <h:outputText value="#{i.item.name}"/>
                        </p:column>
                        <p:column headerText="Quantity Requested">
                            <h:outputText value="#{i.qty}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>

                    <p:outputLabel for="txtRejectComment" value="Reason, if rejecting:" styleClass="d-block mt-3"/>
                    <p:inputTextarea id="txtRejectComment" rows="2" class="w-100"
                                     value="#{directIssueReturnRequestController.rejectComment}"/>

                    <f:facet name="footer">
                        <p:commandButton
                            value="Reject Request"
                            icon="fas fa-ban"
                            class="ui-button-danger"
                            process="@this txtRejectComment"
                            disabled="#{not webUserController.hasPrivilege('PharmacyBHTIssueAccept')}"
                            update=":formDirectIssueReturnRequests"
                            actionListener="#{directIssueReturnRequestController.reject}"
                            oncomplete="if (!args.validationFailed) PF('dlgRequestItems').hide();"/>
                        <p:commandButton value="Close" type="button" onclick="PF('dlgRequestItems').hide();"/>
                    </f:facet>
                </p:dialog>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
