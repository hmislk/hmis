<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/pharmacy/disbursement_index.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ph="http://xmlns.jcp.org/jsf/composite/pharmacy">

    <ui:define name="subcontent">
        <!-- Admin Config Button (Admin Only) -->
        <div class="d-flex justify-content-start mb-2">
            <h:panelGroup rendered="#{webUserController.hasPrivilege('Admin')}">
                <p:commandButton
                    value="Config"
                    icon="fa fa-cog"
                    title="Page Configuration Management"
                    action="#{pageAdminController.navigateToPageAdmin('pharmacy/pharmacy_transfer_receive_native')}"
                    ajax="false"
                    styleClass="ui-button-secondary ui-button-sm p-button-outlined"
                    style="font-size: 0.8rem; padding: 0.25rem 0.5rem;">
                </p:commandButton>
            </h:panelGroup>
        </div>

        <h:form>
            <p:panel rendered="#{!transferReceiveNativeSqlController.printPreview}">
                <p:panel>
                    <f:facet name="header">

                        <p:commandButton
                            id="btnSettleReceive"
                            value="Receive"
                            icon="fas fa-check"
                            style="float: right;"
                            class="ui-button-success mx-2"
                            action="#{transferReceiveNativeSqlController.settle}"
                            ajax="false"
                            disabled="#{not webUserController.hasPrivilege('PharmacyReceiveFinalize')}">
                        </p:commandButton>

                        <h:panelGroup rendered="#{transferReceiveNativeSqlController.issuedBill.comments ne null and not empty transferReceiveNativeSqlController.issuedBill.comments}">
                            <p:outputLabel class="mx-4 text-break" value="Note :  #{transferReceiveNativeSqlController.issuedBill.comments}" />
                        </h:panelGroup>
                    </f:facet>

                    <div class="row">
                        <div class="col-9">
                            <p:panel>
                                <f:facet name="header">
                                    <h:outputLabel styleClass="fas fa-list" />
                                    <h:outputLabel value="Requested Item " class="mx-4" />
                                </f:facet>
                                <p:dataTable
                                    styleClass="noBorder compact-table"
                                    var="item"
                                    value="#{transferReceiveNativeSqlController.itemRowList}"
                                    id="itemList"
                                    scrollable="true"
                                    scrollHeight="250"
                                    sortBy="#{item.serialNo}"
                                    style="border: none !important; font-size: #{configOptionApplicationController.getShortTextValueByKey('Report Font Size of Item List in Pharmacy Disbursement Reports', '10pt')}!Important; line-height: 1.1 !important;">

                                    <p:column headerText="Item Name" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <h:outputText id="itemName" value="#{item.itemName}" />
                                        <p:commandButton
                                            icon="pi pi-info-circle"
                                            id="btnViewBatchDetails"
                                            title="View Batch Details"
                                            actionListener="#{transferReceiveNativeSqlController.setSelectedItemRow(item)}"
                                            update=":#{p:resolveFirstComponentWithId('batchDetailsForm',view).clientId}"
                                            oncomplete="PF('batchDetailsDialog').show();"
                                            process="@this"
                                            class="ui-button-info ui-button-icon-only mx-1"/>
                                    </p:column>

                                    <p:column headerText="Batch Number" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <h:outputText id="batchNo" value="#{item.batchNo}" />
                                    </p:column>

                                    <p:column headerText="Expiration Date" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <h:outputText id="doe" value="#{item.dateOfExpire}">
                                            <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Rate" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <h:outputText id="rate" value="#{item.rate}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Net Rate" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <h:outputText id="netRate" value="#{item.netRate}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Issued Quantity" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <h:outputText value="#{item.issuedQty}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </p:column>

                                    <p:column headerText="Receiving Quantity" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <p:inputText
                                            autocomplete="off"
                                            id="qty"
                                            value="#{item.receivingQty}"
                                            onfocus="this.select()">
                                            <f:convertNumber pattern="#,##0.00" />
                                            <p:ajax
                                                event="keyup"
                                                process="@this"
                                                update="value :#{p:resolveFirstComponentWithId('txtReceivingNetTotal',view).clientId}"
                                                listener="#{transferReceiveNativeSqlController.onQuantityChangeForTransferReceive(item)}"/>
                                        </p:inputText>
                                    </p:column>

                                    <p:column headerText="Value" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" style="width:25px!important; margin: 0px; padding: 1px 2px; line-height: 1.1;">
                                        <h:outputText id="value" value="#{item.value}">
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputText>
                                    </p:column>

                                </p:dataTable>
                            </p:panel>
                        </div>

                        <div class="col-3">
                            <p:panel id="panelBillDetails" header="Bill Details">
                                <p:panelGrid columns="2">
                                    <h:outputLabel value="Issued From" />
                                    <h:outputLabel value="#{transferReceiveNativeSqlController.issuedBill.fromDepartment.name}" />

                                    <h:outputLabel value="Issued To" />
                                    <h:outputLabel value="#{transferReceiveNativeSqlController.issuedBill.toDepartment.name}" />

                                    <h:outputLabel value="Issued Value" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" />
                                    <h:outputLabel value="#{transferReceiveNativeSqlController.issuedBill.absoluteNetTotal}" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputLabel>

                                    <h:outputLabel value="Receiving Value" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" />
                                    <h:outputLabel id="txtReceivingNetTotal" value="#{transferReceiveNativeSqlController.displayReceivedNetTotal}" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                        <f:convertNumber pattern="#,##0.00"/>
                                    </h:outputLabel>

                                    <h:outputLabel value="Staff" />
                                    <p:outputLabel value="#{transferReceiveNativeSqlController.issuedBill.toStaff.person.nameWithTitle}" />

                                    <h:outputLabel value="Comments" />
                                    <p:inputTextarea
                                        class="w-100"
                                        rows="3"
                                        value="#{transferReceiveNativeSqlController.comments}"
                                        required="true"
                                        requiredMessage="Please enter a comment."/>
                                </p:panelGrid>
                            </p:panel>
                        </div>
                    </div>

                    <!-- Batch Details Dialog -->
                    <p:dialog
                        widgetVar="batchDetailsDialog"
                        modal="true"
                        position="top"
                        fitViewport="true"
                        appendTo="@(body)"
                        header="Batch Details"
                        width="40%">
                        <p:panelGrid
                            id="batchDetailsForm"
                            layout="tabular"
                            columns="2"
                            class="table table-striped">
                            <f:facet name="header">
                                <h:outputLabel value="Batch Details" styleClass="fw-bold"/>
                            </f:facet>
                            <h:outputLabel value="Item" styleClass="fw-bold"/>
                            <h:outputText value="#{transferReceiveNativeSqlController.selectedItemRow.itemName}"/>

                            <h:outputLabel value="Batch Number" styleClass="fw-bold"/>
                            <h:outputText value="#{transferReceiveNativeSqlController.selectedItemRow.batchNo}"/>

                            <h:outputLabel value="Expiration Date" styleClass="fw-bold"/>
                            <h:outputText value="#{transferReceiveNativeSqlController.selectedItemRow.dateOfExpire}">
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}"/>
                            </h:outputText>

                            <h:outputLabel value="Purchase Price" styleClass="fw-bold" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}"/>
                            <h:outputText value="#{transferReceiveNativeSqlController.selectedItemRow.purchaseRate}" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>

                            <h:outputLabel value="Retail Rate" styleClass="fw-bold" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}"/>
                            <h:outputText value="#{transferReceiveNativeSqlController.selectedItemRow.retailRate}" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>

                            <h:outputLabel value="Cost" styleClass="fw-bold" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}"/>
                            <h:outputText value="#{transferReceiveNativeSqlController.selectedItemRow.costRate}" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                        </p:panelGrid>
                    </p:dialog>

                </p:panel>
            </p:panel>

            <!-- Print Preview -->
            <p:panel rendered="#{transferReceiveNativeSqlController.printPreview}">
                <div class="d-flex justify-content-between mb-2">
                    <p:commandButton
                        ajax="false"
                        icon="fas fa-list"
                        class="ui-button-warning"
                        action="pharmacy_transfer_issued_list"
                        actionListener="#{transferReceiveNativeSqlController.makeNull()}"
                        value="Issued List"/>

                    <div class="d-flex">
                        <p:commandButton
                            rendered="#{webUserController.hasPrivilege('ChangeReceiptPrintingPaperTypes')}"
                            value="Settings"
                            icon="fas fa-cog"
                            class="ui-button-secondary mx-1"
                            type="button"
                            onclick="PF('transferReceiveNativeConfigDialog').show();" />
                        <p:commandButton
                            value="Print"
                            icon="fas fa-print"
                            class="ui-button-info m-1"
                            ajax="false"
                            action="#">
                            <p:printer target="gpBillPreview" />
                        </p:commandButton>
                    </div>
                </div>

                <h:panelGroup id="gpBillPreview">

                    <h:panelGroup
                        rendered="#{configOptionController.getBooleanValueByKey('Pharmacy Transfer Receive Receipt is A4', true)}"
                        styleClass="noBorder">
                        <ph:transferReceiveNativeA4 dto="#{transferReceiveNativeSqlController.printDto}" />
                    </h:panelGroup>

                    <h:panelGroup
                        id="gpBillTemplate"
                        rendered="#{configOptionController.getBooleanValueByKey('Pharmacy Transfer Receive Bill is Template', false)}"
                        styleClass="noBorder">
                        <ph:transferReceiveNativeReceipt dto="#{transferReceiveNativeSqlController.printDto}" />
                    </h:panelGroup>

                    <h:panelGroup
                        rendered="#{configOptionController.getBooleanValueByKey('Pharmacy Transfer Receive Receipt is Letter Paper Custom 1', true)}"
                        styleClass="noBorder">
                        <ph:transferReceiveNativeCustomLetter1 dto="#{transferReceiveNativeSqlController.printDto}" />
                    </h:panelGroup>

                    <h:panelGroup
                        rendered="#{configOptionController.getBooleanValueByKey('Pharmacy Transfer Receive Receipt is A4 Detailed', true)}"
                        styleClass="noBorder">
                        <ph:transferReceiveNativeDetailed dto="#{transferReceiveNativeSqlController.printDto}" />
                    </h:panelGroup>

                    <h:panelGroup
                        rendered="#{configOptionController.getBooleanValueByKey('Pharmacy Transfer Receive Receipt is A4 Custom 1', true)}"
                        styleClass="noBorder">
                        <ph:transferReceiveNativeCustom1 dto="#{transferReceiveNativeSqlController.printDto}" />
                    </h:panelGroup>

                    <h:panelGroup
                        rendered="#{configOptionController.getBooleanValueByKey('Pharmacy Transfer Receive Receipt is A4 Custom 2', true)}"
                        styleClass="noBorder">
                        <ph:transferReceiveNativeCustom2 dto="#{transferReceiveNativeSqlController.printDto}" />
                    </h:panelGroup>

                </h:panelGroup>
            </p:panel>

            <!-- Configuration Dialog -->
            <p:dialog id="transferReceiveNativeConfigDialog"
                      header="Transfer Receive Receipt Printer Configuration"
                      widgetVar="transferReceiveNativeConfigDialog"
                      modal="true"
                      width="700"
                      height="600"
                      resizable="true"
                      maximizable="true"
                      closeOnEscape="true">

                <p:ajax event="open" listener="#{pharmacyConfigController.loadCurrentConfig}" update="transferReceiveNativeConfigForm" />

                <h:form id="transferReceiveNativeConfigForm">
                    <div class="row">
                        <div class="col-12">
                            <div class="card config-section">
                                <div class="card-header">
                                    <h6><i class="fas fa-file-alt"></i> Transfer Receive Receipt Paper Settings</h6>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <p:selectBooleanCheckbox id="transferReceiveA4" value="#{pharmacyConfigController.transferReceiveA4}" />
                                        <p:outputLabel for="transferReceiveA4" value="A4 Receipt Format" class="ms-2" />
                                        <small class="form-text text-muted d-block">Standard A4 size paper format</small>
                                    </div>
                                    <div class="mb-3">
                                        <p:selectBooleanCheckbox id="transferReceiveTemplate" value="#{pharmacyConfigController.transferReceiveTemplate}" />
                                        <p:outputLabel for="transferReceiveTemplate" value="Template Bill Format" class="ms-2" />
                                        <small class="form-text text-muted d-block">Template-based receipt format</small>
                                    </div>
                                    <div class="mb-3">
                                        <p:selectBooleanCheckbox id="transferReceiveCustom1" value="#{pharmacyConfigController.transferReceiveCustom1}" />
                                        <p:outputLabel for="transferReceiveCustom1" value="Letter Paper Format Custom 1" class="ms-2" />
                                        <small class="form-text text-muted d-block">Custom letter size receipt format</small>
                                    </div>
                                    <div class="mb-3">
                                        <p:selectBooleanCheckbox id="transferReceiveA4Detailed" value="#{pharmacyConfigController.transferReceiveA4Detailed}" />
                                        <p:outputLabel for="transferReceiveA4Detailed" value="A4 Detailed Receipt" class="ms-2" />
                                        <small class="form-text text-muted d-block">Detailed A4 format with comprehensive information</small>
                                    </div>
                                    <div class="mb-3">
                                        <p:selectBooleanCheckbox id="transferReceiveA4Custom1" value="#{pharmacyConfigController.transferReceiveA4Custom1}" />
                                        <p:outputLabel for="transferReceiveA4Custom1" value="A4 Custom Format 1" class="ms-2" />
                                        <small class="form-text text-muted d-block">Custom A4 transfer receive receipt template design 1</small>
                                    </div>
                                    <div class="mb-3">
                                        <p:selectBooleanCheckbox id="transferReceiveA4Custom2" value="#{pharmacyConfigController.transferReceiveA4Custom2}" />
                                        <p:outputLabel for="transferReceiveA4Custom2" value="A4 Custom Format 2" class="ms-2" />
                                        <small class="form-text text-muted d-block">Custom A4 transfer receive receipt template design 2</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <p:messages id="transferReceiveNativeConfigMessages" showDetail="true" closable="true" />
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div class="d-flex gap-2">
                                            <p:commandButton
                                                value="Apply &amp; Close"
                                                icon="fas fa-save"
                                                class="ui-button-success"
                                                ajax="false"
                                                action="#{pharmacyConfigController.saveConfig}" />
                                            <p:commandButton
                                                value="Cancel"
                                                icon="fas fa-times"
                                                class="ui-button-secondary"
                                                onclick="PF('transferReceiveNativeConfigDialog').hide(); return false;"
                                                type="button" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </h:form>
            </p:dialog>

        </h:form>
    </ui:define>

</ui:composition>
