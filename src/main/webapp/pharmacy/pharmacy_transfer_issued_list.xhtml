<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/pharmacy/disbursement_index.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="subcontent">


        <h:form>
            <p:panel>

                <f:facet name="header">
                    <p:outputLabel value="Select Request For Department : #{sessionController.department.name}" id="pageHeaderLabel"/>


                    <!-- Admin Config Button (Admin Only) -->
                    <h:panelGroup rendered="#{webUserController.hasPrivilege('Admin')}">
                        <p:commandButton
                            value="Config"
                            icon="fa fa-cog"
                            title="Page Configuration Management"
                            action="#{pageAdminController.navigateToPageAdmin('pharmacy/pharmacy_transfer_issued_list')}"
                            ajax="false"
                            styleClass="ui-button-secondary ms-5">
                        </p:commandButton>
                    </h:panelGroup>



                </f:facet>
                <div class='row'>
                    <div class='col-2'>
                        <h:outputLabel value="From Date"/>
                        <p:calendar styleClass="dateTimePicker" id="fromDate" value="#{searchController.fromDate}" class="w-100" inputStyleClass="w-100" navigator="false" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                        </p:calendar>
                        <h:outputLabel value="To Date"/>
                        <p:calendar id="toDate" value="#{searchController.toDate}" class="w-100" inputStyleClass="w-100" navigator="false" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                        </p:calendar>
                        <p:commandButton
                            id="btnSearch"
                            ajax="false"
                            value="Search"
                            icon="fas fa-search"
                            class="ui-button-warning w-100 my-1"
                            action="#{searchController.listTransferIssuesToReceiveForLoggedDepartment()}"/>
                        <p:commandButton
                            id="btnFullyReceived"
                            ajax="false"
                            value="Fully Received"
                            icon="fas fa-check-double"
                            class="ui-button-success w-100 my-1"
                            action="#{searchController.listFullyReceivedTransferIssues()}"/>
                        <p:commandButton
                            id="btnYetToReceive"
                            ajax="false"
                            value="Yet to Receive"
                            icon="fas fa-hourglass-half"
                            class="ui-button-info w-100 my-1"
                            action="#{searchController.listYetToReceiveTransferIssues()}"/>
                        <h:outputLabel value="Issue No"/>
                        <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.billNo}" class="w-100"/>
                        <h:outputLabel value="From Department"/>
                        <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.fromDepartment}" class="w-100"/>
                        <h:outputLabel value="Staff "/>
                        <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.staffName}" class="w-100"/>
                    </div>
                    <div class='col-10'>
                        <p:dataTable
                            id="transferIssuedListTable"
                            widgetVar="transferIssuedListTable"
                            value="#{searchController.transferIssuedListDtos}"
                            var="p"
                            rowIndexVar="rowIndex"
                            rowKey="#{p.billId}"
                            paginator="true" paginatorPosition="bottom"
                            paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            rowsPerPageTemplate="5,10,15"
                            summary="Pharmacy transfer issues awaiting receive at this department"
                            >
                            <p:column headerText="Issue No">
                                <p:commandLink
                                    ajax="false"
                                    value="#{p.deptId}"
                                    title="View issue #{p.deptId}"
                                    styleClass="#{p.cancelled ? 'text-danger text-decoration-line-through' : ''}"
                                    action="#{transferIssueNativeSqlController.viewByBillId(p.billId)}"/>
                            </p:column>
                            <p:column headerText="From Department">
                                <h:outputLabel value="#{p.fromDepartmentName}"/>
                            </p:column>
                            <p:column headerText="Department Type">
                                <h:outputText value="#{p.departmentTypeLabel}"
                                              rendered="#{p.departmentType != null}"/>
                                <h:outputText value="-"
                                              rendered="#{p.departmentType == null}"/>
                            </p:column>
                            <p:column headerText="Issued By">
                                <h:outputLabel value="#{p.issuerName}"/>
                                <br/>
                                <h:panelGroup rendered="#{p.cancelled}">
                                    <h:outputLabel style="color: red;" value="Cancelled By "/>
                                    <h:outputLabel style="color: red;" value="#{p.cancelledByName}"/>
                                </h:panelGroup>
                            </p:column>
                            <p:column headerText="Staff">
                                <h:outputLabel value="#{p.staffName}"/>
                            </p:column>
                            <p:column headerText="Issued At">
                                <h:outputLabel value="#{p.createdAt}">
                                    <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                </h:outputLabel>
                                <h:panelGroup rendered="#{p.cancelled}" >
                                    <br/>
                                    <h:outputLabel style="color: red;" value="Cancelled at " />
                                    <h:outputLabel style="color: red;" value="#{p.cancelledAt}" >
                                        <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                    </h:outputLabel>
                                </h:panelGroup>
                            </p:column>

                            <p:column headerText="Action">
                                <!-- No pending PRE: show Receive / Fast Receive -->
                                <h:panelGroup rendered="#{p.pendingReceiveBillId == null and !p.cancelled and !p.fullyIssued}">
                                    <p:commandButton
                                        id="btnToReceive"
                                        ajax="false"
                                        value="Receive"
                                        title="Receive items from #{p.deptId}"
                                        class="ui-button-warning mx-1"
                                        action="#{transferReceiveController.navigateToRecieveRequest()}">
                                        <f:setPropertyActionListener target="#{transferReceiveController.issuedBillId}" value="#{p.billId}"/>
                                    </p:commandButton>
                                    <p:commandButton
                                        id="btnToReceiveFast"
                                        ajax="false"
                                        value="Fast Receive"
                                        title="Fast receive items from #{p.deptId}"
                                        class="ui-button-success mx-1"
                                        action="#{transferReceiveNativeSqlController.navigateToReceiveRequestNative()}">
                                        <f:setPropertyActionListener target="#{transferReceiveNativeSqlController.issuedBillId}" value="#{p.billId}"/>
                                    </p:commandButton>
                                </h:panelGroup>
                                <!-- PRE exists, not finalized: Finalize + Cancel -->
                                <h:panelGroup rendered="#{p.pendingReceiveBillId != null and !p.pendingReceiveIsFinalized}">
                                    <p:commandButton
                                        id="btnToFinalizeReceive"
                                        ajax="false"
                                        value="Finalize"
                                        title="Finalize pending receive for #{p.deptId}"
                                        class="ui-button-warning mx-1"
                                        icon="fas fa-check"
                                        action="#{transferReceiveNativeSqlController.loadPendingReceiveForFinalize(p.pendingReceiveBillId)}"/>
                                    <p:commandButton
                                        id="btnCancelPendingReceive"
                                        ajax="false"
                                        value="Cancel"
                                        title="Cancel pending receive for #{p.deptId}"
                                        class="ui-button-danger mx-1"
                                        icon="fas fa-times"
                                        onclick="if(!confirm('Cancel this pending receive? This cannot be undone.')) return false;"
                                        action="#{transferReceiveNativeSqlController.cancelPendingReceive(p.pendingReceiveBillId)}"/>
                                </h:panelGroup>
                                <!-- PRE finalized, awaiting approval: Approve + Cancel -->
                                <h:panelGroup rendered="#{p.pendingReceiveBillId != null and p.pendingReceiveIsFinalized}">
                                    <p:commandButton
                                        id="btnToApproveReceive"
                                        ajax="false"
                                        value="Approve"
                                        title="Approve finalized receive for #{p.deptId}"
                                        class="ui-button-success mx-1"
                                        icon="fas fa-check-double"
                                        action="#{transferReceiveNativeSqlController.loadPendingReceiveForApprove(p.pendingReceiveBillId)}"/>
                                    <p:commandButton
                                        id="btnCancelFinalizedReceive"
                                        ajax="false"
                                        value="Cancel"
                                        title="Cancel finalized receive for #{p.deptId}"
                                        class="ui-button-danger mx-1"
                                        icon="fas fa-times"
                                        onclick="if(!confirm('Cancel this finalized receive? This cannot be undone.')) return false;"
                                        action="#{transferReceiveNativeSqlController.cancelPendingReceive(p.pendingReceiveBillId)}"/>
                                </h:panelGroup>
                            </p:column>

                            <p:column headerText="Received">
                                <div class="d-flex flex-wrap gap-1">
                                    <ui:repeat value="#{p.receivedBills}" var="b" varStatus="loop">
                                        <h:panelGroup rendered="#{not empty b.deptId}">
                                            <p:commandButton
                                                ajax="false"
                                                value="#{b.deptId}"
                                                title="View receive bill #{b.deptId}"
                                                styleClass="#{b.cancelled ? 'ui-button-danger' : 'ui-button-secondary'}"
                                                action="#{billSearch.navigateToViewBillByAtomicBillTypeBySelectedId}">
                                                <f:setPropertyActionListener value="#{b.billId}" target="#{billSearch.selectedBillId}"/>
                                            </p:commandButton>
                                        </h:panelGroup>
                                    </ui:repeat>
                                </div>
                            </p:column>

                        </p:dataTable>
                    </div>
                </div>
            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
