<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:se="http://xmlns.jcp.org/jsf/composite/pharmacy/search">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <p:panel id="gpBillPreview">
                        <f:facet name="header" >
                            <h:outputText value="Pharmacy Bill Search by Bill Type Atomic"/>
                        </f:facet>

                        <div class="pharma-search-filters">
                            <div class="pharma-search-filter pharma-search-filter-date">
                                <p:outputLabel for="fromDate" value="From Date"/>
                                <p:calendar id="fromDate" value="#{searchController.fromDate}" inputStyleClass="w-100" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                            <div class="pharma-search-filter pharma-search-filter-date">
                                <p:outputLabel for="toDate" value="To Date"/>
                                <p:calendar id="toDate" value="#{searchController.toDate}" inputStyleClass="w-100" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                            <div class="pharma-search-filter pharma-search-filter-type">
                                <p:outputLabel for="billTypeAtomic" value="Bill Type"/>
                                <p:selectOneMenu
                                    id="billTypeAtomic"
                                    filter="true"
                                    filterMatchMode="contains"
                                    value="#{searchController.billTypeAtomic}">
                                    <f:selectItem itemLabel="Select Bill Type"/>
                                    <f:selectItems value="#{enumController.billTypeAtomicsForPharmacyBillSearch}" var="i" itemLabel="#{i.label}" itemValue="#{i}" />
                                    <p:ajax event="change" process="@this" update="results" listener="#{pharmacyBillSearch.clearResultView()}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="pharma-search-filter">
                                <p:outputLabel for="itemName" value="Item Name"
                                               rendered="#{!configOptionApplicationController.getBooleanValueByKey('Pharmacy Bill Search by Bill Type Atomic - Suggest Item Names', false)}"/>
                                <p:inputText id="itemName" autocomplete="off" value="#{searchController.billSearchItemName}" placeholder="Contains item name"
                                             rendered="#{!configOptionApplicationController.getBooleanValueByKey('Pharmacy Bill Search by Bill Type Atomic - Suggest Item Names', false)}"/>
                                <p:outputLabel for="itemNameSuggest" value="Item Name"
                                               rendered="#{configOptionApplicationController.getBooleanValueByKey('Pharmacy Bill Search by Bill Type Atomic - Suggest Item Names', false)}"/>
                                <p:autoComplete
                                    id="itemNameSuggest"
                                    rendered="#{configOptionApplicationController.getBooleanValueByKey('Pharmacy Bill Search by Bill Type Atomic - Suggest Item Names', false)}"
                                    value="#{searchController.billSearchItemName}"
                                    completeMethod="#{itemController.completeAmpAndAmppNames}"
                                    forceSelection="false"
                                    autoHighlight="false"
                                    autoSelection="false"
                                    minQueryLength="4"
                                    maxResults="20"
                                    queryDelay="300"
                                    autocomplete="off"
                                    inputStyleClass="w-100"
                                    onkeydown="if (event.key === 'Enter' || event.key === 'NumpadEnter') { var p = document.getElementById(this.id.replace(/_input$/, '_panel')); if (p &amp;&amp; getComputedStyle(p).display !== 'none' &amp;&amp; !p.querySelector('.ui-state-highlight')) { event.preventDefault(); document.getElementById(this.form.id + ':btnSearch').click(); } }"
                                    placeholder="Type 4 letters for suggestions"/>
                            </div>
                            <div class="pharma-search-filter">
                                <p:outputLabel for="itemCode" value="Item Code"/>
                                <p:inputText id="itemCode" autocomplete="off" value="#{searchController.billSearchItemCode}" placeholder="Contains item code"/>
                            </div>
                            <div class="pharma-search-filter pharma-search-filter-count">
                                <p:outputLabel for="listCount" value="List Count"/>
                                <p:inputText id="listCount" autocomplete="off" value="#{searchController.maxResult}"/>
                            </div>
                            <div class="pharma-search-filter">
                                <p:commandButton
                                    id="btnSearch"
                                    ajax="false"
                                    icon="fas fa-search"
                                    class="ui-button-warning"
                                    value="Search"
                                    action="#{searchController.searchPharmacyBillsByBillTypeAtomic}">
                                </p:commandButton>
                            </div>
                        </div>

                        <p:messages id="searchMessages" closable="true" showDetail="false"/>

                        <se:bill_search_results id="results" showPurchaseReturnSearchInputs="false"/>

                        <p:defaultCommand target="btnSearch"/>

                    </p:panel>
                </h:form>

            </ui:define>

        </ui:composition>

    </h:body>
</html>
