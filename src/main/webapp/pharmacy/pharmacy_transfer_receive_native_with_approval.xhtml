<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/pharmacy/disbursement_index.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ph="http://xmlns.jcp.org/jsf/composite/pharmacy">

    <ui:define name="subcontent">
        <h:form>
            <h:outputStylesheet library="css" name="pharmacyA4.css"/>
            <p:panel rendered="#{!transferReceiveNativeSqlController.printPreview}">
                <p:panel>

                    <f:facet name="header">

                        <p:outputLabel value="Staff : &amp;nbsp;#{transferReceiveNativeSqlController.issuedBill.toStaff.person.nameWithTitle}" />

                        <p:commandButton
                            ajax="false"
                            action="#{transferReceiveNativeSqlController.navigateBackToReceiveList()}"
                            class="ui-button-secondary mx-1"
                            icon="fa fa-arrow-left"
                            style="float: right;"
                            value="Back to Receive List">
                        </p:commandButton>
                        <p:commandButton
                            value="Cancel"
                            action="#{transferReceiveNativeSqlController.cancelPendingReceive(transferReceiveNativeSqlController.receivedBillId)}"
                            class="ui-button-danger mx-1"
                            icon="fas fa-times"
                            ajax="false"
                            style="float: right;"
                            rendered="#{transferReceiveNativeSqlController.receivedBillId != null}"
                            onclick="if(!confirm('Cancel this pending receive? This cannot be undone.')) return false;">
                        </p:commandButton>
                        <p:commandButton
                            value="Finalize"
                            action="#{transferReceiveNativeSqlController.finalizeRequest()}"
                            class="ui-button-warning mx-1"
                            icon="fas fa-check"
                            ajax="false"
                            style="float: right;">
                        </p:commandButton>
                        <p:commandButton
                            value="Save"
                            action="#{transferReceiveNativeSqlController.saveRequest()}"
                            class="ui-button-success mx-1"
                            icon="fas fa-floppy-disk"
                            ajax="false"
                            style="float: right;">
                        </p:commandButton>

                    </f:facet>

                    <p:panel>
                        <f:facet name="header">
                            <h:outputLabel styleClass="fas fa-list" />
                            <h:outputLabel value="Requested Item " class="mx-4" />
                        </f:facet>

                        <p:dataTable
                            styleClass="noBorder compact-table"
                            var="item"
                            value="#{transferReceiveNativeSqlController.itemRowList}"
                            id="itemList"
                            scrollable="true"
                            scrollHeight="250"
                            sortBy="#{item.serialNo}"
                            style="border: none !important; font-size: #{configOptionApplicationController.getShortTextValueByKey('Report Font Size of Item List in Pharmacy Disbursement Reports', '10pt')}!Important; line-height: 1.1 !important;">

                            <p:column headerText="Item Name" style="width:25px!important;">
                                <h:outputText id="itemName" value="#{item.itemName}" />
                            </p:column>

                            <p:column headerText="Batch No" style="width:25px!important;">
                                <h:outputText id="batchNo" value="#{item.batchNo}" />
                            </p:column>

                            <p:column headerText="Purchase Rate" style="width:25px!important;">
                                <h:outputText id="purchasePrice" value="#{item.purchaseRate}" />
                            </p:column>

                            <p:column headerText="Sale Rate" style="width:25px!important;">
                                <h:outputText id="retailPrice" value="#{item.retailRate}" />
                            </p:column>

                            <p:column headerText="Expiry Date" style="width:25px!important;">
                                <h:outputText id="doe" value="#{item.dateOfExpire}">
                                    <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Issued Qty" style="width:25px!important;">
                                <h:outputText value="#{item.issuedQty}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Receiving Qty" style="width:25px!important;">
                                <p:inputText
                                    autocomplete="off"
                                    id="qty"
                                    value="#{item.receivingQty}"
                                    onfocus="this.select()">
                                    <f:convertNumber pattern="#,##0.00"/>
                                    <p:ajax
                                        event="keyup"
                                        process="@this"
                                        update="value :#{p:resolveFirstComponentWithId('txtReceivingNetTotal',view).clientId}"
                                        listener="#{transferReceiveNativeSqlController.onQuantityChangeForTransferReceive(item)}"/>
                                </p:inputText>
                            </p:column>

                            <p:column headerText="Value" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" style="width:25px!important;">
                                <h:outputText id="value" value="#{item.value}">
                                    <f:convertNumber pattern="#,##0.00"/>
                                </h:outputText>
                            </p:column>

                        </p:dataTable>
                    </p:panel>

                    <p:panelGrid columns="2" class="mt-2">
                        <h:outputLabel value="Issued From" />
                        <h:outputLabel value="#{transferReceiveNativeSqlController.issuedBill.fromDepartment.name}" />

                        <h:outputLabel value="Issued To" />
                        <h:outputLabel value="#{transferReceiveNativeSqlController.issuedBill.toDepartment.name}" />

                        <h:outputLabel value="Issued Value" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" />
                        <h:outputLabel value="#{transferReceiveNativeSqlController.issuedBill.absoluteNetTotal}" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputLabel>

                        <h:outputLabel value="Receiving Value" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}" />
                        <h:outputLabel id="txtReceivingNetTotal" value="#{transferReceiveNativeSqlController.displayReceivedNetTotal}" rendered="#{webUserController.hasPrivilege('PharmacyTransferViewRates')}">
                            <f:convertNumber pattern="#,##0.00"/>
                        </h:outputLabel>

                        <h:outputLabel value="Comments" />
                        <p:inputTextarea class="w-100" rows="3" value="#{transferReceiveNativeSqlController.comments}" />
                    </p:panelGrid>

                </p:panel>
            </p:panel>

            <p:panel rendered="#{transferReceiveNativeSqlController.printPreview}">
                <p:commandButton
                    ajax="false"
                    icon="fas fa-list"
                    class="ui-button-warning"
                    action="pharmacy_transfer_issued_list"
                    actionListener="#{transferReceiveNativeSqlController.makeNull()}"
                    value="Issued List"/>
                <p:commandButton
                    value="Print"
                    icon="fas fa-print"
                    class="ui-button-info mx-2 mb-2"
                    ajax="false"
                    action="#">
                    <p:printer target="gpBillPreviewApproval" />
                </p:commandButton>

                <h:panelGroup id="gpBillPreviewApproval">
                    <ph:transferReceiveNativeA4 dto="#{transferReceiveNativeSqlController.printDto}" />
                </h:panelGroup>

            </p:panel>

        </h:form>
    </ui:define>

</ui:composition>
