<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:define name="content">

        <div class="row">
            <div class="col-12">
                <p:messages id="messages" showDetail="true" closable="true" />
            </div>
        </div>

        <div class="row">
            <div class="col-2">
                <h:form>
                    <p:accordionPanel activeIndex="0">
                        <p:ajax event="tabChange" process="@this"/>

                        <p:tab title="Issue">
                            <div class="d-grid gap-2">
                                <p:commandButton
                                    value="New Disposal Issue"
                                    ajax="false"
                                    action="/pharmacy/pharmacy_issue?faces-redirect=true"
                                    actionListener="#{pharmacyIssueController.resetAll()}"
                                    styleClass="ui-button-stage-save w-100"
                                    style="text-align: left"
                                    icon="fas fa-trash"
                                    rendered="#{webUserController.hasPrivilege('PharmacyDisposalIssue')}" />
                                <p:commandButton
                                    value="Finalize Issues"
                                    ajax="false"
                                    action="/pharmacy/pharmacy_disposal_issue_list_to_finalize?faces-redirect=true"
                                    actionListener="#{searchController.makeListNull()}"
                                    styleClass="ui-button-stage-finalize w-100"
                                    style="text-align: left"
                                    icon="fas fa-lock"
                                    rendered="#{webUserController.hasPrivilege('PharmacyDisposalIssueFinalize')}" />
                                <p:commandButton
                                    value="Approve Issues"
                                    ajax="false"
                                    action="/pharmacy/pharmacy_disposal_issue_list_to_approve?faces-redirect=true"
                                    actionListener="#{searchController.makeListNull()}"
                                    styleClass="ui-button-stage-approve w-100"
                                    style="text-align: left"
                                    icon="fas fa-check-double"
                                    rendered="#{webUserController.hasPrivilege('PharmacyDisposalIssueApprove')}" />
                                <p:commandButton
                                    value="Search Issue Bill"
                                    ajax="false"
                                    action="/pharmacy/pharmacy_search_issue_bill?faces-redirect=true"
                                    actionListener="#{searchController.makeListNull()}"
                                    class="ui-button-info w-100"
                                    style="text-align: left"
                                    icon="fas fa-search"
                                    rendered="#{webUserController.hasPrivilege('PharmacyDisposalSearchIssueBill')}" />
                                <p:commandButton
                                    value="Search Issue Bill Items"
                                    ajax="false"
                                    action="/pharmacy/pharmacy_search_issue_bill_item?faces-redirect=true"
                                    actionListener="#{searchController.makeListNull()}"
                                    class="ui-button-info w-100"
                                    style="text-align: left"
                                    icon="fas fa-list"
                                    rendered="#{webUserController.hasPrivilege('PharmacyDisposalSearchIssueBillItems')}" />
                                <p:commandButton
                                    value="Search Issue Return Bill"
                                    ajax="false"
                                    action="/pharmacy/pharmacy_search_issue_bill_return?faces-redirect=true"
                                    actionListener="#{searchController.makeListNull()}"
                                    class="ui-button-info w-100"
                                    style="text-align: left"
                                    icon="fas fa-undo"
                                    rendered="#{webUserController.hasPrivilege('PharmacyDisposalSearchIssueReturnBill')}" />
                            </div>
                        </p:tab>

                        <p:tab title="Returns">
                            <div class="d-grid gap-2">
                                <p:commandButton
                                    value="Create Return"
                                    ajax="false"
                                    action="#{disposalReturnWorkflowController.navigateToCreateDisposalReturn()}"
                                    styleClass="ui-button-stage-save w-100"
                                    style="text-align: left"
                                    icon="fas fa-recycle"
                                    rendered="#{webUserController.hasPrivilege('CreateDisposalReturn')}" />
                                <p:commandButton
                                    value="Finalize Returns"
                                    ajax="false"
                                    action="#{disposalReturnWorkflowController.navigateToFinalizeDisposalReturn()}"
                                    styleClass="ui-button-stage-finalize w-100"
                                    style="text-align: left"
                                    icon="fas fa-lock"
                                    rendered="#{webUserController.hasPrivilege('FinalizeDisposalReturn')}" />
                                <p:commandButton
                                    value="Approve Returns"
                                    ajax="false"
                                    action="#{disposalReturnWorkflowController.navigateToApproveDisposalReturn()}"
                                    styleClass="ui-button-stage-approve w-100"
                                    style="text-align: left"
                                    icon="fas fa-check-double"
                                    rendered="#{webUserController.hasPrivilege('ApproveDisposalReturn')}" />
                                <p:commandButton
                                    value="Completed Returns"
                                    ajax="false"
                                    action="#{disposalReturnWorkflowController.navigateToCompletedDisposalReturns()}"
                                    class="ui-button-secondary w-100"
                                    style="text-align: left"
                                    icon="fas fa-check-double"
                                    rendered="#{webUserController.hasPrivilege('ViewDisposalReturn')}" />
                            </div>
                        </p:tab>

                    </p:accordionPanel>
                </h:form>
            </div>
            <div class="col-10">
                <ui:insert name="subcontent">
                    <p:panel header="Disposal Management">
                        <div class="text-center p-5">
                            <h3><h:outputText value="Welcome to Disposal Management"/></h3>
                            <p class="mt-3">
                                <h:outputText value="Please select a function from the left menu to get started."/>
                            </p>
                            <div class="mt-4">
                                <p:panelGrid columns="2" styleClass="mx-auto" style="max-width: 600px;">
                                    <h:outputText value="Issue" styleClass="font-weight-bold"/>
                                    <h:outputText value="Create disposal issue bills and search existing bills"/>

                                    <h:outputText value="Returns" styleClass="font-weight-bold"/>
                                    <h:outputText value="Create, finalize, approve, and view completed disposal returns"/>
                                </p:panelGrid>
                            </div>
                        </div>
                    </p:panel>
                </ui:insert>
            </div>
        </div>

    </ui:define>

</ui:composition>
