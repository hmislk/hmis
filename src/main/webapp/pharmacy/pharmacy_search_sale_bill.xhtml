<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <p:panel header="Pharmacy Sale Bill Search">
                        <div class="row">
                            <div class="col-md-2">

                                <h:outputLabel class="w-100" value="From Date"/>
                                <p:calendar
                                    styleClass="dateTimePicker"
                                    id="fromDate"
                                    class="w-100 "
                                    inputStyleClass="form-control"
                                    value="#{searchController.fromDate}"
                                    navigator="false"
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                                </p:calendar>
                                <h:outputLabel value="To Date"/>
                                <p:calendar
                                    id="toDate"
                                    value="#{searchController.toDate}"
                                    navigator="false"
                                    inputStyleClass="form-control"
                                    class="w-100"
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                                </p:calendar>
                                <p:commandButton class="w-100 mt-2 ui-button-warning" icon="fa fa-search" id="btnSearch" ajax="false" value="Search" action="#{searchController.createPharmacyRetailBills}"/>
                                <p:commandButton class="w-100 mb-4 mt-2 ui-button-warning" icon="fa fa-search" id="btnSearchAll" ajax="false" value="Search All" action="#{searchController.createPharmacyRetailAllBills()}"/>

                                <h:outputLabel value="Bill No"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.billNo}" class="w-100"/>
                                <h:outputLabel value="Patient Name"/>
                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.patientName}" class="w-100"/>
                                <h:outputLabel value="Patient Phone Number"/>
                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.patientPhone}" class="w-100"/>
                                <h:outputLabel value="Department Name"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.department}" class="w-100"/>
                                <h:outputLabel value="Total"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.total}" class="w-100"/>
                                <h:outputLabel value="Net Total"/>
                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.netTotal}" class="w-100"/>
                                <p:selectOneMenu value="#{searchController.paymentMethod}" class="w-100 mt-2">
                                    <f:selectItem itemLabel="Select Payment Method"/>
                                    <f:selectItems value="#{enumController.paymentMethods}" />
                                    <f:ajax  event="change" execute="@this"  listener="#{searchController.makeNull}"/>
                                </p:selectOneMenu>
                                <p:messages class="mt-3"/>
                                <h:outputText value="Note: This page lists direct retail sale bills only. Bills created for cashier settlement are not shown here." styleClass="text-muted small mt-2 d-block"/>

                            </div>
                            <div class="col-md-10">
                                <p:dataTable
                                    rowIndexVar="i"
                                    id="tblBills"
                                    value="#{pharmacyBillSearch.saleBillDtos}"
                                    var="bill"
                                    paginator="true"
                                    rows="10"
                                    paginatorPosition="bottom"
                                    paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                    rowsPerPageTemplate="5,10,15"
                                    >

                                    <p:column headerText="Bill No"
                                              filterBy="#{bill.deptId}"
                                              filterMatchMode="contains"
                                              sortBy="#{bill.deptId}">
                                        <h:outputLabel value="#{bill.deptId}" />
                                    </p:column>

                                    <p:column headerText="Department"
                                              filterBy="#{bill.departmentName}"
                                              filterMatchMode="contains"
                                              sortBy="#{bill.departmentName}">
                                        <h:outputLabel value="#{bill.departmentName}" />
                                    </p:column>

                                    <p:column headerText="Date Time"
                                              sortBy="#{bill.createdAt}">
                                        <h:outputLabel value="#{bill.createdAt}" >
                                            <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateTimeFormat}" />
                                        </h:outputLabel>
                                    </p:column>
                                    <p:column headerText="Pharmacist"
                                              filterBy="#{bill.creatorName}"
                                              filterMatchMode="contains"
                                              sortBy="#{bill.creatorName}">
                                        <h:outputLabel value="#{bill.creatorName}" />
                                    </p:column>

                                    <p:column
                                        headerText="Client"
                                        width="8em"
                                        filterMatchMode="contains"
                                        filterBy="#{bill.patientName}"
                                        sortBy="#{bill.patientName}">
                                        <h:outputLabel value="#{bill.patientName}" />
                                    </p:column>

                                    <p:column headerText="Referring Doctor"
                                              filterBy="#{bill.referredByName}"
                                              filterMatchMode="contains"
                                              sortBy="#{bill.referredByName}">
                                        <h:outputLabel value="#{bill.referredByName}" />
                                    </p:column>

                                    <p:column headerText="Payment Method"
                                              filterBy="#{bill.paymentMethod}"
                                              filterMatchMode="contains"
                                              sortBy="#{bill.paymentMethod}">
                                        <h:outputLabel value="#{bill.paymentMethod}" />
                                    </p:column>

                                    <p:column headerText="Discount Scheme"
                                              filterBy="#{bill.paymentSchemeName}"
                                              filterMatchMode="contains"
                                              sortBy="#{bill.paymentSchemeName}">
                                        <h:outputLabel value="#{bill.paymentSchemeName}" />
                                    </p:column>

                                    <p:column headerText="Gross Value"
                                              styleClass="text-end"
                                              sortBy="#{bill.total}">
                                        <h:outputLabel value="#{bill.total}" >
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputLabel>
                                    </p:column>

                                    <p:column headerText="Discount"
                                              styleClass="text-end"
                                              sortBy="#{bill.discount}">
                                        <h:outputLabel value="#{bill.discount}" >
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputLabel>
                                    </p:column>

                                    <p:column headerText="Net Value"
                                              styleClass="text-end"
                                              sortBy="#{bill.netTotal}">
                                        <h:outputLabel value="#{bill.netTotal}" >
                                            <f:convertNumber pattern="#,##0.00"/>
                                        </h:outputLabel>
                                    </p:column>

                                    <p:column headerText="Comments"
                                              filterBy="#{bill.comments}"
                                              filterMatchMode="contains"
                                              sortBy="#{bill.comments}">
                                        <p:badge value="Refunded" severity="warning" rendered="#{bill.refunded}"/>
                                        <p:badge value="Cancelled" severity="danger" rendered="#{bill.cancelled}"/>
                                        <h:outputText value="#{bill.comments}" rendered="#{not empty bill.comments}" />
                                    </p:column>

                                    <p:column headerText="Actions" >
                                        <p:commandButton
                                            ajax="false"
                                            action="#{billSearch.navigateToViewBillByAtomicBillTypeByBillId(bill.id)}"
                                            icon="fa fa-eye"
                                            styleClass="ui-button-info ui-button-sm mx-1"
                                            title="View Bill">
                                        </p:commandButton>
                                        <p:commandButton
                                            id="btnManage"
                                            ajax="false"
                                            icon="fa fa-file-invoice"
                                            styleClass="ui-button-warning ui-button-sm mx-1"
                                            style="margin-right: .25rem;"
                                            title="Manage Sale Bill"
                                            action="#{pharmacyBillSearch.navigatePharmacyReprintRetailBill()}">
                                            <f:setPropertyActionListener
                                                value="#{bill.id}"
                                                target="#{pharmacyBillSearch.billId}"/>
                                        </p:commandButton>
                                    </p:column>

                                </p:dataTable>

                            </div>
                        </div>

                    </p:panel>

                </h:form>
            </ui:define>


        </ui:composition>

    </h:body>
</html>
