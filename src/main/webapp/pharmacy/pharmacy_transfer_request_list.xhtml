<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/pharmacy/disbursement_index.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="subcontent">


        <h:form>
            <p:panel >
                <f:facet name="header">
                    <p:outputLabel value="Select Request For Department : #{sessionController.department.name}"/> 
                    <!-- Admin Config Button (Admin Only) -->
                    <h:panelGroup rendered="#{webUserController.hasPrivilege('Admin')}">
                        <p:commandButton
                            value="Config"
                            icon="fa fa-cog"
                            title="Page Configuration Management"
                            action="#{pageAdminController.navigateToPageAdmin('pharmacy/pharmacy_transfer_request_list')}"
                            ajax="false"
                            styleClass="ui-button-secondary ms-5">
                        </p:commandButton>
                    </h:panelGroup>

                </f:facet>

                <h:panelGroup layout="block" styleClass="mb-3"
                              rendered="#{not empty transferIssueNativeSqlController.blockingPendingDrafts}">
                    <p:panel styleClass="mb-2" style="border: 1px solid #dc3545;">
                        <f:facet name="header">
                            <i class="fas fa-exclamation-triangle" style="color:#dc3545; margin-right:.5rem;"/>
                            <h:outputText value="A pending fast issue is blocking new issues for this department"/>
                        </f:facet>
                        <p class="mb-2">
                            Finalize or approve it from <b>Disbursement &#8594; Issues &#8594; Finalize Issues / Approve Issues</b>,
                            or cancel it here if it was started by mistake.
                        </p>
                        <p:dataTable id="tblBlockingPendingDrafts" widgetVar="wvBlockingPendingDrafts"
                                     value="#{transferIssueNativeSqlController.blockingPendingDrafts}" var="d"
                                     rowKey="#{d.id}" size="small">
                            <p:column headerText="Issue No">
                                <h:outputText value="#{d.deptId}"/>
                            </p:column>
                            <p:column headerText="Created">
                                <h:outputText value="#{d.createdAt}">
                                    <f:convertDateTime timeZone="Asia/Colombo"
                                                       pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Created By">
                                <h:outputText value="#{d.creater.webUserPerson.name}"/>
                            </p:column>
                            <p:column headerText="Status">
                                <h:outputText value="#{d.completed ? 'Finalized — awaiting approval' : 'Draft — awaiting finalize'}"/>
                            </p:column>
                            <p:column headerText="Action">
                                <p:commandButton value="Cancel Draft"
                                                 icon="fas fa-times"
                                                 ajax="false"
                                                 styleClass="ui-button-danger"
                                                 title="Cancel pending fast issue #{d.deptId}"
                                                 onclick="if(!confirm('Cancel this pending fast issue draft? This cannot be undone.')) return false;"
                                                 action="#{transferIssueNativeSqlController.cancelPendingNativeIssueDraft(d)}"
                                                 rendered="#{webUserController.hasPrivilege('PharmacyTransferIssueCancel')}"/>
                                <h:outputText value="Ask a supervisor to cancel this draft."
                                              rendered="#{!webUserController.hasPrivilege('PharmacyTransferIssueCancel')}"/>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                </h:panelGroup>

                <div class="row">
                    <div class="col-md-2">
                        <h:outputLabel value="From Date"/>
                        <p:calendar 
                            class="w-100"  
                            inputStyleClass="form-control"
                            styleClass="dateTimePicker" 
                            id="fromDate" 
                            value="#{searchController.fromDate}" 
                            navigator="false" 
                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >      
                        </p:calendar>
                        <h:outputLabel class="mb-2"  value="To Date"/>
                        <p:calendar 
                            class="w-100"  
                            id="toDate" 
                            inputStyleClass="form-control"
                            value="#{searchController.toDate}" 
                            navigator="false" 
                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >                                                                              
                        </p:calendar>
                        <p:commandButton
                            id="btnSearch"
                            ajax="false"
                            value="Search"
                            icon="fas fa-search"
                            class="ui-button-warning w-100 my-2"
                            action="#{searchController.createRequestTableDto()}"
                            actionListener="#{transferIssueForRequestsController.makeNull()}">
                        </p:commandButton>

                        <h:outputLabel value="Request No"/>   
                        <p:inputText class="w-100"  autocomplete="off"  value="#{searchController.searchKeyword.billNo}" />   

                    </div>

                    <div class="col-md-10">
                        <p:dataTable
                            value="#{searchController.transferRequestDtos}"
                            var="p"
                            rows="10"
                            paginator="true"
                            paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            rowsPerPageTemplate="5,10,15"
                            paginatorPosition="bottom">
                            <p:column headerText="Request No">
                                <h:outputLabel value="#{p.deptId}"/>
                            </p:column>
                            <p:column headerText="From Department">
                                <h:outputLabel value="#{p.fromDepartmentName}"/>
                            </p:column>
                            <p:column headerText="Requested At">
                                <h:outputLabel value="#{p.createdAt}">
                                    <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                                </h:outputLabel>
                            </p:column>
                            <p:column headerText="Requested By">
                                <h:outputLabel value="#{p.creatorName}"/>
                            </p:column>
                            <p:column headerText="Action">
                                <p:commandButton
                                    id="btnViewTransferRequest"
                                    ajax="false"
                                    title="View Request"
                                    icon="far fa-eye"
                                    class="ui-button-info mx-1"
                                    action="#{pharmacyBillSearch.navigateToViewPharmacyTransferRequestById}">
                                    <f:setPropertyActionListener value="#{p.billId}" target="#{pharmacyBillSearch.billId}"/>
                                </p:commandButton>

                                <!--
                                    Old entity-based Issue button, replaced by the native-SQL
                                    "Fast Issue" button below (kept as btnToIssue's styling/id).
                                    Re-enable this if the native-SQL issue path
                                    (transferIssueNativeSqlController) is found to have data
                                    correctness issues that the entity-based path does not have.
                                <p:commandButton
                                    id="btnToIssue"
                                    ajax="false"
                                    icon="fas fa-check"
                                    title="Issue"
                                    class="ui-button-success mx-1"
                                    actionListener="#{pharmacyController.clearItemHistory()}"
                                    action="#{transferIssueForRequestsController.navigateToPharmacyIssueForRequestsById}"
                                    onclick="if(#{configOptionApplicationController.getBooleanValueByKey('Use Save Finalize Approve Workflow for Issue for Requests', false)} &amp;&amp; !confirm('Start issuing for this request? A pending draft will block this if one already exists.')) return false;"
                                    disabled="#{p.cancelled eq true or p.fullyIssued eq true}">
                                    <f:setPropertyActionListener target="#{transferIssueForRequestsController.requestedBillId}" value="#{p.billId}"/>
                                </p:commandButton>
                                -->

                                <p:commandButton
                                    id="btnToIssueFast"
                                    ajax="false"
                                    icon="fas fa-check"
                                    title="Issue"
                                    class="ui-button-success mx-1"
                                    action="#{transferIssueNativeSqlController.navigateToIssueRequestNative()}"
                                    onclick="if(#{configOptionApplicationController.getBooleanValueByKey('Use Save Finalize Approve Workflow for Issue for Requests', false)} &amp;&amp; !confirm('Start issuing for this request? A pending draft will block this if one already exists.')) return false;"
                                    disabled="#{p.cancelled eq true or p.fullyIssued eq true}">
                                    <f:setPropertyActionListener target="#{transferIssueNativeSqlController.requestedBillId}" value="#{p.billId}"/>
                                </p:commandButton>
                            </p:column>

                            <p:column headerText="Issued">
                                <div class="d-flex flex-wrap gap-1">
                                    <ui:repeat value="#{p.issuedBills}" var="b" varStatus="loop">
                                        <p:commandButton
                                            ajax="false"
                                            value="#{b.deptId}"
                                            styleClass="#{b.cancelled ? 'ui-button-danger' : 'ui-button-secondary'}"
                                            action="#{billSearch.navigateToViewBillByAtomicBillTypeBySelectedId}">
                                            <f:setPropertyActionListener value="#{b.billId}" target="#{billSearch.selectedBillId}"/>
                                        </p:commandButton>
                                    </ui:repeat>
                                </div>
                            </p:column>
                        </p:dataTable>
                    </div>
                </div>

            </p:panel>
        </h:form>
    </ui:define>  

</ui:composition>
