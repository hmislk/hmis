<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:se="http://xmlns.jcp.org/jsf/composite/pharmacy/search">

    <!--
        Pharmacy Bill Search by Item (issue #24250): bills of the selected bill
        type atomic, in the logged-in department, that contain the selected
        item. Reached from Pharmacy Analytics > Procurement Reports.
    -->
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <p:panel id="gpBillPreview">
                        <f:facet name="header" >
                            <h:outputText value="Pharmacy Bill Search by Item"/>
                        </f:facet>

                        <div class="pharma-search-filters">
                            <div class="pharma-search-filter pharma-search-filter-date">
                                <p:outputLabel for="fromDate" value="From Date"/>
                                <p:calendar id="fromDate" value="#{searchController.fromDate}" inputStyleClass="w-100" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                            <div class="pharma-search-filter pharma-search-filter-date">
                                <p:outputLabel for="toDate" value="To Date"/>
                                <p:calendar id="toDate" value="#{searchController.toDate}" inputStyleClass="w-100" navigator="true" pattern="#{sessionController.applicationPreference.longDateTimeFormat}"/>
                            </div>
                            <div class="pharma-search-filter pharma-search-filter-type">
                                <p:outputLabel for="billTypeAtomic" value="Bill Type"/>
                                <p:selectOneMenu
                                    id="billTypeAtomic"
                                    filter="true"
                                    filterMatchMode="contains"
                                    value="#{searchController.billTypeAtomic}">
                                    <f:selectItem itemLabel="Select Bill Type"/>
                                    <f:selectItems value="#{enumController.billTypeAtomicsForPharmacyBillSearch}" var="i" itemLabel="#{i.label}" itemValue="#{i}" />
                                    <p:ajax event="change" process="@this" update="results" listener="#{pharmacyBillSearch.clearResultView()}"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="pharma-search-filter pharma-search-filter-item">
                                <p:outputLabel for="item" value="Item"/>
                                <p:autoComplete
                                    id="item"
                                    value="#{searchController.billSearchItem}"
                                    forceSelection="true"
                                    inputStyleClass="w-100"
                                    minQueryLength="3"
                                    queryDelay="300"
                                    completeMethod="#{itemController.completeAmpItem}"
                                    var="vt"
                                    itemLabel="#{vt.name}"
                                    itemValue="#{vt}"
                                    placeholder="Type 3 letters, then pick the item from the list">
                                    <p:column headerText="Item">
                                        <h:outputText value="#{vt.name}"/>
                                    </p:column>
                                    <p:column headerText="Code">
                                        <h:outputText value="#{vt.code}"/>
                                    </p:column>
                                </p:autoComplete>
                            </div>
                            <div class="pharma-search-filter pharma-search-filter-count">
                                <p:outputLabel for="listCount" value="List Count"/>
                                <p:inputText id="listCount" autocomplete="off" value="#{searchController.maxResult}"/>
                            </div>
                            <div class="pharma-search-filter">
                                <p:commandButton
                                    id="btnSearch"
                                    ajax="false"
                                    icon="fas fa-search"
                                    class="ui-button-warning"
                                    value="Search"
                                    action="#{searchController.searchPharmacyBillsByItem}">
                                </p:commandButton>
                            </div>
                        </div>

                        <p:messages id="searchMessages" closable="true" showDetail="false"/>

                        <se:bill_search_results id="results"/>

                        <p:defaultCommand target="btnSearch"/>

                    </p:panel>
                </h:form>

            </ui:define>

        </ui:composition>

    </h:body>
</html>
