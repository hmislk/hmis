<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:opd="http://xmlns.jcp.org/jsf/composite/ezcomp/opd">
    <ui:composition 
        template="/lab/sample_index.xhtml">

        <ui:define name="subcontent">

            <h:panelGroup rendered="#{!webUserController.hasPrivilege('LabSampleCollecting')}" >
                You are NOT authorized
            </h:panelGroup>

            <h:panelGroup rendered="#{webUserController.hasPrivilege('LabSampleCollecting')}" >
                <h:form>        
                    <p:panel >
                        <f:facet name="header">
                            <h:outputLabel class="mt-2" value="Collect Samples"/>
                        </f:facet>

                        <h:panelGrid columns="7" class="w-100">
                            <h:outputLabel class="w-100 m-2" value="From Date"/>
                            <p:calendar 
                                id="fromDate" 
                                value="#{patientInvestigationController.fromDate}" 
                                navigator="true" 
                                class="w-100 m-2"
                                inputStyleClass="form-control"
                                pattern="dd MMMM yy - hh:mm a" >
                            </p:calendar>
                            <p:spacer width="10"></p:spacer>
                            <h:outputLabel class="w-100 m-2" value="To Date"/>
                            <p:calendar 
                                class="w-100 m-2"
                                id="toDate" 
                                value="#{patientInvestigationController.toDate}" 
                                navigator="true" 
                                inputStyleClass="form-control"
                                pattern="dd MMMM yy - hh:mm a" >
                            </p:calendar>
                            <p:spacer width="10"></p:spacer>
                            <p:commandButton 
                                class="w-100 my-1" 
                                id="btnToCollecte" 
                                ajax="false" 
                                actionListener="#{patientInvestigationController.listBarcodeGeneratedPatientSamplesYetToCollect()}" 
                                value="List Samples to Collecte"   >
                            </p:commandButton>
                            <p:commandButton 
                                class="w-100 my-1" 
                                id="btnCollected" 
                                ajax="false" 
                                actionListener="#{patientInvestigationController.listBarcodeGeneratedPatientSamplesCollected()}" 
                                value="List Samples Collected"   >
                            </p:commandButton>
                        </h:panelGrid>

                        <h:panelGrid columns="2" class="w-100" columnClasses="w-50,w-50">
                            <p:outputLabel for="acTransporter" value="Sample Transporter (for Sent to Lab)" />
                            <p:outputLabel for="txtRevertReason" value="Reason for reverting (for Revert)" />
                            <p:autoComplete
                                id="acTransporter"
                                completeMethod="#{staffMappingController.completeSampleTransporter}"
                                value="#{patientInvestigationController.sampleTransportedToLabByStaff}"
                                var="mys"
                                class="w-100"
                                maxResults="25"
                                forceSelection="true"
                                placeholder="Sample Transporter"
                                inputStyleClass="form-control"
                                itemLabel="#{mys.person.nameWithTitle}"
                                itemValue="#{mys}">
                                <p:column headerText="Code">#{mys.code}</p:column>
                                <p:column headerText="Name">#{mys.person.nameWithTitle}</p:column>
                            </p:autoComplete>
                            <p:inputText
                                id="txtRevertReason"
                                class="w-100"
                                disabled="#{not webUserController.hasPrivilege('LabRevertSample')}"
                                placeholder="Reason for reverting the collection"
                                value="#{patientInvestigationController.sampleCollectionCancelReason}" />
                        </h:panelGrid>

                        <p:dataTable
                            id="sample"
                            class="w-100 mt-2"
                            value="#{patientInvestigationController.patientSamples}"
                            var="ps"
                            paginator="true"
                            rowKey="#{ps.id}"
                            paginatorPosition="bottom"
                            rows="10"
                            emptyMessage="No samples. Choose the dates and click a List button."
                            paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            rowsPerPageTemplate="10,25,50">

                            <p:column headerText="Sample" width="8em">
                                <h:outputText value="#{ps.id}" />
                                <br/>
                                <h:outputText value="#{ps.tube.name}" />
                            </p:column>

                            <p:column headerText="Bill">
                                <p:commandLink
                                    id="billNo"
                                    target="_blank"
                                    ajax="false"
                                    value="#{ps.bill.deptId}"
                                    action="#{billSearch.navigateToViewOpdBillNewWindow()}">
                                    <f:setPropertyActionListener value="#{ps.bill}" target="#{billSearch.bill}"/>
                                </p:commandLink>
                            </p:column>

                            <p:column headerText="Patient">
                                <h:outputText value="#{ps.bill.patient.person.nameWithTitle}" styleClass="#{ps.bill.cancelled ? 'redtext':''}"/>
                            </p:column>

                            <p:column headerText="Investigations">
                                <ui:repeat value="#{patientInvestigationController.getPatientInvestigationsFromSample(ps)}" var="psc">
                                    <h:outputText value="#{psc.investigationComponant.name}" />
                                    <br/>
                                </ui:repeat>
                            </p:column>

                            <p:column headerText="Status" width="10em">
                                <h:outputText value="Bill Cancelled" rendered="#{ps.bill.cancelled}" styleClass="redtext"/>
                                <h:outputText value="#{ps.status.label}" rendered="#{!ps.bill.cancelled}"/>
                            </p:column>

                            <p:column headerText="Actions" styleClass="text-center" width="14em">
                                <p:commandButton
                                    id="btnSample"
                                    ajax="false"
                                    disabled="#{ps.sampleCollected or ps.bill.cancelled}"
                                    action="#{patientInvestigationController.collectSampleFromRow(ps)}"
                                    icon="fa fa-check-circle"
                                    styleClass="ui-button-success m-1"
                                    title="Collect"
                                    ariaLabel="Collect sample #{ps.id}" />

                                <p:commandButton
                                    id="btnSampleSentToLab"
                                    ajax="false"
                                    disabled="#{!ps.sampleCollected or ps.sampleSent or ps.bill.cancelled}"
                                    action="#{patientInvestigationController.sendSampleToLabFromRow(ps)}"
                                    icon="pi pi-external-link"
                                    styleClass="ui-button-warning m-1"
                                    title="Sent to Lab"
                                    ariaLabel="Send sample #{ps.id} to lab" />

                                <p:commandButton
                                    id="btnSampleRevert"
                                    ajax="false"
                                    disabled="#{!ps.sampleCollected or ps.bill.cancelled or not webUserController.hasPrivilege('LabRevertSample')}"
                                    action="#{patientInvestigationController.revertSampleCollectionFromRow(ps)}"
                                    onclick="if (!confirm('Revert the collection of this sample? Draft results will be discarded. This is not allowed once a report is approved or printed.')) return false;"
                                    icon="fa fa-undo"
                                    styleClass="ui-button-danger m-1"
                                    title="Revert (mark as not collected)"
                                    ariaLabel="Revert collection of sample #{ps.id}" />
                            </p:column>
                        </p:dataTable>

                    </p:panel>
                </h:form>
            </h:panelGroup>
           
        </ui:define>
    </ui:composition>
</html>
