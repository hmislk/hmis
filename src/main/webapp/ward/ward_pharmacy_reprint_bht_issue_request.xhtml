<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ph="http://xmlns.jcp.org/jsf/composite/pharmacy"
                xmlns:phe="http://xmlns.jcp.org/jsf/composite/pharmacy/inward"
                xmlns:phprint="http://xmlns.jcp.org/jsf/composite/pharmacy/print">

    <ui:define name="content">
        <h:form>
            <p:panel >
                <f:facet name="header" >
                    <div class="d-flex justify-content-between align-items-center w-100">

                        <!-- LEFT: title -->
                        <div class="d-flex align-items-center gap-2">
                            <h:outputText styleClass="fas fa-file-invoice" />
                            <h:outputLabel value="Inward Pharmacy Request Reprint" ></h:outputLabel>
                            <p:tag value="Completed" severity="success" rendered="#{pharmacyBillSearch.bill.completed}" />
                        </div>

                        <!-- CENTER: navigation -->
                        <div class="d-flex gap-2">
                            <p:commandButton
                                id="btnBack"
                                title="Back to the previous list"
                                icon="fas fa-arrow-left"
                                ajax="false"
                                action="#{pharmacyBillSearch.navigateBackFromInwardPharmacyRequestReprint()}"
                                value="Back"
                                styleClass="ui-button-info ui-button-outlined"/>
                        </div>

                        <!-- RIGHT: actions, left=least important -> right=primary -->
                        <div class="d-flex gap-2 align-items-center">
                            <p:commandButton
                                id="btnMarkComplete"
                                title="Force this request to Completed status (allows discharge to proceed even if not fully issued)"
                                styleClass="ui-button-secondary"
                                icon="fas fa-check-double"
                                value="Mark as Complete"
                                disabled="#{not webUserController.hasPrivilege('PharmacyBhtRequestForceComplete') or pharmacyBillSearch.bill.completed or pharmacyBillSearch.bill.cancelled}"
                                onclick="return confirm('Mark this request as Complete? This allows discharge to proceed even if not all medicines have been issued.');"
                                action="#{pharmacyBillSearch.markInwardPharmacyRequestComplete()}"
                                ajax="false">
                            </p:commandButton>

                            <p:commandButton
                                id="btnCancelRequest"
                                title="Cancel this request"
                                styleClass="ui-button-secondary"
                                disabled="#{not webUserController.hasPrivilege('InwardPharmacyIssueRequestCancel') or (not empty pharmacyBillSearch.bill.listOfBill or pharmacyBillSearch.bill.cancelled or pharmacyBillSearch.bill.refunded)}"
                                icon="fas fa-cancel"
                                value="Cancel Request"
                                onclick="PF('confirmationDialog').show();"
                                >
                            </p:commandButton>

                            <p:commandButton
                                id="btnEditRequest"
                                title="Edit this request"
                                styleClass="ui-button-warning"
                                icon="fas fa-pen"
                                value="Edit Request"
                                disabled="#{configOptionApplicationController.getBooleanValueByKey('Disable Edit Button on Pharmacy Request Reprint',false) or (not empty pharmacyBillSearch.bill.listOfBill or pharmacyBillSearch.bill.cancelled or pharmacyBillSearch.bill.refunded)}"
                                action="#{pharmacyBillSearch.editInwardPharmacyRequestBill()}"
                                ajax="false">
                            </p:commandButton>

                            <p:commandButton
                                id="btnReprint"
                                title="Reprint this request"
                                styleClass="ui-button-success"
                                style="min-width:120px"
                                icon="fas fa-print"
                                value="Reprint"
                                ajax="false" >
                                <p:printer target="gpBillPreview" ></p:printer>
                            </p:commandButton>

                            <phprint:bht_issue_request_print_config_button/>
                        </div>

                    </div>

                    <p:dialog minHeight="100" width="800" header="Confirmation" widgetVar="confirmationDialog" modal="true" resizable="false">
                        <p>Are you sure you want to cancel the request?</p>
                        <p:inputText class="w-100"
                                     value="#{pharmacyBillSearch.comment}"
                                     placeholder="Please provide a comment for the cancel Request" />

                        <f:facet name="footer">
                            <p:commandButton
                                id="btnConfirmCancel"
                                class="mx-2 ui-button-warning"
                                ajax="false"
                                value="Yes"
                                action="#{pharmacyBillSearch.cancelInwardPharmacyRequestBill()}"
                                onclick="PF('confirmationDialog').hide();" />
                            <p:commandButton
                                id="btnDismissCancel"
                                value="No"
                                onclick="PF('confirmationDialog').hide();" />
                        </f:facet>
                    </p:dialog>



                </f:facet>
                <p:panel>
                    <div class="row">
                        <div class="col-4">
                            <p:panel header="Bill Details" style="height: 100%">
                                <h:panelGrid columns="3" class="w-100">
                                    <p:outputLabel value="Bill No" ></p:outputLabel>
                                    <p:outputLabel value=":" ></p:outputLabel>
                                    <p:outputLabel value="#{pharmacyBillSearch.bill.insId}" ></p:outputLabel>
                                    <p:outputLabel value="BHT No" ></p:outputLabel>
                                    <p:outputLabel value=":" ></p:outputLabel>
                                    <p:outputLabel value="#{pharmacyBillSearch.bill.patientEncounter.bhtNo}" ></p:outputLabel>
                                    <p:outputLabel value="Patient Name" ></p:outputLabel>
                                    <p:outputLabel value=":" ></p:outputLabel>
                                    <p:outputLabel value="#{pharmacyBillSearch.bill.patientEncounter.patient.person.nameWithTitle}" ></p:outputLabel>
                                    <p:outputLabel value="Date" ></p:outputLabel>
                                    <p:outputLabel value=":" ></p:outputLabel>
                                    <p:outputLabel value="#{pharmacyBillSearch.bill.createdAt}" ></p:outputLabel>
                                    <p:outputLabel value="Time" ></p:outputLabel>
                                    <p:outputLabel value=":" ></p:outputLabel>
                                    <p:outputLabel value="#{pharmacyBillSearch.bill.createdAt}" > 
                                        <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                    </p:outputLabel>
                                    <p:outputLabel value="Comments" ></p:outputLabel>
                                    <p:outputLabel value=":" ></p:outputLabel>
                                    <p:outputLabel value="#{pharmacyBillSearch.bill.comments}" >
                                    </p:outputLabel>
                                </h:panelGrid>
                            </p:panel>
                        </div>
                        <div class="col-8">
                            <p:panel header="Bill" style="height: 100%">
                                <h:panelGroup id="gpBillPreview">
                                    <phprint:bht_issue_request_receipt
                                        dto="#{pharmacyBillSearch.bhtIssueRequestPrintDto}"
                                        duplicate="true" />
                                </h:panelGroup>
                            </p:panel>
                        </div>
                    </div>



                    <p:panel header="Bill Item Details" class="mt-2">
                        <p:dataTable rowIndexVar="rowIndex" value="#{pharmacyBillSearch.bill.billItems}" var="bip" >
                            <p:column width="5em">
                                <f:facet name="header">No</f:facet>
                                <p:outputLabel value="#{rowIndex+1}" ></p:outputLabel>
                            </p:column>
                            <p:column>
                                <f:facet name="header">Item</f:facet>
                                <p:outputLabel value="#{bip.item.name}" ></p:outputLabel>
                            </p:column>
                            <p:column width="12em">
                                <f:facet name="header">Qty</f:facet>
                                <p:outputLabel value="#{-bip.pharmaceuticalBillItem.qty}" >
                                    <f:convertNumber pattern="#,##0" ></f:convertNumber>
                                </p:outputLabel>
                            </p:column>
                            <p:column>
                                <f:facet name="header">Direction</f:facet>
                                <!-- The prescription comment is already appended to descreption
                                     when the bill item is built, so it is not repeated here.
                                     (Reading bip.prescription directly would also auto-create a
                                     blank Prescription during rendering.) -->
                                <p:outputLabel value="#{bip.descreption}" ></p:outputLabel>
                            </p:column>
                        </p:dataTable>
                    </p:panel>
                </p:panel>
            </p:panel>


        </h:form>
    </ui:define>
</ui:composition>
