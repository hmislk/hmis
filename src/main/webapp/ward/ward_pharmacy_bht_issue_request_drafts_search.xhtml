<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/resources/template/template.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="content">
        <h:form>
            <p:panel style="height: 100vh" >
                <f:facet name="header">
                    <h:outputText styleClass="fas fa-file-invoice"/>
                    <p:outputLabel class="mx-4" value="Draft BHT Issue Requests" />
                </f:facet>
                <div class="row">
                    <div class="col-2">
                        <h:outputLabel value="From Date" class="my-1"/>
                        <p:datePicker
                            styleClass="dateTimePicker my-1"
                            id="fromDate"
                            value="#{searchController.fromDate}"
                            showTime="true"
                            showButtonBar="true"
                            timeInput="true"
                            class="w-100" inputStyleClass="w-100"
                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                        </p:datePicker>

                        <h:outputLabel value="To Date" class="my-1"/>
                        <p:datePicker
                            class="w-100"
                            inputStyleClass="w-100"
                            id="toDate"
                            value="#{searchController.toDate}"
                            showTime="true"
                            showButtonBar="true"
                            timeInput="true"
                            pattern="#{sessionController.applicationPreference.longDateTimeFormat}" >
                        </p:datePicker>

                        <p:commandButton
                            class="w-100 ui-button-warning my-1"
                            icon="fas fa-search"
                            id="btnSearch"
                            ajax="false"
                            value="Search"
                            action="#{searchController.createBhtRequestDraftsTable}"
                            actionListener="#{transferIssueForRequestsController.makeNull()}">
                        </p:commandButton>

                        <h:outputLabel value="Request No" class="my-1"/>
                        <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.billNo}" class="w-100"/>
                        <h:outputLabel value="BHT No" class="my-1"/>
                        <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.bhtNo}" class="w-100" />
                        <h:outputLabel value="MRN / PHN No" class="my-1" />
                        <p:inputText autocomplete="off" value="#{searchController.searchKeyword.number}" class="w-100"/>

                    </div>
                    <div class="col-10">
                        <div class="px-1">
                            <p:dataTable
                                id="dtDraftRequestsSearch"
                                widgetVar="wDtDraftRequestsSearch"
                                rowKey="#{p.id}"
                                value="#{searchController.bills}"
                                var="p"
                                rows="5"
                                paginator="true" paginatorPosition="bottom"
                                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                rowsPerPageTemplate="5,10,15,{ShowAll|'All'}"
                                >
                                <p:column headerText="Request No">
                                    <h:outputLabel value="#{p.deptId}"/>
                                </p:column>
                                <p:column headerText="Department For Request">
                                    <h:outputLabel value="#{p.toDepartment.name}"/>
                                </p:column>
                                <p:column headerText="Saved Date"  >

                                    <h:outputLabel value="#{p.createdAt}" >
                                        <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                    </h:outputLabel>
                                    <br/>
                                    <h:panelGroup rendered="#{p.cancelled}" >
                                        <h:outputLabel style="color: red;" value="Cancelled at " />
                                        <h:outputLabel style="color: red;" rendered="#{p.cancelled}"
                                                       value="#{p.cancelledBill.createdAt}" >
                                            <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.longDateTimeFormat}" />
                                        </h:outputLabel>
                                    </h:panelGroup>

                                </p:column>
                                <p:column headerText="Saved By" >
                                    <h:outputLabel value="#{p.creater.webUserPerson.name}" >
                                    </h:outputLabel>
                                    <br/>
                                    <h:panelGroup rendered="#{p.cancelled}" >
                                        <h:outputLabel style="color: red;" value="Cancelled By " />
                                        <h:outputLabel style="color: red;" rendered="#{p.cancelled}" value="#{p.cancelledBill.creater.webUserPerson.name}" >
                                        </h:outputLabel>
                                    </h:panelGroup>
                                </p:column>
                                <p:column>
                                    <p:commandButton
                                        id="btnEditDraft"
                                        title="Edit Draft #{p.deptId}"
                                        rendered="#{webUserController.hasPrivilege('InwardPharmacyIssueRequest')}"
                                        ajax="false"
                                        value="Edit Draft"
                                        icon="fa-solid fa-pen-to-square"
                                        action="#{pharmacyRequestForBhtController.loadDraftForEditing(p)}"
                                        class="ui-button-warning">
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </div>
                    </div>
                </div>
                <div  class="d-flex">

                    <h:panelGrid columns="1" >

                    </h:panelGrid>


                </div>



            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
