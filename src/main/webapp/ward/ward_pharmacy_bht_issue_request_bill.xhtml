<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:phi="http://xmlns.jcp.org/jsf/composite/pharmacy"
      xmlns:ph="http://xmlns.jcp.org/jsf/composite/pharmacy"
      xmlns:bill="http://xmlns.jcp.org/jsf/composite/inward"
      xmlns:phprint="http://xmlns.jcp.org/jsf/composite/pharmacy/print"
      xmlns:admcc="http://xmlns.jcp.org/jsf/composite/ezcomp/inpatient">

    <h:body>

        <ui:composition template="/resources/template/template.xhtml">

            <ui:define name="content">

                <h:form id="bill" >
                    <!-- btnCalcAdd/btnAddNoRx/btnProceed all live inside the h:panelGroup below,
                         which is hidden entirely once billPreview is true (settle/save actions set
                         billPreview=true without clearing patientEncounter/department - see
                         clearBill()/clearBillItem() in the controller). Within that panelGroup,
                         btnCalcAdd/btnAddNoRx only render once patient+department are both selected
                         (the "sale" panel); before that only the search panel (with btnProceed) is
                         rendered. Fall back to nullButtonBill in every state where none of those
                         targets exist, so PrimeFaces' client-side defaultCommand init doesn't throw
                         on a not-yet-rendered target (issue #23490). -->
                    <p:commandButton id="nullButtonBill" value="No Action" action="#" style="display: none;" ></p:commandButton>
                    <p:defaultCommand target="#{pharmacyRequestForBhtController.billPreview ? 'nullButtonBill' : (pharmacyRequestForBhtController.patientEncounter ne null and pharmacyRequestForBhtController.department ne null ? (configOptionApplicationController.getBooleanValueByKey('Enable Prescription Details for Pharmacy Requests', true) ? 'btnCalcAdd' : 'btnAddNoRx') : 'btnProceed')}" />
                    <h:panelGroup
                        rendered="#{!pharmacyRequestForBhtController.billPreview}"
                        style="width: fit-content;" >

                        <p:panel
                            rendered="#{pharmacyRequestForBhtController.department eq null or pharmacyRequestForBhtController.patientEncounter eq null}">
                            <f:facet name="header">
                                <div class="d-flex justify-content-between align-items-center w-100">

                                    <!-- LEFT: title -->
                                    <div class="d-flex align-items-center gap-2">
                                        <h:outputText styleClass="fa fa-hospital-user" />
                                        <h:outputText value="Start Pharmacy Request for Inpatients"/>
                                    </div>

                                    <!-- CENTER: entity-level navigation -->
                                    <div class="d-flex gap-2">
                                        <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardSearch')}">
                                            <p:commandButton
                                                id="btnInpatientDashboard"
                                                ajax="false"
                                                icon="fa-solid fa-address-card"
                                                styleClass="ui-button-info ui-button-outlined"
                                                value="Inpatient Dashboard"
                                                title="Open the inpatient dashboard"
                                                action="#{admissionController.navigateToAdmissionProfilePage}">
                                                <f:setPropertyActionListener
                                                    value="#{pharmacyRequestForBhtController.patientEncounter}"
                                                    target="#{admissionController.current}" >
                                                </f:setPropertyActionListener>
                                            </p:commandButton>
                                        </h:panelGroup>

                                        <h:panelGroup rendered="#{webUserController.hasPrivilege('NursingWorkBench')}">
                                            <p:commandButton
                                                id="btnNursingWorkBenchStart"
                                                value="Nursing WorkBench"
                                                title="Back to the nursing workbench"
                                                action="#{nursingWorkBenchController.navigateToBackNursingWorkBench()}"
                                                ajax="false"
                                                styleClass="ui-button-info ui-button-outlined"
                                                icon="fa fa-arrow-left">
                                            </p:commandButton>
                                        </h:panelGroup>
                                    </div>
                                </div>
                            </f:facet>

                            <div class="row d-flex gap-4 flex-wrap align-item-center justify-content-center">
                                <div class="d-flex flex-column mx-4 col-6">
                                    <div class="d-flex align-items-center my-1">
                                        <i class="fa-solid fa-hospital me-2 text-primary"></i>
                                        <h:outputLabel for="departmentId_input" style="font-weight: bold" value="Requesting Department"/>
                                    </div>

                                    <h:panelGroup id="recentPharmacies" layout="block"
                                                  rendered="#{not empty pharmacyRequestForBhtController.recentRequestedPharmacies}"
                                                  styleClass="d-flex flex-wrap gap-2 mb-2 mx-2">
                                        <p:outputLabel value="Recent:" styleClass="text-muted me-1 align-self-center" />
                                        <ui:repeat value="#{pharmacyRequestForBhtController.recentRequestedPharmacies}" var="recentPh">
                                            <p:commandButton id="btnRecentPharmacy"
                                                             value="#{recentPh.name}#{pharmacyRequestForBhtController.isDefaultRequestedPharmacy(recentPh) ? ' (Default)' : ''}"
                                                             icon="#{pharmacyRequestForBhtController.isDefaultRequestedPharmacy(recentPh) ? 'fa fa-star' : 'fa fa-clock-o'}"
                                                             title="#{pharmacyRequestForBhtController.isDefaultRequestedPharmacy(recentPh) ? 'Default pharmacy for this ward' : 'Recently requested pharmacy'}"
                                                             styleClass="#{pharmacyRequestForBhtController.isDefaultRequestedPharmacy(recentPh) ? 'ui-button-info ui-button-sm' : 'ui-button-info ui-button-outlined ui-button-sm'}"
                                                             disabled="#{pharmacyRequestForBhtController.department ne null}"
                                                             process="@this"
                                                             update="@form"
                                                             action="#{pharmacyRequestForBhtController.selectRequestedPharmacy(recentPh)}" />
                                        </ui:repeat>
                                    </h:panelGroup>

                                    <p:autoComplete
                                        id="departmentId"
                                        value="#{pharmacyRequestForBhtController.department}"
                                        class="col-12 mx-2 my-1"
                                        inputStyleClass="form-control"
                                        forceSelection="true"
                                        disabled="#{pharmacyRequestForBhtController.department ne null}"
                                        completeMethod="#{departmentController.completeDeptPharmacy}"
                                        var="vt"
                                        itemLabel="#{vt.name}"
                                        itemValue="#{vt}" >
                                        <p:ajax
                                            event="itemSelect"
                                            process="@this"
                                            update="@form" />
                                    </p:autoComplete>
                                </div>

                                <div class="d-flex flex-column col-6">

                                    <div class="d-flex align-items-center my-1">
                                        <i class="fa-solid fa-user me-2 text-primary"></i>
                                        <h:outputLabel style="font-weight: bold" value="Patient Name or BHT or PHN No"/>
                                    </div>

                                    <h:panelGroup rendered="#{pharmacyRequestForBhtController.department eq null}">
                                        <p:inputText disabled="true"
                                                     class="col-md-12 my-1"
                                                     inputStyleClass="form-control"
                                                     placeholder="Select a pharmacy department first" />
                                    </h:panelGroup>
                                    <h:panelGroup rendered="#{pharmacyRequestForBhtController.department ne null}">
                                    <admcc:admission_search
                                        widgetVar="aPt2"
                                        inputId="acPt2"
                                        value="#{pharmacyRequestForBhtController.patientEncounter}"
                                        completeMethod="#{admissionController.completePatient}"
                                        itemSelectUpdate="@form" />
                                    </h:panelGroup>
                                </div>



                                <style>
                                    .discharged-badge {
                                        background-color: #f44336;
                                        color: white;
                                        padding: 2px 8px;
                                        border-radius: 12px;
                                        font-size: 1em;
                                        font-weight: bold;
                                    }

                                    .not-discharged-badge {
                                        background-color: #2196F3;
                                        color: white;
                                        padding: 2px 8px;
                                        border-radius: 12px;
                                        font-size: 1em;
                                        font-weight: bold;
                                    }
                                </style>

                            </div>

                            <div class="my-3 d-flex flex-column justify-content-end">
                                <div class="col-12 d-flex align-item-center justify-content-center">
                                    <p:commandButton
                                        id="btnProceed"
                                        ajax="false"
                                        style="width: 250px"
                                        class="ui-button-success px-5"
                                        value="Proceed" >
                                    </p:commandButton>
                                </div>
                            </div>
                        </p:panel>

                        <p:panel
                            id="sale"
                            class="alignTop"
                            style="width: fit-content;"
                            rendered="#{pharmacyRequestForBhtController.patientEncounter ne null and pharmacyRequestForBhtController.department ne null}"
                            >
                            <f:facet name="header" >
                                <div class="d-flex justify-content-between align-items-center w-100">

                                    <!-- LEFT: title -->
                                    <div class="d-flex align-items-center gap-2">
                                        <h:outputText styleClass="fas fa-exclamation-circle" />
                                        <h:outputText value="BHT Issue Request for - " />
                                        <h:outputText value="#{pharmacyRequestForBhtController.department.name}" styleClass="fw-bold" />
                                    </div>

                                    <!-- CENTER: entity-level navigation -->
                                    <div class="d-flex gap-2">
                                        <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardSearch')}">
                                            <div class="d-flex gap-2">
                                                <p:commandButton
                                                    id="btnLookupPatient"
                                                    value="Lookup"
                                                    ajax="false"
                                                    icon="fa fa-search"
                                                    title="Search for a patient"
                                                    styleClass="ui-button-info ui-button-outlined"
                                                    action="#{patientController.navigateToSearchPatients()}">
                                                </p:commandButton>

                                                <p:commandButton
                                                    id="btnPatientProfile"
                                                    value="Profile"
                                                    ajax="false"
                                                    icon="fa fa-user"
                                                    title="Open the patient profile"
                                                    styleClass="ui-button-info ui-button-outlined"
                                                    action="#{patientController.navigateToOpdPatientProfile()}">
                                                    <f:setPropertyActionListener
                                                        value="#{pharmacyRequestForBhtController.patientEncounter.patient}"
                                                        target="#{patientController.current}" >
                                                    </f:setPropertyActionListener>
                                                </p:commandButton>

                                                <p:commandButton
                                                    id="btnInpatientDashboardMain"
                                                    ajax="false"
                                                    icon="fa-solid fa-address-card"
                                                    styleClass="ui-button-info ui-button-outlined"
                                                    value="Inpatient Dashboard"
                                                    title="Open the inpatient dashboard"
                                                    action="#{bhtSummeryController.navigateToInpatientProfile()}">
                                                </p:commandButton>
                                            </div>
                                        </h:panelGroup>

                                        <h:panelGroup rendered="#{webUserController.hasPrivilege('NursingWorkBench')}">
                                            <p:commandButton
                                                id="btnNursingWorkBenchMain"
                                                value="Nursing WorkBench"
                                                title="Back to the nursing workbench"
                                                action="#{nursingWorkBenchController.navigateToBackNursingWorkBench()}"
                                                ajax="false"
                                                styleClass="ui-button-info ui-button-outlined"
                                                icon="fa fa-arrow-left">
                                            </p:commandButton>
                                        </h:panelGroup>
                                    </div>

                                    <!-- RIGHT: actions, left=least important -> right=primary -->
                                    <div class="d-flex gap-2 align-items-center">
                                        <p:commandButton
                                            id="btnNewBill"
                                            accesskey="n"
                                            value="New Bill"
                                            ajax="false"
                                            icon="fas fa-file-invoice"
                                            title="Start a new BHT issue request"
                                            styleClass="ui-button-warning"
                                            action="pharmacy_bill_issue_bht?faces-redirect=true"
                                            actionListener="#{pharmacyRequestForBhtController.resetAll}"  >
                                        </p:commandButton>

                                        <p:commandButton
                                            id="btnSettleRequest"
                                            value="Settle Request"
                                            styleClass="ui-button-success"
                                            icon="fa fa-check"
                                            style="min-width:120px"
                                            ajax="false"
                                            title="Settle this BHT issue request"
                                            onclick="return confirm('Settle this BHT issue request?');"
                                            action="#{pharmacyRequestForBhtController.settleBhtRequest}"
                                            actionListener="#{pharmacyRequestForBhtController.calculateAllRates}"  >
                                        </p:commandButton>
                                    </div>
                                </div>
                            </f:facet>

                            <div class="row">
                                <div class="col-4">
                                    <p:panel id="gpDetail">
                                        <f:facet name="header" >
                                            <h:outputText styleClass="fa fa-user-circle" />
                                            <h:outputLabel value="Patient Details" class="mx-4"></h:outputLabel>
                                        </f:facet>
                                        <bill:bhtDetail admission="#{pharmacyRequestForBhtController.patientEncounter}"/>
                                    </p:panel>
                                    <p:panel class="w-100 my-2">
                                        <f:facet name="header">
                                            <h:outputText value="Comment" />
                                        </f:facet>
                                        <p:inputTextarea
                                            value="#{pharmacyRequestForBhtController.comment}"
                                            class="w-100" />
                                    </p:panel>
                                </div>

                                <div class="col-8">

                                    <h:panelGroup rendered="#{configOptionApplicationController.getBooleanValueByKey('Enable Prescription Details for Pharmacy Requests', true)}" >
                                        <p:panel>
                                            <f:facet name="header" >
                                                <h:outputText styleClass="fa-solid fa-circle-plus"  />
                                                <h:outputText value="Prescription" styleClass="mx-4"/>
                                                <p:commandButton
                                                    id="btnSave"
                                                    ajax="false"
                                                    value="Save Draft"
                                                    title="Save this request as a draft to resume later"
                                                    action="#{pharmacyRequestForBhtController.saveBhtIssueRequestFrompharmacy()}"
                                                    icon="pi pi-save"
                                                    class="ui-button-success"
                                                    style="float: right;">
                                                </p:commandButton>
                                            </f:facet>


                                            <div class="row mt-1">
                                                <div class="col-md-12 d-flex align-items-center gap-2 flex-wrap">
                                                    <h:outputText value="Show:" styleClass="me-1" />
                                                    <p:selectBooleanButton id="tglVtm"
                                                                           value="#{pharmacyRequestForBhtController.includeVtm}"
                                                                           onLabel="VTM" offLabel="VTM"
                                                                           onIcon="pi pi-check" offIcon="pi pi-times"
                                                                           styleClass="ui-button-sm">
                                                        <p:ajax process="@this" update="acMedicine" />
                                                    </p:selectBooleanButton>
                                                    <p:selectBooleanButton id="tglAtm"
                                                                           value="#{pharmacyRequestForBhtController.includeAtm}"
                                                                           onLabel="ATM" offLabel="ATM"
                                                                           onIcon="pi pi-check" offIcon="pi pi-times"
                                                                           styleClass="ui-button-sm">
                                                        <p:ajax process="@this" update="acMedicine" />
                                                    </p:selectBooleanButton>
                                                    <p:selectBooleanButton id="tglVmp"
                                                                           value="#{pharmacyRequestForBhtController.includeVmp}"
                                                                           onLabel="VMP" offLabel="VMP"
                                                                           onIcon="pi pi-check" offIcon="pi pi-times"
                                                                           styleClass="ui-button-sm">
                                                        <p:ajax process="@this" update="acMedicine" />
                                                    </p:selectBooleanButton>
                                                    <p:selectBooleanButton id="tglAmp"
                                                                           value="#{pharmacyRequestForBhtController.includeAmp}"
                                                                           onLabel="AMP" offLabel="AMP"
                                                                           onIcon="pi pi-check" offIcon="pi pi-times"
                                                                           styleClass="ui-button-sm">
                                                        <p:ajax process="@this" update="acMedicine" />
                                                    </p:selectBooleanButton>
                                                </div>
                                            </div>

                                            <div class="row mt-1">
                                                <div class="col-md-8">
                                                    <p:autoComplete
                                                        class= "w-100"
                                                        accesskey="i"
                                                        forceSelection="true"
                                                        id="acMedicine"
                                                        value="#{pharmacyRequestForBhtController.billItem.prescription.item}"
                                                        completeMethod="#{pharmacyRequestForBhtController.completePrescriptionMedicineWithTypeFilter}"
                                                        var="i"
                                                        inputStyleClass="form-control"
                                                        itemLabel="#{i.name}"
                                                        itemValue="#{i}"
                                                        maxResults="10"
                                                        >
                                                        <p:ajax event="focus" process="acMedicine" ></p:ajax>
                                                        <p:ajax event="query" process="acMedicine"></p:ajax>
                                                        <p:ajax event="itemSelect"
                                                                listener="#{pharmacyRequestForBhtController.handleMedicineSelect}"
                                                                update="focusQty doseUnitPanel" ></p:ajax>
                                                        <p:ajax event="itemSelect"
                                                                listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                update="acItem txtQty"
                                                                process="@this txtDose doseUnitPanel cmbFrequency txtDuration cmbDuration prescribedFrom prescribedTo" />
                                                    </p:autoComplete>
                                                </div>
                                            </div>

                                            <div class="row mt-1">
                                                <div class="col-md-2">
                                                    <p:outputLabel value="Dose" />
                                                    <p:inputText id="txtDose" value="#{pharmacyRequestForBhtController.billItem.prescription.dose}" class="w-100">
                                                        <p:ajax event="blur" 
                                                                listener="#{pharmacyRequestForBhtController.calculateToDateFromDuration}"
                                                                update="prescribedTo"
                                                                process="@this prescribedFrom txtDuration cmbDuration" />
                                                        <p:ajax event="keyup" 
                                                                listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                update="acItem txtQty"
                                                                process="acMedicine @this doseUnitPanel cmbFrequency txtDuration cmbDuration prescribedFrom prescribedTo" />
                                                    </p:inputText>
                                                </div>

                                                <div class="col-md-2">
                                                    <p:outputLabel value="Dose Unit" />
                                                    <h:panelGroup id="doseUnitPanel">
                                                        <!-- Show label for Amp/Vmp items (no user selection) -->
                                                        <h:outputText id="lblDose" 
                                                                      value="#{pharmacyRequestForBhtController.billItem.prescription.doseUnit.name}" 
                                                                      class="form-control d-block"
                                                                      style="background-color: #f8f9fa; border: 1px solid #ced4da; padding: 0.375rem 0.75rem;"
                                                                      rendered="#{pharmacyRequestForBhtController.billItem.prescription.item.class.simpleName eq 'Amp' or pharmacyRequestForBhtController.billItem.prescription.item.class.simpleName eq 'Vmp'}" />
                                                        <!-- Show dropdown for Vtm/Atm items (user can select) -->
                                                        <p:selectOneMenu id="cmbDose" 
                                                                         value="#{pharmacyRequestForBhtController.billItem.prescription.doseUnit}" 
                                                                         class="w-100"
                                                                         rendered="#{pharmacyRequestForBhtController.billItem.prescription.item.class.simpleName ne 'Amp' and pharmacyRequestForBhtController.billItem.prescription.item.class.simpleName ne 'Vmp'}">
                                                            <f:selectItem itemLabel="Select" />
                                                            <f:selectItems value="#{measurementUnitController.getDoseUnitsForMedicine(pharmacyRequestForBhtController.billItem.prescription.item)}" var="du" itemLabel="#{du.name}" itemValue="#{du}" />
                                                            <p:ajax event="change" 
                                                                    listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                    update="acItem txtQty"
                                                                    process="acMedicine txtDose doseUnitPanel cmbFrequency txtDuration cmbDuration prescribedFrom prescribedTo" />
                                                        </p:selectOneMenu>
                                                    </h:panelGroup>
                                                </div>

                                                <div class="col-md-2">
                                                    <p:outputLabel value="Frequency" />
                                                    <p:selectOneMenu id="cmbFrequency" value="#{pharmacyRequestForBhtController.billItem.prescription.frequencyUnit}" class="w-100">
                                                        <f:selectItem itemLabel="Select" />
                                                        <f:selectItems value="#{measurementUnitController.frequencyUnits}" var="du" itemLabel="#{du.name}" itemValue="#{du}" />
                                                        <p:ajax event="change" 
                                                                listener="#{pharmacyRequestForBhtController.calculateToDateFromDuration}"
                                                                update="prescribedTo"
                                                                process="@this prescribedFrom txtDuration cmbDuration" />
                                                        <p:ajax event="change" 
                                                                listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                update="acItem txtQty"
                                                                process="acMedicine txtDose doseUnitPanel @this txtDuration cmbDuration prescribedFrom prescribedTo" />
                                                    </p:selectOneMenu>
                                                </div>


                                                <div class="col-md-2">
                                                    <p:outputLabel value="Duration" />
                                                    <p:inputText id="txtDuration" value="#{pharmacyRequestForBhtController.billItem.prescription.duration}" class="w-100">
                                                        <p:ajax event="blur" 
                                                                listener="#{pharmacyRequestForBhtController.calculateToDateFromDuration}"
                                                                update="prescribedTo"
                                                                process="@this prescribedFrom cmbDuration" />
                                                        <p:ajax event="keyup" 
                                                                listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                update="acItem txtQty"
                                                                process="acMedicine txtDose doseUnitPanel cmbFrequency @this cmbDuration prescribedFrom prescribedTo" />
                                                    </p:inputText>
                                                </div>

                                                <div class="col-md-2">
                                                    <p:outputLabel value="Duration Unit" />
                                                    <p:selectOneMenu id="cmbDuration" value="#{pharmacyRequestForBhtController.billItem.prescription.durationUnit}" class="w-100">
                                                        <f:selectItem itemLabel="Select" />
                                                        <f:selectItems value="#{measurementUnitController.durationUnits}" var="du" itemLabel="#{du.name}" itemValue="#{du}" />
                                                        <p:ajax event="change" 
                                                                listener="#{pharmacyRequestForBhtController.calculateToDateFromDuration}"
                                                                update="prescribedTo"
                                                                process="@this prescribedFrom txtDuration" />
                                                        <p:ajax event="change" 
                                                                listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                update="acItem txtQty"
                                                                process="acMedicine txtDose doseUnitPanel cmbFrequency txtDuration @this prescribedFrom prescribedTo" />
                                                    </p:selectOneMenu>
                                                </div>
                                            </div>

                                            <div class="row mt-1">
                                                <div class="col-md-3">
                                                    <p:outputLabel value="Prescribed From" />
                                                    <p:calendar
                                                        id="prescribedFrom"
                                                        value="#{pharmacyRequestForBhtController.billItem.prescription.prescribedFrom}"
                                                        pattern="#{sessionController.applicationPreference.shortDateFormat}"
                                                        class="w-100"
                                                        inputStyleClass="form-control"
                                                        >
                                                        <p:ajax event="dateSelect" 
                                                                listener="#{pharmacyRequestForBhtController.calculateDurationFromDates}"
                                                                update="txtDuration prescribedTo"
                                                                process="@this prescribedTo txtDuration cmbDuration" />
                                                        <p:ajax event="dateSelect" 
                                                                listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                update="acItem txtQty"
                                                                process="acMedicine txtDose doseUnitPanel cmbFrequency txtDuration cmbDuration @this prescribedTo" />
                                                    </p:calendar>
                                                </div>
                                                <div class="col-md-3">
                                                    <p:outputLabel value="Prescribed To" />
                                                    <p:calendar
                                                        id="prescribedTo"
                                                        value="#{pharmacyRequestForBhtController.billItem.prescription.prescribedTo}"
                                                        pattern="#{sessionController.applicationPreference.shortDateFormat}"
                                                        class="w-100"
                                                        inputStyleClass="form-control"
                                                        >
                                                        <p:ajax event="dateSelect" 
                                                                listener="#{pharmacyRequestForBhtController.calculateDurationFromDates}"
                                                                update="txtDuration prescribedFrom"
                                                                process="@this prescribedFrom txtDuration cmbDuration" />
                                                        <p:ajax event="dateSelect" 
                                                                listener="#{pharmacyRequestForBhtController.calculateItemAndQuantityFromPrescription}"
                                                                update="acItem txtQty"
                                                                process="acMedicine txtDose doseUnitPanel cmbFrequency txtDuration cmbDuration prescribedFrom @this" />
                                                    </p:calendar>
                                                </div>
                                            </div>

                                            <div class="row mt-1">
                                                <div class="col-md-12">
                                                    <p:outputLabel value="Comment" />
                                                    <p:inputTextarea id="txtComments" value="#{pharmacyRequestForBhtController.billItem.prescription.comment}" class="w-100" />
                                                </div>
                                            </div>

                                            <div class="row mt-2">
                                                <div class="col-md-12 d-flex justify-content-end gap-2">
                                                    <!--
                                                        Case 1 — Generate but do NOT add. Recalculates the
                                                        dispense item + qty from the prescription and moves
                                                        focus to the Dispense item so the user can review /
                                                        adjust before adding.
                                                    -->
                                                    <p:commandButton
                                                        id="btnGenerate"
                                                        value="Generate"
                                                        icon="fa fa-calculator"
                                                        class="ui-button-secondary ui-button-outlined"
                                                        title="Calculate the dispense item and quantity from the prescription without adding it, so you can review and adjust"
                                                        action="#{pharmacyRequestForBhtController.generateDispenseFromPrescription}"
                                                        process="@this acMedicine txtDose doseUnitPanel cmbFrequency txtDuration cmbDuration prescribedFrom prescribedTo"
                                                        update="growl acItem txtQty focusItem" >
                                                    </p:commandButton>

                                                    <!--
                                                        Case 2 — Calculate & Add in one step. Recomputes item +
                                                        qty from the prescription, then adds. Aborts with a
                                                        message if the calculation cannot resolve an item/qty.
                                                        This is the p:defaultCommand target when prescription
                                                        details are enabled.
                                                    -->
                                                    <p:commandButton
                                                        accesskey="a"
                                                        id="btnCalcAdd"
                                                        value="Calculate &amp; Add"
                                                        icon="fa fa-plus"
                                                        class="ui-button-success"
                                                        title="Calculate the dispense item and quantity from the prescription and add it to the dispense request"
                                                        action="#{pharmacyRequestForBhtController.calculateAndAddBillItem}"
                                                        process="@this acMedicine acItem txtQty txtDose doseUnitPanel cmbFrequency txtDuration cmbDuration prescribedFrom prescribedTo txtComments txtDrugOrderComments"
                                                        update="growl :#{p:resolveFirstComponentWithId('tblBillItem',view).clientId} acMedicine acItem focusItem txtQty txtDose doseUnitPanel cmbFrequency txtDuration cmbDuration prescribedFrom prescribedTo txtComments txtDrugOrderComments"   >
                                                    </p:commandButton>
                                                </div>
                                            </div>

                                        </p:panel>
                                    </h:panelGroup>

                                    <p:panel class="mt-2">
                                        <f:facet name="header" >
                                            <div class="d-flex justify-content-between align-items-center w-100">
                                                <div class="d-flex align-items-center gap-2">
                                                    <h:outputText styleClass="fa-solid fa-circle-plus"  />
                                                    <h:outputText value="Dispense Request" styleClass="mx-2"/>
                                                </div>
                                                <!--
                                                    Case 3 — Add the current dispense line directly, skipping
                                                    the prescription. Always available; when prescription
                                                    details are disabled this is the only Add button and is the
                                                    p:defaultCommand target (hence the stable btnAddNoRx id).
                                                -->
                                                <p:commandButton
                                                    accesskey="d"
                                                    id="btnAddNoRx"
                                                    value="Add Dispense Only"
                                                    icon="fa fa-plus"
                                                    class="ui-button-info"
                                                    title="Add the item and quantity shown below directly to the dispense request, without prescription details"
                                                    action="#{pharmacyRequestForBhtController.addBillItem}"
                                                    process="@this acItem txtQty txtDrugOrderComments"
                                                    update="growl :#{p:resolveFirstComponentWithId('tblBillItem',view).clientId} acItem focusItem txtQty txtDrugOrderComments" >
                                                </p:commandButton>
                                            </div>
                                        </f:facet>

                                        <div class="row">
                                            <div class="col-md-8"><h:outputText value="Medicines/Devices" /></div>
                                            <div class="col-md-4"><h:outputText value="Quantity" /></div>
                                        </div>

                                        <p:growl id="growl" showDetail="false" life="5500" />

                                        <div class="row mt-1">
                                            <div class="col-md-8">
                                                <p:autoComplete
                                                    class= "w-100"
                                                    accesskey="i"
                                                    forceSelection="true"
                                                    id="acItem"
                                                    value="#{pharmacyRequestForBhtController.billItem.item}"
                                                    minQueryLength="3" queryDelay="300" completeMethod="#{itemController.completeAmpAndVmpItem}"
                                                    var="i"
                                                    inputStyleClass="form-control"
                                                    itemLabel="#{i.name}"
                                                    itemValue="#{i}"
                                                    maxResults="10"
                                                    >
                                                    <p:ajax event="focus" process="acItem" ></p:ajax>
                                                    <p:ajax event="query" process="acItem"></p:ajax>
                                                    <p:ajax event="itemSelect"
                                                            listener="#{pharmacyRequestForBhtController.handleSelect}"
                                                            update="focusQty" >
                                                    </p:ajax>
                                                </p:autoComplete>
                                            </div>
                                            <div class="col-md-4">
                                                <p:inputText
                                                    autocomplete="off"
                                                    accesskey="q"
                                                    id="txtQty"
                                                    class="w-100"
                                                    value="#{pharmacyRequestForBhtController.qty}">
                                                    <p:ajax event="keyup"  listener="#{pharmacyRequestForBhtController.calculateBillItemListner}" process="acItem txtQty"></p:ajax>
                                                    <p:ajax event="blur"  listener="#{pharmacyRequestForBhtController.calculateBillItemListner}" process="acItem txtQty"></p:ajax>
                                                </p:inputText>
                                            </div>

                                            <p:focus id="focusQty" for="txtQty" ></p:focus>
                                            <p:focus id="focusItem" for="acItem" ></p:focus>
                                        </div>

                                        <div class="row mt-1">
                                            <div class="col-md-12">
                                                <p:outputLabel value="Comment" />
                                                <p:inputTextarea id="txtDrugOrderComments" value="#{pharmacyRequestForBhtController.billItem.instructions}" class="w-100" />
                                            </div>
                                        </div>

                                    </p:panel>

                                    <p:panel header="Bill Items" id="pBis" class="mt-2">
                                        <p:dataTable id="tblBillItem" value="#{pharmacyRequestForBhtController.preBill.billItems}"
                                                     var="bi" rowIndexVar="s" editable="true" sortBy="#{bi.searialNo}" >
                                            <p:column headerText="Item" width="20em">
                                                <h:outputLabel value="#{bi.item.name}" >
                                                </h:outputLabel>
                                            </p:column>
                                            <p:column headerText="Quantity" width="5em">
                                                <p:inputText autocomplete="off" id="ipTblQty" value="#{bi.qty}" style="width:96%">
                                                    <p:ajax event="blur" process="@this"/>
                                                </p:inputText>
                                            </p:column>
                                            <p:column headerText="Directions" width="20em">
                                                <h:panelGroup layout="block">
                                                    <h:outputText value="#{bi.descreption}" style="color: red;" />
                                                    <!-- Guard with hasPrescription(): reading bi.prescription directly
                                                         auto-creates a Prescription during rendering and can persist blanks. -->
                                                    <h:panelGroup layout="block"
                                                                  rendered="#{bi.hasPrescription() and (bi.prescription.dose ne null or bi.prescription.frequencyUnit ne null or bi.prescription.duration ne null)}"
                                                                  style="font-size:0.85em;color:#555;margin-top:2px;">
                                                        <h:outputText rendered="#{bi.prescription.dose ne null}" value="Dose: #{bi.prescription.dose} #{bi.prescription.doseUnit.name}  " />
                                                        <h:outputText rendered="#{bi.prescription.frequencyUnit ne null}" value="Freq: #{bi.prescription.frequencyUnit.name}  " />
                                                        <h:outputText rendered="#{bi.prescription.duration ne null}" value="Duration: #{bi.prescription.duration} #{bi.prescription.durationUnit.name}" />
                                                    </h:panelGroup>
                                                </h:panelGroup>
                                            </p:column>
                                            <p:column headerText="Comment" width="15em">
                                                <h:outputText value="#{bi.instructions}" />
                                            </p:column>
                                            <p:column headerText="Edit" width="5em">
                                                <p:commandButton
                                                    id="btnEditBillItem"
                                                    icon="fa-solid fa-pen-to-square"
                                                    title="Edit / Substitute Item"
                                                    class="ui-button-warning"
                                                    action="#{pharmacyRequestForBhtController.prepareEditBillItem(bi)}"
                                                    process="@this"
                                                    update=":#{p:resolveFirstComponentWithId('editBillItemDlg',view).clientId}"
                                                    oncomplete="PF('editBillItemDialog').show();" >
                                                </p:commandButton>
                                            </p:column>
                                            <p:column headerText="Remove" width="5em">
                                                <p:commandButton
                                                    id="btnRemoveBillItem"
                                                    value="Remove"
                                                    icon="fa-solid fa-trash"
                                                    class="ui-button-danger"
                                                    action="#{pharmacyRequestForBhtController.removeBillItem(bi)}"
                                                    ajax="false"   >

                                                </p:commandButton>
                                            </p:column>

                                        </p:dataTable>

                                        <p:dialog
                                            id="editBillItemDlg"
                                            widgetVar="editBillItemDialog"
                                            header="Edit / Substitute Item"
                                            modal="true"
                                            width="40%"
                                            fitViewport="true">
                                            <h:panelGrid columns="2" cellpadding="6" styleClass="w-100"
                                                         rendered="#{pharmacyRequestForBhtController.billItemForEdit ne null}">
                                                <p:outputLabel value="Requested Item" />
                                                <h:outputText value="#{pharmacyRequestForBhtController.billItemForEdit.item.name}"
                                                              styleClass="fw-bold" />

                                                <p:outputLabel value="Substitute (same generic)" for="cmbSubstitute" />
                                                <p:selectOneMenu id="cmbSubstitute"
                                                                 value="#{pharmacyRequestForBhtController.selectedSubstituteAmp}"
                                                                 filter="true" filterMatchMode="contains"
                                                                 style="width:100%">
                                                    <f:selectItems value="#{pharmacyRequestForBhtController.substituteAmps}"
                                                                   var="sub" itemLabel="#{sub.name}" itemValue="#{sub}" />
                                                </p:selectOneMenu>

                                                <p:outputLabel value="Quantity" for="txtEditQty" />
                                                <!-- Bound to the detached editQty, not the live row, so a failed
                                                     save never leaves a bad quantity on the bill item. -->
                                                <p:inputText id="txtEditQty" autocomplete="off"
                                                             value="#{pharmacyRequestForBhtController.editQty}"
                                                             style="width:100%" />
                                            </h:panelGrid>

                                            <f:facet name="footer">
                                                <p:commandButton
                                                    id="btnSaveEditBillItem"
                                                    value="Save"
                                                    icon="fa fa-check"
                                                    class="ui-button-success"
                                                    action="#{pharmacyRequestForBhtController.saveEditedBillItem}"
                                                    process="@this cmbSubstitute txtEditQty"
                                                    update=":#{p:resolveFirstComponentWithId('tblBillItem',view).clientId} :#{p:resolveFirstComponentWithId('growl',view).clientId}"
                                                    oncomplete="if (args &amp;&amp; args.editSaved) { PF('editBillItemDialog').hide(); }" />
                                            </f:facet>
                                        </p:dialog>
                                    </p:panel>

                                </div>
                            </div>

                        </p:panel>

                    </h:panelGroup>
                </h:form>

                <h:form>
                    <p:panel id="printPanel"  rendered="#{pharmacyRequestForBhtController.billPreview}" >
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center w-100">

                                <!-- LEFT: title -->
                                <div class="d-flex align-items-center gap-2">
                                    <h:outputText styleClass="fa-solid fa-address-card fa-lg" />
                                    <h:outputText value="View Bill"/>
                                </div>

                                <!-- CENTER: entity-level navigation -->
                                <div class="d-flex gap-2">
                                    <h:panelGroup rendered="#{webUserController.hasPrivilege('InwardSearch')}">
                                        <div class="d-flex gap-2">
                                            <p:commandButton
                                                id="btnLookupPatientView"
                                                value="Lookup"
                                                ajax="false"
                                                icon="fa fa-search"
                                                title="Search for a patient"
                                                styleClass="ui-button-info ui-button-outlined"
                                                action="#{patientController.navigateToSearchPatients()}">
                                            </p:commandButton>

                                            <p:commandButton
                                                id="btnPatientProfileView"
                                                value="Patient Profile"
                                                ajax="false"
                                                icon="fa fa-user"
                                                title="Open the patient profile"
                                                styleClass="ui-button-info ui-button-outlined"
                                                action="#{patientController.navigateToOpdPatientProfile()}">
                                                <f:setPropertyActionListener
                                                    value="#{admissionController.current.patient}"
                                                    target="#{patientController.current}" >
                                                </f:setPropertyActionListener>
                                            </p:commandButton>

                                            <p:commandButton
                                                id="btnInpatientDashboardView"
                                                ajax="false"
                                                icon="fa-solid fa-address-card"
                                                styleClass="ui-button-info ui-button-outlined"
                                                value="Inpatient Dashboard"
                                                title="Open the inpatient dashboard"
                                                action="#{admissionController.navigateToAdmissionProfilePage}">
                                                <f:setPropertyActionListener
                                                    value="#{pharmacyRequestForBhtController.patientEncounter}"
                                                    target="#{admissionController.current}" >
                                                </f:setPropertyActionListener>
                                            </p:commandButton>
                                        </div>
                                    </h:panelGroup>

                                    <h:panelGroup rendered="#{webUserController.hasPrivilege('NursingWorkBench')}">
                                        <p:commandButton
                                            id="btnNursingWorkBenchView"
                                            value="Nursing WorkBench"
                                            title="Back to the nursing workbench"
                                            action="#{nursingWorkBenchController.navigateToBackNursingWorkBench()}"
                                            ajax="false"
                                            styleClass="ui-button-info ui-button-outlined"
                                            icon="fa fa-arrow-left">
                                        </p:commandButton>
                                    </h:panelGroup>
                                </div>

                                <!-- RIGHT: actions, left=least important -> right=primary -->
                                <div class="d-flex gap-2 align-items-center">
                                    <p:commandButton
                                        id="btnPrint"
                                        value="Print"
                                        ajax="false"
                                        title="Print this bill"
                                        styleClass="ui-button-info"
                                        icon="fa fa-print">
                                        <p:printer target="gpBillPreview" ></p:printer>
                                    </p:commandButton>

                                    <phprint:bht_issue_request_print_config_button/>

                                    <p:commandButton
                                        id="btnNewMedicineRequest"
                                        value="New Medicine Request for BHT"
                                        ajax="false"
                                        style="min-width:120px"
                                        title="Start a new medicine request for a BHT"
                                        styleClass="ui-button-success"
                                        action="pharmacy_bill_issue_request?faces-redirect=true"
                                        actionListener="#{pharmacyRequestForBhtController.resetAll()}"
                                        icon="fa fa-plus-circle">
                                    </p:commandButton>
                                </div>
                            </div>

                        </f:facet>

                        <h:panelGroup id="gpBillPreview">
                            <phprint:bht_issue_request_receipt
                                dto="#{pharmacyRequestForBhtController.bhtIssueRequestPrintDto}"
                                comment="#{pharmacyRequestForBhtController.comment}" />
                        </h:panelGroup>

                    </p:panel>

                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
