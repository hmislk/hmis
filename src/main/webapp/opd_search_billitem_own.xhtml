<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <p:panel  header="OPD Bill Item">
                        <div class="row">
                            <div class="col-md-2">

                                <h:outputLabel value="From Date"/>
                                <p:calendar 
                                    id="fromDate" 
                                    value="#{searchController.fromDate}" 
                                    navigator="false" 
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}" 
                                    class="w-100" 
                                    inputStyleClass="w-100"
                                    maxdate="#{sessionController.currentDate}"
                                    >      
                                </p:calendar>
                                <h:outputLabel value="To Date"/>
                                <p:calendar 
                                    id="toDate" 
                                    value="#{searchController.toDate}" 
                                    navigator="false"
                                    pattern="#{sessionController.applicationPreference.longDateTimeFormat}"
                                    class="w-100" 
                                    inputStyleClass="w-100"
                                    maxdate="#{sessionController.currentDate}"
                                    >                                                                              
                                </p:calendar>

                                <hr/>
                                <p:selectBooleanButton 
                                    onLabel="Logged Department Only" 
                                    offLabel="Any Department"
                                    value="#{searchController.showLoggedDepartmentOnly}"
                                    class="w-100">
                                </p:selectBooleanButton>
                                <hr/>

                                <p:commandButton
                                    id="btnSearch"
                                    class="my-1 w-100 ui-button-warning"
                                    icon="fas fa-search"
                                    ajax="false"
                                    value="Search"
                                    action="#{searchController.createLabBillItemSearchDtosByKeyword()}">
                                </p:commandButton>
                                
                                <p:commandButton 
                                    value="Excel" 
                                    class="my-1 w-100 ui-button-success" 
                                    icon="fas fa-file-excel" 
                                    ajax="false">
                                    <p:dataExporter type="xlsx" target="tblBills" fileName="Bill Item Report" />
                                </p:commandButton>



                                <h:outputLabel value="Bill No"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.billNo}" class="form-control"/>
                                <h:outputLabel value="Item Name"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.itemName}" class="form-control"/>
                                <h:outputLabel value="Patient Name"/>
                                <p:inputText autocomplete="off" value="#{searchController.searchKeyword.patientName}" class="form-control"/>
                                <h:outputLabel value="Patient Phone"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.patientPhone}" class="form-control"/>
                                <h:outputLabel value="To Institution Name"/>
                                <p:inputText autocomplete="off"  value="#{searchController.searchKeyword.toInstitution}" class="form-control"/>


                            </div>

                            <div class="col-md-10">
                                <p:dataTable
                                    rowIndexVar="i"
                                    id="tblBills"
                                    value="#{searchController.labBillItemSearchDtos}"
                                    var="pi"
                                    rows="10"
                                    paginatorPosition="bottom"
                                    paginator="true"
                                    class="w-100"
                                    paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                    rowsPerPageTemplate="5,10,15"
                                    >

                                    <p:column headerText="No" width="40px;" styleClass="alignTop">
                                        <h:outputLabel value="#{i+1}"/>
                                    </p:column>

                                    <p:column headerText="Bill No" styleClass="alignTop" sortBy="#{pi.deptId}" filterBy="#{pi.deptId}" filterMatchMode="contains">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true" value="#{pi.deptId}">
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Institution Name" styleClass="alignTop" sortBy="#{pi.toInstitutionName}" filterBy="#{pi.toInstitutionName}" filterMatchMode="contains">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true" value="#{pi.toInstitutionName}">
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Credit Company" styleClass="alignTop" sortBy="#{pi.creditCompanyName}" filterBy="#{pi.creditCompanyName}" filterMatchMode="contains">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true" value="#{pi.creditCompanyName}">
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Patient" styleClass="alignTop" sortBy="#{pi.patientNameWithTitle}" filterBy="#{pi.patientNameWithTitle}" filterMatchMode="contains">
                                        <h:commandLink value="#{pi.patientNameWithTitle}" action="#{patientController.navigateToOpdPatientEdit()}" rendered="#{webUserController.hasPrivilege('OpdBillSearchEdit') and pi.approvedAnyTest ne true}">
                                            <f:setPropertyActionListener value="#{searchController.findPatientById(pi.patientId)}" target="#{patientController.current}"/>
                                        </h:commandLink>
                                        <br/>
                                        <h:outputLabel value="#{pi.patientAgeAsString}" />
                                        <br/>
                                        <h:outputLabel value="#{pi.patientSex}" />
                                        <br/>
                                        <h:outputLabel value="#{pi.patientPhone}" />
                                    </p:column>

                                    <p:column headerText="Investigation or Service" styleClass="alignTop" sortBy="#{pi.itemName}" filterBy="#{pi.itemName}" filterMatchMode="contains">
                                        <h:outputLabel value="#{pi.itemName}" />
                                    </p:column>

                                    <p:column headerText="Billed At" sortBy="#{pi.billedAt}" filterBy="#{pi.billedAt}" filterMatchMode="equals">
                                        <h:outputLabel value="Billed at " />
                                        <h:outputLabel value="#{pi.billedAt}">
                                            <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateTimeFormat}" />
                                        </h:outputLabel>
                                        <br/>

                                        <h:panelGroup rendered="#{pi.cancelled}">
                                            <h:outputLabel style="color: red;" value="Cancelled at " />
                                            <h:outputLabel style="color: red;" rendered="#{pi.cancelled}" value="#{pi.cancelledAt}">
                                                <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateTimeFormat}" />
                                            </h:outputLabel>
                                        </h:panelGroup>
                                        <h:panelGroup rendered="#{pi.refunded}">
                                            <h:outputLabel style="color: red;" value="Refunded at " />
                                            <h:outputLabel style="color: red;" rendered="#{pi.refunded}" value="#{pi.refundedAt}">
                                                <f:convertDateTime timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortDateTimeFormat}" />
                                            </h:outputLabel>
                                        </h:panelGroup>
                                        <br/>
                                    </p:column>

                                    <p:column headerText="Billed By" sortBy="#{pi.billedByName}" filterBy="#{pi.billedByName}" filterMatchMode="contains">
                                        <h:outputLabel value="#{pi.billedByName}" />
                                        <br/>
                                        <h:panelGroup rendered="#{pi.cancelled}">
                                            <h:outputLabel style="color: red;" value="Cancelled By " />
                                            <h:outputLabel style="color: red;" rendered="#{pi.cancelled}" value="#{pi.cancelledByName}" />
                                        </h:panelGroup>
                                        <h:panelGroup rendered="#{pi.refunded}">
                                            <h:outputLabel style="color: red;" value="Refunded By " />
                                            <h:outputLabel style="color: red;" rendered="#{pi.refunded}" value="#{pi.refundedByName}" />
                                        </h:panelGroup>
                                    </p:column>

                                    <p:column headerText="Payment Method" sortBy="#{pi.paymentMethod}" filterBy="#{pi.paymentMethod}" filterMatchMode="contains">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true">
                                            <h:outputLabel value="#{pi.paymentMethod}" />
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Discount Scheme" sortBy="#{pi.paymentSchemeName}" filterBy="#{pi.paymentSchemeName}" filterMatchMode="contains">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true">
                                            <h:outputLabel value="#{pi.paymentSchemeName}" />
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Gross Value" sortBy="#{pi.grossValue}" filterBy="#{pi.grossValue}" filterMatchMode="gte">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true">
                                            <h:outputLabel value="#{pi.grossValue}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputLabel>
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Discount" sortBy="#{pi.discount}" filterBy="#{pi.discount}" filterMatchMode="gte">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true">
                                            <h:outputLabel value="#{pi.discount}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputLabel>
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Net Value" sortBy="#{pi.netValue}" filterBy="#{pi.netValue}" filterMatchMode="gte">
                                        <h:commandLink action="/opd/bill_reprint?faces-redirect=true">
                                            <h:outputLabel value="#{pi.netValue}">
                                                <f:convertNumber pattern="#,##0.00"/>
                                            </h:outputLabel>
                                            <f:setPropertyActionListener value="#{searchController.findBillById(pi.billId)}" target="#{billSearch.billSearch}"/>
                                        </h:commandLink>
                                    </p:column>

                                    <p:column headerText="Doctor" sortBy="#{pi.doctorNameWithTitle}" filterBy="#{pi.doctorNameWithTitle}" filterMatchMode="contains">
                                        <p:outputLabel value="#{pi.doctorNameWithTitle}" />
                                    </p:column>

                                </p:dataTable>

                            </div>
                        </div>                                                       
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
