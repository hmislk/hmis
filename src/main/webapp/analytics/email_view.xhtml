<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/analytics/index.xhtml">
            <ui:define name="report">
                <h:form>
                    <p:panel header="Sent Email Details">
                        <f:facet name="header">
                            <div class="d-flex justify-content-between align-items-center">
                                <h:outputText value="Sent Email Details" />
                                <div class="d-flex gap-2">
                                    <p:commandButton
                                        value="Back to Admission Sent Emails"
                                        icon="fa fa-arrow-left"
                                        ajax="false"
                                        rendered="#{emailController.patientEncounter ne null}"
                                        action="#{emailController.navigateToAdmissionSentEmails(emailController.patientEncounter)}"
                                        class="ui-button-secondary">
                                    </p:commandButton>
                                    <p:commandButton
                                        value="Back to All Emails"
                                        icon="fa fa-arrow-left"
                                        ajax="false"
                                        action="#{emailController.navigateToEmailList()}"
                                        class="ui-button-secondary">
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <h:panelGroup layout="block" rendered="#{emailController.selectedEmail ne null}">
                            <table style="border: none; border-collapse: collapse; width: 100%;">
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">Sent At</td>
                                    <td style="padding: 4px 0;">
                                        <h:outputText value="#{emailController.selectedEmail.createdAt}">
                                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm" />
                                        </h:outputText>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">Subject</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{emailController.selectedEmail.messageSubject}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">To</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{emailController.selectedEmail.receipientEmail}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">CC</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{emailController.selectedEmail.ccEmails}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">BCC</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{emailController.selectedEmail.bccEmails}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">Attachments</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{emailController.selectedEmail.attachmentNames}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">Created By</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{emailController.selectedEmail.creater.webUserPerson.name}" /></td>
                                </tr>
                                <tr>
                                    <td style="padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; font-weight: 600;">Status</td>
                                    <td style="padding: 4px 0;"><h:outputText value="#{emailController.selectedEmail.sentSuccessfully ? 'Sent' : (emailController.selectedEmail.pending ? 'Pending' : 'Failed')}" /></td>
                                </tr>
                            </table>

                            <p:panel header="Body" styleClass="mt-3">
                                <h:outputText value="#{emailController.selectedEmail.messageBody}" />
                            </p:panel>
                        </h:panelGroup>

                        <h:panelGroup layout="block" rendered="#{emailController.selectedEmail eq null}">
                            <p:messages/>
                            <h:outputText value="No email selected." />
                        </h:panelGroup>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
