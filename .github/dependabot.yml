# Dependabot configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Production runs on JDK 11 / Payara 5 (javax namespace). Major-version bumps frequently
# require Java 17+ or the jakarta.* namespace and have broken the whole application at
# runtime even when compilation passed, so they are ignored here and upgraded deliberately.
# The maven-enforcer "enforceBytecodeVersion" rule in pom.xml is the build-time backstop.

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    # No target-branch: development is the repo's default branch, and setting
    # target-branch would stop this entry's groups applying to security updates
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2.1.0 and later are compiled for Java 17 (class file 61); 2.0.x runs on JDK 11
      - dependency-name: "fr.opensagres.xdocreport*"
        versions: [">=2.1.0"]
      # Minor releases rename model classes (2.9.1: Legend -> LegendOptions), which
      # breaks the report controllers that build charts; upgrade deliberately
      - dependency-name: "software.xdev:chartjs-java-model"
        update-types: ["version-update:semver-minor"]
      # From 2.20, jackson-annotations is versioned "2.N" while core/databind stay "2.N.P",
      # so the shared ${jackson.version} in pom.xml cannot hold both; stay on 2.18.x
      # until pom.xml gives annotations its own version property
      - dependency-name: "com.fasterxml.jackson*"
        versions: [">=2.20"]
    groups:
      # All Jackson artifacts share ${jackson.version} in pom.xml and must move together
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      # Groups apply to version updates only by default; without this, each Jackson
      # artifact gets its own security-update PR with an identical pom.xml diff
      jackson-security:
        applies-to: security-updates
        patterns:
          - "com.fasterxml.jackson*"
