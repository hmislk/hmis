name: Single deploy PR sweep

# Sets the 'single-deploy-pr' commit status on each open PR to a deploy branch
# (<hospital>-production / <hospital>-staging): success on the oldest open PR
# per branch, failure on every newer one. It runs from development, so it
# covers deploy branches that do not carry single_deploy_pr_guard.yml yet.
#
# Triggers:
#  - workflow_run (requested): a deploy CI/CD workflow has just started, which
#    means the older PR merged. The newer PR's status clears within a minute.
#    GitHub has no globs here, so every deploy workflow is listed by its exact
#    name; add the name of a new deploy workflow to this list.
#  - schedule (15 minutes): fallback. GitHub can run schedules hours late.
#  - workflow_dispatch: manual fallback,
#    gh workflow run single_deploy_pr_sweep.yml --ref development
#
# A PR closed without merging starts no deploy, so that case relies on the
# guard's closed trigger (deploy branches that carry the guard) or the schedule.
# Security: workflow_run runs development's code with the repo token. Nothing
# from a deploy branch or a fork is checked out or executed.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows:
      - "asiripharmacy-production CI/CD"
      - "coop production CI/CD"
      - "coop staging CI/CD"
      - "digasiri-production CI/CD"
      - "ewc-production CI/CD"
      - "horizon-production CI/CD"
      - "mp-production CI/CD"
      - "mpold-production CI/CD"
      - "rh production CI/CD"
      - "rh-staging CI/CD"
      - "rmh-production CI/CD"
      - "rmh-staging CI/CD"
      - "roseth-production CI/CD"
      - "roseth-staging CI/CD"
      - "southernlanka-production CI/CD"
      - "southernlanka-staging CI/CD"
      - "suwani-production CI/CD"
      - "Ruhunu Local Staging Environment CI-CD Workflow"
    types: [requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: single-deploy-pr-sweep
  # A run reads the current state of all open PRs, so a newer run supersedes
  # an older one; cancelling avoids a queue when several deploys start together.
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set single-deploy-pr status on open deploy-branch PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_single_deploy_pr.py --sweep
