name: Entity migration guard

# Warns (never blocks) on a PR that adds an @Entity field (column) or entity (table) that no
# migration under src/main/resources/db/migrations/ creates and that is not in
# the baseline src/test/resources/entity-migration-baseline.txt. Production has
# no DDL generation, so a missing column breaks inserts and loads (see #26172).
# The check is the JUnit test EntityMigrationCoverageTest; it needs no database,
# secrets or network. Advisory only: the step has continue-on-error, so the job
# stays green and each gap shows as a ::warning annotation. Fix with a migration
# when the column must exist before first use; otherwise "Add Missing Fields"
# stays the practice.

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  entity-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Warn when a mapped table or column has no migration
        continue-on-error: true
        run: mvn -B -q test -Dtest=EntityMigrationCoverageTest -DfailIfNoTests=false -Dentity.migration.guard=true
