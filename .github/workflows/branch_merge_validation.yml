name: Branch Merge Validation

# Checks the head branch of a PR into a deploy branch
# (<hospital>-production / <hospital>-staging):
#   - rh-local-staging accepts only development.
#   - every other deploy branch accepts a *-hotfix branch or a QA-tested
#     home-qa* branch.
# Advisory: deploy branches have no required checks ("Deploy Branches Rules"
# ruleset), so a failure warns but does not block the merge.

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
    branches:
      - '*-production'
      - '*-staging'

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Merge Validation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Source branch: $HEAD_BRANCH"
          echo "Target branch: $BASE_BRANCH"
          SOURCE="$HEAD_BRANCH"
          TARGET="$BASE_BRANCH"

          if [[ "$TARGET" == "rh-local-staging" ]]; then
            if [[ "$SOURCE" != "development" ]]; then
              echo "❌ Only development can merge to $TARGET (rh-local-staging restriction)."
              exit 1
            fi
          elif [[ "$SOURCE" != *-hotfix && "$SOURCE" != home-qa* ]]; then
            echo "❌ Merging from $SOURCE to $TARGET is not allowed. A deploy branch accepts a branch ending in '-hotfix' (see the hotfix-deploy skill) or a QA-tested home-qa* branch."
            exit 1
          fi

          echo "✅ Merge is allowed."
