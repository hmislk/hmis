site_name: CareCode HMIS Documentation
site_description: Public documentation generated automatically from the GitHub Wiki.
site_url: https://hmislk.github.io/hmis/

repo_url: https://github.com/hmislk/hmis
repo_name: hmislk/hmis
edit_uri: https://github.com/hmislk/hmis/wiki/

docs_dir: docs

# ---------------------------------------------------------------------------
# Navigation — generated from the wiki's Wiki-Article-Index.md on every build
# by tools/generate-wiki-nav.py into mkdocs.generated.yml (INHERITs this file).
# Edit the menu by editing Wiki-Article-Index.md in the wiki, not here.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  language: en
  # No logo image ships with the wiki; use a Material icon and the theme's
  # default favicon.
  icon:
    logo: material/hospital-building
  custom_dir: overrides

  # Navigation
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

  # Colour palette — light & dark
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Font
  font:
    text: Roboto
    code: Roboto Mono

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
